description: >-
  A banned word in program syntax is left alone. A rule scoped to prose does
  not fire inside a markdown code span; no rule fires on a URL or a link
  target, or on a JSON key; and kapi fix never rewrites any of them.

  A rule that names no scope matches inside code on purpose, so a name written
  wrongly in a code sample is still found (core/check/termtext.go,
  PlaceholderText). Its finding in a code span fails, and kapi fix lists it as
  needing a rewrite rather than changing the command.
stages:
  # The voice file read as it is, before anything is in the terms store.
  - name: profile-file
    files:
      - path: docs/code.md
        check:
          args: [--profile-file, .kapi/voice.yaml]
          report:
            - {rule: terms.vocabulary, block: "code/p", quote: utilize, fails: true}
          absent:
            - quote: leverage
      - path: docs/links.md
        check:
          args: [--profile-file, .kapi/voice.yaml]
          failing: 0
          reporting: 0
  - name: imported
    steps:
      - kapi: [store, import]
    files:
      - path: docs/code.md
        check:
          report:
            # Unscoped: reported in the code span by design.
            - {rule: terms.vocabulary, block: "code/p", quote: utilize, fails: true}
          absent:
            - quote: leverage
        fix: {}
        context:
          names: ['use, not "utilize"', 'rely on, not "leverage"']
      - path: docs/links.md
        check:
          absent:
            - {block: "links/p", quote: utilize}
            - {block: "links/p#2", quote: utilize}
        fix: {}
      - path: i18n/en.json
        check:
          failing: 0
          reporting: 0
