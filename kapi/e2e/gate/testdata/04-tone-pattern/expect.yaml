description: >-
  A voice pattern rule (an em dash) reports or fails as its marking says, and
  kapi fix leaves a tone finding for a person to rewrite. A pattern with no
  marking reports, advisory: true keeps it reporting, and fails: true makes it
  fail a check and block the hook.
stages:
  - name: unmarked
    steps:
      - kapi: [store, import]
    files:
      - path: docs/guide.md
        check:
          failing: 0
          reporting: 1
          report:
            - {rule: voice.style, block: "guide/p", quote: "—", fails: false}
        fix: {}
        context:
          names: ["Voice: house.", Use a comma or a full stop]
    hook:
      blocks: false
  - name: advisory
    steps:
      - write:
          path: .kapi/voice.yaml
          content: |
            name: house
            style:
              prohibited_patterns:
                - regex: '—'
                  description: Use a comma or a full stop
                  advisory: true
      - kapi: [store, import]
    files:
      - path: docs/guide.md
        check:
          failing: 0
          reporting: 1
          report:
            - {rule: voice.style, block: "guide/p", quote: "—", fails: false}
        fix: {}
    hook:
      blocks: false
  - name: marked-fails
    steps:
      - write:
          path: .kapi/voice.yaml
          content: |
            name: house
            style:
              prohibited_patterns:
                - regex: '—'
                  description: Use a comma or a full stop
                  fails: true
      - kapi: [store, import]
    files:
      - path: docs/guide.md
        check:
          failing: 1
          report:
            - {rule: voice.style, block: "guide/p", quote: "—", fails: true}
    hook:
      blocks: true
      names:
        - FAILS [voice] docs/guide.md
        - "Prohibited pattern: Use a comma or a full stop"
