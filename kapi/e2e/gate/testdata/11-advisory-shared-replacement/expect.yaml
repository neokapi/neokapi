description: >-
  Two word rules that name the same replacement keep their own marking: the
  advisory one reports and the unmarked one fails.
stages:
  - name: imported
    steps:
      - kapi: [store, import]
    files:
      - path: docs/guide.md
        check:
          report:
            - {rule: terms.vocabulary, block: "guide/p", quote: leverage, fails: false}
            - {rule: terms.vocabulary, block: "guide/p#2", quote: utilize, fails: true}
        context:
          names: ['use, not "leverage"', 'use, not "utilize"']
    hook:
      blocks: true
      names:
        - Forbidden term "utilize" found
  - name: fixed
    files:
      - path: docs/guide.md
        fix:
          after: |
            # Guide

            We leverage the cache.

            We use the tool.
