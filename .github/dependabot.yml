version: 2

# Dependabot `cooldown` holds a freshly-published version back for N days before
# opening (or grouping) a PR for it. We apply it to every ecosystem as
# supply-chain hygiene — and, for npm specifically, so Dependabot stops opening
# PRs that CI rejects: `vp install` enforces a pnpm `minimumReleaseAge` gate
# (currently ~1 day), and an uncooled Dependabot would otherwise raise npm PRs
# minutes after a release (e.g. #1058) that fail with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. The 3-day window clears that gate with
# margin; majors wait a week. Tune the day counts to taste.
updates:
  # ── Framework Go modules (Apache-2.0) ──────────────────────────────────────
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, framework]
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, framework]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /kapi
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, framework]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/kapi-desktop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, framework]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
        versions: ["3.0.0-alpha.8.3"]

  # ── Bowrain Go modules (AGPL) ──────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /bowrain/core
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, bowrain]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /bowrain/plugin
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, bowrain]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /host/venue/schema
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, bowrain]
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /bowrain
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, go, bowrain]
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
        versions: ["3.0.0-alpha.8.3"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # ── npm (root workspace covers all frontend packages) ──────────────────────
  # cooldown here is load-bearing: it keeps Dependabot from opening npm PRs that
  # the pnpm minimumReleaseAge gate in `vp install` would immediately fail.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, npm]
    # Raised from 10 because the single group below became many. Each npm PR
    # touches the one workspace pnpm-lock.yaml, so concurrent npm PRs serially
    # conflict on it — dependabot-pnpm-relock.yml exists to absorb exactly that.
    open-pull-requests-limit: 15
    groups:
      # A single `update-types: [minor, patch]` group collapsed every npm update
      # into one PR — #1439 carried 38 packages and failed 11 checks across
      # builds, Frontend, both desktops and the l10n gate. A 38-package bump
      # failing six suites has several independent causes, none of which can be
      # isolated or reverted separately, and it re-conflicted on every merge to
      # main. Closed unmerged.
      #
      # These groups are keyed to families rather than sliced arbitrarily,
      # because several MUST move in lockstep — react/react-dom, storybook and
      # its addons, tailwind and its plugins, lexical and its react binding,
      # react-hook-form and its resolvers all break in a mixed state. Grouping
      # by family keeps each PR individually revertable without ever producing
      # a broken intermediate.
      #
      # Anything not matched here gets its own PR, which is the point.
      npm-react:
        patterns: ["react", "react-dom", "@vitejs/plugin-react", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      npm-storybook:
        patterns: ["storybook", "@storybook/*"]
        update-types: [minor, patch]
      npm-tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: [minor, patch]
      npm-radix-ui:
        patterns: ["radix-ui", "@radix-ui/*", "shadcn", "lucide-react"]
        update-types: [minor, patch]
      npm-tanstack:
        patterns: ["@tanstack/*"]
        update-types: [minor, patch]
      npm-lexical:
        patterns: ["lexical", "@lexical/*"]
        update-types: [minor, patch]
      npm-forms:
        patterns: ["react-hook-form", "@hookform/*"]
        update-types: [minor, patch]
      # Low risk, high count: a dozen font packages should never crowd out a
      # PR that needs reading.
      npm-fonts:
        patterns: ["@fontsource*"]
        update-types: [minor, patch]
      # react/react-dom types are excluded so they travel with npm-react.
      npm-types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      npm-toolchain:
        patterns: ["vite-plus", "@swc/*", "eslint", "@oxlint/*", "@playwright/test", "typescript"]
        update-types: [minor, patch]

  # ── Docker base images ─────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /bowrain/docker/bowrain-server
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, docker, bowrain]

  - package-ecosystem: docker
    directory: /bowrain/docker/bowrain-worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, docker, bowrain]

  - package-ecosystem: docker
    directory: /bowrain/docker/bowrain-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, docker, bowrain]
    ignore:
      # Track Node LTS for the web-builder stage; skip Current-line majors
      # until they reach LTS (e.g. Node 26 → LTS Oct 2026). See PR #584.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /bowrain/docker/keycloak
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, docker, bowrain]
