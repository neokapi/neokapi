# Findings in ghcr.io/neokapi/bowrain-keycloak that have no fix to take. The
# founder approved the five base-image entries on 2026-11-23, with an expiry;
# the guava entry joins them under that decision because no Keycloak release
# ships the fixed guava yet. Trivy honours
# `expired_at`: on that date an entry stops applying and the scan fails on the
# finding again. Renew one only after checking for a fix.
#
# container-scan.yml passes this file to the Keycloak image only, so the same
# identifier in any other image still fails its scan. Nothing else is ignored:
# no ignore-unfixed and no severity change.
