# Customer #1 dogfood sync — neokapi's own content → bowrain.cloud.
#
# INERT BY DEFAULT (roadmap epic 017-F, decision D2). Every job is gated on the
# repo variable DOGFOOD_SYNC_ENABLED == 'true', so until the founder activates
# it (see web/docs/contribute/notes-internal/dogfood-sync.md) this workflow is a
# no-op: scheduled runs and manual dispatches evaluate the gate and skip.
#
# Activation checklist:
#   1. Uncomment + fill the `server:` block in kapi.yaml (compound project URL).
#   2. Add repo secret  BOWRAIN_AUTH_TOKEN  (from `kapi auth token` after signup).
#   3. Set   repo variable  DOGFOOD_SYNC_ENABLED = true.
# Deactivate at any time by unsetting DOGFOOD_SYNC_ENABLED — fully reversible.

name: Dogfood Sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (kapi status + push --dry-run), move nothing"
        type: boolean
        default: false
      converge:
        description: "Also run kapi up (server AI convergence — burns credits). Off by default: the nightly job only transports content."
        type: boolean
        default: false

concurrency:
  group: dogfood-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # The single gate. No secret is referenced and no content moves unless the
    # founder has explicitly armed the dogfood by setting this repo variable.
    if: ${{ vars.DOGFOOD_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Real dogfood workflow: this is the ONE in-repo kapi invocation that binds
      # the root recipe (CLAUDE.md isolation contract) — so no KAPI_NO_PROJECT.
      BOWRAIN_AUTH_TOKEN: ${{ secrets.BOWRAIN_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build kapi + the kapi-bowrain plugin
        run: make build build-bowrain-plugin

      - name: Install the kapi-bowrain plugin for discovery
        # kapi discovers plugins from $KAPI_PLUGINS_DIR/<name>/{binary,manifest.json},
        # where <name> is the manifest's plugin name ("bowrain"). Stage the built
        # binary + its manifest under that layout and export the dir for the
        # subsequent steps (GITHUB_ENV persists it across steps).
        run: |
          PLUGDIR="$RUNNER_TEMP/kapi-plugins"
          mkdir -p "$PLUGDIR/bowrain"
          cp bin/kapi-bowrain "$PLUGDIR/bowrain/"
          cp bowrain/plugin/cmd/kapi-bowrain/manifest.json "$PLUGDIR/bowrain/"
          echo "KAPI_PLUGINS_DIR=$PLUGDIR" >> "$GITHUB_ENV"
          ./bin/kapi plugins list --plugins-dir "$PLUGDIR" || KAPI_PLUGINS_DIR="$PLUGDIR" ./bin/kapi plugins list

      - name: Guard — recipe must declare a server block
        run: |
          if ! grep -qE '^\s*server:' kapi.yaml; then
            echo "::error::DOGFOOD_SYNC_ENABLED is set but kapi.yaml has no active server: block. Uncomment it (see the recipe footer) before arming the sync." >&2
            exit 1
          fi

      - name: kapi status
        run: ./bin/kapi status

      # Default: transport only (kapi push). converge: manual in the recipe means
      # a push never auto-starts a server AI run, so the nightly job keeps content
      # synced without burning credits. Server AI convergence over the ~18.8k-block
      # corpus is opt-in (the `converge` dispatch input → kapi up) and should only
      # be run once the server TM is seeded and/or a BYO AI key is set.
      - name: kapi push (transport)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: ./bin/kapi push

      - name: kapi push --dry-run (plan)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: ./bin/kapi push --dry-run

      - name: kapi up (server convergence — opt-in, burns credits)
        if: ${{ github.event.inputs.converge == 'true' && github.event.inputs.dry_run != 'true' }}
        run: ./bin/kapi up

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dogfood sync"
            echo ""
            echo '```'
            ./bin/kapi status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
