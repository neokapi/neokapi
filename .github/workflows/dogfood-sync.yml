# Customer #1 dogfood: neokapi's own content, converged on bowrain.cloud.
#
# The workflow the product tells everyone else to write, run on the repository
# that builds it. It installs the CLI with setup-kapi, syncs the project's
# context, runs `kapi up` with kapi-action, syncs the recorded decisions back
# and opens a pull request with the content. A step a customer could not copy
# is a step the product is missing.
#
# Inert by default (epic 017-F, decision D2): every job is gated on the repo
# variable DOGFOOD_SYNC_ENABLED == 'true'. Arming it also needs the repo secret
# BOWRAIN_AUTH_TOKEN (a bwt_ workspace API token).

name: Dogfood Sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan only: report pending work, content-memory leverage and a token estimate, and change nothing"
        type: boolean
        default: false

concurrency:
  group: dogfood-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  converge:
    # The single gate. No secret is referenced and no content moves unless the
    # founder has explicitly armed the dogfood by setting this repo variable.
    if: ${{ vars.DOGFOOD_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # The delivery step below pushes what the loop brought home (approved
      # wording, fresh target catalogs) to a bot branch, never to the branch it
      # ran on, and opens the pull request that proposes it.
      contents: write
      pull-requests: write
    env:
      # The context remote reads the CI token only beside the server it names.
      BOWRAIN_SERVER_URL: https://app.bowrain.cloud
    steps:
      - uses: actions/checkout@v7

      # This is the ONE in-repo kapi invocation that binds the root recipe (the
      # isolation contract in CLAUDE.md), so nothing here sets KAPI_NO_PROJECT.
      # setup-kapi installs the released CLI and the bowrain plugin from the
      # registry, the same path a customer takes. Neither is built from this
      # checkout, so the run tests the product rather than the working tree.
      - name: Install kapi and the bowrain plugin
        uses: neokapi/setup-kapi@v1
        with:
          # The CLI and plugin are released together at one version; bump both
          # lines together. A pin keeps scheduled runs on a known pair and
          # reaches release candidates, which `latest` skips. The plugin's
          # version decides which push endpoints the run calls: one older than
          # `/push/init` and `/push/commit` posts to `/push/diff` and gets 404s.
          # The pair must also read the catalogs `make l10n-extract` writes; the
          # step after extraction stops the run when it cannot.
          version: 1.4.0-rc5
          plugins: bowrain@1.4.0-rc5
          auth-token: ${{ secrets.BOWRAIN_AUTH_TOKEN }}

      # The one thing kapi cannot do for itself. Five collections declare
      # i18n/**/*.kbf.json catalogs that the neokapi-i18n extractor produces
      # from React source; they are build artifacts, gitignored by design, so a
      # bare run from a clean checkout would carry nothing for them. Stage 1
      # only (source catalogs). The target side is the loop's job, and target
      # drift must never gate a push.
      - uses: ./.github/actions/setup-node-ui

      # Both build stages reach Go: extraction regenerates the two inventories
      # through `go generate`, and compilation builds the embedded gettext
      # catalogs from the committed JSON. Only the toolchain is set up here.
      #
      # Deliberately NOT setup-go-modules: it primes every module in the
      # workspace, and priming the ones these stages never touch writes hashes
      # into `go.work.sum`. The gate below reads the whole tree and refuses a
      # convergence run that changed a file outside the loop's scope, which is
      # exactly right: a run that delivers content must not also be the run
      # that edits the module graph.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Extract the source catalogs the loop carries
        run: make l10n-extract

      # The push declares every catalog the recipe covers, and the venue
      # deletes whatever the declaration leaves out. A kapi that cannot read a
      # catalog pushes it as empty. A release before KBF schema 2 does that with
      # a schema 2 catalog. The venue then drops its strings, translations and
      # approvals. `kapi inspect` exits non-zero on such a catalog, so the run
      # stops here until the pin names a release that reads them. The
      # directories are the extract surfaces of stage 1.
      - name: Refuse a kapi that cannot read the extracted catalogs
        run: |
          set -euo pipefail
          catalogs=()
          while IFS= read -r dir; do
            while IFS= read -r -d '' file; do
              catalogs+=("$file")
            done < <(find "$dir/i18n" -name '*.kbf.json' -print0)
          done < <(make -s l10n-extract-globs | cut -f1)
          if [ "${#catalogs[@]}" -eq 0 ]; then
            echo "::error title=No catalogs::make l10n-extract wrote no source catalog"
            exit 1
          fi
          if ! kapi inspect "${catalogs[@]}" > /dev/null; then
            echo "::error title=Catalogs unreadable::the installed kapi cannot read the catalogs this checkout extracts; bump the setup-kapi pin to a release that reads them"
            exit 1
          fi
          echo "The installed kapi reads all ${#catalogs[@]} extracted catalog(s)."

      # The context this repository governs its content by lives in the
      # workspace store, and a runner's store starts empty. The recipe keeps it
      # on the Bowrain project (`context: {backend: bowrain}`), so the run reads
      # it from there: the terms, the voice profiles, the wording already
      # approved and the record of who approved it. --no-push shares
      # nothing back, so this step only reads. Every gate and every retrieval
      # below answers from the store.
      - name: Read the project's context
        run: kapi context sync --no-push

      # `kapi up` is the whole loop: the recipe declares the languages, the flow
      # and the ship gates, and the run pushes, converges on the server against
      # the workspace's shared content memory and terms, and pulls the results
      # back. Parked work is normal pending work, so fail-on-parked stays off.
      - name: kapi up
        id: kapi
        uses: neokapi/kapi-action@v1
        with:
          command: up
          plan: ${{ inputs.plan || 'false' }}

      # The loop's return leg. `kapi up` pulls the server's ledger into the
      # project's decision ledger, and `kapi context sync` sends the operations
      # the run recorded to the Bowrain project, where the next run and every
      # checkout's `kapi context sync` read them. A sync that cannot reach the
      # server exits 5 and changes nothing, so the next run shares what this one
      # could not.
      - name: Push the decisions the run brought home
        id: record
        if: ${{ !inputs.plan }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/kapi-sync.log"
          kapi context sync | tee "$log"
          # A sync prints a "Pulled" line before its "Pushed" line; only the
          # latter counts what this run shared.
          pushed="$(sed -n 's/^Pushed \([0-9][0-9]*\) operation.*/\1/p' "$log")"
          # The count is also what the gate below takes as the decisions that
          # account for a removed artifact.
          echo "pushed=${pushed:-0}" >> "$GITHUB_OUTPUT"
          echo "note=\`kapi context sync\` shared ${pushed:-0} context operation(s) with Bowrain." >> "$GITHUB_OUTPUT"

      # Stage 3: compile the catalogs into what the products load (runtime
      # dictionaries, rendered emails, gettext MO). Without it the pull request
      # carries new wording while the products still ship the previous run's.
      # It runs after the return leg, so it compiles what the loop wrote, and
      # before the gate, which classifies its output as owned. A plan dispatch
      # writes nothing, so there is nothing to compile.
      - name: Compile the catalogs into what the products load
        if: ${{ !inputs.plan }}
        run: make l10n-compile

      # The gate below measures each app's target dictionary against that app's
      # qps dictionary, which is build output and absent from a fresh checkout.
      # The installed kapi writes it; nothing here commits it.
      - name: Generate the apps' qps dictionaries the gate reads
        run: make app-qps QPS_KAPI="$(command -v kapi)"

      # Deliver only what is sound. A defect delivered here comes back on every
      # regeneration: a lost placeholder, a translated scene id, a catalog that
      # no longer parses. With `--hold-back` the gate removes each defective
      # leaf, names it in the log, summary and pull request, and delivers the
      # rest; the target falls back to its source for that string. A defect
      # with no leaf to remove fails the job. Coverage is not checked. The
      # gate refuses a removed artifact when `--decisions`, the operations the
      # push step shared, is 0. It always runs and reads the tree itself.
      - name: Refuse derived content that must not be committed
        id: gate
        env:
          PUSHED: ${{ steps.record.outputs.pushed }}
        run: ./scripts/check-loop-output.sh --hold-back --decisions "${PUSHED:-0}"

      # Delivery is a pull request on one rolling bot branch, never a push to
      # main, so a person reads approved wording before it ships. A night with
      # nothing pending opens nothing. Only the artifacts the loop owns are
      # staged, the set the gate classifies as derived. It runs whatever the
      # action reported, because the compile step writes owned artifacts after
      # the action computed has-changes. The note reports what this run did:
      # the push step's count and the gate's count, nothing it cannot support.
      - name: Open a pull request with what the loop brought home
        if: ${{ !inputs.plan }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_NOTE: ${{ steps.record.outputs.note }}
          DERIVED: ${{ steps.gate.outputs.derived }}
          WITHHELD: ${{ steps.gate.outputs.withheld }}
          WITHHELD_DETAIL: ${{ steps.gate.outputs.withheld_detail }}
        run: |
          # Globbing off: the derived set carries git pathspec magic
          # (`:(glob)…`), which the shell must not expand against the tree.
          set -f
          # An unreadable derived set would deliver the context change and leave
          # every artifact it backs behind, green: the silent half-delivery this
          # whole sequence exists to prevent. The gate above refuses it first;
          # this refuses it again rather than trusting step order to hold.
          #
          # The same target the gate reads: every committed artifact the pipeline
          # owns, both the loop's target tier and the build tier, so the pull
          # request carries exactly what the gate classified.
          derived="$(make -s l10n-owned-paths)"
          if [ -z "${derived//[[:space:]]/}" ]; then
            echo "::error title=Delivery refused::the derived set is empty; refusing to deliver a partial tree"
            exit 1
          fi
          AUTO_PR_NOTE="\`kapi up\` converged this repository's content on bowrain.cloud. ${RECORD_NOTE} The content gate read ${DERIVED:-0} derived change(s) and found them sound."
          # What the gate withheld is named here rather than counted. A reviewer
          # deciding whether to merge the night needs to know which string each
          # surface is still missing and why it was refused, and the diff cannot
          # show a leaf that was never written.
          if [ "${WITHHELD:-0}" -gt 0 ]; then
            held="The gate held back ${WITHHELD} string(s) it may not deliver. Each was removed from the artifact it was written to, so that surface falls back to its source for that string until the translation is sound:"
            # shellcheck disable=SC2016  # the fences are markdown for the body
            AUTO_PR_NOTE="$(printf '%s\n\n%s\n\n```\n%s\n```' \
              "$AUTO_PR_NOTE" "$held" "$WITHHELD_DETAIL")"
          fi
          export AUTO_PR_NOTE
          # shellcheck disable=SC2086  # the derived set is a list of pathspecs
          ./scripts/auto-pr.sh bot/dogfood-sync \
            "chore(l10n): converged content from bowrain" -- \
            $derived
