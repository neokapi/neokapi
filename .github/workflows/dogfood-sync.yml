# Customer #1 dogfood — neokapi's own content, converged on bowrain.cloud.
#
# This is the workflow the product tells everyone else to write, run against the
# repository that builds the product: install the CLI with setup-kapi, read the
# committed context into the run's store, run the convergence verb with
# kapi-action, carry the run's decisions home, and open a pull request with what
# came back once the committed context explains it.
# Nothing in it is bespoke: a step here that a customer could not copy is a step
# the product is missing.
#
# INERT BY DEFAULT (roadmap epic 017-F, decision D2). Every job is gated on the
# repo variable DOGFOOD_SYNC_ENABLED == 'true', so until the founder arms it
# this workflow is a no-op: scheduled runs and manual dispatches evaluate the
# gate and skip.
#
# Arming it needs two settings that are not in this file:
#   * repo secret   BOWRAIN_AUTH_TOKEN     — a bwt_ workspace API token
#   * repo variable DOGFOOD_SYNC_ENABLED   — set to 'true'
# Unset the variable to disarm; no secret is read and no content moves.

name: Dogfood Sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan only: report pending work, content-memory leverage and a token estimate, and change nothing"
        type: boolean
        default: false

concurrency:
  group: dogfood-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  converge:
    # The single gate. No secret is referenced and no content moves unless the
    # founder has explicitly armed the dogfood by setting this repo variable.
    if: ${{ vars.DOGFOOD_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # The delivery step below pushes what the loop brought home (approved
      # wording, fresh target catalogs) to a bot branch, never to the branch it
      # ran on, and opens the pull request that proposes it.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # This is the ONE in-repo kapi invocation that binds the root recipe (the
      # isolation contract in CLAUDE.md), so nothing here sets KAPI_NO_PROJECT.
      # setup-kapi installs the released CLI and the bowrain plugin from the
      # registry — the same path a customer takes. Neither is built from this
      # checkout, so the run tests the product rather than the working tree.
      - name: Install kapi and the bowrain plugin
        uses: neokapi/setup-kapi@v1
        with:
          # The CLI and the plugin are cut at one version, so this pair is the
          # pair that was released together. A pin rather than `latest` keeps a
          # scheduled run on a known pair when a newer release lands, and a
          # release candidate is reachable from a pin alone: `latest` resolves
          # stable tags, and setup-kapi sends a plugin ref carrying a
          # prerelease suffix to the beta channel on its own.
          #
          # The plugin is the client of the push protocol, so the version here
          # decides which endpoints the run calls. The deployed server routes
          # `/push/init`, `/push/commit` and `GET /tree`; a plugin cut before
          # those routes existed posts to `/push/diff` and receives a 404 for
          # every file it sends. Bump both lines together whenever the push
          # protocol changes.
          version: 1.3.0-rc1
          plugins: bowrain@1.3.0-rc1
          auth-token: ${{ secrets.BOWRAIN_AUTH_TOKEN }}

      # The one thing kapi cannot do for itself. Five collections declare
      # i18n/**/*.kbf.json catalogs that the neokapi-i18n extractor produces
      # from React source; they are build artifacts, gitignored by design, so a
      # bare run from a clean checkout would carry nothing for them. Stage 1
      # only (source catalogs) — the target side is the loop's job, and target
      # drift must never gate a push.
      - uses: ./.github/actions/setup-node-ui

      # Both build stages reach Go: extraction regenerates the two inventories
      # through `go generate`, and compilation builds the embedded gettext
      # catalogs from the committed JSON. Only the toolchain is set up here.
      #
      # Deliberately NOT setup-go-modules: it primes every module in the
      # workspace, and priming the ones these stages never touch writes hashes
      # into `go.work.sum`. The gate below reads the whole tree and refuses a
      # convergence run that changed a file outside the loop's scope, which is
      # exactly right — a run that delivers content must not also be the run
      # that edits the module graph.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Extract the source catalogs the loop carries
        run: make l10n-extract

      # The context this repository governs its content by lives in the
      # workspace store, and a runner's store starts empty. This reads the
      # committed export under `.kapi/` into it: the terms, the voice profiles,
      # the wording already approved and the record of who approved it. Every
      # gate and every retrieval below answers from the store, so a run without
      # this step converges against a project that knows nothing.
      #
      # Reading those files puts them in force, which a person decides, so kapi
      # refuses an agent's import. The marker says who is running here: the
      # repository's own nightly, on its own checkout.
      #
      # A second run finds the store already holding what the files say.
      - name: Read the committed context into this run's store
        env:
          KAPI_ACTOR: person
        run: kapi context import

      # `kapi up` is the whole loop: the recipe declares the languages, the flow
      # and the ship gates, and the run pushes, converges on the server against
      # the workspace's shared content memory and terms, and pulls the results
      # back. Parked work is normal pending work, so fail-on-parked stays off.
      - name: kapi up
        id: kapi
        uses: neokapi/kapi-action@v1
        with:
          command: up
          plan: ${{ inputs.plan || 'false' }}

      # The loop's return leg. `kapi up` pulls the server's ledger into the
      # project's decision ledger, and `kapi context snapshot` writes what the
      # store holds back out as files. Without it the run's target artifacts are
      # wording no committed context explains, which is what the gate below
      # refuses: the approvals reached the tree and nothing carried them home.
      #
      # Recording a decision and writing the record out stay separate acts, so
      # `up` leaves this step to say what travels.
      #
      # A snapshot renders the whole store, and only the decision record travels
      # back into this repository. The committed export keeps a hand-authored
      # terms bundle and one content-memory bundle per surface, which a snapshot
      # would replace with its own serialization and one aggregate bundle beside
      # them. So the snapshot is written to RUNNER_TEMP and `state/` is the one
      # directory copied in. It is also the one part of `.kapi/` that nobody
      # edits by hand (see .kapi/README.md).
      #
      # The whole directory is replaced rather than merged, because the writer
      # prunes the shards a deleted document left behind. A store holding no
      # decisions at all writes no `state/`, and the committed record is left as
      # it is: an erasure of every approval this repository carries would
      # otherwise ride a run that read nothing.
      - name: Write the decisions the run brought home
        id: record
        if: ${{ !inputs.plan }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP, not the workspace: the gate below classifies everything
          # the run left in the tree and refuses a file the loop does not own.
          snapshot="$RUNNER_TEMP/kapi-context"
          log="$RUNNER_TEMP/kapi-snapshot.log"
          kapi context snapshot --out "$snapshot" | tee "$log"
          if [ -d "$snapshot/state" ]; then
            rm -rf .kapi/state
            cp -R "$snapshot/state" .kapi/state
          fi
          decisions="$(sed -n 's/.*, \([0-9][0-9]*\) recorded decision.*/\1/p' "$log")"
          if [ -n "$(git status --porcelain -- .kapi/state)" ]; then
            note="\`kapi context snapshot\` wrote the ${decisions:-0} decision(s) this run holds into \`.kapi/state/\`."
          else
            note="\`kapi context snapshot\` read ${decisions:-0} decision(s); \`.kapi/state/\` already held them."
          fi
          echo "note=$note" >> "$GITHUB_OUTPUT"

      # The pipeline's third stage, the other thing kapi cannot do for itself. A
      # catalog is not what a product loads: the SPAs and the landing page load
      # compiled runtime dictionaries, the transactional emails are rendered to
      # per-locale HTML the server embeds, and the Go binaries load gettext MO.
      # Delivering the catalogs alone leaves every surface compiled from them
      # behind until a human runs `make l10n`, so the wording reaches the
      # pull request and the product still ships the previous run's.
      #
      # It runs after the return leg, so it compiles what the loop materialized,
      # and before the gate, which classifies what it wrote: the compiled
      # dictionaries and the per-locale email renders are in `l10n-owned-paths`
      # alongside the catalogs they come from. A plan dispatch materializes
      # nothing, so there is nothing for it to compile.
      - name: Compile the catalogs into what the products load
        if: ${{ !inputs.plan }}
        run: make l10n-compile

      # Delivery is conditional on what the run wrote being sound. Every artifact
      # the loop owns is re-materialized on the next regeneration rather than
      # repaired, so a defect delivered here is a defect the next run reproduces:
      # a translation that lost the placeholder its sentence was built around, a
      # scene id translated into something the harness matches nothing by, a
      # catalog that no longer parses.
      #
      # `--hold-back` makes the gate answer that per leaf rather than per run.
      # A defective leaf is removed from the artifact and named in the log, the
      # job summary and the pull request; the target falls back to its source
      # for that string, which is the pending state this loop absorbs. The rest
      # of the night is delivered. A defect with no leaf to remove refuses the
      # run by name and this job goes red: an artifact that does not parse, a
      # narration sidecar that stopped overlaying its master, or a leaf whose
      # removal would empty the artifact.
      #
      # Coverage is not what it asks. A locale short of its source is the pending
      # state this loop absorbs, and a night that approved nothing is an ordinary
      # night — what the committed context did is reported beside the verdict,
      # not required for it. What a run *removed* still needs the context to
      # explain it: a removal carries no content to read.
      #
      # Runs unconditionally rather than behind has-changes, so the gate reads
      # the tree itself rather than the action's account of it. A clean tree
      # (a `plan` dispatch, or a run with nothing to catch up) passes.
      - name: Refuse derived content that must not be committed
        id: gate
        run: ./scripts/check-sync-backed.sh --hold-back

      # The action reports; delivery is this workflow's own step, and it is a
      # pull request rather than a push to main. Approved wording is content
      # someone decided, so a human reads the diff before it ships, the same way
      # the return leg above makes writing the record its own step.
      #
      # One rolling bot branch: an unmerged pull request is refreshed rather
      # than joined by a sibling, and a night with nothing pending pushes
      # nothing and opens nothing. Only the paths the loop owns are staged —
      # .kapi/ (the committed context) and the artifacts derived from it, the
      # same two sets the gate above classifies.
      #
      # Runs whatever the action reported, for the gate's reason: the return leg
      # can move .kapi/ on a run that produced no derived change at all, and
      # has-changes was computed before it ran.
      #
      # The note reports what this run produced rather than what a run of this
      # shape does: the return leg's own account of what it wrote, and the
      # gate's count of what it classified. A reviewer reads the note as
      # the summary of the run, so a sentence it cannot support is a sentence
      # that misreads the diff for them.
      - name: Open a pull request with what the loop brought home
        if: ${{ !inputs.plan }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_NOTE: ${{ steps.record.outputs.note }}
          DERIVED: ${{ steps.gate.outputs.derived }}
          BACKING: ${{ steps.gate.outputs.backing }}
          DECISIONS: ${{ steps.gate.outputs.decisions }}
          WITHHELD: ${{ steps.gate.outputs.withheld }}
          WITHHELD_DETAIL: ${{ steps.gate.outputs.withheld_detail }}
        run: |
          # Globbing off: the derived set carries git pathspec magic
          # (`:(glob)…`), which the shell must not expand against the tree.
          set -f
          # An unreadable derived set would deliver the context change and leave
          # every artifact it backs behind, green — the silent half-delivery this
          # whole sequence exists to prevent. The gate above refuses it first;
          # this refuses it again rather than trusting step order to hold.
          #
          # The same target the gate reads: every committed artifact the pipeline
          # owns, both the loop's target tier and the build tier, so the pull
          # request carries exactly what the gate classified.
          derived="$(make -s l10n-owned-paths)"
          if [ -z "${derived//[[:space:]]/}" ]; then
            echo "::error title=Delivery refused::the derived set is empty — refusing to deliver a partial tree"
            exit 1
          fi
          AUTO_PR_NOTE="\`kapi up\` converged this repository's content on bowrain.cloud. ${RECORD_NOTE} The content gate read ${DERIVED:-0} derived change(s) and found them sound; \`.kapi/\` moved in ${BACKING:-0} file(s), ${DECISIONS:-0} of which carry a decision rather than a re-serialization."
          # What the gate withheld is named here rather than counted. A reviewer
          # deciding whether to merge the night needs to know which string each
          # surface is still missing and why it was refused, and the diff cannot
          # show a leaf that was never written.
          if [ "${WITHHELD:-0}" -gt 0 ]; then
            held="The gate held back ${WITHHELD} string(s) it may not deliver. Each was removed from the artifact it was written to, so that surface falls back to its source for that string until the translation is sound:"
            # shellcheck disable=SC2016  # the fences are markdown for the body
            AUTO_PR_NOTE="$(printf '%s\n\n%s\n\n```\n%s\n```' \
              "$AUTO_PR_NOTE" "$held" "$WITHHELD_DETAIL")"
          fi
          export AUTO_PR_NOTE
          # shellcheck disable=SC2086  # the derived set is a list of pathspecs
          ./scripts/auto-pr.sh bot/dogfood-sync \
            "chore(l10n): converged content from bowrain" -- \
            .kapi ':(exclude).kapi/work' $derived
