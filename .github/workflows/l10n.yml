name: l10n

# The one place the build-derived multilingual artifacts are regenerated in CI.
# No other workflow may run a subset of `make l10n-build`: subsets do not add up
# to the whole, and a surface covered by none of them goes stale unnoticed.
#
# What it asserts: every committed BUILD-DERIVED artifact is exactly what the
# current source produces — the two generated inventories, the English email
# renders, and the whole qps probe tier. That is a generated-vs-source gate.
#
# What it deliberately does not touch: the target-language tier. `kapi up`
# writes that out of the project store, which holds the union of what git
# carries and what a venue pull brought home, so no checkout can be asked to
# reproduce it — a job that regenerated and committed it would overwrite
# approved wording with whatever the committed seeds happen to hold, green every
# time and silent. The walk this runs has no convergence in it. The target tier's
# standing is reported instead, below, and gated by nothing: an English change
# that leaves nb behind is pending work, not a build break (CLAUDE.md,
# "Target-language drift must never block the build").
#
# On a same-repo pull request the drift is committed back rather than failed:
# regeneration is deterministic, so asking a human to run `make l10n-build` and
# push is asking them to be a build step. Fork PRs and pushes to main keep the
# strict gate. See scripts/l10n-autofix.sh.

on:
  push:
    branches: [main]
    paths:
      # Sources the extractors read.
      - "apps/kapi-desktop/frontend/src/**"
      - "packages/ui/src/**"
      - "packages/flow-editor/src/**"
      - "packages/status-views/src/**"
      - "bowrain/packages/app/src/**"
      - "bowrain/packages/ui/src/**"
      - "bowrain/apps/web/src/**"
      - "bowrain/apps/bowrain/frontend/src/**"
      - "bowrain/apps/ctrl/src/**"
      - "bowrain/apps/pulse/src/**"
      - "bowrain/emails/src/**"
      - "bowrain/web/landing/src/**"
      - "bowrain/mailer/subjects/en.json"
      # Go sources behind the two generated inventories (tool/format metadata
      # and the cobra command tree).
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "cli/**/*.go"
      - "host/i18n/**"
      # The committed catalogs, for the qps sibling that lives beside them.
      - "core/i18n/catalogs/**"
      # The extractor and compiler themselves.
      - "packages/i18n-react/**"
      - "packages/kapi-format/**"
      - "pnpm-lock.yaml"
      # The gate's own machinery.
      - "Makefile"
      - "scripts/l10n-autofix.sh"
      - "scripts/l10n-loop-report.mjs"
      - ".github/workflows/l10n.yml"
  pull_request:
    # GitHub Actions does not expand YAML anchors, so this list is duplicated
    # rather than aliased. Keep the two in step.
    paths:
      # Sources the extractors read.
      - "apps/kapi-desktop/frontend/src/**"
      - "packages/ui/src/**"
      - "packages/flow-editor/src/**"
      - "packages/status-views/src/**"
      - "bowrain/packages/app/src/**"
      - "bowrain/packages/ui/src/**"
      - "bowrain/apps/web/src/**"
      - "bowrain/apps/bowrain/frontend/src/**"
      - "bowrain/apps/ctrl/src/**"
      - "bowrain/apps/pulse/src/**"
      - "bowrain/emails/src/**"
      - "bowrain/web/landing/src/**"
      - "bowrain/mailer/subjects/en.json"
      # Go sources behind the two generated inventories (tool/format metadata
      # and the cobra command tree).
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "cli/**/*.go"
      - "host/i18n/**"
      # The committed catalogs, for the qps sibling that lives beside them.
      - "core/i18n/catalogs/**"
      # The extractor and compiler themselves.
      - "packages/i18n-react/**"
      - "packages/kapi-format/**"
      - "pnpm-lock.yaml"
      # The gate's own machinery.
      - "Makefile"
      - "scripts/l10n-autofix.sh"
      - "scripts/l10n-loop-report.mjs"
      - ".github/workflows/l10n.yml"

# Never cancel a push to main; supersede stale PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalogs:
    name: Build-derived artifacts are fresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write is what lets the auto-fix push the regenerated artifacts
    # back to a same-repo PR branch. It is scoped to this job, which runs no
    # project code beyond the extractors and kapi itself; a job that also runs
    # `vp install` or a test suite over PR content must not hold this token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Same-repo PRs check out the PR head branch (not the ephemeral merge
          # ref) so the auto-fix can commit and push to it. Fork PRs and pushes
          # keep the default checkout ('' = unset).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}

      # Extraction and compilation are node (the neokapi-i18n extractor and
      # compiler); the qps probe is kapi, which links SQLite with FTS5 and
      # therefore needs libicu at build time.
      - uses: ./.github/actions/setup-node-ui

      - uses: ./.github/actions/setup-go-modules

      - name: Install libicu (kapi fts5 build dependency)
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Regenerate the build-derived artifacts (auto-fix on same-repo PRs)
        env:
          AUTOFIX_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          AUTOFIX_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: bash scripts/l10n-autofix.sh

      # Standing, never gating. Coverage and placeholder parity over the tier
      # the loop owns; low numbers are pending work by design, so this step
      # reports and cannot fail the job.
      #
      # The soundness reading rides along, because it is the one number here a
      # human should act on: coverage below a bar is pending work, and an
      # artifact that translated a machine identifier or dropped a placeholder is
      # a defect already committed. It gates on the return leg
      # (scripts/check-sync-backed.sh), never on a pull request — a source change
      # must not fail because a target has not caught up with it.
      - name: Target-language standing (informational — never gates)
        if: always()
        run: |
          {
            echo "## Multilingual standing"
            echo ""
            make -s l10n-report || true
            make -s l10n-content-check || true
          } >> "$GITHUB_STEP_SUMMARY"
