name: l10n

# The one place CI regenerates the build-derived multilingual artifacts
# (`make l10n-build`). It asserts that every committed BUILD-DERIVED artifact
# matches the current source. The app qps dictionaries are build output
# (`make app-qps`). The target-language tier, written by `kapi up`, is reported
# below and gates nothing.
#
# On a same-repo pull request, drift is committed back as a bot commit, which
# GitHub runs no checks on: the pull request then needs a close and reopen, or
# another push. `make pre-push` runs `make l10n-verify` to catch drift first.
# See scripts/l10n-autofix.sh and docs/internals/l10n-ci.md.

on:
  push:
    branches: [main]
    paths:
      # Sources the extractors read.
      - "apps/kapi-desktop/frontend/src/**"
      - "packages/ui/src/**"
      - "packages/flow-editor/src/**"
      - "packages/status-views/src/**"
      - "packages/project-screens/src/**"
      - "bowrain/packages/app/src/**"
      - "bowrain/packages/ui/src/**"
      - "bowrain/apps/web/src/**"
      - "bowrain/apps/bowrain/frontend/src/**"
      - "bowrain/apps/ctrl/src/**"
      - "bowrain/apps/pulse/src/**"
      - "bowrain/emails/src/**"
      - "bowrain/web/landing/src/**"
      - "bowrain/mailer/subjects/en.json"
      # Go sources behind the two generated inventories (tool/format metadata
      # and the cobra command tree).
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "cli/**/*.go"
      - "host/i18n/**"
      # The committed catalogs, for the qps sibling that lives beside them.
      - "core/i18n/catalogs/**"
      # The reference dataset's qps variant is compiled from the catalogs.
      - "scripts/gen-refs/**"
      - "packages/reference-data/data/**"
      # The extractor and compiler themselves.
      - "packages/i18n-react/**"
      - "packages/kapi-format/**"
      - "pnpm-lock.yaml"
      # The gate's own machinery.
      - "Makefile"
      - "scripts/l10n-autofix.sh"
      - "scripts/l10n-loop-report.mjs"
      - "scripts/check-extract-warnings.mjs"
      - "scripts/extract-warnings-baseline.json"
      - "scripts/check-em-dashes.sh"
      - "scripts/emdashcheck/**"
      - ".github/workflows/l10n.yml"
  pull_request:
    # GitHub Actions does not expand YAML anchors, so this list is duplicated
    # rather than aliased. Keep the two in step.
    paths:
      # Sources the extractors read.
      - "apps/kapi-desktop/frontend/src/**"
      - "packages/ui/src/**"
      - "packages/flow-editor/src/**"
      - "packages/status-views/src/**"
      - "packages/project-screens/src/**"
      - "bowrain/packages/app/src/**"
      - "bowrain/packages/ui/src/**"
      - "bowrain/apps/web/src/**"
      - "bowrain/apps/bowrain/frontend/src/**"
      - "bowrain/apps/ctrl/src/**"
      - "bowrain/apps/pulse/src/**"
      - "bowrain/emails/src/**"
      - "bowrain/web/landing/src/**"
      - "bowrain/mailer/subjects/en.json"
      # Go sources behind the two generated inventories (tool/format metadata
      # and the cobra command tree).
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "cli/**/*.go"
      - "host/i18n/**"
      # The committed catalogs, for the qps sibling that lives beside them.
      - "core/i18n/catalogs/**"
      # The reference dataset's qps variant is compiled from the catalogs.
      - "scripts/gen-refs/**"
      - "packages/reference-data/data/**"
      # The extractor and compiler themselves.
      - "packages/i18n-react/**"
      - "packages/kapi-format/**"
      - "pnpm-lock.yaml"
      # The gate's own machinery.
      - "Makefile"
      - "scripts/l10n-autofix.sh"
      - "scripts/l10n-loop-report.mjs"
      - "scripts/check-extract-warnings.mjs"
      - "scripts/extract-warnings-baseline.json"
      - "scripts/check-em-dashes.sh"
      - "scripts/emdashcheck/**"
      - ".github/workflows/l10n.yml"

# Never cancel a push to main; supersede stale PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalogs:
    name: Build-derived artifacts are fresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write is what lets the auto-fix push the regenerated artifacts
    # back to a same-repo PR branch. It is scoped to this job, which runs no
    # project code beyond the extractors and kapi itself; a job that also runs
    # `vp install` or a test suite over PR content must not hold this token.
    permissions:
      contents: write
    env:
      HAS_BOT_APP: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      # A push or pull request made with the bot App's token starts the
      # pull request's workflows; one made with GITHUB_TOKEN starts none, or
      # waits for a person to approve them. Without the App, GITHUB_TOKEN.
      # See docs/internals/bot-pushes.md.
      - name: Mint the bot App token
        id: bot
        if: env.HAS_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.bot.outputs.token || github.token }}
          # Same-repo PRs check out the PR head branch (not the ephemeral merge
          # ref) so the auto-fix can commit and push to it. Fork PRs and pushes
          # keep the default checkout ('' = unset).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}

      # Extraction and compilation are node (the neokapi-i18n extractor and
      # compiler); the qps probe is kapi, which links SQLite with FTS5 and
      # therefore needs libicu at build time.
      - uses: ./.github/actions/setup-node-ui

      - uses: ./.github/actions/setup-go-modules

      - name: Install libicu (kapi fts5 build dependency)
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Regenerate the build-derived artifacts (auto-fix on same-repo PRs)
        env:
          AUTOFIX_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          AUTOFIX_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: bash scripts/l10n-autofix.sh

      # The extract above recorded every surface's warnings. A warning the
      # committed baseline does not hold fails here, and the recorded ones do
      # not, so existing debt never blocks a pull request.
      - name: "Guard: no extractor warning beyond the committed baseline"
        run: make l10n-extract-warnings-check

      # The extract has just run, so every surface's source catalog exists and
      # --require-extracted can insist on it. This is the only job that can ask
      # the question: the catalogs are gitignored build artefacts, so no other
      # workflow (and no fresh clone) has them on disk.
      - name: "Guard: no em dash in the English source of any catalog"
        run: ./scripts/check-em-dashes.sh --part catalogs --require-extracted

      # Standing, never gating. Coverage and placeholder parity over the tier
      # the loop owns; low numbers are pending work by design, so this step
      # reports and cannot fail the job.
      #
      # The soundness reading rides along, because it is the one number here a
      # human should act on: coverage below a bar is pending work, and an
      # artifact that translated a machine identifier or dropped a placeholder is
      # a defect already committed. It gates on the return leg
      # (scripts/check-loop-output.sh), never on a pull request. A source change
      # must not fail because a target has not caught up with it.
      - name: Target-language standing (informational, never gates)
        if: always()
        run: |
          {
            echo "## Multilingual standing"
            echo ""
            make -s l10n-report || true
            make -s l10n-content-check || true
          } >> "$GITHUB_STEP_SUMMARY"
