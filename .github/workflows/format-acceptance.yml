name: Format acceptance

# The macOS runner exercises native output with the installed consumer tools.
# Tests record a skip when a tool is unavailable and fail when it rejects output.
on:
  push:
    branches: [main]
    paths:
      - "core/formats/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/format-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/formats/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/format-acceptance.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      collect-receipts:
        type: boolean
        default: false

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: format-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  format-acceptance:
    name: format-acceptance
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Go build dependencies
        run: brew install icu4c pkg-config

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22 to match every other workflow and satisfy pnpm 11 (corepack),
          # which requires Node >= 22.13; on 20 the ajv-cli install fails and the
          # schema checks error out.
          node-version: "26"

      - name: Install ajv-cli
        # The tests prefer the global executable and can use pnpm when it is absent.
        run: |
          corepack enable
          export PNPM_HOME="$HOME/.local/share/pnpm"; export PATH="$PNPM_HOME:$PATH"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          corepack pnpm add -g ajv-cli@5 || true

      - name: Install consumer toolchains
        # mono provides `resgen` for the .NET RESX compile check. Best-effort.
        run: brew install mono || true

      - name: Report available validators
        run: |
          for t in plutil resgen xmllint python3 node corepack ajv; do
            printf '%-8s ' "$t"; command -v "$t" || echo '(missing — will self-skip)'
          done

      - name: Run format acceptance tests
        id: acceptance
        env:
          COLLECT: ${{ inputs.collect-receipts }}
        run: |
          if [[ "$COLLECT" == true ]]; then
            make format-acceptance ACCEPTANCE_EVENTS="$RUNNER_TEMP/acceptance.jsonl"
          else
            make format-acceptance
          fi
      - name: Collect external consumer results
        if: ${{ !cancelled() && inputs.collect-receipts && (steps.acceptance.outcome == 'success' || steps.acceptance.outcome == 'failure') }}
        run: |
          node scripts/format-ops/acceptance-receipts.mjs collect \
            "$RUNNER_TEMP/acceptance.json" "$RUNNER_TEMP/acceptance.jsonl"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.collect-receipts }}
        with:
          name: acceptance-receipts
          overwrite: true
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
