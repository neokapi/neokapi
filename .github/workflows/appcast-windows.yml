name: Publish desktop update feed (Windows)

# Dispatch-only, like winget.yml. The Windows desktop installers/zips are signed
# locally (SimplySign) and added to the release by scripts/publish-windows-signed.sh
# *after* CI — so the Windows in-app-update feed must be generated after that
# step, not during the release run. publish-windows-signed.sh dispatches this
# (and winget.yml) once the signed assets are uploaded.
#
# It downloads each signed desktop zip (one top-level Kapi.exe / Bowrain.exe) and
# signs it into the per-(os,arch) Sparkle appcast the Wails native updater reads
# (appcast-<name>-windows-<arch>[-beta].xml on the registry Pages site).
#
# No-op until UPDATE_ED25519_PRIVATE_KEY + REGISTRY_TOKEN are configured.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the Windows update feed for (e.g. v1.2.3)"
        required: true

# With no permissions block the job takes the repository default, which is
# `read`. That is enough to download the signed zip — and not enough for
# publish-appcast.sh's `gh release upload --clobber`, whose delete-then-upload
# needs write. Every run since 2026-06-25 got as far as "Uploading
# <app>-<version>-windows-<arch>.zip to release <tag>" and died there on
# "HTTP 403: Resource not accessible by integration", so no Windows desktop user
# has ever been offered an in-app update. The asset id in that message is the
# one being clobbered, not one being read.
#
# The feed itself is written to the registry repo under REGISTRY_TOKEN, which
# this does not affect.
permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.title }} ${{ matrix.arch }} appcast
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { title: Kapi, name: kapi, arch: amd64 }
          - { title: Kapi, name: kapi, arch: arm64 }
          - { title: Bowrain, name: bowrain, arch: amd64 }
          - { title: Bowrain, name: bowrain, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Publish Windows appcast
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          TITLE: ${{ matrix.title }}
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # A leg that publishes nothing still exits 0, and from a user's machine
          # an absent feed is indistinguishable from "no update available". So
          # every outcome writes a line to the run summary, and the two that are
          # not meant to happen also annotate the job.
          summary() { echo "- ${TITLE} windows/${ARCH}: $1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::warning title=No Windows update feed published::UPDATE_ED25519_PRIVATE_KEY or REGISTRY_TOKEN is unset, so ${TITLE} windows/${ARCH} published nothing."
            summary "skipped, appcast secrets unset"
            exit 0
          fi

          # Track-aware: kapi releases on v* tags, bowrain on bowrain-v* tags.
          # Strip whichever prefix applies to get the bare X.Y.Z. The legs for
          # the other track's app are expected to do nothing on this tag, so
          # they say so quietly; a missing zip on the tag's OWN track is the
          # out-of-band signing step not having run, which is worth an
          # annotation.
          case "$TAG" in bowrain-v*) TRACK=bowrain ;; *) TRACK=kapi ;; esac
          VERSION="${TAG#bowrain-v}"; VERSION="${VERSION#v}"
          ZIP="${NAME}-${VERSION}-windows-${ARCH}.zip"

          if [ "$NAME" != "$TRACK" ]; then
            echo "${TITLE} does not ship on a ${TRACK} tag; nothing to publish."
            summary "not on the ${TRACK} track"
            exit 0
          fi

          if ! gh release download "$TAG" --repo "$REPO" --pattern "$ZIP" --dir .; then
            echo "::warning title=No Windows update feed published::$ZIP is not on release $TAG, so ${TITLE} windows/${ARCH} published nothing. The signed Windows assets are uploaded out of band by scripts/publish-windows-signed.sh."
            summary "skipped, no $ZIP on $TAG"
            exit 0
          fi

          bash scripts/publish-appcast.sh "$TITLE" "$NAME" "$VERSION" "$TAG" "$REPO" "$ZIP" windows "$ARCH"
          summary "published from $ZIP"
