name: Container Scan

on:
  schedule:
    - cron: "0 4 * * 1" # Monday 4 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/neokapi/bowrain-server:latest
          - ghcr.io/neokapi/bowrain-worker:latest
          - ghcr.io/neokapi/bowrain-web:latest
          - ghcr.io/neokapi/bowrain-keycloak:latest
        # An image's approved exemptions, each with an expiry
        # (.github/trivy/). Only the image named here reads its file.
        include:
          - image: ghcr.io/neokapi/bowrain-keycloak:latest
            ignorefile: .github/trivy/bowrain-keycloak.trivyignore.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/trivy

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        # master as of 2026-11-05 (#595, "Update trivy to v0.76.2"). Pinned by
        # commit, with the scanner version set below, so neither the action nor
        # the scanner moves unannounced; scripts/check-tool-versions.py reports
        # a newer Trivy.
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          # List each exempted finding in the log, so a reader sees what the
          # ignore file hid on this run.
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          version: v0.76.2
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ matrix.ignorefile || '' }}
          # Every scan downloads the current database. A restored cache could
          # let a scan pass against a stale one, on the weekly run where it
          # matters; the next step fails the job if the database is not fresh.
          cache: false

      # The scan is only as good as its database: fail when the vulnerability
      # database (and the Java database, for images with jars) was built more
      # than three days ago, so a broken or stale download cannot pass.
      - name: Check the scanner's databases are fresh
        if: always()
        env:
          CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys
          root = os.environ["CACHE_DIR"]
          now = datetime.datetime.now(datetime.timezone.utc)
          checked = 0
          for name in ("db", "java-db"):
              path = os.path.join(root, name, "metadata.json")
              if not os.path.exists(path):
                  if name == "db":
                      sys.exit(f"::error::no vulnerability database at {path}: the scan did not download one")
                  continue
              updated = json.load(open(path))["UpdatedAt"]
              at = datetime.datetime.fromisoformat(updated.replace("Z", "+00:00"))
              age = now - at
              print(f"{name}: updated {updated} ({age.days} days ago)")
              if age > datetime.timedelta(days=3):
                  sys.exit(f"::error::the {name} database is {age.days} days old (updated {updated})")
              checked += 1
          print(f"{checked} database(s) fresh")
          EOF
