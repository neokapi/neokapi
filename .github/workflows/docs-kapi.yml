name: Docs — kapi

# Two channels, one site.
#
#   PRODUCTION  built from the `docs/stable` branch — which a GA release moves
#               to its tag (release-docs.yml) and a person cherry-picks docs
#               fixes onto — and deployed at the site ROOT of neokapi.github.io.
#   NEXT        built from every push to main and deployed under /next/, with a
#               banner naming the release in progress.
#
# The channel follows the ref being built, so `workflow_dispatch` takes a `ref`
# input: run this workflow from main with `ref: docs/stable` and it checks out
# that branch and publishes production. That keeps the workflow definition on
# main alone, so a `docs/stable` branch cut from an older tag still deploys with
# the current steps.
#
# pages-deploy.yml routes by ARTIFACT NAME (kapi-site → root, kapi-site-next →
# /next/), so a production deploy and a next deploy can never land in each
# other's slot.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build. Empty builds this run's ref; docs/stable builds production."
        required: false
        default: ""
  push:
    branches: [main, docs/stable]
    paths:
      - "web/**"
      - "packages/docs-shared/**"
      - "packages/reference-data/**"
      # The docs site bundles these packages (the Lab + KBF Lab/Tests + the
      # playground), so a change to them must rebuild and redeploy the site.
      - "packages/kapi-lab/**"
      - "packages/kapi-format/**"
      - "packages/kapi-playground/**"
      - "packages/engine/**"
      - "packages/i18n-react/**"
      - ".github/actions/pseudo-locale/**"
      # The generated qps locale is a function of the docs, the recipe, the
      # terms and the pinned kapi in the action below — so these belong here
      # too. They are listable at all only because the action installs a
      # released kapi instead of building one: from source the locale depended
      # on the whole Go module graph, and no honest list existed.
      - "kapi.yaml"
      - ".kapi/terms.json"
      - "scripts/pseudo-docs-i18n.sh"
      - ".github/workflows/docs-kapi.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/docs-shared/**"
      - "packages/reference-data/**"
      - "packages/kapi-lab/**"
      - "packages/kapi-format/**"
      - "packages/kapi-playground/**"
      - "packages/engine/**"
      - "packages/i18n-react/**"
      - ".github/actions/pseudo-locale/**"
      # The generated qps locale is a function of the docs, the recipe, the
      # terms and the pinned kapi in the action below — so these belong here
      # too. They are listable at all only because the action installs a
      # released kapi instead of building one: from source the locale depended
      # on the whole Go module graph, and no honest list existed.
      - "kapi.yaml"
      - ".kapi/terms.json"
      - "scripts/pseudo-docs-i18n.sh"
      - ".github/workflows/docs-kapi.yml"

# Cancel superseded PR runs; never cancel a push to main. Grouped by the ref
# being BUILT, so a production run dispatched from main with `ref: docs/stable`
# does not queue behind a main push.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which channel this run publishes, which ref it builds, where the site is
  # mounted, and which versions the banner and the switch name. Resolved once so
  # the two build jobs and the deploy agree.
  resolve:
    name: Resolve channel
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.c.outputs.ref }}
      channel: ${{ steps.c.outputs.channel }}
      base: ${{ steps.c.outputs.base }}
      artifact: ${{ steps.c.outputs.artifact }}
      stable_tag: ${{ steps.c.outputs.stable_tag }}
      stable_version: ${{ steps.c.outputs.stable_version }}
      channel_version: ${{ steps.c.outputs.channel_version }}
    steps:
      - id: c
        env:
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The dispatch input reaches actions/checkout's `ref`, so hold it to a
          # git-ref charset before anything else sees it.
          ref="${INPUT_REF:-}"
          if [ -n "$ref" ] && printf '%s' "$ref" | grep -qE '[^A-Za-z0-9._/-]'; then
            echo "::error::refusing suspicious ref '$ref'"; exit 1
          fi

          branch="${ref:-$REF_NAME}"
          if [ "$branch" = "docs/stable" ]; then
            # Production: the site ROOT of neokapi.github.io.
            channel=stable; base=/; artifact=kapi-site
          elif [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            # A preview keeps the /web/prs/<N>/neokapi/docs/ slot pages-deploy.yml
            # writes. It carries the next channel's banner, so a reviewer sees it.
            channel=next; base="/web/prs/${PR_NUMBER}/neokapi/docs/"; artifact=kapi-site
          else
            channel=next; base=/next/; artifact=kapi-site-next
          fi

          # Versions come from the published releases rather than from tags in
          # the checkout, so the build jobs stay shallow clones. The site config
          # falls back to `git describe` where these are unset (a local build).
          releases="$(gh release list --repo "$GH_REPO" --exclude-drafts --limit 60 \
            --json tagName,isPrerelease --jq 'map(select(.tagName|test("^v[0-9]")))')"
          stable_tag="$(printf '%s' "$releases" | jq -r 'map(select(.isPrerelease==false))[0].tagName // ""')"
          latest_tag="$(printf '%s' "$releases" | jq -r '.[0].tagName // ""')"
          if [ "$channel" = "stable" ]; then
            channel_tag="$stable_tag"
          else
            channel_tag="$latest_tag"
          fi

          {
            echo "ref=$ref"
            echo "channel=$channel"
            echo "base=$base"
            echo "artifact=$artifact"
            echo "stable_tag=$stable_tag"
            echo "stable_version=${stable_tag#v}"
            echo "channel_version=${channel_tag#v}"
          } >> "$GITHUB_OUTPUT"

  build-wasm:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build playground wasm
        run: make web-wasm-demo

      - name: Build CLI playground wasm
        run: make web-wasm-cli

      - name: Upload playground wasm
        uses: actions/upload-artifact@v7
        with:
          name: kapi-wasm
          path: web/static/wasm
          retention-days: 7

  build:
    needs: [resolve, build-wasm]
    runs-on: ubuntu-latest
    # id-token: write lets the push-to-main wasm publish assume the AWS OIDC
    # deploy role (configure-aws-credentials); contents: read for checkout.
    permissions:
      contents: read
      id-token: write
    # CDN_URL is the CDN origin (cdn.<domain>, S3+CloudFront) to serve large
    # assets (wasm, vision models, videos, images) from — the DOCS_CDN_URL repo
    # variable. Empty → assets stay same-origin. It is ON for push AND same-repo
    # PRs so previews reference the shared, already-published video/model/image
    # assets by URL instead of staging them into the artifact. WASM is different:
    # only push-to-main publishes it to the CDN (via the OIDC deploy role, which
    # PRs can't assume), so same-repo PR previews serve their own wasm
    # same-origin (see the wasm publish step + DOCS_CDN_VERSION below). FORK PRs
    # keep CDN_URL empty and never get a deployed preview, so they build fully
    # same-origin.
    env:
      CDN_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.DOCS_CDN_URL || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      # The commit this run BUILT, which is github.sha for a push and the tip of
      # the dispatched ref otherwise. It keys the wasm this run publishes to the
      # CDN, so the two channels never write different bytes to one key: a
      # production run dispatched from main carries main's github.sha while
      # building docs/stable's tree.
      - name: Record the commit being built
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The neokapi docs site is downstream-clean by contract: zero bowrain
      # references in user-facing pages/landing, no bowrain video assets staged
      # here. Fails fast before the (slow) build.
      - name: Guard — neokapi docs must stay bowrain-clean
        run: ./scripts/check-docs-bowrain-clean.sh

      # The production channel advertises the release it is built from, spliced
      # here from that release's actual assets rather than carried as committed
      # markdown. release-docs.yml still opens its rolling PR against main, so
      # the next channel's committed page keeps up; production reads the release
      # directly and so cannot drift from it.
      #
      # The script refuses when a platform has no asset on the release yet (the
      # Windows binaries are signed out of band the morning after a release) and
      # leaves the page untouched. The page then serves the links it carries and
      # the next run picks the rest up. Runs before the pseudo-locale step, which
      # reads the pages.
      - name: Splice the stable release's download links
        if: ${{ needs.resolve.outputs.channel == 'stable' && needs.resolve.outputs.stable_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.resolve.outputs.stable_tag }}
        run: |
          set -euo pipefail
          if bash scripts/update-website-downloads.sh "$STABLE_TAG"; then
            echo "installation page refreshed for ${STABLE_TAG}"
          else
            echo "::warning::${STABLE_TAG} is missing assets for at least one platform; the installation page keeps its committed links"
          fi

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: vp install

      # @neokapi/{ui,flow-editor} (consumed by kapi-lab and the docs site)
      # import `@neokapi/i18n-react/runtime`, a built ./dist subpath export.
      # Build neokapi-i18n so it resolves for both the lab tests and the docs
      # build below (mirrors ci-kapi-desktop-frontend / ci-frontend).
      - name: Build @neokapi/i18n-react
        run: vp run build
        working-directory: packages/i18n-react

      # The lab package has no other CI home (ci.yml's filters cover the
      # bowrain frontends and packages/ui|flow-editor via the desktop job);
      # its unit tests run here, where every kapi-lab change already lands.
      - name: Lab package checks and tests
        working-directory: packages/kapi-lab
        run: |
          vp check --no-fmt
          vp test -- --run

      # The docs site's own unit tests: the helpers the reference-page generator
      # shares with the runtime grids, whose output is committed MDX. A page is
      # generated, so a defect in one of them is a defect on every page of a
      # kind at once.
      - name: Docs site unit tests
        working-directory: web
        run: vp test -- --run

      # @neokapi/engine (the publishable wasm-engine wrapper the playground
      # builds on) also has its CI home here: its facade unit tests run against
      # a mocked global surface, and the publish build proves dist/ assembles.
      - name: Engine package checks, tests, and publish build
        working-directory: packages/engine
        run: |
          vp check --no-fmt
          vp test -- --run
          vp run build

      # Videos and vision models are served from the CDN (R2) for push and
      # same-repo PRs — referenced by URL, never staged into the artifact. The
      # docs-assets release is retired: videos are published to R2 from the
      # desktop (make publish-cdn-videos), vision models via
      # make publish-cdn-vision-models (from the pinned vision-models-v1 release).
      # Local dev / fork builds (CDN off) stage same-origin on demand with
      # `make fetch-vision-models`; fork PRs never deploy a preview.

      - name: Download playground wasm
        uses: actions/download-artifact@v8
        with:
          name: kapi-wasm
          path: web/static/wasm

      # Stage @embedpdf/pdfium's wasm next to the kapi wasm so the /lab/pdf
      # browser PDF reader can fetch it (else it 404s on /wasm/pdfium.wasm). The
      # build-wasm job is Go-only with no node_modules, so this runs here where
      # `vp install` above populated @embedpdf/pdfium — no CDN, pinned dep.
      - name: Stage PDFium wasm (browser PDF)
        run: make web-pdfium-wasm

      # On push to main: publish the freshly built wasm (kapi-cli + pdfium +
      # wasm_exec.js, versioned by commit sha) to the S3 CDN origin via the OIDC
      # deploy role, then drop it from the site artifact so GitHub Pages stays
      # small — the site is built below pointing at /kapi/wasm/<sha>/ on the CDN
      # (DOCS_CDN_VERSION). PRs can't assume the deploy role (its trust pins the
      # subject to main / the prod environment), so they skip this and serve
      # their own wasm same-origin — config.ts falls back when the version is
      # unset, while videos/models/images still resolve from the CDN by URL.
      - name: Configure AWS credentials (OIDC)
        if: ${{ github.event_name != 'pull_request' && env.CDN_URL != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish wasm to CDN (S3) + slim artifact
        if: ${{ github.event_name != 'pull_request' && env.CDN_URL != '' }}
        env:
          CDN_BUCKET: ${{ vars.CDN_BUCKET }}
          CDN_VERSION: ${{ env.BUILD_SHA }}
        run: |
          bash scripts/publish-cdn-assets.sh wasm
          rm -rf web/static/wasm

      # The deployed Format Reference is the committed dataset: built-ins plus
      # the in-repo plugins, reproducible from this checkout alone. The docs
      # build clones nothing and generates nothing from an external plugin repo
      # (#1073) — a third-party plugin documents its own formats in its own
      # repository.

      # The qps pseudo-locale is generated here, not committed — see
      # .github/actions/pseudo-locale for why. It must run BEFORE the build that
      # reads i18n/qps/.
      - name: Generate the qps pseudo-locale
        uses: ./.github/actions/pseudo-locale
        with:
          site: web

      - name: Build kapi Docusaurus site
        run: vp run build
        working-directory: web
        env:
          DOCS_BASE_URL: ${{ needs.resolve.outputs.base }}
          # Production ("stable") carries no banner; every other build is the
          # next channel and says so on every page.
          DOCS_CHANNEL: ${{ needs.resolve.outputs.channel }}
          # Resolved from the published releases above, because the checkout is
          # shallow and carries no tags for the config to describe.
          DOCS_CHANNEL_VERSION: ${{ needs.resolve.outputs.channel_version }}
          DOCS_STABLE_VERSION: ${{ needs.resolve.outputs.stable_version }}
          # Empty CDN_URL → assets resolve same-origin (unchanged). Set → vision
          # models, videos, and images load from the CDN. DOCS_CDN_VERSION points
          # wasm at /kapi/wasm/<sha>/ on the CDN and is set ONLY on push-to-main
          # (where the wasm publish step above ran). On PRs it stays empty, so
          # config.ts serves wasm same-origin while other assets use the CDN.
          DOCS_CDN_URL: ${{ env.CDN_URL }}
          DOCS_CDN_VERSION: ${{ github.event_name != 'pull_request' && env.BUILD_SHA || '' }}
          # Cookieless analytics (see web/src/clientModules/analytics.ts). The
          # key is the PUBLIC client-side key already hardcoded in
          # _build-web.yml; set only on push so PR previews and forks never
          # initialize analytics. Empty key → the site executes zero analytics
          # code. The host is the PostHog EU ingestion endpoint.
          POSTHOG_KEY: ${{ github.event_name != 'pull_request' && 'phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD' || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com

      # The artifact NAME carries the channel: pages-deploy.yml slots kapi-site
      # at the site root and kapi-site-next under /next/, so neither deploy can
      # reach the other's tree.
      - name: Upload kapi site artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.resolve.outputs.artifact }}
          path: web/build
          retention-days: 7
