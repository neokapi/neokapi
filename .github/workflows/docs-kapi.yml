name: Docs — kapi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/docs-shared/**"
      - "packages/reference-data/**"
      # The docs site bundles these packages (the Lab + KBF Lab/Tests + the
      # playground), so a change to them must rebuild and redeploy the site.
      - "packages/kapi-lab/**"
      - "packages/kapi-format/**"
      - "packages/kapi-playground/**"
      - "packages/engine/**"
      - "packages/i18n-react/**"
      - ".github/actions/pseudo-locale/**"
      # The generated qps locale is a function of the docs, the recipe, the
      # terms and the pinned kapi in the action below — so these belong here
      # too. They are listable at all only because the action installs a
      # released kapi instead of building one: from source the locale depended
      # on the whole Go module graph, and no honest list existed.
      - "kapi.yaml"
      - ".kapi/terms.json"
      - "scripts/pseudo-docs-i18n.sh"
      - ".github/workflows/docs-kapi.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/docs-shared/**"
      - "packages/reference-data/**"
      - "packages/kapi-lab/**"
      - "packages/kapi-format/**"
      - "packages/kapi-playground/**"
      - "packages/engine/**"
      - "packages/i18n-react/**"
      - ".github/actions/pseudo-locale/**"
      # The generated qps locale is a function of the docs, the recipe, the
      # terms and the pinned kapi in the action below — so these belong here
      # too. They are listable at all only because the action installs a
      # released kapi instead of building one: from source the locale depended
      # on the whole Go module graph, and no honest list existed.
      - "kapi.yaml"
      - ".kapi/terms.json"
      - "scripts/pseudo-docs-i18n.sh"
      - ".github/workflows/docs-kapi.yml"

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build playground wasm
        run: make web-wasm-demo

      - name: Build CLI playground wasm
        run: make web-wasm-cli

      - name: Upload playground wasm
        uses: actions/upload-artifact@v7
        with:
          name: kapi-wasm
          path: web/static/wasm
          retention-days: 7

  build:
    needs: build-wasm
    runs-on: ubuntu-latest
    # id-token: write lets the push-to-main wasm publish assume the AWS OIDC
    # deploy role (configure-aws-credentials); contents: read for checkout.
    permissions:
      contents: read
      id-token: write
    # CDN_URL is the CDN origin (cdn.<domain>, S3+CloudFront) to serve large
    # assets (wasm, vision models, videos, images) from — the DOCS_CDN_URL repo
    # variable. Empty → assets stay same-origin. It is ON for push AND same-repo
    # PRs so previews reference the shared, already-published video/model/image
    # assets by URL instead of staging them into the artifact. WASM is different:
    # only push-to-main publishes it to the CDN (via the OIDC deploy role, which
    # PRs can't assume), so same-repo PR previews serve their own wasm
    # same-origin (see the wasm publish step + DOCS_CDN_VERSION below). FORK PRs
    # keep CDN_URL empty and never get a deployed preview, so they build fully
    # same-origin.
    env:
      CDN_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.DOCS_CDN_URL || '' }}
    steps:
      - uses: actions/checkout@v7

      # The neokapi docs site is downstream-clean by contract: zero bowrain
      # references in user-facing pages/landing, no bowrain video assets staged
      # here. Fails fast before the (slow) build.
      - name: Guard — neokapi docs must stay bowrain-clean
        run: ./scripts/check-docs-bowrain-clean.sh

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: vp install

      # @neokapi/{ui,flow-editor} (consumed by kapi-lab and the docs site)
      # import `@neokapi/i18n-react/runtime`, a built ./dist subpath export.
      # Build neokapi-i18n so it resolves for both the lab tests and the docs
      # build below (mirrors ci-kapi-desktop-frontend / ci-frontend).
      - name: Build @neokapi/i18n-react
        run: vp run build
        working-directory: packages/i18n-react

      # The lab package has no other CI home (ci.yml's filters cover the
      # bowrain frontends and packages/ui|flow-editor via the desktop job);
      # its unit tests run here, where every kapi-lab change already lands.
      - name: Lab package checks and tests
        working-directory: packages/kapi-lab
        run: |
          vp check --no-fmt
          vp test -- --run

      # The docs site's own unit tests: the helpers the reference-page generator
      # shares with the runtime grids, whose output is committed MDX. A page is
      # generated, so a defect in one of them is a defect on every page of a
      # kind at once.
      - name: Docs site unit tests
        working-directory: web
        run: vp test -- --run

      # @neokapi/engine (the publishable wasm-engine wrapper the playground
      # builds on) also has its CI home here: its facade unit tests run against
      # a mocked global surface, and the publish build proves dist/ assembles.
      - name: Engine package checks, tests, and publish build
        working-directory: packages/engine
        run: |
          vp check --no-fmt
          vp test -- --run
          vp run build

      # Videos and vision models are served from the CDN (R2) for push and
      # same-repo PRs — referenced by URL, never staged into the artifact. The
      # docs-assets release is retired: videos are published to R2 from the
      # desktop (make publish-cdn-videos), vision models via
      # make publish-cdn-vision-models (from the pinned vision-models-v1 release).
      # Local dev / fork builds (CDN off) stage same-origin on demand with
      # `make fetch-vision-models`; fork PRs never deploy a preview.

      - name: Download playground wasm
        uses: actions/download-artifact@v8
        with:
          name: kapi-wasm
          path: web/static/wasm

      # Stage @embedpdf/pdfium's wasm next to the kapi wasm so the /lab/pdf
      # browser PDF reader can fetch it (else it 404s on /wasm/pdfium.wasm). The
      # build-wasm job is Go-only with no node_modules, so this runs here where
      # `vp install` above populated @embedpdf/pdfium — no CDN, pinned dep.
      - name: Stage PDFium wasm (browser PDF)
        run: make web-pdfium-wasm

      # On push to main: publish the freshly built wasm (kapi-cli + pdfium +
      # wasm_exec.js, versioned by commit sha) to the S3 CDN origin via the OIDC
      # deploy role, then drop it from the site artifact so GitHub Pages stays
      # small — the site is built below pointing at /kapi/wasm/<sha>/ on the CDN
      # (DOCS_CDN_VERSION). PRs can't assume the deploy role (its trust pins the
      # subject to main / the prod environment), so they skip this and serve
      # their own wasm same-origin — config.ts falls back when the version is
      # unset, while videos/models/images still resolve from the CDN by URL.
      - name: Configure AWS credentials (OIDC)
        if: ${{ github.event_name != 'pull_request' && env.CDN_URL != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish wasm to CDN (S3) + slim artifact
        if: ${{ github.event_name != 'pull_request' && env.CDN_URL != '' }}
        env:
          CDN_BUCKET: ${{ vars.CDN_BUCKET }}
          CDN_VERSION: ${{ github.sha }}
        run: |
          bash scripts/publish-cdn-assets.sh wasm
          rm -rf web/static/wasm

      # The deployed Format Reference is the committed dataset: built-ins plus
      # the in-repo plugins, reproducible from this checkout alone. The docs
      # build clones nothing and generates nothing from an external plugin repo
      # (#1073) — a third-party plugin documents its own formats in its own
      # repository.

      # web is a pnpm workspace member; its deps (and the @neokapi/*
      # workspace packages it consumes) are installed by the `vp install` above.
      - name: Determine base URL (production vs PR preview)
        id: base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Production serves the docs at the SITE ROOT ("/") of
          # neokapi.github.io (the docs home is the product landing page). PR
          # previews keep the /web/prs/<N>/neokapi/docs/ slot, because the deploy
          # step (pages-deploy.yml) runs as a workflow_run from the DEFAULT
          # branch and slots PR docs there — the build base must match that slot
          # or the preview's assets 404. The two paths are each internally
          # consistent.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            echo "docs_base=/web/prs/${PR_NUMBER}/neokapi/docs/" >> "$GITHUB_OUTPUT"
          else
            echo "docs_base=/" >> "$GITHUB_OUTPUT"
          fi

      # The qps pseudo-locale is generated here, not committed — see
      # .github/actions/pseudo-locale for why. It must run BEFORE the build that
      # reads i18n/qps/.
      - name: Generate the qps pseudo-locale
        uses: ./.github/actions/pseudo-locale
        with:
          site: web

      - name: Build kapi Docusaurus site
        run: vp run build
        working-directory: web
        env:
          DOCS_BASE_URL: ${{ steps.base.outputs.docs_base }}
          # Empty CDN_URL → assets resolve same-origin (unchanged). Set → vision
          # models, videos, and images load from the CDN. DOCS_CDN_VERSION points
          # wasm at /kapi/wasm/<sha>/ on the CDN and is set ONLY on push-to-main
          # (where the wasm publish step above ran). On PRs it stays empty, so
          # config.ts serves wasm same-origin while other assets use the CDN.
          DOCS_CDN_URL: ${{ env.CDN_URL }}
          DOCS_CDN_VERSION: ${{ github.event_name != 'pull_request' && github.sha || '' }}
          # Cookieless analytics (see web/src/clientModules/analytics.ts). The
          # key is the PUBLIC client-side key already hardcoded in
          # _build-web.yml; set only on push so PR previews and forks never
          # initialize analytics. Empty key → the site executes zero analytics
          # code. The host is the PostHog EU ingestion endpoint.
          POSTHOG_KEY: ${{ github.event_name != 'pull_request' && 'phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD' || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com

      - name: Upload kapi site artifact
        uses: actions/upload-artifact@v7
        with:
          name: kapi-site
          path: web/build
          retention-days: 7
