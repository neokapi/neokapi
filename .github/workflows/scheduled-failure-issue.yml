# A failing scheduled run tells someone.
#
# This workflow listens for the scheduled workflows below finishing; a new
# scheduled job is one line here.
#
# One issue per workflow, labelled `scheduled-failure` and titled
# "Scheduled run failing: <workflow>". A failure opens it, or reopens it and
# comments, naming the jobs that failed. Only a fresh scheduled run (attempt 1)
# that passes closes it; a re-run that passes leaves a comment.
#
# A dispatch with a run id replays a listed workflow's scheduled run to test
# the reporter. A replay can open or update an issue and never closes one.
name: Scheduled failure

on:
  workflow_run:
    workflows:
      - Nightly
      - E2E
      - Dogfood Sync
      - Container Scan
      - Contract Audit
      - Tool versions
      - Evals Refresh
      - Bowrain Build
      - Fuzz
      - Cache Budget
      - Bot PR Watch
      - Gardening
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a finished scheduled run of a listed workflow, to replay (opens or updates only)"
        required: true
      workflow:
        description: "Name of that run's workflow, as listed above; the replay checks it against the run"
        required: true

permissions:
  contents: read
  issues: write
  # Read the reported run and its jobs.
  actions: read

# Reports for one workflow never interleave, a replay's included: a replay
# names its workflow, and the step checks the name against the run.
concurrency:
  group: scheduled-failure-${{ github.event.workflow_run.name || inputs.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Report the scheduled run
    runs-on: ubuntu-latest
    # Only a SCHEDULED run. A push or dispatch failure already has someone
    # watching it: the person who pushed. The step checks the event again for
    # a replayed run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule'
    steps:
      # A replay checks the run's workflow against the list above, read from
      # this file rather than kept in a second copy.
      - name: Check out this workflow (replay only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/scheduled-failure-issue.yml
          sparse-checkout-cone-mode: false

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
          REPLAY_RUN_ID: ${{ inputs.run_id }}
          REPLAY_WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail

          run="$RUN_JSON"
          replay=false
          if [ -n "${REPLAY_RUN_ID:-}" ]; then
            replay=true
            case "$REPLAY_RUN_ID" in *[!0-9]*) echo "::error::run_id must be a number"; exit 1 ;; esac
            run="$(gh api "repos/$GH_REPO/actions/runs/$REPLAY_RUN_ID")"
          fi
          field() { printf '%s' "$run" | jq -r "$1"; }
          workflow="$(field .name)"
          event="$(field .event)"
          conclusion="$(field .conclusion)"
          run_id="$(field .id)"
          attempt="$(field .run_attempt)"
          run_url="$(field .html_url)"
          run_at="$(field .updated_at)"
          sha="$(field .head_sha)"
          echo "$workflow run $run_id (attempt $attempt): event $event, conclusion $conclusion, replay $replay"

          if [ "$replay" = true ]; then
            if [ "$workflow" != "$REPLAY_WORKFLOW" ]; then
              echo "::error::run ${run_id} belongs to ${workflow}, not ${REPLAY_WORKFLOW}; refusing to replay it"
              exit 1
            fi
            if ! WORKFLOW="$workflow" python3 - <<'EOF'
          import os, sys, yaml
          doc = yaml.safe_load(open(".github/workflows/scheduled-failure-issue.yml"))
          listed = (doc.get("on") or doc.get(True))["workflow_run"]["workflows"]
          sys.exit(0 if os.environ["WORKFLOW"] in listed else 1)
          EOF
            then
              echo "::error::${workflow} is not a workflow this reporter listens to; refusing to replay it"
              exit 1
            fi
            if [ "$event" != schedule ]; then
              echo "::error::run ${run_id} was a ${event} run, not a scheduled one; refusing to replay it"
              exit 1
            fi
          elif [ "$event" != schedule ]; then
            echo "Not a scheduled run; nothing to report."
            exit 0
          fi

          title="Scheduled run failing: ${workflow}"
          # The tracking issue for this workflow, open first, then the most
          # recent closed one. The title goes to jq as data (--arg), never into
          # the program, so a quote in a workflow name cannot rewrite the filter.
          existing="$(gh issue list --state all --label scheduled-failure --limit 200 \
            --json number,title,state \
            | jq -c --arg t "$title" \
              'map(select(.title == $t)) | (map(select(.state == "OPEN")) + map(select(.state != "OPEN"))) | first // empty')"
          number="$(printf '%s' "$existing" | jq -r '.number // empty')"
          state="$(printf '%s' "$existing" | jq -r '.state // empty')"

          case "$conclusion" in
            success)
              if [ "$replay" = true ]; then
                echo "A replay never closes an issue; only a scheduled run observed as it completes does."
              elif [ "$state" != OPEN ]; then
                echo "No open issue for ${workflow}; nothing to close."
              elif [ "$attempt" = 1 ]; then
                gh issue comment "$number" --body "\`${workflow}\` passed on its schedule: ${run_url} (\`${sha}\`, ${run_at}). Closing."
                gh issue close "$number"
              else
                gh issue comment "$number" --body "\`${workflow}\` passed on a re-run (attempt ${attempt}): ${run_url}. The issue stays open until a fresh scheduled run passes."
              fi
              exit 0 ;;
            failure|timed_out|startup_failure) ;;
            *)
              echo "Conclusion ${conclusion} neither opens nor closes an issue."
              exit 0 ;;
          esac

          # The failing jobs are a detail: when they cannot be read, the issue
          # is still filed, saying so.
          if failed="$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"')"; then
            if [ -z "$failed" ]; then
              failed="- No job reports a failure; the run failed before its jobs, or at the workflow level."
            fi
          else
            echo "::warning::could not read the jobs of run ${run_id}"
            failed="- Job names unavailable: the run's jobs could not be read. See ${run_url}."
          fi
          origin="\`${workflow}\` failed on its schedule."
          if [ "$replay" = true ]; then
            origin="\`${workflow}\` failed on its schedule. Reported by a replay (a dispatch of this reporter), not as the run completed."
          fi
          body="$(printf '%s\n' \
            "$origin" \
            "" \
            "- Run: ${run_url} (attempt ${attempt})" \
            "- Commit: \`${sha}\`" \
            "- At: ${run_at}" \
            "" \
            "Failing jobs:" \
            "$failed" \
            "" \
            "This issue collects every failure of this workflow. A fresh scheduled" \
            "run that passes closes it.")"

          # Idempotent: --force updates the label when it already exists.
          gh label create scheduled-failure --force --color B60205 \
            --description "A scheduled workflow is failing; closed when it next passes"

          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body" --label scheduled-failure
            exit 0
          fi
          if [ "$state" != OPEN ]; then
            gh issue reopen "$number"
          fi
          gh issue comment "$number" --body "$body"
