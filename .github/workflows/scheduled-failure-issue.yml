# A failing scheduled run tells someone.
#
# This workflow listens for the scheduled workflows below finishing. A
# `workflow_run` listener covers every one of them without editing any, so a
# new scheduled job is one line here.
#
# One issue per workflow, labelled `scheduled-failure` and titled
# "Scheduled run failing: <workflow>". A failure opens it, or reopens it and
# comments, naming the jobs that failed. The workflow's next passing scheduled
# run closes it. A job failing every night is one thread, not thirty.
#
# A dispatch with a run id replays that run through the same path, so the
# reporter can be tested against a known scheduled run.
name: Scheduled failure

on:
  workflow_run:
    workflows:
      - Nightly
      - E2E
      - Dogfood Sync
      - Container Scan
      - Contract Audit
      - Tool versions
      - Evals Refresh
      - Bowrain Build
      - Fuzz
      - Cache Budget
      - Bot PR Watch
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a finished scheduled run to report, as if it had just completed"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Report the scheduled run
    runs-on: ubuntu-latest
    # Only a SCHEDULED run. A push or dispatch failure already has someone
    # watching it: the person who pushed. The step checks the event again for
    # a replayed run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'schedule'
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout: gh finds the repository from GH_REPO.
          GH_REPO: ${{ github.repository }}
          RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
          REPLAY_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          run="$RUN_JSON"
          if [ -n "${REPLAY_RUN_ID:-}" ]; then
            case "$REPLAY_RUN_ID" in *[!0-9]*) echo "::error::run_id must be a number"; exit 1 ;; esac
            run="$(gh api "repos/$GH_REPO/actions/runs/$REPLAY_RUN_ID")"
          fi
          field() { printf '%s' "$run" | jq -r "$1"; }
          workflow="$(field .name)"
          event="$(field .event)"
          conclusion="$(field .conclusion)"
          run_id="$(field .id)"
          attempt="$(field .run_attempt)"
          run_url="$(field .html_url)"
          run_at="$(field .updated_at)"
          sha="$(field .head_sha)"
          echo "$workflow run $run_id (attempt $attempt): event $event, conclusion $conclusion"
          if [ "$event" != schedule ]; then
            echo "Not a scheduled run; nothing to report."
            exit 0
          fi

          title="Scheduled run failing: ${workflow}"
          # The tracking issue for this workflow, open first, then the most
          # recent closed one. The title goes to jq as data (--arg), never into
          # the program, so a quote in a workflow name cannot rewrite the filter.
          existing="$(gh issue list --state all --label scheduled-failure --limit 200 \
            --json number,title,state \
            | jq -c --arg t "$title" \
              'map(select(.title == $t)) | (map(select(.state == "OPEN")) + map(select(.state != "OPEN"))) | first // empty')"
          number="$(printf '%s' "$existing" | jq -r '.number // empty')"
          state="$(printf '%s' "$existing" | jq -r '.state // empty')"

          case "$conclusion" in
            success)
              if [ "$state" = OPEN ]; then
                gh issue comment "$number" --body "\`${workflow}\` passed on its schedule: ${run_url} (\`${sha}\`, ${run_at}). Closing."
                gh issue close "$number"
              else
                echo "No open issue for ${workflow}; nothing to close."
              fi
              exit 0 ;;
            failure|timed_out|startup_failure) ;;
            *)
              echo "Conclusion ${conclusion} neither opens nor closes an issue."
              exit 0 ;;
          esac

          failed="$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"')"
          if [ -z "$failed" ]; then
            failed="- No job reports a failure; the run failed before its jobs, or at the workflow level."
          fi
          body="$(printf '%s\n' \
            "\`${workflow}\` failed on its schedule." \
            "" \
            "- Run: ${run_url}" \
            "- Commit: \`${sha}\`" \
            "- At: ${run_at}" \
            "" \
            "Failing jobs:" \
            "$failed" \
            "" \
            "This issue collects every failure of this workflow. Its next passing" \
            "scheduled run closes it.")"

          # Idempotent: --force updates the label when it already exists.
          gh label create scheduled-failure --force --color B60205 \
            --description "A scheduled workflow is failing; closed when it next passes"

          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body" --label scheduled-failure
            exit 0
          fi
          if [ "$state" != OPEN ]; then
            gh issue reopen "$number"
          fi
          gh issue comment "$number" --body "$body"
