name: Nightly

# The full gate on the forward-compat Go toolchain. ci.yml pins Go 1.27.4 on
# every PR and push (fast feedback); this nightly re-runs the heavier suites on
# Go `stable` with the race detector, so a toolchain regression surfaces within
# a day without taxing the per-commit path. The event is `schedule`, so the
# Makefile's event-aware profile uses the FULL mode (race + shuffle + coverage,
# containers included), the same as a push to main.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  # The suites pull the mirrored third-party images under ghcr.io/neokapi
  # (scripts/mirror-image.sh) with the workflow token.
  packages: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (known-vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: stable
      # The bowrain module includes the Wails desktop backend, whose cgo links
      # GTK/WebKit on Linux. Without these dev headers govulncheck's loader can't
      # import C in those packages ("could not import C"). Mirrors the full-suite
      # job's deps.
      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config
      # One step scans every module and reports them together, so a finding in
      # the first module cannot hide one in the next. An advisory a person has
      # reviewed and found not to apply is recorded, with its review date, in
      # scripts/govulncheck-accepted.txt.
      - name: Scan every application module
        run: python3 scripts/govulncheck.py . host cli kapi apps/kapi-desktop bowrain/core bowrain/plugin bowrain

  # The one writer of the Go-stable race build cache: no other job compiles
  # with Go stable. The last step saves the entries this run used.
  full-suite:
    name: Full suite (Go stable, race)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      # A runner is thrown away after the job, so testcontainers' reaper has
      # nothing to reap. Leaving it on costs a pull of testcontainers/ryuk from
      # Docker Hub before the first container starts, and a registry that
      # refuses that pull fails a test that never reached its own image (#2455).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: stable
      # A comment rewrite in a language the sourcecode plugin declares writable
      # is held to the project's formatter, and the tests hold TypeScript to the
      # oxfmt this workspace installs, so they need node_modules (as the PR
      # jobs do).
      - uses: ./.github/actions/setup-node-ui

      # The Wails app backends link GTK/WebKit on Linux; the bowrain module's
      # cgo build also needs these. Mirrors the desktop CI jobs.
      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      # host/s3remote runs the mirrored S3 gateway from ghcr.io.
      - name: Login to ghcr.io
        uses: ./.github/actions/registry-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry that refuses a pull fails here, by image name, rather than
      # inside whichever test reached for its image first.
      - name: Fetch the container images the suites start
        run: make -C bowrain pull-test-images

      - name: Note when compiling starts
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Framework + CLI + kapi (race, stable)
        run: make test-framework test-cli test-kapi

      - name: Platform + bowrain (race, containers, stable)
        run: make test-platform test-bowrain

      # The test targets redirect `go test -json` to these files, so a failure
      # is otherwise invisible: the job log shows only which make target exited
      # non-zero, and nothing here converts or uploads the results the way
      # ci.yml does. A nightly-only red that names no test is the failure mode
      # this whole workflow exists to avoid.
      - name: Name the failing tests
        if: failure()
        run: |
          for f in test-results-framework.json test-results-cli.json \
                   test-results-kapi.json test-results-platform.json \
                   test-results-bowrain.json test-results-bowrain-plugin.json; do
            [ -s "$f" ] || continue
            echo "── $f ──"
            bash scripts/print-go-test-failures.sh "$f"
          done

      # Saved after a test failure too: what compiled is still in the cache.
      - name: Save the Go-stable race build cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-build-cache
        with:
          flavor: race
          go-version: stable
          since: ${{ steps.start.outputs.epoch }}

  # ── Vision ONNX (real models) ───────────────────────────────────────────────
  # Exercises the kapi-vision plugin against the REAL PP-OCRv5 (OCR) and
  # PP-DocLayoutV3 (layout) models and a real onnxruntime: the numeric/inference
  # path the per-PR suite can't reach. Those tests are gated behind `-tags onnx`
  # plus KAPI_VISION_ORT_LIB / KAPI_VISION_MODELS_DIR (everything else uses fakes),
  # so they only run here. onnxruntime + the models are cached by version/tag, so
  # only the first run pays the ~350 MB download. This job runs model inference
  # directly; vision-pdf-e2e below runs the render-to-layout chain over a real PDF.
  vision-onnx:
    name: Vision ONNX (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_VERSION: "1.31.1" # matches yalue/onnxruntime_go (ORT_API_VERSION 31)
      VISION_MODELS_TAG: "vision-models-v1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: stable

      # Restored on every run; saved only by a run on main.
      - name: Restore onnxruntime
        id: cache-ort
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ort
          key: onnxruntime-nuget-linux-x64-${{ env.ONNXRUNTIME_VERSION }}
      - name: Download onnxruntime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: scripts/fetch-onnxruntime.sh linux amd64 "$RUNNER_TEMP/ort"
      - name: Save onnxruntime
        if: github.ref == 'refs/heads/main' && steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ort
          key: onnxruntime-nuget-linux-x64-${{ env.ONNXRUNTIME_VERSION }}

      # Restored on every run; saved only by a run on main.
      - name: Restore vision models
        id: cache-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/models
          key: vision-models-${{ env.VISION_MODELS_TAG }}
      - name: Download model assets
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          base="https://github.com/neokapi/neokapi/releases/download/${VISION_MODELS_TAG}"
          for f in ppocrv5_det.onnx ppocrv5_rec.onnx ppocrv5_dict.txt ppdoclayoutv3.onnx; do
            curl -sSfL -o "$RUNNER_TEMP/models/$f" "$base/$f"
          done
      - name: Save vision models
        if: github.ref == 'refs/heads/main' && steps.cache-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/models
          key: vision-models-${{ env.VISION_MODELS_TAG }}

      # The smoke tests verify each model file against its pinned SHA-256 (via
      # models.Ensure) before running, so a corrupt download fails loudly.
      - name: Run kapi-vision ONNX smoke tests (real models)
        env:
          KAPI_VISION_ORT_LIB: ${{ runner.temp }}/ort/lib/libonnxruntime.so
          KAPI_VISION_MODELS_DIR: ${{ runner.temp }}/models
          GOWORK: "off" # plugins/vision is its own module (not in go.work)
        run: |
          cd plugins/vision
          CGO_ENABLED=1 go test -tags onnx -v ./internal/ocr/...

  # ── PDF tier-3 end-to-end (kapi + kapi-pdfium + kapi-vision) ─────────────────
  # The cross-process wiring the smoke lane can't cover: build the real kapi CLI
  # and both plugins, install them, and read a real PDF with tier3 on so
  # kapi-pdfium renders each page and kapi-vision runs the layout model over the
  # raster (host decorator). Asserts the chain segments the page into many
  # structured blocks (the fast path yields ~1/page). onnxruntime + models reuse
  # the same caches as vision-onnx; libpdfium is cached too.
  vision-pdf-e2e:
    name: Vision PDF tier-3 e2e (kapi + plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ONNXRUNTIME_VERSION: "1.31.1"
      VISION_MODELS_TAG: "vision-models-v1"
      PDFIUM_RELEASE: "chromium/8165" # matches release-pdfium.yml
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: stable

      # kapi links the cgo ICU tokenizer / FTS5 path; the pdfium plugin's
      # static-pc build uses pkg-config.
      - name: Install cgo deps
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      # Restored on every run; saved only by a run on main.
      - name: Restore onnxruntime
        id: cache-ort
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ort
          key: onnxruntime-nuget-linux-x64-${{ env.ONNXRUNTIME_VERSION }}
      - name: Download onnxruntime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: scripts/fetch-onnxruntime.sh linux amd64 "$RUNNER_TEMP/ort"
      - name: Save onnxruntime
        if: github.ref == 'refs/heads/main' && steps.cache-ort.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ort
          key: onnxruntime-nuget-linux-x64-${{ env.ONNXRUNTIME_VERSION }}

      # Restored on every run; saved only by a run on main.
      - name: Restore vision models
        id: cache-models
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/models
          key: vision-models-${{ env.VISION_MODELS_TAG }}
      - name: Download model assets
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          base="https://github.com/neokapi/neokapi/releases/download/${VISION_MODELS_TAG}"
          for f in ppocrv5_det.onnx ppocrv5_rec.onnx ppocrv5_dict.txt ppdoclayoutv3.onnx; do
            curl -sSfL -o "$RUNNER_TEMP/models/$f" "$base/$f"
          done
      - name: Save vision models
        if: github.ref == 'refs/heads/main' && steps.cache-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/models
          key: vision-models-${{ env.VISION_MODELS_TAG }}

      # Restored on every run; saved only by a run on main.
      - name: Restore libpdfium
        id: cache-pdfium
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pdfium
          key: pdfium-linux-x64-${{ env.PDFIUM_RELEASE }}
      - name: Download libpdfium (bblanchon)
        if: steps.cache-pdfium.outputs.cache-hit != 'true'
        run: scripts/fetch-pdfium.sh linux amd64 "$RUNNER_TEMP/pdfium"
      - name: Save libpdfium
        if: github.ref == 'refs/heads/main' && steps.cache-pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pdfium
          key: pdfium-linux-x64-${{ env.PDFIUM_RELEASE }}

      - name: Build kapi
        run: make build

      - name: Package + install plugins
        run: |
          set -euo pipefail
          PLUGINS="$RUNNER_TEMP/plugins"; mkdir -p "$PLUGINS/pdfium" "$PLUGINS/vision"
          scripts/package-pdfium-plugin.sh --version 0.0.0 \
            --pdfium-dir "$RUNNER_TEMP/pdfium" --out-dir "$RUNNER_TEMP/pdfium-out"
          scripts/package-vision-plugin.sh --version 0.0.0 \
            --ort-dir "$RUNNER_TEMP/ort" --models-dir "$RUNNER_TEMP/models" \
            --out-dir "$RUNNER_TEMP/vision-out"
          tar xzf "$RUNNER_TEMP"/pdfium-out/kapi-pdfium_*.tar.gz -C "$PLUGINS/pdfium"
          tar xzf "$RUNNER_TEMP"/vision-out/kapi-vision_*.tar.gz -C "$PLUGINS/vision"

      - name: Run PDF tier-3 e2e
        env:
          KAPI_BIN: ${{ github.workspace }}/bin/kapi
          KAPI_PLUGINS_DIR: ${{ runner.temp }}/plugins
          KAPI_VISION_ORT_LIB: ${{ runner.temp }}/ort/lib/libonnxruntime.so
          KAPI_VISION_MODELS_DIR: ${{ runner.temp }}/models
        run: bash scripts/e2e-vision-pdf.sh
