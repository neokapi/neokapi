name: Deploy Keycloak

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/keycloak-theme/**"
      - "bowrain/docker/keycloak/**"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Keycloak Image
    needs: image-tag
    uses: ./.github/workflows/_build-keycloak-image.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}

# Deploy dispatch removed 2026-07-10: the Azure per-target workflows in
# neokapi/bowrain-infra were deleted in its Terraform consolidation, and Azure
# is being replaced by the AWS environment (strategy roadmap epic 002), whose
# pipeline consumes the ghcr image pushed above.
