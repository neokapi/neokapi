name: Deploy Keycloak

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/keycloak-theme/**"
      - "bowrain/docker/keycloak/**"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Keycloak Image
    needs: image-tag
    uses: ./.github/workflows/_build-keycloak-image.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [image-tag, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The task definition is Terraform-owned and pins :latest — the forced
      # deployment makes ECS re-pull the :latest image pushed above.
      # Rollback = re-run this workflow from an older commit (a retag
      # workflow_dispatch input can make that a one-click revert later).
      - name: Force new deployment of keycloak
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: bowrain-${{ inputs.environment || 'prod' }}-keycloak
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
