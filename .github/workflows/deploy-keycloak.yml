name: Deploy Keycloak

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/keycloak-theme/**"
      - "bowrain/docker/keycloak/**"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # This workflow builds and publishes; it does not deploy. Hosted prod is
  # Cognito end-to-end and has no Keycloak task definition (bowrain-infra
  # AD-005) — the cluster runs exactly three services, server, worker and
  # pulse. Keycloak is the self-host and dev provider, consumed from ghcr by
  # whoever runs it, so there is no service here for this repo to roll.
  #
  # A deploy step added later must not gate on `vars.AWS_DEPLOY_ROLE_ARN`: that
  # variable is shared with every other deploy workflow and is set, so it
  # cannot express whether a Keycloak service exists.
  build:
    name: Build Keycloak Image
    needs: image-tag
    uses: ./.github/workflows/_build-keycloak-image.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}
