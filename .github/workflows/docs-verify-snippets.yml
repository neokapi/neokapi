name: Docs — Verify Snippets

# CI gate: every <RunnableSnippet> (auto-run) and scene smoke_contract must
# exit zero in the browser wasm. A broken example fails this job before it
# ever reaches the reader.
#
# The job also hosts the wasm-backed smoke tests that share this build: the
# .kpz/.kapi workspace lifecycle, the KBF Go↔TS parity mirror, the review →
# approve loop, and the browser command surface. One `make web-wasm-cli` is
# amortized across all of them, so a smoke test belongs here rather than in a
# job that would build the wasm again.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/docs/**"
      - "web/walkthroughs/**"
      - "kapi/cmd/kapi-wasm-cli/**"
      - "kapi/**/*.go"
      - "cli/**/*.go"
      - "host/**/*.go"
      - "core/**/*.go"
      - "scripts/verify-snippets/**"
      # The lab explorers and the engine facade drive the wasm CLI by argv, so a
      # change to either can break a command call the surface smoke replays.
      - "packages/kapi-lab/**"
      - "packages/engine/**"
      # The TypeScript half of the KBF parity smoke. The Go half is covered by
      # core/**/*.go (core/kbf/, core/formats/jsx/); without this entry a
      # TS-only change to the mirror would skip the only Go↔TS parity signal.
      - "packages/kapi-format/**"
      - ".github/workflows/docs-verify-snippets.yml"
  pull_request:
    paths:
      - "web/docs/**"
      - "web/walkthroughs/**"
      - "kapi/cmd/kapi-wasm-cli/**"
      - "kapi/**/*.go"
      - "cli/**/*.go"
      - "host/**/*.go"
      - "core/**/*.go"
      - "scripts/verify-snippets/**"
      # The lab explorers and the engine facade drive the wasm CLI by argv, so a
      # change to either can break a command call the surface smoke replays.
      - "packages/kapi-lab/**"
      - "packages/engine/**"
      # The TypeScript half of the KBF parity smoke. The Go half is covered by
      # core/**/*.go (core/kbf/, core/formats/jsx/); without this entry a
      # TS-only change to the mirror would skip the only Go↔TS parity signal.
      - "packages/kapi-format/**"
      - ".github/workflows/docs-verify-snippets.yml"

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-snippets:
    name: Verify docs snippets in wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build kapi CLI wasm
        run: make web-wasm-cli

      - name: Run snippet verifier
        run: node --experimental-strip-types scripts/verify-snippets/harness.ts

      - name: Verify .kpz + .kapi workflows in wasm (JSON + Office)
        run: GOROOT="$(go env GOROOT)" node --experimental-strip-types scripts/kpz-wasm-smoke.ts

      # KBF Go(wasm)↔TS parity: canonical serialization SHA, HTML preview,
      # anchor resolution and target validation, comparing core/kbf against the
      # @neokapi/kapi-format mirror. The KBF format's Go suite has no testdata/
      # corpus, so this is the only signal that a change to one side of the
      # mirror (a renamed field, a reordered map, a retagged wrapper element)
      # has not silently desynced the other. Runs `make kbf-smoke`'s body
      # directly rather than the target itself: `kbf-smoke` depends on the
      # phony `web-wasm-cli`, which would rebuild the 76M wasm a second time.
      - name: Verify KBF Go↔TS parity in wasm
        run: node --experimental-strip-types scripts/verify-snippets/kbf-smoke.ts

      - name: Verify the review → approve loop in wasm (status, apply, state store)
        run: node --experimental-strip-types scripts/verify-snippets/review-smoke.ts

      # The browser command surface: no verb may answer "unknown command", the
      # verbs the browser cannot run must explain why, and every lab component's
      # own argv must still resolve. Guards the regression where #1180's
      # toolbox rename left /lab/convert calling a verb that no longer existed.
      - name: Verify the browser command surface in wasm
        run: node --experimental-strip-types scripts/verify-snippets/command-surface-smoke.ts

