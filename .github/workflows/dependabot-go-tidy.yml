name: Dependabot Go Tidy

on: pull_request

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Tidy all modules
        env:
          GOTOOLCHAIN: local
        run: |
          for dir in . host cli kapi apps/kapi-desktop bowrain/core bowrain/plugin bowrain; do
            echo "Tidying $dir..."
            (cd "$dir" && go mod tidy)
          done

      # Dependabot bumps one module's go.mod and go.sum. The workspace resolves
      # every module together, so a bump can raise a version in the workspace
      # graph whose checksum only go.work.sum records. Left stale, the first
      # build in any checkout writes those lines and dirties the tree.
      - name: Refresh go.work.sum
        env:
          GOTOOLCHAIN: local
        run: go list -m all > /dev/null

      - name: Push if changed
        run: |
          if git diff --quiet -- '**go.mod' '**go.sum' go.work.sum; then
            echo "All modules already tidy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.mod' '*.sum'
          git commit -m "chore: go mod tidy across all modules"
          git push
