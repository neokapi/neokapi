name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch exists so the push-only lanes can be exercised on a branch
  # before they reach main. The `changes` filter step runs on pull_request only,
  # so on a dispatch its outputs are empty and the path-gated jobs skip: what
  # runs is the set gated on `github.event_name != 'pull_request'`.
  workflow_dispatch:

# Cancel superseded runs on the same PR; never cancel a push to main (each
# main commit's run is the canonical record and must complete).
#
# Pushes group by commit, not by ref. GitHub keeps only one *pending* run per
# group, so a single group for refs/heads/main would let a third commit evict
# the second while it is still queued, and that run's push-only lanes
# (integration, coverage, race) would never run. One group per SHA costs
# runner minutes instead of coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  # Test jobs pull the mirrored third-party images under ghcr.io/neokapi
  # (scripts/mirror-image.sh) with the workflow token.
  packages: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  # ── Detect which modules changed ──────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ github.event_name == 'push' || steps.filter.outputs.framework }}
      cli: ${{ github.event_name == 'push' || steps.filter.outputs.cli }}
      platform: ${{ github.event_name == 'push' || steps.filter.outputs.platform }}
      migrations: ${{ github.event_name == 'push' || steps.filter.outputs.migrations }}
      kapi: ${{ github.event_name == 'push' || steps.filter.outputs.kapi }}
      bowrain_plugin: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain_plugin }}
      bowrain: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend }}
      frontend_packages: ${{ github.event_name == 'push' || steps.filter.outputs.frontend_packages }}
      kapi_desktop: ${{ github.event_name == 'push' || steps.filter.outputs.kapi_desktop }}
      kapi_desktop_frontend: ${{ github.event_name == 'push' || steps.filter.outputs.kapi_desktop_frontend }}
      bowrain_desktop: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain_desktop }}
      bowrain_desktop_frontend: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain_desktop_frontend }}
      i18n_react: ${{ github.event_name == 'push' || steps.filter.outputs.i18n_react }}
      workflows: ${{ github.event_name == 'push' || steps.filter.outputs.workflows }}
      plugins: ${{ github.event_name == 'push' || steps.filter.outputs.plugins }}
      faces: ${{ github.event_name == 'push' || steps.filter.outputs.faces }}
      ts_boundary: ${{ github.event_name == 'push' || steps.filter.outputs.ts_boundary }}
      harness: ${{ github.event_name == 'push' || steps.filter.outputs.harness }}
      eval_index: ${{ github.event_name == 'push' || steps.filter.outputs.eval_index }}
      wasm_stores: ${{ github.event_name == 'push' || steps.filter.outputs.wasm_stores }}
      go_files: ${{ github.event_name == 'push' || steps.filter.outputs.go_files }}
      # Every operand is compared to 'true' on purpose. GitHub's `||` returns
      # the first TRUTHY operand rather than a boolean, and a non-empty string
      # is truthy, so a bare `steps.filter.outputs.cli` yields the *string*
      # 'false' and short-circuits the rest of the chain. Chained bare outputs
      # collapse the expression to the first one, and the jobs `any_go` gates
      # (Build, Tidy Check, Race) would skip on every PR that misses the
      # framework filter. The single-filter outputs above have nothing to
      # short-circuit past. Do not chain one without `== 'true'`.
      any_go: ${{ github.event_name == 'push' || steps.filter.outputs.framework == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.platform == 'true' || steps.filter.outputs.kapi == 'true' || steps.filter.outputs.bowrain_plugin == 'true' || steps.filter.outputs.bowrain == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")

          check_paths() {
            local label="$1"; shift
            for pattern in "$@"; do
              # Support negation patterns (prefixed with !)
              if [[ "$pattern" == !* ]]; then continue; fi
              if grep -qE "$pattern" <<< "$CHANGED"; then
                echo "${label}=true" >> "$GITHUB_OUTPUT"
                return
              fi
            done
            echo "${label}=false" >> "$GITHUB_OUTPUT"
          }

          # The framework is the ROOT module, and the root module is more than
          # core/: kpz/, memory/, terms/ and providers/ are all part of it, and
          # `make test-framework` runs `go test ./...` from the root, so the job
          # already covers them. Only this filter did not — a PR touching just
          # kpz/ reported framework=false, which skipped Test (framework) AND,
          # through any_go, Build, Race and Tidy Check. #1612 (a kpz fix) landed
          # with five checks and no Go test run at all, which is how this was
          # found. cmd/ and examples/ are in the module too but hold only
          # binaries and samples; they are covered by the post-merge full run.
          #
          # scripts/ is NOT one of those. It holds tests that fail this job —
          # coordinatereport's drift gate, checkeval — so a PR editing one of
          # them skipped the only job that runs it, and the break surfaced on
          # main instead. That is the same shape as the kpz case above, found
          # the same way: by a PR fixing a scripts/ test and getting no Go run.
          check_paths framework '^(core|kpz|memory|terms|providers|scripts)/' '^go\.(mod|sum)$' '^go\.work' '^\.github/workflows/ci\.yml$'
          # host's comment tests build the sourcecode plugin and read through
          # it, so a change to the plugin runs them. They also run the
          # formatters in node_modules/.bin, through the launchers the package
          # manager writes there, so a change to what is installed runs them:
          # a package manager upgrade changed the launcher layout and kapi
          # refused every formatter, which no job on that pull request tested.
          check_paths cli       '^(cli|host)/' '^plugins/sourcecode/' '^pnpm-lock\.yaml$' '^package\.json$' '^pnpm-workspace\.yaml$'
          check_paths platform  '^bowrain/core/'
          # A baseline edit is the one change that can take production down
          # while every PR check passes, so it gets its own filter.
          check_paths migrations '^bowrain/[a-z_]+/migrations\.go$' '^bowrain/migrations/'
          # kapi: anything under kapi/
          if echo "$CHANGED" | grep -E '^kapi/' | grep -q .; then
            echo "kapi=true" >> "$GITHUB_OUTPUT"
          else
            echo "kapi=false" >> "$GITHUB_OUTPUT"
          fi
          check_paths bowrain_plugin '^bowrain/plugin/'
          # bowrain: anything under bowrain/ except frontend app dirs, packages/, bowrain/core/, bowrain/plugin/, docker/, and deploy/
          if echo "$CHANGED" | grep -E '^bowrain/' | grep -vE '^bowrain/(apps/(web|bowrain/frontend|keycloak-theme|ctrl|pulse)|packages/|emails/|core/|plugin/|docker/|deploy/)' | grep -q .; then
            echo "bowrain=true" >> "$GITHUB_OUTPUT"
          else
            echo "bowrain=false" >> "$GITHUB_OUTPUT"
          fi
          # The shared JS dependency graph. A change to the lockfile, the root
          # package.json (hoisted devDeps + overrides) or the workspace config
          # (catalog / overrides / hoisting) re-resolves dependencies for EVERY
          # workspace package — so it must turn on every JS test filter. Without
          # this, a root-only devDep bump (jsdom, jest-dom) matches none of the
          # per-package paths below, the per-package suites skip, and a breaking
          # bump merges all-green — caught only by the post-merge push run once
          # main is already red (jsdom 30 → i18n-react CSS.escape, #1646).
          js_deps=( '^pnpm-lock\.yaml$' '^package\.json$' '^pnpm-workspace\.yaml$' )

          check_paths frontend  '^bowrain/apps/(web|bowrain/frontend|ctrl|pulse|keycloak-theme)/' '^bowrain/packages/(ui|app)/' '^bowrain/emails/' "${js_deps[@]}"
          # ci.yml is in this filter for the reason the framework filter carries
          # it: a pull request that edits the kapi-desktop job's own steps
          # otherwise matches nothing here, skips the job, and merges the edit
          # unrun. The framework filter does not stand in — it gates the lint,
          # test and build jobs, none of which touch this one.
          # The suites in `make ci-frontend-packages`. Everything they import is a
          # package under packages/ (the licence boundary keeps them off
          # bowrain/packages), plus the files they read: context-atlas reads
          # core/place/testdata, and docs-palette reads the palettes it
          # generates into the two docs sites and the Makefile that names the
          # generator. ci.yml and the Makefile hold the job body.
          check_paths frontend_packages '^packages/' '^web/' '^bowrain/web/landing/' '^bowrain/mobile/' '^core/place/testdata/' '^bowrain/web/docs/src/css/palette\.generated\.css$' '^Makefile$' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          # The Go half of each desktop app. Its frontend half has a filter of
          # its own below, because the frontend reads more than the Go half.
          check_paths kapi_desktop '^apps/kapi-desktop/' '^packages/(ui|flow-editor)/' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          check_paths bowrain_desktop '^bowrain/apps/bowrain/' '^bowrain/packages/ui/' "${js_deps[@]}"
          # The suites in `make ci-kapi-desktop-frontend`. The app imports most
          # of packages/, flow-editor's suite reads core/schema/annotations.go,
          # and the guides suite reads the kapi docs pages it links to.
          check_paths kapi_desktop_frontend '^apps/kapi-desktop/' '^packages/' '^core/schema/annotations\.go$' '^web/docs/kapi/' '^Makefile$' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          # The suite in `make ci-bowrain-desktop-frontend`: the app and the
          # bowrain and shared packages it imports.
          check_paths bowrain_desktop_frontend '^bowrain/apps/bowrain/' '^bowrain/packages/' '^packages/' '^Makefile$' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          # i18n-react-lint is in this filter because its rules answer for what the
          # extractor does: narrowing what extraction skips retires a rule, and the
          # two have to move together or the rule tells the author to fix code that
          # already works. Its suite runs in the same job. The suites also read
          # packages/ui (the manifest test), and kapi-format's suite reads the Go
          # edition-key and JSX fixtures it is held to.
          check_paths i18n_react '^packages/(kapi-format|i18n-react|i18n-react-lint|ui)/' '^core/model/testdata/' '^core/formats/jsx/testdata/' '^Makefile$' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          check_paths workflows '^\.github/workflows/'
          check_paths plugins  '^plugins/' '^Makefile$' '^\.github/workflows/ci\.yml$' '^\.github/actions/setup-go-modules/'
          # The three faces of one question, plus the record they are held to.
          # Each leg lives in the module of the face it drives, so a PR touching
          # one face would otherwise run one leg and merge a disagreement.
          check_paths faces '^(cli|host)/' '^apps/kapi-desktop/backend/' '^kapi/'
          # The TypeScript half of the licence boundary. Its inputs are every JS
          # or TS source, every manifest and tsconfig that can alias one, the
          # workspace globs that decide which package names resolve, and the
          # LICENSE files that draw the line itself.
          check_paths ts_boundary '\.([cm]?[tj]s|[tj]sx)$' '^scripts/check-(go-module-boundaries|ts-license-boundary|workspace-versions)[.-]' '^Makefile$' '(^|/)package\.json$' '(^|/)tsconfig[^/]*\.json$' '(^|/)LICENSE$' '^pnpm-workspace\.yaml$'
          # The walkthrough harness is a standalone pnpm tree with its own
          # lockfile, so none of the filters above reach it and the shared JS
          # dependency graph does not either. It imports nothing outside
          # harness/. ci.yml is here for the reason the two filters above carry
          # it: a pull request editing this job's own steps would otherwise
          # match nothing, skip the job, and merge the edit unrun.
          check_paths harness '^harness/' '^\.github/workflows/ci\.yml$'

          # The /evals index copies each eval dataset's date and headline, so a
          # pull request that republishes only a dataset leaves the committed
          # index stale. The datasets sit under web/static/data/ and beside their
          # pages as web/src/pages/<page>/_<name>.json, where the framework filter
          # does not look, and the index tests also resolve the make targets the
          # cards name.
          check_paths eval_index '^web/static/data/' '^web/src/pages/[^/]+/_[^/]+\.json$' '^scripts/evalindex/' '^Makefile$' '^\.github/workflows/ci\.yml$'

          # The store suites under GOOS=js run every store package over the
          # browser's SQLite driver, whose Go half is core/storage and whose
          # JavaScript half is packages/engine/src/sqlite.ts, pinned through the
          # shared JS dependency graph. The same run puts the change service
          # through its conformance suite there: core/change, and the host's
          # service for a project with the recorder that writes the workspace log.
          # That compiles the whole host test package for js, so any change
          # under host/ runs it, as does one to the browser engine's own tests.
          check_paths wasm_stores '^(core|memory|terms|voice)/' '^host/' '^kapi/cmd/kapi-wasm-cli/' '^packages/engine/src/sqlite\.ts$' '^scripts/wasm-stores/' '^go\.(mod|sum)$' '^Makefile$' '^\.github/workflows/ci\.yml$' "${js_deps[@]}"
          # Every Go source and module file, whatever module holds it: the
          # edition storage guard type-checks all of them. The PDFium fetch
          # gives it the headers plugins/pdfium type-checks against.
          check_paths go_files '\.go$' '(^|/)go\.(mod|sum)$' '^go\.work' '^Makefile$' '^\.github/workflows/ci\.yml$' '^scripts/(fetch-pdfium|pdfium-pkgconfig)\.sh$'

  # ── Frontend checks & builds ─────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): ci-frontend typechecks the shared
    # frontend surfaces, so a cross-cutting TS break (for example, a shared
    # @neokapi/ui api type the desktop WailsApiAdapter must implement) is caught
    # pre-merge instead of surfacing only on the post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.frontend == 'true'
    # The derived-catalog gate lives in l10n.yml, so this job needs no write
    # access to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The committed lockfile must be exactly what the pinned pnpm produces.
      # setup-node-ui above already ran `vp install --frozen-lockfile`, which
      # proves the lockfile agrees with package.json but not that it was written
      # by our pinned resolver. Runs before the heavy checks so a resolver-skewed
      # lockfile (typically a Dependabot npm PR) fails fast.
      - name: Guard — lockfile is what the pinned pnpm produces
        run: ./scripts/check-lockfile-idempotent.sh

      # Job body lives in `make ci-frontend` (single source of truth, runnable
      # locally). See the "CI job bodies (thin-CI)" section of the Makefile.
      - name: Check + test + build the bowrain web frontends
        run: make ci-frontend

  # ── Shared packages, docs site, landing page and mobile app suites ──────
  # Unit tests only; the type-checks of these packages run in `frontend` above
  # through `vp check` over the whole workspace. scripts/check-test-scripts.py
  # (a repo guard) fails when a package `test` script runs in no pull request
  # job, and `make ci-frontend-packages` is where a new suite goes.
  frontend-packages:
    name: Frontend packages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_packages == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-frontend-packages`.
      - name: Unit-test the shared packages, docs site, landing page and mobile app
        run: scripts/check-temp-leaks.sh make ci-frontend-packages

  # ── Kapi Desktop ────────────────────────────────────────────────────────
  # The frontend half and the Go half share nothing but the checkout, so they
  # are two jobs: the pull request waits for the longer one, not their sum.
  kapi-desktop:
    name: Kapi Desktop (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kapi_desktop_frontend == 'true'
    # The derived-catalog gate lives in l10n.yml, so this job needs no write
    # access to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-kapi-desktop-frontend` (single source of
      # truth, runnable locally).
      - name: Frontend checks, tests, and Storybook build
        run: make ci-kapi-desktop-frontend

  kapi-desktop-backend:
    name: Kapi Desktop (backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kapi_desktop == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The shared action, for its caches: a pull request reads the build cache
      # the warm job saves on main. setup-go's own cache is keyed on go.sum
      # alone, and a pull request that misses it saves 800 MB of its own.
      - uses: ./.github/actions/setup-go-modules

      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run Kapi Desktop Go backend tests
        run: make kapi-desktop-test

      # apps/kapi-desktop is its own module, so neither lint job's `./...`
      # reaches it and 25 findings accumulated there before anything ran the
      # linter (#2551). It lints here because this job already has what the
      # module needs to compile: the Go toolchain, and the GTK, WebKit and ICU
      # headers installed above.
      #
      # `make kapi-desktop-lint-deps` writes the two artifacts the module embeds
      # but the repository does not carry: the gettext MO catalogs and a
      # frontend/dist placeholder. Without them golangci-lint fails at typecheck
      # and reports nothing. The same target is what `make kapi-desktop-lint`
      # depends on locally, so a developer and this job lint the same tree.
      - name: Materialize the Kapi Desktop embeds
        run: make kapi-desktop-lint-deps

      # One restore of golangci-lint's cache for every module this job lints.
      - uses: ./.github/actions/golangci-cache

      - uses: ./.github/actions/golangci

      - name: Lint Kapi Desktop
        run: make ci-lint-kapi-desktop

      # The generated Wails bindings are committed AND regenerated by
      # release.yml, so the shipped app gets fresh bindings while local dev,
      # `wails3 dev` and the typecheck above build against the committed copy.
      # This gate keeps the two in step.
      #
      # The job's path gate covers the backend Go files the bindings derive
      # from and the bindings directory itself. Drift from core/ or host/ model
      # types is caught by the Desktop bindings job below. Generation is
      # cgo-off, so it needs only the Go toolchain and the wails3 CLI, and it
      # reuses this job's Go build cache.
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli

      - name: Kapi Desktop Wails bindings are fresh
        run: make check-kapi-desktop-bindings

  # ── Desktop bindings, for the changes the desktop jobs cannot see ────────
  # The two desktop jobs run their own freshness gate, but they are path-gated
  # on the app and UI directories, so a change to a Go type the bindings are
  # DERIVED from reaches neither. This job runs the same gate on those
  # changes, without a frontend build or either desktop job's tests.
  #
  # The system libraries are for BUILDING the wails3 CLI: `go install
  # .../cmd/wails3` compiles wails, which on Linux needs GTK and WebKit.
  desktop-bindings:
    name: Desktop bindings
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.platform == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui
      - uses: ./.github/actions/setup-go-modules
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli
      - name: Kapi Desktop Wails bindings are fresh
        run: make check-kapi-desktop-bindings
      - name: Bowrain Desktop Wails bindings are fresh
        run: make check-bowrain-desktop-bindings

  # ── Bowrain Desktop (Wails app: frontend vitest, and the Go backend beside it) ──
  bowrain-desktop:
    name: Bowrain Desktop (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bowrain_desktop_frontend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-bowrain-desktop-frontend`.
      - name: Frontend tests
        run: make ci-bowrain-desktop-frontend

  bowrain-desktop-backend:
    name: Bowrain Desktop (backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bowrain_desktop == 'true'
    steps:
      - uses: actions/checkout@v7

      # The shared action, for its caches: a pull request reads the build cache
      # the warm job saves on main. setup-go's own cache is keyed on go.sum
      # alone, and a pull request that misses it saves 800 MB of its own.
      - uses: ./.github/actions/setup-go-modules

      # The Wails app backend links the GTK/WebKit runtime on Linux; these dev
      # packages also pull in libicu-dev that the framework's cgo build needs.
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run Bowrain Desktop Go backend tests
        run: make bowrain-desktop-test

      # Same committed-plus-regenerated-at-release split as kapi-desktop (see
      # that job). The binding ids are hashes of the Go method names, so a
      # renamed wrapper with a stale id still typechecks while its call
      # dispatches to a method that no longer exists.
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli

      - name: Bowrain Desktop Wails bindings are fresh
        run: make check-bowrain-desktop-bindings

  # ── Kapi React (TS extractor + schema) ──────────────────────────────────
  neokapi-i18n:
    name: Kapi React
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.i18n_react == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-i18n-react` (single source of truth).
      - name: Typecheck + validate + test + build kapi-format and neokapi-i18n
        run: make ci-i18n-react

  # ── Walkthrough harness (TypeScript sources behind the recordings) ──────
  # Recording needs a real stack, real credentials and a desktop, so no job
  # here records anything. This job typechecks and unit-tests the TypeScript
  # the recordings are driven by: the composition template, the beat
  # contract, crop geometry and the seed predicates.
  #
  # `make harness-check` delegates to `make -C harness check`, the target a
  # developer runs. The harness lockfile sits outside the root workspace and
  # that target installs its dependencies, so there is no install step here.
  # setup-node-ui supplies Node and the `vpx` the harness Makefile uses.
  harness:
    name: Harness
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      - name: Typecheck + unit-test the walkthrough harness
        run: make harness-check

  # ── Go tests (parallel per module) ────────────────────────────────────────
  test-framework:
    name: Test (framework, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Pinned Go only. The forward-compat `stable` canary runs in the
        # nightly workflow (nightly.yml), which keeps a whole test leg and its
        # build cache out of both PR and push runs.
        go-version: ["1.27.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: ${{ matrix.go-version }}

      # xmllint enforces the DocLang XSD conformance test (core/formats/doclang);
      # without it that test self-skips. Tiny package; keeps the schema gate real.
      - name: Install xmllint (DocLang XSD conformance)
        uses: ./.github/actions/apt-install
        with:
          packages: libxml2-utils

      - name: Run framework tests
        id: run-tests
        run: scripts/check-temp-leaks.sh make test-framework
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-framework.json
          out: junit-framework.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Framework Tests (Go ${{ matrix.go-version }})
          path: junit-framework.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      # Coverage is produced only on the full gate (push/nightly); PR fast runs
      # build without -coverprofile so Go can cache unchanged packages.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-framework
          path: coverage/framework.out

      - name: Upload native test results
        uses: actions/upload-artifact@v7
        if: always() && matrix.go-version == '1.27.4'
        with:
          name: test-results-native
          path: test-results-framework.json
          retention-days: 1

  # The store suites (core/storage, the workspace, the projector, the project
  # store, the ledger, the block history, the block cache, content memory,
  # terms, voice and the context graph) under GOOS=js in Node, over the browser
  # engine's own SQLite driver: the Go half in core/storage, the JavaScript half
  # in packages/engine/src/sqlite.ts. The same suites then run natively with
  # every pool held to one connection, as in the browser, which fails code
  # that holds a session and asks the same pool for another instead of
  # hanging. On push the host suite runs that way too.
  test-wasm-stores:
    name: Test (store suites, js/wasm and one connection)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wasm_stores == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      - uses: ./.github/actions/setup-node-ui
      # host/s3remote runs the mirrored S3 gateway from ghcr.io.
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the store and change suites over the browser's SQLite driver
        run: make test-wasm-stores
      - name: Run the store suites with one connection per pool
        run: make test-stores-oneconn
      - name: Run the host suite with one connection per pool
        if: github.event_name == 'push'
        run: make test-host-oneconn

  test-platform:
    name: Test (platform)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.platform == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run platform tests
        id: run-tests
        run: make test-platform
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: bowrain/test-results-platform.json
          out: junit-platform.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Platform Tests
          path: junit-platform.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-platform
          path: coverage/platform.out
          retention-days: 1

  # The host package holds most of this job's time, and Go runs one package's
  # tests one after another. A pull request runs it as three shards beside a
  # fourth job for every other package (see SHARD in the Makefile), so the wait
  # is the longest shard. A push to main runs the lot in one job, with race and
  # coverage, as before.
  test-cli:
    name: Test (cli${{ matrix.shard != 'all' && format(', {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["1/3","2/3","3/3","rest"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      # A comment rewrite in a language the sourcecode plugin declares writable
      # is held to the project's formatter, and host's tests hold TypeScript to
      # the oxfmt this workspace installs, so they need node_modules.
      - uses: ./.github/actions/setup-node-ui
      # host/s3remote runs the mirrored S3 gateway from ghcr.io.
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cli tests
        id: run-tests
        run: scripts/check-temp-leaks.sh make test-cli SHARD=${{ matrix.shard }}
        continue-on-error: true

      - name: Show cli test failures
        if: steps.run-tests.outcome == 'failure'
        run: bash scripts/print-go-test-failures.sh test-results-cli.json

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-cli.json
          out: junit-cli.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CLI Tests${{ matrix.shard != 'all' && format(' ({0})', matrix.shard) || '' }}
          path: junit-cli.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-cli
          path: |
            coverage/cli.out
            coverage/host.out
          retention-days: 1

  face-parity:
    name: Face parity (CLI/MCP/desktop)
    runs-on: ubuntu-latest
    needs: changes
    # One job for three legs. They live in three modules (the desktop's links
    # Wails and cannot be linked beside the others), so a per-module job would
    # run one face's leg against a record the other faces never re-read, and a
    # disagreement would merge green. Any face changing runs all three.
    if: needs.changes.outputs.faces == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # The desktop leg compiles the backend package, which links Wails.
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run the face parity suite
        run: make face-parity

  test-kapi:
    name: Test (kapi)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.kapi == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run kapi tests
        id: run-tests
        run: scripts/check-temp-leaks.sh make test-kapi
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-kapi.json
          out: junit-kapi.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Kapi Tests
          path: junit-kapi.xml
          reporter: java-junit

      - name: Upload raw test output on failure
        uses: actions/upload-artifact@v7
        if: steps.run-tests.outcome == 'failure'
        with:
          name: test-results-kapi-failed
          path: test-results-kapi.json
          retention-days: 3

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-kapi
          path: coverage/kapi.out
          retention-days: 1

  test-bowrain-plugin:
    name: Test (Bowrain Plugin)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain_plugin == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # The shared setup action already downloads bowrain/plugin (it is in its
      # "all" set). What is not shared is `go mod verify`: the action omits it
      # everywhere as per-job overhead, and the plugin is the one module where
      # it is worth paying, being a separately licensed binary shipped to users.
      - name: Download plugin modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: bowrain/plugin

      - name: Verify plugin modules
        run: cd bowrain/plugin && go mod verify

      - name: Run Bowrain Plugin tests
        id: run-tests
        run: scripts/check-temp-leaks.sh make test-bowrain-plugin
        continue-on-error: true

      - name: Convert plugin tests to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: bowrain/test-results-bowrain-plugin.json
          out: junit-bowrain-plugin.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Bowrain Plugin Tests
          path: junit-bowrain-plugin.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-bowrain-plugin
          path: |
            coverage/bowrain-plugin.out
          retention-days: 1

  # A pull request runs the server package, the largest in the module, as two
  # shards beside a third job for every other package (see SHARD in
  # bowrain/Makefile). A push to main runs the lot in one job, with race and
  # coverage.
  test-bowrain:
    name: Test (bowrain${{ matrix.shard != 'all' && format(', {0}', matrix.shard == 'rest' && 'rest' || format('server {0}', matrix.shard)) || '' }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["1/2","2/2","rest"]' || '["all"]') }}
    services:
      # A stable GitHub-managed Postgres for the bowrain suite, on a pull request
      # and on a push.
      # Previously the Postgres-backed server tests spun up a per-binary
      # testcontainer; Ryuk/Docker can reap it mid-run under -race, taking ~80
      # server tests down together with "connection refused" (the long-standing
      # Test (bowrain) flake). pgtest prefers BOWRAIN_TEST_POSTGRES_URL and just
      # creates an isolated schema per test in it, so this is immune to that.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Set on a pull request as well as on a push. A pull request passes
      # -short, and pgtest skips a short run unless it is handed a database:
      # with the service above already running, handing it over is what makes
      # the PostgreSQL-backed suites run before a merge. Without it a change to
      # a store, a migration or a handler that reads one was first tested on
      # main (#3607 broke a terms upgrade test that way with a green pull
      # request). -short still skips the suites that start other containers.
      BOWRAIN_TEST_POSTGRES_URL: postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable
      # A runner is thrown away after the job, so testcontainers' reaper has
      # nothing to reap here. Leaving it on costs a pull of testcontainers/ryuk
      # from Docker Hub before the first container starts, and a registry that
      # refuses that pull fails a test that never reached its own image (#2455).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # Under -short (pull_request) the container suites skip, so there is
      # nothing to warm the cache for.
      - name: Fetch the container images the suites start
        if: github.event_name != 'pull_request'
        run: make -C bowrain pull-test-images

      - name: Run bowrain tests
        id: run-tests
        run: scripts/check-temp-leaks.sh make test-bowrain SHARD=${{ matrix.shard }}
        continue-on-error: true

      # The suite pipes `go test -json` to a file, so failing test names never
      # reach the step log. Surface them (and the relevant output) on failure so
      # a red bowrain run is debuggable without re-running locally.
      - name: Show failed bowrain tests
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo "::group::Failed tests"
          jq -r 'select(.Action=="fail" and .Test!=null) | "\(.Package)\t\(.Test)"' test-results-bowrain.json | sort -u || true
          echo "::endgroup::"
          echo "::group::Failure output"
          # -A 3: testify writes the cause on the lines AFTER "Error:", so a
          # line-matching grep shows "Received unexpected error:" and drops the
          # error itself — which is the only part worth reading.
          jq -r 'select(.Action=="output") | .Output' test-results-bowrain.json \
            | grep -aA 3 -E "panic:|DATA RACE|Error Trace|Error:|FAIL|expected|actual|connection refused|cannot|no such|context deadline|\.go:[0-9]+:" | head -300 || true
          echo "::endgroup::"

      - name: Upload bowrain test JSON (on failure)
        if: steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bowrain${{ matrix.shard != 'all' && format('-{0}', strategy.job-index) || '' }}
          path: test-results-bowrain.json
          retention-days: 3

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-bowrain.json
          out: junit-bowrain.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Bowrain Tests${{ matrix.shard != 'all' && format(' ({0})', matrix.shard) || '' }}
          path: junit-bowrain.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-bowrain
          path: coverage/bowrain.out
          retention-days: 1

  # ── Plugin modules ────────────────────────────────────────────────────────
  # plugins/{sat,check,vision,asr,sourcecode} are separate go.mod modules
  # outside go.work, so no other job here compiles or tests them.
  # `make test-plugins` needs only a Go toolchain, so it runs on the PR gate.
  #
  # Not covered here: plugins/pdfium links libpdfium, and the `-tags onnx`
  # suites for vision and sat need a real onnxruntime. Those run in the
  # nightly vision-onnx and vision-pdf-e2e jobs. plugins/av ships no tests.
  # plugins/sourcecode is covered because its cgo is vendored grammar C with
  # no system library behind it.
  test-plugins:
    name: Test (plugins)
    runs-on: ubuntu-latest
    needs: changes
    # sat, check and sourcecode build against the framework through a replace
    # of ../.., so a framework change runs them too.
    if: needs.changes.outputs.plugins == 'true' || needs.changes.outputs.framework == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Not setup-go-modules: that action primes the go.work modules, which
      # these are outside, and its setup costs more than this whole job. Each
      # recipe runs GOWORK=off in its own module.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Resolve the Go cache paths
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Keyed on the plugin modules' own go.sum files, which decide what this
      # job downloads and builds. A push to main saves it; a pull request only
      # restores, so one that changes a plugin's go.sum falls back to main's
      # latest entry and saves nothing of its own.
      - name: Restore the plugin build and module cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-plugins-${{ runner.os }}-go1.27.4-${{ hashFiles('plugins/*/go.sum') }}
          restore-keys: |
            go-plugins-${{ runner.os }}-go1.27.4-
      - name: Restore and save the plugin build and module cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-plugins-${{ runner.os }}-go1.27.4-${{ hashFiles('plugins/*/go.sum') }}
          restore-keys: |
            go-plugins-${{ runner.os }}-go1.27.4-
      - name: Test the pure-Go plugin modules
        run: scripts/check-temp-leaks.sh make test-plugins
  # ── The //go:build integration lane ───────────────────────────────────────
  # The cross-store correctness suites: content-memory and terms parity between
  # SQLite and Postgres, the governed change-set lifecycle, and the knowledge
  # HTTP surface against a real database. They sit behind `//go:build
  # integration`, so no other job in this file compiles them.
  #
  # Push and manual dispatch only, matching the policy for every other
  # Postgres-backed suite here: PRs run -short and skip them to keep the wall
  # fast. scripts/test-integration.sh narrows the run to the packages that
  # carry a tagged file, so this is not a second full test wall.
  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    services:
      # Same GitHub-managed Postgres as Test (bowrain), for the same reason: a
      # per-binary testcontainer can be reaped mid-run by Ryuk under -race.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOWRAIN_TEST_POSTGRES_URL: postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable
      # The lane runs against the Postgres service above, so it starts no
      # container of its own and fetches nothing. The reaper is off here for
      # the same reason it is off in Test (bowrain): a runner is thrown away
      # after the job, so a lane that later does start a container pays no pull
      # of testcontainers/ryuk for a reaper with nothing to reap (#2455).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run the integration lane
        run: make test-integration

  # ── The schema a baseline builds, on PRs that edit one ───────────────────
  # TestBaselineSchemaMatchesGolden states what schema the migrations build, so
  # a baseline edit that changes it has to say so in the diff. It lives in the
  # integration lane above, which is push-only, and a baseline edit can pass
  # every PR check and still take production down: a column renamed inside a
  # CREATE TABLE IF NOT EXISTS without a version bump moves for a new database
  # and stays put for the running one. This job runs that one test, and only
  # when a migration file changed.
  migration-schema:
    name: Migration schema
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOWRAIN_TEST_POSTGRES_URL: postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      - name: The schema the baselines build matches the golden
        run: go test -tags "fts5,integration" ./migrations/ -run 'TestBaselineSchemaMatchesGolden|TestBaselineVersionsSitAboveRetiredOnes' -v
        working-directory: bowrain

  # ── The /evals index matches its datasets ─────────────────────────────────
  # TestCommittedIndexIsCurrent also runs in Test (framework), which a pull
  # request that changes only an eval dataset never reaches. This job runs the
  # index tests for exactly those changes.
  eval-index:
    name: Eval index
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eval_index == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
          modules: "."
      - name: The committed index matches the eval datasets
        run: go test ./scripts/evalindex/

  # Races the Go packages a pull request changed (scripts/test-race-changed.sh),
  # only when the PR carries the `race` label. Every push to main runs the full
  # suite with -race (the Makefile's FULL profile) and so does the nightly, so a
  # race that merges is reported on main within one CI run. Label a PR whose
  # change is concurrency-heavy to race it before merge; the label is read when
  # a run starts, so push or re-run after adding it. Each module's run has its
  # own 900s timeout, which is what catches a hang.
  race-changed:
    name: Race (changed packages)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.any_go == 'true' && contains(github.event.pull_request.labels.*.name, 'race')
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-modules
        with:
          # Dedicated flavor: these builds ARE race-instrumented, unlike the PR
          # wall's "pr" flavor, and only cover a slice of packages, unlike the
          # push wall's "race" flavor. Passing "race" here would be rewritten to
          # "pr" on pull_request (see the action), poisoning that cache with
          # instrumented objects, so key it separately.
          cache-flavor: race-changed
      # host's tests hold a TypeScript comment rewrite to the oxfmt this
      # workspace installs, and a changed host package races them here.
      - uses: ./.github/actions/setup-node-ui
      # host/s3remote runs the mirrored S3 gateway from ghcr.io.
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Race-test changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make test-race-changed

  # ── Merge coverage from all test jobs ─────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-framework, test-cli, test-platform, test-kapi, test-bowrain-plugin, test-bowrain]
    # Coverage is collected and pushed to Codecov on the full gate only. PR fast
    # runs skip -coverprofile (it disables Go's test cache), so there is nothing
    # to merge, and uploading near-empty coverage would spam Codecov PR comments.
    if: always() && !cancelled() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge coverage
        run: |
          # Start with framework coverage (has the header line)
          if [ -f framework.out ]; then
            cp framework.out coverage.out
          else
            echo "mode: atomic" > coverage.out
          fi
          # Append remaining files (skip header line)
          for f in cli.out host.out platform.out kapi.out bowrain-plugin.out bowrain.out; do
            if [ -f "$f" ]; then
              tail -n +2 "$f" >> coverage.out
            fi
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint-framework:
    name: Lint (framework)
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): golangci-lint covers the whole module,
    # so a lint break anywhere is caught pre-merge rather than only on the
    # post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.kapi == 'true'
    steps:
      - uses: actions/checkout@v7

      # golangci-lint compiles what it lints: the .golangci.yml build tags
      # include fts5, so it needs the ICU headers this action installs (without
      # them those files are silently skipped), and core/i18n and host/i18n
      # embed the catalogs it compiles. The linter reads the export data of
      # every dependency from the Go build cache, compiled without the race
      # detector, which is what the "pr" flavor holds. The warm job owns that
      # flavor, so this job never saves it.
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
          modules: ". host cli kapi"

      # One restore of golangci-lint's cache for every module this job lints.
      - uses: ./.github/actions/golangci-cache

      - uses: ./.github/actions/golangci

      # The host configuration (the test tags) of the modules in
      # GO_LINT_FRAMEWORK. The lint-tags legs lint the files it leaves out.
      - name: Lint framework, host, cli and kapi
        run: make ci-lint-framework

  # The scripts/ modules and bench/pseudobench, under the host configuration.
  # Each is its own module, so no other job's `./...` reaches them.
  lint-scripts:
    name: Lint (scripts)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.framework == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
          modules: ". host cli scripts/gen-refs scripts/gen-contract-types scripts/proseprobe scripts/batcheval scripts/commentcoverage scripts/contexteval scripts/contract-audit scripts/editguard scripts/emdashcheck scripts/fieldguard scripts/mkappcast scripts/projectionguard"
      - uses: ./.github/actions/golangci-cache
      - uses: ./.github/actions/golangci
      - name: Lint the scripts modules
        run: make ci-lint-scripts

  lint-platform:
    name: Lint (platform)
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): golangci-lint covers the whole bowrain
    # module, so a lint break anywhere is caught pre-merge rather than only on the
    # post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain_plugin == 'true' || needs.changes.outputs.bowrain == 'true'
    steps:
      - uses: actions/checkout@v7

      # Every module linted below links core/i18n or host/i18n, whose embedded
      # gettext catalogs are build output; the action compiles them, with the
      # ICU headers that cgo build needs, and creates the embed placeholders.
      # The linter reads its dependencies' export data from the "pr" build
      # cache, which the warm job owns, so this job never saves it.
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
          modules: "bowrain/core bowrain"

      # One restore of golangci-lint's cache for every module this job lints.
      - uses: ./.github/actions/golangci-cache

      - uses: ./.github/actions/golangci

      - name: Install Linux dependencies for Wails
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      # scripts/tagmatrix lints bowrain/core, bowrain/plugin and bowrain once
      # per build configuration, so the integration and e2e files are linted.
      - name: Lint platform, Bowrain plugin and bowrain
        run: make ci-lint-platform

  # The plugin modules sit outside go.work, so neither job above reaches them.
  # Every plugins/pdfium package needs PDFium on pkg-config; `make
  # ci-lint-plugins` fetches the pinned build the way fieldguard does. The
  # onnx files compile against the C header onnxruntime_go vendors.
  lint-plugins:
    name: Lint (plugins)
    runs-on: ubuntu-latest
    needs: changes
    # sat, check and sourcecode build against the framework through a replace
    # of ../.., so a framework change runs this job too.
    if: needs.changes.outputs.plugins == 'true' || needs.changes.outputs.framework == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Resolve the Go cache paths
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # The cache Test (plugins) saves on main.
      - name: Restore the plugin build and module cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-plugins-${{ runner.os }}-go1.27.4-${{ hashFiles('plugins/*/go.sum') }}
          restore-keys: |
            go-plugins-${{ runner.os }}-go1.27.4-
      - uses: ./.github/actions/golangci-cache
      - uses: ./.github/actions/golangci
      - name: Lint the plugin modules
        run: make ci-lint-plugins

  # One parallel leg per build configuration after the host one
  # (scripts/internal/buildconfigs). A leg lints the packages holding a file the
  # earlier configurations leave out, and runs the edit and projection guards
  # under its configuration. warm-lint-cache saves its build cache on main.

  # On a pull request a leg skips the lint when the change reaches no package it
  # compiles, imports included (scripts/tagmatrix -affected-since). A change to
  # the lint configuration, a module file, the Makefile, the workflow or the
  # shared actions runs every leg, and on main every leg runs.
  lint-tags:
    name: Lint (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.any_go == 'true' || needs.changes.outputs.plugins == 'true'
    strategy:
      fail-fast: false
      matrix:
        config: [model, js-wasm, windows, linux-nocgo, darwin-nocgo]
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Resolve the Go cache paths
        id: gocache
        run: echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore the module download cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum', 'host/go.sum', 'cli/go.sum', 'kapi/go.sum', 'apps/kapi-desktop/go.sum', 'bowrain/go.sum', 'bowrain/core/go.sum', 'bowrain/plugin/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Decide whether the change reaches this leg
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          LINT_CONFIG: ${{ matrix.config }}
        run: |
          set -o pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(make -s ci-lint-affected LINT_CONFIG="$LINT_CONFIG" LINT_BASE=HEAD^1)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-go-modules
        with:
          # On a Linux runner linux-nocgo lints nothing, so it reads the pr flavor
          # for the tools its setup builds, and has no flavor of its own.
          cache-flavor: ${{ matrix.config == 'linux-nocgo' && 'pr' || format('lint-{0}', matrix.config) }}
          save-cache: "false"
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/golangci-cache
        with:
          name: lint-tags-${{ matrix.config }}
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/golangci
      - name: Lint and guard the ${{ matrix.config }} configuration
        if: steps.gate.outputs.run == 'true'
        env:
          LINT_CONFIG: ${{ matrix.config }}
        run: make ci-lint-tags LINT_CONFIG="$LINT_CONFIG"

  # ── Edition storage guard ────────────────────────────────────────────────
  # Type-checks Go: every module on a push to main, and the directories a pull
  # request changed on a pull request (every module again when core/model, the
  # guard or a module file changed). That takes minutes, so it runs beside the
  # other guards and not inside them. The two Wails desktop modules type-check
  # with cgo on, and on Linux Wails reaches GTK 4 and WebKitGTK through
  # pkg-config, so their headers come first; a package that does not type-check
  # fails the guard.
  fieldguard:
    name: Edition storage guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_files == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # fieldguard -changed-since needs the base branch to diff against.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
      - name: Install the GTK and WebKit headers the desktop modules type-check against
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config
      - name: "Guard: only core/model reaches a block's edition storage"
        run: make fieldguard
        env:
          FIELDGUARD_ARGS: ${{ github.event_name == 'pull_request' && format('-changed-since origin/{0}', github.base_ref) || '' }}

  # ── Docs stay bowrain-clean (always-on, cheap) ───────────────────────────
  docs-guard:
    name: Repo guards
    runs-on: ubuntu-latest
    # No path gate: these guards are cheap, so they run on every PR, and a
    # stray bowrain reference, absolute home path, gofmt drift or stale guard
    # cannot merge and surface only post-merge.
    # Each takes seconds. The one guard that type-checks Go, the edition
    # storage guard, runs in a job of its own so these do not wait for it.
    steps:
      - uses: actions/checkout@v7
      - name: Guard — neokapi docs must stay bowrain-clean
        run: ./scripts/check-docs-bowrain-clean.sh
      - name: Guard — no absolute home paths in tracked files
        run: ./scripts/check-abs-paths.sh
      - name: "Guard: the e2e seed documents live once in bowrain/e2e/shared"
        run: ./scripts/check-e2e-seed-dupes.sh
      - name: Guard — no retired framing in user-facing prose
        run: ./scripts/check-vocabulary.sh
      - name: Guard — the Kapi Desktop surface names no interchange format
        run: ./scripts/check-desktop-interchange.sh
      - name: Guard — every local action reference resolves where its job checks out
        run: ./scripts/check-local-actions.sh

      - name: Guard — every run projection is declared, never hand-rolled
        run: ./scripts/check-run-projection.sh
      - name: Guard — no surface shows an inline code's native data or identifier
        run: ./scripts/check-code-display.sh
      - name: Guard — machine-readable output uses snake_case field names
        run: ./scripts/check-json-tags.sh
      # The recorded walkthroughs are the only reader of the apps' testids and
      # rail labels from outside the apps, and nothing compiles them together.
      - name: Guard — every walk selector is still rendered by an app
        run: ./scripts/check-walk-selectors.sh
      - name: Guard — every language is shown by name, not by its code alone
        run: ./scripts/check-locale-display.sh
      # The docs jobs build two sites in two locales and sit late in CI, so an
      # unresolvable doc id costs a full round trip to learn. This says it in a
      # second, on every PR, for both sidebars at once.
      - name: Guard — every sidebar doc id resolves to a page
        run: ./scripts/check-sidebar-ids.sh
      - name: Guard — reference dataset is reproducible from this repo
        run: ./scripts/check-reference-provenance.sh
      - name: Guard — publishable packages declare a license and ship its text
        run: ./scripts/check-package-licenses.sh
      - name: Guard — release archives ship the license text of the work inside
        run: ./scripts/check-archive-licenses.sh
      - name: Guard — plugin tarballs ship the license text of the work inside
        run: ./scripts/check-plugin-licenses.sh
      - name: Guard — no compiled executable is tracked in git
        run: ./scripts/check-tracked-binaries.sh
      - name: Guard — no plugin release claims the repo's "latest"
        run: ./scripts/check-plugin-release-latest.sh
      - name: "Guard: the apt/yum repository publishes only when it is turned on"
        run: ./scripts/check-packages-publish-gate.sh
      - name: "Guard: the release casks carry no install hook or retired vocabulary"
        run: ./scripts/check-cask-heredocs.sh

      # Every step that runs `go` comes after this one. A module a `go`
      # command downloads first is a read-only file the cache restore cannot
      # overwrite, and tar then abandons the whole module cache.
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"

      - name: Deploy workflow covers the framework
        run: ./scripts/check-deploy-paths.sh

      # The gate itself runs only in the nightly convergence, where nothing
      # exercises it on a pull request. Its self-test does: it drives the real
      # classification against real scratch repositories, so a change to the
      # derived set or to the classification cannot pass here and disarm the
      # nightly there.
      - name: "Guard: the test shards of a package cover every test once"
        run: ./scripts/go-test-shard.sh --self-test
      - name: "Guard: the reliability checklist validates and each trigger selects its fixture"
        run: python3 scripts/reliability-checklist.py --self-test
      - name: "Guard: the CI passed job answers for every job"
        run: python3 scripts/ci-passed.py --self-test && python3 scripts/ci-passed.py needs
      - name: "Guard: a test run that leaves files in the temporary directory fails"
        run: scripts/check-temp-leaks.sh --self-test
      - name: "Guard: the server and worker images run as an unprivileged numeric user"
        run: scripts/check-image-user.sh --self-test && scripts/check-image-user.sh
      - name: "Guard: every package test script runs in a pull request job"
        run: python3 scripts/check-test-scripts.py --self-test && python3 scripts/check-test-scripts.py
      - name: "Guard: every Go command in make, scripts and CI builds with -trimpath"
        run: python3 scripts/check-go-trimpath.py --self-test && python3 scripts/check-go-trimpath.py
      - name: "Guard: no step a pull request runs saves an Actions cache"
        run: python3 scripts/check-ci-caches.py --self-test && python3 scripts/check-ci-caches.py
      - name: "Guard: the cache budget script passes its self-test"
        run: python3 scripts/ci-cache-budget.py --self-test
      - name: "Guard: every declared macOS minimum agrees with what Go builds for"
        run: ./scripts/check-macos-minimum.sh --self-test && ./scripts/check-macos-minimum.sh
      - name: "Guard: the commit gate hook passes its self-test"
        run: ./.claude/hooks/commit-gate.sh --self-test
      - name: "Guard: the build cache warmer passes its self-test"
        run: ./scripts/ci-warm-build-cache.sh --self-test
      # The fuzz runner runs only in the nightly fuzz.yml. Its self-test fuzzes
      # a scratch module holding a target that fails, and checks that the run
      # goes on to the other targets, names the saved input and exits 1.
      - name: "Guard: the nightly fuzz runner reports a failing target"
        run: ./scripts/go-fuzz.sh --self-test
      - name: "Guard: every copy of a tool pin names the same version"
        run: |
          python3 scripts/check-tool-versions.py --self-test
          python3 scripts/check-tool-versions.py --offline
      - name: "Guard: the vite alias audit fails on drift and passes on both core layouts"
        run: bash scripts/audit-vite-alias.sh --self-test
      - name: "Guard: a bindings generator warning about our own code fails"
        run: ./scripts/wails-generate.sh --self-test
      - name: Guard — the sync commits only sound loop output
        run: ./scripts/check-loop-output.sh --self-test

      # Same reason, one step further along: the delivery that carries a
      # scheduled job's output to a reviewable pull request also runs nowhere a
      # pull request would notice. Its self-test drives the real staging, push
      # and refresh against scratch repositories with a real remote.
      - name: Guard — scheduled output is delivered as a reviewable pull request
        run: ./scripts/auto-pr.sh --self-test

      # The ratchet itself runs on extraction in l10n.yml. This proves its
      # comparison on planted warnings, on every pull request.
      - name: "Guard: the extractor warning ratchet refuses a new warning"
        run: node scripts/check-extract-warnings.mjs --self-test

      # Same reason again: the plugin formula generator runs only on a
      # `<plugin>-v*` tag, so nothing before a release exercises it. Its
      # self-test renders every plugin from a synthetic checksum set and checks
      # that an incomplete one is refused, since a formula with an empty
      # platform block installs nothing and reports success.
      - name: Guard — a plugin's Homebrew formula renders from its release
        run: ./scripts/gen-brew-plugin-formula.sh --self-test

      # The packager runs only on a release tag too. Its self-test packages a
      # dummy tree and reads the archives back, because an archive that
      # misdeclares itself looks green everywhere else: the release publishes,
      # the formulae install, and only `kapi plugins list` on a user's machine
      # reports the version.
      - name: Guard — a released archive declares the version it was cut at
        run: ./scripts/package-cli.sh --self-test

      # Both release tracks resolve their channel through one script, over tag
      # shapes that differ between them. Its self-test runs every shape and
      # checks that the workflows still call it: an inline copy of the test is
      # how the bowrain track came to read a prefix hyphen as a prerelease.
      - name: Guard — a final tag publishes stable on both release tracks
        run: ./scripts/release-channel.sh --self-test

      # The sourcecode release takes its version from the tag and copies the
      # manifest from the tagged commit, and only the tag push compares them.
      # The self-test runs that comparison on matching and mismatched pairs, and
      # checks that the release workflow still calls it.
      - name: "Guard: a plugin release tag matches its manifest version"
        run: ./scripts/check-release-manifest-version.sh --self-test

      # The desktop update feeds are published by a script that runs only on a
      # release tag, and a release candidate exercises only its beta half. Its
      # self-test runs it for a final and a candidate on both tracks and checks
      # which feeds reach the registry.
      - name: "Guard: a final tag publishes the stable update feed on both tracks"
        run: ./scripts/publish-appcast.sh --self-test

      # The fixture guard expands the extract globs the way the extractor does,
      # so it needs `fs/promises.glob` from Node 22. No dependencies: it reads the
      # flag sets from `make l10n-extract-globs` and globs the working tree.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Guard — no test or story file is extracted into a shipped catalog
        run: node scripts/check-extract-fixtures.mjs

      # gofmt needs a toolchain but no modules, since it is purely syntactic,
      # so this is a bare setup-go with the cache off and adds ~10s.
      #
      # This guard lives here, ungated, rather than in the Go-gated `tidy-check`
      # job on purpose. `any_go` is the OR of the six module filters in the
      # `changes` job (core/, cli|host/, bowrain/core|plugin/, kapi/, bowrain/),
      # none of which match apps/kapi-desktop/, plugins/sat/, harness/ or
      # scripts/*eval/. A PR touching only those would report any_go == false
      # and skip the check on a Go-only change. Format drift can come from any
      # Go file, so the check must not inherit that hole.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Guard — every tracked .go file is gofmt-clean
        run: make check-gofmt
      - name: "Guard: every tracked Go, code, YAML and markup file is claimed or excluded by kapi.yaml"
        run: make check-comment-coverage

      # Every em-dash part but one runs here, behind the same toolchain: the
      # matcher builds from its own module with GOWORK=off and imports only the
      # standard library, so it needs Go and no module download. The catalogs
      # part reads the extracted source catalogs, which are build artefacts
      # `make l10n-extract` produces from JSX, so it runs in the l10n workflow
      # instead, where that extract has just happened.
      #
      # Last in the job, because a step that fails hides every step after it,
      # and the docs allowance is the one here most likely to fail.
      - name: Guard — no em dash in any Go string literal
        run: ./scripts/check-em-dashes.sh --part go
      - name: Guard — no em dash in the UI source no catalog covers
        run: ./scripts/check-em-dashes.sh --part ui
      - name: Guard, no em dash in the reference prose or its dataset
        run: ./scripts/check-em-dashes.sh --part dossier
      - name: Guard — docs prose stays within its em-dash allowance
        run: ./scripts/check-em-dashes.sh --part docs

  # ── GitHub Actions Lint ──────────────────────────────────────────────────
  gha-lint:
    name: Actions Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7

      # Installed with go install, so the module checksum database verifies
      # what is fetched.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflow files
        run: |
          "$(go env GOPATH)/bin/actionlint"

  # ── The build cache pull requests read ────────────────────────────────────
  # A pull request's Go jobs compile without the race detector and restore the
  # "pr" build-cache flavor. Nothing else on main compiles that way, and a pull
  # request cannot read a cache another pull request saved, so this job is the
  # one writer of that flavor. It compiles every workspace module's packages
  # and test binaries the way those jobs do, and setup-go-modules saves the
  # result when the job ends. No other job waits for it.
  warm-pr-cache:
    name: Warm the pull request build cache
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    # The job deletes the copy of the cache it replaces (see the last step).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # Restore only: the job saves the build cache itself below, so the old
      # and new copies of this 2 GiB family overlap for seconds, not for the
      # rest of the run before the Cache Budget prune.
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
      # The desktop apps link GTK and WebKit through Wails, and the linter
      # compiles those packages on a pull request.
      - name: Install Linux dependencies for Wails
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config
      - name: Note when compiling starts
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Compile what pull request jobs compile
        run: make warm-build-cache
      - name: Resolve the Go build cache path
        id: gocache
        run: echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # The restored cache holds every object an earlier main commit compiled,
      # and each save would carry them all forward: the cache grew from 2.1 to
      # 3.2 GiB in a day. Go stamps an entry it uses when the entry's stamp is
      # over an hour old, so a file whose stamp is still more than an hour
      # before this run started was not used by it. Deleting those leaves what
      # pull requests compile today.
      - name: Drop the cache entries this run did not use
        env:
          GOCACHE_DIR: ${{ steps.gocache.outputs.build }}
          START: ${{ steps.start.outputs.epoch }}
        run: |
          set -euo pipefail
          before=$(du -sm "$GOCACHE_DIR" | cut -f1)
          find "$GOCACHE_DIR" -type f ! -newermt "@$((START - 3700))" -delete
          echo "Go build cache: ${before} MiB before, $(du -sm "$GOCACHE_DIR" | cut -f1) MiB after dropping unused entries"
      # The key setup-go-modules restores by prefix (flavor "pr").
      - name: Save the pull request build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.build }}
          key: go-build-${{ runner.os }}-go1.27.4-pr-trimpath-${{ github.sha }}
      - name: Delete the copy it replaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci-cache-budget.py prune

  # The build cache each lint-tags leg reads: the export data of the packages
  # that leg lints and of their dependencies, compiled for its configuration.
  # Nothing is linked and no test binary is built. This job is the one writer
  # of each lint-<config> flavor.
  warm-lint-cache:
    name: Warm the lint cache (${{ matrix.config }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    # The prune step deletes the superseded copy of each cache family.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        config: [model, js-wasm, windows, darwin-nocgo]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: lint-${{ matrix.config }}
          save-cache: "false"
      - name: Compile the export data the leg reads
        env:
          LINT_CONFIG: ${{ matrix.config }}
        run: make warm-lint-cache LINT_CONFIG="$LINT_CONFIG"
      - name: Resolve the Go build cache path
        id: gocache
        run: echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Saved here, then the older copy deleted at once, so the flavor counts
      # twice against the cache budget for seconds rather than until the
      # scheduled prune.
      - name: Save the lint-${{ matrix.config }} build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.build }}
          key: go-build-${{ runner.os }}-go1.27.4-lint-${{ matrix.config }}-trimpath-${{ github.sha }}
      - name: Delete the superseded copies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci-cache-budget.py prune

  # ── go mod tidy drift check ──────────────────────────────────────────────
  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"

      # Job body lives in `make ci-tidy` (single source of truth).
      - name: Check go.mod tidiness
        run: make ci-tidy

  # ── Module boundaries (package-level license/architecture guards) ─────────
  module-boundaries:
    name: Module boundaries
    runs-on: ubuntu-latest
    needs: changes
    # any_go covers a bowrain/core regression; kapi_desktop covers a desktop-only
    # PR reaching for cobra/cli, which any_go (no apps/kapi-desktop filter) skips.
    # ts_boundary covers a frontend-only PR, whose licence crossing lives in
    # TypeScript and shows up in neither of the other two filters.
    if: needs.changes.outputs.any_go == 'true' || needs.changes.outputs.kapi_desktop == 'true' || needs.changes.outputs.ts_boundary == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"

      - name: Install Wails libraries for desktop package analysis
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev

      # Job body lives in `make check-module-boundaries` (single source of truth).
      - name: Assert package-level module boundaries
        run: make check-module-boundaries
      # The host configuration. Each lint-tags leg runs the guards under its own.
      - name: Assert only the projector writes the context stores
        run: make check-projection-writes GUARD_CONFIGS=host
      - name: Assert a document reaches a file only where the edit guard lists it
        run: make check-edit-writes GUARD_CONFIGS=host
      - name: Assert project content reaches a file through core/rootpath or the file home
        run: make check-path-reads

  # ── Build (runs in parallel with test/lint) ───────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"

      # Job body lives in `make ci-build` (single source of truth, runnable
      # locally). It builds all three binaries with bare `go build` (no fts5)
      # and asserts the GOWORK=off module-isolation boundaries. wails,
      # labstack-echo and keycloak are bowrain-side deps that must not leak
      # into kapi. coreos/go-oidc and aws-sdk's ssooidc reach kapi legitimately
      # via sigstore-go (cosign signature verification of plugin tarballs).
      - name: Build binaries + verify module isolation
        run: make ci-build

  # ── The one required check ────────────────────────────────────────────────
  # The main branch requires this job and no other. It answers for every job
  # above, and on a pull request for every other workflow on the same commit,
  # so `gh pr merge --auto` merges when all of it is green.
  #
  # `needs` lists every job, and `scripts/ci-passed.py needs` (a repo guard)
  # fails when one is missing: a job outside the list would not hold a merge.
  # `if: always()` matters: without it a failed need skips this job, and a
  # skipped required check counts as passed.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - frontend
      - frontend-packages
      - kapi-desktop
      - kapi-desktop-backend
      - desktop-bindings
      - bowrain-desktop
      - bowrain-desktop-backend
      - neokapi-i18n
      - harness
      - test-framework
      - test-wasm-stores
      - test-platform
      - test-cli
      - face-parity
      - test-kapi
      - test-bowrain-plugin
      - test-bowrain
      - test-plugins
      - test-integration
      - migration-schema
      - eval-index
      - race-changed
      - coverage
      - lint-framework
      - lint-platform
      - lint-plugins
      - lint-scripts
      - lint-tags
      - fieldguard
      - docs-guard
      - gha-lint
      - warm-pr-cache
      - warm-lint-cache
      - tidy-check
      - module-boundaries
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Every job of this workflow passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-passed.py jobs
      # The path-filtered workflows (E2E, the docs builds, format acceptance
      # and the rest) cannot be required themselves: a pull request outside
      # their paths never reports them and would wait forever.
      - name: Every other workflow on this commit passed
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-passed.py workflows
