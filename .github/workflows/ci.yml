name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch exists so the push-only lanes can be exercised on a branch
  # before they reach main. The `changes` filter step runs on pull_request only,
  # so on a dispatch its outputs are empty and the path-gated jobs skip: what
  # runs is the set gated on `github.event_name != 'pull_request'`.
  workflow_dispatch:

# Cancel superseded runs on the same PR; never cancel a push to main (each
# main commit's run is the canonical record and must complete).
#
# Pushes group by commit, not by ref. Grouping every main push under
# refs/heads/main did not achieve the second half of that sentence:
# cancel-in-progress protects the run that is *executing*, but GitHub keeps only
# one *pending* run per group, so a third commit evicts the second while it is
# still queued. Under merge pressure four consecutive main runs ended
# `cancelled`, and push-only lanes — the integration suite, coverage, and the
# race/shuffle profile the PR gate deliberately skips — were skipped with them.
# One group per SHA means a busy day costs runner minutes instead of coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  # ── Detect which modules changed ──────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ github.event_name == 'push' || steps.filter.outputs.framework }}
      cli: ${{ github.event_name == 'push' || steps.filter.outputs.cli }}
      platform: ${{ github.event_name == 'push' || steps.filter.outputs.platform }}
      migrations: ${{ github.event_name == 'push' || steps.filter.outputs.migrations }}
      kapi: ${{ github.event_name == 'push' || steps.filter.outputs.kapi }}
      bowrain_plugin: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain_plugin }}
      bowrain: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend }}
      kapi_desktop: ${{ github.event_name == 'push' || steps.filter.outputs.kapi_desktop }}
      bowrain_desktop: ${{ github.event_name == 'push' || steps.filter.outputs.bowrain_desktop }}
      i18n_react: ${{ github.event_name == 'push' || steps.filter.outputs.i18n_react }}
      workflows: ${{ github.event_name == 'push' || steps.filter.outputs.workflows }}
      plugins: ${{ github.event_name == 'push' || steps.filter.outputs.plugins }}
      faces: ${{ github.event_name == 'push' || steps.filter.outputs.faces }}
      # Every operand is compared to 'true' on purpose. GitHub's `||` returns
      # the first TRUTHY operand rather than a boolean, and a non-empty string
      # is truthy — so a bare `steps.filter.outputs.cli` yields the *string*
      # 'false' and short-circuits the rest of the chain. Chaining bare outputs
      # collapses the whole expression to the first one: `any_go` was exactly
      # `framework`, and the three jobs it gates (Build, Tidy Check, Race) were
      # skipped on every PR that did not touch core/, go.mod, go.sum, go.work
      # or this file. The single-filter outputs above are safe because they have
      # nothing to short-circuit past — do not chain one without `== 'true'`.
      any_go: ${{ github.event_name == 'push' || steps.filter.outputs.framework == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.platform == 'true' || steps.filter.outputs.kapi == 'true' || steps.filter.outputs.bowrain_plugin == 'true' || steps.filter.outputs.bowrain == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")

          check_paths() {
            local label="$1"; shift
            for pattern in "$@"; do
              # Support negation patterns (prefixed with !)
              if [[ "$pattern" == !* ]]; then continue; fi
              if echo "$CHANGED" | grep -qE "$pattern"; then
                echo "${label}=true" >> "$GITHUB_OUTPUT"
                return
              fi
            done
            echo "${label}=false" >> "$GITHUB_OUTPUT"
          }

          # The framework is the ROOT module, and the root module is more than
          # core/: kpz/, memory/, terms/ and providers/ are all part of it, and
          # `make test-framework` runs `go test ./...` from the root, so the job
          # already covers them. Only this filter did not — a PR touching just
          # kpz/ reported framework=false, which skipped Test (framework) AND,
          # through any_go, Build, Race and Tidy Check. #1612 (a kpz fix) landed
          # with five checks and no Go test run at all, which is how this was
          # found. cmd/ and examples/ are in the module too but hold only
          # binaries and samples; they are covered by the post-merge full run.
          #
          # scripts/ is NOT one of those. It holds tests that fail this job —
          # coordinatereport's drift gate, checkeval — so a PR editing one of
          # them skipped the only job that runs it, and the break surfaced on
          # main instead. That is the same shape as the kpz case above, found
          # the same way: by a PR fixing a scripts/ test and getting no Go run.
          check_paths framework '^(core|kpz|memory|terms|providers|scripts)/' '^go\.(mod|sum)$' '^go\.work' '^\.github/workflows/ci\.yml$'
          check_paths cli       '^(cli|host)/'
          check_paths platform  '^bowrain/core/'
          # A baseline edit is the one change that can take production down
          # while every PR check passes, so it gets its own filter.
          check_paths migrations '^bowrain/[a-z_]+/migrations\.go$' '^bowrain/migrations/'
          # kapi: anything under kapi/
          if echo "$CHANGED" | grep -E '^kapi/' | grep -q .; then
            echo "kapi=true" >> "$GITHUB_OUTPUT"
          else
            echo "kapi=false" >> "$GITHUB_OUTPUT"
          fi
          check_paths bowrain_plugin '^bowrain/plugin/'
          # bowrain: anything under bowrain/ except frontend app dirs, packages/, bowrain/core/, bowrain/plugin/, docker/, and deploy/
          if echo "$CHANGED" | grep -E '^bowrain/' | grep -vE '^bowrain/(apps/(web|bowrain/frontend|keycloak-theme|ctrl|pulse)|packages/|emails/|core/|plugin/|docker/|deploy/)' | grep -q .; then
            echo "bowrain=true" >> "$GITHUB_OUTPUT"
          else
            echo "bowrain=false" >> "$GITHUB_OUTPUT"
          fi
          # The shared JS dependency graph. A change to the lockfile, the root
          # package.json (hoisted devDeps + overrides) or the workspace config
          # (catalog / overrides / hoisting) re-resolves dependencies for EVERY
          # workspace package — so it must turn on every JS test filter. Without
          # this, a root-only devDep bump (jsdom, jest-dom) matches none of the
          # per-package paths below, the per-package suites skip, and a breaking
          # bump merges all-green — caught only by the post-merge push run once
          # main is already red (jsdom 30 → i18n-react CSS.escape, #1646).
          js_deps=( '^pnpm-lock\.yaml$' '^package\.json$' '^pnpm-workspace\.yaml$' )

          check_paths frontend  '^bowrain/apps/(web|bowrain/frontend|ctrl|pulse|keycloak-theme)/' '^bowrain/packages/(ui|app)/' '^bowrain/emails/' "${js_deps[@]}"
          check_paths kapi_desktop '^apps/kapi-desktop/' '^packages/(ui|flow-editor)/' "${js_deps[@]}"
          check_paths bowrain_desktop '^bowrain/apps/bowrain/' '^bowrain/packages/ui/' "${js_deps[@]}"
          check_paths i18n_react '^packages/(kapi-format|i18n-react)/' "${js_deps[@]}"
          check_paths workflows '^\.github/workflows/'
          check_paths plugins  '^plugins/'
          # The three faces of one question, plus the record they are held to.
          # Each leg lives in the module of the face it drives, so a PR touching
          # one face would otherwise run one leg and merge a disagreement.
          check_paths faces '^(cli|host)/' '^apps/kapi-desktop/backend/' '^kapi/'

  # ── Frontend checks & builds ─────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): ci-frontend typechecks the shared
    # frontend surfaces, so a cross-cutting TS break — e.g. a shared @neokapi/ui
    # api type the desktop WailsApiAdapter must implement — is caught pre-merge
    # instead of surfacing only on the post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.frontend == 'true'
    # The derived-catalog gate lives in l10n.yml, so this job needs no write
    # access to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The committed lockfile must be exactly what the pinned pnpm produces.
      # setup-node-ui above already ran `vp install --frozen-lockfile`, which
      # proves the lockfile agrees with package.json but not that it was written
      # by our pinned resolver. Runs before the heavy checks so a resolver-skewed
      # lockfile (typically a Dependabot npm PR) fails fast.
      - name: Guard — lockfile is what the pinned pnpm produces
        run: ./scripts/check-lockfile-idempotent.sh

      # Job body lives in `make ci-frontend` (single source of truth, runnable
      # locally). See the "CI job bodies (thin-CI)" section of the Makefile.
      - name: Check + test + build the bowrain web frontends
        run: make ci-frontend

  # ── Kapi Desktop frontend ───────────────────────────────────────────────
  kapi-desktop:
    name: Kapi Desktop
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kapi_desktop == 'true'
    # The derived-catalog gate lives in l10n.yml, so this job needs no write
    # access to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-kapi-desktop-frontend` (single source of
      # truth, runnable locally). The Go backend test stays a separate step
      # below because it needs the Go + Wails toolchain set up in the workflow.
      - name: Frontend checks, tests, and Storybook build
        run: make ci-kapi-desktop-frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run Kapi Desktop Go backend tests
        run: make kapi-desktop-test

      # The generated Wails bindings are committed AND regenerated by
      # release.yml, so the shipped app gets fresh bindings while local dev,
      # `wails3 dev` and the typecheck above all build against the committed
      # copy. Nothing reconciled the two, so they rotted: at the time this gate
      # landed the committed copy still exported 36 pre-#1462 TM/termbase
      # methods and referenced two deleted packages.
      #
      # This is the always-relevant half of the desktop job — the job is
      # path-gated on ^apps/kapi-desktop/, which covers both the backend Go
      # files the bindings derive from and the bindings directory itself, and
      # pushes to main run it unconditionally (so drift originating in
      # core/ or host/ model types is still caught post-merge). It needs only the
      # Go toolchain set up above and the wails3 CLI below — generation is
      # cgo-off, so no C toolchain — and reuses this job's Go build cache.
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli

      - name: Kapi Desktop Wails bindings are fresh
        run: make check-kapi-desktop-bindings

  # ── Desktop bindings, for the changes the desktop jobs cannot see ────────
  # The two desktop jobs run their own freshness gate, but they are path-gated
  # on the app and UI directories — so a change to a Go type the bindings are
  # DERIVED from does not reach either of them. The Kapi Desktop job's comment
  # names the consequence and accepts it: drift originating in core/ or host/
  # "is still caught post-merge". Post-merge means main is red, and the pull
  # request that caused it has already gone.
  #
  # That happened: #2144 added Coordinates to project.Defaults and
  # project.Collection, the committed bindings were not regenerated, and main
  # stayed red on the gate until an unrelated pull request happened to touch
  # apps/kapi-desktop and finally ran it.
  #
  # So the same gate runs on the changes that can cause the drift: the Go
  # toolchain, node for the id map, and the wails3 CLI — no frontend build and
  # neither desktop job's test wall.
  #
  # The system libraries are for BUILDING the wails3 CLI, not for running it.
  # Binding generation is cgo-off, but `go install .../cmd/wails3` compiles
  # wails itself, and on Linux that needs the GTK and WebKit headers — which is
  # why both desktop jobs install them before the same step.
  desktop-bindings:
    name: Desktop bindings
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.platform == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui
      - uses: ./.github/actions/setup-go-modules
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli
      - name: Kapi Desktop Wails bindings are fresh
        run: make check-kapi-desktop-bindings
      - name: Bowrain Desktop Wails bindings are fresh
        run: make check-bowrain-desktop-bindings

  # ── Bowrain Desktop (Wails app: frontend vitest + Go backend) ────────────
  bowrain-desktop:
    name: Bowrain Desktop
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bowrain_desktop == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-bowrain-desktop-frontend`. The Go backend
      # test stays a separate step below (needs the Go + Wails toolchain).
      - name: Frontend tests
        run: make ci-bowrain-desktop-frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # The Wails app backend links the GTK/WebKit runtime on Linux; these dev
      # packages also pull in libicu-dev that the framework's cgo build needs.
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run Bowrain Desktop Go backend tests
        run: make bowrain-desktop-test

      # Same committed-plus-regenerated-at-release split as kapi-desktop (see
      # that job). This app is where the drift actually bit: #1462 renamed seven
      # TM→Memory wrappers in the committed app.js but left the ids, which are
      # hashes of the Go method names — so the names typechecked while every one
      # of those calls dispatched to a hash of a method that no longer exists.
      - name: Install wails3 CLI (pinned to the app's wails module)
        run: make wails3-cli

      - name: Bowrain Desktop Wails bindings are fresh
        run: make check-bowrain-desktop-bindings

  # ── Kapi React (TS extractor + schema) ──────────────────────────────────
  neokapi-i18n:
    name: Kapi React
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.i18n_react == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # Job body lives in `make ci-i18n-react` (single source of truth).
      - name: Typecheck + validate + test + build kapi-format and neokapi-i18n
        run: make ci-i18n-react

  # ── Go tests (parallel per module) ────────────────────────────────────────
  test-framework:
    name: Test (framework, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Pinned Go only. The forward-compat `stable` canary moved to the
        # nightly workflow (nightly.yml) — it was a push-only leg whose
        # coverage/artifacts were discarded anyway, so keeping it out of the
        # per-commit path removes a whole test leg (and its build cache) from
        # both PR and push.
        go-version: ["1.27.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          go-version: ${{ matrix.go-version }}

      # xmllint enforces the DocLang XSD conformance test (core/formats/doclang);
      # without it that test self-skips. Tiny package; keeps the schema gate real.
      - name: Install xmllint (DocLang XSD conformance)
        uses: ./.github/actions/apt-install
        with:
          packages: libxml2-utils

      - name: Run framework tests
        id: run-tests
        run: make test-framework
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-framework.json
          out: junit-framework.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Framework Tests (Go ${{ matrix.go-version }})
          path: junit-framework.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      # Coverage is produced only on the full gate (push/nightly); PR fast runs
      # build without -coverprofile so Go can cache unchanged packages.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-framework
          path: coverage/framework.out

      - name: Upload native test results
        uses: actions/upload-artifact@v7
        if: always() && matrix.go-version == '1.27.0'
        with:
          name: test-results-native
          path: test-results-framework.json
          retention-days: 1

  test-platform:
    name: Test (platform)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.platform == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run platform tests
        id: run-tests
        run: make test-platform
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: bowrain/test-results-platform.json
          out: junit-platform.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Platform Tests
          path: junit-platform.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-platform
          path: coverage/platform.out
          retention-days: 1

  test-cli:
    name: Test (cli)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run cli tests
        id: run-tests
        run: make test-cli
        continue-on-error: true

      - name: Show cli test failures
        if: steps.run-tests.outcome == 'failure'
        run: bash scripts/print-go-test-failures.sh test-results-cli.json

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-cli.json
          out: junit-cli.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: CLI Tests
          path: junit-cli.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-cli
          path: |
            coverage/cli.out
            coverage/host.out
          retention-days: 1

  face-parity:
    name: Face parity (CLI/MCP/desktop)
    runs-on: ubuntu-latest
    needs: changes
    # One job for three legs. They live in three modules — the desktop's links
    # Wails and cannot be linked beside the others — so a per-module job would
    # run one face's leg against a record the other faces never re-read, and a
    # disagreement would merge green. Any face changing runs all three.
    if: needs.changes.outputs.faces == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # The desktop leg compiles the backend package, which links Wails.
      - name: Install Wails system dependencies (Linux)
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Run the face parity suite
        run: make face-parity

  test-kapi:
    name: Test (kapi)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.kapi == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run kapi tests
        id: run-tests
        run: make test-kapi
        continue-on-error: true

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-kapi.json
          out: junit-kapi.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Kapi Tests
          path: junit-kapi.xml
          reporter: java-junit

      - name: Upload raw test output on failure
        uses: actions/upload-artifact@v7
        if: steps.run-tests.outcome == 'failure'
        with:
          name: test-results-kapi-failed
          path: test-results-kapi.json
          retention-days: 3

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-kapi
          path: coverage/kapi.out
          retention-days: 1

  # ── EngineService example clients (polyglot contract lock) ────────────────
  # Runs the Python and Node smoke-test clients from examples/ against a real
  # `kapi engine serve`: extract a JSON fixture → pseudo-translate via Process
  # → merge back, asserting the result is byte-identical to the CLI doing the
  # same. Locks the core/proto/engine/v1 contract from two foreign languages.
  engine-examples:
    name: Engine Examples (Python + Node)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.kapi == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: plain

      # python3 and node are preinstalled on ubuntu runners; the make target
      # creates a venv for the Python deps and npm-installs the Node deps.
      - name: Run engine example clients
        run: make engine-examples

  test-bowrain-plugin:
    name: Test (Bowrain Plugin)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain_plugin == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # The shared setup action already downloads bowrain/plugin (it is in its
      # "all" set). What is not shared is `go mod verify`: the action omits it
      # everywhere as per-job overhead, and the plugin is the one module where
      # it is worth paying, being a separately licensed binary shipped to users.
      - name: Download plugin modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: bowrain/plugin

      - name: Verify plugin modules
        run: cd bowrain/plugin && go mod verify

      - name: Run Bowrain Plugin tests
        id: run-tests
        run: make test-bowrain-plugin
        continue-on-error: true

      - name: Convert plugin tests to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: bowrain/test-results-bowrain-plugin.json
          out: junit-bowrain-plugin.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Bowrain Plugin Tests
          path: junit-bowrain-plugin.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-bowrain-plugin
          path: |
            coverage/bowrain-plugin.out
          retention-days: 1

  test-bowrain:
    name: Test (bowrain)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain == 'true'
    services:
      # A stable GitHub-managed Postgres for the full (push) bowrain suite.
      # Previously the Postgres-backed server tests spun up a per-binary
      # testcontainer; Ryuk/Docker can reap it mid-run under -race, taking ~80
      # server tests down together with "connection refused" (the long-standing
      # Test (bowrain) flake). pgtest prefers BOWRAIN_TEST_POSTGRES_URL and just
      # creates an isolated schema per test in it, so this is immune to that.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Only push runs exercise the Postgres suites (PRs use -short, which skips
      # them — keeps PR speed). Empty on PRs so they don't touch the service.
      BOWRAIN_TEST_POSTGRES_URL: ${{ github.event_name == 'push' && 'postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run bowrain tests
        id: run-tests
        run: make test-bowrain
        continue-on-error: true

      # The suite pipes `go test -json` to a file, so failing test names never
      # reach the step log. Surface them (and the relevant output) on failure so
      # a red bowrain run is debuggable without re-running locally.
      - name: Show failed bowrain tests
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo "::group::Failed tests"
          jq -r 'select(.Action=="fail" and .Test!=null) | "\(.Package)\t\(.Test)"' test-results-bowrain.json | sort -u || true
          echo "::endgroup::"
          echo "::group::Failure output"
          # -A 3: testify writes the cause on the lines AFTER "Error:", so a
          # line-matching grep shows "Received unexpected error:" and drops the
          # error itself — which is the only part worth reading.
          jq -r 'select(.Action=="output") | .Output' test-results-bowrain.json \
            | grep -aA 3 -E "panic:|DATA RACE|Error Trace|Error:|FAIL|expected|actual|connection refused|cannot|no such|context deadline|\.go:[0-9]+:" | head -300 || true
          echo "::endgroup::"

      - name: Upload bowrain test JSON (on failure)
        if: steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bowrain
          path: test-results-bowrain.json
          retention-days: 3

      - name: Convert to JUnit XML
        if: always()
        uses: ./.github/actions/go-junit-report
        with:
          in: test-results-bowrain.json
          out: junit-bowrain.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Bowrain Tests
          path: junit-bowrain.xml
          reporter: java-junit

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push'
        with:
          name: coverage-bowrain
          path: coverage/bowrain.out
          retention-days: 1

  # ── Plugin modules ────────────────────────────────────────────────────────
  # plugins/{sat,check,vision,asr,sourcecode} are separate go.mod modules outside
  # go.work, so no other job here compiles them, let alone tests them: 15 test
  # files across four modules ran in no workflow at all. `make test-plugins` needs
  # nothing but a Go toolchain, so unlike the Postgres-backed lanes this one
  # belongs on the PR gate, where a break is cheapest to fix.
  #
  # Not covered here on purpose: plugins/pdfium links libpdfium, and the
  # `-tags onnx` suites for vision and sat need a real onnxruntime — those stay
  # in the nightly vision-onnx / vision-pdf-e2e jobs. plugins/av ships no tests.
  # plugins/sourcecode IS covered: its cgo is vendored grammar C with no system
  # library behind it, so it builds anywhere the Go toolchain does.
  test-plugins:
    name: Test (plugins)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
      # No setup-go-modules: that action primes the go.work modules, and these
      # four are outside it. Each recipe runs GOWORK=off in its own module.
      - name: Test the pure-Go plugin modules
        run: make test-plugins
  # ── The //go:build integration lane ───────────────────────────────────────
  # The cross-store correctness suites: content-memory and terms parity between
  # SQLite and Postgres, the governed change-set lifecycle, and the knowledge
  # HTTP surface against a real database. They sit behind `//go:build
  # integration`, so no other job in this file compiles them — before this job
  # existed `make test-integration` was reachable only by hand, and it did not
  # work when you did reach it (it dropped the fts5 tag and filtered itself down
  # with `-run Integration`).
  #
  # Push and manual dispatch only, matching the policy for every other
  # Postgres-backed suite here: PRs run -short and skip them to keep the wall
  # fast. scripts/test-integration.sh narrows the run to the packages that
  # actually carry a tagged file, so this is not a second full test wall.
  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    services:
      # Same GitHub-managed Postgres as Test (bowrain), for the same reason: a
      # per-binary testcontainer can be reaped mid-run by Ryuk under -race.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOWRAIN_TEST_POSTGRES_URL: postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run the integration lane
        run: make test-integration

  # ── The schema a baseline builds, on PRs that edit one ───────────────────
  # TestBaselineSchemaMatchesGolden states what schema the migrations build, so
  # a baseline edit that changes it has to say so in the diff. It lives in the
  # integration lane above, which is push-only — and a baseline edit is exactly
  # the change that can pass every PR check and still take production down.
  #
  # It did. #2143 renamed workspaces.brand_voice_profile_id inside a CREATE
  # TABLE IF NOT EXISTS without bumping the baseline version, so the column
  # moved for a database built after the rename and stayed put for the one
  # running, while all seven queries moved. Every workspace request 500ed with
  # `column w.voice_profile_id does not exist`. The golden had been failing
  # since that PR; nothing on either PR ran it.
  #
  # This is not the whole integration lane moved to PRs — that policy is
  # deliberate and the wall stays fast. It is one test, on the one path where
  # being wrong is an outage, and only when a migration file changed.
  migration-schema:
    name: Migration schema
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowrain
          POSTGRES_PASSWORD: bowrain
          POSTGRES_DB: bowrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bowrain -d bowrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOWRAIN_TEST_POSTGRES_URL: postgres://bowrain:bowrain@localhost:5432/bowrain_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      - name: The schema the baselines build matches the golden
        run: go test -tags "fts5,integration" ./migrations/ -run 'TestBaselineSchemaMatchesGolden|TestBaselineVersionsSitAboveRetiredOnes' -v
        working-directory: bowrain

  # ── Race pass over changed packages (PR only) ─────────────────────────────
  # The PR test wall deliberately drops -race (Makefile fast profile) and main
  # is unprotected, so a data race introduced in a PR could merge green and only
  # surface on the push/nightly full gate. This job closes that window cheaply:
  # it races ONLY the Go packages the PR changed (scripts/test-race-changed.sh;
  # capped with a fixed-core-set fallback so a wide refactor can't turn it into
  # a second full test wall). -short keeps the slow suites out.
  race-changed:
    name: Race (changed packages)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.any_go == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-modules
        with:
          # Dedicated flavor: these builds ARE race-instrumented, unlike the PR
          # wall's "pr" flavor, and only cover a slice of packages, unlike the
          # push wall's "race" flavor. Passing "race" here would be rewritten to
          # "pr" on pull_request (see the action), poisoning that cache with
          # instrumented objects — so key it separately.
          cache-flavor: race-changed

      - name: Race-test changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make test-race-changed

  # ── Merge coverage from all test jobs ─────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-framework, test-cli, test-platform, test-kapi, test-bowrain-plugin, test-bowrain]
    # Coverage is collected and pushed to Codecov on the full gate only. PR fast
    # runs skip -coverprofile (it disables Go's test cache), so there is nothing
    # to merge — and uploading near-empty coverage would spam Codecov PR comments.
    if: always() && !cancelled() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge coverage
        run: |
          # Start with framework coverage (has the header line)
          if [ -f framework.out ]; then
            cp framework.out coverage.out
          else
            echo "mode: atomic" > coverage.out
          fi
          # Append remaining files (skip header line)
          for f in cli.out host.out platform.out kapi.out bowrain-plugin.out bowrain.out; do
            if [ -f "$f" ]; then
              tail -n +2 "$f" >> coverage.out
            fi
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint-framework:
    name: Lint (framework)
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): golangci-lint covers the whole module,
    # so a lint break anywhere is caught pre-merge rather than only on the
    # post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.framework == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.kapi == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # The .golangci.yml build-tags include fts5, so golangci-lint must compile
      # the cgo ICU tokenizer / FTS5 path; that needs libicu-dev + pkg-config
      # (mirroring the test jobs). Without it those files are silently skipped.
      - name: Install cgo deps (ICU)
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Download modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: ". host cli kapi"

      # golangci-lint compiles the module, and core/i18n / host/i18n resolve
      # `//go:embed catalogs/*.mo` against build output — the repository carries
      # the translated JSON it is compiled from, not the MO.
      - name: Compile the embedded i18n catalogs
        run: go run ./core/i18n/gen/catalogs

      - name: Lint framework
        uses: ./.github/actions/golangci
        with:
          working-directory: .

      - name: Lint host
        uses: ./.github/actions/golangci
        with:
          working-directory: host

      - name: Lint cli
        uses: ./.github/actions/golangci
        with:
          working-directory: cli

      - name: Lint kapi
        uses: ./.github/actions/golangci
        with:
          working-directory: kapi

  lint-platform:
    name: Lint (platform)
    runs-on: ubuntu-latest
    needs: changes
    # Always run on PRs (not path-gated): golangci-lint covers the whole bowrain
    # module, so a lint break anywhere is caught pre-merge rather than only on the
    # post-merge full run.
    if: github.event_name == 'pull_request' || needs.changes.outputs.platform == 'true' || needs.changes.outputs.bowrain_plugin == 'true' || needs.changes.outputs.bowrain == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Create embed placeholders
        run: |
          mkdir -p bowrain/apps/web/dist && echo placeholder > bowrain/apps/web/dist/index.html
          mkdir -p bowrain/apps/bowrain/frontend/dist && echo placeholder > bowrain/apps/bowrain/frontend/dist/index.html

      - name: Download modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: "bowrain/core bowrain"

      # Every module linted below links core/i18n or host/i18n, whose embedded
      # gettext catalogs are build output. The compiler is a cgo build, hence
      # the ICU headers here rather than only before the Wails lint below.
      - name: Install ICU for the catalog compiler
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Compile the embedded i18n catalogs
        run: go run ./core/i18n/gen/catalogs

      - name: Lint platform
        uses: ./.github/actions/golangci
        with:
          working-directory: bowrain/core

      - name: Lint Bowrain plugin
        uses: ./.github/actions/golangci
        with:
          working-directory: bowrain/plugin

      - name: Install Linux dependencies for Wails
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev libicu-dev pkg-config

      - name: Lint bowrain
        uses: ./.github/actions/golangci
        with:
          working-directory: bowrain

  # ── Docs stay bowrain-clean (always-on, cheap) ───────────────────────────
  docs-guard:
    name: Repo guards
    runs-on: ubuntu-latest
    # No path gate: these guards are ~seconds, so running them on every PR is
    # cheap belt-and-suspenders — a stray bowrain reference, absolute home path,
    # or gofmt drift (or a stale guard) can't merge and surface only post-merge.
    steps:
      - uses: actions/checkout@v7
      - name: Guard — neokapi docs must stay bowrain-clean
        run: ./scripts/check-docs-bowrain-clean.sh
      - name: Guard — no absolute home paths in tracked files
        run: ./scripts/check-abs-paths.sh
      - name: Guard — no retired framing in user-facing prose
        run: ./scripts/check-vocabulary.sh
      - name: Guard — the Kapi Desktop surface names no interchange format
        run: ./scripts/check-desktop-interchange.sh
      - name: Guard — every local action reference resolves where its job checks out
        run: ./scripts/check-local-actions.sh

      - name: Deploy workflow covers the framework
        run: ./scripts/check-deploy-paths.sh
      - name: Guard — every run projection is declared, never hand-rolled
        run: ./scripts/check-run-projection.sh
      # The docs jobs build two sites in two locales and sit late in CI, so an
      # unresolvable doc id costs a full round trip to learn. This says it in a
      # second, on every PR, for both sidebars at once.
      - name: Guard — every sidebar doc id resolves to a page
        run: ./scripts/check-sidebar-ids.sh
      - name: Guard — reference dataset is reproducible from this repo
        run: ./scripts/check-reference-provenance.sh
      - name: Guard — publishable packages declare a license and ship its text
        run: ./scripts/check-package-licenses.sh
      - name: Guard — release archives ship the license text of the work inside
        run: ./scripts/check-archive-licenses.sh
      - name: Guard — plugin tarballs ship the license text of the work inside
        run: ./scripts/check-plugin-licenses.sh
      - name: Guard — no compiled executable is tracked in git
        run: ./scripts/check-tracked-binaries.sh
      - name: Guard — no plugin release claims the repo's "latest"
        run: ./scripts/check-plugin-release-latest.sh

      # The gate itself runs only in the nightly convergence, where nothing
      # exercises it on a pull request. Its self-test does: it drives the real
      # classification against real scratch repositories, so a change to the
      # derived set or to the classification cannot pass here and disarm the
      # nightly there.
      - name: Guard — the sync commits only what the committed context explains
        run: ./scripts/check-sync-backed.sh --self-test

      # Same reason, one step further along: the delivery that carries a
      # scheduled job's output to a reviewable pull request also runs nowhere a
      # pull request would notice. Its self-test drives the real staging, push
      # and refresh against scratch repositories with a real remote.
      - name: Guard — scheduled output is delivered as a reviewable pull request
        run: ./scripts/auto-pr.sh --self-test

      # Same reason again: the plugin formula generator runs only on a
      # `<plugin>-v*` tag, so nothing before a release exercises it. Its
      # self-test renders every plugin from a synthetic checksum set and checks
      # that an incomplete one is refused — the failure mode that matters, since
      # a formula with an empty platform block installs nothing and reports
      # success.
      - name: Guard — a plugin's Homebrew formula renders from its release
        run: ./scripts/gen-brew-plugin-formula.sh --self-test

      # The packager runs only on a release tag too. Its self-test packages a
      # dummy tree and reads the archives back, because an archive that
      # misdeclares itself looks green everywhere else: the release publishes,
      # the formulae install, and only `kapi plugins list` on a user's machine
      # reports the version — which is where `0.0.0-dev` shipped from.
      - name: Guard — a released archive declares the version it was cut at
        run: ./scripts/package-cli.sh --self-test

      # Both release tracks resolve their channel through one script, over tag
      # shapes that differ between them. Its self-test runs every shape and
      # checks that the workflows still call it: an inline copy of the test is
      # how the bowrain track came to read a prefix hyphen as a prerelease.
      - name: Guard — a final tag publishes stable on both release tracks
        run: ./scripts/release-channel.sh --self-test

      # The fixture guard expands the extract globs the way the extractor does,
      # so it needs `fs/promises.glob` — Node 22. No dependencies: it reads the
      # flag sets from `make l10n-extract-globs` and globs the working tree.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Guard — no test or story file is extracted into a shipped catalog
        run: node scripts/check-extract-fixtures.mjs

      # gofmt needs a toolchain, but no modules — gofmt is purely syntactic, so
      # this is a bare setup-go with the cache off and adds ~10s.
      #
      # This guard lives here, ungated, rather than in the Go-gated `tidy-check`
      # job on purpose. `any_go` is the OR of the six module filters in the
      # `changes` job (core/, cli|host/, bowrain/core|plugin/, kapi/, bowrain/),
      # none of which match apps/kapi-desktop/, plugins/sat/, harness/ or
      # scripts/*eval/. A PR touching only those would report any_go == false
      # and skip the check on a Go-only change. Format drift can come from any
      # Go file, so the check must not inherit that hole.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false
      - name: Guard — every tracked .go file is gofmt-clean
        run: make check-gofmt

  # ── GitHub Actions Lint ──────────────────────────────────────────────────
  gha-lint:
    name: Actions Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/v1.7.10/scripts/download-actionlint.bash) 1.7.10

      - name: Lint workflow files
        run: ./actionlint

  # ── go mod tidy drift check ──────────────────────────────────────────────
  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: plain

      # Job body lives in `make ci-tidy` (single source of truth).
      - name: Check go.mod tidiness
        run: make ci-tidy

  # ── Module boundaries (package-level license/architecture guards) ─────────
  module-boundaries:
    name: Module boundaries
    runs-on: ubuntu-latest
    needs: changes
    # any_go covers a bowrain/core regression; kapi_desktop covers a desktop-only
    # PR reaching for cobra/cli — which any_go (no apps/kapi-desktop filter) skips.
    if: needs.changes.outputs.any_go == 'true' || needs.changes.outputs.kapi_desktop == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: plain

      # Job body lives in `make check-module-boundaries` (single source of truth).
      - name: Assert package-level module boundaries
        run: make check-module-boundaries

  # ── Build (runs in parallel with test/lint) ───────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_go == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: plain

      # Job body lives in `make ci-build` (single source of truth, runnable
      # locally): builds all three binaries with bare `go build` (no fts5,
      # matching this job's historical behavior) and asserts the GOWORK=off
      # module-isolation boundaries. wails / labstack-echo / keycloak are
      # bowrain-side deps that must not leak into kapi; coreos/go-oidc and
      # aws-sdk's ssooidc reach kapi legitimately via sigstore-go (cosign
      # signature verification of plugin tarballs).
      - name: Build binaries + verify module isolation
        run: make ci-build

