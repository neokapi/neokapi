name: Rebuild release images

# Each week, rebuild the images of the last Bowrain release from that
# release's own source, so base-image fixes reach `latest` between releases.
# `latest` keeps meaning the last release; it is never built from main.
#
# The last release is the highest `bowrain-v*` version tag, release
# candidates included: release-bowrain.yml moves `latest` on every one of
# them. A rebuild publishes under its own tag, `<version>-r<YYYYMMDD>`,
# and moves `latest` to it; the release's version tag is never overwritten.
# A rebuild that scans worse than the image `latest` points at now, a finding
# the current image does not have, publishes nothing; so does a scan that
# cannot prove it read the image (scripts/image-scan-compare.py).
#
# A dispatch builds and scans only, on any branch. Only the schedule, on
# main, publishes (scripts/check-release-build-only.py holds the shape).
on:
  schedule:
    # Sunday 05:00 UTC, so Monday's container scan reads the rebuilt images.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and scan only; publish nothing (a dispatch always builds only)."
        type: boolean
        default: true
  push:
    branches: [weekly-image-rebuild]

permissions:
  contents: read

concurrency:
  group: rebuild-release-images
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.2

jobs:
  setup:
    name: Find the last release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      rebuild_tag: ${{ steps.r.outputs.rebuild_tag }}
      build_only: ${{ steps.r.outputs.build_only }}
    steps:
      - id: r
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          build_only=true
          if [ "$EVENT" = schedule ] && [ "$REF" = refs/heads/main ]; then
            build_only=false
          fi
          # The highest bowrain-v* version tag, release candidates included,
          # with a release candidate below its release (~ sorts first).
          tag="$(git ls-remote --tags --refs "$REPO_URL" 'refs/tags/bowrain-v*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^bowrain-v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' \
            | sed 's/-rc/~rc/' | sort -V | tail -1 | sed 's/~rc/-rc/')"
          if [ -z "$tag" ]; then
            echo "::error::no bowrain-v* version tag found"
            exit 1
          fi
          version="${tag#bowrain-v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "rebuild_tag=$version-r$(date -u +%Y%m%d)"
            echo "build_only=$build_only"
          } >> "$GITHUB_OUTPUT"
          echo "last release: $tag; rebuild tag: $version-r$(date -u +%Y%m%d); build only: $build_only"

  # Builds each image from the release tag into an OCI archive, with an SBOM
  # and provenance attestation as a release build has, and scans it. Nothing
  # here holds a write permission or a secret.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bowrain-server, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: bowrain-server, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { image: bowrain-worker, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: bowrain-worker, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { image: bowrain-web, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: bowrain-web, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { image: bowrain-keycloak, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, ignorefile: .github/trivy/bowrain-keycloak.trivyignore.yaml }
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      # The scripts and ignore file come from this workflow's commit, not the
      # release's, so a rebuild applies today's scan rules.
      - name: Check out this workflow's scripts
        uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: |
            .github/trivy
            scripts/check-trivy-db.py
            scripts/image-scan-compare.py
          sparse-checkout-cone-mode: false

      - name: Set up Node (Keycloak theme)
        if: matrix.image == 'bowrain-keycloak'
        uses: ./.github/actions/setup-node-ui

      - name: Build @neokapi/i18n-react (Keycloak theme)
        if: matrix.image == 'bowrain-keycloak'
        working-directory: packages/i18n-react
        run: vp run build

      - name: Set up JDK 17 (Keycloak theme)
        if: matrix.image == 'bowrain-keycloak'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the Keycloak theme
        if: matrix.image == 'bowrain-keycloak'
        run: make -C bowrain keycloak-theme

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the release commit
        id: meta
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No cache, and fresh base images: the point of the rebuild is to take
      # what the bases fixed since the release.
      - name: Build ${{ matrix.image }} into an OCI layout
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/${{ matrix.image == 'bowrain-keycloak' && 'keycloak' || matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: "false"
          pull: true
          no-cache: true
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}

      - name: Scan the rebuilt image
        # master as of 2026-11-05 (#595), with the scanner version set below.
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          input: ${{ runner.temp }}/image
          severity: CRITICAL,HIGH
          format: json
          list-all-pkgs: true
          output: ${{ runner.temp }}/out/candidate.json
          exit-code: "0"
          trivyignores: ${{ matrix.ignorefile && format('tools/{0}', matrix.ignorefile) || '' }}
          cache: false

      - name: Write the rebuilt image's SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          input: ${{ runner.temp }}/image
          format: cyclonedx
          output: ${{ runner.temp }}/out/sbom.cdx.json
          skip-setup-trivy: true
          cache: false

      - name: Check the scanner's databases are fresh
        run: python3 tools/scripts/check-trivy-db.py "$GITHUB_WORKSPACE/.cache/trivy"

      # The scan must prove it read this image: its image id is the config
      # digest of the layout about to be published, and it lists packages.
      # Findings are reported here and judged in the publish job.
      - name: Check the scan read this image
        env:
          OUT: ${{ runner.temp }}/out
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -uo pipefail
          id="$(python3 tools/scripts/image-scan-compare.py image-id "$RUNNER_TEMP/image" "$PLATFORM")" || exit 1
          echo "$id" > "$OUT/image-id.txt"
          status=0
          python3 tools/scripts/image-scan-compare.py compare "$OUT/candidate.json" --image-id "$id" --no-current || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the scan and SBOM
        uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 90

  # The images are private: scanning what `latest` points at needs a read
  # token, so this runs only when the rebuild would publish.
  scan-current:
    name: Scan the current ${{ matrix.image }} (${{ matrix.arch }})
    needs: [setup]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the current image from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bowrain-server, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-server, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-worker, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-worker, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-web, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-web, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-keycloak, arch: amd64, platform: linux/amd64, ignorefile: .github/trivy/bowrain-keycloak.trivyignore.yaml }
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/trivy
            scripts/check-trivy-db.py
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Is an image published under latest?
        id: exists
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/current"
          if docker buildx imagetools inspect "ghcr.io/neokapi/$IMAGE:latest" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "no image under latest" > "$RUNNER_TEMP/current/absent"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan ghcr.io/neokapi/${{ matrix.image }}:latest
        if: steps.exists.outputs.present == 'true'
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ghcr.io/neokapi/${{ matrix.image }}:latest
          severity: CRITICAL,HIGH
          format: json
          list-all-pkgs: true
          output: ${{ runner.temp }}/current/current.json
          exit-code: "0"
          trivyignores: ${{ matrix.ignorefile || '' }}
          cache: false

      - name: Check the scanner's databases are fresh
        if: steps.exists.outputs.present == 'true'
        run: python3 scripts/check-trivy-db.py "$GITHUB_WORKSPACE/.cache/trivy"

      - uses: actions/upload-artifact@v7
        with:
          name: current-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/current/
          if-no-files-found: error
          retention-days: 90

  # Publishes only when every rebuilt image scans no worse than the one it
  # replaces. The rebuild tag must not exist yet: a published tag is never
  # replaced.
  publish:
    name: Publish ${{ needs.setup.outputs.rebuild_tag }} and move latest
    needs: [setup, build, scan-current]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the rebuilt images to ghcr.io
    env:
      TAG: ${{ needs.setup.outputs.rebuild_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/image-scan-compare.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/a

      # Judged per image: one that scans worse on any platform is not
      # published, the others are, and the job then fails so the scheduled
      # failure reporter files it. A report that is not evidence stops every
      # publish.
      - name: Compare each rebuilt image with the current one
        id: judge
        env:
          A: ${{ runner.temp }}/a
        run: |
          set -uo pipefail
          publish=()
          held=()
          for image in bowrain-server bowrain-worker bowrain-web bowrain-keycloak; do
            arches="amd64 arm64"
            [ "$image" = bowrain-keycloak ] && arches="amd64"
            ok=true
            for arch in $arches; do
              echo "::group::$image ($arch)"
              rec="$A/record-$image-$arch"
              cur="$A/current-$image-$arch"
              if [ -f "$cur/absent" ]; then
                baseline=(--no-current)
              else
                baseline=(--current "$cur/current.json")
              fi
              status=0
              python3 scripts/image-scan-compare.py compare "$rec/candidate.json" \
                --image-id "$(cat "$rec/image-id.txt")" "${baseline[@]}" || status=$?
              echo "::endgroup::"
              case "$status" in
                0) ;;
                1) ok=false ;;
                *) echo "::error::$image ($arch): the scans are not evidence (exit $status); nothing is published"; exit 1 ;;
              esac
            done
            if [ "$ok" = true ]; then publish+=("$image"); else held+=("$image"); fi
          done
          echo "publish=${publish[*]}" >> "$GITHUB_OUTPUT"
          echo "held=${held[*]}" >> "$GITHUB_OUTPUT"
          echo "publishing: ${publish[*]:-(none)}; held, scanning worse: ${held[*]:-(none)}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push the rebuilt images, then move latest
        if: steps.judge.outputs.publish != ''
        env:
          A: ${{ runner.temp }}/a
          PUBLISH: ${{ steps.judge.outputs.publish }}
        run: |
          set -euo pipefail
          read -r -a images <<< "$PUBLISH"
          for image in "${images[@]}"; do
            if docker buildx imagetools inspect "ghcr.io/neokapi/$image:$TAG" >/dev/null 2>&1; then
              echo "::error::ghcr.io/neokapi/$image:$TAG exists; a published tag is never replaced"
              exit 1
            fi
          done
          for image in "${images[@]}"; do
            if [ "$image" = bowrain-keycloak ]; then
              skopeo copy --all "oci:$A/image-$image-amd64" "docker://ghcr.io/neokapi/$image:$TAG"
            else
              for arch in amd64 arm64; do
                skopeo copy --all "oci:$A/image-$image-$arch" "docker://ghcr.io/neokapi/$image:$TAG-$arch"
              done
              docker buildx imagetools create -t "ghcr.io/neokapi/$image:$TAG" \
                "ghcr.io/neokapi/$image:$TAG-amd64" "ghcr.io/neokapi/$image:$TAG-arm64"
            fi
          done
          for image in "${images[@]}"; do
            docker buildx imagetools create -t "ghcr.io/neokapi/$image:latest" "ghcr.io/neokapi/$image:$TAG"
          done

      - name: Record what was published
        env:
          A: ${{ runner.temp }}/a
          PUBLISH: ${{ steps.judge.outputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p records
          read -r -a images <<< "$PUBLISH"
          for image in "${images[@]}"; do
            digest="$(docker buildx imagetools inspect "ghcr.io/neokapi/$image:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "ghcr.io/neokapi/$image:$TAG $digest" | tee -a records/digests.txt
          done
          cp -r "$A"/record-* records/

      - uses: actions/upload-artifact@v7
        with:
          name: published-${{ needs.setup.outputs.rebuild_tag }}
          path: records/
          if-no-files-found: error
          retention-days: 90

      - name: Fail when an image was held back
        if: steps.judge.outputs.held != ''
        env:
          HELD: ${{ steps.judge.outputs.held }}
        run: |
          echo "::error::not published, scanning worse than the image under latest: $HELD"
          exit 1
