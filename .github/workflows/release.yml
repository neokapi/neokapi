name: Release

on:
  push:
    tags:
      # CLI/desktop version tags only (v1.2.3). Must NOT be the broad "v*", which
      # also matches plugin tags that begin with a "v" — notably "vision-v*" and
      # the "vision-models-*" asset tag — and would wrongly trigger a full
      # CLI+desktop release. Plugins release via their own release-<plugin>.yml.
      - "v[0-9]*"
  # Reusable entry point for release-coordinated.yml: lets the coordinator run
  # the kapi track with an explicit version and route the publish jobs through a
  # manual-approval gate so kapi + bowrain land in the package managers together.
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3 (no leading v)."
        type: string
        required: true
      coordinated:
        description: "Route publish jobs through the coordinated-release approval gate."
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  # cosign keyless requires a fresh GitHub Actions OIDC token to mint a
  # short-lived Fulcio cert for signing the kapi CLI archives.
  id-token: write

jobs:
  # Resolve the release version + tag once, for both trigger modes:
  #   - tag push (v1.2.3): version/tag derive from the pushed tag; not coordinated.
  #   - workflow_call (coordinated release): version comes from inputs.version and
  #     `coordinated` routes the publish jobs through the approval environment.
  # Downstream jobs consume needs.setup.outputs.tag via a job-level REF_NAME env,
  # so the existing tag-stripping logic keeps working unchanged.
  setup:
    name: Resolve release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      coordinated: ${{ steps.r.outputs.coordinated }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - id: r
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_COORD: ${{ inputs.coordinated }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION:-}" ]; then
            ver="${IN_VERSION#v}"; tag="v${ver}"; coord="${IN_COORD:-false}"
          else
            tag="${PUSH_REF}"; ver="${PUSH_REF#v}"; coord="false"
          fi
          case "$ver" in *-*) pre="true" ;; *) pre="false" ;; esac
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "coordinated=$coord"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

  # Verify the parity workflow (#448) succeeded for the tagged commit
  # before any release artifact is built or published. Parity runs on
  # every push to main, so the result is normally already cached by the
  # time a release tag is pushed.
  #
  # If parity has not run for the tagged commit (e.g. the commit only
  # touched paths excluded from the parity workflow's paths-filter),
  # this gate fails closed: pre-release work for #448 explicitly
  # requires the parity report to be fresh for every release.
  parity-gate:
    name: Parity Gate (#448)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify parity workflow status for tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking up parity workflow status for ${REPO}@${SHA}..."
          # Consider ALL parity runs for this commit, not just the most recent:
          # the gate passes if ANY of them succeeded. This is robust to a second
          # (e.g. manually-dispatched) parity run being in-flight or failed while
          # an earlier run already passed for the same SHA — picking only
          # workflow_runs[0] would spuriously block the release.
          runs=$(gh api \
            "repos/${REPO}/actions/workflows/parity.yml/runs?head_sha=${SHA}&per_page=50" \
            --jq '[.workflow_runs[] | .status+":"+(.conclusion//"none")]')
          echo "Parity runs for ${SHA}: ${runs}"
          successes=$(echo "$runs" | grep -c '"completed:success"' || true)
          inflight=$(echo "$runs" | grep -cE '"(queued|in_progress|requested|waiting|pending):' || true)
          if [ "$successes" -gt 0 ]; then
            echo "Parity gate passed (a successful parity run exists for ${SHA})."
          elif [ "$inflight" -gt 0 ]; then
            echo "::error::Parity is still running for ${SHA} and none has succeeded yet. Wait for it to finish, then re-run this job."
            exit 1
          else
            echo "::error::No successful parity run for ${SHA}. Run parity.yml against this commit (it succeeds on push for core changes; otherwise 'gh workflow run parity.yml --ref main') before releasing."
            exit 1
          fi

  # Build the kapi CLI binary natively per OS/arch with cgo + statically-linked
  # ICU + the fts5 tag, so it matches the framework the desktop apps use (native
  # mattn SQLite + ICU FTS5 tokenizer + UAX-29). cgo rules out single-runner
  # cross-compilation, so each target builds on its own native runner and
  # uploads the binary as an artifact; the package-cli job below
  # archives/checksums/signs it and publishes the brew formula.
  #
  # The kapi-bowrain plugin is built and released separately by
  # release-bowrain.yml (tag bowrain-v*).
  #
  # ICU provisioning (see the per-OS steps): built from source with the
  # trimmed data set (scripts/icu-data-filter.json) on macOS + Linux; MSYS2
  # mingw (full ICU data — no filtered-source path there yet) on Windows. All
  # feed scripts/gen-icu-static-pc.sh, which forces static linking.
  #
  # NOTE: this matrix is new and only macOS has been validated locally; the
  # Linux (source ICU + PIE/PIC) and Windows (MSYS2 mingw, -static C++ runtime,
  # ICU archive names) legs are expected to need CI iteration.
  build-cli:
    name: Build CLI (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    needs: [setup, parity-gate]
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: arm64, os: macos-latest, icu: brew }
          # macOS is Apple-Silicon only (matches the desktop apps); Intel mac is
          # not a priority target.
          - { goos: linux, goarch: amd64, os: ubuntu-latest, icu: source }
          - { goos: linux, goarch: arm64, os: ubuntu-24.04-arm, icu: source }
          # Windows ICU comes from MSYS2: x86_64 uses the gcc MINGW64 env, arm64
          # uses the clang CLANGARM64 env on a native windows-11-arm runner.
          - { goos: windows, goarch: amd64, os: windows-2025, icu: msys2, msystem: MINGW64, mtriple: x86_64, cc: gcc, cgo_ldflags: "-static -static-libgcc -static-libstdc++", mroot: /mingw64 }
          - { goos: windows, goarch: arm64, os: windows-11-arm, icu: msys2, msystem: CLANGARM64, mtriple: clang-aarch64, cc: clang, cgo_ldflags: "-static", mroot: /clangarm64 }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "LDFLAGS=-s -w -X github.com/neokapi/neokapi/core/version.Version=${VERSION} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create //go:embed placeholders
        shell: bash
        run: |
          mkdir -p bowrain/apps/bowrain/frontend/dist && touch bowrain/apps/bowrain/frontend/dist/placeholder
          mkdir -p apps/kapi-desktop/frontend/dist && touch apps/kapi-desktop/frontend/dist/placeholder

      # ---- ICU provisioning (sets PKG_CONFIG_PATH for the static .pc) ----
      # macOS and Linux build ICU from source with the trimmed data set
      # (scripts/icu-data-filter.json — break iteration + normalization only),
      # which cuts ~27MB of unused ICU data out of every shipped binary and
      # shortens macOS Gatekeeper's first-exec scan. The build (~5-10 min) is
      # cached on the ICU version + filter + script hash.
      - name: Cache static ICU
        if: matrix.target.goos != 'windows'
        id: icu-cache
        uses: actions/cache@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}

      - name: Provision static ICU (macOS, from source, trimmed data)
        if: matrix.target.goos == 'darwin'
        env:
          # Match the Go build's deployment target so the ICU objects do too.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          brew install pkg-config
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          {
            echo "PKG_CONFIG_PATH=${PCDIR}"
            echo "MACOSX_DEPLOYMENT_TARGET=11.0"
          } >> "$GITHUB_ENV"

      - name: Provision static ICU (Linux, from source, trimmed data)
        if: matrix.target.goos == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl python3 unzip
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          echo "PKG_CONFIG_PATH=${PCDIR}" >> "$GITHUB_ENV"

      # The embedded gettext catalogs are build output — the repository carries
      # the translated JSON they are compiled from — and core/i18n / host/i18n
      # resolve `//go:embed catalogs/*.mo` at compile time. A release that
      # skipped this would fail the build rather than ship English silently,
      # but it must not get the chance.
      - name: Compile the embedded i18n catalogs
        if: matrix.target.goos != 'windows'
        run: go run ./core/i18n/gen/catalogs

      # ---- Build (macOS / Linux) ----
      - name: Build kapi (macOS / Linux)
        if: matrix.target.goos != 'windows'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          mkdir -p out
          ( cd kapi && go build -tags fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o ../out/kapi ./cmd/kapi )

      # Guard the trimmed ICU data: run the packages that exercise ICU at
      # runtime (UAX-29 segmentation incl. dictionary scripts, FTS5 ICU
      # tokenizer incl. its transliterator fold pipeline) against the exact
      # static ICU the binary just linked. If a future feature starts using an
      # ICU service whose data the filter excludes, this fails the release
      # instead of shipping a binary that errors at runtime — the fix is one
      # line in scripts/icu-data-filter.json.
      - name: ICU trimmed-data smoke test
        if: matrix.target.goos != 'windows'
        run: go test -tags fts5 -count=1 ./core/segment/... ./core/storage/

      # ---- Build (Windows, MSYS2 mingw + static ICU) ----
      - name: Set up MSYS2 (Windows)
        if: matrix.target.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.target.msystem }}
          # inherit so the Windows-native `go` (from setup-go) is on the msys2
          # shell's PATH alongside the mingw toolchain/pkg-config.
          path-type: inherit
          install: >-
            mingw-w64-${{ matrix.target.mtriple }}-${{ matrix.target.cc }}
            mingw-w64-${{ matrix.target.mtriple }}-icu
            mingw-w64-${{ matrix.target.mtriple }}-pkg-config

      - name: Build kapi (Windows)
        if: matrix.target.goos == 'windows'
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"
          # Static C++/toolchain runtimes so kapi.exe needs no mingw DLLs beside it.
          CGO_LDFLAGS: ${{ matrix.target.cgo_ldflags }}
          CC: ${{ matrix.target.cc }}
          MROOT: ${{ matrix.target.mroot }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          # go from the Windows runner (setup-go) is on PATH; CC = mingw/clang cc.
          export CC
          # mingw ICU lives under $MROOT, but the native cc/ld can't open MSYS
          # virtual paths ($MROOT/...). Feed gen-icu-static-pc.sh Windows-form
          # paths (cygpath -m) so the .pc references archives ld can open, and
          # convert the generated .pc dir for the (native) pkg-config too.
          PCDIR=$(ICU_LIBDIR="$(cygpath -m "$MROOT/lib")" ICU_INCLUDEDIR="$(cygpath -m "$MROOT/include")" bash scripts/gen-icu-static-pc.sh)
          export PKG_CONFIG_PATH="$(cygpath -m "$PCDIR")"
          # Build output, not source: the embedded gettext catalogs compile
          # from the committed translated JSON before //go:embed resolves.
          go run ./core/i18n/gen/catalogs
          mkdir -p out
          ( cd kapi && go build -tags fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o ../out/kapi.exe ./cmd/kapi )

      # ---- Sign the macOS kapi binary (quill: Developer ID + notarize) ----
      - name: Sign + notarize kapi (macOS)
        if: matrix.target.goos == 'darwin'
        env:
          QUILL_SIGN_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          curl -sSfL https://get.anchore.io/quill | sudo sh -s -- -b /usr/local/bin v0.7.1
          IS_SNAPSHOT=false
          [ -z "${QUILL_SIGN_P12:-}" ] && IS_SNAPSHOT=true
          bash scripts/quill-sign-darwin.sh out/kapi darwin "$IS_SNAPSHOT"

      # ---- Upload binaries for the package-cli job ----
      - name: Upload CLI binaries
        uses: actions/upload-artifact@v7
        with:
          name: cli-bins-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: out/*
          retention-days: 14

      # Windows kapi.exe is published out of band (Authenticode-signed locally
      # with Certum, scripts/publish-windows-signed.sh) — keep its zip artifact.
      # git-bash on the Windows runner has no `zip`; use PowerShell's
      # Compress-Archive (as the desktop Windows zip steps do).
      - name: Package Windows kapi CLI zip (out-of-band signing)
        if: matrix.target.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path out/kapi.exe -DestinationPath "out/kapi-cli_${{ steps.meta.outputs.VERSION }}_windows_${{ matrix.target.goarch }}.zip" -Force
      - name: Upload Windows kapi zip
        if: matrix.target.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: kapi-cli-windows-${{ matrix.target.goarch }}
          path: out/kapi-cli_*_windows_${{ matrix.target.goarch }}.zip
          retention-days: 14

  # Package + publish the kapi CLI binary built by build-cli. This replaces the
  # former GoReleaser job: GoReleaser OSS can't consume externally-built (cgo +
  # static-ICU) binaries (`builder: prebuilt` is Pro only), so we reproduce its
  # CLI outputs directly — archives, checksums, cosign signatures for the kapi
  # CLI archives, the kapi-cli brew formula, the cli.json self-update index, and
  # the GitHub release upload — using the same artifact names downstream
  # consumers (formula, docs, self-update) already expect.
  #
  # The kapi-bowrain plugin archive, the bowrain-cli formula, and the
  # manifest-plugins.json registration are produced by release-bowrain.yml.
  package-cli:
    name: Package + publish CLI
    needs: [setup, parity-gate, build-cli]
    runs-on: ubuntu-latest
    # Coordinated releases route this publish job through a manual-approval
    # environment so the kapi tap/registry writes land together with bowrain's.
    # Routine tag pushes resolve to an empty environment (no gate).
    environment: ${{ needs.setup.outputs.coordinated == 'true' && 'coordinated-release' || '' }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      # Release gate: shared UI must type-check + pass unit tests (previously
      # run inside the GoReleaser job).
      - uses: ./.github/actions/setup-node-ui
      # The shared UI imports @neokapi/i18n-react/runtime (a built ./dist subpath
      # export, not committed), so build neokapi-i18n before the type-check/tests.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build
      - name: Type-check shared UI package
        working-directory: bowrain/packages/ui
        run: vp check --no-fmt --no-lint
      - name: Run UI unit tests
        working-directory: bowrain/packages/ui
        run: vp test

      - name: Install cosign (for kapi CLI archive signing)
        uses: sigstore/cosign-installer@v3

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-bins-*
          path: cli-artifacts

      - name: Package archives + checksums
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          bash scripts/package-cli.sh "$VERSION" cli-artifacts dist \
            bowrain/plugin/cmd/kapi-bowrain/manifest.json

      # Linux .deb / .rpm for the kapi CLI (nfpm). These are direct-download
      # system packages; apt/dnf own updates, so they are not in cli.json.
      - name: Build Linux packages (deb/rpm)
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          export VERSION   # nfpm reads ${VERSION} from the environment
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          gopath_bin="$(go env GOPATH)/bin"
          export PATH="$PATH:$gopath_bin"
          mkdir -p packaging/.stage
          for arch in amd64 arm64; do
            bin="cli-artifacts/cli-bins-linux-${arch}/kapi"
            if [ ! -f "$bin" ]; then
              echo "no linux/${arch} kapi binary; skipping"
              continue
            fi
            # nfpm doesn't expand env in contents[].src, so stage at a fixed path.
            cp "$bin" packaging/.stage/kapi
            export ARCH="$arch"   # nfpm reads ${ARCH} from the environment
            nfpm package -f packaging/nfpm.yaml -p deb -t "dist/kapi-cli_${VERSION}_${arch}.deb"
            nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/kapi-cli_${VERSION}_${arch}.rpm"
          done
          # Add the packages to checksums.txt (filenames only, no dir component).
          ( cd dist && { sha256sum ./*.deb ./*.rpm 2>/dev/null | sed 's| \./| |' || true; } >> checksums.txt )
          ls -l dist/*.deb dist/*.rpm 2>/dev/null || true

      # Publish the .deb/.rpm into the self-hosted apt + yum repos
      # (https://neokapi.github.io/packages/). Stable channel only — system
      # package managers track stable. No-op until the signing key + packages
      # token are configured.
      - name: Publish to apt/yum repo
        if: ${{ needs.setup.outputs.prerelease != 'true' }}
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGES_GPG_PRIVATE_KEY:-}" ] || [ -z "${PACKAGES_TOKEN:-}" ]; then
            echo "apt/yum publish secrets not set; skipping"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          VERSION="${REF_NAME#v}"
          bash scripts/publish-packages.sh "$VERSION" dist

      # Keyless cosign signature (sigstore bundle) for the kapi CLI archives, so
      # `kapi update` can verify a self-replace — see cli/selfupdate. Mirrors the
      # former GoReleaser `signs` block. (The kapi-bowrain plugin tarballs are
      # cosign-signed by release-bowrain.yml.)
      - name: Sign CLI archives (cosign)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          for a in dist/kapi-cli_*.tar.gz; do
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "${a}.sigstore.json" "$a"
          done

      # Channel is tag-driven; beta is a superset fast ring that also carries
      # finals, so beta users never fall behind stable. See
      # docs/internals/auto-update.md, "Release channels", and
      # scripts/release-channel.sh for the outputs and the tag shapes both
      # release tracks feed it.
      - name: Resolve release channel
        id: channel
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: bash scripts/release-channel.sh "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate brew formulae
        env:
          CHANNELS: ${{ steps.channel.outputs.channels }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          # A final tag generates both the stable (kapi-cli) and beta
          # (kapi-cli-beta) formulae at the same version, so the beta channel
          # also carries the final; a prerelease generates beta only. The kapi
          # track emits only the kapi-cli formula (which=kapi); bowrain-cli is
          # emitted by release-bowrain.yml.
          for ch in $CHANNELS; do
            bash scripts/gen-brew-formula.sh "$VERSION" "${{ github.repository }}" \
              dist/checksums.txt brew-formulae "$ch" kapi
          done

      # Generate categorized release notes — feat / fix / perf / docs / chore /
      # Other, derived from the conventional-commit subjects of every squash
      # merge since the previous v* tag, with the install footer appended —
      # written to scripts/release-notes/<tag>.md for the publish step's
      # body_path. The generator preserves a committed, hand-authored notes file
      # for this tag (so rc → final hand-edits survive), and the fetch-depth: 0
      # checkout above gives it full history + tags. REF_NAME is the job env.
      - name: Generate release notes
        run: bash scripts/release-notes/generate.sh "$REF_NAME"

      - name: Publish CLI archives to release
        uses: softprops/action-gh-release@v3
        with:
          # Prerelease tags (vX.Y.Z-rcN) produce a GitHub *prerelease* with
          # downloadable assets but skip every live-channel write below.
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/kapi-cli_*.tar.gz
            dist/kapi-cli_*.deb
            dist/kapi-cli_*.rpm
            dist/*.sigstore.json
            dist/checksums.txt
          # Generated above; carries the install instructions as its footer.
          body_path: scripts/release-notes/${{ needs.setup.outputs.tag }}.md

      # Push the generated kapi-cli formula (stable: kapi-cli; beta:
      # kapi-cli-beta) to the tap. Both stable and prerelease tags publish — only
      # the formula name and channel differ. (bowrain-cli is pushed by
      # release-bowrain.yml.)
      - name: Push brew formulae to homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/neokapi/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp brew-formulae/*.rb /tmp/tap/Formula/
          cd /tmp/tap
          git config user.email "release-bot@neokapi.dev"
          git config user.name "release-bot"
          git add Formula/*.rb
          if ! git diff --staged --quiet; then
            git commit -m "kapi-cli ${VERSION} (${CHANNEL})"
            git push
          fi

      # Push the new kapi CLI version into the cli.json self-update index so
      # `kapi update` resolves to this build. Includes cosign signature URLs +
      # cert-identity so kapi's verifier can validate the self-replace.
      # (manifest-plugins.json — `kapi plugin install bowrain` — is updated by
      # release-bowrain.yml.)
      - name: Update kapi self-update index
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
          # Human label for the commit message (stable | beta).
          CHANNEL: ${{ steps.channel.outputs.channel }}
          # Empty on a final tag → a universal registry entry that every channel
          # (stable AND beta) resolves; "beta" on a prerelease → beta-only.
          REG_CHANNEL: ${{ steps.channel.outputs.reg_channel }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_TOKEN not set; skipping registry update"
            exit 0
          fi

          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main

          declare -A SHAS
          while IFS= read -r line; do
            sum=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}')
            SHAS[$file]=$sum
          done < dist/checksums.txt

          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          # The signer identity cosign put in the certificate, not the one this
          # release "ought" to have: Fulcio's SAN is the OIDC `job_workflow_ref`
          # claim — this workflow file at the ref the run resolved it from. On a
          # tag push that is refs/tags/<tag>; under release-coordinated.yml's
          # workflow_call it is the coordinator's ref, and a recorded
          # refs/tags/<tag> would make `kapi update` reject its own archive.
          # $GITHUB_REF is that ref in both modes, so the recorded identity
          # follows the trigger instead of assuming one.
          CERT_ID="https://github.com/${REPO}/.github/workflows/release.yml@${GITHUB_REF}"
          RELEASED="$(date -u +%Y-%m-%d)"
          ISSUER="https://token.actions.githubusercontent.com"

          # Build per-platform args for a given archive prefix (kapi-cli). The
          # kapi CLI ships darwin/linux (Windows kapi is signed + published out
          # of band, so it is not yet in the self-update index).
          build_args() {
            local prefix="$1"; shift
            CLI_ARGS=()
            for plat in "$@"; do
              local os=${plat%/*} arch=${plat#*/}
              local file="${prefix}_${VERSION}_${os}_${arch}.tar.gz"
              if [ -n "${SHAS[$file]:-}" ]; then
                CLI_ARGS+=(
                  "--platform" "$plat"
                  "--url" "${REPO_URL}/${file}"
                  "--sha256" "${SHAS[$file]}"
                  "--signature" "${REPO_URL}/${file}.sigstore.json"
                )
              fi
            done
          }

          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry

          # --- kapi CLI → cli.json (drives `kapi update` self-replace) ---
          # Archive family is kapi-cli_* (matches the Homebrew formula); the
          # index key stays "kapi" (what the CLI's self-updater looks up).
          # Seed the index on first use; registry-update needs valid JSON.
          [ -f /tmp/registry/cli.json ] || echo '{"schema":"v2","plugins":{}}' > /tmp/registry/cli.json
          build_args kapi-cli darwin/arm64 linux/arm64 linux/amd64
          /tmp/registry-update \
            --registry /tmp/registry/cli.json \
            --plugin kapi \
            --version "$VERSION" \
            --channel "$REG_CHANNEL" \
            --released "$RELEASED" \
            --cert-identity "$CERT_ID" \
            --cert-oidc-issuer "$ISSUER" \
            "${CLI_ARGS[@]}"

          cd /tmp/registry
          git config user.email "release-bot@neokapi.dev"
          git config user.name "release-bot"
          git add cli.json
          if ! git diff --staged --quiet; then
            git commit -m "Register kapi ${VERSION} (${CHANNEL})"
            git push
          fi

  # Publish the kapi CLI container image — the supported path for
  # container-first CI (GitLab CI, Bitbucket, Jenkins, Dagger). Assembled from
  # the same prebuilt cgo + static-ICU linux binaries the archives ship
  # (GoReleaser can't consume externally-built binaries; see package-cli), so
  # the image is bit-identical to the tarball install. One image from
  # docker/kapi/Dockerfile, with the kapi-bowrain plugin baked into the system
  # plugin root (no separate -bowrain variant) so both standalone and
  # server-connected projects work out of the box:
  #   ghcr.io/neokapi/kapi:<v>   (+ :<major>, :<major.minor>, :latest on stable)
  # Bundling the plugin means the image REQUIRES the same-version plugin
  # archives; a CLI-only RC without them skips the image (see the stage step).
  publish-cli-image:
    name: Publish CLI container image
    needs: [setup, package-cli]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kapi
      VERSION: ${{ needs.setup.outputs.version }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-bins-linux-*
          path: cli-artifacts

      - name: Stage build context
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            src="cli-artifacts/cli-bins-linux-${arch}"
            test -f "${src}/kapi" || { echo "::error::missing ${src}/kapi"; exit 1; }
            mkdir -p "docker/kapi/bins/${arch}"
            install -m 0755 "${src}/kapi" "docker/kapi/bins/${arch}/kapi"
          done

          # The kapi-bowrain plugin is baked into the default image (there is no
          # separate -bowrain variant), so the image REQUIRES the same-version
          # plugin archives. release-bowrain.yml publishes them under its own
          # `bowrain-v<version>` release, so publishing the image only happens on
          # a coordinated release that cuts kapi and bowrain at the SAME version.
          # The two releases build in parallel, so wait (bounded, ~10 min) for
          # the bowrain archives to appear; a CLI-only release with no matching
          # bowrain-v<version> release times out and skips the image rather than
          # publishing a bowrain-less image under the same name.
          PLUGIN_TAG="bowrain-v${VERSION}"
          has_plugin=false
          for attempt in $(seq 1 20); do
            if gh release download "${PLUGIN_TAG}" --repo "${GITHUB_REPOSITORY}" \
                 --pattern "kapi-bowrain_${VERSION}_linux_amd64.tar.gz" \
                 --pattern "kapi-bowrain_${VERSION}_linux_arm64.tar.gz" \
                 --dir /tmp/kb 2>/dev/null; then
              has_plugin=true; break
            fi
            echo "waiting for ${PLUGIN_TAG} plugin archives (attempt ${attempt}/20)…"
            sleep 30
          done
          if [ "${has_plugin}" = "true" ]; then
            for arch in amd64 arm64; do
              kb="kapi-bowrain_${VERSION}_linux_${arch}.tar.gz"
              mkdir -p "docker/kapi/plugins/${arch}"
              tar xzf "/tmp/kb/${kb}" -C "docker/kapi/plugins/${arch}"
              test -f "docker/kapi/plugins/${arch}/bowrain/kapi-bowrain"
              test -f "docker/kapi/plugins/${arch}/bowrain/manifest.json"
            done
          else
            echo "::warning::CLI image SKIPPED — kapi-bowrain ${VERSION} archives not found at ${PLUGIN_TAG}. ${IMAGE}:${VERSION} bundles the bowrain plugin, so image consumers (samples, GitLab CI) will get 'manifest unknown' until a matching bowrain-v${VERSION} release exists. Cut releases together: 'make release-coordinated' or 'make release-bowrain v=${VERSION}'."
            {
              echo "### ⚠️ CLI container image was NOT published"
              echo ""
              echo "\`${IMAGE}:${VERSION}\` was skipped — no matching \`bowrain-v${VERSION}\` plugin release, and the image bundles the kapi-bowrain plugin."
              echo ""
              echo "Image consumers (samples, GitLab CI) will fail with \`manifest unknown\`. Fix: cut \`make release-bowrain v=${VERSION}\` (or a \`make release-coordinated\`) and re-run this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "has_plugin=${has_plugin}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          base=""
          add() {
            base="${base}${base:+,}${IMAGE}:$1"
          }
          add "${VERSION}"
          # Floating tags only for stable releases; a prerelease publishes its
          # exact version and nothing else.
          if [ "${PRERELEASE}" = "false" ]; then
            add "${VERSION%.*}"
            add "${VERSION%%.*}"
            add "latest"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kapi image
        if: steps.stage.outputs.has_plugin == 'true'
        id: push-base
        uses: docker/build-push-action@v7
        with:
          context: docker/kapi
          target: kapi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.base }}
          labels: |
            org.opencontainers.image.title=kapi
            org.opencontainers.image.description=kapi CLI with the kapi-bowrain plugin preinstalled — format-aware localization engine + zero-install server sync in CI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0 AND AGPL-3.0

      - name: Install cosign
        if: steps.stage.outputs.has_plugin == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        if: steps.stage.outputs.has_plugin == 'true'
        env:
          DIGEST_BASE: ${{ steps.push-base.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST_BASE}"

      - name: Smoke test
        if: steps.stage.outputs.has_plugin == 'true'
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" kapi version
          # The bundled plugin must be discovered from the system root with no
          # user-level install or config.
          docker run --rm "${IMAGE}:${VERSION}" kapi plugins list

  build-kapi-desktop:
    name: Build Kapi Desktop (${{ matrix.build.platform }})
    needs: [setup, package-cli]
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: linux/amd64, os: ubuntu-latest, arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, arch: arm64 }
          # Windows ICU comes from MSYS2: x86_64 uses the gcc MINGW64 env, arm64
          # uses the clang CLANGARM64 env on a native windows-11-arm runner.
          - { platform: windows/amd64, os: windows-2025, arch: amd64, msystem: MINGW64, mtriple: x86_64, cc: gcc, cgo_ldflags: "-static -static-libgcc -static-libstdc++", mroot: /mingw64 }
          - { platform: windows/arm64, os: windows-11-arm, arch: arm64, msystem: CLANGARM64, mtriple: clang-aarch64, cc: clang, cgo_ldflags: "-static", mroot: /clangarm64 }
          - { platform: darwin/arm64, os: macos-latest, arch: arm64 }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"

      - uses: ./.github/actions/setup-node-ui

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "VERSION=${REF_NAME#v}"
            echo "COMMIT=${GH_SHA::7}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LDFLAGS=-w -s -X github.com/neokapi/neokapi/core/version.Version=${REF_NAME#v} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # macOS and Linux build ICU from source with the trimmed data set
      # (scripts/icu-data-filter.json), same as the CLI job — see that job's
      # provisioning comment. Cached on the ICU version + filter + script hash.
      - name: Cache static ICU
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential curl pkg-config python3 unzip
          # Statically link our ICU usage (FTS5 tokenizer + UAX-29) so the
          # distributed Linux binary doesn't bind to the build host's libicu
          # major version. Built PIC + from source, same as the CLI. GTK/WebKit
          # still load the system libicu at runtime — that's their own, separate,
          # version-suffixed dependency and does not clash with our static copy.
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          echo "PKG_CONFIG_PATH=${PCDIR}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          # Match the app build's deployment target so the ICU objects do too.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          brew install pkg-config
          # Force STATIC ICU linking. A distributed/notarized .app must not
          # depend on a Homebrew icu dylib: it is absent on users' machines, and
          # even when present its code signature has a different Team ID than the
          # notarized app, so dyld aborts at launch (SIGABRT before main). The
          # override .pc files link libicu*.a by absolute path instead, leaving
          # only the Apple-signed /usr/lib/libc++.1.dylib at runtime.
          # See scripts/gen-icu-static-pc.sh.
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          {
            echo "PKG_CONFIG_PATH=${PCDIR}"
            echo "CPPFLAGS=-I$HOME/icu-static/include"
          } >> "$GITHUB_ENV"

      # Windows: mingw toolchain + static ICU for the cgo build step below.
      # (Bindings generation stays CGO=0 — it reflects the app's service API,
      # which doesn't depend on cgo — so only the final build needs this.)
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.build.msystem }}
          path-type: inherit
          install: >-
            mingw-w64-${{ matrix.build.mtriple }}-${{ matrix.build.cc }}
            mingw-w64-${{ matrix.build.mtriple }}-icu
            mingw-w64-${{ matrix.build.mtriple }}-pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate Wails bindings
        working-directory: apps/kapi-desktop
        shell: bash
        env:
          # On macOS/Linux the icu cgo packages compile during bindings analysis
          # (toolchain + static .pc are present), so keep cgo on. On Windows the
          # mingw toolchain isn't on this shell's PATH; bindings reflect the
          # service API (cgo-independent), so build them with cgo off — the final
          # Windows build step (msys2) does the cgo + static-ICU compile.
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          go mod tidy
          wails3 generate bindings -f "-tags production,fts5 -trimpath -buildvcs=false -ldflags=\"${BUILD_LDFLAGS}\"" -clean=true

      # The kapi-desktop frontend's vite.config.ts imports
      # @neokapi/i18n-react/vite, whose entry resolves to dist/plugin/vite.js.
      # That dist tree is built (not committed), so build neokapi-i18n first.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Build Kapi Desktop frontend
        working-directory: apps/kapi-desktop/frontend
        env:
          # Public client-side key (same project as _build-web.yml). Keys this
          # release build's opt-out desktop analytics (D1: default ON, first-run
          # notice + settings toggle, DNT honored); dev/self-builds are keyless
          # and silent.
          VITE_POSTHOG_KEY: phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
        run: vp run build:dev

      - name: Generate icons
        working-directory: apps/kapi-desktop/build
        run: wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

      - name: Generate Windows resources
        if: runner.os == 'Windows'
        working-directory: apps/kapi-desktop
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
          ARCH: ${{ matrix.build.arch }}
        run: |
          # Render a version-stamped info.json so the .exe version resource
          # (shown in the app's About dialog / file Properties) matches the
          # built binary and carries a current copyright year.
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          NUM="$(printf '%s' "$VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -n "$NUM" ] || NUM="0.0.0"
          jq --arg pv "$VERSION" --arg fv "${NUM}.0" --arg cr "© 2025-$(date +%Y) neokapi" \
            '.fixed.file_version=$fv | .info["0000"].ProductVersion=$pv | .info["0000"].LegalCopyright=$cr' \
            build/windows/info.json > build/windows/info.gen.json
          wails3 generate syso -arch "$ARCH" -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.gen.json -out "wails_windows_${ARCH}.syso"
          rm -f build/windows/info.gen.json

      # The desktop app links core/i18n and host/i18n, whose embedded gettext
      # catalogs are compiled from the committed translated JSON at build time.
      - name: Compile the embedded i18n catalogs
        if: runner.os != 'Windows'
        run: go run ./core/i18n/gen/catalogs

      - name: Build Kapi Desktop (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/kapi-desktop
        env:
          GOOS: linux
          CGO_ENABLED: "1"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o bin/Kapi

      # cgo build under MSYS2 mingw with statically-linked ICU — see the matching
      # Bowrain step for rationale (native SQLite + ICU parity, no divergence).
      - name: Build Kapi Desktop (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/kapi-desktop
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.build.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.build.cc }}
          CGO_LDFLAGS: ${{ matrix.build.cgo_ldflags }}
          MROOT: ${{ matrix.build.mroot }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          # Native cc/ld can't open MSYS virtual paths ($MROOT/...); feed
          # Windows-form paths (cygpath -m) and convert the .pc dir for the
          # native pkg-config too.
          PCDIR=$(ICU_LIBDIR="$(cygpath -m "$MROOT/lib")" ICU_INCLUDEDIR="$(cygpath -m "$MROOT/include")" bash "${GITHUB_WORKSPACE}/scripts/gen-icu-static-pc.sh")
          export PKG_CONFIG_PATH="$(cygpath -m "$PCDIR")"
          ( cd "${GITHUB_WORKSPACE}" && go run ./core/i18n/gen/catalogs )
          go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS} -H windowsgui" -o bin/Kapi.exe
          rm -f ./*.syso

      - name: Build Kapi Desktop (macOS arm64)
        if: runner.os == 'macOS'
        working-directory: apps/kapi-desktop
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=11.0"
          CGO_LDFLAGS: "-mmacosx-version-min=11.0"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          GOOS=darwin GOARCH=arm64 go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o bin/Kapi

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        working-directory: apps/kapi-desktop
        run: |
          mkdir -p bin/Kapi.app/Contents/MacOS
          mkdir -p bin/Kapi.app/Contents/Resources
          cp build/darwin/icons.icns bin/Kapi.app/Contents/Resources
          cp bin/Kapi bin/Kapi.app/Contents/MacOS
          cp build/darwin/Info.plist bin/Kapi.app/Contents
          # Stamp the bundle with the real release version + current copyright
          # year so the native macOS About dialog matches the built binary
          # instead of the static placeholder in build/darwin/Info.plist.
          VERSION="${{ steps.meta.outputs.VERSION }}"
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          PLIST=bin/Kapi.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright © 2025-$(date +%Y) neokapi" "$PLIST"

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID_P12_BASE64" ]; then
            echo "No Developer ID certificate configured — will use ad-hoc signing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Add to the search list AND make default so notarytool resolves the
          # stored credential profile without an explicit --keychain.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials (App Store Connect API key)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials "neokapi-notary" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Sign + notarize app bundle (Wails)
        if: runner.os == 'macOS'
        working-directory: apps/kapi-desktop
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            echo "Signing + notarizing with Developer ID via 'wails3 tool sign'"
            # Hardened runtime is on by default; --notarize submits to the notary
            # service and staples the ticket to the .app.
            wails3 tool sign \
              --input bin/Kapi.app \
              --identity "$APPLE_SIGN_IDENTITY" \
              --entitlements build/darwin/entitlements.plist \
              --notarize \
              --keychain-profile neokapi-notary
          else
            echo "No Developer ID — using ad-hoc signing (not distributable)"
            codesign --force --deep --sign - bin/Kapi.app
          fi

      - name: Create DMG
        if: runner.os == 'macOS'
        working-directory: apps/kapi-desktop
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dmg
          cp -R bin/Kapi.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil flakes with "Resource busy" on macos-latest; retry up to 3x.
          for i in 1 2 3; do
            hdiutil create \
              -volname "Kapi v${VERSION}" \
              -srcfolder dmg \
              -ov \
              -format UDZO \
              "../../kapi-${VERSION}-macOS-arm64.dmg" && break
            echo "hdiutil attempt $i failed, retrying after 5s..."
            sleep 5
          done

      - name: Sign + notarize DMG
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          DMG="kapi-${VERSION}-macOS-arm64.dmg"
          codesign --force --sign "$APPLE_SIGN_IDENTITY" "$DMG"
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" --keychain-profile neokapi-notary --wait
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG"

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        env:
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

      - name: Upload DMG to release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          files: "kapi-${{ steps.version.outputs.VERSION }}-macOS-arm64.dmg"

      # Publish the in-app-update feed (Phase 2) — see the bowrain job for notes.
      - name: Publish updater appcast (macOS)
        id: appcast
        # Non-blocking: the cask's .dmg is already uploaded to the release above,
        # so a registry git stall here (a known macOS-runner connect-phase hang)
        # must never block cask publication or zombie the runner for hours. The
        # with_timeout retries inside publish-appcast.sh handle the common stall;
        # these caps bound the worst case — the in-app-update feed is recoverable.
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        timeout-minutes: 25
        continue-on-error: true
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REF_NAME: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "updater appcast secrets not set; skipping"
            exit 0
          fi
          bash scripts/publish-appcast.sh Kapi kapi "$VERSION" "$REF_NAME" "$REPO" \
            apps/kapi-desktop/bin/Kapi.app darwin arm64

      # continue-on-error keeps the release moving, and would otherwise leave a
      # green job whose in-app-update feed never published — indistinguishable,
      # from the outside, from "no update available". Say so where the release is
      # read.
      - name: Report a skipped macOS update feed
        if: always() && steps.appcast.outcome == 'failure'
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: |
          echo "::error::The macOS in-app-update feed did not publish for ${REF_NAME}. The release itself is complete; re-run this job, or re-publish the feed by hand, before Kapi users on macOS can update in place."
          {
            echo "### macOS update feed not published"
            echo
            echo "\`appcast-kapi-darwin-arm64*.xml\` was not refreshed for \`${REF_NAME}\`."
            echo "Existing installs will not be offered this version until it is."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/kapi-desktop/bin/Kapi.exe" -DestinationPath "kapi-${{ steps.version.outputs.VERSION }}-windows-${{ matrix.build.arch }}.zip"

      - name: Upload Windows ZIP as artifact (Authenticode-signed locally before release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kapi-desktop-windows-${{ matrix.build.arch }}
          path: "kapi-${{ steps.version.outputs.VERSION }}-windows-${{ matrix.build.arch }}.zip"
          retention-days: 14

      - name: Create tarball
        if: runner.os == 'Linux'
        run: |
          tar -czf "kapi-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.build.arch }}.tar.gz" \
            -C apps/kapi-desktop/bin Kapi

      - name: Upload tarball to release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          files: "kapi-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.build.arch }}.tar.gz"

      # Linux in-app-update feed: sign the tarball into the linux/<arch> appcast.
      - name: Publish updater appcast (Linux)
        if: runner.os == 'Linux'
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REF_NAME: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
          ARCH: ${{ matrix.build.arch }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "updater appcast secrets not set; skipping"
            exit 0
          fi
          bash scripts/publish-appcast.sh Kapi kapi "$VERSION" "$REF_NAME" "$REPO" \
            "kapi-${VERSION}-linux-${ARCH}.tar.gz" linux "$ARCH"

  # NOTE: the Windows kapi CLI binary is now produced by the `build-cli` matrix
  # (cgo + static ICU via MSYS2 mingw); it uploads the unsigned
  # kapi-cli-windows-amd64 zip artifact for out-of-band Authenticode signing
  # (scripts/publish-windows-signed.sh). The former standalone build-windows-cli
  # job has been retired.

  update-casks:
    name: Update Kapi Homebrew Cask
    # Runs for stable AND prerelease tags. A stable tag (vX.Y.Z) refreshes the
    # kapi cask; a prerelease tag (vX.Y.Z-rcN) refreshes the kapi@beta cask
    # (which depends on the kapi-cli-beta formula). The bowrain cask is updated
    # by release-bowrain.yml.
    runs-on: ubuntu-latest
    needs: [setup, build-kapi-desktop]
    environment: ${{ needs.setup.outputs.coordinated == 'true' && 'coordinated-release' || '' }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      # Checked out for one file: the cask channel is the same decision the
      # release job makes, so it is read from the same script rather than
      # restated here.
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Final tag → both kapi and kapi@beta casks; prerelease tag → the @beta
      # cask only. `channel` and `reg_channel` come along unread.
      - name: Resolve cask channel
        id: ch
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: bash scripts/release-channel.sh "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.setup.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "kapi-*-macOS-arm64.dmg"

      - name: Compute checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "KAPI_DMG=$(sha256sum "kapi-${VERSION}-macOS-arm64.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: neokapi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update kapi cask
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA_KAPI: ${{ steps.checksum.outputs.KAPI_DMG }}
          CHANNELS: ${{ steps.ch.outputs.channels }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          for ch in $CHANNELS; do
          if [ "$ch" = beta ]; then
            CASK_NAME="kapi@beta"; DEP="kapi-cli-beta"
            CONFLICTS='  conflicts_with cask: "kapi"'
          else
            CASK_NAME="kapi"; DEP="kapi-cli"; CONFLICTS=""
          fi
          cat > "homebrew-tap/Casks/${CASK_NAME}.rb" << CASK
          cask "${CASK_NAME}" do
            version "${VERSION}"
            sha256 "${SHA_KAPI}"

            url "https://github.com/neokapi/neokapi/releases/download/v#{version}/kapi-#{version}-macOS-arm64.dmg"
            name "Kapi"
            desc "Localization toolkit - powered by neokapi"
            homepage "https://github.com/neokapi/neokapi"

            depends_on formula: "neokapi/tap/${DEP}"
          ${CONFLICTS}
            app "Kapi.app"

            postflight do
              system_command "/usr/bin/xattr",
                            args: ["-dr", "com.apple.quarantine", "#{appdir}/Kapi.app"],
                            sudo: false
            end

            caveats <<~EOS
              The kapi CLI is provided by the ${DEP} formula (installed
              automatically). Run "kapi" for command-line usage.
            EOS

            zap trash: [
              "~/Library/Application Support/Kapi",
              "~/Library/Preferences/io.github.neokapi.kapi-desktop.plist",
              "~/Library/Caches/Kapi",
            ]
          end
          CASK
          done

      - name: Remove old kapi-desktop cask if present
        run: |
          cd homebrew-tap
          rm -f Casks/kapi-desktop.rb

      - name: Commit and push casks
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Casks/
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update casks and formulas to ${VERSION}" && git push
          fi

  update-actions:
    name: Update GitHub Actions
    # Stable releases only — don't bump action default versions or tag the
    # action repos for prerelease (vX.Y.Z-rcN) tags.
    if: ${{ needs.setup.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    needs: [setup, package-cli]
    environment: ${{ needs.setup.outputs.coordinated == 'true' && 'coordinated-release' || '' }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump setup-kapi
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh api repos/neokapi/setup-kapi/contents/action.yml --jq '.content' | \
            base64 -d | sed "s/default: \"latest\"/default: \"${VERSION}\"/" > /tmp/action.yml
          CURRENT_SHA=$(gh api repos/neokapi/setup-kapi/contents/action.yml --jq '.sha')
          gh api repos/neokapi/setup-kapi/contents/action.yml \
            -X PUT \
            -f message="chore: bump default version to ${VERSION}" \
            -f content="$(base64 -w0 /tmp/action.yml)" \
            -f sha="${CURRENT_SHA}" || echo "setup-kapi: no version default to update"

      - name: Tag action repos
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for repo in setup-kapi kapi-action; do
            MAIN_SHA=$(gh api "repos/neokapi/${repo}/git/ref/heads/main" --jq '.object.sha')
            # Create the version tag
            gh api "repos/neokapi/${repo}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${MAIN_SHA}" 2>/dev/null || \
            gh api "repos/neokapi/${repo}/git/refs/tags/${TAG}" \
              -X PATCH \
              -f sha="${MAIN_SHA}" 2>/dev/null || true
            echo "Tagged ${repo} at ${TAG}"
          done
