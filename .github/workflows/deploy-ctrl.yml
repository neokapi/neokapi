name: Deploy Ctrl

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/ctrl/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Ctrl Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # ctrl bundles @neokapi/ui → @neokapi/ui-primitives, which imports
      # @neokapi/kapi-react/runtime (a built ./dist subpath export). Build it
      # first so the ctrl vite build resolves the import.
      - name: Build @neokapi/kapi-react
        working-directory: packages/kapi-react
        run: vp run build

      - name: Build ctrl app
        working-directory: bowrain/apps/ctrl
        run: vp run build

      - name: Upload ctrl artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ctrl-dist
          path: bowrain/apps/ctrl/dist
          retention-days: 7

  docker:
    name: Build Ctrl Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ctrl image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-ctrl/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-ctrl:${{ github.sha }}
            ghcr.io/neokapi/bowrain-ctrl:latest
          cache-from: type=gha,scope=bowrain-ctrl
          cache-to: type=gha,mode=max,scope=bowrain-ctrl

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Task definitions are Terraform-owned and pin :latest — the forced
      # deployment makes ECS re-pull the :latest image pushed above. All three
      # SPAs (web, ctrl, pulse) run as containers of the single spa service.
      # Rollback = re-run this workflow from an older commit (a retag
      # workflow_dispatch input can make that a one-click revert later).
      - name: Force new deployment of the SPA service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: bowrain-${{ inputs.environment || 'prod' }}-spa
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
