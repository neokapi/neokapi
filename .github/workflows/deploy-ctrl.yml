name: Deploy Ctrl

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/ctrl/**"
      - "bowrain/packages/ui/**"

jobs:
  build:
    name: Build Ctrl Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      - name: Build ctrl app
        working-directory: bowrain/apps/ctrl
        run: vp run build

      - name: Upload ctrl artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ctrl-dist
          path: bowrain/apps/ctrl/dist
          retention-days: 7

# Deploy dispatch removed 2026-07-10: the Azure per-target workflows in
# neokapi/bowrain-infra were deleted in its Terraform consolidation, and Azure
# is being replaced by the AWS environment (strategy roadmap epic 002). The
# build job stays as CI validation; epic 002/008 adds image publishing + deploy.
