name: Deploy Ctrl

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/ctrl/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Ctrl Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # ctrl bundles @neokapi/ui → @neokapi/ui-primitives, which imports
      # @neokapi/i18n-react/runtime (a built ./dist subpath export). Build it
      # first so the ctrl vite build resolves the import.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      # The ctrl SPA runs the admin OIDC flow in the browser and resolves the
      # provider's endpoints from discovery, so it only needs the issuer + client
      # id at build time. Set for hosted prod (Cognito admin pool); left empty for
      # self-host, where auth.ts derives the Keycloak admin realm from the hostname.
      - name: Build ctrl app
        working-directory: bowrain/apps/ctrl
        env:
          VITE_ADMIN_OIDC_ISSUER_URL: ${{ vars.ADMIN_OIDC_ISSUER_URL }}
          VITE_ADMIN_OIDC_CLIENT_ID: ${{ vars.ADMIN_OIDC_CLIENT_ID }}
          # Public client-side key (same project as _build-web.yml); this
          # workflow only builds on push/dispatch, never for PRs.
          VITE_POSTHOG_KEY: phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
        run: vp run build

      - name: Upload ctrl artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ctrl-dist
          path: bowrain/apps/ctrl/dist
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    # No-op until the SPA bucket exists (set by the spa-s3-cloudfront migration):
    # with the repo var unset the job is skipped and the workflow stays green
    # (build + artifact only).
    if: ${{ vars.SPA_CTRL_BUCKET != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Download ctrl assets
        uses: actions/download-artifact@v8
        with:
          name: ctrl-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Static SPA deploy: sync the built bundle to the private S3 origin, then
      # invalidate CloudFront. Fingerprinted assets (/assets/*) are immutable and
      # long-cached; the shell (index.html) and update manifest (version.json)
      # must always revalidate so clients pick up new asset hashes. The final
      # CloudFront invalidation purges the edge so the new release is live at once.
      # Rollback = re-run this workflow from an older commit.
      - name: Sync to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.SPA_CTRL_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.SPA_CTRL_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "version.json"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          if [ -f dist/version.json ]; then
            aws s3 cp dist/version.json "s3://$BUCKET/version.json" \
              --cache-control "no-cache" --content-type "application/json"
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
