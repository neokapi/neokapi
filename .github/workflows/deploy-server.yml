name: Deploy Server + Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/**"
      - "!bowrain/apps/web/**"
      - "!bowrain/apps/keycloak-theme/**"
      - "!bowrain/plugin/**"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag & Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build metadata
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "version=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Server Images
    needs: image-tag
    uses: ./.github/workflows/_build-server-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}
      version: ${{ needs.image-tag.outputs.version }}
      commit: ${{ needs.image-tag.outputs.commit }}
      build-date: ${{ needs.image-tag.outputs.build_date }}

  build-bravo:
    name: Build Bravo Agent Images
    needs: image-tag
    uses: ./.github/workflows/_build-bravo-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [image-tag, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Task definitions are Terraform-owned and pin :latest — the forced
      # deployments make ECS re-pull the :latest images pushed above.
      # Rollback = re-run this workflow from an older commit (a retag
      # workflow_dispatch input can make that a one-click revert later).
      - name: Force new deployment of server + worker
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: bowrain-${{ inputs.environment || 'prod' }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$PREFIX-server" \
            --force-new-deployment > /dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "$PREFIX-worker" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$PREFIX-server" "$PREFIX-worker"
