name: Deploy Server + Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    # bowrain-server and bowrain-worker link the framework. `go list -deps`
    # on the server names core/flow, core/observe, providers/ai and host among
    # others, so a framework change changes the deployed binary and has to
    # deploy it. Listing only bowrain/** meant it did not: #2120 and #2122 both
    # altered code inside the server and shipped nothing, and would have
    # reached production inside whatever unrelated bowrain/ change came next,
    # recorded as that change. Prod running code no deploy accounts for is the
    # same misattribution :latest caused, one layer up.
    paths:
      - "bowrain/**"
      - "!bowrain/apps/web/**"
      - "!bowrain/apps/keycloak-theme/**"
      - "!bowrain/plugin/**"
      - "core/**"
      - "host/**"
      - "providers/**"
      - "memory/**"
      - "terms/**"
      - "voice/**"
      - "kpz/**"
      - "go.mod"
      - "go.sum"
      # And the deploy path itself. #2119 rewrote the deploy step and merged
      # without deploying, so the change went unexercised until an unrelated
      # push happened to carry it. A bug in it would have surfaced then,
      # attributed to that push. The reusable build workflows are listed for
      # the same reason: they decide what image is produced.
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/_build-server-images.yml"
      - ".github/workflows/_build-bravo-images.yml"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag & Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build metadata
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          # The commit time: a re-run of the same commit reuses its layers.
          build_date=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)
          if [ -z "$build_date" ]; then
            echo "::error::no commit time for HEAD; the images would carry an empty build date"
            exit 1
          fi
          {
            echo "version=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Server Images
    needs: image-tag
    uses: ./.github/workflows/_build-server-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}
      version: ${{ needs.image-tag.outputs.version }}
      commit: ${{ needs.image-tag.outputs.commit }}
      build-date: ${{ needs.image-tag.outputs.build_date }}

  build-bravo:
    name: Build Bravo Agent Images
    needs: image-tag
    uses: ./.github/workflows/_build-bravo-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [image-tag, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    # One deploy per environment at a time. Two pushes merged seconds apart
    # otherwise run update-service together, the first one's services-stable
    # wait fails on the second's rollout, and a slower build can finish last
    # and put the older commit back. A deploy that arrives while one runs
    # waits; GitHub keeps only the newest waiting one, which carries the
    # commits of any it replaced.
    concurrency:
      group: deploy-ecs-${{ inputs.environment || 'prod' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Terraform owns the task definition's shape (env, roles, sizing). The
      # deploy owns one field, the image, and pins it to this commit on a
      # revision derived from the latest Terraform one.
      #
      # A commit-tagged revision says what runs (`describe-services` names the
      # commit) and rolls back with `update-service --task-definition <rev>`.
      # A :latest pin resolves to whatever the tag points at now.
      #
      # This step skips a deploy that waited behind a newer one: when the
      # running image's commit already contains this one, nothing deploys.
      - name: Skip when production already runs a newer commit
        id: newer
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: bowrain-${{ inputs.environment || 'prod' }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$PREFIX-server" \
                 --query 'services[0].taskDefinition' --output text)
          image=$(aws ecs describe-task-definition --task-definition "$td" \
                    --query "taskDefinition.containerDefinitions[?name=='bowrain-server'].image | [0]" --output text)
          running=$(printf '%s' "${image##*:}" | grep -oE '^[0-9a-f]{40}' || true)
          echo "running: ${running:-unknown} (from $image)"
          if [ -n "$running" ] && [ "$running" != "$GH_SHA" ] \
             && git merge-base --is-ancestor "$GH_SHA" "$running" 2>/dev/null; then
            echo "Production runs $running, which already contains $GH_SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy server + worker at this commit
        if: steps.newer.outputs.skip != 'true'
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: bowrain-${{ inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.image-tag.outputs.value }}
        run: |
          set -euo pipefail
          for svc in server worker; do
            image="ghcr.io/neokapi/bowrain-$svc:$IMAGE_TAG"
            # Matched by container name rather than index, so a sidecar added
            # later cannot silently retag the wrong container.
            aws ecs describe-task-definition --task-definition "$PREFIX-$svc" \
              --query taskDefinition \
            | jq --arg name "bowrain-$svc" --arg img "$image" '
                (.containerDefinitions[] | select(.name == $name) | .image) = $img
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy)
              ' > /tmp/$svc-td.json
            arn=$(aws ecs register-task-definition \
                    --cli-input-json "file:///tmp/$svc-td.json" \
                    --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$PREFIX-$svc" \
              --task-definition "$arn" > /dev/null
            echo "$PREFIX-$svc -> $image"
          done
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$PREFIX-server" "$PREFIX-worker"
