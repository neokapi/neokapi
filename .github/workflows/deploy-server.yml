name: Deploy Server + Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    # bowrain-server and bowrain-worker link the framework — `go list -deps`
    # on the server names core/flow, core/observe, providers/ai and host among
    # others — so a framework change changes the deployed binary and has to
    # deploy it. Listing only bowrain/** meant it did not: #2120 and #2122 both
    # altered code inside the server and shipped nothing, and would have
    # reached production inside whatever unrelated bowrain/ change came next,
    # recorded as that change. Prod running code no deploy accounts for is the
    # same misattribution :latest caused, one layer up.
    paths:
      - "bowrain/**"
      - "!bowrain/apps/web/**"
      - "!bowrain/apps/keycloak-theme/**"
      - "!bowrain/plugin/**"
      - "core/**"
      - "host/**"
      - "providers/**"
      - "memory/**"
      - "terms/**"
      - "go.mod"
      - "go.sum"

permissions:
  packages: write
  contents: read

jobs:
  image-tag:
    name: Compute Image Tag & Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=${GH_SHA}-${INPUT_ENV}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GH_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build metadata
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "version=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Server Images
    needs: image-tag
    uses: ./.github/workflows/_build-server-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}
      version: ${{ needs.image-tag.outputs.version }}
      commit: ${{ needs.image-tag.outputs.commit }}
      build-date: ${{ needs.image-tag.outputs.build_date }}

  build-bravo:
    name: Build Bravo Agent Images
    needs: image-tag
    uses: ./.github/workflows/_build-bravo-images.yml
    with:
      image-tag: ${{ needs.image-tag.outputs.value }}

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [image-tag, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The task definition's shape — env, roles, sizing — stays Terraform-owned.
      # This step owns one field: which image runs. It derives a revision from
      # the latest Terraform-registered one, so a Terraform change to the shape
      # lands on the next deploy, and pins the image to this commit.
      #
      # A :latest pin cannot be rolled back and cannot say what is running:
      # every task-definition revision resolves to whatever the tag points at
      # now, so reverting to an older revision returns the same code, a task
      # replaced hours later silently picks up a newer build, and two deploys
      # close together can each start tasks from the other's image. A
      # commit-tagged revision answers all of it — `describe-services` names the
      # commit, and rollback is `update-service --task-definition <revision>`.
      - name: Deploy server + worker at this commit
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: bowrain-${{ inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ needs.image-tag.outputs.value }}
        run: |
          set -euo pipefail
          for svc in server worker; do
            image="ghcr.io/neokapi/bowrain-$svc:$IMAGE_TAG"
            # Matched by container name rather than index, so a sidecar added
            # later cannot silently retag the wrong container.
            aws ecs describe-task-definition --task-definition "$PREFIX-$svc" \
              --query taskDefinition \
            | jq --arg name "bowrain-$svc" --arg img "$image" '
                (.containerDefinitions[] | select(.name == $name) | .image) = $img
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy)
              ' > /tmp/$svc-td.json
            arn=$(aws ecs register-task-definition \
                    --cli-input-json "file:///tmp/$svc-td.json" \
                    --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$PREFIX-$svc" \
              --task-definition "$arn" > /dev/null
            echo "$PREFIX-$svc -> $image"
          done
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$PREFIX-server" "$PREFIX-worker"
