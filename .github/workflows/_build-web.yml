name: _Build Web Assets

on:
  workflow_call:

jobs:
  build:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The web app bundles @neokapi/ui → @neokapi/ui-primitives and
      # @neokapi/status-views, which import @neokapi/i18n-react/runtime (a
      # built ./dist subpath export). Build it first so the web vite build
      # resolves the import.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Build web app
        working-directory: bowrain/apps/web
        env:
          VITE_POSTHOG_KEY: phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD
          # First-party reverse proxy (modules/spa-site enable_posthog_proxy) so
          # analytics + session replay survive ad blockers. ui_host in posthog.ts
          # still points at eu.posthog.com for SDK-generated links.
          VITE_POSTHOG_HOST: https://app.bowrain.cloud/ph
          # Sentry DSN is publish-safe (it ships in the browser bundle by
          # design), so it is baked in at build time — the same as the PostHog
          # key above. This is the "inject on deploy to S3" point: the build
          # runs in the deploy pipeline, then the dist is synced to S3.
          VITE_SENTRY_DSN: https://5a70f1f43a8bbeb81ccb3b88445909be@o4511753590538240.ingest.de.sentry.io/4511753715318864
          # In-context review frames a component from whatever preview host a
          # customer's recipe declares, and no list of those can be put in a
          # content policy. The app frames this shim origin instead, and the
          # policy names exactly it — bowrain-infra modules/embed-origin, wired
          # to spa_web's csp_frame_src in 50-edge. The two have to agree: change
          # one without the other and every preview frame is refused with
          # nothing in the interface to say why.
          VITE_EMBED_ORIGIN: https://embed.bowrain.cloud
        run: vp run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: bowrain/apps/web/dist
          retention-days: 7
