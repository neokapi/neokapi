name: Release Vision plugin

# The kapi-vision OCR plugin releases independently of the neokapi CLI, on its
# own `vision-v*` tag (e.g. `vision-v0.1.0` -> kapi-vision 0.1.0), like the SaT
# and PDFium plugins. It is a cgo binary (-tags onnx) that loads the onnxruntime
# SHARED library at runtime. The tarball is self-contained: it bundles the
# onnxruntime shared lib at lib/<name> AND the PP-OCRv5 model assets at models/
# beside the binary, where the plugin's resolvers find them with no env config.
on:
  push:
    tags:
      - "vision-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # cosign keyless OIDC (tag publishes)

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath
  # onnxruntime 1.31.1 matches yalue/onnxruntime_go v1.38.0 (ORT_API_VERSION 31),
  # the same pin as kapi-sat/kapi-check. Keep in lockstep with plugins/vision/go.mod.
  ONNXRUNTIME_VERSION: "1.31.1"
  # PP-OCRv5 mobile model assets, mirrored on this neokapi release for
  # reproducible, CI-reachable downloads (see plugins/vision/internal/models).
  VISION_MODELS_TAG: "vision-models-v1"

jobs:
  build-vision-plugin:
    name: Build kapi-vision plugin (${{ matrix.build.platform }})
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: darwin/arm64, os: macos-latest, goos: darwin, goarch: arm64 }
          - { platform: linux/amd64, os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { platform: windows/amd64, os: windows-2025, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The darwin leg builds every Mach-O it ships for the plugin's macOS
      # minimum (scripts/macos-minimum.sh): the Go link, the cgo objects and
      # the third-party code built here. The check after packaging fails the
      # release when a binary records a newer one.
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          min="$(scripts/macos-minimum.sh vision)"
          {
            echo "MACOS_MINIMUM=$min"
            echo "MACOSX_DEPLOYMENT_TARGET=$min"
            echo "CGO_CFLAGS=-O2 -g -mmacosx-version-min=$min"
            echo "CGO_CXXFLAGS=-O2 -g -mmacosx-version-min=$min"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Install cosign (tarball signing)
        if: startsWith(github.ref, 'refs/tags/vision-v')
        uses: sigstore/cosign-installer@v3

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/vision-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#vision-v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # ── onnxruntime shared library (runtime dep; bundled into the tarball) ────
      - name: Download onnxruntime
        shell: bash
        env:
          GOOS: ${{ matrix.build.goos }}
          GOARCH: ${{ matrix.build.goarch }}
        run: |
          set -euo pipefail
          scripts/fetch-onnxruntime.sh "$GOOS" "$GOARCH" "$RUNNER_TEMP/ort"
          echo "ORT_DIR=$RUNNER_TEMP/ort" >> "$GITHUB_ENV"

      # ── PP-OCRv5 model assets (bundled into the tarball) ──────────────────────
      - name: Download model assets
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          base="https://github.com/${REPO}/releases/download/${VISION_MODELS_TAG}"
          for f in ppocrv5_det.onnx ppocrv5_rec.onnx ppocrv5_dict.txt; do
            curl -sSfL -o "$RUNNER_TEMP/models/$f" "$base/$f"
          done
          echo "MODELS_DIR=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      # ── macOS Developer-ID signing (sign the staged binary pre-tar) ───────────
      - name: Build kapi-vision (macOS, pre-sign)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/neokapi/neokapi/core/version.Version=${VERSION} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$RUNNER_TEMP/prebuilt"
          (cd plugins/vision && GOWORK=off CGO_ENABLED=1 \
            go build -tags onnx -trimpath -ldflags "${LDFLAGS}" \
            -o "$RUNNER_TEMP/prebuilt/kapi-vision" ./cmd/kapi-vision)
          echo "VISION_PREBUILT_BIN=$RUNNER_TEMP/prebuilt/kapi-vision" >> "$GITHUB_ENV"

      # macOS Developer-ID signing + notarization of the staged Mach-O set
      # (plugin binary + bundled onnxruntime dylib), via the shared composite
      # action. reloc-id pins the dylib install id BEFORE signing so the package
      # script's guarded install_name_tool no-op preserves the signature.
      - name: Sign + notarize macOS Mach-O
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-sign
        with:
          label: kapi-vision
          binaries: ${{ env.VISION_PREBUILT_BIN }}
          dylib-globs: ${{ env.ORT_DIR }}/lib/libonnxruntime*.dylib
          reloc-id: '@loader_path/libonnxruntime.dylib'
          notarize: ${{ startsWith(github.ref, 'refs/tags/vision-v') }}
          developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          sign-identity: ${{ secrets.APPLE_SIGN_IDENTITY }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}

      # ── package the self-contained tarball ────────────────────────────────────
      - name: Package kapi-vision tarball
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          scripts/package-vision-plugin.sh \
            --version "${VERSION}" \
            --ort-dir "${ORT_DIR}" \
            --models-dir "${MODELS_DIR}" \
            --out-dir "$RUNNER_TEMP/vision-out"

      - name: Check the macOS minimum the tarball's binaries record
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/macho-check"
          mkdir -p "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          scripts/check-macho-minimum.sh --minimum "$MACOS_MINIMUM" "$dir"

      - name: Cosign sign tarball (keyless)
        if: startsWith(github.ref, 'refs/tags/vision-v')
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --new-bundle-format \
            --bundle "${TARBALL}.sigstore.json" "${TARBALL}"

      - name: Upload tarball + signature artifact
        uses: actions/upload-artifact@v7
        with:
          name: vision-tarball-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: |
            ${{ runner.temp }}/vision-out/*.tar.gz
            ${{ runner.temp }}/vision-out/*.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 14

      - name: Write checksum artifact
        shell: bash
        env:
          VISION_SHA256: ${{ steps.package.outputs.sha256 }}
          VISION_TARBALL_NAME: ${{ steps.package.outputs.tarball_name }}
          LEG_GOOS: ${{ matrix.build.goos }}
          LEG_GOARCH: ${{ matrix.build.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vision-checksums"
          echo "${VISION_SHA256}  ${VISION_TARBALL_NAME}" \
            > "$RUNNER_TEMP/vision-checksums/${LEG_GOOS}_${LEG_GOARCH}.sha256"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: vision-checksum-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: ${{ runner.temp }}/vision-checksums/*.sha256
          retention-days: 14

  # Every platform scripts/lib/release-assets.json registers for vision was
  # built, or nothing is published. Runs on dry-run dispatches too, so a
  # matrix change that drops a leg fails before any tag is cut.
  verify-vision-platforms:
    name: Verify every registered platform was built
    needs: build-vision-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib/release-assets.json
            scripts/release-assets.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: vision-checksum-*
          path: vision-checksums
          merge-multiple: true
      - name: Compare the built archives with scripts/lib/release-assets.json
        run: python3 scripts/release-assets.py check-checksums vision vision-checksums

  publish-vision-release:
    name: Publish kapi-vision release
    if: startsWith(github.ref, 'refs/tags/vision-v')
    needs: [build-vision-plugin, verify-vision-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Download all tarball + signature artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vision-tarball-*
          path: vision-release
          merge-multiple: true
      - name: Upload all assets to the release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: false # own tag line; must not steal the CLI's "latest"
          files: |
            vision-release/*.tar.gz
            vision-release/*.tar.gz.sigstore.json

  register-vision-plugin:
    name: Register kapi-vision in plugin registry
    if: startsWith(github.ref, 'refs/tags/vision-v')
    needs: publish-vision-release
    runs-on: ubuntu-latest
    steps:
      # The one file this job reads from the repository.
      - name: Check out the registry push helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib/registry-push.sh
            scripts/lib/release-assets.json
            scripts/release-assets.py
          sparse-checkout-cone-mode: false
      - name: Download vision checksum artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vision-checksum-*
          path: vision-checksums
          merge-multiple: true
      - name: Update manifest plugin registry (vision)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#vision-v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_TOKEN not set; skipping registry update"; exit 0
          fi
          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main
          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          CERT_ID="https://github.com/${REPO}/.github/workflows/release-vision.yml@refs/tags/${REF_NAME}"
          # The platforms scripts/lib/release-assets.json declares for this
          # plugin, each with its checksum, or the step fails: a release never
          # registers part of what it builds.
          args="$(python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" registry-args vision "$VERSION" vision-checksums "$REPO_URL")"
          mapfile -t ARGS <<< "$args"
          mapfile -t PLATFORMS < <(printf '%s\n' "${ARGS[@]}" | awk 'prev == "--platform" { print } { prev = $0 }')

          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry
          git -C /tmp/registry config user.email "release-bot@neokapi.dev"
          git -C /tmp/registry config user.name "release-bot"
          register() {
            # Requires the vision plugin stub to already exist in manifest-plugins.json.
            # No version may drop a platform the previous one had, unless
            # release-assets.json lists it under 'removed'.
            python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" check-registry /tmp/registry/manifest-plugins.json vision "$VERSION" "${PLATFORMS[@]}"
            /tmp/registry-update \
              --registry /tmp/registry/manifest-plugins.json \
              --plugin vision --version "$VERSION" --channel stable \
              --released "$(date -u +%Y-%m-%d)" \
              --cert-identity "$CERT_ID" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "${ARGS[@]}"
          }
          # A release that runs beside another pushes to the same registry. A
          # rejected push rebases and runs register again; see the helper.
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/scripts/lib/registry-push.sh"
          registry_commit_and_push /tmp/registry "Register vision ${VERSION}" register manifest-plugins.json

  # The tap formula, rendered from this run's checksum artifacts. Runs beside
  # the registry write, not after it: `brew install` and `kapi plugin install`
  # are two views of the same release and neither is the other's gate.
  publish-vision-formula:
    name: Publish kapi-vision Homebrew formula
    if: startsWith(github.ref, 'refs/tags/vision-v')
    needs: publish-vision-release
    uses: ./.github/workflows/_publish-plugin-formula.yml
    with:
      plugin: vision
      tag: ${{ github.ref_name }}
    secrets: inherit
