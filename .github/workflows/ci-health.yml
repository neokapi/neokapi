name: CI Health (main)

# Track full-suite failures on main in one issue. Open or update the issue when
# a watched workflow fails, and close it after all watched workflows pass.
# This reports post-merge failures without changing per-PR checks.
#
# Nightly E2E failures keep the issue open until a subsequent run verifies the
# fix. To verify before the next scheduled run, dispatch e2e.yml explicitly
# with gh workflow run e2e.yml --ref <branch>.

on:
  workflow_run:
    workflows: ["CI", "Docs — kapi", "Nightly", "E2E"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  track:
    # Only the main branch's own runs (never forks / PR runs).
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or close the main-red tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          LABEL="ci-health"
          TITLE="🔴 main CI is red"
          WATCHED=("CI" "Docs — kapi" "Nightly" "E2E")

          # Ensure the label exists (idempotent).
          gh label create "$LABEL" --repo "$REPO" --color b60205 \
            --description "main full-suite CI is failing" 2>/dev/null || true

          # The single open tracking issue, if any.
          num() {
            gh issue list --repo "$REPO" --state open --label "$LABEL" \
              --limit 1 --json number --jq '.[0].number // empty'
          }

          # Is any watched workflow's LATEST main run currently failing?
          any_red() {
            local w c
            for w in "${WATCHED[@]}"; do
              c=$(gh run list --repo "$REPO" --branch main --workflow "$w" \
                    --limit 1 --json conclusion --jq '.[0].conclusion // ""' || echo "")
              if [ "$c" = "failure" ] || [ "$c" = "timed_out" ]; then
                echo "$w"; return 0
              fi
            done
            return 1
          }

          short="${SHA:0:9}"

          # Only a genuine failure is "red". A cancelled/skipped/neutral run means
          # the full suite didn't COMPLETE (commonly: rapid main merges supersede a
          # queued run) — not that main is broken — so it must not raise the alarm.
          # Those conclusions fall through to the close-check below, which reopens
          # nothing and closes the issue if main is actually green again.
          if [ "${CONCLUSION}" = "failure" ] || [ "${CONCLUSION}" = "timed_out" ]; then
            body=$(printf 'Workflow "%s" finished with "%s" on main at commit %s.\n\nRun: %s\n\npush-to-main and the nightly run the FULL suite (race detector, every module). A red here means main is broken even though the merging PR was green (its check was path-skipped). Fix forward or revert; this issue closes automatically when main is green across all watched workflows again.' \
              "$WF" "$CONCLUSION" "$short" "$RUN_URL")
            existing="$(num)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --label "$LABEL" --title "$TITLE" --body "$body"
            fi
            exit 0
          fi

          # A success: close the tracking issue only if NOTHING watched is still red.
          existing="$(num)"
          if [ -n "$existing" ]; then
            if red_wf="$(any_red)"; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "\`$WF\` passed on \`$short\`, but **$red_wf** is still red on \`main\`. Keeping this open."
            else
              gh issue comment "$existing" --repo "$REPO" \
                --body "✅ \`main\` is green again across all watched workflows (\`$WF\` passed on \`$short\`). Closing."
              gh issue close "$existing" --repo "$REPO"
            fi
          fi
