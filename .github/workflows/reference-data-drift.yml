name: Reference Data — Drift Gate

# CI gate: the committed reference dataset under packages/reference-data/data
# must match what `make generate-reference-docs` produces from the current
# source. A tool/format whose schema, description, or doc sidecar changed
# without regenerating the dataset fails this job before it can ship stale
# docs to the website /tools and /formats pages.
#
# The okapi-bridge plugin is not present in this repo's CI (it lives in a
# separate repo), so the gate compares only the built-in subset of each
# dataset — the part wholly controlled by this repo's Go source and the
# authored sidecars under scripts/gen-refs/nativedocs. The okapi entries are
# only validated when BRIDGE_PLUGIN points at a populated plugin dir.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "core/i18n/builtins/metadata.json"
      - "scripts/gen-refs/**"
      - "scripts/gen-contract-types/**"
      - "packages/reference-data/data/**"
      - "packages/contract-types/src/contract.gen.ts"
      - "packages/contract-types/src/content.gen.ts"
      - "core/proto/content/v1/**"
      - "cli/**/*.go"
      - "host/i18n/**"
      - "l10n/**"
      - "docs/internals/format-ops-ledger.json"
      - "core/formats/support.yaml"
      - "core/formats/constructs.yaml"
      - "core/formats/integrations.yaml"
      - "scripts/format-ops/**"
      - "web/scripts/gen-reference-pages.ts"
      - "web/src/components/reference/slugs.ts"
      - "web/docs/**"
      - "bowrain/web/docs/docs/**"
      - "kapi.yaml"
      - ".github/workflows/reference-data-drift.yml"
  pull_request:
    paths:
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "core/i18n/builtins/metadata.json"
      - "scripts/gen-refs/**"
      - "scripts/gen-contract-types/**"
      - "packages/reference-data/data/**"
      - "packages/contract-types/src/contract.gen.ts"
      - "packages/contract-types/src/content.gen.ts"
      - "core/proto/content/v1/**"
      - "cli/**/*.go"
      - "host/i18n/**"
      - "l10n/**"
      - "docs/internals/format-ops-ledger.json"
      - "core/formats/support.yaml"
      - "core/formats/constructs.yaml"
      - "core/formats/integrations.yaml"
      - "scripts/format-ops/**"
      - "web/scripts/gen-reference-pages.ts"
      - "web/src/components/reference/slugs.ts"
      - "web/docs/**"
      - "bowrain/web/docs/docs/**"
      - "kapi.yaml"
      - ".github/workflows/reference-data-drift.yml"

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: Reference dataset is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go-modules

      - name: Check reference dataset for drift
        run: make check-reference-docs

      - name: Check shared TS contract types for drift
        run: make check-contract-types

      - name: Validate format-ops ledger
        run: node scripts/format-ops/validate-ledger.mjs

      - name: Validate support tiers
        run: node scripts/format-ops/check-support-gates.mjs

      # Hard gate: the Go vocabulary packs (core/model/vocabularies/*.json) and
      # their verbatim TS copies (packages/*/src/vocabularies/) must not drift.
      - name: Vocabulary pack drift
        run: node scripts/format-ops/check-vocab-packs.mjs

      # The committed static per-entry reference pages under web/docs/reference
      # are generated from the dataset above (plus the slug helper). Regenerate
      # them and fail if a committed page is stale — gen-reference-pages.ts needs
      # only the @neokapi/reference-data package resolvable, so vp install
      # suffices (no i18n-react/wasm build).
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: vp install

      - name: Static reference pages are fresh
        run: |
          make generate-reference-pages
          git diff --exit-code -- web/docs/reference

  l10n-drift:
    name: l10n catalogs are fresh
    runs-on: ubuntu-latest
    # contents: write (overriding the workflow-level read) lets the l10n
    # auto-fix push regenerated catalogs back to same-repo PR branches. Only
    # this job gets it: the reference-dataset gates above are source-side and
    # stay strict.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Same-repo PRs check out the PR head branch (not the ephemeral
          # merge ref) so the l10n auto-fix below can commit + push to it.
          # Fork PRs and pushes keep the default checkout ('' = unset).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}

      - uses: ./.github/actions/setup-go-modules

      - name: Install libicu (kapi fts5 build dependency)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      # Regenerate the builtin metadata inventory, the CLI command inventory,
      # the embedded MO catalogs, and the demo-narration sidecars from the
      # committed l10n/ seeds (the regen prerequisites of l10n-verify). Seeds
      # are native .memory.json/.terms.json (deterministic, identity-preserving), so this
      # is byte-stable — which makes drift pure toil: on same-repo PRs the
      # script commits the regenerated files back to the PR branch and passes
      # (a rerun on the bot commit finds no diff, so this cannot loop; the
      # GITHUB_TOKEN push does not re-trigger workflows, so this run's checks
      # are authoritative). Fork PRs and pushes to main keep the strict
      # fail-on-drift gate (`make l10n-verify` stays the local command).
      - name: Check l10n catalogs for drift (auto-fix on same-repo PRs)
        env:
          AUTOFIX_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          AUTOFIX_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          bash scripts/l10n-autofix.sh l10n-builtins l10n-cli l10n-demos -- \
            core/i18n/builtins \
            core/i18n/catalogs \
            host/i18n/commands.json \
            host/i18n/catalogs \
            ':(glob)harness/demos/*/demo.*.yaml'

  # Docs surfaces gate (the l10n/README.md follow-up): the translated docs
  # trees (web/i18n/nb/, bowrain/web/docs/i18n/nb/) are gitignored build
  # artefacts, so there is no committed target to diff against — instead the
  # gate re-materializes both docs surfaces from the seeds TWICE and asserts
  # the two runs are byte-identical (regen proves regen: content memory-only recycle is a
  # deterministic function of source + seeds). A corrupted seed fails the
  # import or the diff; a source-doc change without seed updates still passes
  # (drift = pending target-language work, never a build break — CLAUDE.md).
  # Coverage is reported to the job summary but NEVER gates.
  docs-l10n-drift:
    name: docs surfaces regenerate deterministically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go-modules

      - name: Install libicu (kapi fts5 build dependency)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      # A clean seed import is itself a gate: `kapi memory import` fails on a
      # malformed .memory.json, so a corrupted seed stops here. (The l10n-* targets
      # depend on l10n-seed anyway; running it explicitly keeps the failure
      # attributable to the seeds rather than to a docs surface.)
      - name: Seed the dogfood content memory/terms from l10n/
        run: make l10n-seed

      - name: Materialize both docs surfaces (run 1)
        run: |
          make l10n-docs l10n-bowrain-docs
          cp -R web/i18n/nb /tmp/docs-nb-run1
          cp -R bowrain/web/docs/i18n/nb /tmp/bowrain-docs-nb-run1

      - name: Re-materialize both docs surfaces (run 2)
        run: make l10n-docs l10n-bowrain-docs

      - name: Regen determinism — the two runs must be byte-identical
        run: |
          diff -r /tmp/docs-nb-run1 web/i18n/nb
          diff -r /tmp/bowrain-docs-nb-run1 bowrain/web/docs/i18n/nb

      # Informational only: per-surface nb coverage. `kapi status` never fails
      # by design (drift is pending work, not an error), and low numbers must
      # not fail this job either — only nondeterminism or hard errors above do.
      - name: Coverage summary (informational — never gates)
        run: |
          {
            echo "## nb translation coverage (informational — drift never blocks)"
            echo ""
            echo '```'
            ./bin/kapi status
            echo '```'
            echo ""
            echo "Crude materialization measure (files that differ from their"
            echo "English source after content memory recycle; formatting normalization"
            echo "inflates this, so treat it as an upper bound):"
            echo ""
            echo "| surface | files with nb content |"
            echo "|---|---|"
            for spec in \
              "docs web/docs web/i18n/nb/docusaurus-plugin-content-docs/current" \
              "docs-bowrain bowrain/web/docs/docs bowrain/web/docs/i18n/nb/docusaurus-plugin-content-docs/current"; do
              read -r name src gen <<< "$spec"
              total=0; translated=0
              while IFS= read -r f; do
                rel=${f#"$gen"/}
                total=$((total + 1))
                cmp -s "$f" "$src/$rel" || translated=$((translated + 1))
              done < <(find "$gen" -type f \( -name '*.md' -o -name '*.mdx' \))
              echo "| $name | $translated / $total |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
