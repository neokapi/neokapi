name: Reference Data Drift Gate

# CI gate: the committed reference dataset under packages/reference-data/data
# must match what `make generate-reference-docs` produces from the current
# source. A tool/format whose schema, description, or doc sidecar changed
# without regenerating the dataset fails this job before it can ship stale
# docs to the website /tools and /formats pages.
#
# The okapi-bridge plugin is not present in this repo's CI (it lives in a
# separate repo), so the gate compares only the built-in subset of each
# dataset — the part wholly controlled by this repo's Go source and the
# authored sidecars under scripts/gen-refs/nativedocs. The okapi entries are
# only validated when BRIDGE_PLUGIN points at a populated plugin dir.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "core/i18n/builtins/metadata.json"
      - "scripts/gen-refs/**"
      - "scripts/gen-contract-types/**"
      - "packages/reference-data/data/**"
      - "packages/contract-types/src/contract.gen.ts"
      - "packages/contract-types/src/content.gen.ts"
      - "packages/contract-types/src/review.gen.ts"
      - "packages/i18n-react/src/plugin/defaults.ts"
      - "core/translatability/**"
      - "scripts/gen-translatability.ts"
      - "core/proto/content/v1/**"
      - "cli/**/*.go"
      - "host/**/*.go"
      - "kapi/**/*.go"
      - "host/i18n/**"
      - "docs/internals/format-ops-ledger.json"
      - "core/formats/support.yaml"
      - "core/formats/constructs.yaml"
      - "core/formats/integrations.yaml"
      - "scripts/format-ops/**"
      - "web/scripts/gen-reference-pages.ts"
      - "web/src/components/reference/slugs.ts"
      - "web/docs/**"
      - "bowrain/web/docs/docs/**"
      - "kapi.yaml"
      # The prose `check-governed-prose` gates, and what decides the verdict:
      # the rule lives in the voice profile, and the cask needs the plugin.
      # Without these a change to the cask's desc would not run the gate that
      # exists to read it.
      - ".kapi/voice.yaml"
      - "packaging/**"
      - "deploy/homebrew/**"
      - "apps/kapi-desktop/build/**"
      - "plugins/sourcecode/**"
      - ".github/workflows/reference-data-drift.yml"
  pull_request:
    paths:
      - "core/**/*.go"
      - "providers/**/*.go"
      - "memory/**/*.go"
      - "terms/**/*.go"
      - "core/i18n/builtins/metadata.json"
      - "scripts/gen-refs/**"
      - "scripts/gen-contract-types/**"
      - "packages/reference-data/data/**"
      - "packages/contract-types/src/contract.gen.ts"
      - "packages/contract-types/src/content.gen.ts"
      - "packages/contract-types/src/review.gen.ts"
      - "packages/i18n-react/src/plugin/defaults.ts"
      - "core/translatability/**"
      - "scripts/gen-translatability.ts"
      - "core/proto/content/v1/**"
      - "cli/**/*.go"
      - "host/**/*.go"
      - "kapi/**/*.go"
      - "host/i18n/**"
      - "docs/internals/format-ops-ledger.json"
      - "core/formats/support.yaml"
      - "core/formats/constructs.yaml"
      - "core/formats/integrations.yaml"
      - "scripts/format-ops/**"
      - "web/scripts/gen-reference-pages.ts"
      - "web/src/components/reference/slugs.ts"
      - "web/docs/**"
      - "bowrain/web/docs/docs/**"
      - "kapi.yaml"
      # The prose `check-governed-prose` gates, and what decides the verdict:
      # the rule lives in the voice profile, and the cask needs the plugin.
      # Without these a change to the cask's desc would not run the gate that
      # exists to read it.
      - ".kapi/voice.yaml"
      - "packaging/**"
      - "deploy/homebrew/**"
      - "apps/kapi-desktop/build/**"
      - "plugins/sourcecode/**"
      - ".github/workflows/reference-data-drift.yml"

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: Reference dataset is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go-modules

      - name: Check reference dataset for drift
        run: make check-reference-docs

      # The register of the dossiers the dataset is compiled from. `make
      # check-reference-prose` builds kapi, so it needs the cgo ICU/FTS5
      # toolchain the framework links.
      - name: Install ICU toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Check reference dossier prose
        run: make check-reference-prose

      # The distribution prose kapi governs: the package descriptions and the
      # Homebrew cask. These used to be swept by scripts/check-vocabulary.sh;
      # they are declared as collections now, so the rule is enforced by the
      # engine rather than by a second implementation of it in bash. The cask
      # needs the kapi-sourcecode plugin, which the target builds and stages.
      - name: Check the prose kapi governs
        run: make check-governed-prose

      # The documentation, gated per-PR for the first time. It was governed by
      # the voice profile and checked by nothing on a PR: dogfood-sync.yml runs
      # `kapi up` on a schedule, so a violation merged on a Tuesday surfaced on
      # Wednesday, on main. This is what lets check-vocabulary.sh stop carrying
      # a second copy of the rule for these surfaces.
      - name: Check the documentation prose
        run: make check-docs-prose

      - name: Check shared TS contract types for drift
        run: make check-contract-types

      # The W3C translatability table is defined once in TypeScript and
      # generated into Go. Two hand-kept copies of a spec table drift the
      # moment one side adds an element, and the symptom is a document that
      # quietly stops being translated.
      - name: Check the W3C translatability table for drift
        run: make check-translatability

      - name: Validate format-ops ledger
        run: node scripts/format-ops/validate-ledger.mjs

      - name: Validate support tiers
        run: node scripts/format-ops/check-support-gates.mjs

      # Hard gate: the Go vocabulary packs (core/model/vocabularies/*.json) and
      # their verbatim TS copies (packages/*/src/vocabularies/) must not drift.
      - name: Vocabulary pack drift
        run: node scripts/format-ops/check-vocab-packs.mjs

      # The committed static per-entry reference pages under web/docs/reference
      # are generated from the dataset above (plus the slug helper). Regenerate
      # them and fail if a committed page is stale — gen-reference-pages.ts needs
      # only the @neokapi/reference-data package resolvable, so vp install
      # suffices (no i18n-react/wasm build).
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: vp install

      - name: Static reference pages are fresh
        run: |
          make generate-reference-pages
          git diff --exit-code -- web/docs/reference
