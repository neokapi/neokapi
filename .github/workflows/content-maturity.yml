name: Content maturity

on:
  pull_request:
    # The code a probe measures and the tooling and data that publish it. A
    # probe imports more than this, so a change elsewhere that weakens a result
    # is caught by the weekly run. The check passes on a change that leaves
    # every result as committed, wherever it is.
    paths:
      - '.github/workflows/content-maturity.yml'
      - '.github/workflows/format-acceptance.yml'
      - '.claude/workflows/format-triage.js'
      - '.skills/refresh-format-maturity/**'
      - 'Makefile'
      - 'bowrain/Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'core/formats/**'
      - 'core/format/**'
      - 'core/model/**'
      - 'core/registry/**'
      - 'host/toolbox_conv*'
      - 'host/venue/source/**'
      - 'cli/toolbox_conv*'
      - 'kapi/e2e/workspace_test.go'
      - 'specs/**'
      - 'plugins/sourcecode/**'
      - 'bowrain/connector/**'
      - 'bowrain/core/connector/**'
      - 'bowrain/scripts/connector-inventory/**'
      - 'bowrain/scripts/connector-maturity/**'
      - 'scripts/format-ops/**'
      - 'scripts/proseprobe/**'
      - 'scripts/evalindex/**'
      - 'scripts/gen-refs/nativedocs/formats/**'
      - 'docs/internals/format-*.md'
      - 'docs/internals/format-*.json'
      - 'docs/internals/format-*.yaml'
      - 'docs/internals/content-maturity.md'
      - 'packages/docs-shared/src/capability/**'
      - 'web/src/pages/format-maturity/**'
      - 'web/static/data/format-maturity*.json'
      - 'web/static/data/content-capabilities*.json'
      - 'bowrain/web/docs/src/pages/connector-maturity*'
      - 'bowrain/web/docs/static/data/connector-capabilities*.json'
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-maturity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumers:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/format-acceptance.yml
    with:
      collect-receipts: true

  measure:
    needs: consumers
    if: >-
      ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.consumers.result == 'skipped')
          || (github.event_name != 'pull_request' && contains(fromJSON('["success","failure"]'), needs.consumers.result))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go-modules
        with:
          cache-flavor: pr
          save-cache: "false"
      - uses: ./.github/actions/setup-node-ui
      - uses: ./.github/actions/apt-install
        with:
          packages: libxml2-utils
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify the committed measurements
        if: github.event_name == 'pull_request'
        env:
          MATURITY_HISTORY_BASE: ${{ github.event.pull_request.base.sha }}
        run: make check-content-maturity
      - name: Verify the committed connector measurements
        if: github.event_name == 'pull_request'
        env:
          MATURITY_HISTORY_BASE: ${{ github.event.pull_request.base.sha }}
        run: make -C bowrain check-connector-maturity
      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: acceptance-receipts
          path: ${{ runner.temp }}/consumer-results
      - name: Import same-revision consumer results
        if: github.event_name != 'pull_request'
        env:
          ACCEPTANCE_JOB_RESULT: ${{ needs.consumers.result }}
        run: node scripts/format-ops/acceptance-receipts.mjs ingest "$RUNNER_TEMP/consumer-results/acceptance.json"
      - name: Record a new observation
        if: github.event_name != 'pull_request'
        run: |
          make refresh-content-maturity
          make -C bowrain refresh-connector-maturity
      # The proposed pull request is opened with GITHUB_TOKEN, so GitHub starts
      # no checks on it. The same checks run here, on the refreshed tree.
      - name: Check the new observation
        if: github.event_name != 'pull_request'
        run: |
          node scripts/format-ops/content-maturity.mjs --check
          node bowrain/scripts/connector-maturity/connector-maturity.mjs --check
      - name: Prepare the agent brief
        run: node scripts/format-ops/agent-brief.mjs > "$RUNNER_TEMP/maturity-brief.md"
      - uses: actions/upload-artifact@v7
        with:
          name: maturity-brief
          path: ${{ runner.temp }}/maturity-brief.md
      - name: Collect the reviewed paths
        if: github.event_name != 'pull_request'
        run: |
          git add -N bowrain/web/docs/static/data
          git diff --binary -- web/static/data/format-maturity*.json web/static/data/content-capabilities*.json \
            bowrain/web/docs/static/data/connector-capabilities*.json \
            web/src/pages/evals/_index.json docs/internals/format-maturity.md \
            docs/internals/format-ops-ledger.json > "$RUNNER_TEMP/maturity.patch"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: maturity-update
          path: ${{ runner.temp }}/maturity.patch

  propose:
    needs: measure
    if: ${{ !cancelled() && needs.measure.result == 'success' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: maturity-update
          path: ${{ runner.temp }}
      - name: Propose the dashboard refresh
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PR_NOTE: >-
            The producing run checked these measurements with content-maturity.mjs --check
            and connector-maturity.mjs --check before proposing them.
        run: |
          if test -s "$RUNNER_TEMP/maturity.patch"; then
            git apply "$RUNNER_TEMP/maturity.patch"
            bash scripts/auto-pr.sh bot/content-maturity "Refresh content maturity measurements" -- \
              web/static/data/format-maturity*.json web/static/data/content-capabilities*.json \
              bowrain/web/docs/static/data/connector-capabilities*.json \
              web/src/pages/evals/_index.json docs/internals/format-maturity.md docs/internals/format-ops-ledger.json
          fi
