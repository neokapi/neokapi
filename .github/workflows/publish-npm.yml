name: Publish npm packages

# Publishes the public @neokapi npm packages through npm Trusted Publishers
# (OIDC), with no NPM_TOKEN. Each package's trusted-publisher config on
# npmjs.com must name this workflow file in neokapi/neokapi. A version already
# on npm is skipped, so re-runs are safe.
#
# Release by pushing a scoped tag (`i18n-react-vX.Y.Z`, `kapi-format-vX.Y.Z`,
# `contract-types-vX.Y.Z` or `engine-vX.Y.Z`) that matches the package.json
# version, or run the workflow manually.
#
# A brand-new package is bootstrapped once locally through the same pnpm pack
# path, never a bare `npm publish` (see the publish step):
#   ( cd packages/<pkg> && corepack pnpm install && corepack pnpm run build \
#       && corepack pnpm pack --pack-destination "$TMPDIR" )
#   npm publish "$TMPDIR/<tarball>.tgz" --access public

on:
  push:
    tags:
      - "i18n-react-v*"
      - "i18n-react-lint-v*"
      - "kapi-format-v*"
      - "contract-types-v*"
      - "engine-v*"
  workflow_dispatch: {}

permissions:
  id-token: write # required: lets npm exchange the GitHub OIDC token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install vp + vpx, mirroring the setup-node-ui composite the rest of CI
      # uses. The kapi-format / neokapi-i18n build.mjs shell out to `vpx` (e.g.
      # `vpx tsc`), so it must be on PATH for the build step below.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version: "26"
          cache: true
          # A tag run restores the dependency cache main saved and saves none.
          cache-save: false

      # setup-node with registry-url is applied last so npm's registry/OIDC
      # config is the final node setup in effect for the publish step.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1. The npm bundled with
      # Node is newer, so this step only asserts the floor. A global
      # `npm install -g npm@latest` can leave npm's bundled `sigstore` module
      # unresolvable, and `npm publish --provenance` then fails with "Cannot
      # find module 'sigstore'".
      - name: Assert npm supports OIDC provenance (>= 11.5.1)
        run: |
          set -euo pipefail
          ver="$(npm --version)"
          min="11.5.1"
          echo "npm $ver (floor $min)"
          if [ "$(printf '%s\n%s\n' "$min" "$ver" | sort -V | head -n1)" != "$min" ]; then
            echo "npm $ver < $min — OIDC trusted publishing requires >= $min" >&2
            exit 1
          fi
          echo "npm $ver OK for OIDC trusted publishing"

      # On a tag push, verify the tag's version matches the package's
      # package.json so a release tag cannot drift from what ships.
      # GITHUB_REF_NAME is a built-in env var (the tag name), read in shell
      # rather than template-interpolated.
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          ref="$GITHUB_REF_NAME"
          case "$ref" in
            i18n-react-lint-v*) pkg=packages/i18n-react-lint; expected="${ref#i18n-react-lint-v}" ;;
            i18n-react-v*)     pkg=packages/i18n-react;     expected="${ref#i18n-react-v}" ;;
            kapi-format-v*)    pkg=packages/kapi-format;    expected="${ref#kapi-format-v}" ;;
            contract-types-v*) pkg=packages/contract-types; expected="${ref#contract-types-v}" ;;
            engine-v*)         pkg=packages/engine;         expected="${ref#engine-v}" ;;
            *) echo "::error::unrecognized release tag '$ref'"; exit 1 ;;
          esac
          actual="$(node -p "require('./$pkg/package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag '$ref' expects $pkg version '$expected' but package.json is '$actual'"
            exit 1
          fi
          echo "OK: tag '$ref' matches $pkg@$actual"

      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      # Build in dependency order: neokapi-i18n consumes @neokapi/kapi-format and
      # @neokapi/engine consumes @neokapi/contract-types.
      - name: Build packages
        run: |
          pnpm --filter @neokapi/kapi-format run build
          pnpm --filter @neokapi/i18n-react run build
          pnpm --filter @neokapi/i18n-react-lint run build
          pnpm --filter @neokapi/contract-types run build
          pnpm --filter @neokapi/engine run build

      # Publish in dependency order (kapi-format before neokapi-i18n,
      # contract-types before engine), skipping a version already on npm.
      #
      # The packages split `exports` (TS src, for in-repo consumers) from
      # `publishConfig.exports` (built dist). Only `pnpm pack` applies that
      # substitution, so a tarball from it is published with
      # `npm publish <tarball>`, which keeps OIDC provenance; only the npm CLI
      # implements the trusted-publishing token exchange (pnpm#9812).
      #
      # The root .npmrc maps @neokapi to GitHub Packages, and a scope registry
      # wins over `--registry`, so the existence check and the publish both pass
      # `--@neokapi:registry=...`.
      - name: Publish @neokapi packages
        run: |
          set -euo pipefail
          publish_pkg() {
            dir="$1"; name="$2"
            ver="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${name}@${ver}" version --@neokapi:registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "${name}@${ver} already published — skipping"
              return
            fi
            # pnpm names the tarball "<scope-stripped>-<name>-<version>.tgz"
            # (e.g. @neokapi/contract-types → neokapi-contract-types-0.1.0.tgz).
            tgz="${name#@}"; tgz="${tgz//\//-}-${ver}.tgz"
            ( cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" )
            npm publish "$RUNNER_TEMP/$tgz" --provenance --access public --@neokapi:registry=https://registry.npmjs.org/
          }
          publish_pkg packages/kapi-format     @neokapi/kapi-format
          publish_pkg packages/i18n-react      @neokapi/i18n-react
          publish_pkg packages/i18n-react-lint @neokapi/i18n-react-lint
          publish_pkg packages/contract-types @neokapi/contract-types
          publish_pkg packages/engine         @neokapi/engine
