name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2 AM UTC
  # The Docker suites stay nightly — they need four images and a database, and a
  # PR should not wait on them. Use workflow_dispatch to run the whole lane.
  #
  # The two self-contained suites are pre-merge, and both earned it the same
  # way. The Kapi CLI job went red on 2026-07-26 and stayed red because #1462
  # rewrote a CLI flag inside it. The Playwright job went red when #1775 moved
  # the desktop adapter onto its REST proxy transport and the mock backend did
  # not follow: every spec died on the launch probe, and because the job was
  # nightly-only, nothing said so. Both are failures a path-gated pre-merge run
  # would have put in front of a reviewer instead of in a log nobody opens.
  #
  # Each job filters on the surface it actually exercises (see the `changes`
  # job), so a CLI-only PR does not pay for browsers and a frontend-only PR does
  # not pay for Go.
  pull_request:
    paths:
      - "cli/**"
      - "host/**"
      - "kapi/**"
      - "bowrain/packages/**"
      - "bowrain/apps/bowrain/frontend/**"
      - "packages/i18n-react/**"
      - "packages/ui/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read
  packages: write

jobs:
  # ── Which surface did this PR touch? ──────────────────────────────────────
  # GitHub filters paths per workflow, not per job, so the union above would
  # otherwise run both suites for either kind of change. Outside a pull request
  # (nightly, dispatch) both filters report true and everything runs.
  changes:
    name: Detect touched surfaces
    # Only a pull request has a base to diff against. Nightly and dispatch runs
    # skip this and the suites below fall through to running unconditionally —
    # which is why those conditions lead with the event check and are wrapped in
    # !cancelled(): a skipped `needs` would otherwise skip its dependents, and
    # silently disabling the nightly lane is the exact failure this file is
    # meant to stop happening.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'host/**'
              - 'kapi/**'
              - '.github/workflows/e2e.yml'
            frontend:
              - 'bowrain/packages/**'
              - 'bowrain/apps/bowrain/frontend/**'
              - 'packages/i18n-react/**'
              - 'packages/ui/**'
              - '.github/workflows/e2e.yml'

  # ── Kapi CLI E2E (no Docker, no external services) ────────────────────────
  kapi-e2e:
    name: Kapi CLI E2E
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.cli == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      # Through the make target, not a raw `go test`: the Makefile owns the tag
      # set, and `go` does not union repeated -tags flags — the last one wins.
      # Spelling the tags here had already dropped fts5, which no test would
      # have reported, because fts5 is a runtime SQL capability rather than a
      # compile gate. The target also builds the i18n catalogs the suite reads
      # and selects ./kapi/e2e/..., so CI and a local run test the same thing.
      - name: Run kapi CLI e2e tests
        working-directory: .
        run: make test-e2e-kapi
        timeout-minutes: 5

  # ── Bowrain frontend Playwright E2E (self-contained, mock backend) ───────
  playwright:
    name: Playwright E2E
    needs: changes
    # Pre-merge on the surfaces it covers: this suite is the only thing that
    # exercises the desktop app end to end, including the REST transport its
    # mock backend has to keep pace with.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The Playwright dev WebServer bundles @neokapi/ui, which imports
      # @neokapi/i18n-react/runtime (a built ./dist subpath export). Build it
      # first so the WebServer's vite build resolves the import.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      # Bindings are committed and already patched (sed fix for $0. bug).
      # Do NOT regenerate with wails3 — it would overwrite the fixed files.

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: bowrain/apps/bowrain/frontend
        run: vpx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: bowrain/apps/bowrain/frontend
        run: vpx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: bowrain/apps/bowrain/frontend/playwright-report/
          retention-days: 30

  # ── Build Docker images (prerequisites for Docker E2E) ───────────────────
  build-images:
    name: Build E2E Images
    if: github.event_name != 'pull_request' # heavy: four Docker images — nightly only
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-ui

      - name: Compute image tag
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "tag=${GH_SHA}"
            echo "version=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-server/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-server:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-server:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-server
          cache-to: type=gha,mode=max,scope=bowrain-server

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-worker:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-worker:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-worker
          cache-to: type=gha,mode=max,scope=bowrain-worker

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-web/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-web:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-web:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-web
          cache-to: type=gha,mode=max,scope=bowrain-web

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The keycloak theme bundles @neokapi/ui → @neokapi/i18n-react/runtime
      # (dist-only export); build neokapi-i18n first so its vite build resolves it.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Build Keycloak theme
        run: make -C bowrain keycloak-theme

      - name: Build and push keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-keycloak:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-keycloak:e2e
          cache-from: type=gha,scope=bowrain-keycloak
          cache-to: type=gha,mode=max,scope=bowrain-keycloak

  # ── Bowrain server Docker stack E2E ────────────────────────────────────────
  # Rehabilitated (#867) and BLOCKING: the async bowrain-worker (+redis) now
  # runs in the E2E compose so sync push completes, and the web-app Playwright
  # suite (bowrain/apps/web/e2e: claim-flow, routing, open-in-desktop,
  # editor-happy-path) runs against the stack. This is the launch smoke test —
  # it gates the workflow.
  bowrain-e2e:
    name: Bowrain E2E (Docker)
    if: github.event_name != 'pull_request' # heavy: full Docker stack — nightly only
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      - uses: ./.github/actions/setup-node-ui

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start E2E stack
        env:
          # Pin to the per-commit tag pushed by build-images — the mutable :e2e
          # tag races when two workflow runs overlap.
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export BOWRAIN_SERVER_IMAGE=ghcr.io/neokapi/bowrain-server:$IMAGE_TAG
          export BOWRAIN_WORKER_IMAGE=ghcr.io/neokapi/bowrain-worker:$IMAGE_TAG
          export BOWRAIN_WEB_IMAGE=ghcr.io/neokapi/bowrain-web:$IMAGE_TAG
          export BOWRAIN_KEYCLOAK_IMAGE=ghcr.io/neokapi/bowrain-keycloak:$IMAGE_TAG
          docker compose -f bowrain/e2e/server/compose.yaml up -d --wait
        timeout-minutes: 5

      # The stack is already up from the step above, so this cannot go through
      # `make test-e2e-bowrain` (which owns setup and teardown) and must spell
      # its own tags. Both must be in ONE comma-joined flag: `go` does not union
      # repeated -tags, the last occurrence wins. The suite's test binary links
      # go-sqlite3, so dropping fts5 compiles a build without FTS5 that fails
      # only when a query reaches it — silently, and far from here.
      - name: Run Bowrain server E2E tests
        run: go test -tags "fts5,e2e" -count=1 -v ./bowrain/e2e/server/
        timeout-minutes: 5

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: bowrain/apps/web
        run: vpx playwright install --with-deps chromium

      # The cloud suite talks to a live server over HTTP and nothing else, so it
      # rides the stack that is already up rather than standing one of its own.
      # This is the half of its lane that exercises responses; the half that
      # catches route drift pre-merge is TestSharedClientRouteSurface, which
      # needs no stack and runs in the ordinary bowrain Go job.
      #
      # Through the make target, not a bare `playwright test`: bowrain/e2e/cloud
      # is deliberately outside the pnpm workspace, so its dependencies and
      # browsers are installed by run.sh rather than by the root install, and CI
      # runs what a developer runs.
      - name: Run cloud E2E tests
        env:
          BOWRAIN_URL: http://localhost:8080
          KEYCLOAK_URL: http://localhost:8180
        run: make -C bowrain test-e2e-cloud
        timeout-minutes: 10

      - name: Upload cloud test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cloud-e2e-report
          path: |
            bowrain/e2e/cloud/playwright-report/
            bowrain/e2e/cloud/test-results/
          retention-days: 30

      - name: Run web app E2E tests
        working-directory: bowrain/apps/web
        run: vpx playwright test --config playwright.e2e.config.ts
        # A 5-minute cap could not contain this suite: brand-scan-onboarding
        # alone sets test.setTimeout(180_000), so one slow test may legitimately
        # spend 3 of the 5 minutes, and the layout-scroll matrix costs 13s each.
        # On 2026-07-29 the step was killed mid-run and reported a timeout rather
        # than the two specs that actually failed — a cap that truncates the
        # report hides the defect it was supposed to surface. The job's own
        # timeout-minutes: 15 remains the real backstop.
        timeout-minutes: 10

      # The Playwright job has always uploaded its report; this one never did,
      # so a failure here left only the console tail — no trace, no screenshot,
      # no error-context. That is a large part of why these two specs stayed
      # unexplained for a fortnight.
      - name: Upload web app test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-e2e-report
          path: |
            bowrain/apps/web/playwright-report/
            bowrain/apps/web/test-results/
          retention-days: 30

      - name: Dump server + worker logs
        if: failure()
        run: docker compose -f bowrain/e2e/server/compose.yaml logs --no-color --tail 300

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f bowrain/e2e/server/compose.yaml down -v
