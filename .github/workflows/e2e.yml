name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2 AM UTC
  # The Docker and browser suites stay nightly — they are heavy, and a PR should
  # not wait on them. Use workflow_dispatch to run the whole lane for a branch.
  #
  # The Kapi CLI job is the exception, and it earned it. It needs no Docker, no
  # browser and no services; it takes under two minutes. It also spent thirteen
  # nights red because #1462 rewrote a CLI flag inside it — a change that touched
  # cli/ and host/, so a path-gated pre-merge run would have caught it in review
  # instead of in a nightly nobody read. The paths below are the CLI surface it
  # actually exercises, deliberately not `core/**`: broad enough to catch a flag
  # or command rename, narrow enough that most PRs never trigger it.
  pull_request:
    paths:
      - "cli/**"
      - "host/**"
      - "kapi/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read
  packages: write

jobs:
  # ── Kapi CLI E2E (no Docker, no external services) ────────────────────────
  kapi-e2e:
    name: Kapi CLI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules

      - name: Run kapi CLI e2e tests
        working-directory: .
        run: go test -tags=e2e -count=1 -v ./kapi/e2e/
        timeout-minutes: 5

  # ── Bowrain frontend Playwright E2E (self-contained, mock backend) ───────
  playwright:
    name: Playwright E2E
    if: github.event_name != 'pull_request' # heavy: browsers — nightly only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The Playwright dev WebServer bundles @neokapi/ui, which imports
      # @neokapi/i18n-react/runtime (a built ./dist subpath export). Build it
      # first so the WebServer's vite build resolves the import.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      # Bindings are committed and already patched (sed fix for $0. bug).
      # Do NOT regenerate with wails3 — it would overwrite the fixed files.

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: bowrain/apps/bowrain/frontend
        run: vpx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: bowrain/apps/bowrain/frontend
        run: vpx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: bowrain/apps/bowrain/frontend/playwright-report/
          retention-days: 30

  # ── Build Docker images (prerequisites for Docker E2E) ───────────────────
  build-images:
    name: Build E2E Images
    if: github.event_name != 'pull_request' # heavy: four Docker images — nightly only
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-ui

      - name: Compute image tag
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "tag=${GH_SHA}"
            echo "version=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-server/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-server:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-server:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-server
          cache-to: type=gha,mode=max,scope=bowrain-server

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-worker:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-worker:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-worker
          cache-to: type=gha,mode=max,scope=bowrain-worker

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-web/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-web:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-web:e2e
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-web
          cache-to: type=gha,mode=max,scope=bowrain-web

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The keycloak theme bundles @neokapi/ui → @neokapi/i18n-react/runtime
      # (dist-only export); build neokapi-i18n first so its vite build resolves it.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Build Keycloak theme
        run: make -C bowrain keycloak-theme

      - name: Build and push keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-keycloak:${{ steps.meta.outputs.tag }}
            ghcr.io/neokapi/bowrain-keycloak:e2e
          cache-from: type=gha,scope=bowrain-keycloak
          cache-to: type=gha,mode=max,scope=bowrain-keycloak

  # ── Bowrain server Docker stack E2E ────────────────────────────────────────
  # Rehabilitated (#867) and BLOCKING: the async bowrain-worker (+redis) now
  # runs in the E2E compose so sync push completes, and the web-app Playwright
  # suite (bowrain/apps/web/e2e: claim-flow, routing, open-in-desktop,
  # editor-happy-path) runs against the stack. This is the launch smoke test —
  # it gates the workflow.
  bowrain-e2e:
    name: Bowrain E2E (Docker)
    if: github.event_name != 'pull_request' # heavy: full Docker stack — nightly only
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-modules
      - uses: ./.github/actions/setup-node-ui

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start E2E stack
        env:
          # Pin to the per-commit tag pushed by build-images — the mutable :e2e
          # tag races when two workflow runs overlap.
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export BOWRAIN_SERVER_IMAGE=ghcr.io/neokapi/bowrain-server:$IMAGE_TAG
          export BOWRAIN_WORKER_IMAGE=ghcr.io/neokapi/bowrain-worker:$IMAGE_TAG
          export BOWRAIN_WEB_IMAGE=ghcr.io/neokapi/bowrain-web:$IMAGE_TAG
          export BOWRAIN_KEYCLOAK_IMAGE=ghcr.io/neokapi/bowrain-keycloak:$IMAGE_TAG
          docker compose -f bowrain/e2e/server/compose.yaml up -d --wait
        timeout-minutes: 5

      - name: Run Bowrain server E2E tests
        run: go test -tags=e2e -count=1 -v ./bowrain/e2e/server/
        timeout-minutes: 5

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: bowrain/apps/web
        run: vpx playwright install --with-deps chromium

      - name: Run web app E2E tests
        working-directory: bowrain/apps/web
        run: vpx playwright test --config playwright.e2e.config.ts
        # A 5-minute cap could not contain this suite: brand-scan-onboarding
        # alone sets test.setTimeout(180_000), so one slow test may legitimately
        # spend 3 of the 5 minutes, and the layout-scroll matrix costs 13s each.
        # On 2026-07-29 the step was killed mid-run and reported a timeout rather
        # than the two specs that actually failed — a cap that truncates the
        # report hides the defect it was supposed to surface. The job's own
        # timeout-minutes: 15 remains the real backstop.
        timeout-minutes: 10

      # The Playwright job has always uploaded its report; this one never did,
      # so a failure here left only the console tail — no trace, no screenshot,
      # no error-context. That is a large part of why these two specs stayed
      # unexplained for a fortnight.
      - name: Upload web app test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-e2e-report
          path: |
            bowrain/apps/web/playwright-report/
            bowrain/apps/web/test-results/
          retention-days: 30

      - name: Dump server + worker logs
        if: failure()
        run: docker compose -f bowrain/e2e/server/compose.yaml logs --no-color --tail 300

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f bowrain/e2e/server/compose.yaml down -v
