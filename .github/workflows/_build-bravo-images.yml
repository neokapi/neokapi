name: _Build Bravo Images

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Image tag"
        required: true
        type: string

jobs:
  build:
    name: Build Bravo Agent & Sandbox Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # The tag this workflow pushes besides `main`. `latest` belongs to the
      # release (scripts/check-release-build-only.py relies on this step).
      - name: Refuse latest as the image tag
        env:
          TAG: ${{ inputs.image-tag }}
        run: |
          if [ "$TAG" = latest ] || [ -z "$TAG" ]; then
            echo "::error::image-tag must be a commit or version tag, not '$TAG'; latest belongs to the release"
            exit 1
          fi
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push bravo-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bravo-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bravo-agent:${{ inputs.image-tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/neokapi/bravo-agent:main' || '' }}
          cache-from: type=gha,scope=bravo-agent
          # Only a run on main saves the layer cache; any other ref reads it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=bravo-agent' || '' }}

      - name: Build and push bravo-sandbox-node image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bravo-sandbox-node/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bravo-sandbox-node:${{ inputs.image-tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/neokapi/bravo-sandbox-node:main' || '' }}
          cache-from: type=gha,scope=bravo-sandbox-node
          # Only a run on main saves the layer cache; any other ref reads it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=bravo-sandbox-node' || '' }}

      - name: Build and push bravo-sandbox-python image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bravo-sandbox-python/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bravo-sandbox-python:${{ inputs.image-tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/neokapi/bravo-sandbox-python:main' || '' }}
          cache-from: type=gha,scope=bravo-sandbox-python
          # Only a run on main saves the layer cache; any other ref reads it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=bravo-sandbox-python' || '' }}
