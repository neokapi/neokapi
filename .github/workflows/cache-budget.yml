name: Cache Budget

# Keeps the repository's Actions caches under 9 GiB, a gibibyte short of the
# 10 GiB at which GitHub starts evicting the oldest. After each CI run on main
# it deletes the caches nothing will restore (scripts/ci-cache-budget.py names
# them), then checks the total. The daily run checks the total too, and a
# failed scheduled run files an issue through scheduled-failure-issue.yml.
#
# The token here is the default branch's: a pull request never runs this.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-budget
  cancel-in-progress: false

jobs:
  prune:
    name: Prune the Actions caches
    runs-on: ubuntu-latest
    # A workflow_run fires for a pull request whose head branch is named main
    # as well, so require a push. A dispatch runs only from main: on another
    # branch it would run that branch's code with a token that deletes caches.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push')
    timeout-minutes: 10
    permissions:
      actions: write # delete caches
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Delete superseded and off-main caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci-cache-budget.py prune

  check:
    name: Check the Actions caches against the budget
    needs: [prune]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # list caches
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check the totals against the budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci-cache-budget.py check
