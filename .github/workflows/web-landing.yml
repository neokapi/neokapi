name: Web Landing

# Builds the bowrain-web-landing Vite app and uploads it as an artifact for PR
# PREVIEWS: Pages Deploy slots it at /web/prs/<N>/bowrain/ on R2. PRODUCTION now
# publishes to https://bowrain.cloud (S3+CloudFront) via deploy-landing.yml — so
# this workflow is preview-only and no longer runs on push to main.
#
# (The neokapi landing was retired: the neokapi Docusaurus site is now the
# product landing page at /web/neokapi/, built by the "Docs — kapi" workflow.)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bowrain/web/landing/**"
      - ".github/workflows/web-landing.yml"

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: vp install

      # landing/vite.config.ts imports @neokapi/i18n-react's vite plugin (i18n
      # extraction transform), a built ./dist subpath export — build it first
      # so the config loads (mirrors ci-frontend / kapi-desktop-frontend).
      - name: Build neokapi-i18n (landing vite plugin dependency)
        run: cd packages/i18n-react && vp run build

      - name: Determine VITE_BASE per environment
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "bowrain_base=/web/prs/${PR_NUMBER}/bowrain/" >> "$GITHUB_OUTPUT"
          else
            echo "bowrain_base=/web/bowrain/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bowrain-web-landing
        working-directory: bowrain/web/landing
        env:
          VITE_BASE: ${{ steps.base.outputs.bowrain_base }}
          # Cookieless analytics (see src/analytics.ts). The key is the PUBLIC
          # client-side key already hardcoded in _build-web.yml; set only on
          # push so PR previews and forks never initialize analytics. Empty
          # key → the page executes zero analytics code.
          VITE_POSTHOG_KEY: ${{ github.event_name != 'pull_request' && 'phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD' || '' }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
        run: vp run build

      # nb variant → dist/nb/ (same artifact). Inline-mode build from the
      # committed translations/nb.json catalog (drift-gated by the
      # emails-landing-l10n CI job), so no kapi toolchain is needed here.
      # English falls through for any string the seed does not yet cover.
      - name: Build bowrain-web-landing (nb variant)
        working-directory: bowrain/web/landing
        env:
          VITE_BASE: ${{ steps.base.outputs.bowrain_base }}
          VITE_POSTHOG_KEY: ${{ github.event_name != 'pull_request' && 'phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD' || '' }}
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
        run: vp run build:nb

      # The conversion event is captured inside the click listener, where a
      # refactor has already lost it once. The unit suite asserts the capture
      # happens on that path; the smoke suite below cannot, because a page that
      # rewrites the link and captures nothing still reaches the app.
      - name: Unit-test the landing page
        working-directory: bowrain/web/landing
        run: vpr test

      # The smoke suite guards the two things that break without failing
      # anything: the narrative order the six sections are told in, and the
      # click path that carries utm_* to the app and fires the conversion
      # event. It needs no backend — both are client-side — and starts its own
      # dev server.
      - name: Install Playwright browser
        working-directory: bowrain/web/landing
        run: vpx playwright install --with-deps chromium

      - name: Smoke-test the landing page
        working-directory: bowrain/web/landing
        run: vpr test:e2e

      - name: Upload bowrain-web artifact
        uses: actions/upload-artifact@v7
        with:
          name: bowrain-web
          path: bowrain/web/landing/dist
          retention-days: 7
