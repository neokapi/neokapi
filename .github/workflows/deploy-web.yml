name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/web/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Web Assets
    uses: ./.github/workflows/_build-web.yml

  deploy:
    name: Deploy to S3 + CloudFront
    # No-op until the SPA bucket exists (set by the spa-s3-cloudfront migration):
    # with the repo var unset the job is skipped and the workflow stays green
    # (build + artifact only).
    if: ${{ vars.SPA_WEB_BUCKET != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Download web assets
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Static SPA deploy: sync the built bundle to the private S3 origin, then
      # invalidate CloudFront. Fingerprinted assets (/assets/*) are immutable and
      # long-cached; the shell (index.html) and update manifest (version.json)
      # must always revalidate so clients pick up new asset hashes. The final
      # CloudFront invalidation purges the edge so the new release is live at once.
      # Rollback = re-run this workflow from an older commit.
      - name: Sync to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.SPA_WEB_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.SPA_WEB_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "version.json"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          if [ -f dist/version.json ]; then
            aws s3 cp dist/version.json "s3://$BUCKET/version.json" \
              --cache-control "no-cache" --content-type "application/json"
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
