name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/web/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Web Assets
    uses: ./.github/workflows/_build-web.yml

  docker:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "version=$(git describe --tags --always 2>/dev/null || echo dev)"
            echo "commit=${GH_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-web/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-web:${{ github.sha }}
            ghcr.io/neokapi/bowrain-web:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=bowrain-web
          cache-to: type=gha,mode=max,scope=bowrain-web

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Task definitions are Terraform-owned and pin :latest — the forced
      # deployment makes ECS re-pull the :latest image pushed above. All three
      # SPAs (web, ctrl, pulse) run as containers of the single spa service.
      # Rollback = re-run this workflow from an older commit (a retag
      # workflow_dispatch input can make that a one-click revert later).
      - name: Force new deployment of the SPA service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: bowrain-${{ inputs.environment || 'prod' }}-spa
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
