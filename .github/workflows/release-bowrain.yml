name: Release Bowrain

on:
  push:
    tags:
      # Bowrain track only (bowrain-v1.2.3). The kapi CLI + Kapi Desktop release
      # on plain v* tags via release.yml; the per-plugin workflows own their own
      # <plugin>-v* namespaces. This filter matches neither.
      - "bowrain-v[0-9]*"
  # Reusable entry point for release-coordinated.yml; see release.yml for the
  # mirror. Lets the coordinator run the bowrain track with an explicit version
  # and gate the publish jobs so kapi + bowrain land together.
  # A build-only run on any branch: every build job runs, and nothing is
  # signed, published or pushed. For measuring a change to the release
  # builds (their caches, their duration) without making a release.
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build only; sign, publish and push nothing (must stay true)."
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 2.1.0 (no leading bowrain-v)."
        type: string
        required: true
      coordinated:
        description: "Route publish jobs through the coordinated-release approval gate."
        type: boolean
        default: false

# Read only. A job that publishes asks for what its steps write, and every
# such job is skipped on a build-only run, so a dispatched run holds no write
# permission whatever its branch does (scripts/check-release-build-only.py).
permissions:
  contents: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  # Resolve version/tag once for both trigger modes (tag push vs coordinated
  # workflow_call). Mirrors release.yml's setup job; the only difference is the
  # bowrain-v tag prefix. Downstream jobs read needs.setup.outputs.tag via a
  # job-level REF_NAME env so existing tag-stripping logic is unchanged.
  setup:
    name: Resolve release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      coordinated: ${{ steps.r.outputs.coordinated }}
      prerelease: ${{ steps.r.outputs.prerelease }}
      build_only: ${{ steps.r.outputs.build_only }}
    steps:
      - id: r
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_COORD: ${{ inputs.coordinated }}
          PUSH_REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_only=false
          if [ "$EVENT" = workflow_dispatch ]; then
            # A dispatch always builds only, whatever the input says.
            build_only=true
            IN_VERSION="0.0.0-dispatch.${RUN_NUMBER}"
          fi
          if [ -n "${IN_VERSION:-}" ]; then
            ver="${IN_VERSION#bowrain-v}"; ver="${ver#v}"
            tag="bowrain-v${ver}"; coord="${IN_COORD:-false}"
          else
            tag="${PUSH_REF}"; ver="${PUSH_REF#bowrain-v}"; coord="false"
          fi
          case "$ver" in *-*) pre="true" ;; *) pre="false" ;; esac
          {
            echo "version=$ver"
            echo "tag=$tag"
            echo "coordinated=$coord"
            echo "prerelease=$pre"
            echo "build_only=$build_only"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs/internals/gardening.yaml
            providers/ai/models.json
            scripts/gardening-due.py
          sparse-checkout-cone-mode: false

      # Bowrain reads the same model catalog (bowrain/platformconfig,
      # bowrain/billing), so the release gate in docs/internals/gardening.yaml
      # applies here as in release.yml. A build-only dispatch reports the age.
      - name: Check the model catalog is fresh enough to release
        env:
          BUILD_ONLY: ${{ steps.r.outputs.build_only }}
        run: |
          if [ "$BUILD_ONLY" = true ]; then
            python3 scripts/gardening-due.py --release-gate model-catalog --report-only
          else
            python3 scripts/gardening-due.py --release-gate model-catalog
          fi

  # Build the kapi-bowrain plugin binary natively per OS/arch with cgo +
  # statically-linked ICU + the fts5 tag, matching the framework the desktop
  # apps use. Mirrors release.yml's build-cli, but builds ONLY kapi-bowrain (the
  # kapi CLI itself is built + released by release.yml). The kapi-bowrain binary
  # is not Apple-notarized (it is cosign-signed in package-bowrain-cli, the same
  # as in the former combined workflow).
  build-bowrain-cli:
    name: Build kapi-bowrain (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    needs: [setup]
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: arm64, os: macos-latest, icu: brew }
          - { goos: linux, goarch: amd64, os: ubuntu-latest, icu: source }
          - { goos: linux, goarch: arm64, os: ubuntu-24.04-arm, icu: source }
          - { goos: windows, goarch: amd64, os: windows-2025, icu: msys2, msystem: MINGW64, mtriple: x86_64, cc: gcc, cgo_ldflags: "-static -static-libgcc -static-libstdc++", mroot: /mingw64 }
          - { goos: windows, goarch: arm64, os: windows-11-arm, icu: msys2, msystem: CLANGARM64, mtriple: clang-aarch64, cc: clang, cgo_ldflags: "-static", mroot: /clangarm64 }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # A tag run saves no cache: one saved there serves only that tag.
          # The next two steps restore what release-caches.yml saves on main.
          cache: false

      - name: Resolve the Go cache paths
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches main saved
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: go-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          VERSION="${REF_NAME#bowrain-v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "LDFLAGS=-s -w -X github.com/neokapi/neokapi/core/version.Version=${VERSION} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.pluginVersion=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create //go:embed placeholders
        shell: bash
        run: |
          mkdir -p bowrain/apps/bowrain/frontend/dist && touch bowrain/apps/bowrain/frontend/dist/placeholder
          mkdir -p apps/kapi-desktop/frontend/dist && touch apps/kapi-desktop/frontend/dist/placeholder

      # ---- ICU provisioning (sets PKG_CONFIG_PATH for the static .pc) ----
      # macOS and Linux build ICU from source with the trimmed data set
      # (scripts/icu-data-filter.json); see the matching comment in
      # release.yml's build-cli job. Cached on the filter + script hash.
      # Restores what a run on main saved; a tag run saves nothing.
      - name: Restore static ICU
        if: matrix.target.goos != 'windows'
        uses: actions/cache/restore@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-macos13.0-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}
      # A build-only run restores the same key and saves nothing.
      - name: Restore static ICU (build-only run)
        if: ${{ (matrix.target.goos != 'windows') && needs.setup.outputs.build_only == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-macos13.0-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}

      - name: Provision static ICU (macOS, from source, trimmed data)
        if: matrix.target.goos == 'darwin'
        env:
          # Match the Go build's deployment target so the ICU objects do too.
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          brew install pkg-config
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          {
            echo "PKG_CONFIG_PATH=${PCDIR}"
            echo "MACOSX_DEPLOYMENT_TARGET=13.0"
          } >> "$GITHUB_ENV"

      - name: Provision static ICU (Linux, from source, trimmed data)
        if: matrix.target.goos == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl python3 unzip
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          echo "PKG_CONFIG_PATH=${PCDIR}" >> "$GITHUB_ENV"

      # The plugin links core/i18n and host/i18n, whose embedded gettext
      # catalogs are build output compiled from the committed translated JSON.
      - name: Compile the embedded i18n catalogs
        if: matrix.target.goos != 'windows'
        run: go run ./core/i18n/gen/catalogs

      # ---- Build (macOS / Linux) ----
      - name: Build kapi-bowrain (macOS / Linux)
        if: matrix.target.goos != 'windows'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          mkdir -p out
          ( cd bowrain/plugin && go build -tags fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o ../../out/kapi-bowrain ./cmd/kapi-bowrain ) 2>&1 | tee build.log
          if [ "$GOOS" = darwin ]; then
            scripts/check-macho-minimum.sh --log build.log out/kapi-bowrain "$HOME"/icu-static/lib/libicu*.a
          fi

      # Guard the trimmed ICU data against the exact static ICU just linked:
      # see the matching step in release.yml's build-cli job.
      - name: ICU trimmed-data smoke test
        if: matrix.target.goos != 'windows'
        run: go test -tags fts5 -count=1 ./core/segment/... ./core/storage/

      # ---- Build (Windows, MSYS2 mingw + static ICU) ----
      - name: Set up MSYS2 (Windows)
        if: matrix.target.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.target.msystem }}
          # A tag run saves no cache.
          cache: false
          path-type: inherit
          install: >-
            mingw-w64-${{ matrix.target.mtriple }}-${{ matrix.target.cc }}
            mingw-w64-${{ matrix.target.mtriple }}-icu
            mingw-w64-${{ matrix.target.mtriple }}-pkg-config

      - name: Build kapi-bowrain (Windows)
        if: matrix.target.goos == 'windows'
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"
          CGO_LDFLAGS: ${{ matrix.target.cgo_ldflags }}
          CC: ${{ matrix.target.cc }}
          MROOT: ${{ matrix.target.mroot }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          export CC
          PCDIR=$(ICU_LIBDIR="$(cygpath -m "$MROOT/lib")" ICU_INCLUDEDIR="$(cygpath -m "$MROOT/include")" bash scripts/gen-icu-static-pc.sh)
          export PKG_CONFIG_PATH="$(cygpath -m "$PCDIR")"
          go run ./core/i18n/gen/catalogs
          mkdir -p out
          ( cd bowrain/plugin && go build -tags fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o ../../out/kapi-bowrain.exe ./cmd/kapi-bowrain )

      # ---- Upload binaries for the package-bowrain-cli job ----
      - name: Upload CLI binaries
        uses: actions/upload-artifact@v7
        with:
          name: cli-bins-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: out/*
          retention-days: 14

  # Package + publish the kapi-bowrain plugin built by build-bowrain-cli:
  # archives, checksums, cosign signatures, the bowrain-cli brew formula, the
  # GitHub release upload, and the manifest-plugins.json registration that backs
  # `kapi plugin install bowrain`. Mirrors release.yml's package-cli, but for the
  # plugin only: no deb/rpm, no apt/yum, no cli.json.
  package-bowrain-cli:
    name: Package kapi-bowrain
    needs: [setup, build-bowrain-cli]
    runs-on: ubuntu-latest
    outputs:
      # The release channel, for publish-bowrain-cli.
      channel: ${{ steps.channel.outputs.channel }}
      reg_channel: ${{ steps.channel.outputs.reg_channel }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # A tag run saves no cache: one saved there serves only that tag.
          # The next two steps restore what release-caches.yml saves on main.
          cache: false

      - name: Resolve the Go cache paths
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches main saved
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: go-release-${{ runner.os }}-${{ runner.arch }}-

      # Release gate: shared UI must type-check + pass unit tests.
      - uses: ./.github/actions/setup-node-ui
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build
      - name: Type-check shared UI package
        working-directory: bowrain/packages/ui
        run: vp check --no-fmt --no-lint
      - name: Run UI unit tests
        working-directory: bowrain/packages/ui
        run: vp test

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-bins-*
          path: cli-artifacts

      - name: Package archives + checksums
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#bowrain-v}"
          bash scripts/package-cli.sh "$VERSION" cli-artifacts dist \
            bowrain/plugin/cmd/kapi-bowrain/manifest.json

      # Channel is tag-driven (see release.yml for the rationale):
      #   prerelease tag (bowrain-vX.Y.Z-rcN) → beta only.
      #   final tag      (bowrain-vX.Y.Z)     → BOTH stable and beta.
      # The script strips the bowrain-v prefix before asking whether the
      # version is a prerelease; the prefix's own hyphen is not the question.
      - name: Resolve release channel
        id: channel
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: bash scripts/release-channel.sh "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate brew formula
        env:
          CHANNELS: ${{ steps.channel.outputs.channels }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#bowrain-v}"
          # which=bowrain → only the bowrain-cli formula; release-tag is the
          # bowrain-v* tag so the kapi-bowrain_* archive URLs resolve correctly.
          for ch in $CHANNELS; do
            bash scripts/gen-brew-formula.sh "$VERSION" "${{ github.repository }}" \
              dist/checksums.txt brew-formulae "$ch" bowrain "bowrain-v${VERSION}"
          done

      # publish-bowrain-cli signs and publishes these; this job holds no write
      # permission.
      - name: Upload the packaged plugin for publish-bowrain-cli
        uses: actions/upload-artifact@v7
        with:
          name: bowrain-cli-dist
          path: |
            dist/
            brew-formulae/
          if-no-files-found: error

  # Sign and publish what package-bowrain-cli built: cosign signatures, the
  # GitHub release, the brew tap and the manifest-plugins.json registration.
  # The cosign identity is this workflow file at the run's ref, as it was when
  # package-bowrain-cli signed.
  publish-bowrain-cli:
    name: Publish kapi-bowrain
    needs: [setup, package-bowrain-cli]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish plugin archives to release
      id-token: write # Sign plugin archives (cosign keyless, Fulcio)
    # Coordinated releases route this publish job through a manual-approval
    # environment so the bowrain tap/registry writes land together with kapi's.
    environment: ${{ needs.setup.outputs.coordinated == 'true' && 'coordinated-release' || '' }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      # Full history and tags for the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # registry-update is installed with `go install`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false

      - name: Download the packaged plugin
        uses: actions/download-artifact@v8
        with:
          name: bowrain-cli-dist

      - name: Install cosign (for kapi-bowrain plugin signing)
        if: needs.setup.outputs.build_only != 'true'
        uses: sigstore/cosign-installer@v3

      # Keyless cosign signature (sigstore bundle) for the kapi-bowrain plugin
      # tarballs; kapi's plugin-install verifier requires it.
      - name: Sign plugin archives (cosign)
        if: needs.setup.outputs.build_only != 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          for a in dist/kapi-bowrain_*.tar.gz dist/kapi-bowrain_*.zip; do
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "${a}.sigstore.json" "$a"
          done

      # Generate categorized release notes by type (feat / fix / perf / docs / chore /
      # Other), derived from the conventional-commit subjects of every squash
      # merge since the previous bowrain-v* tag, with the install footer
      # appended, written to scripts/release-notes/<tag>.md for the publish
      # step's body_path. The generator preserves a committed, hand-authored
      # notes file for this tag; the fetch-depth: 0 checkout above gives it full
      # history + tags. REF_NAME is the job env.
      - name: Generate release notes
        if: needs.setup.outputs.build_only != 'true'
        run: bash scripts/release-notes/generate.sh "$REF_NAME"

      - name: Publish plugin archives to release
        if: needs.setup.outputs.build_only != 'true'
        uses: softprops/action-gh-release@v3
        with:
          # kapi-bowrain is a plugin on its own tag line, so it never becomes
          # the repo's "latest" release. A stable bowrain tag would otherwise
          # take the slot from the kapi CLI, as check-v0.1.0 did.
          make_latest: false
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/kapi-bowrain_*.tar.gz
            dist/kapi-bowrain_*.zip
            dist/*.sigstore.json
            dist/checksums.txt
          # Generated above; carries the install instructions as its footer.
          body_path: scripts/release-notes/${{ needs.setup.outputs.tag }}.md

      - name: Push brew formula to homebrew-tap
        if: needs.setup.outputs.build_only != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CHANNEL: ${{ needs.package-bowrain-cli.outputs.channel }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#bowrain-v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/neokapi/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp brew-formulae/*.rb /tmp/tap/Formula/
          cd /tmp/tap
          git config user.email "release-bot@neokapi.dev"
          git config user.name "release-bot"
          git add Formula/*.rb
          if ! git diff --staged --quiet; then
            git commit -m "bowrain-cli ${VERSION} (${CHANNEL})"
            git push
          fi

      # Push the new kapi-bowrain plugin version into the manifest-plugins
      # registry so `kapi plugin install bowrain` resolves to this build.
      # Includes cosign signature URLs + cert-identity so kapi's verifier can
      # validate the install (signatures are mandatory unless --unsafe).
      - name: Update manifest plugin registry
        if: needs.setup.outputs.build_only != 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.package-bowrain-cli.outputs.channel }}
          REG_CHANNEL: ${{ needs.package-bowrain-cli.outputs.reg_channel }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#bowrain-v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_TOKEN not set; skipping registry update"
            exit 0
          fi

          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main

          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          # See release.yml's registry step: Fulcio's SAN is the OIDC
          # `job_workflow_ref` claim (this workflow file at the ref the run
          # resolved it from), which is refs/tags/<tag> on a tag push and the
          # coordinator's ref under release-coordinated.yml's workflow_call.
          # $GITHUB_REF is that ref in both modes.
          CERT_ID="https://github.com/${REPO}/.github/workflows/release-bowrain.yml@${GITHUB_REF}"
          RELEASED="$(date -u +%Y-%m-%d)"
          ISSUER="https://token.actions.githubusercontent.com"

          # The platforms scripts/lib/release-assets.json declares, each with its
          # checksum from dist/checksums.txt, or the step fails: a release never
          # registers part of what it builds.
          args="$(python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" registry-args bowrain "$VERSION" dist/checksums.txt "$REPO_URL")"
          mapfile -t CLI_ARGS <<< "$args"
          mapfile -t PLATFORMS < <(printf '%s\n' "${CLI_ARGS[@]}" | awk 'prev == "--platform" { print } { prev = $0 }')

          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry
          git -C /tmp/registry config user.email "release-bot@neokapi.dev"
          git -C /tmp/registry config user.name "release-bot"
          register() {
            # --- bowrain plugin → manifest-plugins.json ---
            # No version may drop a platform the previous one had, unless
            # release-assets.json lists it under 'removed'.
            python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" check-registry /tmp/registry/manifest-plugins.json bowrain "$VERSION" "${PLATFORMS[@]}"
            /tmp/registry-update \
              --registry /tmp/registry/manifest-plugins.json \
              --plugin bowrain \
              --version "$VERSION" \
              --channel "$REG_CHANNEL" \
              --released "$RELEASED" \
              --cert-identity "$CERT_ID" \
              --cert-oidc-issuer "$ISSUER" \
              "${CLI_ARGS[@]}"
          }
          # A release that runs beside another pushes to the same registry. A
          # rejected push rebases and runs register again; see the helper.
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/scripts/lib/registry-push.sh"
          registry_commit_and_push /tmp/registry "Register bowrain ${VERSION} (${CHANNEL})" register manifest-plugins.json


  docker:
    name: Docker (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [setup, package-bowrain-cli, publish-bowrain-cli]
    if: needs.setup.outputs.build_only != 'true'
    permissions:
      contents: read
      packages: write # docker/login-action and the image push to ghcr.io
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bowrain-server, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, cache_from: 'type=gha,scope=bowrain-server' }
          - { image: bowrain-server, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, cache_from: '' }
          - { image: bowrain-worker, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, cache_from: 'type=gha,scope=bowrain-worker' }
          - { image: bowrain-worker, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, cache_from: '' }
          - { image: bowrain-web, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, cache_from: 'type=gha,scope=bowrain-web' }
          - { image: bowrain-web, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, cache_from: '' }
          - { image: bravo-agent, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, cache_from: 'type=gha,scope=bravo-agent' }
          - { image: bravo-sandbox-node, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, cache_from: 'type=gha,scope=bravo-sandbox-node' }
          - {
              image: bravo-sandbox-python,
              arch: amd64,
              runner: ubuntu-latest,
              platform: linux/amd64,
              cache_from: "type=gha,scope=bravo-sandbox-python",
            }
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "VERSION=${REF_NAME#bowrain-v}"
            echo "COMMIT=${GH_SHA::7}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/${{ matrix.image }}/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/neokapi/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
          # Main saves each image's layers under its own name, built for amd64
          # (the _build-* workflows and e2e.yml), so an amd64 leg reads them and
          # an arm64 leg has nothing to read. A tag run saves no layer cache.
          cache-from: ${{ matrix.cache_from }}
          # An SBOM and provenance attestation travel with each image, as on a
          # rebuild (rebuild-release-images.yml).
          sbom: true
          provenance: mode=max

  docker-manifest:
    name: Docker Manifests
    runs-on: ubuntu-latest
    needs: [setup, docker]
    if: needs.setup.outputs.build_only != 'true'
    permissions:
      contents: read
      packages: write # docker/login-action and the manifest push to ghcr.io
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${REF_NAME#bowrain-v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for IMAGE in bowrain-server bowrain-worker bowrain-web; do
            docker buildx imagetools create \
              -t "ghcr.io/neokapi/$IMAGE:$VERSION" \
              "ghcr.io/neokapi/$IMAGE:$VERSION-amd64" \
              "ghcr.io/neokapi/$IMAGE:$VERSION-arm64"
          done

      - name: Tag bravo images (amd64 only)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for IMAGE in bravo-agent bravo-sandbox-node bravo-sandbox-python; do
            docker buildx imagetools create \
              -t "ghcr.io/neokapi/$IMAGE:$VERSION" \
              "ghcr.io/neokapi/$IMAGE:$VERSION-amd64"
          done

  docker-keycloak:
    name: Docker (bowrain-keycloak)
    runs-on: ubuntu-latest
    needs: [setup, package-bowrain-cli, publish-bowrain-cli]
    if: needs.setup.outputs.build_only != 'true'
    permissions:
      contents: read
      packages: write # docker/login-action and the image push to ghcr.io
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # The keycloak theme bundles @neokapi/ui, which imports
      # @neokapi/i18n-react/runtime (a built ./dist subpath export). Build
      # neokapi-i18n first so the theme's vite build resolves it.
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Keycloak theme
        run: make -C bowrain keycloak-theme

      - name: Extract version
        id: version
        run: echo "VERSION=${REF_NAME#bowrain-v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-keycloak:${{ steps.version.outputs.VERSION }}
            ghcr.io/neokapi/bowrain-keycloak:${{ github.sha }}
          cache-from: type=gha,scope=bowrain-keycloak
          sbom: true
          provenance: mode=max
          # A tag run saves no layer cache: one saved there serves only that tag.

  # Every move of `latest` in a release, in one job that holds the group the
  # weekly rebuild's publish job holds, so a release queues one job there and
  # waits at most a few minutes behind a rebuild. The jobs before it push only
  # version tags.
  move-latest:
    name: Move latest to ${{ needs.setup.outputs.version }}
    needs: [setup, docker-manifest, docker-keycloak]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: bowrain-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # retag the published images on ghcr.io
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Point latest at this release
        run: |
          set -euo pipefail
          for IMAGE in bowrain-server bowrain-worker bowrain-web bravo-agent bravo-sandbox-node bravo-sandbox-python bowrain-keycloak; do
            docker buildx imagetools create -t "ghcr.io/neokapi/$IMAGE:latest" "ghcr.io/neokapi/$IMAGE:$VERSION"
          done

  # What shipped, on the release: each image's digest, its package list
  # (CycloneDX) and its scan, per platform, uploaded as release assets. The
  # weekly rebuild keeps the same record for the images it publishes.
  record-images:
    name: Record ${{ matrix.image }} (${{ matrix.arch }})
    needs: [setup, move-latest]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the records to the release
      packages: read # read the published images
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      VERSION: ${{ needs.setup.outputs.version }}
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bowrain-server, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-server, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-worker, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-worker, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-web, arch: amd64, platform: linux/amd64 }
          - { image: bowrain-web, arch: arm64, platform: linux/arm64 }
          - { image: bowrain-keycloak, arch: amd64, platform: linux/amd64, ignorefile: .github/trivy/bowrain-keycloak.trivyignore.yaml }
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/trivy
            scripts/check-trivy-db.py
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the published image
        # master as of 2026-11-05 (#595), with the scanner version set below.
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.76.2
          image-ref: ghcr.io/neokapi/${{ matrix.image }}:${{ needs.setup.outputs.version }}
          severity: CRITICAL,HIGH
          format: json
          list-all-pkgs: true
          output: records/${{ matrix.image }}-${{ matrix.arch }}.scan.json
          exit-code: "0"
          trivyignores: ${{ matrix.ignorefile || '' }}
          cache: false

      - name: Write the published image's SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.76.2
          image-ref: ghcr.io/neokapi/${{ matrix.image }}:${{ needs.setup.outputs.version }}
          format: cyclonedx
          output: records/${{ matrix.image }}-${{ matrix.arch }}.cdx.json
          skip-setup-trivy: true
          cache: false

      - name: Check the scanner's databases are fresh
        run: python3 scripts/check-trivy-db.py "$GITHUB_WORKSPACE/.cache/trivy"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Upload the record to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The index digest, and this platform's manifest digest within it.
          docker buildx imagetools inspect "ghcr.io/neokapi/$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r --arg arch "$ARCH" '"index " + .digest, (.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | "linux/" + $arch + " " + .digest)' \
            > "records/$IMAGE-$ARCH.digest.txt"
          echo "ghcr.io/neokapi/$IMAGE:$VERSION $(cat "records/$IMAGE-$ARCH.digest.txt")"
          gh release upload "$TAG" records/"$IMAGE-$ARCH".* --clobber

  qps-bowrain-app:
    name: Bowrain app qps dictionary
    needs: [setup]
    # The qps dictionary is the same file on every platform: the pinned
    # released kapi pseudo-translates the app's catalog. It is made once
    # here, on Linux, and every build leg ships this copy. A released kapi
    # carries no Windows CLI assets on GitHub (they are signed by hand after
    # the run), so a Windows leg cannot install one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-ui

      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      - name: Generate the qps dictionary
        uses: ./.github/actions/app-pseudo-locale
        with:
          targets: bowrain-app-qps

      - uses: actions/upload-artifact@v7
        with:
          name: qps-bowrain-app
          path: |
            bowrain/apps/bowrain/frontend/public/translations/qps.json
          if-no-files-found: error
          # Long enough to re-run one failed build leg days later without the
          # dictionary job.
          retention-days: 7

  build-bowrain:
    name: Build Bowrain (${{ matrix.build.platform }})
    needs: [setup, qps-bowrain-app]
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: linux/amd64, os: ubuntu-latest, arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, arch: arm64 }
          # Windows ICU comes from MSYS2: x86_64 uses the gcc MINGW64 env, arm64
          # uses the clang CLANGARM64 env on a native windows-11-arm runner.
          - { platform: windows/amd64, os: windows-2025, arch: amd64, msystem: MINGW64, mtriple: x86_64, cc: gcc, cgo_ldflags: "-static -static-libgcc -static-libstdc++", mroot: /mingw64 }
          - { platform: windows/arm64, os: windows-11-arm, arch: arm64, msystem: CLANGARM64, mtriple: clang-aarch64, cc: clang, cgo_ldflags: "-static", mroot: /clangarm64 }
          - { platform: darwin/arm64, os: macos-latest, arch: arm64 }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # A tag run saves no cache: one saved there serves only that tag.
          # The next two steps restore what release-caches.yml saves on main.
          cache: false

      - name: Resolve the Go cache paths
        id: gopaths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches main saved
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.gopaths.outputs.build }}
            ${{ steps.gopaths.outputs.mod }}
          key: go-release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: go-release-${{ runner.os }}-${{ runner.arch }}-

      - uses: ./.github/actions/setup-node-ui

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          {
            echo "VERSION=${REF_NAME#bowrain-v}"
            echo "COMMIT=${GH_SHA::7}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LDFLAGS=-w -s -X github.com/neokapi/neokapi/core/version.Version=${REF_NAME#bowrain-v} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # macOS and Linux build ICU from source with the trimmed data set
      # (scripts/icu-data-filter.json), same as the CLI jobs; see the
      # provisioning comment in release.yml's build-cli job. Cached on the
      # filter + script hash.
      # Restores what a run on main saved; a tag run saves nothing.
      - name: Restore static ICU
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-macos13.0-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}
      # A build-only run restores the same key and saves nothing.
      - name: Restore static ICU (build-only run)
        if: ${{ (runner.os != 'Windows') && needs.setup.outputs.build_only == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/icu-static
          key: icu-static-${{ runner.os }}-${{ runner.arch }}-macos13.0-${{ hashFiles('scripts/build-icu-static.sh', 'scripts/icu-data-filter.json') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential curl pkg-config python3 unzip
          # Statically link our ICU usage (FTS5 tokenizer + UAX-29) so the
          # distributed Linux binary doesn't bind to the build host's libicu
          # major version. Built PIC + from source, same as the CLI. GTK/WebKit
          # still load the system libicu at runtime; that's their own, separate,
          # version-suffixed dependency and does not clash with our static copy.
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          echo "PKG_CONFIG_PATH=${PCDIR}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          # Match the app build's deployment target so the ICU objects do too.
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          brew install pkg-config
          # Force STATIC ICU linking. A distributed/notarized .app must not
          # depend on a Homebrew icu dylib: it is absent on users' machines, and
          # even when present its code signature has a different Team ID than the
          # notarized app, so dyld aborts at launch (SIGABRT before main). The
          # override .pc files link libicu*.a by absolute path instead, leaving
          # only the Apple-signed /usr/lib/libc++.1.dylib at runtime.
          # See scripts/gen-icu-static-pc.sh.
          [ -f "$HOME/icu-static/lib/libicuuc.a" ] || bash scripts/build-icu-static.sh "$HOME/icu-static"
          PCDIR=$(ICU_PREFIX="$HOME/icu-static" bash scripts/gen-icu-static-pc.sh)
          {
            echo "PKG_CONFIG_PATH=${PCDIR}"
            echo "CPPFLAGS=-I$HOME/icu-static/include"
          } >> "$GITHUB_ENV"

      # Windows: mingw toolchain + static ICU for the cgo build step below.
      # (Bindings generation stays CGO=0: it reflects the app's service API,
      # which doesn't depend on cgo, so only the final build needs this.)
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.build.msystem }}
          # A tag run saves no cache.
          cache: false
          path-type: inherit
          install: >-
            mingw-w64-${{ matrix.build.mtriple }}-${{ matrix.build.cc }}
            mingw-w64-${{ matrix.build.mtriple }}-icu
            mingw-w64-${{ matrix.build.mtriple }}-pkg-config

      # The version the apps build against, never @latest: see the script.
      - name: Install wails3 CLI
        shell: bash
        run: scripts/install-wails3.sh

      - name: Type-check shared UI package
        working-directory: bowrain/packages/ui
        run: vp check --no-fmt --no-lint

      # Build frontend and assets manually to avoid Wails Taskfile running
      # `npm install` which conflicts with the workspace npm ci above.
      - name: Generate Wails bindings
        working-directory: bowrain/apps/bowrain
        shell: bash
        env:
          # On macOS/Linux the icu cgo packages compile during bindings analysis
          # (toolchain + static .pc are present), so keep cgo on. On Windows the
          # mingw toolchain isn't on this shell's PATH; bindings reflect the
          # service API (cgo-independent), so build them with cgo off; the final
          # Windows build step (msys2) does the cgo + static-ICU compile.
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          go mod tidy
          wails3 generate bindings -f "-tags production,fts5 -trimpath -buildvcs=false -ldflags=\"${BUILD_LDFLAGS}\"" -clean=true
          # shellcheck disable=SC2016
          sed -i.bak 's/= $0\./= store$0./g' frontend/bindings/github.com/neokapi/neokapi/bowrain/apps/bowrain/backend/app.js
          rm -f frontend/bindings/github.com/neokapi/neokapi/bowrain/apps/bowrain/backend/app.js.bak

      # The bowrain frontend bundles @neokapi/flow-editor, which imports
      # @neokapi/i18n-react/runtime, a built ./dist subpath export (not
      # committed). Build neokapi-i18n first so the import resolves (mirrors the
      # kapi-desktop job).
      - name: Build @neokapi/i18n-react
        working-directory: packages/i18n-react
        run: vp run build

      # public/translations/qps.json is build output that the vite config
      # skips under CI; the qps-bowrain-app job made it.
      - name: Fetch the qps dictionary
        uses: actions/download-artifact@v8
        with:
          name: qps-bowrain-app
          path: bowrain/apps/bowrain/frontend/public/translations

      - name: Build Bowrain frontend
        working-directory: bowrain/apps/bowrain/frontend
        env:
          # Public client-side key (same project as _build-web.yml). Keys this
          # release build's opt-out desktop analytics (D1: default ON, first-run
          # notice + settings toggle, DNT honored); dev/self-builds are keyless
          # and silent.
          VITE_POSTHOG_KEY: phc_9TMOqaMSUH5wE6xPTeTKjYBBJWVRdzOlUMahZAr7twD
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
        run: vp run build

      # The bundle that ships. A chunk that fails to load turns every backend
      # call into null and the app renders empty, with no error to see.
      - name: Check the Bowrain Desktop bundle loads its bindings
        shell: bash
        run: make check-bowrain-desktop-bundle

      - name: Generate icons
        working-directory: bowrain/apps/bowrain/build
        run: wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

      - name: Generate Windows resources
        if: runner.os == 'Windows'
        working-directory: bowrain/apps/bowrain
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
          ARCH: ${{ matrix.build.arch }}
        run: |
          # Render a version-stamped info.json so the .exe version resource
          # (shown in the app's About dialog / file Properties) matches the
          # built binary and carries a current copyright year.
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          NUM="$(printf '%s' "$VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -n "$NUM" ] || NUM="0.0.0"
          jq --arg pv "$VERSION" --arg fv "${NUM}.0" --arg cr "© 2025-$(date +%Y) neokapi" \
            '.fixed.file_version=$fv | .info["0000"].ProductVersion=$pv | .info["0000"].LegalCopyright=$cr' \
            build/windows/info.json > build/windows/info.gen.json
          wails3 generate syso -arch "$ARCH" -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.gen.json -out "wails_windows_${ARCH}.syso"
          rm -f build/windows/info.gen.json

      # The desktop app links core/i18n and host/i18n, same build-time
      # catalog compile as every other binary here.
      - name: Compile the embedded i18n catalogs
        if: runner.os != 'Windows'
        run: go run ./core/i18n/gen/catalogs

      - name: Build Bowrain (Linux)
        if: runner.os == 'Linux'
        working-directory: bowrain/apps/bowrain
        env:
          GOOS: linux
          CGO_ENABLED: "1"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o bin/Bowrain

      # cgo build under MSYS2 mingw with statically-linked ICU, so the Windows
      # desktop app uses the same native SQLite + ICU framework as macOS/Linux
      # (no unicode61/modernc divergence). Runs in the msys2 shell so gcc +
      # pkg-config + the static .pc all share one unix-path environment; the
      # static C++/gcc runtimes mean Bowrain.exe needs no mingw DLLs alongside.
      - name: Build Bowrain (Windows)
        if: runner.os == 'Windows'
        working-directory: bowrain/apps/bowrain
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.build.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.build.cc }}
          CGO_LDFLAGS: ${{ matrix.build.cgo_ldflags }}
          MROOT: ${{ matrix.build.mroot }}
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -euo pipefail
          # Native cc/ld can't open MSYS virtual paths ($MROOT/...); feed
          # Windows-form paths (cygpath -m) and convert the .pc dir for the
          # native pkg-config too.
          PCDIR=$(ICU_LIBDIR="$(cygpath -m "$MROOT/lib")" ICU_INCLUDEDIR="$(cygpath -m "$MROOT/include")" bash "${GITHUB_WORKSPACE}/scripts/gen-icu-static-pc.sh")
          export PKG_CONFIG_PATH="$(cygpath -m "$PCDIR")"
          ( cd "${GITHUB_WORKSPACE}" && go run ./core/i18n/gen/catalogs )
          go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS} -H windowsgui" -o bin/Bowrain.exe
          rm -f ./*.syso

      - name: Build Bowrain (macOS arm64)
        if: runner.os == 'macOS'
        working-directory: bowrain/apps/bowrain
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=13.0"
          CGO_LDFLAGS: "-mmacosx-version-min=13.0"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          BUILD_LDFLAGS: ${{ steps.meta.outputs.LDFLAGS }}
        run: |
          set -o pipefail
          GOOS=darwin GOARCH=arm64 go build -tags production,fts5 -trimpath -buildvcs=false -ldflags="${BUILD_LDFLAGS}" -o bin/Bowrain 2>&1 | tee build.log
          # Every object records the macOS minimum the app declares.
          ../../../scripts/check-macho-minimum.sh --log build.log bin/Bowrain "$HOME"/icu-static/lib/libicu*.a

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        working-directory: bowrain/apps/bowrain
        run: |
          mkdir -p bin/Bowrain.app/Contents/MacOS
          mkdir -p bin/Bowrain.app/Contents/Resources
          cp build/darwin/icons.icns bin/Bowrain.app/Contents/Resources
          cp bin/Bowrain bin/Bowrain.app/Contents/MacOS
          cp build/darwin/Info.plist bin/Bowrain.app/Contents
          # Stamp the bundle with the real release version + current copyright
          # year so the native macOS About dialog matches the built binary
          # instead of the static placeholder in build/darwin/Info.plist.
          VERSION="${{ steps.meta.outputs.VERSION }}"
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          PLIST=bin/Bowrain.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright © 2025-$(date +%Y) neokapi" "$PLIST"

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${REF_NAME#bowrain-v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: signing
        if: ${{ (runner.os == 'macOS') && needs.setup.outputs.build_only != 'true' }}
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID_P12_BASE64" ]; then
            echo "No Developer ID certificate configured; will use ad-hoc signing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Add to the search list AND make default so notarytool resolves the
          # stored credential profile without an explicit --keychain.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials (App Store Connect API key)
        if: ${{ (runner.os == 'macOS' && steps.signing.outputs.enabled == 'true') && needs.setup.outputs.build_only != 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials "neokapi-notary" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Sign + notarize app bundle (Wails)
        if: ${{ (runner.os == 'macOS') && needs.setup.outputs.build_only != 'true' }}
        working-directory: bowrain/apps/bowrain
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            echo "Signing + notarizing with Developer ID via 'wails3 tool sign'"
            # Hardened runtime is on by default; --notarize submits to the notary
            # service and staples the ticket to the .app.
            wails3 tool sign \
              --input bin/Bowrain.app \
              --identity "$APPLE_SIGN_IDENTITY" \
              --entitlements build/darwin/entitlements.plist \
              --notarize \
              --keychain-profile neokapi-notary
          else
            echo "No Developer ID; using ad-hoc signing (not distributable)"
            codesign --force --deep --sign - bin/Bowrain.app
          fi

      - name: Create DMG
        if: runner.os == 'macOS'
        working-directory: bowrain/apps/bowrain
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dmg
          cp -R bin/Bowrain.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil's own size estimate for -srcfolder can fall short of the
          # content ("No space left on device" inside the mounted volume), so
          # the image is sized from the folder with headroom.
          size_mb=$(( $(du -sm dmg | cut -f1) * 12 / 10 + 50 ))
          # hdiutil flakes with "Resource busy" on macos-latest; retry up to 3x.
          for i in 1 2 3; do
            hdiutil create \
              -size "${size_mb}m" \
              -volname "Bowrain v${VERSION}" \
              -srcfolder dmg \
              -ov \
              -format UDZO \
              "../../../bowrain-${VERSION}-macOS-arm64.dmg" && break
            echo "hdiutil attempt $i failed, retrying after 5s..."
            sleep 5
          done

      - name: Sign + notarize DMG
        if: ${{ (runner.os == 'macOS' && steps.signing.outputs.enabled == 'true') && needs.setup.outputs.build_only != 'true' }}
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          DMG="bowrain-${VERSION}-macOS-arm64.dmg"
          codesign --force --sign "$APPLE_SIGN_IDENTITY" "$DMG"
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" --keychain-profile neokapi-notary --wait
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG"

      # The in-app update feed ships the notarized .app as a zip;
      # publish-bowrain-desktop signs it into the feed. Only a Developer ID
      # build has one.
      - name: Zip the notarized app for the update feed
        if: ${{ (runner.os == 'macOS' && steps.signing.outputs.enabled == 'true') && needs.setup.outputs.build_only != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ditto -c -k --sequesterRsrc --keepParent bowrain/apps/bowrain/bin/Bowrain.app "Bowrain-${VERSION}-macOS-arm64.app.zip"

      # macOS: Clean up keychain
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        env:
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

      # Windows: Create ZIP
      - name: Create ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "bowrain/apps/bowrain/bin/Bowrain.exe" -DestinationPath "bowrain-${{ steps.version.outputs.VERSION }}-windows-${{ matrix.build.arch }}.zip"

      # 90 days: publish-windows-signed.sh downloads this artifact during a
      # manual signing session that can happen weeks after the tag, and at 14
      # days it was routinely gone by then. 90 is the repository maximum.
      - name: Upload Windows ZIP as artifact (Authenticode-signed locally before release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bowrain-windows-${{ matrix.build.arch }}
          path: "bowrain-${{ steps.version.outputs.VERSION }}-windows-${{ matrix.build.arch }}.zip"
          retention-days: 90

      # Linux: Create tarball
      - name: Create tarball
        if: runner.os == 'Linux'
        run: |
          tar -czf "bowrain-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.build.arch }}.tar.gz" \
            -C bowrain/apps/bowrain/bin Bowrain

      # publish-bowrain-desktop uploads these; this job holds no write permission.
      - name: Upload the desktop release files for publish-bowrain-desktop
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bowrain-desktop-release-${{ runner.os }}-${{ matrix.build.arch }}
          path: |
            bowrain-*-macOS-arm64.dmg
            Bowrain-*-macOS-arm64.app.zip
            bowrain-*-linux-*.tar.gz
          if-no-files-found: error

  # Upload the desktop builds to the release and publish their in-app update
  # feeds. build-bowrain builds, signs and notarizes them without any write
  # permission.
  publish-bowrain-desktop:
    name: Publish Bowrain Desktop
    needs: [setup, build-bowrain]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload the desktop builds to the release; publish-appcast.sh runs gh release upload
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # publish-appcast.sh runs `go run ./scripts/mkappcast`.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false

      - name: Download the desktop release files
        uses: actions/download-artifact@v8
        with:
          pattern: bowrain-desktop-release-*
          merge-multiple: true

      - name: Upload DMG and tarballs to release
        uses: softprops/action-gh-release@v3
        with:
          # Bowrain is on its own tag line and never takes the repo's latest.
          make_latest: false
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            bowrain-*-macOS-arm64.dmg
            bowrain-*-linux-*.tar.gz

      # Published only for a Developer ID build, which is the only one that
      # leaves the zip. Non-blocking: the release is complete and the feed is
      # recoverable.
      - name: Publish updater appcast (macOS)
        id: appcast
        timeout-minutes: 25
        continue-on-error: true
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          zip="Bowrain-${VERSION}-macOS-arm64.app.zip"
          if [ ! -f "$zip" ]; then
            echo "no Developer ID build, so no macOS update feed"
            exit 0
          fi
          if [ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "updater appcast secrets not set; skipping"
            exit 0
          fi
          bash scripts/publish-appcast.sh Bowrain bowrain "$VERSION" "$REF_NAME" "$REPO" "$zip" darwin arm64

      - name: Report a skipped macOS update feed
        if: always() && steps.appcast.outcome == 'failure'
        run: |
          echo "::error::The macOS in-app-update feed did not publish for ${REF_NAME}. The release itself is complete; re-run this job, or re-publish the feed by hand, before Bowrain users on macOS can update in place."
          {
            echo "### macOS update feed not published"
            echo
            echo "\`appcast-bowrain-darwin-arm64*.xml\` was not refreshed for \`${REF_NAME}\`."
            echo "Existing installs will not be offered this version until it is."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish updater appcast (Linux)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "updater appcast secrets not set; skipping"
            exit 0
          fi
          for arch in amd64 arm64; do
            bash scripts/publish-appcast.sh Bowrain bowrain "$VERSION" "$REF_NAME" "$REPO" \
              "bowrain-${VERSION}-linux-${arch}.tar.gz" linux "$arch"
          done


  update-casks:
    name: Update Bowrain Homebrew Cask
    # Runs for stable AND prerelease tags. A stable tag (bowrain-vX.Y.Z)
    # refreshes the bowrain cask; a prerelease tag (bowrain-vX.Y.Z-rcN) refreshes
    # the bowrain@beta cask (which depends on the bowrain-cli-beta formula).
    runs-on: ubuntu-latest
    needs: [setup, publish-bowrain-desktop]
    if: needs.setup.outputs.build_only != 'true'
    permissions:
      contents: read # Download DMG (gh release download); the tap is written with HOMEBREW_TAP_TOKEN
    environment: ${{ needs.setup.outputs.coordinated == 'true' && 'coordinated-release' || '' }}
    env:
      REF_NAME: ${{ needs.setup.outputs.tag }}
    steps:
      # Checked out for one file: the cask channel is the same decision the
      # release job makes, so it is read from the same script rather than
      # restated here.
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${REF_NAME#bowrain-v}" >> "$GITHUB_OUTPUT"

      # Final tag → both bowrain and bowrain@beta casks; prerelease tag → the
      # @beta cask only. `channel` and `reg_channel` come along unread.
      - name: Resolve cask channel
        id: ch
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: bash scripts/release-channel.sh "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.setup.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "bowrain-*-macOS-arm64.dmg"

      - name: Compute checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "BOWRAIN_DMG=$(sha256sum "bowrain-${VERSION}-macOS-arm64.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: neokapi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update bowrain cask
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA_BOWRAIN: ${{ steps.checksum.outputs.BOWRAIN_DMG }}
          CHANNELS: ${{ steps.ch.outputs.channels }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          # The oldest macOS the app runs on, as the Homebrew symbol for
          # `depends_on macos:` (scripts/lib/macos-minimum).
          MACOS_CODENAME="$(scripts/macos-minimum.sh --codename "$(scripts/macos-minimum.sh)")"
          for ch in $CHANNELS; do
          if [ "$ch" = beta ]; then
            CASK_NAME="bowrain@beta"; DEP="bowrain-cli-beta"
            CONFLICTS=$'  conflicts_with cask: "bowrain"\n'
          else
            CASK_NAME="bowrain"; DEP="bowrain-cli"; CONFLICTS=""
          fi
          # Stanza order and grouping follow `brew style`; the conflicts line
          # carries its own newline so the stable cask has no empty line in its
          # place. The app is notarized and stapled, so the cask has no
          # postflight block, and zap names only the app's own data: on a
          # case-insensitive volume "Application Support/Bowrain" is the bowrain
          # plugin's sign-in and config. scripts/check-cask-heredocs.sh holds
          # all three.
          cat > "homebrew-tap/Casks/${CASK_NAME}.rb" << CASK
          cask "${CASK_NAME}" do
            version "${VERSION}"
            sha256 "${SHA_BOWRAIN}"

            url "https://github.com/neokapi/neokapi/releases/download/bowrain-v#{version}/bowrain-#{version}-macOS-arm64.dmg"
            name "Bowrain"
            desc "Desktop client for a team's shared context graph, with offline editing"
            homepage "https://github.com/neokapi/neokapi"

          ${CONFLICTS}  depends_on formula: "neokapi/tap/${DEP}"
            depends_on macos: :${MACOS_CODENAME}

            app "Bowrain.app"

            zap trash: [
              "~/Library/Application Support/bowrain-desktop",
              "~/Library/Caches/io.github.neokapi.bowrain",
              "~/Library/Preferences/io.github.neokapi.bowrain.plist",
              "~/Library/WebKit/io.github.neokapi.bowrain",
            ]

            caveats <<~EOS
              kapi and the bowrain plugin come from the ${DEP} formula
              (installed automatically). Run "kapi ui" to launch the desktop app.
            EOS
          end
          CASK
          done

      - name: Commit and push cask
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Casks/
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bowrain cask to ${VERSION}" && git push
          fi

  # As in release.yml: Bowrain's Windows binaries leave this run as workflow
  # artifacts and are signed by hand afterwards, so the pending step is recorded
  # here rather than being visible only as an absent asset.
  windows-signing:
    name: Windows signing (manual, after this run)
    needs: [setup, build-bowrain]
    if: needs.setup.outputs.build_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record the outstanding Windows signing step
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          # Tracks retention-days on the Windows upload-artifact step above.
          deadline="$(date -u -d '+90 days' +%Y-%m-%d)"
          echo "::notice title=Windows assets still to sign::Run 'make release-bowrain-windows v=${VERSION}' on the signing Mac. This run's Windows artifacts expire ${deadline}."
          {
            echo "## Windows assets are not on ${TAG} yet"
            echo
            echo "CI builds Bowrain Desktop for Windows and keeps it as a workflow artifact."
            echo "Publishing it needs the Certum certificate, which lives on one Mac. There,"
            echo "with SimplySign Desktop logged in:"
            echo
            echo "    make release-bowrain-windows v=${VERSION}"
            echo
            echo "That signs the zip, builds and signs the installer, uploads both to ${TAG},"
            echo "and dispatches the Windows in-app-update feed. WinGet is kapi-only."
            echo
            echo "This run's Windows artifacts expire on ${deadline}. After that the tag can be"
            echo "signed only by re-running this run's Windows jobs first."
          } >> "$GITHUB_STEP_SUMMARY"

  # The release fails when it lacks an asset scripts/lib/release-assets.json
  # promises for any platform, or when the Windows build artifacts the
  # out-of-band signing step downloads are missing. Without this a release
  # finished green with no Windows CLI for thirteen candidates.
  verify-release-assets:
    name: Verify the release carries every promised asset
    needs: [setup, build-bowrain-cli, package-bowrain-cli, publish-bowrain-cli, build-bowrain, publish-bowrain-desktop, update-casks]
    if: ${{ (always() && needs.setup.result == 'success') && needs.setup.outputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Compare the release with scripts/lib/release-assets.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/release-assets.py check-release bowrain "$TAG" || status=1
          python3 scripts/release-assets.py check-artifacts bowrain "$RUN_ID" || status=1
          exit "$status"
