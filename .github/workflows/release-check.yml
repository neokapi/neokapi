name: Release check plugin

# The kapi-check ML checker plugin releases independently of the neokapi CLI, on
# its own `check-v*` tag (e.g. `check-v0.1.0` -> kapi-check version 0.1.0). This
# mirrors the kapi-sat release: the plugin changes far less often than kapi and
# carries the heaviest/riskiest build legs (a 4-platform cgo matrix incl. a
# Windows Rust build), so coupling it to every kapi release would rebuild and
# republish it needlessly and block on its flakiest leg.
on:
  push:
    tags:
      - "check-v*"
  # A build-only run on any branch: every build leg runs, and nothing is
  # signed, published or registered.
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build only; sign, publish and register nothing (must stay true)."
        type: boolean
        default: true

# Read only. The publishing job asks for what it writes and is skipped on a
# build-only run, so a dispatched run holds no write permission whatever its
# branch does (scripts/check-release-build-only.py).
permissions:
  contents: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  # A tag push releases; a dispatch builds only. A dispatch always builds
  # only, whatever its input says.
  setup:
    name: Resolve release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      build_only: ${{ steps.r.outputs.build_only }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            # A filename-safe placeholder: a branch name can hold "/".
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "build_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF_NAME#check-v}" >> "$GITHUB_OUTPUT"
            echo "build_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ── kapi-check ML checker plugin ────────────────────────────────────────────
  # Build + sign + publish the kapi-check plugin tarball per platform. kapi-check
  # is a cgo binary (-tags onnx): it links daulet/tokenizers (static .a) at build
  # time and loads the onnxruntime SHARED library at runtime. The tarball bundles
  # the onnxruntime shared lib at lib/<unversioned-name> beside the binary, where
  # plugins/check/internal/embed/ort_onnx.go:resolveORTLib() finds it with no env.
  # The sentence-embedding MODEL is NOT bundled. It downloads on the explicit
  # `kapi-check pull` step at first use (matching kapi-sat; keeps tarballs small).
  build-check-plugin:
    name: Build kapi-check plugin (${{ matrix.build.platform }})
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        build:
          # Intel macOS (darwin/amd64) is intentionally omitted: like the cgo
          # Wails desktop apps, this plugin is cgo and can't cross-compile, so it
          # would need a scarce native macos-13 runner. arm64 is the supported
          # Mac target.
          - { platform: darwin/arm64, os: macos-latest, goos: darwin, goarch: arm64 }
          - { platform: linux/amd64, os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { platform: windows/amd64, os: windows-2025, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.build.os }}
    env:
      # Version pins, kept in lockstep with plugins/check/go.mod:
      #   * onnxruntime 1.31.1: yalue/onnxruntime_go v1.38.0 vendors the 1.31 C
      #     API headers (ORT_API_VERSION 31). An older runtime cannot serve API
      #     31, so the runtime and the binding move together.
      #   * daulet/tokenizers: the version and its checksums are pinned in
      #     scripts/fetch-tokenizers.sh. linux uses the prebuilt
      #     libtokenizers.a; macOS and Windows build the pinned commit's Rust
      #     source (see those legs).
      ONNXRUNTIME_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The darwin leg builds every Mach-O it ships for the plugin's macOS
      # minimum (scripts/macos-minimum.sh): the Go link, the cgo objects and
      # the third-party code built here. The check after packaging fails the
      # release when a binary records a newer one.
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          min="$(scripts/macos-minimum.sh check)"
          {
            echo "MACOS_MINIMUM=$min"
            echo "MACOSX_DEPLOYMENT_TARGET=$min"
            echo "CGO_CFLAGS=-O2 -g -mmacosx-version-min=$min"
            echo "CGO_CXXFLAGS=-O2 -g -mmacosx-version-min=$min"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # A tag run saves no cache: one saved there serves only that tag,
          # and setup-go has no restore-only mode.
          cache: false

      # ── onnxruntime shared library (runtime dep; bundled into the tarball) ────
      - name: Download onnxruntime
        shell: bash
        env:
          GOOS: ${{ matrix.build.goos }}
          GOARCH: ${{ matrix.build.goarch }}
        run: |
          set -euo pipefail
          scripts/fetch-onnxruntime.sh "$GOOS" "$GOARCH" "$RUNNER_TEMP/ort"
          echo "ORT_DIR=$RUNNER_TEMP/ort" >> "$GITHUB_ENV"

      # ── daulet/tokenizers static library (build-time dep) ─────────────────────
      - name: Download libtokenizers (Linux prebuilt)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.build.goos }}
          GOARCH: ${{ matrix.build.goarch }}
        run: |
          set -euo pipefail
          bash scripts/fetch-tokenizers.sh lib "$GOOS" "$GOARCH" "$RUNNER_TEMP/tok"
          echo "TOKENIZERS_LIB=$RUNNER_TEMP/tok" >> "$GITHUB_ENV"

      # macOS: the prebuilt archive carries C objects (esaxx, oniguruma) built
      # for macOS 15.5, newer than this plugin's minimum, so the crate is built
      # here from the pinned source for the deployment target set above.
      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        # master as of 2026-11-15 (#190). Pinned by commit: the action's
        # version-named branches are pre-created for future toolchains, and a
        # versioned ref let Dependabot propose one that does not exist. The
        # toolchain is the input; scripts/check-tool-versions.py reports a newer one.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"

      - name: Build libtokenizers from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-tokenizers.sh source "$RUNNER_TEMP/tokenizers-src"
          cd "$RUNNER_TEMP/tokenizers-src"
          cargo build --release -p tokenizers-ffi
          mkdir -p "$RUNNER_TEMP/tok"
          # The staticlib is libtokenizers_ffi.a; the cgo directive looks for
          # -ltokenizers => libtokenizers.a.
          cp target/release/libtokenizers_ffi.a "$RUNNER_TEMP/tok/libtokenizers.a"
          echo "TOKENIZERS_LIB=$RUNNER_TEMP/tok" >> "$GITHUB_ENV"

      # Windows: no prebuilt lib is published by daulet/tokenizers, so build the
      # tokenizers-ffi crate from Rust source with the windows-GNU (MinGW) target
      # (the plugin's cgo LDFLAGS are GNU-ld style), and rename the crate output
      # (libtokenizers_ffi.a) to libtokenizers.a.

      - name: Install Rust (Windows, GNU target)
        if: runner.os == 'Windows'
        # master as of 2026-11-15 (#190). Pinned by commit: the action's
        # version-named branches are pre-created for future toolchains, and a
        # versioned ref let Dependabot propose one that does not exist. The
        # toolchain is the input; scripts/check-tool-versions.py reports a newer one.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-gnu

      - name: Build libtokenizers from source (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-tokenizers.sh source "$RUNNER_TEMP/tokenizers-src"
          cd "$RUNNER_TEMP/tokenizers-src"
          cargo build --release -p tokenizers-ffi --target x86_64-pc-windows-gnu
          mkdir -p "$RUNNER_TEMP/tok"
          cp "target/x86_64-pc-windows-gnu/release/libtokenizers_ffi.a" "$RUNNER_TEMP/tok/libtokenizers.a"
          echo "TOKENIZERS_LIB=$RUNNER_TEMP/tok" >> "$GITHUB_ENV"

      # ── build (only) into a staging dir so macOS can sign before tar ──────────
      - name: Build kapi-check (macOS, pre-sign)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/neokapi/neokapi/core/version.Version=${VERSION} -X github.com/neokapi/neokapi/core/version.Commit=${GH_SHA::7} -X github.com/neokapi/neokapi/core/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$RUNNER_TEMP/prebuilt"
          (cd plugins/check && GOWORK=off CGO_ENABLED=1 \
            CGO_LDFLAGS="-L${TOKENIZERS_LIB}" \
            go build -tags onnx -trimpath -ldflags "${LDFLAGS}" \
            -o "$RUNNER_TEMP/prebuilt/kapi-check" ./cmd/kapi-check)
          echo "CHECK_PREBUILT_BIN=$RUNNER_TEMP/prebuilt/kapi-check" >> "$GITHUB_ENV"

      # macOS Developer-ID signing + notarization of the staged Mach-O set
      # (plugin binary + bundled onnxruntime dylib), via the shared composite
      # action. reloc-id pins the dylib install id BEFORE signing so the package
      # script's guarded install_name_tool no-op preserves the signature.
      - name: Sign + notarize macOS Mach-O
        if: ${{ (runner.os == 'macOS') && needs.setup.outputs.build_only != 'true' }}
        uses: ./.github/actions/macos-sign
        with:
          label: kapi-check
          binaries: ${{ env.CHECK_PREBUILT_BIN }}
          dylib-globs: ${{ env.ORT_DIR }}/lib/libonnxruntime*.dylib
          reloc-id: '@loader_path/libonnxruntime.dylib'
          notarize: ${{ startsWith(github.ref, 'refs/tags/check-v') }}
          developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          sign-identity: ${{ secrets.APPLE_SIGN_IDENTITY }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}

      # ── package the tarball ───────────────────────────────────────────────────
      - name: Package kapi-check tarball
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          scripts/package-check-plugin.sh \
            --version "${VERSION}" \
            --ort-dir "${ORT_DIR}" \
            --tokenizers-lib "${TOKENIZERS_LIB}" \
            --out-dir "$RUNNER_TEMP/check-out"

      - name: Check the macOS minimum the tarball's binaries record
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/macho-check"
          mkdir -p "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          scripts/check-macho-minimum.sh --minimum "$MACOS_MINIMUM" "$dir"

      # Upload the tarball as a workflow ARTIFACT (not directly to the release):
      # the matrix legs run concurrently, and several gh-release calls racing to
      # update the same release can silently drop an asset. A single publish job
      # (below) signs and uploads them all in one writer.
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: check-tarball-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: ${{ runner.temp }}/check-out/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Write checksum artifact
        shell: bash
        env:
          CHECK_SHA256: ${{ steps.package.outputs.sha256 }}
          CHECK_TARBALL_NAME: ${{ steps.package.outputs.tarball_name }}
          LEG_GOOS: ${{ matrix.build.goos }}
          LEG_GOARCH: ${{ matrix.build.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check-checksums"
          echo "${CHECK_SHA256}  ${CHECK_TARBALL_NAME}" \
            > "$RUNNER_TEMP/check-checksums/${LEG_GOOS}_${LEG_GOARCH}.sha256"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: check-checksum-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: ${{ runner.temp }}/check-checksums/*.sha256
          retention-days: 14

  # Every platform scripts/lib/release-assets.json registers for check was
  # built, or nothing is published. Runs on dry-run dispatches too, so a
  # matrix change that drops a leg fails before any tag is cut.
  verify-check-platforms:
    name: Verify every registered platform was built
    needs: build-check-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib/release-assets.json
            scripts/release-assets.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: check-checksum-*
          path: check-checksums
          merge-multiple: true
      - name: Compare the built archives with scripts/lib/release-assets.json
        run: python3 scripts/release-assets.py check-checksums check check-checksums

  # Single-writer publish: download every leg's tarball, sign each, and upload
  # them to the GitHub release in ONE softprops call, avoiding the
  # concurrent-release-write race that can drop an asset. Skipped on a
  # build-only run, so the write and the signing token exist only here.
  publish-check-release:
    name: Publish kapi-check release
    if: needs.setup.outputs.build_only != 'true'
    needs: [setup, build-check-plugin, verify-check-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload the release assets
      id-token: write # Sign the tarballs (cosign keyless, Fulcio)
    steps:
      - name: Download all tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: check-tarball-*
          path: check-release
          merge-multiple: true

      - name: Install cosign (tarball signing)
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign tarballs (keyless)
        run: |
          set -euo pipefail
          for tarball in check-release/*.tar.gz; do
            cosign sign-blob --yes --bundle "${tarball}.sigstore.json" "${tarball}"
          done

      - name: Upload all assets to the release
        uses: softprops/action-gh-release@v3
        with:
          # This plugin has its own tag line; it must NOT become the repo's
          # "latest" release, or https://github.com/neokapi/neokapi/releases/latest,
          # where `kapi update` sends users to download kapi, opens this plugin.
          make_latest: false
          files: |
            check-release/*.tar.gz
            check-release/*.tar.gz.sigstore.json

  # Register the new kapi-check plugin version into neokapi/registry so
  # `kapi plugins install check` resolves to this build.
  #
  # PREREQUISITE: neokapi/registry's manifest-plugins.json must already contain a
  # "check" stub plugin entry (registry-update refuses to create new top-level
  # plugins; it errors "plugin not declared"). Add the stub once, mirroring the
  # existing "sat"/"bowrain"/"okapi-bridge" entries.
  register-check-plugin:
    name: Register kapi-check in plugin registry
    if: needs.setup.outputs.build_only != 'true'
    needs: [setup, publish-check-release]
    runs-on: ubuntu-latest
    steps:
      # The one file this job reads from the repository.
      - name: Check out the registry push helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib/registry-push.sh
            scripts/lib/release-assets.json
            scripts/release-assets.py
          sparse-checkout-cone-mode: false

      - name: Download check checksum artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: check-checksum-*
          path: check-checksums
          merge-multiple: true

      - name: Update manifest plugin registry (check)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#check-v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_TOKEN not set; skipping registry update"
            exit 0
          fi

          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main

          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          CERT_ID="https://github.com/${REPO}/.github/workflows/release-check.yml@refs/tags/${REF_NAME}"
          # The platforms scripts/lib/release-assets.json declares for this
          # plugin, each with its checksum, or the step fails: a release never
          # registers part of what it builds.
          args="$(python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" registry-args check "$VERSION" check-checksums "$REPO_URL")"
          mapfile -t ARGS <<< "$args"
          mapfile -t PLATFORMS < <(printf '%s\n' "${ARGS[@]}" | awk 'prev == "--platform" { print } { prev = $0 }')

          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry
          git -C /tmp/registry config user.email "release-bot@neokapi.dev"
          git -C /tmp/registry config user.name "release-bot"
          register() {
            # No version may drop a platform the previous one had, unless
            # release-assets.json lists it under 'removed'.
            python3 "${GITHUB_WORKSPACE}/scripts/release-assets.py" check-registry /tmp/registry/manifest-plugins.json check "$VERSION" "${PLATFORMS[@]}"
            /tmp/registry-update \
              --registry /tmp/registry/manifest-plugins.json \
              --plugin check \
              --version "$VERSION" \
              --channel stable \
              --released "$(date -u +%Y-%m-%d)" \
              --cert-identity "$CERT_ID" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "${ARGS[@]}"
          }
          # A release that runs beside another pushes to the same registry. A
          # rejected push rebases and runs register again; see the helper.
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/scripts/lib/registry-push.sh"
          registry_commit_and_push /tmp/registry "Register check ${VERSION}" register manifest-plugins.json
