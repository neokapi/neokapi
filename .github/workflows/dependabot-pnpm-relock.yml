name: Dependabot pnpm Relock

# Dependabot resolves pnpm-lock.yaml from scratch with its own bundled pnpm,
# not the version pinned in package.json#packageManager. Its lockfile drops the
# `tarball:` fields the base lockfile carries and can move packages the update
# never named. scripts/dependabot-relock.py starts from the base branch's
# lockfile, has the pinned pnpm apply the package.json changes and update by
# name the packages Dependabot raised, and checks the result against both
# lockfiles before anything is pushed; its docstring has the rules. The result is also what scripts/check-lockfile-idempotent.sh
# expects. It is the npm counterpart of dependabot-go-tidy.yml.

on: pull_request

permissions:
  contents: write

jobs:
  relock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_BOT_APP: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      # A push or pull request made with the bot App's token starts the
      # pull request's workflows; one made with GITHUB_TOKEN starts none, or
      # waits for a person to approve them. Without the App, GITHUB_TOKEN.
      # See docs/internals/bot-pushes.md.
      - name: Mint the bot App token
        id: bot
        if: env.HAS_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || github.token }}

      # Mirrors .github/actions/setup-node-ui without the install and the
      # i18n-react build: relocking needs the toolchain, not the workspace.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version: "26"
          cache: true
          # Only a run on main saves the dependency cache; any other ref restores it.
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-path: pnpm-lock.yaml
          run-install: false

      - name: Re-resolve with the pinned pnpm, keeping only the update
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/dependabot-relock.py --base-ref "${BASE_REF}"

      - name: Push if the lockfile changed
        run: |
          if git diff --quiet HEAD -- pnpm-lock.yaml; then
            echo "Lockfile already matches the pinned pnpm's resolution of the update"
            exit 0
          fi
          echo "Replacing Dependabot's lockfile with the pinned pnpm's resolution of the update."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: re-resolve pnpm-lock.yaml with the pinned pnpm"
          git push
