name: Dependabot pnpm Relock

# Dependabot resolves pnpm-lock.yaml with its own bundled pnpm, not the version
# pinned in package.json#packageManager, and scripts/check-lockfile-idempotent.sh
# rejects that lockfile in CI. This workflow re-resolves it with the pinned pnpm
# on the PR branch and pushes the result, which is what that guard expects. It
# is the npm counterpart of dependabot-go-tidy.yml.
#
# The invariant is lockfile stability, not content: the pinned pnpm keeps
# whatever `tarball:` form it is given, so no workflow can restore a field
# Dependabot strips.

on: pull_request

permissions:
  contents: write

jobs:
  relock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_BOT_APP: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      # A push or pull request made with the bot App's token starts the
      # pull request's workflows; one made with GITHUB_TOKEN starts none, or
      # waits for a person to approve them. Without the App, GITHUB_TOKEN.
      # See docs/internals/bot-pushes.md.
      - name: Mint the bot App token
        id: bot
        if: env.HAS_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || github.token }}

      # Mirrors .github/actions/setup-node-ui without the install and the
      # i18n-react build: relocking needs the toolchain, not the workspace.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          node-version: "26"
          cache: true
          # Only a run on main saves the dependency cache; any other ref restores it.
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-path: pnpm-lock.yaml
          run-install: false

      - name: Re-resolve with the pinned pnpm
        run: vp install --lockfile-only

      - name: Push if the lockfile changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the pinned pnpm's resolution"
            exit 0
          fi
          echo "Lockfile was written by a different resolver — relocking."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: re-resolve pnpm-lock.yaml with the pinned pnpm"
          git push
