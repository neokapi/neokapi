name: Dependabot pnpm Relock

# Dependabot resolves pnpm-lock.yaml with its own bundled pnpm, not the version
# pinned in package.json#packageManager. The result is a lockfile this repository
# did not author, which `scripts/check-lockfile-idempotent.sh` rejects in CI.
#
# Re-resolving with the pinned pnpm on the PR branch produces, by definition,
# exactly what that guard expects — so this workflow makes Dependabot npm PRs
# mergeable instead of permanently red.
#
# This is the npm counterpart of dependabot-go-tidy.yml, and the same shape: run
# the canonical tool, push if it changed anything.
#
# Historical note, because two earlier attempts at this file were wrong. The
# first re-resolved the PR lockfile to restore a `tarball:` provenance field
# Dependabot strips; that cannot work, because the pinned pnpm preserves whatever
# form it is given and never re-adds the field, so the job reported success while
# the provenance stayed gone. The second recovered the base branch's lockfile
# first, which does preserve the field locally but not in a clean CI environment,
# where the pinned pnpm emits the stripped form regardless. The invariant was
# then changed from lockfile *content* to lockfile *stability*, which is
# satisfiable by construction — and this workflow became simple again.

on: pull_request

permissions:
  contents: write

jobs:
  relock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors .github/actions/setup-node-ui, minus run-install and the
      # i18n-react build — relocking needs the toolchain, not the workspace.
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: "0.1.23"
          node-version: "22"
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          run-install: false

      - name: Re-resolve with the pinned pnpm
        run: vp install --lockfile-only

      - name: Push if the lockfile changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the pinned pnpm's resolution"
            exit 0
          fi
          echo "Lockfile was written by a different resolver — relocking."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: re-resolve pnpm-lock.yaml with the pinned pnpm"
          git push
