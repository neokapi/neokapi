name: Deploy Pulse

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/pulse/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Pulse Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # pulse bundles @neokapi/ui → @neokapi/ui-primitives, which imports
      # @neokapi/kapi-react/runtime (a built ./dist subpath export). Build it
      # first so the pulse vite build resolves the import.
      - name: Build @neokapi/kapi-react
        working-directory: packages/kapi-react
        run: vp run build

      - name: Build pulse app
        working-directory: bowrain/apps/pulse
        run: vp run build

      - name: Upload pulse artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pulse-dist
          path: bowrain/apps/pulse/dist
          retention-days: 7

  docker:
    name: Build Pulse Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push pulse image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-pulse/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-pulse:${{ github.sha }}
            ghcr.io/neokapi/bowrain-pulse:latest
          cache-from: type=gha,scope=bowrain-pulse
          cache-to: type=gha,mode=max,scope=bowrain-pulse

  deploy:
    name: Deploy
    # Pulse has no deployment target yet (no ECS service, no S3 bucket in the
    # prod cluster — unlike web/ctrl it was never wired up). Gate on a
    # pulse-specific var that is currently unset so the job stays dormant and the
    # workflow is build + publish only; wiring pulse (e.g. its own S3+CloudFront,
    # like web/ctrl) will set SPA_PULSE_BUCKET and activate an s3-sync deploy here.
    if: ${{ vars.SPA_PULSE_BUCKET != '' }}
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Download pulse assets
        uses: actions/download-artifact@v7
        with:
          name: pulse-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.SPA_PULSE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.SPA_PULSE_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "version.json"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          if [ -f dist/version.json ]; then
            aws s3 cp dist/version.json "s3://$BUCKET/version.json" \
              --cache-control "no-cache" --content-type "application/json"
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
