name: Deploy Pulse

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "bowrain/apps/pulse/**"
      - "bowrain/packages/ui/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Pulse Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-ui

      # pulse bundles @neokapi/ui → @neokapi/ui-primitives, which imports
      # @neokapi/kapi-react/runtime (a built ./dist subpath export). Build it
      # first so the pulse vite build resolves the import.
      - name: Build @neokapi/kapi-react
        working-directory: packages/kapi-react
        run: vp run build

      - name: Build pulse app
        working-directory: bowrain/apps/pulse
        run: vp run build

      - name: Upload pulse artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pulse-dist
          path: bowrain/apps/pulse/dist
          retention-days: 7

  docker:
    name: Build Pulse Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push pulse image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bowrain/docker/bowrain-pulse/Dockerfile
          push: true
          tags: |
            ghcr.io/neokapi/bowrain-pulse:${{ github.sha }}
            ghcr.io/neokapi/bowrain-pulse:latest
          cache-from: type=gha,scope=bowrain-pulse
          cache-to: type=gha,mode=max,scope=bowrain-pulse

  deploy:
    name: Deploy to ECS
    # No-op until the AWS environment exists: with the repo var unset the job
    # is skipped and the workflow stays green (build + publish only).
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Task definitions are Terraform-owned and pin :latest — the forced
      # deployment makes ECS re-pull the :latest image pushed above. pulse does
      # not yet have its own ECS service in the prod cluster, so the rollout is
      # skipped gracefully (build + publish still run) until infra defines
      # bowrain-<env>-pulse; the step then activates automatically. This keeps
      # main green when AWS_DEPLOY_ROLE_ARN is set for the services that do exist.
      # Rollback = re-run this workflow from an older commit.
      - name: Force new deployment of the pulse service (if it exists)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: bowrain-${{ inputs.environment || 'prod' }}-pulse
        run: |
          status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$status" != "ACTIVE" ]; then
            echo "::notice::Service $SERVICE not found (status=$status); skipping rollout until infra defines it."
            exit 0
          fi
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
