name: Contract Audit

# Re-runs the contract-audit pipeline (Okapi @Test methods → 4-state
# coverage view) and uploads the dashboard JSON. It pins to a chosen
# Okapi version, runs `mvn test` against upstream Okapi to get the
# canonical contract list, joins with native `go test -json` plus
# `// okapi:` annotations, and renders /contract-audit on the docs
# site.
#
# This job is opt-in (workflow_dispatch + scheduled) and informational,
# not a release gate. It needs only upstream Okapi and this repository:
# the okapi-bridge schema check (BRIDGE_SCHEMAS) and the head-to-head
# parity column are not run here. Parity is reported on a schedule by
# the okapi-bridge repository's own parity workflow.

on:
  schedule:
    # Weekly Monday 06:00 UTC: catches new Okapi tests within ~7 days
    # of an upstream tag without burning CI minutes on every push.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      okapi_ref:
        description: "Okapi git ref to pin (tag, branch, or SHA). Defaults to v1.48.0."
        required: false
        default: "v1.48.0"
      filters:
        description: "Comma-separated Okapi filter modules to audit. Defaults to every module a format spec references."
        required: false
        default: "html,table,json,markdown,messageformat,openoffice,openxml,plaintext,po,properties,tmx,ts,subtitles,xliff,xliff2,xmlstream,yaml"

permissions:
  contents: read

env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath

jobs:
  audit:
    name: contract-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Inputs are surfaced as env vars and quoted at every shell use
      # site so injection via the workflow_dispatch text fields is
      # blocked even though only contributors with write access can
      # trigger this workflow.
      OKAPI_REF: ${{ inputs.okapi_ref || 'v1.48.0' }}
      # Every Okapi filter module a format spec under core/formats references
      # (csv is Okapi's table module, odf its openoffice, vtt its subtitles,
      # xml its xmlstream). A spec whose module is not here has its okapi_refs
      # reported as NOT CHECKED rather than read as drift.
      FILTERS: ${{ inputs.filters || 'html,table,json,markdown,messageformat,openoffice,openxml,plaintext,po,properties,tmx,ts,subtitles,xliff,xliff2,xmlstream,yaml' }}
    steps:
      - name: Checkout neokapi
        uses: actions/checkout@v7
        with:
          path: neokapi
          fetch-depth: 0

      - name: Checkout Okapi (upstream tests)
        # Upstream Okapi is hosted on GitLab; actions/checkout only reaches
        # GitHub, so this is a plain shallow clone of the requested tag.
        run: |
          git clone --depth 1 --branch "$OKAPI_REF" \
            https://gitlab.com/okapiframework/Okapi.git okapi-java

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: neokapi/go.mod
          # setup-go has no restore-only mode, so only a run on main uses its cache.
          cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install ICU dev libraries
        uses: ./neokapi/.github/actions/apt-install
        with:
          packages: libicu-dev pkg-config

      - name: Run mvn test for selected filter modules
        # The modules in FILTERS, in one reactor so their shared dependencies
        # build once. Every module a spec references takes about two minutes.
        # A test failure is recorded in the reports and does not stop the run;
        # a module that does not build leaves no reports, and the audit names
        # its references as not checked.
        working-directory: okapi-java
        run: |
          modules="$(echo "$FILTERS" | tr ',' '\n' | sed 's|^|okapi/filters/|' | paste -sd, -)"
          echo "::group::mvn test -pl $modules"
          mvn -B -DfailIfNoTests=false test -pl "$modules" -am || true
          echo "::endgroup::"

      # Okapi's RoundTrip*IT / *XliffCompareIT contracts run under Maven
      # Failsafe, not Surefire, so the drift check needs their reports too.
      # Without them an // okapi: *IT annotation cannot be checked.
      - name: Generate Okapi Failsafe IT reports
        working-directory: neokapi
        env:
          OKAPI_REPO: ${{ github.workspace }}/okapi-java
        run: make okapi-failsafe-reports OKAPI_REPO="$OKAPI_REPO"

      - name: Run native go test + contract-audit generator
        working-directory: neokapi
        env:
          OKAPI_REPO: ${{ github.workspace }}/okapi-java
          # A `// okapi: ClassName#methodName` annotation or spec ref whose
          # Java test no longer exists in the pinned Okapi version fails the
          # run; the dashboard would drop its row otherwise. The run pins an
          # Okapi tag, so it knows which tests exist.
          CONTRACT_FAIL_ON_DRIFT: "1"
        # One audit over every module the step above tested, so the JSON covers
        # them all and each format's references are checked against its own
        # module's tests.
        run: make contract-audit CONTRACT_FILTER=all OKAPI_REPO="$OKAPI_REPO" CONTRACT_FAIL_ON_DRIFT="$CONTRACT_FAIL_ON_DRIFT"

      - name: Upload contract-audit JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-audit
          path: neokapi/web/static/data/contract-audit.json
          if-no-files-found: error
          retention-days: 90
