name: Release ASR plugin

# The kapi-asr speech-recognition plugin releases independently of the kapi CLI,
# on its own `asr-v*` tag (e.g. `asr-v0.1.0` -> kapi-asr 0.1.0), mirroring the
# kapi-sat model. kapi-asr is PURE-Go (no cgo) but bundles a per-platform
# whisper.cpp `whisper-cli` (MIT) + a default ggml model, so the heavy/risky part
# is producing whisper-cli per target: linux/x64+arm64 and windows/x64 use
# whisper.cpp's published prebuilts; macOS/arm64 and windows/arm64 are built
# from source (cmake).
#
# workflow_dispatch is a BUILD-ONLY dry run (no publish / no registry write) for
# iterating the platform matrix. The publish + register jobs are gated to
# `asr-v*` tag pushes only.
on:
  push:
    tags:
      - "asr-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # cosign keyless

# whisper.cpp is pinned three ways that name one commit. The source legs clone
# the version tag. The prebuilt legs download from the b<NNNN> build release,
# because upstream publishes its binaries there and no longer under the version
# tag; WHISPER_CPP_BUILD is the build tag cut from the same commit. The
# "Check the whisper.cpp pins" step fails when either tag no longer resolves to
# WHISPER_CPP_COMMIT, and each prebuilt archive is checked against the SHA-256
# in its matrix row (GitHub's asset digest, confirmed against a download). A
# new version changes all three, and every sha256 in the matrix.
env:
  # The same Go flags as a make-driven local build; see scripts/lib/goflags.mk.
  GOFLAGS: -trimpath
  WHISPER_CPP_VERSION: "v1.9.5"
  WHISPER_CPP_BUILD: "b5454"
  WHISPER_CPP_COMMIT: "d1be6fde11ac6e0407606b4e42fe72d34add8037"
  WHISPER_MODEL: "ggml-base.en.bin"
  WHISPER_MODEL_URL: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"

jobs:
  build-asr-plugin:
    name: Build kapi-asr plugin (${{ matrix.build.platform }})
    strategy:
      fail-fast: false
      matrix:
        build:
          - { platform: darwin/arm64, os: macos-latest, goos: darwin, goarch: arm64, whisper: source }
          - { platform: linux/amd64, os: ubuntu-latest, goos: linux, goarch: amd64, whisper: prebuilt, asset: "whisper-bin-ubuntu-x64.tar.gz", sha256: "a72becf15d7917f990f6313867a52638b82b7f9ef237fb0c980dac56a135781c" }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64, whisper: prebuilt, asset: "whisper-bin-ubuntu-arm64.tar.gz", sha256: "6b95ebfc60447df48e70ef00a73bdc3f41679ed2d01ef465827206a2ff325149" }
          - { platform: windows/amd64, os: windows-2025, goos: windows, goarch: amd64, whisper: prebuilt, asset: "whisper-bin-x64.zip", sha256: "6ba69e3482d7826214f90a6a9c84ca07782aec1e1d0c6a7c30c994fd5d816ccb" }
          - { platform: windows/arm64, os: windows-11-arm, goos: windows, goarch: arm64, whisper: source }
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The darwin leg builds every Mach-O it ships for the plugin's macOS
      # minimum (scripts/macos-minimum.sh): the Go link, the cgo objects and
      # the third-party code built here. The check after packaging fails the
      # release when a binary records a newer one.
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          min="$(scripts/macos-minimum.sh asr)"
          {
            echo "MACOS_MINIMUM=$min"
            echo "MACOSX_DEPLOYMENT_TARGET=$min"
            echo "CGO_CFLAGS=-O2 -g -mmacosx-version-min=$min"
            echo "CGO_CXXFLAGS=-O2 -g -mmacosx-version-min=$min"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # A tag run saves no cache: one saved there serves only that tag,
          # and setup-go has no restore-only mode.
          cache: false

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/asr-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#asr-v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Both tags must still name the pinned commit: a moved tag, or a build tag
      # cut from another commit, fails here before anything is downloaded.
      - name: Check the whisper.cpp pins
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags https://github.com/ggml-org/whisper.cpp \
            "${WHISPER_CPP_VERSION}" "${WHISPER_CPP_VERSION}^{}" "${WHISPER_CPP_BUILD}" "${WHISPER_CPP_BUILD}^{}")"
          for tag in "$WHISPER_CPP_VERSION" "$WHISPER_CPP_BUILD"; do
            # An annotated tag lists the commit it names as <tag>^{}; a
            # lightweight tag names the commit directly.
            got="$(awk -v t="refs/tags/${tag}" '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 }
              END { print (peeled != "" ? peeled : plain) }' <<<"$refs")"
            if [ "$got" != "$WHISPER_CPP_COMMIT" ]; then
              echo "::error::whisper.cpp tag ${tag} resolves to '${got:-nothing}', expected ${WHISPER_CPP_COMMIT}"
              exit 1
            fi
          done
          echo "whisper.cpp ${WHISPER_CPP_VERSION} and ${WHISPER_CPP_BUILD} both name ${WHISPER_CPP_COMMIT}"

      # ── obtain whisper-cli + its runtime libs into $WHISPER_DIR ────────────────
      # Prebuilt legs: download the archive from whisper.cpp's build release
      # (contains whisper-cli + shared libs) and check it against the matrix
      # SHA-256 before unpacking. Linux: patch rpath to $ORIGIN so libs load
      # beside the binary. Windows: DLLs load from the same dir automatically.
      - name: Fetch whisper.cpp prebuilt (Unix)
        if: matrix.build.whisper == 'prebuilt' && runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.build.asset }}
          ASSET_SHA256: ${{ matrix.build.sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/ggml-org/whisper.cpp/releases/download/${WHISPER_CPP_BUILD}/${ASSET}"
          mkdir -p "$RUNNER_TEMP/wsp"
          curl -sSfL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/w.tgz" "$url"
          actual="$(sha256sum "$RUNNER_TEMP/w.tgz" | cut -d' ' -f1)"
          if [ "$actual" != "$ASSET_SHA256" ]; then
            echo "::error::checksum mismatch for ${ASSET} in whisper.cpp ${WHISPER_CPP_BUILD}: expected ${ASSET_SHA256}, actual ${actual}"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/w.tgz" -C "$RUNNER_TEMP/wsp"
          dir="$(dirname "$(find "$RUNNER_TEMP/wsp" -name 'whisper-cli' -type f | head -n1)")"
          [ -n "$dir" ] || { echo "::error::whisper-cli not found in prebuilt"; find "$RUNNER_TEMP/wsp" | head; exit 1; }
          # Bundle the .so libs beside whisper-cli + set $ORIGIN rpath.
          find "$RUNNER_TEMP/wsp" -name 'lib*.so*' -exec cp -p {} "$dir/" \;
          if ! command -v patchelf >/dev/null; then sudo apt-get update && sudo apt-get install -y patchelf; fi
          # shellcheck disable=SC2016 # $ORIGIN must reach patchelf literally
          patchelf --set-rpath '$ORIGIN' "$dir/whisper-cli" || true
          echo "WHISPER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Fetch whisper.cpp prebuilt (Windows)
        if: matrix.build.whisper == 'prebuilt' && runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.build.asset }}
          ASSET_SHA256: ${{ matrix.build.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/$env:WHISPER_CPP_BUILD/$env:ASSET"
          $dest = "$env:RUNNER_TEMP\w.zip"
          Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -Algorithm SHA256 -Path $dest).Hash.ToLowerInvariant()
          if ($actual -ne $env:ASSET_SHA256) {
            Write-Error "checksum mismatch for $env:ASSET in whisper.cpp $($env:WHISPER_CPP_BUILD): expected $($env:ASSET_SHA256), actual $actual"
            exit 1
          }
          Expand-Archive -Path $dest -DestinationPath "$env:RUNNER_TEMP\wsp" -Force
          $cli = Get-ChildItem -Path "$env:RUNNER_TEMP\wsp" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $cli) { Write-Error "whisper-cli.exe not found"; exit 1 }
          "WHISPER_DIR=$($cli.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build whisper.cpp from source (macOS)
        if: matrix.build.whisper == 'source' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "${WHISPER_CPP_VERSION}" --depth 1 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/wsrc"
          head="$(git -C "$RUNNER_TEMP/wsrc" rev-parse HEAD)"
          [ "$head" = "$WHISPER_CPP_COMMIT" ] || { echo "::error::whisper.cpp ${WHISPER_CPP_VERSION} cloned at ${head}, expected ${WHISPER_CPP_COMMIT}"; exit 1; }
          cmake -S "$RUNNER_TEMP/wsrc" -B "$RUNNER_TEMP/wbuild" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/wbuild" --config Release -j --target whisper-cli
          out="$RUNNER_TEMP/wdir"; mkdir -p "$out"
          cli="$(find "$RUNNER_TEMP/wbuild" -name 'whisper-cli' | head -n1)"
          cp "$cli" "$out/"
          # gather shared libs produced by the build
          find "$RUNNER_TEMP/wbuild" \( -name 'libwhisper*.dylib' -o -name 'libggml*.dylib' \) -exec cp -p {} "$out/" \;
          install_name_tool -add_rpath @loader_path "$out/whisper-cli" 2>/dev/null || true
          echo "WHISPER_DIR=$out" >> "$GITHUB_ENV"

      # windows/arm64: ggml refuses MSVC ("MSVC is not supported for ARM, use
      # clang"), so build with the LLVM-mingw CLANGARM64 toolchain (clang + libc++),
      # mirroring release-sat.yml. whisper-cli.exe then links the CLANGARM64 runtime
      # DLLs (libc++/libunwind/libwinpthread), which we bundle beside it.
      - name: Set up MSYS2 CLANGARM64 (windows/arm64)
        if: matrix.build.whisper == 'source' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          # A tag run saves no cache.
          cache: false
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja

      - name: Build whisper.cpp from source (windows/arm64, clang)
        if: matrix.build.whisper == 'source' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          git clone --branch "${WHISPER_CPP_VERSION}" --depth 1 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/wsrc"
          head="$(git -C "$RUNNER_TEMP/wsrc" rev-parse HEAD)"
          [ "$head" = "$WHISPER_CPP_COMMIT" ] || { echo "::error::whisper.cpp ${WHISPER_CPP_VERSION} cloned at ${head}, expected ${WHISPER_CPP_COMMIT}"; exit 1; }
          # whisper.cpp v1.9.5's examples/common.cpp calls std::partial_sort
          # without including <algorithm>, and the CLANGARM64 libc++ does not
          # pull it in through another header. Upstream added the include after
          # v1.9.5 (it is in b5907); drop -include once the pin is past it.
          cmake -S "$RUNNER_TEMP/wsrc" -B "$RUNNER_TEMP/wbuild" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF \
            -DCMAKE_CXX_FLAGS="-include algorithm"
          cmake --build "$RUNNER_TEMP/wbuild" --target whisper-cli
          out="$RUNNER_TEMP/wdir"; mkdir -p "$out"
          cp "$(find "$RUNNER_TEMP/wbuild" -name 'whisper-cli.exe' | head -n1)" "$out/"
          # whisper/ggml DLLs produced by the build…
          find "$RUNNER_TEMP/wbuild" -name '*.dll' -exec cp -p {} "$out/" \;
          # …plus the CLANGARM64 C++/unwind/pthread runtime DLLs the exe links.
          clangbin="$(dirname "$(command -v clang)")"
          for dll in libc++ libunwind libwinpthread-1; do
            f="$(find "$clangbin" -maxdepth 1 -name "${dll}*.dll" | head -n1)"
            if [ -n "$f" ]; then
              cp -p "$f" "$out/"
            else
              echo "::warning::runtime DLL $dll not found in $clangbin"
            fi
          done
          echo "WHISPER_DIR=$(cygpath -w "$out")" >> "$GITHUB_ENV"

      - name: Download default model
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/${WHISPER_MODEL}" "${WHISPER_MODEL_URL}"
          echo "MODEL_PATH=$RUNNER_TEMP/${WHISPER_MODEL}" >> "$GITHUB_ENV"

      # macOS: build the pure-Go kapi-asr binary up front so it can be Developer-ID
      # signed alongside the bundled whisper-cli before packaging (the package
      # script then bundles this pre-signed binary as-is via --prebuilt-bin).
      - name: Build kapi-asr (macOS, pre-sign)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prebuilt"
          ( cd plugins/asr && GOWORK=off CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w" -o "$RUNNER_TEMP/prebuilt/kapi-asr" ./cmd/kapi-asr )
          echo "ASR_PREBUILT_BIN=$RUNNER_TEMP/prebuilt/kapi-asr" >> "$GITHUB_ENV"

      # macOS Developer-ID signing + notarization of every bundled Mach-O
      # (kapi-asr + whisper-cli + dylibs), via the shared composite action.
      - name: Sign + notarize macOS Mach-O
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-sign
        with:
          label: kapi-asr
          binaries: |
            ${{ env.WHISPER_DIR }}/whisper-cli
            ${{ env.ASR_PREBUILT_BIN }}
          dylib-globs: ${{ env.WHISPER_DIR }}/*.dylib
          notarize: ${{ startsWith(github.ref, 'refs/tags/asr-v') }}
          developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          sign-identity: ${{ secrets.APPLE_SIGN_IDENTITY }}
          api-key-p8-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Package kapi-asr tarball
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PREBUILT_BIN: ${{ env.ASR_PREBUILT_BIN }}
        run: |
          scripts/package-asr-plugin.sh \
            --version "${VERSION}" \
            --whisper-dir "${WHISPER_DIR}" \
            --model "${MODEL_PATH}" \
            --prebuilt-bin "${PREBUILT_BIN:-}" \
            --out-dir "$RUNNER_TEMP/asr-out"

      # cosign keyless sign (publish only). sigstore/cosign-installer has no
      # windows/arm64 build, so go-install cosign on that leg and use the action
      # everywhere else.
      - name: Check the macOS minimum the tarball's binaries record
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/macho-check"
          mkdir -p "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          scripts/check-macho-minimum.sh --minimum "$MACOS_MINIMUM" "$dir"

      - name: Install cosign (publish only)
        if: startsWith(github.ref, 'refs/tags/asr-v') && !(runner.os == 'Windows' && matrix.build.goarch == 'arm64')
        uses: sigstore/cosign-installer@v3
      - name: Install cosign via go (windows/arm64, publish only)
        if: startsWith(github.ref, 'refs/tags/asr-v') && runner.os == 'Windows' && matrix.build.goarch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          # setup-go doesn't add GOPATH/bin to PATH; do it so the sign step finds cosign.
          cygpath -w "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cosign sign
        if: startsWith(github.ref, 'refs/tags/asr-v')
        shell: bash
        env: { TARBALL: "${{ steps.package.outputs.tarball }}" }
        run: cosign sign-blob --yes --new-bundle-format --bundle "${TARBALL}.sigstore.json" "${TARBALL}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: asr-tarball-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: |
            ${{ runner.temp }}/asr-out/*.tar.gz
            ${{ runner.temp }}/asr-out/*.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 14

      - name: Write checksum artifact
        shell: bash
        env:
          ASR_SHA256: ${{ steps.package.outputs.sha256 }}
          ASR_TARBALL_NAME: ${{ steps.package.outputs.tarball_name }}
          LEG_GOOS: ${{ matrix.build.goos }}
          LEG_GOARCH: ${{ matrix.build.goarch }}
        run: |
          mkdir -p "$RUNNER_TEMP/asr-checksums"
          echo "${ASR_SHA256}  ${ASR_TARBALL_NAME}" > "$RUNNER_TEMP/asr-checksums/${LEG_GOOS}_${LEG_GOARCH}.sha256"
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: asr-checksum-${{ matrix.build.goos }}-${{ matrix.build.goarch }}
          path: ${{ runner.temp }}/asr-checksums/*.sha256
          retention-days: 14

  publish-asr-release:
    name: Publish kapi-asr release
    if: startsWith(github.ref, 'refs/tags/asr-v')
    needs: build-asr-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: asr-tarball-*, path: asr-release, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          make_latest: false
          files: |
            asr-release/*.tar.gz
            asr-release/*.tar.gz.sigstore.json

  register-asr-plugin:
    name: Register kapi-asr in plugin registry
    if: startsWith(github.ref, 'refs/tags/asr-v')
    needs: publish-asr-release
    runs-on: ubuntu-latest
    steps:
      # The one file this job reads from the repository.
      - name: Check out the registry push helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib/registry-push.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with: { pattern: asr-checksum-*, path: asr-checksums, merge-multiple: true }
      - name: Update manifest plugin registry (asr)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#asr-v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then echo "no REGISTRY_TOKEN; skip"; exit 0; fi
          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main
          declare -A SHAS
          for f in asr-checksums/*.sha256; do [ -f "$f" ] || continue; SHAS[$(awk '{print $2}' "$f")]=$(awk '{print $1}' "$f"); done
          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          CERT_ID="https://github.com/${REPO}/.github/workflows/release-asr.yml@refs/tags/${REF_NAME}"
          declare -a ARGS
          for plat in darwin/arm64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            os=${plat%/*}; arch=${plat#*/}; file="kapi-asr_${VERSION}_${os}_${arch}.tar.gz"
            if [ -n "${SHAS[$file]:-}" ]; then
              ARGS+=("--platform" "$plat" "--url" "${REPO_URL}/${file}" "--sha256" "${SHAS[$file]}" "--signature" "${REPO_URL}/${file}.sigstore.json")
            else echo "::warning::no checksum for ${file}; skipping ${plat}"; fi
          done
          [ ${#ARGS[@]} -eq 0 ] && { echo "::error::no artifacts"; exit 1; }
          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry
          git -C /tmp/registry config user.email "release-bot@neokapi.dev"
          git -C /tmp/registry config user.name "release-bot"
          register() {
            /tmp/registry-update --registry /tmp/registry/manifest-plugins.json \
              --plugin asr --version "$VERSION" --channel stable --released "$(date -u +%Y-%m-%d)" \
              --cert-identity "$CERT_ID" --cert-oidc-issuer https://token.actions.githubusercontent.com "${ARGS[@]}"
          }
          # A release that runs beside another pushes to the same registry. A
          # rejected push rebases and runs register again; see the helper.
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE}/scripts/lib/registry-push.sh"
          registry_commit_and_push /tmp/registry "Register asr ${VERSION}" register manifest-plugins.json

  # The tap formula, rendered from this run's checksum artifacts. Runs beside
  # the registry write, not after it: `brew install` and `kapi plugin install`
  # are two views of the same release and neither is the other's gate.
  publish-asr-formula:
    name: Publish kapi-asr Homebrew formula
    if: startsWith(github.ref, 'refs/tags/asr-v')
    needs: publish-asr-release
    uses: ./.github/workflows/_publish-plugin-formula.yml
    with:
      plugin: asr
      tag: ${{ github.ref_name }}
    secrets: inherit
