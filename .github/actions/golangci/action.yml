name: golangci-lint (install)
description: >
  Install the pinned golangci-lint on PATH. The lint jobs then run a make
  target, which runs scripts/tagmatrix: golangci-lint once per build
  configuration, so every build-tagged file is linted, and `make lint` runs
  the same commands locally. A job that uses it runs
  .github/actions/golangci-cache once first.

runs:
  using: composite
  steps:
    - uses: golangci/golangci-lint-action@v9
      with:
        install-mode: binary
        install-only: true
        version: v2.15.0
        # The job restores and saves golangci-lint's cache once, through
        # .github/actions/golangci-cache.
        skip-cache: true
