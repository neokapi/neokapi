name: Save the Go build cache a run used
description: >
  Keep the Go build cache entries this run used, save them under one
  build-cache flavor, and delete the copy they replace. For the one job that
  writes a flavor (the warm jobs, the nightly full suite): setup-go-modules
  restored the last copy, and saving it whole would carry forward every
  object an earlier run compiled. Runs on main only, and needs `actions:
  write` for the delete.
inputs:
  flavor:
    description: The build-cache flavor, as setup-go-modules restores it
    required: true
  go-version:
    description: The go-version given to setup-go-modules
    required: false
    default: "1.27.4"
  since:
    description: Unix time before the job's first compile, from `date +%s`
    required: true
runs:
  using: composite
  steps:
    # Go stamps an entry it uses when the entry's stamp is over an hour old,
    # so a file whose stamp is still more than an hour before `since` was not
    # used by this run.
    - name: Drop the cache entries this run did not use
      id: trim
      shell: bash
      env:
        SINCE: ${{ inputs.since }}
      run: |
        set -euo pipefail
        dir="$(go env GOCACHE)"
        echo "build=$dir" >> "$GITHUB_OUTPUT"
        before=$(du -sm "$dir" | cut -f1)
        find "$dir" -type f ! -newermt "@$((SINCE - 3700))" -delete
        echo "Go build cache: ${before} MiB before, $(du -sm "$dir" | cut -f1) MiB after dropping unused entries"
    # The key setup-go-modules restores by prefix.
    - name: Save the build cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.trim.outputs.build }}
        key: go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ inputs.flavor }}-trimpath-${{ github.sha }}
    - name: Delete the copy it replaces
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 scripts/ci-cache-budget.py prune
