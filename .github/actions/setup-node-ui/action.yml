name: Setup Node & UI
description: Install VitePlus, Node.js, and workspace dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1
      with:
        version: "0.1.23"
        node-version: ${{ inputs.node-version }}
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: false

    - name: Install workspace dependencies
      shell: bash
      env:
        # Required by .npmrc to authenticate with @neokapi scoped packages on
        # npm.pkg.github.com (e.g. @neokapi/react). Workflows that consume
        # this action must grant `permissions: packages: read`.
        GITHUB_TOKEN: ${{ github.token }}
      run: vp install --frozen-lockfile

    # @neokapi/i18n-react ships dist-only subpath exports (./runtime, ./vite, …)
    # that other workspace packages import; its dist/ is not committed, so any
    # job that typechecks or builds a consumer needs it built first. Building it
    # here — once, right after install, for every job that uses this composite —
    # avoids each job re-deriving that ordering (and forgetting it, which broke
    # the desktop typecheck: "Cannot find module '@neokapi/i18n-react/runtime'").
    - name: Build @neokapi/i18n-react
      shell: bash
      working-directory: packages/i18n-react
      run: vp run build
