name: Setup Node & UI
description: Install VitePlus, Node.js, and workspace dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "26"

runs:
  using: composite
  steps:
    # The vite alias must name the core the installed vite-plus uses. On drift
    # the overrides force vite-plus onto the aliased core, which cannot load its
    # rolldown binding, and every later vp step fails on that trace. So the
    # guard runs first. Before the install it checks that every setup-vp
    # `version:` names the catalog's vite-plus. The alias check reads the
    # installed vite-plus manifest, so it runs after the install, whose
    # postinstall uses esbuild, and before the first `vp run`.
    - name: Guard — the setup-vp pins track vite-plus
      shell: bash
      run: bash scripts/audit-vite-alias.sh

    # `vp env use` downloads a Node.js runtime from the Vite+ CDN when the
    # runner has none cached, and a transient CDN timeout skips every later
    # step. setup-vp has no input to point elsewhere, so the retry lives here.
    #
    # setup-vp is pinned to an exact release, which fetches the installer from
    # the requested version's release tag. If every pinned source fails it
    # runs the live script, which hands this version to install-legacy.sh or
    # install-legacy.ps1 from VP_LEGACY_INSTALLER_URL. GitHub serves those as
    # text. Commit ae0ec12d0 is the first whose legacy script runs under
    # Set-StrictMode.
    - name: Install Vite+ and the Node.js runtime
      id: vp-setup
      uses: voidzero-dev/setup-vp@v1.22.0
      continue-on-error: true
      env:
        VP_LEGACY_INSTALLER_URL: ${{ runner.os == 'Windows' && 'https://raw.githubusercontent.com/voidzero-dev/vite-plus/ae0ec12d06181bad1549b98ef3aac70c970c3556/packages/cli/install-legacy.ps1' || 'https://raw.githubusercontent.com/voidzero-dev/vite-plus/ae0ec12d06181bad1549b98ef3aac70c970c3556/packages/cli/install-legacy.sh' }}
      with:
        version: "1.7.0"
        node-version: ${{ inputs.node-version }}
        cache: true
        # Only a run on main saves the dependency cache; any other ref restores it.
        cache-save: ${{ github.ref == 'refs/heads/main' }}
        cache-dependency-path: pnpm-lock.yaml
        run-install: false

    - name: Report the Vite+ setup failure before retrying
      if: steps.vp-setup.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Vite+ setup failed::Installing Vite+ or its Node.js runtime failed — usually the runtime download from the Vite+ CDN, not anything in this repository. Retrying once in 30s; if the retry also fails, this job is red for infrastructure reasons."
        sleep 30

    - name: Install Vite+ and the Node.js runtime (retry)
      if: steps.vp-setup.outcome == 'failure'
      uses: voidzero-dev/setup-vp@v1.22.0
      env:
        VP_LEGACY_INSTALLER_URL: ${{ runner.os == 'Windows' && 'https://raw.githubusercontent.com/voidzero-dev/vite-plus/ae0ec12d06181bad1549b98ef3aac70c970c3556/packages/cli/install-legacy.ps1' || 'https://raw.githubusercontent.com/voidzero-dev/vite-plus/ae0ec12d06181bad1549b98ef3aac70c970c3556/packages/cli/install-legacy.sh' }}
      with:
        version: "1.7.0"
        node-version: ${{ inputs.node-version }}
        cache: true
        # Only a run on main saves the dependency cache; any other ref restores it.
        cache-save: ${{ github.ref == 'refs/heads/main' }}
        cache-dependency-path: pnpm-lock.yaml
        run-install: false

    - name: Install workspace dependencies
      shell: bash
      run: vp install --frozen-lockfile

    - name: Guard — the vite catalog alias names the core vite-plus uses
      shell: bash
      run: bash scripts/audit-vite-alias.sh --installed

    # @neokapi/i18n-react ships dist-only subpath exports (./runtime, ./vite, …)
    # that other workspace packages import; its dist/ is not committed, so any
    # job that typechecks or builds a consumer needs it built first. Building it
    # here, once, right after install, for every job that uses this composite,
    # avoids each job re-deriving that ordering (and forgetting it, which broke
    # the desktop typecheck: "Cannot find module '@neokapi/i18n-react/runtime'").
    - name: Build @neokapi/i18n-react
      shell: bash
      working-directory: packages/i18n-react
      run: vp run build
