name: Setup Go & Modules
description: >
  Install Go, restore flavor-scoped module/build caches, download modules for
  all modules, and create embed placeholders.

inputs:
  go-version:
    description: Go version to install
    required: false
    default: "1.26.0"
  cache-flavor:
    description: >
      Build-cache flavor. The Go build cache (GOCACHE) is keyed per flavor
      because -race/instrumented test builds populate it with object hashes
      that differ from plain `go build` output. Sharing one key across both
      (as setup-go's built-in cache did) meant every job restored a blob that
      rarely matched, so the framework recompiled near-cold in 7+ jobs. Use
      "race" for `make test-*` jobs and "plain" for build/tidy jobs.
    required: false
    default: race
  modules:
    description: >
      Space-separated module directories to `go mod download`, or "all" for the
      full set. Downloads are cheap on a warm module cache; scope this only when
      a job provably needs a subset.
    required: false
    default: all

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        # Caching is handled explicitly below so the build cache can be keyed
        # per flavor (setup-go's built-in cache uses a single go.sum-derived key
        # shared by every job, which thrashes the build cache — see cache-flavor).
        cache: false

    - name: Resolve Go cache paths
      id: gocache
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    # Effective build-cache flavor. On pull_request the test jobs build WITHOUT
    # -race (see the Makefile's event-aware profile), so their object files
    # differ from the race-instrumented push/nightly build. Key them under a
    # separate "pr" flavor so the two never thrash one another's cache; PR runs
    # self-warm from the previous PR via the restore-keys prefix. Jobs that pass
    # an explicit non-"race" flavor (e.g. "plain" for build/tidy) are untouched.
    - name: Resolve build-cache flavor
      id: flavor
      shell: bash
      env:
        REQUESTED: ${{ inputs.cache-flavor }}
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$REQUESTED" = "race" ] && [ "$EVENT" = "pull_request" ]; then
          echo "value=pr" >> "$GITHUB_OUTPUT"
        else
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore module download cache (flavor-independent)
      uses: actions/cache@v5
      with:
        path: ${{ steps.gocache.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum', 'host/go.sum', 'cli/go.sum', 'kapi/go.sum', 'apps/kapi-desktop/go.sum', 'bowrain/go.sum', 'bowrain/core/go.sum', 'bowrain/plugin/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Restore build cache (flavor-scoped)
      uses: actions/cache@v5
      with:
        path: ${{ steps.gocache.outputs.build }}
        # SHA-suffixed key always saves a fresh post-build cache; restore-keys
        # warms it from the most recent run of the same flavor + Go version.
        key: go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-

    - name: Install ICU development libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -uo pipefail
        # apt is bounded here because an unbounded apt is how this repository
        # loses a day of CI.
        #
        # The runner image resolves mirrors through /etc/apt/apt-mirrors.txt,
        # which lists an Azure mirror first. On 2026-08-19 that mirror stopped
        # answering and apt sat retrying it: `Ign: http://azure.archive.ubuntu
        # .com/ubuntu noble InRelease` over and over, for fourteen minutes in
        # the jobs that had a timeout-minutes to hit and for three hours in the
        # ones that did not. Every Go job in the repository goes through this
        # step, so every PR stalled, and the failure arrived as `cancelled` —
        # GitHub's word for a timeout — which reads like an infrastructure blip
        # rather than like apt waiting on a mirror.
        #
        # Three bounds, smallest first:
        #   Acquire::*::Timeout   — give up on one unresponsive mirror in
        #                           seconds and fall through to the next.
        #   timeout(1)            — a ceiling apt cannot argue with, whatever
        #                           it is doing.
        #   the loop              — a whole update+install may still fail; on
        #                           the second failure the Azure mirror is
        #                           dropped so the retry uses archive.ubuntu.com.
        #
        # The worst case is now ~5 minutes and a clear failure, against a
        # 6-hour hang.
        opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
        for attempt in 1 2 3; do
          if timeout 90 sudo apt-get $opts update &&
             timeout 90 sudo apt-get $opts install -y libicu-dev pkg-config; then
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed"
          # Only drop the Azure mirror if something else is left to use;
          # an empty mirrorlist would turn a slow install into no install.
          if [ "$attempt" -eq 2 ] && [ -f /etc/apt/apt-mirrors.txt ] &&
             grep -qv 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            echo "::warning::dropping the Azure mirror; retrying against the rest"
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sleep $((attempt * 5))
        done
        echo "::error::apt could not install libicu-dev after 3 attempts"
        exit 1

    - name: Download modules
      shell: bash
      run: |
        set -euo pipefail
        # go.sum already guarantees integrity, and the module cache is restored
        # from a trusted GitHub-hosted cache, so `go mod verify` (a full
        # cache-hash walk) is pure per-job overhead and is intentionally omitted.
        if [ "${{ inputs.modules }}" = "all" ]; then
          mods=". host cli kapi apps/kapi-desktop bowrain/core bowrain/plugin bowrain"
        else
          mods="${{ inputs.modules }}"
        fi
        for m in $mods; do
          ( cd "$m" && go mod download )
        done

    - name: Create embed placeholders
      shell: bash
      run: |
        mkdir -p bowrain/apps/web/dist && echo placeholder > bowrain/apps/web/dist/index.html
        mkdir -p bowrain/apps/bowrain/frontend/dist && echo placeholder > bowrain/apps/bowrain/frontend/dist/index.html
        mkdir -p apps/kapi-desktop/frontend/dist && echo placeholder > apps/kapi-desktop/frontend/dist/index.html

    # The embedded gettext catalogs are build output — the repository carries
    # the translated JSON they are compiled from. core/i18n and host/i18n
    # resolve `//go:embed catalogs/*.mo` at compile time, so this runs before
    # any job's first Go build. Steps that reach the framework through `make`
    # get it from the Makefile too; doing it here covers the jobs that call
    # `go` directly.
    - name: Compile the embedded i18n catalogs
      shell: bash
      run: go run ./core/i18n/gen/catalogs
