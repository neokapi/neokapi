name: Setup Go & Modules
description: >
  Install Go, restore flavor-scoped module/build caches, download modules for
  all modules, and create embed placeholders.

inputs:
  go-version:
    description: Go version to install
    required: false
    default: "1.27.4"
  cache-flavor:
    description: >
      Build-cache flavor. The Go build cache (GOCACHE) is keyed per flavor
      because -race/instrumented test builds populate it with object hashes
      that differ from plain `go build` output. Sharing one key across both
      (as setup-go's built-in cache did) meant every job restored a blob that
      rarely matched, so the framework recompiled near-cold in 7+ jobs. Use
      "race" for `make test-*` jobs: on a pull request, where they compile
      without the race detector, they read "pr". Use "pr" with `save-cache:
      "false"` for a job that never compiles with the race detector (build,
      tidy, lint, the analyzers). The job `Warm the pull request build cache`
      saves "pr" on main and is its only writer.
    required: false
    default: race
  save-cache:
    description: >
      Whether the job saves the caches it restored: "true", "false", or "auto",
      which saves on every event except pull_request. A pull request can read a
      cache saved on main or on its own branch and no other, so a cache a pull
      request saves serves only its own later pushes while counting against the
      repository's 10 GiB, where it evicts the caches on main that every pull
      request reads. Pass "false" from a job that reads a flavor another job
      owns: every job of a run writes the same key, and the first to finish
      wins.
    required: false
    default: auto
  modules:
    description: >
      Space-separated module directories to `go mod download`, or "all" for the
      full set. Downloads are cheap on a warm module cache; scope this only when
      a job provably needs a subset.
    required: false
    default: all

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        # Caching is handled explicitly below so the build cache can be keyed
        # per flavor (setup-go's built-in cache uses a single go.sum-derived key
        # shared by every job, which thrashes the build cache — see cache-flavor).
        cache: false

    # The same Go flags as a make-driven local build (scripts/lib/goflags.mk),
    # so CI compiles what a developer compiles and the build cache keys agree.
    # scripts/check-go-trimpath.py checks that this step keeps -trimpath.
    - name: Set GOFLAGS
      shell: bash
      run: |
        case " ${GOFLAGS:-} " in
          *" -trimpath "*) ;;
          *) GOFLAGS="${GOFLAGS:+${GOFLAGS} }-trimpath" ;;
        esac
        echo "GOFLAGS=${GOFLAGS}" >> "$GITHUB_ENV"

    - name: Resolve Go cache paths
      id: gocache
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    # Effective build-cache flavor. On pull_request the test jobs build WITHOUT
    # -race (see the Makefile's event-aware profile), so their object files
    # differ from the race-instrumented push/nightly build. They read a separate
    # "pr" flavor, which the warm job in ci.yml saves on main: a cache one pull
    # request saves is out of every other pull request's reach. A job that
    # passes another flavor gets that flavor on every event.
    - name: Resolve build-cache flavor
      id: flavor
      shell: bash
      env:
        REQUESTED: ${{ inputs.cache-flavor }}
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$REQUESTED" = "race" ] && [ "$EVENT" = "pull_request" ]; then
          echo "value=pr" >> "$GITHUB_OUTPUT"
        else
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve whether to save the caches
      id: save
      shell: bash
      env:
        REQUESTED: ${{ inputs.save-cache }}
        EVENT: ${{ github.event_name }}
      run: |
        case "$REQUESTED" in
          true | false) echo "value=$REQUESTED" >> "$GITHUB_OUTPUT" ;;
          auto)
            if [ "$EVENT" = "pull_request" ]; then
              echo "value=false" >> "$GITHUB_OUTPUT"
            else
              echo "value=true" >> "$GITHUB_OUTPUT"
            fi
            ;;
          *)
            echo "::error::save-cache must be auto, true or false, not '$REQUESTED'"
            exit 1
            ;;
        esac

    - name: Restore and save module download cache (flavor-independent)
      if: inputs.save-cache == 'true' || (inputs.save-cache == 'auto' && github.event_name != 'pull_request')
      uses: actions/cache@v6
      with:
        path: ${{ steps.gocache.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum', 'host/go.sum', 'cli/go.sum', 'kapi/go.sum', 'apps/kapi-desktop/go.sum', 'bowrain/go.sum', 'bowrain/core/go.sum', 'bowrain/plugin/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Restore module download cache
      if: inputs.save-cache == 'false' || (inputs.save-cache == 'auto' && github.event_name == 'pull_request')
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.gocache.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum', 'host/go.sum', 'cli/go.sum', 'kapi/go.sum', 'apps/kapi-desktop/go.sum', 'bowrain/go.sum', 'bowrain/core/go.sum', 'bowrain/plugin/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Restore and save build cache (flavor-scoped)
      if: inputs.save-cache == 'true' || (inputs.save-cache == 'auto' && github.event_name != 'pull_request')
      uses: actions/cache@v6
      with:
        path: ${{ steps.gocache.outputs.build }}
        # SHA-suffixed key always saves a fresh post-build cache; restore-keys
        # warms it from the most recent run of the same flavor + Go version.
        key: go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-trimpath-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-trimpath-

    - name: Restore build cache
      if: inputs.save-cache == 'false' || (inputs.save-cache == 'auto' && github.event_name == 'pull_request')
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.gocache.outputs.build }}
        key: go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-trimpath-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-go${{ inputs.go-version }}-${{ steps.flavor.outputs.value }}-trimpath-

    - name: Install ICU development libraries
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-install
      with:
        packages: libicu-dev pkg-config

    # go.sum already guarantees integrity, and the module cache is restored from
    # a trusted GitHub-hosted cache, so `go mod verify` (a full cache-hash walk)
    # is pure per-job overhead and is intentionally omitted.
    - name: Resolve module set
      id: mods
      shell: bash
      env:
        REQUESTED: ${{ inputs.modules }}
      run: |
        set -euo pipefail
        if [ "$REQUESTED" = "all" ]; then
          echo "value=. host cli kapi apps/kapi-desktop bowrain/core bowrain/plugin bowrain" >> "$GITHUB_OUTPUT"
        else
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
        fi

    - name: Download modules
      uses: ./.github/actions/go-mod-download
      with:
        modules: ${{ steps.mods.outputs.value }}

    - name: Create embed placeholders
      shell: bash
      run: make go-embed-placeholders

    # The embedded gettext catalogs are build output — the repository carries
    # the translated JSON they are compiled from. core/i18n and host/i18n
    # resolve `//go:embed catalogs/*.mo` at compile time, so this runs before
    # any job's first Go build. Steps that reach the framework through `make`
    # get it from the Makefile too; doing it here covers the jobs that call
    # `go` directly.
    - name: Compile the embedded i18n catalogs
      shell: bash
      run: go run ./core/i18n/gen/catalogs
