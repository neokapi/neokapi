name: Generate the qps pseudo-locale
description: >
  Generate a Docusaurus site's qps (pseudo-locale) translations into i18n/qps/
  with a released kapi, immediately before the site build that consumes them.

  Three tiers come out of this: the docs pages, the theme JSON
  write-translations owns, and — for a site wired to the build-time transform —
  the dictionary for its own React components.

  The output is NOT committed. It is a pure function of the docs plus the
  extractor, it changes with every docs edit, and it runs to thousands of files
  across the two sites — so committing it means either a large diff on every
  docs PR or a probe that silently goes stale. A stale probe is worse than none:
  a page added since the last regeneration falls back to English and reads as
  "this string is not translatable" when it only means "not regenerated".

inputs:
  site:
    description: Docusaurus site directory, relative to the repo root.
    required: true
  kapi-version:
    description: >
      Released kapi that generates the locale. Pinned rather than resolved,
      because `latest` takes stable tags only and this line is a prerelease.
    required: false
    default: "1.2.0-rc28"

runs:
  using: composite
  steps:
    # Installed, not built. dogfood-sync.yml already puts it plainly: this
    # "installs the released CLI ... the same path a customer takes. Neither is
    # built from this checkout, so the run tests the product rather than the
    # working tree."
    #
    # It also settles what should redeploy the docs. Built from source, the
    # generated locale depended on the whole Go module graph, so no honest list
    # of trigger paths existed — a fix in core/tools would merge and the site
    # would go on serving the old output with nothing to show for it. Pinned,
    # the locale is a function of the docs, the recipe, the terms and a version,
    # and the version is a line in this file that someone edits on purpose.
    #
    # No Go toolchain and no ICU: nothing here compiles any more.
    - name: Install kapi
      uses: neokapi/setup-kapi@v1
      with:
        version: ${{ inputs.kapi-version }}

    # --with-theme regenerates code.json and the theme JSON as well as the
    # pages, so the whole pseudo layer comes from this one step and nothing
    # about it lives in git. The React tier runs inside the same script for a
    # site wired to the transform, and it needs the workspace installed: the
    # extractor and the dictionary compiler are node CLIs.
    # The React tier calls this package's CLI and, at build time, its webpack
    # loader — both live in dist/. The site's own `prebuild` builds it, but that
    # runs after this action, so build it here rather than depend on ordering
    # somewhere else.
    - name: Build the i18n-react package
      shell: bash
      working-directory: packages/i18n-react
      run: vp run build

    - name: Generate ${{ inputs.site }} qps translations
      shell: bash
      run: ./scripts/pseudo-docs-i18n.sh "${{ inputs.site }}" --with-theme
