name: apt install
description: >-
  Install Debian packages with bounds, so a degraded Ubuntu mirror fails fast
  instead of hanging a job until its timeout — or, in a job without one, for
  hours.

inputs:
  packages:
    description: Space-separated package list.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: |
        set -uo pipefail
        # apt is bounded here because an unbounded apt is how this repository
        # loses a day of CI.
        #
        # The runner image resolves mirrors through /etc/apt/apt-mirrors.txt,
        # which lists an Azure mirror first. On 2026-08-19 that mirror stopped
        # answering and apt sat retrying it:
        #
        #   Ign: http://azure.archive.ubuntu.com/ubuntu noble InRelease
        #
        # over and over. Jobs with a timeout-minutes burned it and were recorded
        # as `cancelled` — GitHub's word for a timeout, which reads like an
        # infrastructure blip rather than like apt waiting on a mirror. Jobs
        # without one simply hung: one lint job sat in this step for five and a
        # half hours. Every open pull request was blocked at once.
        #
        # Three bounds, smallest first:
        #   Acquire::*::Timeout — give up on one unresponsive mirror in seconds
        #                         and fall through to the next in the list.
        #   timeout(1)          — a ceiling apt cannot argue with, whatever it
        #                         is doing.
        #   the loop            — a whole update+install may still fail; on the
        #                         second failure the Azure mirror is dropped so
        #                         the retry uses archive.ubuntu.com, which was
        #                         answering throughout.
        #
        # Worst case is about an hour and a half of retries and an explicit
        # error, against a six-hour hang; a healthy mirror costs nothing extra.
        # A package the runner image already holds needs no apt at all: the
        # image ships libicu-dev and pkg-config, and an `apt-get update` to
        # learn that took 4 to 6 seconds of every Go job. Only a list with a
        # package that is not installed goes to the mirrors.
        missing=""
        for pkg in $APT_PACKAGES; do
          if [ "$(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null)" != "installed" ]; then
            missing="$missing $pkg"
          fi
        done
        if [ -z "$missing" ]; then
          echo "apt-install: already installed: $APT_PACKAGES"
          exit 0
        fi
        echo "apt-install: installing:$missing"
        APT_PACKAGES="${missing# }"
        #
        # The download and the install are bounded apart. On 2026-11-23 a slow
        # mirror spent most of a single 180-second ceiling downloading the
        # GTK and WebKit packages, and the ceiling then killed dpkg halfway
        # through unpacking. Every retry after that stopped at "dpkg was
        # interrupted", so the job failed on a fault that had passed. Now the
        # network part (update, download) carries the ceiling and the retries,
        # the unpack runs from the downloaded files with a ceiling of its own,
        # and each attempt first finishes any dpkg run a previous one left.
        opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"
        for attempt in 1 2 3 4; do
          timeout 300 sudo dpkg --configure -a || true
          if timeout 120 sudo apt-get $opts update &&
             timeout 420 sudo apt-get $opts install -y --download-only $APT_PACKAGES &&
             timeout 600 sudo apt-get $opts install -y --no-download $APT_PACKAGES; then
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed"
          # Drop the Azure mirror only if the list holds something else; an
          # empty mirrorlist turns a slow install into no install at all.
          if [ "$attempt" -eq 2 ] && [ -f /etc/apt/apt-mirrors.txt ] &&
             grep -qv 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            echo "::warning::dropping the Azure mirror; retrying against the rest"
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          # A network fault on a runner usually clears within a minute.
          sleep $((attempt * 15))
        done
        echo "::error::apt could not install '$APT_PACKAGES' after 4 attempts"
        exit 1
