version: v1
name: harbor-help-app
defaults:
  source_language: en
  voice:
    profile: harbor-help
  target_languages: [nb, de]
  exclude:
    - "**/.git/**"
collections:
  - name: app
    content:
      - path: app/i18n/en.json
        target: app/i18n/{lang}.json
        format:
          name: json
