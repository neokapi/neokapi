version: v1
name: paired-content-task
defaults:
  source_language: en
  terms_source: .kapi/terms.json
  voice:
    profile_file: .kapi/voice.yaml
  coordinates:
    service: harbor-help
  exclude:
    - "**/.git/**"
profiles:
  harbor-help:
    channels: [child, older-adult, adult]
    voice: .kapi/voice.yaml
collections:
  - name: task-content
    channel: harbor-help/older-adult
    base: content
    coordinates:
      audience: older-adult
    content:
      - path: en/*.json
        format:
          name: json
flows:
  check:
    steps:
      - tool: voice-vocab-check
