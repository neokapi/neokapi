version: v1
name: paired-content-task
defaults:
  source_language: en
  voice:
    profile: harbor-help
  coordinates:
    service: harbor-help
  exclude:
    - "**/.git/**"
profiles:
  harbor-help:
    channels: [child, older-adult, adult]
    voice:
      profile: harbor-help
collections:
  - name: task-content
    channel: harbor-help/child
    base: content
    coordinates:
      audience: child
    content:
      - path: en/*.json
        format:
          name: json
flows:
  check:
    steps:
      - tool: voice-vocab-check
