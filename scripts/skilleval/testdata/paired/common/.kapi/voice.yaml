name: Harbor Help
description: Plain, practical instructions for people who book and attend video appointments.
tone:
  personality: [calm, plain, respectful]
  formality: neutral
  emotion: neutral
  humor: none
  guidelines: >-
    State what the reader can do next. Do not invent service capabilities.
style:
  active_voice: true
  sentence_length: short
  person_pov: second
  contractions: never
constraints:
  - id: harbor-help/no-unsupported-assurance
    version: 1
    source: STYLE.md
    statement: Do not describe the service as guaranteed, always safe or risk-free.
    kind: prohibited_pattern
    regex: '(?i)\b(guarantee(?:d|s)?|always safe|risk-free)\b'
terms:
  - term: portal
    replacement: overview page
    note: Harbor Help has no portal. The page that lists a reader's reports is the overview page.
