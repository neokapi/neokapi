# Native reference doc for the built-in `html` format.
# Schema source: core/formats/html/config.go (Config) + schema.go.
# Mirrors the Okapi okf_html filter; element/attribute rule model.
description: "Hent ut tekst fra HTML og sett den inn igjen, med uttrekksregler for elementer og attributter."
overview: |
  **HTML**-formatet leser HTML-dokumenter, trekker ut elementtekst og
  attributtverdier og skriver oversettelsene tilbake med den omkringliggende
  oppmerkingen intakt. Inline-elementer (som `b`, `i`, `a`) blir til inline-koder
  i en blokk, slik at formatering og lenker bevares i oversettelsen.

  Leseren har innebygde standardregler for hvilke elementer som inneholder
  innhold, hvilke som er inline-elementer, og hvilke attributter (som `alt` og
  `title`) som trekkes ut. Med tilordningene `elements` og `attributes` kan du
  overstyre eller utvide reglene per element og attributt, tilsvarende
  konfigurasjonen for okf_html-broen. Parserens håndtering av blanktegn er
  samlet under `parser`.
parameters:
  parser.preserve_whitespace:
    description: Bevar blanktegn i uttrukket tekst i stedet for å slå dem sammen.
    help: |
      Når dette er aktivert, bevares de opprinnelige blanktegnene i tekstinnholdet.
      Som standard slås blanktegn sammen, slik nettlesere gjengir HTML.
      Gruppert under `parser`-objektet i konfigurasjonen.
    values: "`true` / `false` (standard `false`)"
  elements:
    description: Uttrekksregler per element.
    help: |
      En tilordning fra elementnavn til et regelobjekt som styrer hvordan elementet
      behandles. En regel kan inneholde `rule_types` (`TEXTUNIT`, `INLINE`,
      `EXCLUDE`, `INCLUDE`, `ATTRIBUTES_ONLY`, `PRESERVE_WHITESPACE`, `GROUP`),
      en `conditions`-trippel, `id_attributes` og en `translatable_attributes`-
      tilordning. Disse overstyrer eller utvider den innebygde elementhåndteringen.
    values: "Tilordning fra elementnavn → regelobjekt (standard: innebygde regler)"
    examples:
      - "`{ summary: { rule_types: [TEXTUNIT] } }` trekker ut teksten i `summary`-elementer"
  attributes:
    description: Uttrekksregler per attributt.
    help: |
      En tilordning fra attributtnavn til et regelobjekt. En regel kan inneholde
      `rule_types` (`ATTRIBUTE_TRANS`, `ATTRIBUTE_ID`, `ATTRIBUTE_WRITABLE`,
      `ATTRIBUTE_READONLY`), en avgrensning til elementer via `only_these_elements`
      eller `all_elements_except` og en `conditions`-trippel.
    values: "Tilordning av attributtnavn → regelobjekt (standard: innebygde regler)"
    examples:
      - "`{ alt: { rule_types: [ATTRIBUTE_TRANS] } }` trekker ut alle `alt`-verdier"
  use_code_finder:
    description: Aktiver gjenkjenning av inline-kode basert på regulære uttrykk.
    help: |
      Aktiverer gjenkjenning av inline-koder (plassholdere, variabler og tagger)
      i uttrukket tekst med regulære uttrykk, i tillegg til inline-elementene i HTML
      som allerede gjenkjennes. Mønstrene angis via `code_finder_rules`.
    values: "`true` / `false` (standard `false`)"
  code_finder_rules:
    description: Regulære uttrykk som gjenkjenner inline-koder i tekst.
    help: |
      En liste med regulære uttrykk. Tekst som samsvarer med et av uttrykkene,
      behandles som inline-kode i stedet for oversettbare ord. Brukes bare når
      `use_code_finder` er aktivert.
    values: Liste med regulære uttrykk (tom som standard)
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at disse mønstrene skal gjelde
limitations:
  - Leseren bruker innebygde standardregler for elementer og attributter. Tilordningene `elements` og `attributes` justerer reglene i stedet for å erstatte hele regelsettet.
processingNotes:
  - Inline-elementer blir til inline-koder i blokker. Blokknivåelementer danner den omkringliggende strukturen.
  - Oversettbare attributter (som `alt` og `title`) trekkes ut som egne blokker.
examples:
  - title: Bevar blanktegn
    description: Bevar betydningsfulle blanktegn i tekstnoder i stedet for å slå dem sammen.
    config: |
      parser:
        preserve_whitespace: true
  - title: Gjør et egendefinert element oversettbart
    description: Trekk ut teksten fra et egendefinert <summary>-element.
    config: |
      elements:
        summary:
          rule_types:
            - TEXTUNIT
