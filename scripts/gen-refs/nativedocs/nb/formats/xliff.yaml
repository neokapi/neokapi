# Native reference doc for the built-in `xliff` format.
# Schema source: core/formats/xliff/config.go (Config).
# Behaviour grounded in core/formats/xliff/reader.go, writer.go and spec.yaml,
# mirroring Okapi's XLIFF filter (okf_xliff) and the OASIS XLIFF 1.2 standard.
displayName: XLIFF 1.2
description: Les og skriv OASIS XLIFF 1.2 tospråklige utvekslingsdokumenter.
overview: |
  XLIFF 1.2 er OASIS XML-utvekslingsstandarden for tospråklig innhold,
  utvekslingsformatet som oversettelsesverktøy og TMS-plattformer bruker
  til å flytte innhold mellom uttrekk og oversettelse. Et dokument grupperer
  `<trans-unit>`-elementer under `<file>`-beholdere, der hver enhet inneholder en
  `<source>` og en valgfri `<target>`, med inline-markup representert
  gjennom parvise (`bpt`/`ept`, `g`) eller frittstående (`x`, `ph`) kode-
  elementer og segmentering uttrykt via `<seg-source>` og
  `<mrk mtype="seg">`.

  Leseren sender ut én blokk per `<trans-unit>` med tekst, og bærer
  kilden, eventuell eksisterende målverdi, segmentering, alt-trans-treff og
  enhetens metadata. Skriveren oppdaterer mål og som standard
  `state`-attributtet på målet, slik at en fil etter rundtur gjenspeiler
  oversettelsesfremdriften. Dette speiler Okapis XLIFF 1.2-filter.
parameters:
  preserveSpaceByDefault:
    description: Behandle alt innhold som `xml:space="preserve"` med mindre annet er angitt.
    help: |
      Når aktivert, behandles hvert element som blanktegn-bevarende
      uavhengig av et eksplisitt `xml:space`-attributt. Når deaktivert (standard),
      respekterer leseren `xml:space` per element, og komprimerer
      ubetydelige blanktegn andre steder.
    values: "`true` / `false` (standard `false`)"
  includeExtensions:
    description: Inkluder ikke-standard navnerom-utvidelse-elementer i trukket ut innhold.
    help: |
      Når aktivert (standard), beholdes elementer fra ikke-XLIFF-navnerom (leverandør- eller verktøyutvidelser) som finnes i innhold, i den uttrukne blokken. Når deaktivert, fjernes slike utvidelseselementer fra det uttrukne innholdet.
    values: "`true` / `false` (standard `true`)"
  includeIts:
    description: Inkluder ITS-oppmerkingen (Internationalization Tag Set) i uttrukket innhold.
    help: |
      Når aktivert (standard), bevares ITS-markup i XLIFF (f.eks.
      oversett, locale-filter eller terminologiannotering)
      i det trukket ut innholdet. Når deaktivert, utelates ITS-markup.
    values: "`true` / `false` (standard `true`)"
  ignoreInputSegmentation:
    description: "Behandle hele kildeteksten som ett segment, og ignorer inndata-segmentering."
    help: |
      Når aktivert, ignoreres `<seg-source>`/`<mrk mtype="seg">` segmentering i
      inndataene, og hele `<source>` behandles som ett enkelt
      segment. Når deaktivert (standard), respekteres eksisterende segmentering
      og hvert `<mrk>`-segment blir sitt eget segment i
      blokken.
    values: "`true` / `false` (standard `false`)"
  fallbackToID:
    description: Bruk trans-unit-id-en som blokknavn når ingen resname er til stede.
    help: |
      Når aktivert, bruker en `<trans-unit>` uten `resname`-attributt sitt `id`-attributt som blokknavn, slik at blokken likevel har en menneskelig meningsfull identifikator. Når deaktivert (standard), forblir blokknavnet tomt når `resname` mangler.
    values: "`true` / `false` (standard `false`)"
  forceUniqueIds:
    description: Skriv om trans-unit-id-er for å håndheve unikhet på tvers av filen.
    help: |
      Når aktivert, skrives dupliserte `<trans-unit>` `id`-verdier om slik at
      hver id er unik i hele filen. Når deaktivert (standard), beholdes id-ene
      slik de er. Aktiver dette for inndata der id-ene ikke er garantert unike
      og der nedstrøms verktøy krever unikhet.
    values: "`true` / `false` (standard `false`)"
  useTranslationTargetState:
    description: Oppdater `state`-attributtet for målet når oversatt XLIFF skrives.
    help: |
      Når aktivert (standard), setter skriveren `state`-attributtet på `<target>`-elementer for å gjenspeile oversettelsesstatus, ved hjelp av `targetStateValue`. Når deaktivert, forblir den eksisterende `state` uendret.
    values: "`true` / `false` (standard `true`)"
  targetStateValue:
    description: Tilstandsverdien som skrives til målelementer.
    help: |
      XLIFF-tilstandsverdien som brukes på `<target>`-elementer når
      `useTranslationTargetState` er aktivert. Standard er
      `needs-translation`. Sett den til en standard XLIFF 1.2-tilstand som
      `translated`, `needs-review-translation` eller `final` for å samsvare med
      arbeidsflyten din.
    values: "Streng (standard `needs-translation`)"
    examples:
      - "`translated`"
      - "`final`"
    dependsOn:
      - property: useTranslationTargetState
        condition: gjelder kun når oppdatering av måltilstand er aktivert
  editAltTrans:
    description: Tillat redigering av eksisterende alt-trans-elementer.
    help: |
      Når aktivert, kan eksisterende `<alt-trans>`-elementer (alternativ oversettelse / treff) endres ved skriving. Når deaktivert (standard), bevares de uendret.
    values: "`true` / `false` (standard `false`)"
  addAltTrans:
    description: Tillat at nye alt-trans-elementer legges til.
    help: |
      Når aktivert, kan nye `<alt-trans>`-elementer (for eksempel maskin- eller
      memory-treff) skrives inn i enheter. Når deaktivert (standard),
      legges ingen nye alt-trans-elementer til.
    values: "`true` / `false` (standard `false`)"
  addTargetLanguage:
    description: Legg til target-language-attributtet i file-elementer hvis det mangler.
    help: |
      Når aktivert (standard), legges `target-language`-attributtet til
      `<file>`-elementer som mangler ett, ved hjelp av pipeline-målspråkkoden.
      Når deaktivert, beholdes attributtet slik det ble funnet i inndataene.
    values: "`true` / `false` (standard `true`)"
  overrideTargetLanguage:
    description: Erstatt målspråk-attributtet med pipeline-målspråkkoden.
    help: |
      Når aktivert, overskrives `target-language`-attributtet i utdataene med pipelinens målspråkkode, selv om inndataene allerede hadde erklært en. Når deaktivert (standard), bevares en eksisterende `target-language`.
    values: "`true` / `false` (standard `false`)"
  allowEmptyTargets:
    description: Tillat at målelementer med tomt innhold skrives.
    help: |
      Når aktivert, kan `<target>`-elementer skrives med tomt innhold.
      Når deaktivert (standard), emitteres ikke tomme mål. Aktiver det
      når nedstrøms verktøy forventer at en `<target>`-plassholder skal eksistere
      før oversettelse.
    values: "`true` / `false` (standard `false`)"
  alwaysAddTargets:
    description: Legg til målelementer for enspråklig XLIFF som ikke har noen.
    help: |
      Når aktivert, legges `<target>`-elementer til for enspråklige XLIFF-inndataene som bare inneholder kilder. Når deaktivert (standard), syntetiseres ingen mål for kildebaserte filer.
    values: "`true` / `false` (standard `false`)"
  useCodeFinder:
    description: Oppdag inline-koder i innhold ved hjelp av regulære uttrykk.
    help: |
      Aktiverer regex-basert deteksjon av inline-koder i trukket ut tekst,
      ved hjelp av mønstrene i `codeFinderRules`. Dette supplerer de innebygde
      XLIFF-inline-elementene. Når deaktivert (standard), gjenkjennes kun XLIFF-
      inline-elementene.
    values: "`true` / `false` (standard `false`)"
  codeFinderRules:
    description: Regulære uttrykksmønstre som samsvarer med inline-kode i innhold.
    help: |
      En liste over regulære uttrykk; hvert treff i trukket ut tekst er
      beskyttet som en inline-kode i stedet for å bli oversatt. Har kun effekt
      når `useCodeFinder` er aktivert; ugyldige mønstre hoppes over.
    values: "Array av strenger med regulære uttrykk"
    examples:
      - "`%[0-9]*[sd]` beskytter `printf`-formatspesifikatorer"
    dependsOn:
      - property: useCodeFinder
        condition: må være aktivert for at reglene skal tre i kraft
processingNotes:
  - Én blokk emitteres per oversettbar `<trans-unit>`; enheter merket `translate="no"` sendes gjennom som ikke-oversettbare.
  - "Inline-markup (`bpt`/`ept`, `g`, `x`, `ph`) og `<seg-source>`/`<mrk mtype=\"seg\">` segmentering leses inn i blokken."
examples:
  - title: Merk måltekster som oversatt
    description: Skriv en endelig måltilstand i stedet for standard needs-translation.
    config: |
      useTranslationTargetState: true
      targetStateValue: translated
  - title: Flat ut inndata-segmentering
    description: "Behandle hver kilde som ett segment, og ignorer seg-source-markører."
    config: |
      ignoreInputSegmentation: true
wikiUrl: https://docs.oasis-open.org/xliff/v1.2/os/xliff-core.html
