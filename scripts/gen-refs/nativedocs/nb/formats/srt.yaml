# Native reference doc for the built-in `srt` format.
# Source: core/formats/srt/{reader.go,writer.go,config.go,schema.go}.
# Mirrors Okapi's SubRip filter (okf_subrip). No configurable parameters.
description: "Les og skriv undertekstfiler i SubRip-format (.srt), og trekk ut teksten i hver undertekstoppføring for oversettelse."
overview: |
  SubRip (`.srt`) er et linjebasert undertekstformat som brukes av de fleste
  videoavspillere. En fil består av en rekke undertekstoppføringer. Hver oppføring
  har et sekvensnummer, et tidskodeintervall (`00:00:01,000 --> 00:00:04,000`)
  og én eller flere linjer med undertekst. Oppføringene skilles av en tom linje.

  Leseren trekker ut teksten i hver undertekstoppføring som en oversettbar blokk
  og beholder sekvensnummeret og tidskoden som blokkegenskaper, slik at
  skriveren kan rekonstruere oppføringen. Sekvensnumre, tidskoder og tomme
  linjer som skiller oppføringene, er struktur som ikke skal oversettes. De lagres
  i skjelettet og bevares uendret ved tilbakeføring. Linjeskift i undertekstoppføringer
  med flere linjer bevares i blokkens tekst, slik at linjedelingen opprettholdes.
limitations:
  - Tidskoder bevares uendret og justeres ikke. Justering av tidskodene for en lengre eller kortere oversettelse støttes ikke.
  - "SubRip-formateringstagger i undertekstoppføringer (for eksempel `<i>…</i>` eller `{\\an8}`) beholdes som en del av blokkteksten og parses ikke til innebygde koder."
processingNotes:
  - "Én oversettbar blokk per undertekstoppføring. Sekvensnummeret og tidskoden følger med som blokkegenskaper (`sequence`, `timecode`)."
  - "Når et skjelettlager er aktivt, lagres sekvensnumre, tidskoder og skilletegn som skjeletttekst. Det gir byte-identisk tilbakeføring, inkludert de opprinnelige linjeavslutningene LF / CRLF."
examples:
  - title: Oversett undertekster
    description: |
      SubRip krever ingen konfigurasjon. Angi formatet for en samling
      for å trekke ut teksten i hver undertekstoppføring. Nummereringen og tidskodene
      bevares automatisk.
    config: |
      format:
        name: srt
wikiUrl: https://en.wikipedia.org/wiki/SubRip
