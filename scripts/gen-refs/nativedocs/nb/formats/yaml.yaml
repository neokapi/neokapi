# Native reference doc for the built-in `yaml` format.
# Schema source: core/formats/yaml/config.go (Config) + schema.go.
# Mirrors the Okapi okf_yaml filter.
description: "Ekstraher og sett inn igjen oversettbare skalarverdier fra YAML-filer, med filtrering av nøkkelstier og underfiltre."
overview: |
  Med **YAML**-formatet kan du lese YAML-dokumenter, trekke ut skalare
  strengverdier som oversettbare blokker og skrive oversettelsene tilbake
  med struktur, kommentarer og rekkefølge bevart. Formatet passer for Rails-språkfiler,
  applikasjonskonfigurasjon og andre nøkkel/verdi-kataloger i YAML.

  Som standard trekkes bare strengskalarer ut. Du kan også trekke ut
  skalarer som ikke er strenger, begrense uttrekket til bestemte nøkkelstier med
  glob-mønstre, finne inline-koder og sende verdier som inneholder
  innebygd markering (som HTML), til et underfilter.
parameters:
  extract_non_strings:
    description: Ekstraher skalarverdier som ikke er strenger.
    help: |
      Når dette er aktivert, ekstraheres også skalarverdier som ikke er strenger
      (boolske verdier, tall og nullverdier), som oversettbare blokker. Som standard
      ekstraheres bare strengverdier.
    values: "`true` / `false` (standard: `false`)"
  key_path_patterns:
    description: Glob-mønstre som velger hvilke nøkkelstier som ekstraheres.
    help: |
      En liste med glob-mønstre for nøkkelstier. Når listen ikke er tom,
      ekstraheres bare nøkler som samsvarer med ett av mønstrene. `*` samsvarer
      med ett nøkkelsegment, mens `**` samsvarer med et vilkårlig antall segmenter på ethvert nivå.
    values: "Liste med glob-mønstre (tom som standard, alle nøkler ekstraheres)"
    examples:
      - "`en.**` ekstraherer bare nøkler som ligger under toppnivånøkkelen `en`"
      - "`*.title` trekker ut nøkkelen `title` rett under enhver nøkkel på øverste nivå"
  subfilter:
    description: Underfilterformat som brukes på skalarverdier.
    help: |
      Navnet på et format som brukes som underfilter (for eksempel `html`) til å tolke
      innebygd oppmerking i ekstraherte skalarverdier. Oppmerkingen gjøres da
      tilgjengelig som innebygde koder i stedet for å bli oversatt som ren tekst.
    values: Formatnavn (tomt som standard)
    examples:
      - "`html` tolker HTML i skalarverdier i YAML"
  use_code_finder:
    description: Aktiver deteksjon av innebygde koder med regulære uttrykk.
    help: |
      Aktiverer deteksjon av innebygde koder i strengverdier med regulære uttrykk.
      Mønstrene angis via `code_finder_rules`.
    values: "`true` / `false` (standardverdi `false`)"
  code_finder_rules:
    description: Regulære uttrykk som samsvarer med inline-koder i verdier.
    help: |
      En liste med regulære uttrykk. Tekst som samsvarer med ett av dem,
      behandles som en innebygd kode i stedet for oversettbare ord. Brukes bare når
      `use_code_finder` er aktivert.
    values: Array med regulære uttrykk (tom som standard)
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at disse mønstrene skal gjelde
limitations:
  - Bare skalarverdier kan oversettes. Nøkler og sekvensstruktur utgjør den ikke-oversettbare strukturen.
processingNotes:
  - "Dokumentstruktur, nøkkelrekkefølge og kommentarer bevares gjennom lesing og skriving."
examples:
  - title: Ekstraher ett enkelt språkinnstillingstre
    description: Oversett bare nøklene under en-grenen i en språkfil i Rails-format.
    config: |
      key_path_patterns:
        - "en.**"
  - title: HTML i verdier
    description: Tolk HTML-oppmerking i skalarverdier i YAML.
    config: |
      subfilter: html
