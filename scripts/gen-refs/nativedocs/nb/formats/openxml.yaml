# Native reference doc for the built-in `openxml` format.
# Schema source: core/formats/openxml/config.go (Config).
# Behaviour grounded in core/formats/openxml/reader.go, writer.go and spec.yaml,
# mirroring Okapi's OpenXML filter (okf_openxml) and ECMA-376 / ISO/IEC 29500.
displayName: OpenXML (Office)
description: "Trekk ut og skriv tekst fra Office Open XML-filer for Word, Excel og PowerPoint."
overview: |
  OpenXML-formatet håndterer Microsoft Office Open XML-dokumenter: Word
  (`.docx`), Excel (`.xlsx`) og PowerPoint (`.pptx`). Alle tre bruker en
  ZIP-pakke med XML, så ett filter håndterer dem og registrerer varianten
  automatisk ut fra pakkeinnholdet, i henhold til ECMA-376 / ISO/IEC 29500.

  Uttrekket er selektivt: Som standard trekker leseren ut hovedteksten
  og delene som normalt er synlige for brukeren (dokumentegenskaper,
  topp- og bunntekst, fotnoter, kommentarer og hyperkoblingstekst i Word,
  delte strenger i Excel og foredragsnotater i PowerPoint). Skjult,
  strukturelt eller sjelden oversatt innhold utelates med mindre du velger
  å ta det med. Stil- og fargefiltre lar deg inkludere eller utelate
  tekstsekvenser etter avsnitts- eller tegnstil eller uthevingsfarge. Dette
  gjenspeiler Okapis OpenXML-filter, inkludert at sporede endringer som
  standard godtas før uttrekk.
parameters:
  # ── Word options ──────────────────────────────────────────────────
  translate_doc_properties:
    description: "Trekk ut dokumentegenskaper (tittel, emne og nøkkelord)."
    help: |
      Når dette er aktivert (standard), trekkes metadataene i `docProps/core.xml`
      (tittel, emne og nøkkelord) ut for oversettelse. Deaktiver dette
      for å la dokumentegenskapene være uendret.
    values: "`true` / `false` (standard: `true`)"
  translate_hidden_text:
    description: Trekk ut tekst som er merket med egenskapen for skjult tekst (vanish).
    help: |
      Når dette er aktivert, trekkes tekstsekvenser med egenskapen `w:vanish` (skjult)
      ut. Når det er deaktivert (standard), hoppes skjult tekst over.
    values: "`true` / `false` (standard: `false`)"
  translate_headers_footers:
    description: Trekk ut tekst fra topp- og bunntekster.
    help: |
      Når dette er aktivert (standard), trekkes tekst i topp- og bunntekster
      i Word-dokumenter ut. Deaktiver dette for å la topp- og bunntekster stå uoversatt.
    values: "`true` / `false` (standard: `true`)"
  translate_footnotes:
    description: Trekk ut fotnoter og sluttnoter.
    help: |
      Når dette er aktivert (standard), trekkes teksten i fotnoter og sluttnoter i Word-dokumenter ut. Deaktiver det for å hoppe over dem.
    values: "`true` / `false` (standard: `true`)"
  translate_comments:
    description: Hent ut kommentartekst fra Word-dokumenter.
    help: |
      Når dette er aktivert (standard), trekkes teksten i gjennomgangskommentarer i Word ut. Dette samsvarer med Okapi, som behandler `word/comments.xml` som en del med formatert tekst på linje med hoveddokumentet. Deaktiver det for å la kommentarene stå uoversatt.
    values: "`true` / `false` (standard: `true`)"
  translate_hyperlinks:
    description: Trekk ut visningsteksten for hyperkoblinger.
    help: |
      Når dette er aktivert (standard), hentes den synlige ankerteksten i hyperkoblinger
      ut for oversettelse. Deaktiver det for å la hyperkoblingsteksten
      forbli uendret. (Den bufrede visningsteksten i HYPERLINK-felt styres
      separat av `complex_field_definitions_to_extract`.)
    values: "`true` / `false` (standard: `true`)"
  automatically_accept_revisions:
    description: Godta sporede endringer før teksten trekkes ut.
    help: |
      Når dette er aktivert (som standard, i samsvar med Okapi), godtas
      sporede endringer før uttrekket: Innsatte tekstløp beholdes, og slettede
      tekstløp utelates. Tabellrader merket med `<w:trPr><w:del/>` (ECMA-376
      §17.13.5.13) fjernes helt, og rader merket med
      `<w:trPr><w:ins/>` (§17.13.5.16) beholdes. Deaktiver dette for å trekke ut
      dokumentet slik det ble skrevet, med revisjonsmerkingen intakt.
    values: "`true` / `false` (standard `true`)"
  # ── Excel options ─────────────────────────────────────────────────
  translate_shared_strings:
    description: Hent ut delte strenger fra Excel-arbeidsbøker.
    help: |
      Når dette er aktivert (standard), trekkes celleteksten i arbeidsbokens tabell over delte strenger ut. Det er her mesteparten av teksten i Excel ligger. Deaktiver det for å hoppe over celleinnholdet.
    values: "`true` / `false` (standard: `true`)"
  translate_sheet_names:
    description: Trekk ut navn på regnearkfaner.
    help: |
      Når dette er aktivert, trekkes regnearknavn ut for oversettelse. Når det
      er deaktivert (standard), beholdes navnene uendret.
    values: "`true` / `false` (standard `false`)"
  excluded_sheets:
    description: Navn på regneark som skal utelates fra uttrekket.
    help: |
      En liste over regnearknavn der alt innhold hoppes over. Bruk den til å
      utelate referanse- eller dataark fra oversettelsen.
    values: "Array med regnearknavn som strenger"
    examples:
      - "`[\"Data\", \"Lookups\"]`"
  excluded_columns:
    description: Kolonnebokstaver som skal utelates fra uttrekket.
    help: |
      En liste over kolonnebokstaver der cellene hoppes over. Bruk den for å la
      kolonner med identifikatorer eller tall forbli uoversatt.
    values: "Liste med kolonnebokstaver som strenger (f.eks. `A`, `C`, `AA`)"
    examples:
      - "`[\"A\", \"C\"]`"
  # ── PowerPoint options ────────────────────────────────────────────
  translate_slide_notes:
    description: Hent ut foredragsnotater fra PowerPoint-presentasjoner.
    help: |
      Når dette er aktivert (standard), hentes teksten i lysbildenes
      foredragsnotater ut. Deaktiver det for å la notatene forbli uoversatt.
    values: "`true` / `false` (standard: `true`)"
  translate_slide_masters:
    description: Hent ut tekst fra lysbildemaler.
    help: |
      Når dette er aktivert, trekkes tekst på lysbildemaler og oppsett ut.
      Når det er deaktivert (standard), hoppes tekst på lysbildemaler over.
    values: "`true` / `false` (standard `false`)"
  translate_hidden_slides:
    description: Trekk ut innhold fra skjulte lysbilder.
    help: |
      Når dette er aktivert, trekkes innholdet i lysbilder som er merket som skjult, ut. Når det er
      deaktivert (standard), hoppes skjulte lysbilder over.
    values: "`true` / `false` (standard: `false`)"
  translate_charts:
    description: Trekk ut tekst fra innebygde diagrammer.
    help: |
      Når dette er aktivert, trekkes tekststrenger i innebygde diagrammer
      (titler, akseetiketter og dataetiketter) ut. Når det er deaktivert
      (som standard), hoppes diagramtekst over.
    values: "`true` / `false` (standard `false`)"
  translate_diagrams:
    description: Trekk ut tekst fra SmartArt-diagrammer.
    help: |
      Når dette er aktivert, trekkes teksten i SmartArt-diagramdata ut.
      Når det er deaktivert (standard), utelates diagramteksten.
    values: "`true` / `false` (standard: `false`)"
  included_slides:
    description: Begrens uthentingen til bestemte lysbildenumre.
    help: |
      Når listen ikke er tom, trekkes bare de oppførte lysbildene ut
      (nummerert fra 1). Alle andre lysbilder hoppes over. La listen være tom
      (standard) for å trekke ut alle lysbilder.
    values: "Liste over lysbildenumre, der nummereringen starter på 1 (standard: alle lysbilder)"
    examples:
      - "`[1, 2, 5]`"
  # ── General ───────────────────────────────────────────────────────
  aggressive_cleanup:
    description: Fjern revisjons-ID-er og overflødige korrekturdata før tekstløp slås sammen.
    help: |
      Når dette er aktivert (standard), fjernes blant annet revisjons-ID-er (`w:rsid*`),
      markører for korrekturfeil og sideskift fra siste gjengivelse
      før tilstøtende tekstsekvenser slås sammen. Det gir færre innebygde
      koder. Deaktiver innstillingen for å beholde disse markeringene.
    values: "`true` / `false` (standard `true`)"
  tab_as_character:
    description: Behandle tabulatorelementer som tabulatortegn i stedet for plassholdersegmenter.
    help: |
      Når dette er aktivert, trekkes `<w:tab/>`-elementer ut som faktiske
      tabulatortegn i teksten. Når det er deaktivert (som standard),
      representeres de som plassholderområder i teksten.
    values: "`true` / `false` (standard `false`)"
  ignore_soft_hyphen_tag:
    description: Ignorer tagger for myk bindestrek i dokumentet.
    help: |
      Når dette er aktivert, ignoreres tagger for myk bindestrek ved uttrekk. Når det er
      deaktivert (standard), beholdes de.
    values: "`true` / `false` (standard: `false`)"
  replace_no_break_hyphen_tag:
    description: Erstatt tagger for ikke-brytende bindestrek med tegnet for ikke-brytende bindestrek.
    help: |
      Når dette er aktivert, erstattes tagger for ikke-brytende bindestrek med
      selve tegnet for ikke-brytende bindestrek i teksten. Når det er deaktivert
      (standard), beholdes taggen.
    values: "`true` / `false` (standard: `false`)"
  # ── Style & colour filtering ──────────────────────────────────────
  exclude_colors:
    description: Skriftfarger som skal utelates fra uttrekket.
    help: |
      En liste over skriftfarger (heksadesimal RGB) som gjør at tekstsekvenser utelates.
      Bruk den for å la tekst i en bestemt farge, for eksempel interne merknader,
      stå uoversatt.
    values: "Liste med heksadesimale RGB-strenger (f.eks. `FF0000` for rødt)"
    examples:
      - "`[\"FF0000\"]`"
  exclude_highlight_colors:
    description: Uthevingsfarger som skal utelates fra uttrekket.
    help: |
      En liste over uthevingsfarger der tekstsekvenser med disse fargene hoppes over.
      Bruk den til å utelate uthevet tekst fra oversettelsen.
    values: "Liste med navn på merkefarger (f.eks. `yellow`, `red`)"
    examples:
      - "`[\"yellow\"]`"
  include_highlight_colors:
    description: Begrens uttrekket til tekst med disse uthevingsfargene.
    help: |
      Når listen ikke er tom, trekkes bare tekstløp med en av de oppførte uthevingsfargene ut. All annen tekst hoppes over. La listen være tom (standard) for å trekke ut tekst uavhengig av uthevingsfarge.
    values: "Array med navn på uthevingsfarger (standard: ingen begrensning)"
    examples:
      - "`[\"green\"]`"
  exclude_styles:
    description: Avsnitts- eller tegnstiler som skal utelates fra uttrekket.
    help: |
      En liste over navn på avsnitts- eller tegnstiler der teksten utelates.
      Bruk den for å la tekst med kode-, bildetekst- eller referansestiler stå uoversatt.
    values: "Tabell med stilnavnstrenger"
    examples:
      - "`[\"Code\", \"Caption\"]`"
  include_styles:
    description: Begrens uttrekket til tekst med disse stilene.
    help: |
      Når listen ikke er tom, trekkes bare tekst med en av de oppførte stilene ut.
      All annen tekst hoppes over. La listen være tom (standard) for å trekke ut
      tekst uavhengig av stil.
    values: "Tabell med stilnavnstrenger (standard: ingen begrensning)"
    examples:
      - "`[\"Heading 1\", \"Normal\"]`"
  # ── Inline codes ──────────────────────────────────────────────────
  use_code_finder:
    description: Finn innebygde koder i tekst ved hjelp av regulære uttrykk.
    help: |
      Aktiverer mønsterbasert gjenkjenning av innebygde koder (plassholdere,
      variabler og tagger) i tekst som trekkes ut, ved hjelp av mønstrene i
      `code_finder_rules`. Når dette er deaktivert (standard), gjenkjennes ingen
      innebygde koder ved hjelp av mønstre.
    values: "`true` / `false` (standard: `false`)"
  code_finder_rules:
    description: Mønstre for regulære uttrykk som samsvarer med innfelte koder i tekst.
    help: |
      En liste over regulære uttrykk. Hvert treff i uthentet tekst beskyttes
      som en innebygd kode i stedet for å bli oversatt. Trer bare i kraft
      når `use_code_finder` er aktivert.
    values: "Liste med regulære uttrykk som strenger"
    examples:
      - "`\\{[0-9]+\\}` beskytter nummererte plassholdere som `{0}`"
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at reglene skal tre i kraft
  # ── Advanced ──────────────────────────────────────────────────────
  complex_field_definitions_to_extract:
    description: Feltinstruksjonsprefikser der den bufrede visningsteksten hentes ut.
    help: |
      En liste over instruksjonsprefikser for kompleksfelt der den bufrede visningsteksten
      hentes ut for oversettelse. Standardverdien er `["HYPERLINK"]`,
      som i Okapi. Uten dette prefikset ville den synlige ankerteksten i HYPERLINK-felt
      forbli på kildespråket etter behandling. Legg til prefikser som
      `REF` for å oversette visningsteksten i andre felttyper.
    values: "Liste med feltprefiksstrenger (standard `[\"HYPERLINK\"]`)"
    examples:
      - "`[\"HYPERLINK\", \"REF\"]`"
  font_mappings:
    description: Knytt skriftnavn til grupper av skriftsystemer.
    help: |
      En tilordning fra skriftnavn til skriftgruppe, som brukes til å knytte
      tekstsekvenser til et skriftsystem for videre behandling. Tom som standard.
    values: "Objekt som tilordner skriftnavn til skriftgruppekoder"
    examples:
      - "`{\"MS Gothic\": \"ja\"}`"
  extract_run_fonts_info:
    description: Legg til skriftmetadata som annotasjoner på blokker.
    help: |
      Når dette er aktivert, legges skriftinformasjon for hver tekstsekvens til
      den uttrukne blokken som annotasjoner. Når det er deaktivert (standard),
      genereres ingen skriftmetadata.
    values: "`true` / `false` (standard: `false`)"
  replace_line_separator:
    description: Erstatt Unicode-linjeskilletegnet (U+2028) i utdataene.
    help: |
      Når dette er aktivert, erstattes Unicode-linjeskilletegnet (U+2028) i utdataene med `line_separator_replacement`. Når det er deaktivert (standard), beholdes tegnet som det er.
    values: "`true` / `false` (standard: `false`)"
  line_separator_replacement:
    description: Erstatningsstrengen for linjeskilletegn.
    help: |
      Strengen som erstatter Unicode-linjeskilletegnet når `replace_line_separator` er aktivert. Standardverdien er et linjeskift (`\n`).
    values: "Streng (standard `\\n`)"
    dependsOn:
      - property: replace_line_separator
        condition: brukes bare når erstatning av linjeskilletegn er aktivert
limitations:
  - "Ett filter dekker Word, Excel og PowerPoint. Noen alternativer gjelder bare for den aktuelle varianten. Alternativene for lysbilder påvirker for eksempel bare PowerPoint."
processingNotes:
  - Dokumentvarianten (Word / Excel / PowerPoint) registreres automatisk ut fra innholdet i pakken.
  - "Skriveren bevarer som standard egenskapene for tekstløpene fra kilden direkte i teksten, i stedet for å skrive dem om til genererte stiler."
examples:
  - title: Oversett alt i et Word-dokument
    description: "Ta med kommentarer, skjult tekst og lysbildemaler, som er utelatt som standard."
    config: |
      translate_hidden_text: true
      translate_comments: true
  - title: Begrens uttrekket fra en Excel-arbeidsbok til utvalgte ark
    description: Hopp over data- og oppslagsark ved uttrekk.
    config: |
      excluded_sheets:
        - Data
        - Lookups
  - title: Trekk ut bestemte lysbilder fra PowerPoint
    description: "Oversett lysbilde 1, 2 og 5, og hopp over resten."
    config: |
      included_slides:
        - 1
        - 2
        - 5
wikiUrl: https://www.ecma-international.org/publications-and-standards/standards/ecma-376/
