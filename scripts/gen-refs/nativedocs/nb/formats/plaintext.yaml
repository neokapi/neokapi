# Native reference doc for the built-in `plaintext` format.
# Schema source: core/formats/plaintext/config.go (Config).
# Behaviour grounded in core/formats/plaintext/reader.go and spec.yaml,
# mirroring Okapi's BasePlainTextFilter (okf_plaintext).
description: "Trekk ut tekst fra vanlige `.txt`-filer, én blokk per linje eller per avsnitt."
overview: |
  Klartekstformatet leser generiske `.txt`-dokumenter og sender ut tekstinnholdet som blokker. Det er reservevalget for filer uten markup eller struktur: versjonsnotater, instruksjoner, ordlister eller annen fritekst som trenger oversettelse.

  Som standard deler leseren inn etter linje: hver ikke-tom linje blir én blokk, og tomme linjer samt originale linjeavslutninger (LF, CRLF eller CR) bevares som skjelett slik at dokumentet går i rundtur etter fletting. Avsnittsmodus grupperer i stedet linjer adskilt av tomme linjer til én enkelt blokk, noe som passer for prosa der setninger strekker seg over flere ombrutte linjer. Dette speiler Okapis klartekstfilter.
parameters:
  segmentByLine:
    description: "Behandle hver linje som en blokk, i stedet for hvert avsnitt."
    help: |
      Når dette er aktivert (standard), blir hver ikke-tom linje i inndata sin egen blokk. Tomme linjer og linjeavslutninger beholdes som skjelett og trekkes ikke ut.

      Når dette er deaktivert, grupperer leseren påfølgende linjer til avsnitt, og en blokk avsluttes ved en tom linje. Bruk avsnittsmodus for prosa som brytes over flere fysiske linjer, der en setning bør holdes i én blokk i stedet for å deles per linje.
    values: "`true` / `false` (standard `true`)"
processingNotes:
  - "LF, CRLF og bare CR gjenkjennes alle som linjeavslutninger og bevares."
  - Tomme linjer sender ut en ikke-oversettbar datadel; de trekkes aldri ut som blokker.
examples:
  - title: Avsnittsmodus
    description: Grupper innbrytte linjer til avsnittblokker i stedet for én blokk per linje.
    config: |
      segmentByLine: false
