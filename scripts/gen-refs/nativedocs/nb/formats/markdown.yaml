# Native reference doc for the built-in `markdown` format.
# Schema source: core/formats/markdown/config.go (Config) + schema.go.
# Mirrors the Okapi okf_markdown filter; CommonMark structural model.
description: "Trekk ut og sett inn tekst fra Markdown på nytt, med overskrifter, lister, lenker og kode intakt."
overview: |
  **Markdown**-formatet leser Markdown-dokumenter, trekker ut løpende tekst som
  oversettbare blokker og skriver oversettelsene tilbake med dokumentets
  struktur intakt: overskrifter, lister, fremheving, lenker og kode. Innebygd
  merking (fet og kursiv tekst, lenker og innebygd kode) representeres som
  innebygde koder i hver blokk, slik at syntaksen rundt bevares i oversettelsen.

  Som standard er avsnitt, overskrifter, listeelementer, blokksitater og
  alternativ tekst for bilder oversettbare. Kodeblokker, YAML-frontmatter, rå
  HTML-blokker og nettadresser for lenker og bilder sendes ut som ikke-oversettbar
  struktur. Du kan slå hver av disse kategoriene av eller på og sende innebygd
  HTML til et underfilter.
parameters:
  translate_code_blocks:
    description: Gjør avgrensede og innrykkede kodeblokker oversettbare.
    help: |
      Når dette er aktivert, trekkes avgrensede og innrykkede kodeblokker ut som
      oversettbart innhold. Som standard behandles de som ikke-oversettbare
      data, siden kode sjelden oversettes.
    values: "`true` / `false` (standardverdi `false`)"
  translate_front_matter:
    description: Gjør verdier i YAML-frontmatter oversettbare.
    help: |
      Når dette er aktivert, trekkes verdiene i dokumentets YAML-frontmatter ut
      som oversettbart innhold. Som standard behandles frontmatter som
      ikke-oversettbare data.
    values: "`true` / `false` (standard: `false`)"
  translate_image_alt:
    description: Inkluder alternativ tekst for bilder i oversettbart innhold.
    help: |
      Når dette er aktivert (standard), inkluderes alternativ tekst for bilder i det
      oversettbare innholdet i blokken som inneholder bildet.
    values: "`true` / `false` (standardverdi `true`)"
  translate_urls:
    description: Gjør nettadresser for lenker og bilder oversettbare.
    help: |
      Når dette er aktivert, trekkes URL-er for lenker og bilder ut som oversettbart
      innhold. Dette er nyttig når ressurser eller sider for ulike språk og regioner ligger på ulike stier.
      Som standard blir URL-er ikke oversatt.
    values: "`true` / `false` (standardverdi `false`)"
  translate_block_quotes:
    description: Gjør innholdet i blokksitater oversettbart.
    help: |
      Når dette er aktivert, som er standard, er teksten i blokksitater oversettbar.
      Deaktiver dette for å la sitert materiale stå uoversatt.
    values: "`true` / `false` (standardverdi `true`)"
  translate_html_blocks:
    description: Gjør rå HTML-blokker oversettbare.
    help: |
      Når dette er aktivert, trekkes rå HTML-blokker i Markdown ut som
      oversettbart innhold. Som standard behandles de som ikke-oversettbare
      data. Du kan i stedet sende dem til et underfilter via `subfilter` for
      strukturert HTML-håndtering.
    values: "`true` / `false` (standard: `false`)"
  unescape_backslash_characters:
    description: "Tolk skilletegn som er escape-behandlet med omvendt skråstrek, i kilden."
    help: |
      Når dette er aktivert, tolkes skilletegn som er escapet med omvendt skråstrek
      i kildedokumentet (for eksempel `\*`), som escapede tegn i stedet for
      bokstavelige sekvenser med omvendt skråstrek.
    values: "`true` / `false` (standardverdi `false`)"
  subfilter:
    description: Underfilterformat for HTML-innhold i Markdown.
    help: |
      Navnet på et format som brukes som underfilter (for eksempel `html`) til å
      tolke HTML-innhold i Markdown-dokumentet. Da behandles HTML-merkingen
      strukturelt i stedet for som ufortolket tekst.
    values: Formatnavn (tomt som standard)
    examples:
      - "`html` tolker innebygd HTML med HTML-formatet"
  use_code_finder:
    description: Aktiver regulære uttrykk for å oppdage innebygd kode.
    help: |
      Aktiverer regex-basert gjenkjenning av flere innebygde koder i uttrekket tekst,
      i tillegg til Markdown-merkingen som allerede gjenkjennes. Mønstrene angis
      via `code_finder_rules`.
    values: "`true` / `false` (standard: `false`)"
  code_finder_rules:
    description: Regex-mønstre som samsvarer med innebygde koder i tekst.
    help: |
      En liste med regulære uttrykk. Tekst som samsvarer med ett av uttrykkene,
      behandles som en innebygd kode i stedet for som oversettbare ord. Brukes
      bare når `use_code_finder` er aktivert.
    values: Tabell med regulære uttrykk (tom som standard)
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at disse mønstrene skal gjelde
limitations:
  - "Kodeblokker, frontmatter, rå HTML-blokker og URL-er er som standard ikke oversettbare. Aktiver det tilsvarende alternativet for å trekke dem ut."
processingNotes:
  - "Innebygd merking (utheving, lenker og innebygd kode) blir til innebygde koder i blokkene, slik at merkingen forblir uendret under oversettelsen."
  - "Strukturelementer (kodegjerder, listemarkører og overskriftsprefikser) utgjør strukturen som ikke skal oversettes."
examples:
  - title: Oversett også frontmatter
    description: Ta med verdier fra YAML-frontmatter sammen med brødteksten.
    config: |
      translate_front_matter: true
  - title: Håndter innebygd HTML strukturelt
    description: Send innebygd HTML og HTML-blokker gjennom HTML-underfilteret.
    config: |
      subfilter: html
