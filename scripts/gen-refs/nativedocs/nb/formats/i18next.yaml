# Native reference doc for the built-in `i18next` format.
# Schema source: core/formats/i18next/config.go (Config) + schema.go.
# Built on the json format; selected explicitly (-f i18next), not auto-detected.
description: Ekstraher og oppdater oversettbare verdier i i18next / react-i18next JSON-ressurspakker.
overview: |
  **i18next JSON**-formatet leser i18next / react-i18next-ressurspakker etter konvensjonene til det dominerende web-i18n-biblioteket. Det bygger på JSON-formatet og velges eksplisitt (`-f i18next`), fordi i18next-filer bruker den generiske `.json`-utvidelsen som eies av JSON-formatet og ikke kan skilles fra hverandre automatisk.

  Ut over vanlig JSON-ekstraksjon beskytter det `{{interpolation}}`, `{{var, format}}` og `$t()`-nesting som innebygde koder; annoterer v4 CLDR-flertallssøskennøkler (`key_zero`/`key_one`/…/`key_other`, pluss eldre `key_plural` og `key_0`/`key_1`) med basisnøkkel og flertallskategori; annoterer kontekstnøkler (`key_male`/`key_female`); og navngir blokker etter den fullstendige nøkkelstien i navnerommet. Rundturen er byte-tro.
parameters:
  subfilterHTMLValues:
    description: Send verdier med nøkler som slutter på _html gjennom HTML-delfilteret.
    help: |
      Når dette er aktivert, sendes verdier under nøkler som slutter på `_html` gjennom HTML-delfilteret for taggbeskyttelse. Deaktivert som standard fordi HTML-delfilteret normaliserer rene markup-fragmenter, noe som vil bryte den byte-tro rundturen. Aktiver det bare for arbeidsflyter med taggbeskyttelse.
    values: "`true` / `false` (standard `false`)"
processingNotes:
  - "Flertallssøskennøkler forblir 1:1-blokker (med byte-tro rundtur), men annoteres med basisnøkkel og CLDR-kategori."
  - "`{{interpolation}}` og `$t()`-nesting beskyttes som innebygde koder."
  - Blokknavn bruker den fullstendige nøkkelstien i navnerommet for nestede objekter.
examples:
  - title: Beskytt HTML i _html-verdier
    description: Aktiver HTML-delfilteret for nøkler som slutter på _html.
    config: |
      subfilterHTMLValues: true
