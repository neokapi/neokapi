# Native reference doc for the built-in `po` format.
# Schema source: core/formats/po/config.go (Config).
# Behaviour grounded in core/formats/po/reader.go, writer.go and spec.yaml,
# mirroring Okapi's PO filter (okf_po) and the GNU gettext PO format.
description: "Les og skriv GNU gettext PO- og POT-kataloger, og trekk ut hver melding som en oversettbar blokk."
overview: |
  PO (Portable Object) er GNU gettext-katalogformatet. En `.po`-fil
  kobler `msgid`-kildestrenger med `msgstr`-oversettelser, eventuelt
  disambiguert av `msgctxt`, med flertallsformer via `msgid_plural` og
  `msgstr[N]`, oversetter- og ekstraherte kommentarer, kildereferanser og
  `#, fuzzy`-flagg. `.pot`-maler har samme struktur med tomme
  oversettelser.

  Leseren sender ut én oversettbar blokk per melding: i standard
  tospråklig modus er `msgid` kildeteksten og `msgstr` er
  målet. I enspråklig modus behandles `msgid` utelukkende som en
  identifikator og `msgstr` gir kildeteksten i stedet – formen brukt
  av kataloger som leverer meldings-ID-er fremfor engelske strenger.
  Kommentarer, kontekst og referanser bevares på blokken og skrives
  tilbake. Dette speiler Okapis PO-filter.
parameters:
  bilingual_mode:
    description: Behandle msgid som kildeteksten og msgstr som målet.
    help: |
      Når aktivert (standard), leses hver melding tospråklig: `msgid`
      er kildeteksten og `msgstr` er måloversettelsen. Når deaktivert
      (enspråklig modus), brukes `msgid` kun som identifikator og `msgstr`
      tolkes som kildeteksten – oppsettet brukt av kataloger der meldings-ID-ene
      er symbolske fremfor engelske.
    values: "`true` / `false` (standard `true`)"
  preserve_untranslated:
    description: Send ut blokker for meldinger som har en tom msgstr.
    help: |
      Styrer om meldinger med en tom `msgstr` (uoversatte
      oppføringer) sendes ut som blokker. Når aktivert (standard), beholdes
      de slik at hele katalogen er synlig for oversettelse. Når
      deaktivert, hoppes uoversatte oppføringer over.
    values: "`true` / `false` (standard `true`)"
  wrap_content:
    description: Bryt lange innholdslinjer i utdatakatalogen.
    help: |
      Et skriver-alternativ. Når det er aktivert (standard), brytes lange `msgid`- og
      `msgstr`-verdier over flere linjer ved omtrent 80
      tegn, i tråd med konvensjonell gettext-formatering. Når det er deaktivert,
      skrives hver verdi på én linje. Leseren ignorerer denne
      innstillingen.
    values: "`true` / `false` (standard `true`)"
  allow_empty_output_target:
    description: Skriv et tomt mål når ingen oversettelse er tilgjengelig.
    help: |
      Et skriversidealternativ. Når aktivert, skrives en melding uten
      tilgjengelig oversettelse med en tom `msgstr` i stedet for å bli
      utelatt eller fylt med kilden. Når deaktivert (standard),
      sendes ikke tomme mål ut.
    values: "`true` / `false` (standard `false`)"
  use_code_finder:
    description: Finn innebygde koder i meldingstekst ved hjelp av regulære uttrykk.
    help: |
      Aktiverer regex-basert deteksjon av innebygde koder (plassholdere,
      variabler, formatspesifikasjoner) i meldingsteksten, ved hjelp av
      mønstrene i `code_finder_rules`. Når deaktivert (standard), ekstraheres
      ingens mønsterbaserte innebygde koder.
    values: "`true` / `false` (standard `false`)"
  code_finder_rules:
    description: Regulæruttrykk som matcher innebygde koder i meldingstekst.
    help: |
      En liste med regulæruttrykk; hvert treff i en oversettbar
      blokk beskyttes som en innebygd kode i stedet for å bli oversatt. Brukes til
      å skjerme gettext-plassholdere eller formatspesifikasjoner. Trer kun i kraft
      når `use_code_finder` er aktivert; ugyldige mønstre hoppes over.
    values: "Matrise av regulære-uttrykk-strenger"
    examples:
      - "`%[0-9]*[sd]` beskytter `printf`-stil formatspesifikasjoner"
      - "`\\{[0-9]+\\}` beskytter nummererte plassholdere som `{0}`"
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at reglene skal tre i kraft
processingNotes:
  - "Én blokk sendes ut per melding; `msgctxt` lagres i blokk-konteksten, og kommentarer og referanser bevares."
  - "Flertallsformer (`msgid_plural` / `msgstr[N]`) og `#, fuzzy`-flagg gjenkjennes og bevares gjennom tur-retur."
examples:
  - title: Enspråklig katalog
    description: Behandle msgid som en identifikator og msgstr som kildeteksten.
    config: |
      bilingual_mode: false
  - title: Hopp over uoversatte oppføringer
    description: Ekstraher kun meldinger som allerede har en oversettelse.
    config: |
      preserve_untranslated: false
