# Native reference doc for the built-in `applestrings` format.
# Schema source: core/formats/applestrings/config.go (Config) + schema.go.
# Legacy Apple string resources; .xcstrings (see xcstrings) is the modern successor.
description: Trekk ut og oppdater oversettelser i eldre Apple .strings- og .stringsdict-ressursfiler.
overview: |
  Formatet **Apple Strings** leser begge eldre Apple-strengressursfiltyper i ett format: de linjebaserte `.strings`-nøkkel/verdi-tabellene og `.stringsdict`-plist-XML-flertallsordbøkene (lokalitet per `.lproj`-katalog).

  I `.strings` blir en kommentar som kommer før en oppføring, et oversetternotat, og printf-spesifikatorer (`%@`, `%lld`, `%1$@`) beskyttes som innebygde koder. I `.stringsdict` modelleres hver `NSStringLocalizedFormatKey` og alle CLDR-flertallskategorier (`zero`/`one`/`two`/`few`/`many`/`other`) som en blokk, med `%#@var@`-token beskyttet. Skriving setter bare de endrede verdiene tilbake, slik at filene forblir byte-identiske, og UTF-8- og UTF-16-koding (LE/BE) bevares. Den moderne `.xcstrings`-strengkatalogen håndteres av det separate `xcstrings`-formatet.
parameters:
  extract_comments:
    description: Legg ved en foregående kommentar som et oversetternotat (.strings).
    help: |
      Når dette er aktivert (standard), legges en `/* … */`- eller `// …`-kommentar som kommer før en `.strings`-oppføring, ved blokken som et oversetternotat.
    values: "`true` / `false` (standard `true`)"
  protect_placeholders:
    description: Beskytt printf- og %#@var@-token som innebygde koder.
    help: |
      Når dette er aktivert (standard), løftes printf-spesifikatorer (`%@`, `%lld`, `%1$@`) og `.stringsdict`-substitusjonsto­ken `%#@var@` inn i ugjennomsiktige innebygde koder, slik at oversettelsen aldri endrer dem.
    values: "`true` / `false` (standard `true`)"
processingNotes:
  - "`.strings` og `.stringsdict` gjenkjennes på filendelsen; en strøm uten endelse klassifiseres etter innhold."
  - "`.stringsdict`-flertallskategorier modelleres som separate blokker, på samme måte som strengkatalogen."
  - Binær-plist `.strings` er utenfor scope; UTF-8- og UTF-16-tekstkoding bevares ved tur-retur.
examples:
  - title: La plassholdere stå innebygd
    description: Ikke beskytt printf/%#@var@-token som koder.
    config: |
      protect_placeholders: false
