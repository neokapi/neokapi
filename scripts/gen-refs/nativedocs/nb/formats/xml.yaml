# Native reference doc for the built-in `xml` format.
# Schema source: core/formats/xml/config.go (Config) + schema.go.
# Mirrors the Okapi okf_xml filter (generic XML, ITS-style rules).
description: "Trekk ut og sett inn tekst på nytt i generisk XML, styrt av element- og attributtregler."
overview: |
  **XML**-formatet leser generiske XML-dokumenter og trekker ut teksten i
  konfigurerte elementer og attributter som oversettbare blokker. Det skriver
  oversettelsene tilbake og bevarer den omkringliggende merkingen. Innebygde
  elementer blir til innebygde koder i en blokk, slik at formateringskoder
  bevares under oversettelsen.

  Uttrekket er regelstyrt. De enkle listene (`translatable_elements`,
  `translatable_attributes`, `inline_elements`, `excluded_elements`) dekker de
  fleste tilfeller. De avanserte tilordningene `elements` og `attributes`
  beskriver mer omfattende regler i ITS-stil, med attributtbetingelser,
  tilordninger for ID-er og oversettbare attributter og eksplisitte regler for
  inkludering og ekskludering. Når ingen oversettbare elementer er oppført,
  behandles alt tekstinnhold som oversettbart. Sett `exclude_by_default` for å
  snu dette, slik at bare innhold som er inkludert av regler, tas med.
parameters:
  translatable_elements:
    description: Navn på elementer med tekstinnhold som kan oversettes.
    help: |
      En liste over navn på elementer med tekstinnhold som trekkes ut for oversettelse.
      Når listen er tom, behandles alt tekstinnhold som oversettbart.
    values: "Liste over elementnavn (tom som standard, all tekst kan oversettes)"
    examples:
      - "`[title, para]` trekker ut teksten i `title`- og `para`-elementer"
  translatable_attributes:
    description: Navn på attributter som kan oversettes i alle elementer.
    help: |
      En liste over attributtnavn der verdiene trekkes ut som oversettbar tekst,
      for alle elementer som har disse attributtene.
    values: Array med attributtnavn (tom som standard)
    examples:
      - "`[title, alt]` trekker ut verdiene til attributtene `title` og `alt`"
  exclude_by_default:
    description: Ekskluder alle elementer med mindre en regel inkluderer dem.
    help: |
      Når dette er aktivert, utelates alle elementer fra uttrekket med mindre en
      elementregel inkluderer dem eksplisitt med regeltypen `INCLUDE`. Dette snur
      standardinnstillingen, der tekstinnhold kan oversettes med mindre det er utelatt.
    values: "`true` / `false` (standard: `false`)"
  inline_elements:
    description: Navn på elementer som behandles som innebygde spenn.
    help: |
      En liste over elementnavn som behandles som inline-elementer. De representeres som inline-koder
      i den omkringliggende tekstblokken, ikke som blokkgrenser.
    values: Array med elementnavn (tom som standard)
    examples:
      - "`[b, i, span]` behandler disse som innebygd formatering i tekst"
  excluded_elements:
    description: Navn på elementer der innholdet utelates.
    help: |
      En liste over elementnavn der innholdet ikke trekkes ut, selv om teksten
      ellers ville vært oversettbar.
    values: Liste med elementnavn (tom som standard)
    examples:
      - "`[script, style]` trekker aldri ut innholdet i disse elementene"
  preserve_whitespace_elements:
    description: Elementnavn som alltid bevarer mellomrom og linjeskift.
    help: |
      En liste over elementnavn der tekstinnholdet beholder de opprinnelige mellomrommene
      og linjeskiftene, uavhengig av den globale innstillingen `preserve_whitespace`.
    values: Array med elementnavn (tom som standard)
    examples:
      - "`[pre, code]` bevarer blanktegn inne i disse elementene"
  group_elements:
    description: Navn på elementer som oppretter gruppe- eller laggrenser.
    help: |
      En liste over navn på elementer som oppretter gruppegrenser (laggrenser) i
      utdataene og grupperer blokkene de inneholder.
    values: Liste over elementnavn (tom som standard)
  id_attributes:
    description: Attributtnavn som brukes til å utlede blokk-ID-er.
    help: |
      En liste over attributtnavn som kontrolleres i rekkefølge for å hente en
      blokks ID fra det omsluttende elementet. Hvis ingen av navnene samsvarer,
      brukes `id`-attributtet som reserve.
    values: Liste med attributtnavn (tom som standard)
    examples:
      - "`[name, key]` bruker et `name`- eller `key`-attributt som blokk-ID"
  preserve_whitespace:
    description: Bevar blanktegn globalt i stedet for å slå dem sammen.
    help: |
      Når dette er aktivert, bevares blanktegn i tekstinnholdet som de er. Som standard
      slås sammenhengende blanktegn sammen til ett mellomrom, og innledende og avsluttende blanktegn fjernes.
    values: "`true` / `false` (standard: `false`)"
  elements:
    description: Avanserte elementspesifikke regler.
    help: |
      En tilordning fra elementnavn (eller et regex-mønster omsluttet av enkle anførselstegn) til et
      regelobjekt. En regel kan inneholde `rule_types` (`TEXTUNIT`, `INLINE`, `EXCLUDE`,
      `INCLUDE`, `PRESERVE_WHITESPACE`, …), en `conditions`-trippel for et attributt,
      `id_attributes` og en `translatable_attributes`-tilordning. Betingelser gjør at en regel
      bare utløses når et attributt samsvarer, slik som med velgere i ITS-stil.
    values: "Tilordning fra elementnavn → regelobjekt (tom som standard)"
    examples:
      - "`{ p: { rule_types: [TEXTUNIT] } }` trekker ut teksten i `p`-elementer"
  attributes:
    description: Avanserte attributtspesifikke regler.
    help: |
      En tilordning fra attributtnavn (eller et regex-mønster i enkle anførselstegn) til et
      regelobjekt. En regel kan inneholde `rule_types` (som `ATTRIBUTE_TRANS`,
      `ATTRIBUTE_ID`, `ATTRIBUTE_WRITABLE`) og en elementavgrensning via
      `only_these_elements` eller `all_elements_except`.
    values: "Tilordning fra attributtnavn til regelobjekt (tom som standard)"
    examples:
      - "`{ alt: { rule_types: [ATTRIBUTE_TRANS], only_these_elements: [img] } }`"
  block_type_map:
    description: Tilordne elementnavn til strenger for semantiske blokktyper.
    help: |
      En tilordning fra elementnavn til en blokktypestreng. De resulterende
      blokkene merkes med en semantisk type for bruk i etterfølgende verktøy.
    values: "Tilordning fra elementnavn → typestreng (tom som standard)"
  subfilters:
    description: Underfiltertilordninger per mønster for innebygd innhold.
    help: |
      En liste med `{pattern, format}`-objekter som sender tekstinnholdet i
      samsvarende elementstier til en annen formatleser. Mønstrene bruker
      punktumseparerte elementstier med støtte for glob-mønstre. Hver tilordning krever
      at `pattern` og `format` ikke er tomme.
    values: "Liste med `{pattern, format}`-objekter (tom som standard)"
    examples:
      - "`[{pattern: 'root.body', format: html}]` tolker innholdet i `body` som HTML"
  use_code_finder:
    description: Aktiver regex-basert gjenkjenning av inline-koder.
    help: |
      Aktiverer regex-basert gjenkjenning av inline-koder i uttrukket tekst.
      Mønstrene angis via `code_finder_rules`.
    values: "`true` / `false` (standard: `false`)"
  code_finder_rules:
    description: Regulære uttrykk som samsvarer med innebygde koder i tekst.
    help: |
      En liste med regulære uttrykk. Tekst som samsvarer med et av dem, behandles
      som innebygd kode fremfor oversettbare ord. Brukes bare når
      `use_code_finder` er aktivert.
    values: Liste med regulære uttrykk (tom som standard)
    dependsOn:
      - property: use_code_finder
        condition: må være aktivert for at disse mønstrene skal gjelde
limitations:
  - "Dette er en generell XML-leser. For spesifikke XML-dialekter, som RESX, bør du ta utgangspunkt i et tilpasset regelsett fremfor standardinnstillingene."
  - "Element- og attributtnavn i avanserte regler som er omsluttet av enkle anførselstegn, behandles som forankrede regulære uttrykk."
processingNotes:
  - Innebygde elementer blir til innebygde koder i blokker. Elementer på blokknivå danner den omkringliggende strukturen.
  - Elementregler med `INCLUDE`/`EXCLUDE` kan kombineres med `exclude_by_default` for å styre nøyaktig hvilket innhold som trekkes ut.
examples:
  - title: Trekk ut bestemte elementer
    description: "Oversett bare teksten i title og para, og behandle b og i som innebygde elementer."
    config: |
      translatable_elements:
        - title
        - para
      inline_elements:
        - b
        - i
  - title: Attributter som kan oversettes
    description: Trekk ut verdiene for attributtene title og alt i alle elementer.
    config: |
      translatable_attributes:
        - title
        - alt
  - title: Betinget uttrekk med regler
    description: Inkluder bare div-elementer der translate-attributtet er yes.
    config: |
      exclude_by_default: true
      elements:
        div:
          rule_types:
            - INCLUDE
          conditions:
            - translate
            - EQUALS
            - "yes"
