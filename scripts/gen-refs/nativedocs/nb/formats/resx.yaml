# Native reference doc for the built-in `resx` format.
# Schema source: core/formats/resx/config.go (Config) + schema.go.
# Supersedes the generic xml ResXConfig() preset (which cannot attach
# <comment> notes); this is a first-class, byte-faithful reader/writer.
description: Trekk ut og oppdater oversettbare strenger i Microsoft .NET RESX 2.0- og .resw-ressursfiler.
overview: |
  **.NET RESX**-formatet leser Microsoft ResX 2.0-ressursfiler og deres strengbaserte `.resw`-variant, standardbeholderen for tekstressurser i .NET-applikasjoner (språkkode via satellittfilnavn, f.eks. `Strings.fr.resx`).

  Streng-`<data>`-oppføringer blir til blokker: `name`-attributtet er blokknavnet, `<value>` er kilden, et søsken-`<comment>`-element blir en oversetternotat, og `xml:space="preserve"` respekteres. .NET-sammensatte-format-plassholdere som `{0}` og `{1:t}` beskyttes som inline-koder. Typede og binære `<data>`-elementer (de som har `type`/`mimetype`), `<metadata>`, `<assembly>`, navnereferanseoppføringer og `<resheader>`-standardteksten passerer gjennom urørt. Rundturer er byte-trofaste, og bare endret `<value>`-innhold skrives tilbake inn i originaldokumentet.
parameters:
  extractComments:
    description: Legg ved hvert oppslags <comment> som et oversetternotat.
    help: |
      Når aktivert (standard), legges et strengoppslags søsken-`<comment>`-element
      ved blokken som en oversetternotat. Deaktiver for å ignorere
      kommentarer.
    values: "`true` / `false` (standard `true`)"
  skipNameDataReferences:
    description: Hopp over navnereferanse-oppslag (>>navn) i data.
    help: |
      Når aktivert (standard), trekkes ikke ut `<data>`-oppslag hvis navn begynner med `>`
      (fil-/ressursreferanser heller enn inline-strengverdier).
    values: "`true` / `false` (standard `true`)"
processingNotes:
  - "Bare streng-`<data>`-oppslag er oversettbare; typede/binære data, metadata, assembly- og resheader-oppslag passerer gjennom urørt."
  - "`xml:space=\"preserve\"` på et oppslag angir blokken sitt bevar-blanktegn-flagg."
  - ".NET-sammensatt-format-plassholdere (`{0}`, `{1:t}`) beskyttes som inline-koder."
examples:
  - title: Ignorer kommentarer
    description: Ikke gjør om <comment>-elementer til oversetternotater.
    config: |
      extractComments: false
