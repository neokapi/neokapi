# Native reference doc for the built-in `script` tool.
# Schema source: core/tools/script.go (ScriptConfig).
description: Kjør et brukerspesifisert ES5 JavaScript-skript på hver del for å undersøke eller endre blokktekst.
overview: |
  Verktøyet **Script** kjører et brukerspesifisert ES5 JavaScript-program for
  hver del i strømmen. Skriptet mottar den gjeldende delen som et `part`-objekt
  og kan lese og endre blokkens kilde- og måltekst. Det gir mulighet for
  tilpassede transformasjoner som ingen innebygde verktøy dekker.

  I skriptet identifiserer `part.type` delen, og `part.block` gir tilgang til
  blokken (med `id`, `translatable`, `source` og `targets`). Hjelpefunksjoner
  er tilgjengelige: `emit(part)` sender en del videre, `skip()` utelater den
  gjeldende delen, og `log(msg)` skriver en melding til standardfeil. Når
  skriptet verken sender ut eller utelater delen, passerer den med eventuelle
  direkte tekstendringer. Skriptet oppgis direkte eller leses fra en `.js`-fil.

  **Dette verktøyet kjører kode som oppskriften velger, og er derfor tilgangsbegrenset.**
  Det tilhører exec-klassen: Oppskriften angir skriptet, `file` leser fra en
  bane oppskriften angir, og en oppskrift bindes ved at du går inn i en katalog.
  kapi spør derfor én gang per prosjekt, før noe annet skjer med det, og husker
  svaret. En ubetjent kjøring avvises når ingen kan spørres, fremfor å anta et
  svar. `KAPI_TRUST_EXEC=1` gir tilgang der forfatteren av pipelinen bestemmer,
  fremfor at repositoriet som behandles, gjør det. Den samme klassifiseringen
  gjør at verktøyet ikke er tilgjengelig via agentgrensesnittet eller motorens
  API, og heller ikke for oppskrifter som kommer i en `.kpz`-fil. Se
  [E-06](/contribute/architecture/engine/e-06-execution-trust).
parameters:
  source:
    description: Hvor skriptet kommer fra.
    help: |
      `inline` kjører skriptet i `code`-feltet. `file` laster skriptet fra
      banen i `script_file`.
    values: "`inline` / `file` (standard: `inline`)"
  code:
    description: Innebygd ES5 JavaScript-kildekode.
    help: |
      Skriptinnholdet, som brukes når `source` er `inline`. Påkrevd i denne modusen.
    values: "streng"
    dependsOn:
      - property: source
        condition: brukes når source er `inline`
  script_file:
    description: Bane til en JavaScript-fil.
    help: |
      Sti til en `.js`-fil som skal lastes inn og kjøres når `source` er `file`.
      Påkrevd i denne modusen.
    values: "filbane"
    dependsOn:
      - property: source
        condition: brukes når source er `file`
limitations:
  - Motoren støtter bare ES5 JavaScript.
  - Bare endringer i blokkens kilde- og måltekst føres tilbake. Andre endringer i delen lagres ikke.
processingNotes:
  - Hver verktøyinstans har sitt eget kjøremiljø og behandler inndataene i én tråd.
  - En del passerer uendret når skriptet verken sender ut en del eller kaller skip.
examples:
  - title: Fjern avsluttende blanktegn fra kildeteksten
    description: Endre kildeteksten direkte med et innebygd skript.
    config: |
      source: inline
      code: |
        if (part.type === 'block') {
          var s = part.block.source[0].content.text;
          part.block.source[0].content.text = s.replace(/\s+$/, '');
        }
  - title: Last inn et skript fra en fil
    description: Kjør et skript som er lagret sammen med prosjektet.
    config: |
      source: file
      script_file: ./scripts/transform.js
