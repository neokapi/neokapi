# Native reference doc for the built-in `search-replace` tool.
# Schema source: core/tools/searchreplace.go (SearchReplaceConfig).
description: "Finn og erstatt tekst i blokker, med valgfri matching med regulære uttrykk og flagg."
overview: |
  **Søk og erstatt**-verktøyet utfører søk og erstatning på blokkens tekst. Søk/erstatt-parene leveres programmatisk eller av den konfigurerte kommandoen. Alternativene som er synlige i skjemaet styrer samsvaringsatferden: literalmodus mot regulæruttrykkmodus, skiller mellom store og små bokstaver, og om erstatningen søker i kildetekst, måltekst eller begge.

  Når regulæruttrykkmodus er aktivert, brukes flaggene for store/små bokstaver, dot-all og multiline på hvert mønster. Som standard erstatter verktøyet alle treff kun i måltekst.
parameters:
  regEx:
    description: Behandle søkemønstre som regulære uttrykk.
    help: |
      Når aktivert, kompileres hvert søkemønster som et regulært uttrykk
      og flaggene for store/små bokstaver, dot-all og flerlinjer nedenfor gjelder.
    values: "`true` / `false` (standard `false`)"
  ignoreCase:
    description: Treff uten versalfølsomhet.
    help: |
      Når aktivert, ignorerer treffet store og små bokstaver. I regex-modus legger dette til
      versaluavhengig flagg for hvert mønster.
    values: "`true` / `false` (standard `false`)"
  dotAll:
    description: La dot-metategnet matche linjeskift.
    help: |
      Når aktivert (regex-modus), matcher `.`-metategnet også linjeskifttegn,
      slik at et mønster kan strekke seg over linjer.
    values: "`true` / `false` (standard `false`)"
    dependsOn:
      - property: regEx
        condition: gjelder i regulært uttrykk-modus
  multiLine:
    description: Gjør at ankere matcher ved hver linjegrense.
    help: |
      Når aktivert (regex-modus), matcher `^` og `$` ved starten og slutten av hver
      linje i stedet for kun hele teksten.
    values: "`true` / `false` (standard `false`)"
    dependsOn:
      - property: regEx
        condition: gjelder i regulært uttrykk-modus
  source:
    description: Bruk erstatninger på kildeinnhold.
    help: "Når aktivert, kjøres søk og erstatt over blokkens kildetekst."
    values: "`true` / `false` (standard `false`)"
  target:
    description: Bruk erstatninger på målinnhold.
    help: |
      Når aktivert, kjøres søk og erstatt over målteksten for den
      konfigurerte språkkoden.
    values: "`true` / `false` (standard `true`)"
  replaceAll:
    description: Erstatt hvert treff i stedet for kun det første.
    help: |
      Når aktivert, erstattes alle forekomster av et mønster. Når deaktivert,
      erstattes kun det første treffet i hver tekst.
    values: "`true` / `false` (standard `true`)"
limitations:
  - "Regulære uttrykk bruker Go's RE2-syntaks, som ikke støtter tilbakereferanser eller lookaround."
  - Søke-/erstatt-parene leveres programmatisk; kun treffinnstillingene vises i skjemaet.
processingNotes:
  - Opererer kun på oversettbare blokker; ikke-oversettbare blokker passerer gjennom uendret.
  - "Når verken kilde eller mål er angitt, gjelder verktøyet for begge av hensyn til bakoverkompatibilitet."
examples:
  - title: Erstatt en bokstavelig streng i mål
    description: Bruk bokstavelig matching kun på måltekst.
    config: |
      target: true
      ignoreCase: false
  - title: Versaluavhengig regex over begge omfang
    description: Aktiver regex-modus med store/små bokstaver-sammenslåing på tvers av kilde og mål.
    config: |
      regEx: true
      ignoreCase: true
      source: true
      target: true
