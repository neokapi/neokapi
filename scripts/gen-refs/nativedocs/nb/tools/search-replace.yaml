# Native reference doc for the built-in `search-replace` tool.
# Schema source: core/tools/searchreplace.go (SearchReplaceConfig).
description: Finn og erstatt tekst i blokker. Du kan bruke regulære uttrykk og flagg i søket.
overview: |
  Verktøyet **Søk og erstatt** søker og erstatter i blokktekst.
  Søke- og erstatningsparene oppgis programmatisk eller av den konfigurerte
  kommandoen. Alternativene som vises i skjemaet, styrer søket: bokstavelig
  søk eller regulære uttrykk, skille mellom store og små bokstaver, og om
  erstatningen skal gjøres i kildetekst, måltekst eller begge deler.

  Når modus for regulære uttrykk er aktivert, brukes flaggene for store og små
  bokstaver, punktum og flerlinsjemodus på hvert mønster. Som standard erstatter
  verktøyet alle treff bare i målteksten.
parameters:
  regex:
    description: Behandle søkemønstre som regulære uttrykk.
    help: |
      Når dette er aktivert, kompileres hvert søkemønster som et regulært uttrykk.
      Flaggene nedenfor for store og små bokstaver, punktum og flerlinsjemodus gjelder da.
    values: "`true` / `false` (standard `false`)"
  ignore_case:
    description: Søk uten å skille mellom store og små bokstaver.
    help: |
      Når dette er aktivert, skiller søket ikke mellom store og små bokstaver.
      I regex-modus legges flagget for dette til i hvert mønster.
    values: "`true` / `false` (standard: `false`)"
  dot_all:
    description: La metategnet punktum samsvare med linjeskift.
    help: |
      Når dette er aktivert i regex-modus, samsvarer metategnet `.` også med
      linjeskifttegn, slik at et mønster kan strekke seg over flere linjer.
    values: "`true` / `false` (standard: `false`)"
    dependsOn:
      - property: regex
        condition: gjelder i modus for regulære uttrykk
  multi_line:
    description: La ankre samsvare med starten og slutten av hver linje.
    help: |
      Når dette er aktivert i regex-modus, samsvarer `^` og `$` med starten og slutten
      av hver linje, ikke bare med starten og slutten av hele teksten.
    values: "`true` / `false` (standard: `false`)"
    dependsOn:
      - property: regex
        condition: gjelder i modus for regulære uttrykk
  source:
    description: Gjør erstatninger i kildeinnholdet.
    help: "Når dette er aktivert, kjøres søk og erstatt på blokkens kildetekst."
    values: "`true` / `false` (standard: `false`)"
  target:
    description: Utfør erstatninger i målteksten.
    help: |
      Når dette er aktivert, kjøres søk og erstatt på målteksten for den
      konfigurerte språkinnstillingen.
    values: "`true` / `false` (standard `true`)"
  replace_all:
    description: "Erstatt alle treff, ikke bare det første."
    help: |
      Når dette er aktivert, erstattes alle treff for et mønster. Når det er deaktivert,
      erstattes bare det første treffet i hver tekst.
    values: "`true` / `false` (standard: `true`)"
limitations:
  - "Regulære uttrykk bruker Gos RE2-syntaks, som ikke støtter bakoverreferanser eller lookaround."
  - Søke- og erstatningsparene angis programmatisk. Bare innstillingene for søket vises i skjemaet.
processingNotes:
  - "Behandler bare oversettbare blokker. Blokker som ikke er oversettbare, passerer uendret."
  - "Når verken kilde eller mål er angitt, bruker verktøyet begge for å opprettholde bakoverkompatibilitet."
examples:
  - title: Erstatt en bokstavelig streng i måltekster
    description: Bruk bokstavelig søk bare i målteksten.
    config: |
      target: true
      ignore_case: false
  - title: Regex uten skille mellom store og små bokstaver i både kilde- og måltekst
    description: Aktiver modus for regulære uttrykk og søk uten å skille mellom store og små bokstaver i kilde- og måltekst.
    config: |
      regex: true
      ignore_case: true
      source: true
      target: true
