# Native reference doc for the built-in `recycle` tool (content-memory leverage).
# Schema source: core/tools/memoryleverage.go (MemoryLeverageConfig).
description: Forhåndsutfyll oversettelser fra et innholdsminne ved hjelp av eksakt og fuzzy-matching.
overview: |
  **Recycle**-verktøyet spør en innholdsminne (Memory) om kildeteksten for hver blokk og forhåndsutfyller målet med det beste treffet. Det prøver først et eksakt treff, deretter et fuzzy-treff over en konfigurerbar terskel, og registrerer treffscoren og typen (`exact` eller `fuzzy`) på blokken. Det krever et målspråk og en innholdsminne-leverandør; uten et innholdsminne har verktøyet ingenting å hente fra.

  Om et treff skrives inn i målet styres av en fyllterskel og et «bare hvis tomt»-alternativ, slik at treff med høy sikkerhet kan brukes mens svakere treff registreres og overlates til gjennomgang. En ingen-spørring-terskel lar verktøyet hoppe over innholdsminne-oppslaget når en eksisterende kandidat allerede scorer høyt nok.
  Valgfritt kan alle brukte treff skrives til en TMX-fil.
parameters:
  fuzzy_threshold:
    description: Minimum score for at et fuzzy-treff skal vurderes.
    help: |
      Den laveste fuzzy-treffscoren (0-100) som innholdsminne-oppslaget returnerer. Treff under denne scoren ignoreres.
    values: "heltall 0–100 (standard `70`)"
  fill_target:
    description: Kopier det beste treffet inn i målet.
    help: |
      Når aktivert, skrives det best kvalifiserte treffet inn i blokken sin
      målinnhold. Når deaktivert, scores og registreres treff, men
      målet fylles ikke.
    values: "`true` / `false` (standard `true`)"
  fill_target_threshold:
    description: Minimum treffscoren som kreves for å fylle målet.
    help: |
      Et treff må score minst denne verdien for å skrives inn i målet.
      Treff mellom fuzzy-terskelen og denne verdien registreres, men
      fylles ikke inn.
    values: "heltall 0–100 (standard `95`)"
    dependsOn:
      - property: fill_target
        condition: utfylling må være aktivert for at denne terskelen skal gjelde
  fill_if_target_is_empty:
    description: Fyll bare målet når det ikke har noe eksisterende innhold.
    help: |
      Når aktivert, skrives et treff kun inn hvis blokken sitt mål er tomt,
      slik at eksisterende oversettelser aldri overskrives.
    values: "`true` / `false` (standard `false`)"
  no_query_threshold:
    description: Hopp over innholdsminne-spørringen når en eksisterende kandidat scorer høyt nok.
    help: |
      Hvis blokken allerede har en treffscore lik eller over denne verdien, hoppes innholdsminne-oppslaget over. Standardverdien 101 betyr at innholdsminnet alltid spørres.
    values: "heltall 0-101 (standard `101`)"
  make_tmx:
    description: Generer et TMX-dokument over utnyttede treff.
    help: |
      Når dette er aktivert, skrives alle brukte treff til en TMX-fil på den konfigurerte utdatastien.
    values: "`true` / `false` (standard `false`)"
    dependsOn:
      - property: tmx_path
        condition: angi utdatabanen ved generering av TMX
  tmx_path:
    description: Utdatasti for det genererte TMX-dokumentet.
    help: Filbane der TMX-dokumentet skrives når TMX-generering er aktivert.
    values: "filsti"
    dependsOn:
      - property: make_tmx
        condition: TMX-generering må være aktivert
  downgrade_identical_best_matches:
    description: Reduser scoren når det finnes flere identiske eksakte treff.
    help: |
      Når dette er aktivert, får et eksakt treff scoren 99 i stedet for 100 hvis innholdsminnet returnerer flere identiske beste treff. Dette markerer tvetydigheten for gjennomgang.
    values: "`true` / `false` (standard `false`)"
limitations:
  - Krever et målspråk og en innholdsminne-leverandør; uten et minne er det ingenting å utnytte.
processingNotes:
  - Opererer på oversettbare blokker med ikke-tom kilde; andre deler passerer uendret gjennom.
  - Eksakte treff forsøkes før fuzzy-treff; treffscoren og typen registreres som blokkegenskaper.
  - "Med en strukturbevisst innholdsminne-leverandør kjøres treffing mot blokkens innebygde kodestruktur, og fyll bruker den matchede oppføringens runs, slik at markeringsplassholdere overlever fyllet; et 100 %-treff betyr at tekst og struktur stemmer overens."
  - "Tvetydige treff (flere oppføringer med full score og ulike mål) registreres, men fyller aldri målet; valget presenteres for gjennomgang i stedet for å avgjøres etter lagringsrekkefølge."
examples:
  - title: Bruk bare treff med høy sikkerhet
    description: Fyll målet fra treff med score 95 eller høyere.
    config: |
      fill_target: true
      fill_target_threshold: 95
  - title: Utnytt og eksporter til TMX
    description: Senk fuzzy-terskelen og skriv treff til en TMX-fil.
    config: |
      fuzzy_threshold: 60
      make_tmx: true
      tmx_path: ./leverage.tmx
