# Native reference doc for the built-in `inline-codes-remove` tool.
# Schema source: core/tools/inlinecodesremove.go (InlineCodesRemoveConfig).
description: "Fjern sekvenser av innebygde koder (plassholdere og sammenhørende koder) fra segmenter, slik at bare ren tekst blir igjen."
overview: |
  Verktøyet **Inline Codes Remove** fjerner sekvenser av innebygde koder
  (plassholdere og sammenhørende åpnings- og lukkekoder) fra segmentinnholdet.
  Den omkringliggende rene teksten beholdes. Dette er nyttig når en mottaker
  trenger tekstinnholdet uten oppmerking, for eksempel for å bygge en referanse
  i ren tekst eller sende innholdet til et verktøy som ikke håndterer tekst
  med koder.

  Fjerningen går rekursivt inn i strukturerte plural- og select-konstruksjoner,
  slik at innebygde koder i dem også fjernes. Som standard behandles målteksten
  (en målspråkvariant er påkrevd), og blokker som ikke skal oversettes,
  inkluderes. Linjeskiftkoder kan erstattes med et mellomrom, slik at ord på
  hver side ikke settes sammen.
parameters:
  apply_source:
    description: Fjern innebygde koder fra kildesegmenter.
    help: "Når dette er aktivert, fjernes sekvenser av innebygde koder fra kildesegmentene."
    values: "`true` / `false` (standard: `false`)"
  apply_target:
    description: Fjern innebygde koder fra målsegmenter.
    help: |
      Når dette er aktivert, fjernes sekvenser av innebygde koder fra målsegmentene for
      den konfigurerte språkvarianten.
    values: "`true` / `false` (standard: `true`)"
    dependsOn:
      - property: target_locale
        condition: påkrevd når apply_target er aktivert
  target_locale:
    description: Målspråkvariant for behandling.
    help: Språkvarianten som målsegmentene skal behandles for. Påkrevd når `apply_target` er aktivert.
    values: "BCP-47-språkvariant"
    dependsOn:
      - property: apply_target
        condition: må være aktivert for at dette skal ha effekt
  include_non_translatable:
    description: Fjern også koder fra blokker som ikke skal oversettes.
    help: |
      Når dette er aktivert, fjernes koder også fra blokker som er merket som
      ikke oversettbare. Deaktiver det for å la disse blokkene være uendret.
    values: "`true` / `false` (standard: `true`)"
  replace_with_space:
    description: Erstatt linjeskiftkoder med et mellomrom i stedet for å fjerne dem.
    help: |
      Når dette er aktivert, erstattes plassholderkoder for linjeskift med ett
      mellomrom. For eksempel blir `foo<br/>bar` til `foo bar` i stedet for
      `foobar`. Andre innebygde koder fjernes fortsatt helt.
    values: "`true` / `false` (standard: `false`)"
limitations:
  - Minst én av apply_source og apply_target må være aktivert.
processingNotes:
  - "Fjerningen går rekursivt inn i plural- og select-konstruksjoner, slik at kodene i dem også fjernes."
  - "Sammenhørende åpnings- og lukkekoder fjernes, mens teksten mellom dem beholdes."
examples:
  - title: Fjern koder fra målteksten
    description: Generer ren måltekst for en språkvariant.
    config: |
      apply_target: true
      target_locale: fr
  - title: Behold ordgrenser ved linjeskift
    description: Erstatt linjeskiftkoder med et mellomrom når kodene fjernes.
    config: |
      apply_target: true
      target_locale: fr
      replace_with_space: true
