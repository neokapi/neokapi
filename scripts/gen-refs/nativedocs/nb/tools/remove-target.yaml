# Native reference doc for the built-in `remove-target` tool.
# Schema source: core/tools/removetarget.go (RemoveTargetConfig).
description: "Fjern målsegmenter fra blokker, etter locale eller etter valgte blokk-ID-er."
overview: |
  **Remove Target**-verktøyet sletter målsegmenter fra blokker. Med en mållocale angitt fjerner det bare målene for den localen; uten locale fjerner det
  alle mål. Det er nyttig for å nullstille oversettelser før en ny kjøring, eller
  for å tømme mål i en bestemt locale.

  Fjerningen kan avgrenses til bestemte blokker etter ID, noe som begrenser
  operasjonen til en kommaseparert liste over blokk-ID-er. Valgfritt kan en blokk
  der alle mål er fjernet, selv droppes fra strømmen.
parameters:
  target_locale:
    description: Localen hvis mål skal fjernes.
    help: |
      Localen som skal tømmes. Hvis den er tom, fjernes målene for alle localer på
      blokken.
    values: "BCP-47-locale (tom = fjern alle mål)"
  text_unit_ids:
    description: Kommaseparerte blokk-ID-er som fjerningen begrenses til.
    help: |
      En kommaseparert liste over blokk-ID-er. Når den er satt og ID-filtrering
      er aktivert, fjernes målene bare for blokker hvis ID finnes i listen. La feltet
      stå tomt for å fjerne mål fra alle blokker.
    values: "kommaseparert streng"
    dependsOn:
      - property: filter_by_ids
        condition: ID-filtrering må være aktivert for at denne listen skal gjelde
  filter_by_ids:
    description: Filtrer blokker etter ID i stedet for bare etter locale.
    help: |
      Når dette er aktivert, begrenses fjerningen til blokkene som er oppført i
      `text_unit_ids`. Når det er deaktivert, styres fjerningen av mållocalen
      på tvers av alle blokker.
    values: "`true` / `false` (standard `true`)"
  remove_block_if_empty:
    description: Dropp en blokk når den ikke har gjenværende mål.
    help: |
      Når dette er aktivert, fjernes en blokk som ikke har gjenværende målsegmenter etter fjerningen
      helt fra strømmen. Når det er deaktivert, beholdes den nå tomme blokken.
    values: "`true` / `false` (standard `false`)"
processingNotes:
  - Opererer kun på oversettbare blokker; ikke-oversettbare blokker passerer uendret gjennom.
examples:
  - title: Fjern målene for én locale
    description: Fjern de franske målene fra alle blokker.
    config: |
      target_locale: fr
  - title: Fjern mål for valgte blokker
    description: Begrens fjerning til bestemte blokk-ID-er.
    config: |
      filter_by_ids: true
      text_unit_ids: "intro.title, intro.body"
