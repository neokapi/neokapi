# Native reference doc for the built-in `term-extract` tool.
# Schema source: core/ai/tools/terminology.go (AITerminologyConfig).
description: Ekstraher termkandidater fra kildetekst ved hjelp av en LLM-leverandør.
overview: |
  Verktøyet **Term Extract** sender kildeteksten i hver blokk til en
  konfigurert LLM-leverandør og ber om å få tilbake relevante termer, hver med en kort
  definisjon og et fagområde. De ekstraherte oppføringene lagres som en terminologiliste
  i blokkens egenskaper. Blokker uten kildetekst hoppes over, og
  blokker der det ikke finnes termer, forblir uendret.

  Verktøyet kaller en ekstern modell og krever derfor tilgangsopplysninger for leverandøren. Du kan
  angi et fagområde for å prioritere ekstrahering av termer fra dette området
  (for eksempel medisinsk, juridisk eller teknologisk terminologi). Resultatene er
  termkandidater som skal gjennomgås og bearbeides før de legges inn i et termlager.
  De er ikke autoritativ terminologi.
parameters:
  provider:
    description: LLM-leverandørens backend som skal brukes.
    help: |
      Velger hvilken modellbackend som utfører ekstraheringen.
    values: "`anthropic` (standard), `openai`, `gemini`, `azureopenai`, `ollama` (lokal, uten nøkkel)"
  api_key:
    description: API-nøkkel for KI-leverandøren.
    help: |
      Tilgangsopplysninger for den valgte leverandøren. Lokale leverandører som Ollama
      krever ikke nødvendigvis en nøkkel. Oppgi helst tilgangsopplysninger via
      lageret for tilgangsopplysninger eller miljøet, fremfor å sjekke dem inn i en oppskrift.
    values: "streng"
  model:
    description: Navnet på modellen som skal forespørres fra leverandøren.
    help: |
      Den leverandørspesifikke modellidentifikatoren. Hvis den utelates, brukes
      leverandørens standardmodell.
    values: "streng"
  domain:
    description: Fagområde som terminologiuttrekket skal rettes mot.
    help: |
      En valgfri angivelse av fagområdet (for eksempel `medical`, `legal` eller
      `technology`). Når den er angitt, tas den med i prompten slik at modellen
      prioriterer termer som er relevante for fagområdet.
    values: "streng"
limitations:
  - Krever tilgangsopplysninger for en KI-leverandør og utfører ett eksternt API-kall per blokk.
  - Ekstraherte termer er generert av modellen og bør gjennomgås før de brukes som autoritativ terminologi.
  - Behandler bare kildetekst.
processingNotes:
  - Behandler blokker. Blokker med tom kildetekst hoppes over.
  - Blokkene behandles som standard parallelt for å øke gjennomstrømningen.
examples:
  - title: Ekstraher fagspesifikk terminologi
    description: Rett uttrekket mot et bestemt fagområde.
    config: |
      provider: anthropic
      domain: medical
  - title: Bruk en lokal Ollama-modell
    description: Kjør ekstrahering med en lokalt driftet modell.
    config: |
      provider: ollama
      model: llama3
