# Native reference doc for the built-in `translate` tool.
# Schema source: core/ai/tools/unified.go (TranslateSchema, over AITranslateConfig).
description: Oversett blokkinnhold med en LLM-leverandør.
overview: |
  Verktøyet **Translate** oversetter blokkinnhold som ikke er oversatt. Med
  `--provider` velger du én backend: en leverandør av store språkmodeller (Anthropic,
  OpenAI, Gemini, Azure OpenAI, Ollama) eller demo-leverandøren, som kjører uten nett og API-nøkkel.
  Klassiske maskinoversettelsesmotorer er ikke innebygd. Et programtillegg kan registrere
  en slik motor, som deretter velges på samme måte. Resultatet skrives som måltekst,
  med en merknad om alternativ oversettelse som angir leverandøren.
  Et målspråk er påkrevd. Driftede leverandører krever også påloggingsinformasjon,
  men lokal Ollama og demo-leverandøren krever ingen.

  Blokker som inneholder innebygde koder, sendes gjennom en prompt som bevarer
  plassholdere, slik at tagger overlever oversettelsen. Deretter rekonstrueres blokkene fra svaret.
  Blokker kan oversettes én om gangen eller grupperes i batcher som sendes i
  ett strukturert kall. Batcher kan kjøres samtidig. Når du bruker en sesjonsbuffer,
  gjenbrukes måltekster som allerede er oversatt, og nye oversettelser
  skrives tilbake. Dermed hopper gjentatte kjøringer over arbeid som allerede er gjort.
parameters:
  provider:
    description: Oversettelsesleverandøren som skal brukes.
    help: |
      Velger backend. Her velger du LLM-leverandør (`anthropic`, `openai`, `gemini`,
      `azureopenai`, `ollama`, `demo`) eller en maskinoversettelsesmotor
      registrert via en programtillegg. Driftede leverandører krever en API-nøkkel. Ollama
      og demoleverandøren kjøres lokalt. De tilgjengelige alternativene hentes
      fra leverandørregisteret.
    values: "`anthropic` / `openai` / `gemini` / `azureopenai` / `ollama` / `demo` (standard: `anthropic`)"
  api_key:
    description: API-nøkkel for leverandøren.
    help: |
      Påloggingsinformasjon for den valgte driftede leverandøren. Kreves for driftede leverandører;
      ikke nødvendig for en lokal Ollama-backend eller demo-backend.
    values: "tekststreng"
  model:
    description: Modellnavnet som skal brukes i forespørselen (LLM-leverandører).
    help: |
      Den leverandørspesifikke modellidentifikatoren for en LLM-leverandør. Hvis den utelates,
      brukes leverandørens standardmodell.
    values: "tekststreng"
  skip_matched:
    description: Hopp over blokker som allerede har en oversettelse.
    help: |
      Når dette er aktivert, forblir blokker som allerede har en måltekst for språk- og områdeinnstillingen,
      uendret. Bare innhold som ikke er oversatt, sendes til leverandøren.
    values: "`true` / `false` (standard `false`)"
  batching:
    description: Hvor mange blokker som deler ett LLM-kall.
    help: |
      `auto` tilpasser størrelsen på hver batch etter hva modellen kan returnere i ett svar, og
      oversetter batchen i ett strukturert kall. `single` oversetter én
      blokk per kall. Lokale leverandører oversetter én blokk per kall med begge
      innstillingene. Det samme gjelder kjøringer med termer som ikke skal oversettes.
    values: "`auto` / `single` (standard `auto`)"
  batch_concurrency:
    description: Antall batchkall som skal kjøres parallelt.
    help: |
      Hvor mange batcher som oversettes samtidig. Verdien 0 eller 1 kjører
      batchene sekvensielt.
    values: "heltall ≥ 1 (standard `1`)"
limitations:
  - Krever et målspråk og gyldig autentisering for driftede leverandører.
  - Driftede leverandører foretar API-kall over nettverket. Kostnad og ventetid øker med innholdsmengden.
  - "Behandling blokk for blokk bruker øktens hurtigbuffer på nytt. Ved satsvis behandling skrives overlegg til utdataene, men blokker hoppes ikke over på forhånd basert på hurtigbufferen for enkeltblokker."
processingNotes:
  - Behandler oversettbare blokker som har kildetekst. Andre deler sendes videre uendret.
  - "Blokker med innebygde koder oversettes med en prompt som bevarer plassholdere, og rekonstrueres fra svaret."
  - "Hver oversettelse registreres som en merknad for alternativ oversettelse, merket med leverandøren."
  - In a project, a block a reviewer rejected is drafted again, and the prompt carries the latest three rejected drafts of it with the reasons and the reviewer's note. The notes are quoted, cut when long, and stated after the terms and rules, which they do not change. The note is redacted under the project's redaction policy like the rest of the request. A machine translation engine is sent none of it. A draft that comes back in rejected wording is not kept and counts towards the stop. After three rejections of drafts of one source the block is drafted no more and waits for a person. A recipe cannot set `review_feedback`.
examples:
  - title: Oversett med Anthropic
    description: "Oversett blokker som ikke er oversatt, med en Anthropic-modell."
    config: |
      provider: anthropic
      model: claude-sonnet-4-5
  - title: Oversett uten nett med demoleverandøren
    description: Generer tydelig merket eksempelutdata uten API-nøkkel for røyktester.
    config: |
      provider: demo
  - title: Oversett bare nytt innhold
    description: Hopp over blokker som allerede har en oversettelse.
    config: |
      provider: openai
      skip_matched: true
