# Native reference doc for the built-in `review` tool.
# Schema source: core/ai/tools/review.go (AIReviewConfig).
description: "Gjennomgå hver oversettelse med en LLM, og produser en score, vurdering og forslag."
overview: |
  **Gjennomgang**-verktøyet ber en konfigurert LLM-leverandør om å gjennomgå hver
  oversettelse og returnere en kortfattet vurdering: en score fra 1 til 10, en kort
  bedømmelse av nøyaktighet og flyt, og et forslag til forbedring der det er aktuelt.
  Gjennomgangsteksten lagres på blokkens egenskaper sammen med leverandørnavnet. Blokker uten en oversettelse for målspråket hoppes over.

  Både et målspråk og legitimasjon for leverandøren er påkrevd, siden verktøyet gjør
  et eksternt API-kall per blokk. I motsetning til AI-basert kontroll, som returnerer
  strukturerte funn, produserer dette verktøyet en friformatgjennomgang beregnet på menneskelige
  gjennomgangspersoner som avgjør om en oversettelse trenger revisjon.
parameters:
  provider:
    description: LLM-leverandørens backend som skal brukes.
    help: |
      Velger hvilken modell-backend som utfører gjennomgangen.
    values: "`anthropic` (standard), `openai`, `gemini`, `azureopenai`, `ollama` (lokal, ingen nøkkel)"
  api_key:
    description: API-nøkkel for AI-leverandøren.
    help: |
      Legitimasjon for den valgte leverandøren. Lokale leverandører som Ollama krever kanskje ikke
      en nøkkel. Foretrekk legitimasjonslageret eller miljøvariabelen fremfor å lagre
      nøkler i en oppskrift.
    values: "string"
  model:
    description: Modellnavnet som skal forespørres fra leverandøren.
    help: |
      Den leverandørspesifikke modellidentifikatoren. Hvis den utelates, brukes leverandørens
      standardmodell.
    values: "string"
limitations:
  - Krever legitimasjon for AI-leverandør og et målspråk; gjør et eksternt API-kall per blokk.
  - "Gjennomgangen er friformatutdata fra modellen, ikke strukturerte funn."
  - Blokker uten oversettelse for målspråket hoppes over.
processingNotes:
  - Behandler blokker som har en oversettelse for målspråket.
  - Blokker behandles parallelt som standard for å øke gjennomstrømmingen.
  - Gjennomgangsteksten og leverandørnavnet lagres på blokkens egenskaper.
examples:
  - title: Gjennomgang med standardleverandøren
    description: Skår og vurder hver oversettelse med Anthropic.
    config: |
      provider: anthropic
  - title: Gjennomgang med en bestemt modell
    description: Bruk en navngitt OpenAI-modell for gjennomgangen.
    config: |
      provider: openai
      model: gpt-4o
