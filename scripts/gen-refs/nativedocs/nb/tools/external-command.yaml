# Native reference doc for the built-in `external-command` tool.
# Schema source: core/tools/externalcommand.go (ExternalCommandConfig).
description: "Kjør et eksternt kommandolinjeprogram på blokkens tekst, og bruk programmets standard utdata som resultat."
overview: |
  Verktøyet **External Command** sender teksten i hver blokk gjennom et eksternt
  kommandolinjeprogram og bruker programmets standardutdata som ny tekst. Du kan
  gjenbruke et eksisterende kommandolinjefilter i en pipeline, for eksempel et
  egendefinert normaliseringsfilter, en stavefeilretter eller et
  translittereringsverktøy, uten å skrive et eget verktøy.

  Teksten kan sendes til kommandoens standardinngang eller settes inn i
  argumentlisten via plassholderne `${source}` og `${target}`. En kommando er
  påkrevd. En målspråkvariant er også påkrevd når verktøyet brukes på målteksten.
  Hvert kall har en tidsfrist. Avslutningskoden registreres på blokken. Hvis koden
  ikke er null, forblir teksten uendret, og feilen registreres.

  **Dette verktøyet kjører kode som oppskriften velger, og er derfor tilgangsbegrenset.**
  Det er i exec-klassen. Et prosjekt som angir verktøyet i en flyt, kjører
  kommandoer med dine rettigheter og ditt miljø. En oppskrift bindes når du går
  inn i en katalog. kapi spør derfor én gang per prosjekt, før noe annet skjer
  med prosjektet, og husker svaret. En ubetjent kjøring avslås hvis ingen kan
  svare, i stedet for å anta et svar. `KAPI_TRUST_EXEC=1` gir tillatelse der
  pipeline-forfatteren bestemmer, i stedet for at tillatelsen styres av
  repositoryet som behandles. Den samme klassifiseringen gjør at verktøyet ikke
  er tilgjengelig via agentgrensesnittet, motor-API-et eller oppskrifter som
  kommer i en `.kpz`. Se
  [E-06](/contribute/architecture/engine/e-06-execution-trust).

  **En sladdingspolicy gjelder.** Programmet kan sende det leser, hvor som helst.
  I et prosjekt som angir en [sladdingspolicy](/framework/redaction), leser
  programmet derfor hver tilbakeholdt verdi som en plassholder, for eksempel
  `[REDACTED:Person]`. kapi setter originalverdien tilbake i programmets utdata.
  En flyt som kjører dette verktøyet, trenger et `redact`-steg før verktøyet.
  Hvis utdataene utelater, endrer, gjentar eller legger til en plassholder,
  forblir blokken uendret. Det registreres et `external-command.redaction-placeholder`-funn
  som angir blokken og plassholderen og markerer kontrollen som mislykket.
  `kapi exec` og `kapi up` skriver ut funnene og avslutter med kode 3, koden som
  brukes ved en mislykket kontroll.
parameters:
  command:
    description: Den kjørbare filen som skal kjøres.
    help: |
      Sti til eller navn på kommandolinjeprogrammet som skal kjøres for hver blokk.
      Programmets standard utdata erstatter blokkens tekst.
    values: "streng (påkrevd)"
  args:
    description: Argumenter som sendes til kommandoen.
    help: |
      Argumentlisten for kommandoen. Bruk `${source}` og `${target}` som
      plassholdere. Begge erstattes med teksten som behandles.
    values: "liste med strenger"
  apply_source:
    description: Behandle kildetekst.
    help: "Når dette er aktivert, sendes kildeteksten gjennom kommandoen."
    values: "`true` / `false` (standard: `false`)"
  apply_target:
    description: Behandle måltekst.
    help: |
      Når dette er aktivert, sendes målteksten for den konfigurerte
      språkvarianten gjennom kommandoen. Bare eksisterende måltekster behandles.
    values: "`true` / `false` (standard: `true`)"
    dependsOn:
      - property: target_locale
        condition: påkrevd når apply_target er aktivert
  target_locale:
    description: Målspråkvariant for behandlingen.
    help: Språkvarianten som målteksten behandles for. Påkrevd når `apply_target` er aktivert.
    values: "Språkvariant i BCP-47-format"
    dependsOn:
      - property: apply_target
        condition: må være aktivert for at dette skal tre i kraft
  send_as_stdin:
    description: Send teksten til standardinngangen i stedet for som argument.
    help: |
      Når dette er aktivert, skrives teksten til kommandoens standard inndata. Når
      det er deaktivert, sendes teksten bare til kommandoen via argumentplassholderne
      `${source}` / `${target}`.
    values: "`true` / `false` (standard: `true`)"
  timeout:
    description: Tidsavbrudd i sekunder per kjøring.
    help: |
      Maksimal ventetid på at kommandoen skal fullføres for én blokk. Kommandoen
      avbrytes når tidsfristen utløper.
    values: "heltall ≥ 1 (standard: `30`)"
limitations:
  - "En avslutningskode som ikke er null, lar teksten stå uendret og lagrer avslutningskoden og feilmeldingen som egenskaper på blokken."
  - Kommandoen kjøres én gang per blokk for hvert valgt tekstområde (kilde og/eller mål). Dette kan ta lang tid for store dokumenter.
processingNotes:
  - "Behandler bare oversettbare blokker. Blokker som ikke kan oversettes, passerer uendret."
  - Avsluttende linjeskift fjernes fra de innsamlede utdataene.
examples:
  - title: Send målteksten gjennom et formateringsprogram
    description: "Kjør et eksternt program på målteksten, og send teksten via stdin."
    config: |
      command: my-formatter
      apply_target: true
      target_locale: fr
  - title: Send tekst som argument
    description: Sett inn teksten i argumentlisten i stedet for å sende den via standard inndata.
    config: |
      command: transform
      args: ["--text", "${source}"]
      apply_source: true
      send_as_stdin: false
