# Native reference doc for the built-in `properties-set` tool.
# Schema source: core/tools/propertiesset.go (PropertiesSetConfig).
description: Sett eller endre nøkkel-verdi-egenskaper på blokker.
overview: |
  Verktøyet **Properties Set** skriver et fast sett med nøkkel-verdi-egenskaper til blokker. Egenskaper er metadata som følger en blokk og kan påvirke etterfølgende verktøy og skrivekomponenter. Bruk det til å merke innhold, for eksempel ved å gi et sett med blokker en arbeidsflytstatus eller et rutingshint.

  Minst én egenskap må konfigureres. Som standard overskriver verktøyet eksisterende egenskaper med samme nøkkel og brukes bare på blokker som kan oversettes.
parameters:
  properties:
    description: Nøkkel-verdi-parene som skal settes på hver blokk.
    help: |
      En tilordning av egenskapsnavn til verdier. Alle oppførte egenskaper skrives til hver blokk som behandles. Minst én oppføring er påkrevd.
    values: "objekt med strengnøkler og strengverdier (påkrevd)"
  overwrite:
    description: Overskriv eksisterende egenskaper med samme nøkkel.
    help: |
      Når dette er aktivert, erstattes en egenskap hvis nøkkelen allerede finnes på blokken. Når det er deaktivert, beholdes eksisterende egenskaper, og bare manglende nøkler legges til.
    values: "`true` / `false` (standard: `true`)"
  only_translatable:
    description: Sett bare egenskaper på blokker som kan oversettes.
    help: |
      Når dette er aktivert, hoppes blokker som ikke kan oversettes, over. Deaktiver det for å sette egenskaper på alle blokker, uavhengig av om de kan oversettes.
    values: "`true` / `false` (standard: `true`)"
examples:
  - title: Merk blokker med en status
    description: Sett en arbeidsflytegenskap på hver blokk som kan oversettes.
    config: |
      properties:
        status: review
  - title: Legg til metadata uten å overskrive
    description: Legg bare til en nøkkel når blokken ikke allerede har den.
    config: |
      properties:
        origin: import
      overwrite: false
