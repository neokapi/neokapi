# Native reference doc for the built-in `segmentation` tool.
# Schema source: core/tools/segmentation.go (segmentationGroup: SegmentationConfig
# plus each engine's own parameters, core/segment/srx Params and
# core/ai/tools/segment_llm.go LLMParams).
description: Marker setningsgrenser eller grenser mellom tekstdeler i hver blokk som et segmenteringsoverlegg.
overview: |
  Verktøyet **Segmentering** markerer setnings- eller tekstbolkgrenser i hver
  blokk. Det registrerer grensene i et separat overlegg og lar blokkens tekstsekvenser
  være uendret. Når du fjerner overlegget, gjenopprettes den usegmenterte blokken. `--engine`
  velger segmenteringsmotoren:

  - `srx` er standardvalget. Motoren finner setningsgrenser med innebygde regler og krever
    ingen konfigurasjon. `rules_path` laster inn en SRX 2.0-regelfil i stedet.
  - `uax29` bruker Unicodes standardregler for setningsgrenser, uten
    språkspesifikke unntak.
  - `llm` ber en KI-leverandør om å dele teksten i meningsbaserte bolker i stedet for setninger.

  Programtillegg kan registrere flere motorer, som vises som alternativer. Tospråklige
  formater skriver setningslaget som segmenter. En blokk som allerede har et
  lag, beholder det med mindre `overwrite_segmentation` er satt.
parameters:
  engine:
    description: Segmenteringsmotoren som skal kjøres.
    help: |
      `srx` og `uax29` skriver setningslaget. `llm` skriver laget `llm-chunk`.
      Alternativene hentes fra registeret over segmenteringsmotorer.
    values: "`srx` / `uax29` / `llm` (standard: `srx`)"
  layer:
    description: Navnet på overlegglaget som skal skrives.
    help: |
      Når feltet er tomt, brukes motorens eget lag: setningslaget for `srx`
      og `uax29`, `llm-chunk` for `llm`. Et navngitt lag ligger ved siden av de andre.
    values: "streng (tom som standard)"
  segment_source:
    description: Segmenter kildeteksten.
    help: |
      Når dette er aktivert, segmenteres kildeteksten i hver blokk. Hvis verken kilde- eller
      målsegmentering er aktivert, segmenteres kildeteksten.
    values: "`true` / `false` (standard `true`)"
  segment_target:
    description: Segmenter den eksisterende målteksten.
    help: |
      Når dette er aktivert, segmenteres oversettelsen på språket som er angitt med `--target-lang`,
      med samme motor. SRX-regler er knyttet til språk, så hver
      side får reglene for sitt språk.
    values: "`true` / `false` (standard: `false`)"
  overwrite_segmentation:
    description: "Segmenter blokker som allerede har laget, på nytt."
    help: |
      Som standard beholder en blokk laget hvis det allerede finnes. Aktiver dette for å
      erstatte laget.
    values: "`true` / `false` (standard: `false`)"
  treat_isolated_codes_as_whitespace:
    description: Behandle isolerte innebygde koder som blanktegn under segmentering.
    help: |
      Når dette er aktivert, behandles en isolert innebygd kode som blanktegn ved
      identifisering av segmentgrenser.
    values: "`true` / `false` (standard `false`)"
  trim_leading_whitespace:
    description: Utelat innledende blanktegn fra hvert segment.
    help: |
      Når dette er aktivert, faller blanktegn i starten av et segment utenfor segmentets område.
    values: "`true` / `false` (standard: `true`)"
  trim_trailing_whitespace:
    description: Utelat etterfølgende blanktegn fra hvert segment.
    help: |
      Når dette er aktivert, faller blanktegn på slutten av et segment utenfor segmentets omfang.
    values: "`true` / `false` (standard: `true`)"
  renumber_codes:
    description: Nummerer ID-er for innebygde koder på nytt innenfor hvert segment i tospråklig utdata.
    help: |
      Gjelder når et tospråklig format skriver ut segmentene: ID-ene til innebygde koder
      nummereres på nytt fra 1 i hvert segment. Selve overlegget lar
      tekstsekvensene være uendret.
    values: "`true` / `false` (standard `false`)"
  rules_path:
    description: Sti til en SRX 2.0-regelfil (motoren `srx`).
    help: |
      Erstatter de innebygde reglene. Én fil brukes for både kilde og mål, siden SRX-regler
      er knyttet til språk.
    values: "filbane"
  provider:
    description: KI-leverandør for oppdeling i tekstbiter (`llm`-motoren).
    help: |
      Leverandøren som returnerer tekstdelene. Hvis feltet er tomt, brukes `anthropic`.
    values: "en leverandør-ID"
  model:
    description: Modellnavn som skal brukes i forespørselen (`llm`-motoren).
    help: |
      Den leverandørspesifikke modellidentifikatoren. Hvis den utelates, brukes
      leverandørens standardmodell.
    values: "streng"
  credential:
    description: Navn på lagret legitimasjon (`llm`-motoren).
    help: |
      Navnet på en legitimasjon som er lagret med `kapi credentials add`.
    values: "tekststreng"
  instruction:
    description: Veiledning for inndeling i bolker (`llm`-motoren).
    help: |
      Veiledning i fritekst som legges til forespørselen om oppdeling.
    values: "streng"
  max_chunk_runes:
    description: Myk øvre grense for bolkstørrelse i tegn (`llm`-motoren).
    help: |
      `0` overlater størrelsen til modellen.
    values: "heltall (standardverdi `0`)"
limitations:
  - Det innebygde regelsettet er laget for vanlige setningsgrenser i latinsk skrift. Andre skriftsystemer kan kreve en egendefinert SRX-fil.
  - Motoren `llm` kaller en driftet leverandør med mindre du velger en lokal leverandør. En driftet leverandør krever tilgangsopplysninger.
processingNotes:
  - Behandler bare oversettbare blokker. Ikke-oversettbare blokker forblir uendret.
  - "Når kildeteksten skrives til setningslaget, registreres antall segmenter i blokkegenskapen `segment-count`."
examples:
  - title: Segmenter kildeteksten med standardreglene
    description: Marker setningsgrenser ved hjelp av de innebygde reglene.
    config: |
      segment_source: true
  - title: Segmenter på nytt med en egendefinert SRX-fil
    description: Erstatt eksisterende segmentering med prosjektspesifikke regler.
    config: |
      engine: srx
      overwrite_segmentation: true
      rules_path: ./rules/segmentation.srx
