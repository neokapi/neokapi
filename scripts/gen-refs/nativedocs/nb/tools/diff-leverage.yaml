# Native reference doc for the built-in `diff-leverage` tool.
# Schema source: core/tools/diffleverage.go (DiffLeverageConfig).
description: Gjenbruk oversettelser fra en tidligere dokumentversjon for uendrede kildeblokker.
overview: |
  **Diff Leverage**-verktøyet sammenligner kildeteksten i hver blokk med den samme
  blokken i en tidligere versjon av dokumentet, og viderefører den tidligere
  oversettelsen når kilden er uendret. Det unngår å oversette innhold på nytt
  når det ikke er endret mellom versjoner, og merker hver blokk med diff-
  status: `new`, `unchanged`, `modified` eller `leveraged`. Et målspråk er
  påkrevd.

  Kilden og måltekstene fra den tidligere versjonen leveres programmatisk
  (nøklet på blokk-ID); de er ikke en del av det deklarative skjemaet. De to
  skjema-synlige alternativene styrer hvordan kildesammenligningen utføres.
parameters:
  case_sensitive:
    description: Sammenlign kildetekster med skille mellom store og små bokstaver.
    help: |
      Når aktivert, må to kilder stemme nøyaktig overens, inkludert store og små bokstaver, for
      å regnes som uendret. Når deaktivert, ignorerer sammenligningen store og små bokstaver.
    values: "`true` / `false` (standard `true`)"
  fuzzy_match:
    description: Viderefør oversettelser for nært beslektede kilder.
    help: |
      Når aktivert, gjenbruker en endret kilde som er tilstrekkelig lik den
      tidligere versjonen (over en intern likhetsterskel) fortsatt den
      tidligere oversettelsen, og merkes `leveraged` med en likhetspoengsum.
      Når deaktivert, gjenbrukes kun eksakte treff.
    values: "`true` / `false` (standard `false`)"
limitations:
  - Krever et målspråk og et korpus fra en tidligere versjon (levert programmatisk); de tidligere tekstene er ikke konfigurerbare via skjemaet.
  - Fuzzy-matching bruker en fast intern likhetsterskel.
processingNotes:
  - Opererer kun på oversettbare blokker; ikke-oversettbare blokker sendes gjennom uendret.
  - Hver blokk merkes med en diff-statusegenskap; levererte fuzzy-treff registrerer også en likhetspoengsum.
examples:
  - title: Gjenbruk kun eksakte treff
    description: Viderefør oversettelser der kilden er identisk.
    config: |
      case_sensitive: true
  - title: Tillat fuzzy leverage
    description: Gjenbruk også oversettelser for nært beslektede kilder.
    config: |
      fuzzy_match: true
      case_sensitive: false
