# Native reference doc for the built-in `case-transform` tool.
# Schema source: core/tools/casetransform.go (CaseTransformConfig).
description: "Endre bokstavstørrelsen i kilde- og/eller måltekst til store, små eller tittelbokstaver."
overview: |
  **Case Transform**-verktøyet skriver om bokstavstørrelsen i tekst i oversettbare blokker.
  Det kan gjøre kildeteksten, målteksten eller begge om til store bokstaver, små bokstaver eller tittelbokstaver.
  Det er nyttig for å normalisere visningsstrenger (for eksempel for å tvinge UI-etiketter til store bokstaver) eller for å forberede skifteuavhengige sammenligninger.

  Når det brukes på målet, må en mållokal være angitt; verktøyet transformerer bare lokaler som allerede har et mål. Ikke-oversettbare blokker passerer uendret gjennom.
parameters:
  mode:
    description: Bokstavstørrelsetransformasjonen som skal brukes.
    help: |
      Velger transformasjonen. `upper` konverterer tekst til store bokstaver, `lower`
      til små bokstaver og `title` til tittelbokstaver (hver enkelt bokstav gjøres stor, ved hjelp av
      Unicodes tittelbokstavtilordning).
    values: "`upper` / `lower` / `title` (standard `upper`)"
  apply_source:
    description: Bruk transformasjonen på kildetekst.
    help: |
      Når dette er aktivert, transformeres kildeteksten i hver oversettbare blokk.
    values: "`true` / `false` (standard `true`)"
  apply_target:
    description: Bruk transformasjonen på måltekst.
    help: |
      Når dette er aktivert, transformeres målteksten for den konfigurerte mållokalens vedkommende.
      En mållokal må være angitt; bare eksisterende mål berøres.
    values: "`true` / `false` (standard `false`)"
limitations:
  - "Tittelbokstav bruker Unicodes tittelbokstavtilordning på hver enkelt bokstav, ikke bare forbokstaven i hvert ord."
processingNotes:
  - Opererer bare på oversettbare blokker; ikke-oversettbare blokker passerer uendret gjennom.
  - Måltransformasjon krever en mållokal og påvirker bare lokaler som allerede har et mål.
examples:
  - title: Kildetekst med store bokstaver
    description: Konverter alle kildestrenger til store bokstaver.
    config: |
      mode: upper
      apply_source: true
  - title: Gjør måloversettelsen til små bokstaver
    description: Normaliser målteksten til små bokstaver for en lokal.
    config: |
      mode: lower
      apply_source: false
      apply_target: true
