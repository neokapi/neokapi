# Native reference doc for the built-in `xml-validation` tool.
# Schema source: core/tools/xmlvalidation.go (XMLValidationConfig).
description: Kontroller at kilde- og/eller målteksten i hver blokk er velformet XML.
overview: |
  Verktøyet **XML-validering** kontrollerer at kildeteksten og, om ønskelig,
  målteksten i hver oversettbare blokk er velformet XML. Resultatet lagres i
  blokkens egenskaper som et gyldighetsflagg. Hvis teksten er ugyldig, lagres
  også en feilmelding som angir om det er kilde- eller målteksten som feilet,
  og hvorfor. Tom tekst regnes som gyldig.

  Validering av kildetekst er aktivert som standard. For å validere målteksten
  også, aktiver målsjekk og angi en språkinnstilling for målteksten. Blokktekst
  er ofte et XML-fragment snarere enn et fullstendig dokument. Verktøyet kan
  derfor pakke inn teksten i et rotelement før parsing, slik at også et fragment
  med flere noder på øverste nivå valideres.
parameters:
  check_source:
    description: Valider at kildeteksten er velformet XML.
    help: |
      Når dette er aktivert, parses kildeteksten i hver blokk som XML, og eventuelle
      feil i XML-strukturen rapporteres.
    values: "`true` / `false` (standard: `true`)"
  check_target:
    description: Valider at målteksten er velformet XML.
    help: |
      Når dette er aktivert, parses målteksten som XML i tillegg til kildeteksten.
      Du må angi en språkinnstilling for målteksten når dette er aktivert.
    values: "`true` / `false` (standard: `false`)"
    dependsOn:
      - property: locale
        condition: en språkinnstilling for målteksten er påkrevd når målsjekk er aktivert
  locale:
    description: Språkinnstillingen for målteksten som skal valideres.
    help: |
      Språkinnstillingen for oversettelsen som valideres når målsjekk er aktivert.
      Påkrevd når `check_target` er aktivert. Ignoreres ellers.
    values: "Språkinnstilling i BCP 47-format (f.eks. `fr`)"
    dependsOn:
      - property: check_target
        condition: brukes bare når kontroll av måltekst er aktivert
  wrap_root:
    description: Pakk inn teksten i et rotelement før validering.
    help: |
      Når dette er aktivert, omsluttes teksten av et syntetisk rotelement før
      parsing. Dermed valideres også et fragment med flere noder på toppnivå
      (som ikke er et gyldig, selvstendig dokument). Deaktiver dette for å kreve
      ett velformet dokument.
    values: "`true` / `false` (standard: `true`)"
limitations:
  - Kontrollerer bare at dokumentet er velformet. Validerer ikke mot en DTD eller et skjema.
  - Tom kilde- eller måltekst regnes som gyldig.
processingNotes:
  - "Behandler oversettbare blokker. Struktur som ikke skal oversettes, forblir uendret."
examples:
  - title: Valider bare kildeteksten
    description: Kontroller at kildeteksten i hver blokk kan parses som XML.
    config: |
      check_source: true
  - title: Valider også målteksten
    description: "Valider også den franske oversettelsen, og behandle hver blokk som et fragment."
    config: |
      check_target: true
      locale: fr
