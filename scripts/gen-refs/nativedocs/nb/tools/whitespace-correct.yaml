# Native reference doc for the built-in `whitespace-correct` tool.
# Schema source: core/tools/whitespacecorrect.go (WhitespaceCorrectConfig).
description: "Normaliser og korriger blanktegn i oversettelser på målspråket, inkludert mellomrom ved tegnsetting."
overview: |
  Verktøyet **Whitespace Correct** rydder opp i blanktegn i måltekster.
  Det kan erstatte gjentatte mellomrom med ett, fjerne blanktegn i starten og
  slutten, kopiere blanktegn i starten og slutten fra kildeteksten til målteksten,
  fjerne tegn med null bredde og fjerne blanktegn etter bestemte skilletegn. Det
  siste er særlig nyttig ved oversettelse fra et språk som bruker mellomrom mellom
  ord, til et språk som ikke gjør det, for eksempel kinesisk eller japansk.

  Verktøyet behandler bare målteksten, så et målspråkområde er påkrevd. Bare
  blokker som allerede har en måltekst for dette språkområdet, behandles.
parameters:
  target_locale:
    description: Målspråkområde for behandlingen.
    help: |
      Lokalet for målteksten som skal korrigeres. Påkrevd; bare blokker med en
      eksisterende måltekst for dette lokalet behandles.
    values: "Språkområde i BCP-47-format (påkrevd)"
  normalize_spaces:
    description: Erstatt flere mellomrom på rad med ett.
    help: "Når dette er aktivert, erstattes flere påfølgende mellomrom med ett mellomrom."
    values: "`true` / `false` (standard: `true`)"
  trim_leading:
    description: Fjern blanktegn i starten av målteksten.
    help: "Når dette er aktivert, fjernes blanktegn i starten av målteksten."
    values: "`true` / `false` (standard: `false`)"
  trim_trailing:
    description: Fjern blanktegn på slutten av målteksten.
    help: "Når dette er aktivert, fjernes blanktegn på slutten av målteksten."
    values: "`true` / `false` (standard: `false`)"
  match_source_whitespace:
    description: Kopier blanktegnene i starten og slutten av kildeteksten til målteksten.
    help: |
      Når dette er aktivert, fjernes blanktegnene i starten og slutten av
      målteksten og erstattes med blanktegnene fra kildeteksten.
    values: "`true` / `false` (standard: `true`)"
  remove_zero_width_chars:
    description: Fjern mellomrom og sammenbindingstegn med null bredde.
    help: |
      Når dette er aktivert, fjernes mellomrom og sammenføyningstegn med null bredde
      samt mellomrom med null bredde som hindrer linjeskift, fra målteksten.
    values: "`true` / `false` (standard: `true`)"
  correct_full_stop:
    description: Korriger blanktegn etter punktum.
    help: |
      Når dette er aktivert, fjernes blanktegn etter et punktum (ASCII `.` eller punktum i full bredde
      `．`), basert på hvilke typer blanktegn som er inkludert.
    values: "`true` / `false` (standard `true`)"
  correct_comma:
    description: Korriger blanktegn etter komma.
    help: |
      Når dette er aktivert, fjernes blanktegn etter et komma (ASCII `,` eller full bredde `，`),
      i henhold til de inkluderte blanktegntypene.
    values: "`true` / `false` (standard: `true`)"
  correct_exclamation:
    description: Korriger blanktegn etter utropstegn.
    help: |
      Når dette er aktivert, fjernes blanktegn etter et utropstegn (ASCII `!` eller
      full bredde `！`), i henhold til de inkluderte blanktegntypene.
    values: "`true` / `false` (standard: `true`)"
  correct_question:
    description: Korriger blanktegn etter spørsmålstegn.
    help: |
      Når dette er aktivert, fjernes blanktegn etter et spørsmålstegn (ASCII `?` eller
      full bredde `？`), i henhold til de inkluderte blanktegntypene.
    values: "`true` / `false` (standard: `true`)"
  include_vertical_ws:
    description: Inkluder vertikale blanktegn i korrigeringer.
    help: |
      Når dette er aktivert, kan vertikale blanktegn (linjeskift og vognretur)
      fjernes etter skilletegn.
    values: "`true` / `false` (standard: `true`)"
  include_horizontal_ws:
    description: Ta med horisontale tabulatorer i korrigeringene.
    help: |
      Når dette er aktivert, kan horisontale tabulatortegn fjernes etter
      skilletegn.
    values: "`true` / `false` (standard: `true`)"
processingNotes:
  - "Behandler bare målteksten. Et mållokale er påkrevd, og bare eksisterende måltekster behandles."
  - "Korrigering av tegnsetting fjerner blanktegn rett etter hvert aktivert skilletegn, begrenset til blanktegntypene som er inkludert."
examples:
  - title: Normaliser mellomrom for et språkområde
    description: Bruk standardoppryddingen av blanktegn på en måltekst.
    config: |
      target_locale: fr
  - title: Rydd opp i mellomrom ved CJK-tegnsetting
    description: Fjern mellomrom etter tegnsetting i en måltekst som ikke bruker mellomrom som skilletegn.
    config: |
      target_locale: zh-Hans
      correct_full_stop: true
      correct_comma: true
