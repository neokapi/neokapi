# Native reference doc for the built-in `voice-check` tool.
# Schema source: core/ai/tools/voicecheck.go (VoiceCheckConfig).
description: "Vurder kildeteksten i hver blokk mot en stemmeprofil ved hjelp av en LLM, og registrer funnene og en poengsum for etterlevelse."
overview: |
  Verktøyet **AI Voice Check** sender kildeteksten i hver blokk til en konfigurert LLM-leverandør sammen med retningslinjene i en stemmeprofil. Det mottar strukturerte funn innenfor fire dimensjoner: tone, stil, klarhet og merkevaresamsvar. Hvert funn har en alvorlighetsgrad, en melding og et forslag til omformulering. Verktøyet beregner en samlet poengsum for etterlevelse og lagrer poengsummen og eventuelle funn i blokkens egenskaper. Det legger også til en `voice`-annotasjon med begge deler. Blokker med tom kildetekst eller kildetekst som bare består av blanktegn, hoppes over.

  En stemmeprofil er konteksttypen som beskriver hvordan innhold skal fremstå språklig. En vanlig bruk er å beskrive en merkevares tone. Verktøyet kan få tilgang til profilen på tre måter: ved at `profile_id` angir et navn som slås opp i det lokale lageret, ved at verten leverer en profil som allerede er slått opp (kommandoen `kapi voice` eller prosjektets `defaults.voice`-binding), eller ved at profilen slås opp ved første gangs bruk i hierarkiet for organisasjonskontekst. Uten en profil inneholder ledeteksten ingen retningslinjer, og modellen blir bedt om å vurdere uten retningslinjer.

  Dette verktøyet gjør modellbaserte vurderinger. `voice-vocab-check` er det deterministiske motstykket. Det sammenligner ordforrådet og stilmønstrene i profilen som regler, uten legitimasjon eller nettverk. Kjør det først, slik at modellen brukes til det regler ikke kan avgjøre.
parameters:
  provider:
    description: LLM-leverandørens backend som skal brukes.
    help: |
      Velger hvilken modellbackend som utfører vurderingen.
    values: "`anthropic` (standard), `openai`, `gemini`, `azureopenai`, `ollama` (lokal, ingen nøkkel)"
  api_key:
    description: API-nøkkel for KI-leverandøren.
    help: |
      Legitimasjon for den valgte leverandøren. En lokal leverandør som Ollama trenger kanskje ingen. Bruk helst legitimasjonslageret eller miljøet fremfor å skrive en nøkkel inn i en oppskrift.
    values: "streng"
  model:
    description: Navnet på modellen som skal forespørres fra leverandøren.
    help: |
      Den leverandørspesifikke modellidentifikatoren. Hvis den utelates, brukes leverandørens standardmodell.
    values: "streng"
  profile_id:
    description: Stemmeprofil som skal slås opp i det lokale lageret.
    help: |
      Identifikatoren til profilen med retningslinjene teksten vurderes opp mot.
      Verten kan i stedet levere en profil som allerede er slått opp. Da trengs ikke
      identifikatoren.
    values: "streng"
limitations:
  - Krever leverandørlegitimasjon og utfører ett eksternt API-kall per blokk.
  - Funnene genereres av modellen. To kjøringer på samme tekst kan gi ulike resultater.
  - "Vurderer bare kildetekst. Blokker med tom kildetekst eller kildetekst som bare består av blanktegn, hoppes over."
processingNotes:
  - Behandler blokker. Som standard vurderes blokkene parallelt for å øke gjennomstrømmingen.
  - "Samsvarsskåren og eventuelle funn skrives til blokkens egenskaper, og en `voice`-annotasjon inneholder begge deler."
  - Det er ikke en feil hvis en profil ikke kan slås opp. Kjøringen fortsetter uten retningslinjer i ledeteksten.
examples:
  - title: Vurder mot en lagret profil
    description: "Slå opp en profil etter navn i det lokale lageret, og vurder hver blokk mot profilen."
    config: |
      provider: anthropic
      profile_id: house-style
