# Native reference doc for the built-in `voice-infer` tool.
# Schema source: core/ai/tools/voiceinfer.go (VoiceInferConfig, InferOptions).
description: Lag et utkast til en stemmeprofil fra eksisterende innhold med en LLM. Utkastet inneholder sikkerhetsvurderinger og kildehenvisninger for hvert felt.
overview: |
  Verktøyet **AI Voice Inference** leser en innholdsmengde og foreslår en
  stemmeprofil basert på hvordan innholdet er skrevet. Det er motsatsen til
  `voice-check`, som kontrollerer innhold mot en eksisterende profil. Verktøyet
  kan brukes til å utlede en profil fra et korpus med en konsekvent skrivestil,
  i stedet for å skrive profilen manuelt.

  Utledningen skjer på korpusnivå, ikke per blokk. Alle deler passerer uendret
  mens verktøyet samler kildeteksten fra hver blokk. Når inndatastrømmen slutter,
  kjøres én utledning. Korpuset avkortes ved en runegrense før det sendes. Dermed
  krever selv et stort dokumentsett bare én forespørsel med begrenset størrelse.
  Hvis strømmen er tom, finnes det ikke noe grunnlag for utledning. Verktøyet
  rapporterer da at kjøringen lyktes, uten å gi et utkast.

  Resultatet er et utkast i det vanlige stemmeprofilformatet, med tone, stil,
  ordforråd og før- og ettereksempler. Du leser det fra `Draft()` etter at flyten
  er fullført. Resultatet inneholder også en separat dokumentasjon med modellens
  sikkerhetsvurdering og et kort kildepunkt for hvert felt på øverste nivå.
  Dokumentasjonen lagres ved siden av profilen, ikke i den. Dermed kan utkastet
  leses fra og skrives tilbake til den samme `profile.yaml`-filen som redigeres
  manuelt. Behandle resultatet som et utkast til gjennomgang og innsjekking.
parameters:
  provider:
    description: LLM-leverandøren som skal brukes.
    help: |
      Velger hvilken modell som skal utføre utledningen.
    values: "`anthropic` (standard), `openai`, `gemini`, `azureopenai`, `ollama` (lokal, uten nøkkel)"
  api_key:
    description: API-nøkkel for KI-leverandøren.
    help: |
      Påloggingsinformasjon for den valgte leverandøren. En lokal leverandør som
      Ollama trenger kanskje ikke dette. Bruk helst lagringsstedet for
      påloggingsinformasjon eller miljøet fremfor å skrive en nøkkel inn i en oppskrift.
    values: "string"
  model:
    description: Navnet på modellen som skal forespørres fra leverandøren.
    help: |
      Den leverandørspesifikke modellidentifikatoren. Hvis den utelates, brukes
      leverandørens standardmodell.
    values: "string"
  profile_name:
    description: Navn på profilutkastet.
    help: |
      Navnet på utkastet. Hvis navnet utelates, får utkastet navnet «Inferred Voice».
    values: "string"
  domain:
    description: Et hint om fagområdet som flettes inn i prompten.
    help: |
      En kort angivelse av fagområdet («medisin», «utviklerverktøy», «offentlig
      sektor») som styrer hvilket språklig register modellen tolker korpuset i.
      Uten en slik angivelse taler korpuset for seg selv.
    values: "string"
  max_examples:
    description: Hvor mange før- og ettereksempler utkastet kan inneholde.
    help: |
      Begrenser antallet omskrivingseksempler som forespørres fra modellen og utelates fra
      svaret. Standardverdien er 3.
    values: "heltall ≥ 1 (standardverdi `3`)"
limitations:
  - Krever påloggingsinformasjon for leverandøren og gjør ett eksternt API-kall per kjøring.
  - Korpuset avkortes før det sendes. For et svært stort innholdssett utledes profilen derfor fra begynnelsen av settet.
  - "Resultatet er et utkast som må gjennomgås. Sikkerhetsvurderingen er modellens eget anslag, ikke en måling."
processingNotes:
  - Alle deler passerer uendret. Verktøyet legger ikke til merknader i innholdet.
  - "Korpuset består av kildeteksten fra hver blokk, samlet gjennom hele strømmen. Inferens kjøres én gang, når strømmen avsluttes."
  - "Et tomt korpus eller et korpus som bare inneholder blanktegn, gir ikke noe utkast og fører ikke til en feil."
examples:
  - title: Lag et profilutkast fra et dokumentasjonssett
    description: Gi utkastet et navn og angi fagområdet. Korpuset er innholdet som flyten leser.
    config: |
      provider: anthropic
      profile_name: House Style
      domain: developer tools
