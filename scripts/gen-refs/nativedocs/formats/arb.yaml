# Native reference doc for the built-in `arb` format.
# Schema source: core/formats/arb/config.go (Config) + schema.go.
# No Okapi equivalent: ARB is Flutter/Dart specific.
description: Extract and update translatable messages in Flutter Application Resource Bundle (.arb) files.
overview: |
  The **Flutter ARB** format reads `.arb` files, the JSON message-resource
  format used by Flutter's `gen-l10n` tooling and the Dart `intl` package.
  Each file is monolingual: one locale (named by `@@locale`, or inferred from
  the filename), where resource keys map to ICU MessageFormat message strings.

  Each message becomes a translatable block. Sibling `@<id>` objects describe a
  resource (its `description` and `placeholders`) and `@@<global>` keys hold
  file metadata (`@@locale`, `@@last_modified`, `@@author`, `@@context`); both
  are preserved verbatim and never extracted. An ICU placeholder (`{name}`) is
  protected as an inline code. A plural (`{count, plural, …}`), selectordinal
  or select (`{g, select, …}`) is read with its branches: the words of each
  branch are translated and edited one branch at a time, with `#` and any
  placeholder inside a branch protected as inline codes, while the keyword,
  the branch keys and the layout are written as they were read.
  `@description` is surfaced as a translator note. Output is byte-faithful:
  key order, JSON escaping, and all `@`/`@@` metadata round-trip untouched,
  and an edit rewrites only the value it changes.
parameters:
  descriptionNotes:
    description: Surface each resource's @description as a translator note.
    help: |
      When enabled (the default), the `description` field of a message's
      sibling `@<id>` attribute object is attached to the block as a
      translator note. Disable to ignore descriptions.
    values: "`true` / `false` (default `true`)"
processingNotes:
  - One file = one locale; the message value is the block's source content.
  - "`@<id>` attribute objects and `@@<global>` metadata are preserved but not extracted as translatable content."
  - ICU placeholders are protected as inline codes; plurals, selectordinals and selects are read with their branches, and an edit to one branch changes that branch alone.
  - "`kapi extract` leaves a message holding a plural or select out of an XLIFF or PO exchange file and names it; `kapi translate` translates each of its branches."
examples:
  - title: Ignore descriptions
    description: Do not turn @description values into translator notes.
    config: |
      descriptionNotes: false
