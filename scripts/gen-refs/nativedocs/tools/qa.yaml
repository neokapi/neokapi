# Native reference doc for the built-in `qa` tool.
# Schema source: core/ai/tools/unified.go (checkGroup: the `mode` selector over
# core/tools RuleCheckConfig and AICheckConfig). `mode` selects the backend;
# `provider`, `apiKey`, `model` and `checks` apply only in `ai` mode.
description: Check each translation against its source, with deterministic rules or an AI review.
overview: |
  The **Quality Check** tool compares each block's source with its translation
  in the language `--target-lang` names, and reports what it finds. `--mode`
  selects how:

  - `rules`, the default, runs deterministic checks on your machine with no
    credentials. They cover empty and identical targets, whitespace, doubled
    words, inline codes, span constraints, characters, length, and, when you
    enable them, consistency across the run.
  - `ai` sends each translated block's source and translation to the provider
    `--provider` names, which reviews the dimensions in `--checks`. A hosted
    provider needs a credential. `--provider` and `--model` apply only in this
    mode.

  The tool reads a file that holds both languages, such as XLIFF. Findings print
  on standard output as a table, or as a JSON report with `--json`. Each finding
  is marked as failing or reported, and the run exits 0 whatever it finds.
parameters:
  mode:
    description: How to check the translations.
    help: |
      `rules` runs the deterministic checks below locally and calls no model.
      `ai` asks an AI provider to review each translation, using `provider`,
      `apiKey`, `model` and `checks`. The rule toggles apply only to `rules`.
    values: "`rules` / `ai` (default `rules`)"
  provider:
    description: AI provider for the review (`ai` mode).
    help: |
      The provider that reviews each translation when `mode` is `ai`. The options
      come from the provider registry; `demo` returns illustrative output with
      no credentials. In `rules` mode the value is ignored.
    values: "a provider id (default `anthropic`)"
    dependsOn:
      - property: mode
        condition: applies only when `mode` is `ai`
  apiKey:
    description: API key for the AI provider (`ai` mode).
    help: |
      Credential for a hosted provider. A saved credential (`--credential`) is
      used when this is empty.
    values: "string"
  model:
    description: The model name to request (`ai` mode).
    help: |
      The provider-specific model identifier. When omitted, the provider's
      default model is used.
    values: "string"
  checks:
    description: Quality dimensions for the AI review (`ai` mode).
    help: |
      The dimensions the provider reviews, such as terminology, fluency,
      accuracy and consistency. The review reports a finding as failing when the
      provider rates it an error.
    values: "list of strings (default `terminology`, `fluency`, `accuracy`)"
  checkLeadingWhitespace:
    description: Check for leading-whitespace mismatches between source and target.
    help: |
      Reports a finding when the leading whitespace of the target differs from
      that of the source.
    values: "`true` / `false` (default `true`)"
  checkTrailingWhitespace:
    description: Check for trailing-whitespace mismatches between source and target.
    help: |
      Reports a finding when the trailing whitespace of the target differs from
      that of the source.
    values: "`true` / `false` (default `true`)"
  checkEmptyTarget:
    description: Fail when the target is empty but the source has content.
    help: |
      Fails a block that has source content and no target, or an empty one. A
      block with no translation in the target language gets this check and no
      other.
    values: "`true` / `false` (default `true`)"
  checkEmptySource:
    description: Report a non-empty target whose source is empty.
    help: |
      Reports a finding when the target has content but the source is empty.
    values: "`true` / `false` (default `true`)"
  checkTargetSameAsSource:
    description: Report a target identical to its source.
    help: |
      Reports a finding when the target equals the source and contains at least
      one letter or digit. Number-only blocks are governed by
      `targetSameAsSourceWithNumbers`.
    values: "`true` / `false` (default `true`)"
  targetSameAsSourceWithCodes:
    description: Include inline codes when comparing source and target for identity.
    help: |
      Controls whether inline codes are taken into account in the
      same-as-source comparison.
    values: "`true` / `false` (default `true`)"
  targetSameAsSourceWithNumbers:
    description: Include number-only blocks in the same-as-source comparison.
    help: |
      When enabled, blocks containing only numbers and punctuation are included
      in the same-as-source check. Disable it to ignore them, since they are
      often legitimately identical.
    values: "`true` / `false` (default `true`)"
  checkDoubleSpaces:
    description: Check for double spaces in the target.
    help: |
      Reports a finding when the target contains two consecutive spaces.
    values: "`true` / `false` (default `true`)"
  checkDoubledWord:
    description: Check for consecutive repeated words in the target.
    help: |
      Reports a finding when the same word appears twice in a row in the target,
      unless the word is listed in `doubledWordExceptions`.
    values: "`true` / `false` (default `true`)"
  doubledWordExceptions:
    description: Words allowed to repeat consecutively.
    help: |
      A semicolon-separated list of words that may legitimately appear twice in a
      row (for example certain pronouns), so the doubled-word check passes them.
    values: "string (default `sie;vous;nous`)"
    dependsOn:
      - property: checkDoubledWord
        condition: only consulted when the doubled-word check is enabled
  checkTerminology:
    description: Reserved; the rule checks read no terms.
    help: |
      The rule checks ignore this setting. To check translations against the
      terms store, run the `term-check` tool.
    values: "`true` / `false` (default `false`)"
  checkSpanConstraints:
    description: Check non-deletable and non-cloneable span constraint violations.
    help: |
      Fails a block when a non-deletable inline code is missing from the target,
      or a non-cloneable inline code is duplicated in it, according to the
      per-code constraints carried on the source runs.
    values: "`true` / `false` (default `true`)"
  checkCodeDifference:
    description: Verify that the target has the same inline codes as the source.
    help: |
      Reports findings when inline codes are missing from or extra in the target
      compared with the source, counted by code type.
    values: "`true` / `false` (default `true`)"
  strictCodeOrder:
    description: Report codes that appear in a different order.
    help: |
      When enabled, and no count differences were found, the target is reported
      if its inline codes appear in a different order than in the source.
    values: "`true` / `false` (default `false`)"
    dependsOn:
      - property: checkCodeDifference
        condition: the order check runs alongside code-difference checking
  checkPatterns:
    description: Verify that source patterns have expected corresponding content in the target.
    help: |
      When enabled, configured source/target regex pattern pairs are checked so
      that patterns found in the source are preserved in the target, and
      forbidden patterns fail the block. The pattern pairs themselves are
      supplied programmatically.
    values: "`true` / `false` (default `true`)"
  checkCorruptedCharacters:
    description: Fail a target that shows encoding corruption.
    help: |
      Fails a block whose target contains signs of encoding corruption: UTF-8
      misread as ISO-8859-1, the Unicode replacement character, or stray control
      characters.
    values: "`true` / `false` (default `true`)"
  forbiddenChars:
    description: Characters that must not appear in the target.
    help: |
      Each character listed here fails a block whose target contains it.
    values: "string (default empty)"
    examples:
      - "`{}[]` fails any target that contains a brace or a bracket"
  requiredChars:
    description: Characters the target must keep when the source has them.
    help: |
      Reports a finding for each listed character that occurs in the source and
      is missing from the target.
    values: "string (default empty)"
  checkCharset:
    description: Report target characters outside a character set encoding.
    help: |
      Reports a finding when the target contains a character that the encoding
      named by `charset` cannot represent.
    values: "`true` / `false` (default `false`)"
  charset:
    description: Character set encoding the target is checked against.
    help: |
      An IANA character set name, such as `ISO-8859-1` or `US-ASCII`.
    values: "string (default `ISO-8859-1`)"
    dependsOn:
      - property: checkCharset
        condition: only consulted when the charset check is enabled
  checkTargetInconsistency:
    description: Fail a source translated differently across the run.
    help: |
      Fails a block whose source occurs earlier in the run with a different
      translation, and names the other translations.
    values: "`true` / `false` (default `false`)"
  checkSourceInconsistency:
    description: Fail a translation shared by different sources.
    help: |
      Fails a block whose translation occurs earlier in the run for a different
      source, and names the other sources.
    values: "`true` / `false` (default `false`)"
  consistencyCaseSensitive:
    description: Whether the consistency checks compare letter case.
    help: |
      When disabled, two blocks that differ only in letter case count as the
      same for the two consistency checks.
    values: "`true` / `false` (default `true`)"
  checkMaxCharLength:
    description: Report targets longer than a percentage of source character length.
    help: |
      Enables the maximum length-ratio check, using a long/short model: the
      allowed percentage depends on whether the source is above or below the
      maximum breakpoint.
    values: "`true` / `false` (default `true`)"
  maxCharLengthBreak:
    description: Character count above which a source is considered long (max check).
    help: |
      A source longer than this is treated as long for the maximum-ratio check;
      a shorter one is treated as short.
    values: "integer (default `20`)"
  maxCharLengthAbove:
    description: Maximum allowed percentage of source length for a long source.
    help: |
      The maximum target/source ratio applied when the source is long.
    values: "integer (default `200`)"
  maxCharLengthBelow:
    description: Maximum allowed percentage of source length for a short source.
    help: |
      The maximum target/source ratio applied when the source is short.
    values: "integer (default `350`)"
  checkMinCharLength:
    description: Report targets shorter than a percentage of source character length.
    help: |
      Enables the minimum length-ratio check, using a long/short model: the
      required percentage depends on whether the source is above or below the
      minimum breakpoint.
    values: "`true` / `false` (default `true`)"
  minCharLengthBreak:
    description: Character count above which a source is considered long (min check).
    help: |
      A source longer than this is treated as long for the minimum-ratio check;
      a shorter one is treated as short.
    values: "integer (default `20`)"
  minCharLengthAbove:
    description: Minimum required percentage of source length for a long source.
    help: |
      The minimum target/source ratio applied when the source is long.
    values: "integer (default `45`)"
  minCharLengthBelow:
    description: Minimum required percentage of source length for a short source.
    help: |
      The minimum target/source ratio applied when the source is short.
    values: "integer (default `30`)"
  checkAbsoluteMaxCharLength:
    description: Report a target that exceeds an absolute character count.
    help: |
      When enabled, a target longer than `absoluteMaxCharLength` characters is
      reported, whatever the length of its source.
    values: "`true` / `false` (default `false`)"
    dependsOn:
      - property: absoluteMaxCharLength
        condition: sets the limit applied when this check is enabled
  absoluteMaxCharLength:
    description: Maximum number of characters allowed in a target.
    help: |
      The absolute character cap used by the absolute-maximum-length check.
    values: "integer (default `255`)"
    dependsOn:
      - property: checkAbsoluteMaxCharLength
        condition: must be enabled for this limit to take effect
  checkMaxWords:
    description: Report a target that exceeds an absolute word count.
    help: |
      When enabled, a target with more words than `maxWords` is reported.
    values: "`true` / `false` (default `false`)"
    dependsOn:
      - property: maxWords
        condition: sets the limit; `0` leaves the check without effect
  maxWords:
    description: Maximum number of words allowed in a target.
    help: |
      The word limit used by the maximum-words check.
    values: "integer (default `0`)"
    dependsOn:
      - property: checkMaxWords
        condition: must be enabled for this limit to take effect
limitations:
  - Length and ratio checks compare character lengths only when source and target are both non-empty.
  - The regex pattern pairs used by `checkPatterns` are supplied programmatically, not as schema parameters.
  - Requires a target language. The tool compares translations in that one language per run.
processingNotes:
  - Operates on translatable blocks; non-translatable structure passes through unchanged.
  - When a block has no translation in the target language, only the empty-target check applies.
  - Findings are recorded on the block as a findings annotation, which `kapi exec qa` prints as its report.
  - The consistency checks compare each block with the blocks before it in the same run.
examples:
  - title: Inline-code and whitespace checks only
    description: Focus on code preservation and whitespace, disabling the length-ratio checks.
    config: |
      checkCodeDifference: true
      checkLeadingWhitespace: true
      checkTrailingWhitespace: true
      checkMaxCharLength: false
      checkMinCharLength: false
  - title: Enforce an absolute character cap
    description: Report any target longer than 200 characters.
    config: |
      checkAbsoluteMaxCharLength: true
      absoluteMaxCharLength: 200
  - title: Review with an AI provider
    description: Ask the provider to review fluency and accuracy.
    config: |
      mode: ai
      provider: anthropic
      checks: [fluency, accuracy]
