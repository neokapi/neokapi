rules:
  - id: hygiene.empty
    severity: major
    reports: The block holds nothing but whitespace. It is the only finding reported for that block, because the rest have nothing to judge.
    fix: Give the block content, or remove the block from the source.
  - id: hygiene.leading-whitespace
    severity: minor
    reports: Whitespace at the start of the block that an author left there.
    fix: Remove the leading whitespace from the source text.
  - id: hygiene.trailing-whitespace
    severity: minor
    reports: Whitespace at the end of the block, beyond a single terminating line break, that an author left there.
    fix: Remove the trailing whitespace from the source text.
  - id: hygiene.double-spaces
    severity: minor
    reports: Two or more spaces between two pieces of content on one line. In a comment the finding is major and covers a run of exactly two spaces.
    fix: Replace the run of spaces with one space.
  - id: hygiene.doubled-word
    severity: minor
    reports: A word immediately repeated, compared without regard to case. The finding quotes the word.
    fix: Remove the repeated word.
  - id: hygiene.control-char
    severity: minor
    reports: A stray control character, named by its code point. Tab, carriage return and line feed are ordinary whitespace and are never reported.
    fix: Remove the control character, or replace it with the character the text needs.
