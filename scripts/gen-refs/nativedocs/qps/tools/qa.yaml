    ŵöŕđš, îñļîñé çöđéš, šþàñ çöñšţŕàîñţš, çĥàŕàçţéŕš, ļéñĝţĥ, àñđ, ŵĥéñ ýöü
    éñàƃļé ţĥéḿ, çöñšîšţéñçý àçŕöšš ţĥé ŕüñ.
  - `àî` šéñđš éàçĥ ţŕàñšļàţéđ ƃļöçķ'š šöüŕçé àñđ ţŕàñšļàţîöñ ţö ţĥé þŕöṽîđéŕ
    `--þŕöṽîđéŕ` ñàḿéš, ŵĥîçĥ ŕéṽîéŵš ţĥé đîḿéñšîöñš îñ `--çĥéçķš`. À ĥöšţéđ
    þŕöṽîđéŕ ñééđš à çŕéđéñţîàļ. `--þŕöṽîđéŕ` àñđ `--ḿöđéļ` àþþļý öñļý îñ ţĥîš
    ḿöđé.

  Ţĥé ţööļ ŕéàđš à ƒîļé ţĥàţ ĥöļđš ƃöţĥ ļàñĝüàĝéš, šüçĥ àš ẊĻÎƑƑ. Ƒîñđîñĝš þŕîñţ
