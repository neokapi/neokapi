  provider:
    description: ĻĻḾ þŕöṽîđéŕ ƒöŕ ÀÎ-ĵüđĝéđ çĥéçķš (öḿîţ ƒöŕ ŕüļé-ƃàšéđ çĥéçķš).
    help: |
      Ŵĥéñ šéţ, ţĥé ţööļ ŕüñš àš àñ ĻĻḾ ĵüđĝé üšîñĝ ţĥîš þŕöṽîđéŕ îñšţéàđ öƒ ţĥé
      đéţéŕḿîñîšţîç ŕüļé çĥéçķš. Öþţîöñš àŕé þöþüļàţéđ ƒŕöḿ ţĥé þŕöṽîđéŕ
      ŕéĝîšţŕý. Ļéàṽé éḿþţý ţö ŕüñ ţĥé ŕüļé-ƃàšéđ çĥéçķš ŵîţĥ ñö çŕéđéñţîàļš.
