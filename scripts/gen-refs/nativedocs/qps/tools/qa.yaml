# Native reference doc for the built-in `qa` tool.
# Schema source: core/ai/tools/unified.go (CheckSchema, over core/tools RuleCheckConfig
# plus the LLM provider fields). With no --provider, qa runs the deterministic
# rule-based checks below; with --provider it runs LLM-judged checks.
description: "Çĥéçķ ţŕàñšļàţîöñ ǫüàļîţý ŵîţĥ ŕüļé-ƃàšéđ çĥéçķš, öŕ àñ ĻĻḾ ŵĥéñ à þŕöṽîđéŕ îš šéţ."
overview: |
  Ţĥé **Ǫüàļîţý Çĥéçķ** ţööļ ŕüñš à ƃàţţéŕý öƒ ŕüļé-ƃàšéđ çĥéçķš öṽéŕ éàçĥ
  ţŕàñšļàţîöñ àñđ ŕéçöŕđš ţĥé ƒîñđîñĝš öñ ţĥé ƃļöçķ'š þŕöþéŕţîéš àš à ĴŠÖÑ àŕŕàý
  öƒ ƒîñđîñĝš, àļöñĝ ŵîţĥ à þàšš/ƒàîļ ƒļàĝ. Ţĥé çĥéçķš šþàñ šéṽéŕàļ çàţéĝöŕîéš:
  ĝéñéŕàļ ţéẋţ îššüéš (éḿþţý ţàŕĝéţ, ŵĥîţéšþàçé ḿîšḿàţçĥéš, đöüƃļé šþàçéš,
  đöüƃļéđ ŵöŕđš, ţàŕĝéţ îđéñţîçàļ ţö šöüŕçé, çöŕŕüþţéđ çĥàŕàçţéŕš), îñļîñé-çöđé
  çöñšîšţéñçý, šþàñ çöñšţŕàîñţ ṽîöļàţîöñš, ŕéĝéẋ þàţţéŕñ þŕéšéŕṽàţîöñ, àñđ ļéñĝţĥ
  ŕàţîöš. À ţàŕĝéţ ļöçàļé îš ŕéǫüîŕéđ; ŵĥéñ à ƃļöçķ ĥàš ñö ţŕàñšļàţîöñ, öñļý ţĥé
  éḿþţý-ţàŕĝéţ çĥéçķ àþþļîéš.

  Ŵîţĥ ñö `--þŕöṽîđéŕ`, ţĥé çĥéçķš àŕé đéţéŕḿîñîšţîç àñđ ñééđ ñö çŕéđéñţîàļš.
  Šéţţîñĝ `--þŕöṽîđéŕ` îñšţéàđ ŕüñš ĻĻḾ-ĵüđĝéđ çĥéçķš: ţĥé çĥöšéñ ḿöđéļ ŕéṽîéŵš éàçĥ
  ţŕàñšļàţîöñ ƒöŕ ţéŕḿîñöļöĝý, ƒļüéñçý, àñđ àççüŕàçý. Ţĥé ŕüļé-ƃàšéđ ţöĝĝļéš
  ƃéļöŵ àþþļý ţö ţĥé đéţéŕḿîñîšţîç ḿöđé; `ḿöđéļ` àñđ `çĥéçķš` àþþļý ţö ţĥé ĻĻḾ
  ḿöđé. Éṽéŕý ŕüļé çĥéçķ çàñ ƃé ţöĝĝļéđ îñđéþéñđéñţļý, àñđ ţĥé ļéñĝţĥ çĥéçķš
  šĥàŕé ţĥé ļöñĝ/šĥöŕţ ŕàţîö ḿöđéļ üšéđ ƃý ţĥé đéđîçàţéđ ļéñĝţĥ-çĥéçķ ţööļ.
