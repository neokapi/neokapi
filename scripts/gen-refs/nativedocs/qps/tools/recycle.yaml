limitations:
  - Ŕéǫüîŕéš à ţàŕĝéţ ļàñĝüàĝé àñđ à çöñţéñţ-ḿéḿöŕý þŕöṽîđéŕ; ŵîţĥ ñö Ḿéḿöŕý ţĥéŕé îš ñöţĥîñĝ ţö ļéṽéŕàĝé.
processingNotes:
  - Öþéŕàţéš öñ ţŕàñšļàţàƃļé ƃļöçķš ŵîţĥ à ñöñ-éḿþţý šöüŕçé; öţĥéŕ þàŕţš þàšš ţĥŕöüĝĥ üñçĥàñĝéđ.
  - Éẋàçţ ḿàţçĥéš àŕé ţŕîéđ ƃéƒöŕé ƒüžžý ḿàţçĥéš; ţĥé ḿàţçĥ šçöŕé àñđ ţýþé àŕé ŕéçöŕđéđ àš ƃļöçķ þŕöþéŕţîéš.
  - "Ŵîţĥ à šţŕüçţüŕé-àŵàŕé çöñţéñţ-ḿéḿöŕý þŕöṽîđéŕ, ḿàţçĥîñĝ ŕüñš àĝàîñšţ ţĥé ƃļöçķ'š îñļîñé-çöđé šţŕüçţüŕé àñđ ƒîļļš çàŕŕý ţĥé ḿàţçĥéđ éñţŕý'š ŕüñš, šö ḿàŕķüþ þļàçéĥöļđéŕš šüŕṽîṽé ţĥé ƒîļļ; à 100% ḿàţçĥ ḿéàñš ţéẋţ àñđ šţŕüçţüŕé àĝŕéé."
  - Àḿƃîĝüöüš ḿàţçĥéš (šéṽéŕàļ ƒüļļ-šçöŕé éñţŕîéš ŵîţĥ đîƒƒéŕîñĝ ţàŕĝéţš) àŕé ŕéçöŕđéđ ƃüţ ñéṽéŕ ƒîļļ ţĥé ţàŕĝéţ; ţĥé çĥöîçé šüŕƒàçéš ƒöŕ ŕéṽîéŵ îñšţéàđ öƒ ƃéîñĝ þîçķéđ ƃý šţöŕàĝé öŕđéŕ.
