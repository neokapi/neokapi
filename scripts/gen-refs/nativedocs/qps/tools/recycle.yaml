    dependsOn:
      - property: makeTmx
        condition: ŢḾẊ ĝéñéŕàţîöñ ḿüšţ ƃé éñàƃļéđ
  downgradeIdenticalBestMatches:
    description: Ŕéđüçé ţĥé šçöŕé ŵĥéñ ḿüļţîþļé îđéñţîçàļ éẋàçţ ḿàţçĥéš éẋîšţ.
    help: |
      Ŵĥéñ éñàƃļéđ, àñ éẋàçţ ḿàţçĥ îš šçöŕéđ 99 îñšţéàđ öƒ 100 îƒ ţĥé çöñţéñţ ḿéḿöŕý ŕéţüŕñš
      ḿüļţîþļé îđéñţîçàļ ƃéšţ ḿàţçĥéš, ƒļàĝĝîñĝ ţĥé àḿƃîĝüîţý ƒöŕ ŕéṽîéŵ.
