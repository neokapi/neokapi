# Native reference doc for the built-in `recycle` tool (content-memory leverage).
# Schema source: core/tools/memoryleverage.go (MemoryLeverageConfig).
description: Þŕé-ƒîļļ ţŕàñšļàţîöñš ƒŕöḿ à çöñţéñţ ḿéḿöŕý üšîñĝ éẋàçţ àñđ ƒüžžý ḿàţçĥîñĝ.
overview: |
  Ţĥé **Ŕéçýçļé** ţööļ ǫüéŕîéš à çöñţéñţ ḿéḿöŕý (Ḿéḿöŕý) ƒöŕ éàçĥ ƃļöçķ'š
  šöüŕçé ţéẋţ àñđ þŕé-ƒîļļš ţĥé ţàŕĝéţ ŵîţĥ ţĥé ƃéšţ ḿàţçĥ. Îţ ţŕîéš àñ éẋàçţ
  ḿàţçĥ ƒîŕšţ, ţĥéñ à ƒüžžý ḿàţçĥ àƃöṽé à çöñƒîĝüŕàƃļé ţĥŕéšĥöļđ, ŕéçöŕđîñĝ ţĥé
  ḿàţçĥ šçöŕé àñđ ţýþé (`éẋàçţ` öŕ `ƒüžžý`) öñ ţĥé ƃļöçķ. Îţ ŕéǫüîŕéš à ţàŕĝéţ
  ļàñĝüàĝé àñđ à çöñţéñţ-ḿéḿöŕý þŕöṽîđéŕ; ŵîţĥöüţ à çöñţéñţ ḿéḿöŕý ţĥé ţööļ ĥàš ñöţĥîñĝ ţö ļéṽéŕàĝé.

  Ŵĥéţĥéŕ à ḿàţçĥ îš ŵŕîţţéñ îñţö ţĥé ţàŕĝéţ îš ĝöṽéŕñéđ ƃý à ƒîļļ ţĥŕéšĥöļđ
  àñđ àñ "öñļý îƒ éḿþţý" öþţîöñ, šö ĥîĝĥ-çöñƒîđéñçé ḿàţçĥéš çàñ ƃé àþþļîéđ ŵĥîļé
  ŵéàķéŕ öñéš àŕé ŕéçöŕđéđ ƃüţ ļéƒţ ƒöŕ ŕéṽîéŵ. À ñö-ǫüéŕý ţĥŕéšĥöļđ ļéţš ţĥé
  ţööļ šķîþ ţĥé çöñţéñţ-ḿéḿöŕý ļööķüþ ŵĥéñ àñ éẋîšţîñĝ çàñđîđàţé àļŕéàđý šçöŕéš ĥîĝĥ éñöüĝĥ.
  Öþţîöñàļļý, àļļ ļéṽéŕàĝéđ ḿàţçĥéš çàñ ƃé ŵŕîţţéñ ţö à ŢḾẊ ƒîļé.
parameters:
  fuzzyThreshold:
    description: Ḿîñîḿüḿ šçöŕé ƒöŕ à ƒüžžý ḿàţçĥ ţö ƃé çöñšîđéŕéđ.
    help: |
      Ţĥé ļöŵéšţ ƒüžžý-ḿàţçĥ šçöŕé (0-100) ţĥé çöñţéñţ-ḿéḿöŕý ļööķüþ ŵîļļ ŕéţüŕñ. Ḿàţçĥéš
      ƃéļöŵ ţĥîš šçöŕé àŕé îĝñöŕéđ.
    values: "îñţéĝéŕ 0-100 (đéƒàüļţ `70`)"
  fillTarget:
    description: Çöþý ţĥé ƃéšţ ḿàţçĥ îñţö ţĥé ţàŕĝéţ.
    help: |
      Ŵĥéñ éñàƃļéđ, ţĥé ƃéšţ ǫüàļîƒýîñĝ ḿàţçĥ îš ŵŕîţţéñ îñţö ţĥé ƃļöçķ'š
      ţàŕĝéţ çöñţéñţ. Ŵĥéñ đîšàƃļéđ, ḿàţçĥéš àŕé šçöŕéđ àñđ ŕéçöŕđéđ ƃüţ ţĥé
      ţàŕĝéţ îš ñöţ ƒîļļéđ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
  fillTargetThreshold:
    description: Ḿîñîḿüḿ ḿàţçĥ šçöŕé ŕéǫüîŕéđ ţö ƒîļļ ţĥé ţàŕĝéţ.
    help: |
      À ḿàţçĥ ḿüšţ šçöŕé àţ ļéàšţ ţĥîš ṽàļüé ţö ƃé ŵŕîţţéñ îñţö ţĥé ţàŕĝéţ.
      Ḿàţçĥéš ƃéţŵééñ ţĥé ƒüžžý ţĥŕéšĥöļđ àñđ ţĥîš ṽàļüé àŕé ŕéçöŕđéđ ƃüţ ñöţ
      ƒîļļéđ.
    values: "îñţéĝéŕ 0-100 (đéƒàüļţ `95`)"
    dependsOn:
      - property: fillTarget
        condition: ƒîļļîñĝ ḿüšţ ƃé éñàƃļéđ ƒöŕ ţĥîš ţĥŕéšĥöļđ ţö àþþļý
  fillIfTargetIsEmpty:
    description: Öñļý ƒîļļ ţĥé ţàŕĝéţ ŵĥéñ îţ ĥàš ñö éẋîšţîñĝ çöñţéñţ.
    help: |
      Ŵĥéñ éñàƃļéđ, à ḿàţçĥ îš ŵŕîţţéñ öñļý îƒ ţĥé ƃļöçķ'š ţàŕĝéţ îš çüŕŕéñţļý
      éḿþţý, šö éẋîšţîñĝ ţŕàñšļàţîöñš àŕé ñéṽéŕ öṽéŕŵŕîţţéñ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  noQueryThreshold:
    description: Šķîþ ţĥé çöñţéñţ ḿéḿöŕý ǫüéŕý ŵĥéñ àñ éẋîšţîñĝ çàñđîđàţé šçöŕéš ĥîĝĥ éñöüĝĥ.
    help: |
      Îƒ ţĥé ƃļöçķ àļŕéàđý çàŕŕîéš à ḿàţçĥ šçöŕé àţ öŕ àƃöṽé ţĥîš ṽàļüé, ţĥé çöñţéñţ ḿéḿöŕý
      ļööķüþ îš šķîþþéđ. Ţĥé đéƒàüļţ öƒ 101 ḿéàñš ţĥé çöñţéñţ ḿéḿöŕý îš àļŵàýš ǫüéŕîéđ.
    values: "îñţéĝéŕ 0-101 (đéƒàüļţ `101`)"
  makeTmx:
    description: Ĝéñéŕàţé à ŢḾẊ đöçüḿéñţ öƒ ļéṽéŕàĝéđ ḿàţçĥéš.
    help: |
      Ŵĥéñ éñàƃļéđ, àļļ ļéṽéŕàĝéđ ḿàţçĥéš àŕé ŵŕîţţéñ ţö à ŢḾẊ ƒîļé àţ ţĥé
      çöñƒîĝüŕéđ öüţþüţ þàţĥ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
    dependsOn:
      - property: tmxPath
        condition: šéţ ţĥé öüţþüţ þàţĥ ŵĥéñ ĝéñéŕàţîñĝ ŢḾẊ
