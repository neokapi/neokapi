  öŕîĝîñàļš àŕé šţöŕéđ öñ ţĥé ƃļöçķ àš àñ îñ-þŕöçéšš šéçŕéţ àññöţàţîöñ ƃý
  đéƒàüļţ, öŕ ŵŕîţţéñ ţö à šîđéçàŕ ṽàüļţ ŵĥéñ à ṽàüļţ þàţĥ îš šüþþļîéđ (ţĥé
  éẋţéŕñàļ ḿöđé üšéđ ƃý `éẋţŕàçţ` → `ḿéŕĝé`).
