  (ţĥé šþàñ ŕéþļàçéḿéñţš þļüš ţĥé öŕîĝîñàļš ţö ṽàüļţ) àñđ ţĥé ƒŕàḿéŵöŕķ
  àþþļîéŕ ŕéŵŕîţéš ţĥé šöüŕçé, ŕéƃàšîñĝ šüŕṽîṽîñĝ ŕüñ-àñçĥöŕéđ öṽéŕļàýš šö àñ
  üþšţŕéàḿ àññöţàţöŕ'š ţéŕḿš öŕ éñţîţîéš ƒöļļöŵ ţĥé ŕéŵŕîţé.

