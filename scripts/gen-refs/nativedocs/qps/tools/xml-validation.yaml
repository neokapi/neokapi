  Ţĥé **ẊḾĻ Ṽàļîđàţîöñ** ţööļ çĥéçķš ţĥé šöüŕçé àñđ, öþţîöñàļļý, ţàŕĝéţ ţéẋţ öƒ
  éàçĥ ţŕàñšļàţàƃļé ƃļöçķ ƒöŕ ẊḾĻ ŵéļļ-ƒöŕḿéđñéšš àñđ ŕéçöŕđš ţĥé ŕéšüļţ öñ ţĥé
  ƃļöçķ'š þŕöþéŕţîéš: à ṽàļîđîţý ƒļàĝ àñđ, ŵĥéñ îñṽàļîđ, àñ éŕŕöŕ ḿéššàĝé
  îđéñţîƒýîñĝ ŵĥéţĥéŕ ţĥé šöüŕçé öŕ ţàŕĝéţ ƒàîļéđ àñđ ŵĥý. Éḿþţý ţéẋţ îš ţŕéàţéđ
  àš ṽàļîđ.

  Šöüŕçé ṽàļîđàţîöñ îš öñ ƃý đéƒàüļţ. Ţö ṽàļîđàţé ţĥé ţàŕĝéţ àš ŵéļļ, éñàƃļé ţĥé
  ţàŕĝéţ çĥéçķ àñđ šüþþļý à ţàŕĝéţ ļöçàļé. Ƃéçàüšé ƃļöçķ ţéẋţ îš öƒţéñ àñ ẊḾĻ
  ƒŕàĝḿéñţ ŕàţĥéŕ ţĥàñ à çöḿþļéţé đöçüḿéñţ, ţĥé ţööļ çàñ ŵŕàþ ţĥé ţéẋţ îñ à ŕööţ
  éļéḿéñţ ƃéƒöŕé þàŕšîñĝ šö à ƒŕàĝḿéñţ ŵîţĥ ḿüļţîþļé ţöþ-ļéṽéļ ñöđéš šţîļļ
  ṽàļîđàţéš.
