description: "Ŕéàđ àñđ ŵŕîţé ŢḾẊ ƃîļîñĝüàļ éẋçĥàñĝé ƒîļéš, öñé ƃļöçķ þéŕ ţŕàñšļàţîöñ üñîţ."
overview: |
  ŢḾẊ îš ţĥé ẊḾĻ îñţéŕçĥàñĝé ƒöŕḿàţ ƒöŕ çöñţéñţ ḿéḿöŕîéš, ţĥé þöŕţàƃļé ƒöŕḿ
  îñ ŵĥîçĥ ƃîļîñĝüàļ šéĝḿéñţ þàîŕš ḿöṽé ƃéţŵééñ ţööļš. À ŢḾẊ đöçüḿéñţ ĥöļđš
  à ĥéàđéŕ đéçļàŕîñĝ ţĥé šöüŕçé ļàñĝüàĝé (`šŕçļàñĝ`) àñđ à ƃöđý öƒ `<ţü>`
  ţŕàñšļàţîöñ üñîţš; éàçĥ üñîţ çàŕŕîéš öñé `<ţüṽ>` ţŕàñšļàţîöñ-üñîţ ṽàŕîàñţ
  þéŕ ļàñĝüàĝé, ŵîţĥ öþţîöñàļ üñîţ- àñđ ĥéàđéŕ-ļéṽéļ `<ñöţé>` àñđ `<þŕöþ>`
  ḿéţàđàţà.

  Ţĥé ŕéàđéŕ éḿîţš öñé ţŕàñšļàţàƃļé ƃļöçķ þéŕ `<ţü>`: ţĥé šöüŕçé šéĝḿéñţ
  ḿàţçĥéš ţĥé ĥéàđéŕ `šŕçļàñĝ` àñđ à ţàŕĝéţ šéĝḿéñţ îš þŕöđüçéđ ƒöŕ éàçĥ
  öţĥéŕ-ļàñĝüàĝé `<ţüṽ>`. Ţĥé ĥéàđéŕ àţţŕîƃüţéš àñđ àñý ĥéàđéŕ-ļéṽéļ ñöţé
  öŕ þŕöþéŕţý àŕé šüŕƒàçéđ àš à šîñĝļé ñöñ-ţŕàñšļàţàƃļé đàţà þàŕţ àĥéàđ
  öƒ ţĥé ƃļöçķš, ŵĥîļé üñîţ-ļéṽéļ ñöţéš àñđ þŕöþéŕţîéš àţţàçĥ ţö ţĥé
  ƃļöçķ. Ţĥîš ḿàķéš ŢḾẊ üšàƃļé ƃöţĥ àš àñ îñþüţ ƒöŕ ŕéṽîéŵ öŕ àļîĝñḿéñţ
  àñđ àš àñ öüţþüţ ƒöŕ éẋþöŕţîñĝ à ḿéḿöŕý. Îţ ḿîŕŕöŕš Okapi'š ŢḾẊ ƒîļţéŕ.
parameters:
  processAllTargets:
    description: Ŕéàđ éṽéŕý ţàŕĝéţ-ļàñĝüàĝé ṽàŕîàñţ îñ éàçĥ ţŕàñšļàţîöñ üñîţ.
    help: |
      Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ), àļļ ñöñ-šöüŕçé `<ţüṽ>` ṽàŕîàñţš öƒ à
      `<ţü>` àŕé ŕéàđ, þŕöđüçîñĝ à ţàŕĝéţ šéĝḿéñţ ƒöŕ éàçĥ ļàñĝüàĝé. Ŵĥéñ
      đîšàƃļéđ, öñļý ţĥé ƒîŕšţ ñöñ-šöüŕçé ṽàŕîàñţ îš ŕéàđ àñđ ţĥé ŕéšţ àŕé
      šķîþþéđ, ŵĥîçĥ šüîţš à ḿüļţîļîñĝüàļ ḿéḿöŕý ţĥàţ šĥöüļđ ƃé ŕéđüçéđ ţö à
      šîñĝļé ţàŕĝéţ ļàñĝüàĝé.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
  exitOnInvalid:
    description: Šţöþ þŕöçéššîñĝ ŵĥéñ àñ îñṽàļîđ ţŕàñšļàţîöñ üñîţ îš éñçöüñţéŕéđ.
    help: |
      Ĝöṽéŕñš éŕŕöŕ ĥàñđļîñĝ ƒöŕ ḿàļƒöŕḿéđ `<ţü>` éļéḿéñţš. Ŵĥéñ đîšàƃļéđ
      (ţĥé đéƒàüļţ), îñṽàļîđ üñîţš àŕé šķîþþéđ šîļéñţļý àñđ þàŕšîñĝ
      çöñţîñüéš. Ŵĥéñ éñàƃļéđ, ţĥé ƒîŕšţ îñṽàļîđ üñîţ àƃöŕţš þŕöçéššîñĝ.
      Üšé îţ ţö ƒàîļ ƒàšţ öñ çöŕŕüþţ öŕ ñöñ-çöñƒöŕḿàñţ îñþüţ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  escapeGT:
    description: Éšçàþé ţĥé ĝŕéàţéŕ-ţĥàñ çĥàŕàçţéŕ àš `&ĝţ;` îñ öüţþüţ ẊḾĻ.
    help: |
      À ŵŕîţéŕ-šîđé öþţîöñ. Ŵĥéñ éñàƃļéđ, ţĥé `>` çĥàŕàçţéŕ îš ŵŕîţţéñ àš
      ţĥé `&ĝţ;` éñţîţý. Ŵĥéñ đîšàƃļéđ (ţĥé đéƒàüļţ), `>` îš ŵŕîţţéñ
      ļîţéŕàļļý, ŵĥîçĥ îš ṽàļîđ ẊḾĻ öüţšîđé öƒ à ÇĐÀŢÀ çļöšé šéǫüéñçé.
      Éñàƃļé îţ ƒöŕ šţŕîçţéŕ đöŵñšţŕéàḿ ţööļš ţĥàţ éẋþéçţ `>` éšçàþéđ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  useCodeFinder:
    description: Đéţéçţ îñļîñé çöđéš îñšîđé šéĝḿéñţ ţéẋţ üšîñĝ ŕéĝüļàŕ éẋþŕéššîöñš.
    help: |
      Éñàƃļéš ŕéĝéẋ-ƃàšéđ đéţéçţîöñ öƒ îñļîñé çöđéš (þļàçéĥöļđéŕš,
      ṽàŕîàƃļéš, ţàĝš) ŵîţĥîñ éẋţŕàçţéđ ţéẋţ, üšîñĝ ţĥé þàţţéŕñš îñ
      `çöđéƑîñđéŕŔüļéš`. Ŵĥéñ đîšàƃļéđ (ţĥé đéƒàüļţ), ñö þàţţéŕñ-ƃàšéđ
      îñļîñé çöđéš àŕé éẋţŕàçţéđ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  codeFinderRules:
    description: Ŕéĝüļàŕ-éẋþŕéššîöñ þàţţéŕñš ţĥàţ ḿàţçĥ îñļîñé çöđéš îñ šéĝḿéñţ ţéẋţ.
    help: |
      À ļîšţ öƒ ŕéĝüļàŕ éẋþŕéššîöñš; éàçĥ ḿàţçĥ ŵîţĥîñ à ţŕàñšļàţàƃļé
      ƃļöçķ îš þŕöţéçţéđ àš àñ îñļîñé çöđé ŕàţĥéŕ ţĥàñ ţŕàñšļàţéđ. Üšéđ ţö
      šĥîéļđ þļàçéĥöļđéŕš öŕ ḿàŕķüþ çàŕŕîéđ îñšîđé ḿéḿöŕý šéĝḿéñţš. Öñļý ţàķéš
      éƒƒéçţ ŵĥéñ `üšéÇöđéƑîñđéŕ` îš éñàƃļéđ; îñṽàļîđ þàţţéŕñš àŕé šķîþþéđ.
    values: "Àŕŕàý öƒ ŕéĝüļàŕ-éẋþŕéššîöñ šţŕîñĝš"
    examples:
