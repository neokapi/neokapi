processingNotes:
  - Ţĥé šöüŕçé šéĝḿéñţ ḿàţçĥéš ţĥé ĥéàđéŕ `šŕçļàñĝ`; öñé ţàŕĝéţ šéĝḿéñţ îš þŕöđüçéđ þéŕ öţĥéŕ-ļàñĝüàĝé `<ţüṽ>`.
  - Ĥéàđéŕ àţţŕîƃüţéš àñđ ĥéàđéŕ-ļéṽéļ ñöţéš àñđ þŕöþéŕţîéš àŕé éḿîţţéđ àš à šîñĝļé ñöñ-ţŕàñšļàţàƃļé đàţà þàŕţ àĥéàđ öƒ ţĥé ƃļöçķš; üñîţ-ļéṽéļ ñöţéš àñđ þŕöþéŕţîéš àţţàçĥ ţö ţĥé ƃļöçķ.
