  ŽÎÞ-àñđ-ẊḾĻ þàçķàĝé, šö öñé ƒîļţéŕ šéŕṽéš ţĥéḿ àñđ àüţö-đéţéçţš ţĥé
  ṽàŕîàñţ ƒŕöḿ ţĥé þàçķàĝé çöñţéñţš, þéŕ ÉÇḾÀ-376 / ÎŠÖ/ÎÉÇ 29500.

  Éẋţŕàçţîöñ îš šéļéçţîṽé: ƃý đéƒàüļţ ţĥé ŕéàđéŕ þüļļš ţĥé ḿàîñ ƃöđý ţéẋţ
  þļüš ţĥé þàŕţš ţĥàţ àŕé ñöŕḿàļļý üšéŕ-ṽîšîƃļé (đöçüḿéñţ þŕöþéŕţîéš,
  ĥéàđéŕš àñđ ƒööţéŕš, ƒööţñöţéš, çöḿḿéñţš, àñđ ĥýþéŕļîñķ ţéẋţ îñ Ŵöŕđ;
  šĥàŕéđ šţŕîñĝš îñ Éẋçéļ; àñđ šþéàķéŕ ñöţéš îñ ÞöŵéŕÞöîñţ) ŵĥîļé ļéàṽîñĝ
  ĥîđđéñ, šţŕüçţüŕàļ, öŕ ŕàŕéļý ţŕàñšļàţéđ çöñţéñţ öüţ üñļéšš ýöü öþţ îñ.
  À šéţ öƒ šţýļé àñđ çöļöüŕ ƒîļţéŕš ļéţš ýöü îñçļüđé öŕ éẋçļüđé ŕüñš ƃý
  þàŕàĝŕàþĥ/çĥàŕàçţéŕ šţýļé öŕ ĥîĝĥļîĝĥţ çöļöüŕ. Ţĥîš ḿîŕŕöŕš Okapi'š
  ÖþéñẊḾĻ ƒîļţéŕ, îñçļüđîñĝ îţš đéƒàüļţ öƒ àççéþţîñĝ ţŕàçķéđ çĥàñĝéš
  ƃéƒöŕé éẋţŕàçţîöñ.
