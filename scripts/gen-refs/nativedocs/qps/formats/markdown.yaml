description: "Éẋţŕàçţ àñđ ŕéîñšéŕţ ţéẋţ ƒŕöḿ Ḿàŕķđöŵñ, ķééþîñĝ ĥéàđîñĝš, ļîšţš, ļîñķš, àñđ çöđé îñţàçţ."
overview: |
  Ţĥé **Ḿàŕķđöŵñ** ƒöŕḿàţ ŕéàđš Ḿàŕķđöŵñ đöçüḿéñţš, éẋţŕàçţš þŕöšé àš
  ţŕàñšļàţàƃļé ƃļöçķš, àñđ ŵŕîţéš ţĥé ţŕàñšļàţîöñš ƃàçķ ŵĥîļé þŕéšéŕṽîñĝ ţĥé
  đöçüḿéñţ'š šţŕüçţüŕé: ĥéàđîñĝš, ļîšţš, éḿþĥàšîš, ļîñķš, àñđ çöđé. Îñļîñé
  ḿàŕķüþ (ƃöļđ, îţàļîç, ļîñķš, îñļîñé çöđé) îš éẋþöšéđ àš îñļîñé çöđéš îñšîđé
  éàçĥ ƃļöçķ šö ţĥé šüŕŕöüñđîñĝ šýñţàẋ šüŕṽîṽéš ţŕàñšļàţîöñ.

  Ƃý đéƒàüļţ þàŕàĝŕàþĥš, ĥéàđîñĝš, ļîšţ îţéḿš, ƃļöçķǫüöţéš, àñđ îḿàĝé àļţ ţéẋţ
  àŕé ţŕàñšļàţàƃļé, ŵĥîļé çöđé ƃļöçķš, ÝÀḾĻ ƒŕöñţ ḿàţţéŕ, ŕàŵ ĤŢḾĻ ƃļöçķš, àñđ
  ļîñķ/îḿàĝé ÜŔĻš àŕé éḿîţţéđ àš ñöñ-ţŕàñšļàţàƃļé šţŕüçţüŕé. Éàçĥ öƒ ţĥöšé
  çàţéĝöŕîéš çàñ ƃé ţöĝĝļéđ, àñđ éḿƃéđđéđ ĤŢḾĻ çàñ ƃé ŕöüţéđ ţö à šüƃƒîļţéŕ.
