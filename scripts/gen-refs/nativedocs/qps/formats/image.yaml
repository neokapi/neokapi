    help: |
      Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ) àñđ ÖÇŔ ŕüñš, ļàýöüţ ŕéĝîöñš àñđ ŕéàđîñĝ öŕđéŕ
      çöḿé ƒŕöḿ ţĥé ṽîšîöñ éñĝîñé'š ḾĻ ļàýöüţ ḿöđéļ (ŵĥéñ îţ šüþþöŕţš öñé). Ŵĥéñ
      đîšàƃļéđ, šţŕüçţüŕé ƒàļļš ƃàçķ ţö ĝéöḿéţŕîç îñƒéŕéñçé öṽéŕ ţĥé ÖÇŔ ļîñé
      ĝéöḿéţŕý (ţîéŕ 2).
