  - "Ƒöŕḿàţš ţĥé ṽîšîöñ éñĝîñé çàñ'ţ ŕéàđ ñàţîṽéļý àŕé ñöŕḿàļîžéđ ţö ÞÑĜ ƃéƒöŕé ÖÇŔ (ĜÎƑ/ƂḾÞ/ŢÎƑƑ/ŴéƃÞ îñ-çöŕé, ĤÉÎÇ/ÀṼÎƑ ṽîà ƒƒḿþéĝ) ŵĥîļé ţĥé éḿîţţéđ Ḿéđîà ķééþš ţĥé öŕîĝîñàļ ƃýţéš."
