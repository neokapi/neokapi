      ţŕàñšļàţîöñ. Ŵĥéñ đîšàƃļéđ (ḿöñöļîñĝüàļ ḿöđé), ţĥé `ḿšĝîđ` îš üšéđ
      öñļý àš àñ îđéñţîƒîéŕ àñđ ţĥé `ḿšĝšţŕ` îš ţàķéñ àš ţĥé šöüŕçé ţéẋţ,
      ţĥé ļàýöüţ üšéđ ƃý çàţàļöĝüéš ŵĥöšé ḿéššàĝé ÎĐš àŕé šýḿƃöļîç ŕàţĥéŕ
