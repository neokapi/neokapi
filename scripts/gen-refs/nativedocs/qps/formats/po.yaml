      ţŕàñšļàţîöñ îš ŵŕîţţéñ ŵîţĥ àñ éḿþţý `ḿšĝšţŕ` ŕàţĥéŕ ţĥàñ ƃéîñĝ
      đŕöþþéđ öŕ ƒîļļéđ ŵîţĥ ţĥé šöüŕçé. Ŵĥéñ đîšàƃļéđ (ţĥé đéƒàüļţ),
