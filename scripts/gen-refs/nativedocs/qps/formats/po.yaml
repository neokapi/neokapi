      À ŵŕîţéŕ-šîđé öþţîöñ. Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ), ļöñĝ `ḿšĝîđ` àñđ
      `ḿšĝšţŕ` ṽàļüéš àŕé ŵŕàþþéđ àçŕöšš ḿüļţîþļé ļîñéš àţ ŕöüĝĥļý 80
