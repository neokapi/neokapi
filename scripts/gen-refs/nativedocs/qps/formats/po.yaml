description: "Ŕéàđ àñđ ŵŕîţé ĜÑÜ ĝéţţéẋţ ÞÖ àñđ ÞÖŢ çàţàļöĝüéš, éẋţŕàçţîñĝ éàçĥ ḿéššàĝé àš à ţŕàñšļàţàƃļé ƃļöçķ."
overview: |
  ÞÖ (Þöŕţàƃļé Öƃĵéçţ) îš ţĥé ĜÑÜ ĝéţţéẋţ çàţàļöĝüé ƒöŕḿàţ. À `.þö` ƒîļé
  þàîŕš `ḿšĝîđ` šöüŕçé šţŕîñĝš ŵîţĥ `ḿšĝšţŕ` ţŕàñšļàţîöñš, öþţîöñàļļý
  đîšàḿƃîĝüàţéđ ƃý `ḿšĝçţẋţ`, ŵîţĥ þļüŕàļ ƒöŕḿš ṽîà `ḿšĝîđ_þļüŕàļ` àñđ
  `ḿšĝšţŕ[Ñ]`, ţŕàñšļàţöŕ àñđ éẋţŕàçţéđ çöḿḿéñţš, šöüŕçé ŕéƒéŕéñçéš, àñđ
  `#, ƒüžžý` ƒļàĝš. `.þöţ` ţéḿþļàţéš çàŕŕý ţĥé šàḿé šţŕüçţüŕé ŵîţĥ éḿþţý
  ţŕàñšļàţîöñš.

  Ţĥé ŕéàđéŕ éḿîţš öñé ţŕàñšļàţàƃļé ƃļöçķ þéŕ ḿéššàĝé: îñ ţĥé đéƒàüļţ
  ƃîļîñĝüàļ ḿöđé ţĥé `ḿšĝîđ` îš ţĥé šöüŕçé ţéẋţ àñđ ţĥé `ḿšĝšţŕ` îš ţĥé
  ţàŕĝéţ. Îñ ḿöñöļîñĝüàļ ḿöđé ţĥé `ḿšĝîđ` îš ţŕéàţéđ þüŕéļý àš àñ
  îđéñţîƒîéŕ àñđ ţĥé `ḿšĝšţŕ` þŕöṽîđéš ţĥé šöüŕçé ţéẋţ îñšţéàđ, ţĥé
  šĥàþé üšéđ ƃý çàţàļöĝüéš ţĥàţ šĥîþ ḿéššàĝé ÎĐš ŕàţĥéŕ ţĥàñ Éñĝļîšĥ
  šţŕîñĝš. Çöḿḿéñţš, çöñţéẋţ, àñđ ŕéƒéŕéñçéš àŕé þŕéšéŕṽéđ öñ ţĥé ƃļöçķ
  àñđ ŵŕîţţéñ ƃàçķ. Ţĥîš ḿîŕŕöŕš Okapi'š ÞÖ ƒîļţéŕ.
parameters:
