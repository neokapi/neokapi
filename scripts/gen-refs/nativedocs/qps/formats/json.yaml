# Native reference doc for the built-in `json` format.
# Schema source: core/formats/json/config.go (Config) + schema.go.
# Mirrors the Okapi okf_json filter.
description: "Éẋţŕàçţ àñđ ŕéîñšéŕţ ţŕàñšļàţàƃļé ṽàļüéš ƒŕöḿ ĴŠÖÑ ƒîļéš, ŵîţĥ ķéý-ƃàšéđ ƒîļţéŕîñĝ, ñàḿîñĝ, àñđ šüƃƒîļţéŕš."
overview: |
  Ţĥé **ĴŠÖÑ** ƒöŕḿàţ ŕéàđš ĴŠÖÑ đöçüḿéñţš, éẋţŕàçţš šţŕîñĝ ṽàļüéš àš
  ţŕàñšļàţàƃļé ƃļöçķš, àñđ ŵŕîţéš ţĥé ţŕàñšļàţéđ ṽàļüéš ƃàçķ îñţö ţĥé šàḿé
  šţŕüçţüŕé. Îţ îš ţĥé çöḿḿöñ ƒöŕḿàţ ƒöŕ ŵéƃ àñđ àþþļîçàţîöñ ŕéšöüŕçé ƒîļéš
  (î18ñéẋţ, Çĥŕöḿé éẋţéñšîöñ ḿéššàĝéš, ĝéñéŕîç ķéý/ṽàļüé çàţàļöĝüéš).

  Ƃý đéƒàüļţ éṽéŕý ķéý/ṽàļüé šţŕîñĝ þàîŕ îš éẋţŕàçţéđ. Ƒŕöḿ ţĥéŕé ýöü çàñ
  ñàŕŕöŵ éẋţŕàçţîöñ ŵîţĥ à ķéý-éẋçéþţîöñ öŕ éẋţŕàçţîöñ þàţţéŕñ, çöñţŕöļ ĥöŵ
  ƃļöçķ ñàḿéš àŕé đéŕîṽéđ ƒŕöḿ ķéýš, ŕöüţé šþéçîƒîç ķéýš ţö ñöţéš, ÎĐš, öŕ
  ḿéţàđàţà, àñđ ĥàñđ éḿƃéđđéđ ḿàŕķüþ (ĤŢḾĻ îñšîđé à ṽàļüé) ţö à šüƃƒîļţéŕ.
  Ţŵö þŕéšéţš àŕé þŕöṽîđéđ (*Çĥŕöḿé Éẋţéñšîöñ* àñđ *î18ñéẋţ*) àš šţàŕţîñĝ
  þöîñţš ƒöŕ ţĥöšé ļàýöüţš.
parameters:
  extractAllPairs:
    description: Éẋţŕàçţ àļļ ķéý/ṽàļüé šţŕîñĝ þàîŕš ƒöŕ ţŕàñšļàţîöñ.
    help: |
      Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ), éṽéŕý šţŕîñĝ ṽàļüé àššöçîàţéđ ŵîţĥ à ķéý îš
      éẋţŕàçţéđ. Ŵĥéñ đîšàƃļéđ, ñöţĥîñĝ îš éẋţŕàçţéđ üñļéšš à ķéý ḿàţçĥéš ţĥé
      `éẋçéþţîöñš` þàţţéŕñ (ţĥé ḿéàñîñĝ öƒ `éẋçéþţîöñš` îñṽéŕţš; šéé ƃéļöŵ) öŕ
      àñ `éẋţŕàçţîöñŔüļéš` þàţţéŕñ îš šéţ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
  exceptions:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš ŵĥöšé éƒƒéçţ đéþéñđš öñ `éẋţŕàçţÀļļÞàîŕš`.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Ŵĥéñ `éẋţŕàçţÀļļÞàîŕš`
      îš `ţŕüé`, ķéýš ḿàţçĥîñĝ ţĥîš þàţţéŕñ àŕé **éẋçļüđéđ** ƒŕöḿ éẋţŕàçţîöñ.
      Ŵĥéñ `éẋţŕàçţÀļļÞàîŕš` îš `ƒàļšé`, öñļý ķéýš ḿàţçĥîñĝ ţĥîš þàţţéŕñ àŕé
      **îñçļüđéđ**. Ţĥé ḿàţçĥ îš àþþļîéđ ţö ţĥé îḿḿéđîàţé ķéý, öŕ ţö ţĥé ƒüļļ
      ķéý þàţĥ ŵĥéñ `üšéƑüļļĶéýÞàţĥ` îš éñàƃļéđ.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    examples:
      - "`^ḿéššàĝé$` ŵîţĥ `éẋţŕàçţÀļļÞàîŕš: ƒàļšé` éẋţŕàçţš öñļý ţĥé `ḿéššàĝé` ķéý"
    dependsOn:
      - property: extractAllPairs
        condition: đéţéŕḿîñéš ŵĥéţĥéŕ ḿàţçĥéš àŕé éẋçļüđéđ (ţŕüé) öŕ îñçļüđéđ (ƒàļšé)
  extractIsolatedStrings:
    description: Éẋţŕàçţ šţàñđàļöñé šţŕîñĝ ṽàļüéš îñšîđé àŕŕàýš.
    help: |
      Šţŕîñĝ ṽàļüéš ţĥàţ àþþéàŕ đîŕéçţļý îñ àŕŕàýš, ŵîţĥöüţ àñ àššöçîàţéđ
      ķéý, àŕé ñöţ éẋţŕàçţéđ ƃý đéƒàüļţ. Éñàƃļé ţĥîš ţö ţŕéàţ šüçĥ îšöļàţéđ
      šţŕîñĝš àš ţŕàñšļàţàƃļé ƃļöçķš.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  extractionRules:
    description: Ŕéĝéẋ ļîḿîţîñĝ ŵĥîçĥ ķéý þàţĥš àŕé éẋţŕàçţéđ.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš (öŕ ƒüļļ ķéý þàţĥš ŵĥéñ
      `üšéƑüļļĶéýÞàţĥ` îš éñàƃļéđ). Ŵĥéñ šéţ, öñļý ḿàţçĥîñĝ ķéýš àŕé éẋţŕàçţéđ
      àñđ îţ öṽéŕŕîđéš `éẋţŕàçţÀļļÞàîŕš`.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    examples:
      - "`/ḿéššàĝéš/.*|/ļàƃéļš/.*` éẋţŕàçţš öñļý ķéýš üñđéŕ `ḿéššàĝéš` öŕ `ļàƃéļš`"
  useKeyAsName:
    description: Üšé ţĥé ĴŠÖÑ ķéý àš ţĥé ƃļöçķ ñàḿé.
    help: |
      Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ), ţĥé ĴŠÖÑ ķéý îš üšéđ àš ţĥé ƃļöçķ'š ñàḿé
      (ŕéšñàḿé) šö ţŕàñšļàţöŕš àñđ đöŵñšţŕéàḿ ţööļš çàñ ŕéƒéŕéñçé éàçĥ üñîţ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
  useFullKeyPath:
    description: Üšé ţĥé ƒüļļ ĥîéŕàŕçĥîçàļ ķéý þàţĥ àš ţĥé ƃļöçķ ñàḿé.
    help: |
      Ŵĥéñ éñàƃļéđ, ţĥé ƃļöçķ ñàḿé îš ţĥé ƒüļļ þàţĥ ţĥŕöüĝĥ ñéšţéđ öƃĵéçţš
      (ƒöŕ éẋàḿþļé `þàŕéñţ/çĥîļđ`) ŕàţĥéŕ ţĥàñ ĵüšţ ţĥé îḿḿéđîàţé ķéý. Ţĥé
      šàḿé þàţĥ îš ţĥéñ üšéđ ŵĥéñ ḿàţçĥîñĝ ţĥé ŕüļé-ƃàšéđ ŕéĝéẋ þàţţéŕñš.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  useLeadingSlashOnKeyPath:
    description: Þŕéƒîẋ ƒüļļ ķéý þàţĥš ŵîţĥ à ļéàđîñĝ šļàšĥ.
    help: |
      Ŵĥéñ `üšéƑüļļĶéýÞàţĥ` îš éñàƃļéđ, ţĥîš çöñţŕöļš ŵĥéţĥéŕ ţĥé þàţĥ ƃéĝîñš
      ŵîţĥ à ļéàđîñĝ `/` (ƒöŕ éẋàḿþļé `/þàŕéñţ/çĥîļđ`). Éñàƃļéđ ƃý đéƒàüļţ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
    dependsOn:
      - property: useFullKeyPath
        condition: öñļý àƒƒéçţš ñàḿéš ŵĥéñ ƒüļļ ķéý þàţĥš àŕé üšéđ
  useIdStack:
    description: Ƃüîļđ ƃļöçķ ÎĐš ƒŕöḿ ţĥé ñéšţéđ ķéý šţàçķ.
    help: |
      Ŵĥéñ éñàƃļéđ, ţĥé ƃļöçķ ÎĐ îš çöḿþöšéđ ƒŕöḿ ţĥé šţàçķ öƒ éñçļöšîñĝ ķéýš,
      þŕöđüçîñĝ à çöḿþöüñđ îđéñţîƒîéŕ ƒöŕ ñéšţéđ šţŕüçţüŕéš.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  idRules:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš ŵĥöšé ṽàļüéš ƃéçöḿé ƃļöçķ ÎĐš.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Ţĥé ṽàļüé öƒ à ḿàţçĥîñĝ
      ķéý îš üšéđ àš ţĥé ñàḿé/ÎĐ öƒ ţĥé ñéẋţ ţŕàñšļàţàƃļé ƃļöçķ, öṽéŕŕîđîñĝ
      `üšéĶéýÀšÑàḿé`.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    examples:
      - "`/îđ|/ķéý` üšéš ţĥé ṽàļüé öƒ àñ `îđ` öŕ `ķéý` ƒîéļđ àš ţĥé ƃļöçķ ÎĐ"
  noteRules:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš ŵĥöšé ṽàļüéš ƃéçöḿé ţŕàñšļàţöŕ ñöţéš.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Ţĥé ṽàļüé öƒ à ḿàţçĥîñĝ
      ķéý îš àţţàçĥéđ àš à ţŕàñšļàţöŕ ñöţé ţö ţĥé ñéẋţ ţŕàñšļàţàƃļé ƃļöçķ.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    examples:
      - "`/đéšçŕîþţîöñ|/çöḿḿéñţ` àţţàçĥéš à `đéšçŕîþţîöñ` öŕ `çöḿḿéñţ` ṽàļüé àš à ñöţé"
  genericMetaRules:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš ŵĥöšé ṽàļüéš ƃéçöḿé ĝéñéŕîç ḿéţàđàţà.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Ţĥé ṽàļüé öƒ à ḿàţçĥîñĝ
      ķéý îš ŕéçöŕđéđ àš à ĝéñéŕîç ḿéţàđàţà àññöţàţîöñ öñ ţĥé ñéẋţ
      ţŕàñšļàţàƃļé ƃļöçķ, ŕàţĥéŕ ţĥàñ ƃéîñĝ éẋţŕàçţéđ àš çöñţéñţ.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
  maxwidthRules:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš ŵĥöšé ñüḿéŕîç ṽàļüéš šéţ à ḿàẋ-ŵîđţĥ çöñšţŕàîñţ.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Ţĥé ñüḿéŕîç ṽàļüé öƒ à
      ḿàţçĥîñĝ ķéý šéţš à ḿàẋîḿüḿ-ŵîđţĥ þŕöþéŕţý öñ ţĥé ñéẋţ ţŕàñšļàţàƃļé
      ƃļöçķ, üšéđ ƃý ļéñĝţĥ-çöñšţŕàîñéđ ŵöŕķƒļöŵš.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    dependsOn:
      - property: maxwidthSizeUnit
        condition: ţĥé ṽàļüé îš îñţéŕþŕéţéđ îñ ţĥîš üñîţ
  maxwidthSizeUnit:
    description: Üñîţ ƒöŕ ţĥé ḿàẋ-ŵîđţĥ çöñšţŕàîñţ.
    help: |
      Ţĥé üñîţ îñ ŵĥîçĥ `ḿàẋŵîđţĥŔüļéš` ṽàļüéš àŕé îñţéŕþŕéţéđ: `þîẋéļ` öŕ
      `çĥàŕ`.
    values: "`þîẋéļ` / `çĥàŕ` (đéƒàüļţ `þîẋéļ`)"
  subfilter:
    description: Ĝļöƃàļ šüƃƒîļţéŕ ƒöŕḿàţ àþþļîéđ ţö éẋţŕàçţéđ ṽàļüéš.
    help: |
      Ţĥé ñàḿé öƒ à ƒöŕḿàţ üšéđ àš à šüƃƒîļţéŕ (ƒöŕ éẋàḿþļé `ĥţḿļ`) ţö þàŕšé
      éḿƃéđđéđ ḿàŕķüþ îñšîđé éẋţŕàçţéđ šţŕîñĝ ṽàļüéš. Ŵĥéñ šéţ, îţ àþþļîéš ţö
      àļļ éẋţŕàçţéđ ṽàļüéš üñļéšš `šüƃƒîļţéŕŔüļéš` ŕéšţŕîçţš îţ ţö šþéçîƒîç
      ķéýš.
    values: Ƒöŕḿàţ ñàḿé (đéƒàüļţ éḿþţý)
    examples:
      - "`ĥţḿļ` þàŕšéš ĤŢḾĻ îñšîđé ĴŠÖÑ šţŕîñĝ ṽàļüéš"
  subfilterRules:
    description: Ŕéĝéẋ öṽéŕ ķéý ñàḿéš šéļéçţîñĝ ŵĥîçĥ ṽàļüéš àŕé šüƃƒîļţéŕéđ.
    help: |
      À ŕéĝüļàŕ éẋþŕéššîöñ ḿàţçĥéđ àĝàîñšţ ķéý ñàḿéš. Öñļý ṽàļüéš ŵĥöšé ķéý
      ḿàţçĥéš àŕé þŕöçéššéđ ƃý ţĥé šüƃƒîļţéŕ. Üšéđ ţöĝéţĥéŕ ŵîţĥ `šüƃƒîļţéŕ`;
      ŵĥéñ öḿîţţéđ, ţĥé šüƃƒîļţéŕ àþþļîéš ţö àļļ éẋţŕàçţéđ ṽàļüéš.
    values: Ŕéĝüļàŕ éẋþŕéššîöñ (đéƒàüļţ éḿþţý)
    dependsOn:
      - property: subfilter
        condition: öñļý ţàķéš éƒƒéçţ ŵĥéñ à šüƃƒîļţéŕ ƒöŕḿàţ îš šéţ
    examples:
      - "`_ĥţḿļ$` šüƃƒîļţéŕš öñļý ķéýš éñđîñĝ îñ `_ĥţḿļ`"
  subfilters:
    description: Þéŕ-þàţţéŕñ šüƃƒîļţéŕ ḿàþþîñĝš ƒöŕ éḿƃéđđéđ çöñţéñţ.
    help: |
      Àñ àŕŕàý öƒ `{pattern, format}` öƃĵéçţš ḿàþþîñĝ ķéý þàţţéŕñš ţö ƒöŕḿàţ
      ñàḿéš, ƒöŕ ŕöüţîñĝ đîƒƒéŕéñţ ķéýš ţö đîƒƒéŕéñţ šüƃƒîļţéŕš. Éàçĥ ḿàþþîñĝ
      ŕéǫüîŕéš ƃöţĥ à ñöñ-éḿþţý `þàţţéŕñ` àñđ à ñöñ-éḿþţý `ƒöŕḿàţ`.
    values: "Àŕŕàý öƒ `{pattern, format}` öƃĵéçţš (đéƒàüļţ éḿþţý)"
  escapeForwardSlashes:
    description: Éšçàþé ƒöŕŵàŕđ šļàšĥéš îñ ĴŠÖÑ öüţþüţ.
    help: |
      Ŵĥéñ éñàƃļéđ (ţĥé đéƒàüļţ), ƒöŕŵàŕđ šļàšĥéš àŕé ŵŕîţţéñ àš `\/` îñ ţĥé
      öüţþüţ ĴŠÖÑ, ḿàţçĥîñĝ ţĥé çöñšéŕṽàţîṽé éšçàþîñĝ šöḿé ĴŠÖÑ þŕöđüçéŕš üšé.
      Đîšàƃļé îţ ţö éḿîţ ƃàŕé `/` çĥàŕàçţéŕš.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ţŕüé`)"
  useCodeFinder:
    description: Éñàƃļé þàţţéŕñ-ƃàšéđ îñļîñé-çöđé đéţéçţîöñ.
    help: |
      Éñàƃļéš ŕéĝéẋ-ƃàšéđ đéţéçţîöñ öƒ îñļîñé çöđéš (þļàçéĥöļđéŕš, ṽàŕîàƃļéš,
      ţàĝš) îñšîđé éẋţŕàçţéđ ţéẋţ. Ţĥé þàţţéŕñš àŕé šüþþļîéđ ṽîà
      `çöđéƑîñđéŕŔüļéš`.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  codeFinderRules:
    description: Ŕéĝéẋ þàţţéŕñš ţĥàţ ḿàţçĥ îñļîñé çöđéš ŵîţĥîñ ṽàļüéš.
    help: |
      Àñ àŕŕàý öƒ ŕéĝüļàŕ éẋþŕéššîöñš; ţéẋţ ḿàţçĥîñĝ àñý öƒ ţĥéḿ îš ţŕéàţéđ
      àš àñ îñļîñé çöđé ŕàţĥéŕ ţĥàñ ţŕàñšļàţàƃļé ŵöŕđš. Öñļý üšéđ ŵĥéñ
      `üšéÇöđéƑîñđéŕ` îš éñàƃļéđ.
    values: Àŕŕàý öƒ ŕéĝüļàŕ éẋþŕéššîöñš (đéƒàüļţ éḿþţý)
    dependsOn:
