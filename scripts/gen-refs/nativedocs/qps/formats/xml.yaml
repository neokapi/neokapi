      À ļîšţ öƒ éļéḿéñţ ñàḿéš ŵĥöšé çöñţéñţ îš ñöţ éẋţŕàçţéđ, éṽéñ ŵĥéñ ţĥéîŕ
      ţéẋţ ŵöüļđ öţĥéŕŵîšé ƃé ţŕàñšļàţàƃļé.
    values: Àŕŕàý öƒ éļéḿéñţ ñàḿéš (đéƒàüļţ éḿþţý)
    examples:
      - "`[šçŕîþţ, šţýļé]` ñéṽéŕ éẋţŕàçţš ţĥé çöñţéñţ öƒ ţĥéšé éļéḿéñţš"
  preserveWhitespaceElements:
    description: Éļéḿéñţ ñàḿéš ţĥàţ àļŵàýš þŕéšéŕṽé ŵĥîţéšþàçé.
    help: |
      À ļîšţ öƒ éļéḿéñţ ñàḿéš ŵĥöšé ţéẋţ çöñţéñţ ķééþš îţš öŕîĝîñàļ ŵĥîţéšþàçé
      ŕéĝàŕđļéšš öƒ ţĥé ĝļöƃàļ `þŕéšéŕṽéŴĥîţéšþàçé` šéţţîñĝ.
    values: Àŕŕàý öƒ éļéḿéñţ ñàḿéš (đéƒàüļţ éḿþţý)
    examples:
      - "`[þŕé, çöđé]` þŕéšéŕṽéš ŵĥîţéšþàçé îñšîđé ţĥéšé éļéḿéñţš"
  groupElements:
    description: Éļéḿéñţ ñàḿéš ţĥàţ þŕöđüçé ĝŕöüþ/ļàýéŕ ƃöüñđàŕîéš.
    help: |
      À ļîšţ öƒ éļéḿéñţ ñàḿéš ţĥàţ çŕéàţé ĝŕöüþ (ļàýéŕ) ƃöüñđàŕîéš îñ ţĥé
      öüţþüţ, ĝŕöüþîñĝ ţĥé ƃļöçķš ţĥéý çöñţàîñ.
    values: Àŕŕàý öƒ éļéḿéñţ ñàḿéš (đéƒàüļţ éḿþţý)
  idAttributes:
