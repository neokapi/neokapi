  subfilters:
    description: Þéŕ-þàţţéŕñ šüƃƒîļţéŕ ḿàþþîñĝš ƒöŕ éḿƃéđđéđ çöñţéñţ.
    help: |
      Àñ àŕŕàý öƒ `{pattern, format}` öƃĵéçţš ŕöüţîñĝ ţĥé ţéẋţ çöñţéñţ öƒ
      ḿàţçĥîñĝ éļéḿéñţ þàţĥš ţö àñöţĥéŕ ƒöŕḿàţ ŕéàđéŕ. Þàţţéŕñš üšé
      đöţ-šéþàŕàţéđ éļéḿéñţ þàţĥš ŵîţĥ ĝļöƃ šüþþöŕţ. Éàçĥ ḿàþþîñĝ ŕéǫüîŕéš à
