  attributes:
    description: Àđṽàñçéđ àţţŕîƃüţé-šþéçîƒîç ŕüļéš.
    help: |
      À ḿàþ öƒ àţţŕîƃüţé ñàḿé (öŕ à šîñĝļé-ǫüöţéđ ŕéĝéẋ þàţţéŕñ) ţö à ŕüļé
      öƃĵéçţ. À ŕüļé ḿàý çàŕŕý `ŕüļéŢýþéš` (šüçĥ àš `ÀŢŢŔÎƂÜŢÉ_ŢŔÀÑŠ`,
      `ÀŢŢŔÎƂÜŢÉ_ÎĐ`, `ÀŢŢŔÎƂÜŢÉ_ŴŔÎŢÀƂĻÉ`) àñđ àñ éļéḿéñţ šçöþé ṽîà
      `öñļýŢĥéšéÉļéḿéñţš` öŕ `àļļÉļéḿéñţšÉẋçéþţ`.
    values: "Ḿàþ öƒ àţţŕîƃüţé ñàḿé → ŕüļé öƃĵéçţ (đéƒàüļţ éḿþţý)"
