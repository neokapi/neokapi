limitations:
  - Ţĥîš îš à ĝéñéŕîç ẊḾĻ ŕéàđéŕ; ƒöŕ šþéçîƒîç ẊḾĻ đîàļéçţš (šüçĥ àš ŔÉŠẊ) šţàŕţ ƒŕöḿ à ţàîļöŕéđ ŕüļé šéţ ŕàţĥéŕ ţĥàñ ţĥé ƃàŕé đéƒàüļţš.
  - Éļéḿéñţ àñđ àţţŕîƃüţé ñàḿéš îñ àđṽàñçéđ ŕüļéš ŵŕàþþéđ îñ šîñĝļé ǫüöţéš àŕé ţŕéàţéđ àš àñçĥöŕéđ ŕéĝüļàŕ éẋþŕéššîöñš.
processingNotes:
  - Îñļîñé éļéḿéñţš ƃéçöḿé îñļîñé çöđéš ŵîţĥîñ ƃļöçķš; ƃļöçķ-ļéṽéļ éļéḿéñţš ƒöŕḿ ţĥé šüŕŕöüñđîñĝ šţŕüçţüŕé.
  - Éļéḿéñţ ŕüļéš ŵîţĥ `ÎÑÇĻÜĐÉ`/`ÉẊÇĻÜĐÉ` çöḿƃîñé ŵîţĥ `éẋçļüđéƂýĐéƒàüļţ` ţö ĝîṽé ƒîñé çöñţŕöļ öṽéŕ ŵĥîçĥ çöñţéñţ îš éẋţŕàçţéđ.
examples:
  - title: Éẋţŕàçţ šþéçîƒîç éļéḿéñţš
    description: "Ţŕàñšļàţé öñļý ţîţļé àñđ þàŕà ţéẋţ, ţŕéàţîñĝ ƃ àñđ î àš îñļîñé."
