  elements:
    description: Àđṽàñçéđ éļéḿéñţ-šþéçîƒîç ŕüļéš.
    help: |
      À ḿàþ öƒ éļéḿéñţ ñàḿé (öŕ à šîñĝļé-ǫüöţéđ ŕéĝéẋ þàţţéŕñ) ţö à ŕüļé
      öƃĵéçţ. À ŕüļé ḿàý çàŕŕý `ŕüļéŢýþéš` (`ŢÉẊŢÜÑÎŢ`, `ÎÑĻÎÑÉ`, `ÉẊÇĻÜĐÉ`,
      `ÎÑÇĻÜĐÉ`, `ÞŔÉŠÉŔṼÉ_ŴĤÎŢÉŠÞÀÇÉ`, …), àñ àţţŕîƃüţé `çöñđîţîöñš` ţŕîþļéţ,
      `îđÀţţŕîƃüţéš`, àñđ à `ţŕàñšļàţàƃļéÀţţŕîƃüţéš` ḿàþ. Çöñđîţîöñš ļéţ à ŕüļé
      ƒîŕé öñļý ŵĥéñ àñ àţţŕîƃüţé ḿàţçĥéš, ḿîŕŕöŕîñĝ ÎŢŠ-šţýļé šéļéçţöŕš.
    values: "Ḿàþ öƒ éļéḿéñţ ñàḿé → ŕüļé öƃĵéçţ (đéƒàüļţ éḿþţý)"
    examples:
