description: "Éẋţŕàçţ àñđ ŕéîñšéŕţ ţéẋţ ƒŕöḿ ĝéñéŕîç ẊḾĻ, çöñţŕöļļéđ ƃý éļéḿéñţ àñđ àţţŕîƃüţé ŕüļéš."
overview: |
  Ţĥé **ẊḾĻ** ƒöŕḿàţ ŕéàđš ĝéñéŕîç ẊḾĻ đöçüḿéñţš, éẋţŕàçţš ţĥé ţéẋţ öƒ
  çöñƒîĝüŕéđ éļéḿéñţš àñđ àţţŕîƃüţéš àš ţŕàñšļàţàƃļé ƃļöçķš, àñđ ŵŕîţéš ţĥé
  ţŕàñšļàţîöñš ƃàçķ ŵĥîļé þŕéšéŕṽîñĝ ţĥé šüŕŕöüñđîñĝ ḿàŕķüþ. Îñļîñé éļéḿéñţš
  ƃéçöḿé îñļîñé çöđéš ŵîţĥîñ à ƃļöçķ, šö ƒöŕḿàţţîñĝ ţàĝš šüŕṽîṽé ţŕàñšļàţîöñ.

  Éẋţŕàçţîöñ îš ŕüļé-đŕîṽéñ. Ţĥé šîḿþļé ļîšţš (`ţŕàñšļàţàƃļéÉļéḿéñţš`,
  `ţŕàñšļàţàƃļéÀţţŕîƃüţéš`, `îñļîñéÉļéḿéñţš`, `éẋçļüđéđÉļéḿéñţš`) çöṽéŕ ḿöšţ
  çàšéš. Ţĥé àđṽàñçéđ `éļéḿéñţš` àñđ `àţţŕîƃüţéš` ḿàþš éẋþŕéšš ŕîçĥéŕ,
  ÎŢŠ-šţýļé ŕüļéš ŵîţĥ àţţŕîƃüţé çöñđîţîöñš, ÎĐ àñđ ţŕàñšļàţàƃļé-àţţŕîƃüţé
  ḿàþþîñĝš, àñđ éẋþļîçîţ îñçļüđé/éẋçļüđé ƃéĥàṽîöüŕ. Ŵĥéñ ñö ţŕàñšļàţàƃļé
  éļéḿéñţš àŕé ļîšţéđ, àļļ ţéẋţ çöñţéñţ îš ţŕéàţéđ àš ţŕàñšļàţàƃļé; šéţ
  `éẋçļüđéƂýĐéƒàüļţ` ţö îñṽéŕţ ţĥàţ àñđ îñçļüđé öñļý ŵĥàţ ŕüļéš öþţ îñ.
