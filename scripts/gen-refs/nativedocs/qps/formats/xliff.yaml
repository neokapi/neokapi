  ţö ḿöṽé çöñţéñţ ƃéţŵééñ éẋţŕàçţîöñ àñđ ţŕàñšļàţîöñ. À đöçüḿéñţ ĝŕöüþš
  `<ţŕàñš-üñîţ>` éļéḿéñţš üñđéŕ `<ƒîļé>` çöñţàîñéŕš, éàçĥ üñîţ ĥöļđîñĝ à
  `<šöüŕçé>` àñđ àñ öþţîöñàļ `<ţàŕĝéţ>`, ŵîţĥ îñļîñé ḿàŕķüþ ŕéþŕéšéñţéđ
  ţĥŕöüĝĥ þàîŕéđ (`ƃþţ`/`éþţ`, `ĝ`) öŕ šţàñđàļöñé (`ẋ`, `þĥ`) çöđé
  éļéḿéñţš àñđ šéĝḿéñţàţîöñ éẋþŕéššéđ ṽîà `<šéĝ-šöüŕçé>` àñđ
  `<ḿŕķ ḿţýþé="šéĝ">`.

  Ţĥé ŕéàđéŕ éḿîţš öñé ƃļöçķ þéŕ ţŕàñšļàţàƃļé `<ţŕàñš-üñîţ>`, çàŕŕýîñĝ
  ţĥé šöüŕçé, àñý éẋîšţîñĝ ţàŕĝéţ, šéĝḿéñţàţîöñ, àļţ-ţŕàñš ḿàţçĥéš, àñđ
  üñîţ ḿéţàđàţà. Ţĥé ŵŕîţéŕ üþđàţéš ţàŕĝéţš àñđ, ƃý đéƒàüļţ, ţĥé ţàŕĝéţ
  `šţàţé` àţţŕîƃüţé, šö à ŕöüñđ-ţŕîþþéđ ƒîļé ŕéƒļéçţš ţŕàñšļàţîöñ
  þŕöĝŕéšš. Ţĥîš ḿîŕŕöŕš Okapi'š ẊĻÎƑƑ 1.2 ƒîļţéŕ.
