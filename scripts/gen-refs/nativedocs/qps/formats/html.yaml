description: "Éẋţŕàçţ àñđ ŕéîñšéŕţ ţéẋţ ƒŕöḿ ĤŢḾĻ, ŵîţĥ éļéḿéñţ àñđ àţţŕîƃüţé éẋţŕàçţîöñ ŕüļéš."
overview: |
  Ţĥé **ĤŢḾĻ** ƒöŕḿàţ ŕéàđš ĤŢḾĻ đöçüḿéñţš, éẋţŕàçţš éļéḿéñţ ţéẋţ àñđ
  àţţŕîƃüţé ṽàļüéš, àñđ ŵŕîţéš ţĥé ţŕàñšļàţîöñš ƃàçķ ŵĥîļé þŕéšéŕṽîñĝ ţĥé
  šüŕŕöüñđîñĝ ḿàŕķüþ. Îñļîñé éļéḿéñţš (šüçĥ àš `ƃ`, `î`, `à`) ƃéçöḿé îñļîñé
  çöđéš ŵîţĥîñ à ƃļöçķ, šö ƒöŕḿàţţîñĝ àñđ ļîñķš šüŕṽîṽé ţŕàñšļàţîöñ.

  Ţĥé ŕéàđéŕ šĥîþš ŵîţĥ šéñšîƃļé đéƒàüļţš ƒöŕ ŵĥîçĥ éļéḿéñţš ĥöļđ çöñţéñţ,
  ŵĥîçĥ àŕé îñļîñé, àñđ ŵĥîçĥ àţţŕîƃüţéš (šüçĥ àš `àļţ` àñđ `ţîţļé`) àŕé
  éẋţŕàçţéđ. Ţĥé `éļéḿéñţš` àñđ `àţţŕîƃüţéš` ḿàþš ļéţ ýöü öṽéŕŕîđé öŕ éẋţéñđ
  ţĥöšé ŕüļéš þéŕ éļéḿéñţ àñđ þéŕ àţţŕîƃüţé, ḿîŕŕöŕîñĝ ţĥé öķƒ_ĥţḿļ ƃŕîđĝé
  çöñƒîĝüŕàţîöñ. Þàŕšéŕ ƃéĥàṽîöüŕ (ŵĥîţéšþàçé ĥàñđļîñĝ) îš ĝŕöüþéđ üñđéŕ
  `þàŕšéŕ`.
parameters:
  parser.preserve_whitespace:
    description: Þŕéšéŕṽé ŵĥîţéšþàçé îñ éẋţŕàçţéđ ţéẋţ îñšţéàđ öƒ çöļļàþšîñĝ îţ.
    help: |
      Ŵĥéñ éñàƃļéđ, öŕîĝîñàļ ŵĥîţéšþàçé îñ ţéẋţ çöñţéñţ îš þŕéšéŕṽéđ. Ƃý
      đéƒàüļţ ŵĥîţéšþàçé îš çöļļàþšéđ, ḿàţçĥîñĝ ĥöŵ ƃŕöŵšéŕš ŕéñđéŕ ĤŢḾĻ.
      Ĝŕöüþéđ üñđéŕ ţĥé `þàŕšéŕ` öƃĵéçţ îñ ţĥé çöñƒîĝ.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  elements:
    description: Þéŕ-éļéḿéñţ éẋţŕàçţîöñ ŕüļéš.
    help: |
      À ḿàþ ƒŕöḿ éļéḿéñţ ñàḿé ţö à ŕüļé öƃĵéçţ ţĥàţ çöñţŕöļš ĥöŵ ţĥé éļéḿéñţ
      îš ţŕéàţéđ. À ŕüļé ḿàý çàŕŕý `ŕüļé_ţýþéš` (`ŢÉẊŢÜÑÎŢ`, `ÎÑĻÎÑÉ`,
      `ÉẊÇĻÜĐÉ`, `ÎÑÇĻÜĐÉ`, `ÀŢŢŔÎƂÜŢÉŠ_ÖÑĻÝ`, `ÞŔÉŠÉŔṼÉ_ŴĤÎŢÉŠÞÀÇÉ`, `ĜŔÖÜÞ`),
      à `çöñđîţîöñš` ţŕîþļéţ, `îđ_àţţŕîƃüţéš`, àñđ à `ţŕàñšļàţàƃļé_àţţŕîƃüţéš`
      ḿàþþîñĝ. Ţĥéšé öṽéŕŕîđé öŕ éẋţéñđ ţĥé ƃüîļţ-îñ éļéḿéñţ ĥàñđļîñĝ.
    values: "Ḿàþ öƒ éļéḿéñţ ñàḿé → ŕüļé öƃĵéçţ (đéƒàüļţ: ƃüîļţ-îñ ŕüļéš)"
    examples:
      - "`{ summary: { rule_types: [TEXTUNIT] } }` éẋţŕàçţš `šüḿḿàŕý` éļéḿéñţ ţéẋţ"
  attributes:
    description: Þéŕ-àţţŕîƃüţé éẋţŕàçţîöñ ŕüļéš.
    help: |
      À ḿàþ ƒŕöḿ àţţŕîƃüţé ñàḿé ţö à ŕüļé öƃĵéçţ. À ŕüļé ḿàý çàŕŕý `ŕüļé_ţýþéš`
      (`ÀŢŢŔÎƂÜŢÉ_ŢŔÀÑŠ`, `ÀŢŢŔÎƂÜŢÉ_ÎĐ`, `ÀŢŢŔÎƂÜŢÉ_ŴŔÎŢÀƂĻÉ`,
      `ÀŢŢŔÎƂÜŢÉ_ŔÉÀĐÖÑĻÝ`), àñ éļéḿéñţ šçöþé ṽîà `öñļý_ţĥéšé_éļéḿéñţš` öŕ
      `àļļ_éļéḿéñţš_éẋçéþţ`, àñđ à `çöñđîţîöñš` ţŕîþļéţ.
    values: "Ḿàþ öƒ àţţŕîƃüţé ñàḿé → ŕüļé öƃĵéçţ (đéƒàüļţ: ƃüîļţ-îñ ŕüļéš)"
    examples:
      - "`{ alt: { rule_types: [ATTRIBUTE_TRANS] } }` éẋţŕàçţš àļļ `àļţ` ṽàļüéš"
  use_code_finder:
    description: Éñàƃļé ŕéĝéẋ-ƃàšéđ îñļîñé-çöđé đéţéçţîöñ.
    help: |
      Éñàƃļéš ŕéĝéẋ-ƃàšéđ đéţéçţîöñ öƒ îñļîñé çöđéš (þļàçéĥöļđéŕš, ṽàŕîàƃļéš,
      ţàĝš) ŵîţĥîñ éẋţŕàçţéđ ţéẋţ, ƃéýöñđ ţĥé îñļîñé ĤŢḾĻ éļéḿéñţš àļŕéàđý
      ŕéçöĝñîžéđ. Ţĥé þàţţéŕñš àŕé šüþþļîéđ ṽîà `çöđé_ƒîñđéŕ_ŕüļéš`.
    values: "`ţŕüé` / `ƒàļšé` (đéƒàüļţ `ƒàļšé`)"
  code_finder_rules:
    description: Ŕéĝéẋ þàţţéŕñš ţĥàţ ḿàţçĥ îñļîñé çöđéš ŵîţĥîñ ţéẋţ.
    help: |
      Àñ àŕŕàý öƒ ŕéĝüļàŕ éẋþŕéššîöñš; ţéẋţ ḿàţçĥîñĝ àñý öƒ ţĥéḿ îš ţŕéàţéđ
      àš àñ îñļîñé çöđé ŕàţĥéŕ ţĥàñ ţŕàñšļàţàƃļé ŵöŕđš. Öñļý üšéđ ŵĥéñ
      `üšé_çöđé_ƒîñđéŕ` îš éñàƃļéđ.
    values: Àŕŕàý öƒ ŕéĝüļàŕ éẋþŕéššîöñš (đéƒàüļţ éḿþţý)
    dependsOn:
      - property: use_code_finder
        condition: ḿüšţ ƃé éñàƃļéđ ƒöŕ ţĥéšé þàţţéŕñš ţö àþþļý
limitations:
  - Ţĥé ŕéàđéŕ àþþļîéš ƃüîļţ-îñ éļéḿéñţ/àţţŕîƃüţé đéƒàüļţš; ţĥé `éļéḿéñţš` àñđ `àţţŕîƃüţéš` ḿàþš àđĵüšţ ţĥéḿ ŕàţĥéŕ ţĥàñ ŕéþļàçîñĝ ţĥé éñţîŕé ŕüļé šéţ.
processingNotes:
  - Îñļîñé éļéḿéñţš ƃéçöḿé îñļîñé çöđéš ŵîţĥîñ ƃļöçķš; ƃļöçķ-ļéṽéļ éļéḿéñţš ƒöŕḿ ţĥé šüŕŕöüñđîñĝ šţŕüçţüŕé.
  - Ţŕàñšļàţàƃļé àţţŕîƃüţéš (šüçĥ àš `àļţ` àñđ `ţîţļé`) àŕé éẋţŕàçţéđ àš ţĥéîŕ öŵñ ƃļöçķš.
examples:
  - title: Þŕéšéŕṽé ŵĥîţéšþàçé
    description: Ķééþ šîĝñîƒîçàñţ ŵĥîţéšþàçé îñ ţéẋţ ñöđéš îñšţéàđ öƒ çöļļàþšîñĝ îţ.
    config: |
