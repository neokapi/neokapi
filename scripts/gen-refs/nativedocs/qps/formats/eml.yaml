description: Ŕéàđ ţĥé šüƃĵéçţ àñđ þļàîñ-ţéẋţ ƃöđîéš öƒ àñ éḿàîļ ḿéššàĝé àñđ ŵŕîţé éđîţš îñţö ţĥé öŕîĝîñàļ ḿéššàĝé.
overview: |
  Àñ ÉḾĻ ƒîļé çöñţàîñš öñé Îñţéŕñéţ ḿéššàĝé. Ţĥé ŕéàđéŕ éẋţŕàçţš ţĥé šüƃĵéçţ
  àñđ éļîĝîƃļé îñļîñé þļàîñ-ţéẋţ ḾÎḾÉ þàŕţš. Ţĥé šüƃĵéçţ ĥàš à ĥéàđîñĝ ŕöļé.
  Éàçĥ éẋţŕàçţéđ ƃöđý ĥàš à þàŕàĝŕàþĥ ŕöļé. Ýöü çàñ çöñṽéŕţ ţĥéšé ƃļöçķš ţö
  Ḿàŕķđöŵñ öŕ ĐöçĻàñĝ ŵîţĥ ķçöñṽ.
processingNotes:
  - Ţĥé ŕéàđéŕ đéçöđéš ḾÎḾÉ éñçöđéđ ŵöŕđš îñ ţĥé šüƃĵéçţ àñđ ţŕàñšƒéŕ éñçöđîñĝš îñ þļàîñ-ţéẋţ ƃöđîéš.
  - "Ţĥé ŵŕîţéŕ üšéš ţĥé šöüŕçé šķéļéţöñ ţö þŕéšéŕṽé ĥéàđéŕš, ḾÎḾÉ ƃöüñđàŕîéš àñđ àţţàçĥḿéñţ ƃýţéš àŕöüñđ éđîţš."
limitations:
  - "Ţĥé ŕéàđéŕ ļéàṽéš ĤŢḾĻ, àţţàçĥḿéñţš, ƒļöŵéđ ţéẋţ àñđ šîĝñéđ öŕ éñçŕýþţéđ ḾÎḾÉ ƃöđîéš îñ ţĥé šöüŕçé šķéļéţöñ."
  - "Ŵĥéñ à ḿéššàĝé öƒƒéŕš þļàîñ ţéẋţ àñđ ĤŢḾĻ àš àļţéŕñàţîṽéš, ķàþî éđîţš ţĥé þļàîñ-ţéẋţ þàŕţ öñļý. À ḿàîļ çļîéñţ ţĥàţ þŕéƒéŕš ĤŢḾĻ šĥöŵš ţĥé öŕîĝîñàļ ƃöđý."
  - Àñ éđîţéđ šüƃĵéçţ öŕ ƃöđý ñö ļöñĝéŕ ḿàţçĥéš ţĥé ḿéššàĝé'š ĐĶÎḾ šîĝñàţüŕé.
  - "Ţĥé ŕéàđéŕ šüþþöŕţš þļàîñ-ţéẋţ ƃöđîéš îñ ÜŢƑ-8, ÜŠ-ÀŠÇÎÎ àñđ ÎŠÖ-8859-1. Îţ ļéàṽéš à ƃöđý îñ àñöţĥéŕ çĥàŕšéţ, öŕ 8-ƃîţ ţéẋţ ŵîţĥ ñö đéçļàŕéđ çĥàŕšéţ, îñ ţĥé šöüŕçé šķéļéţöñ."
  - Ţĥé ŕéàđéŕ ļéàṽéš à šüƃĵéçţ îñ ţĥé šöüŕçé šķéļéţöñ ŵĥéñ îţ îš 8-ƃîţ ţéẋţ ŵîţĥ ñö đéçļàŕéđ çĥàŕšéţ öŕ üšéš à çĥàŕšéţ ţĥàţ ķàþî çàññöţ đéçöđé.
  - Ŵŕîţîñĝ àñ ÉḾĻ ƒîļé ŕéǫüîŕéš îţš šöüŕçé ḿéššàĝé.
  - "Ŵîţĥ `ķàþî çĥéçķ --ṽàļîđàţé ŕéþöŕţ`, ţĥé ŕéàđéŕ ŕéþöŕţš éàçĥ þàŕţ îţ ļéàṽéš üñçĥàñĝéđ, àñ ĤŢḾĻ àļţéŕñàţîṽé ƃéšîđé àñ éẋţŕàçţéđ þļàîñ-ţéẋţ þàŕţ àñđ à ĐĶÎḾ šîĝñàţüŕé."
