steps:
  - comment: A terms store keeps terminology consistent across locales
  - command: kapi terms stats
    narration: The browser build pre-seeds a terms store from the project terms bundle.
  - command: kapi terms lookup password -s en -t fr
    narration: Look up a single term and its approved translation.
  - command: kapi terms search encrypt -s en
    narration: Search across every concept in the terms store.
  - comment: Pseudo-translate, then check terminology against the terms store
  # pseudo-translate runs against the scene's inline messages_en.json — W7
  # seeds the same sandbox the embed does, so both venues run it live.
  - command: kapi pseudo-translate messages_en.json -o pseudo_fr.json
    narration: Produce a target file to check.
  - command: kapi exec term-check pseudo_fr.json --source-lang en --target-lang fr
    narration: Flags target segments that violate the seeded terminology — the same check kapi up binds after every pass, so a violating unit cannot lift its locale over the gate.
    # smoke:false — consumes pseudo_fr.json from the previous step; W7 would run
    # it in isolation (no skip token on pseudo_fr.json) and fail.
    smoke: false
