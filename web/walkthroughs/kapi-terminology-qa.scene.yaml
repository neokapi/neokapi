# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-terminology-qa
#
# The browser (wasm) build pre-seeds an in-memory terms store from the same
# native terms bundle used here (kapi/cmd/kapi-wasm-cli/fixtures/terms.json), so
# the terms stats/lookup/search/import commands operate on a real backend with no
# SQLite. The inline `files` below give the embed the source catalogue and a
# visible copy of the terms bundle — the committed, reviewable form the terms
# store compiles from; `term-check` enforces the seeded terms.

id: kapi-terminology-qa
scene: terms-qa
mode: interactive

seed: []
