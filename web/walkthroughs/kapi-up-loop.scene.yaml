# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-up-loop
#
# The scene previews the work (`up --plan`) and runs `up`, which recycles every
# unit from the content memory. The ship gate requires review, so `up` holds
# French back. The scene reads the worklist (`status --review`) and shows the
# gate fail (`check --ship`, exit 3). It records the decisions (`apply`), shows
# the same gate pass (exit 0), and runs `up` again, which writes the French file.

# mode: video, because the wasm build (kapi/cmd/kapi-wasm-cli) has no `kapi up`
# or `kapi check`, and the exit codes are the point of the recording. The embed
# below runs the offline subset. It seeds the project with messages.fr.json
# already written, so `status --review`, `apply` and `status` run against the
# in-memory filesystem and show the same arc from review to shippable.

# Every venue is offline. The recipe's memory-recycle flow reads the content
# memory only, with no model and no network. The ship gate is translated: 100
# and established: 100, so only a person's decision can clear it.

id: kapi-up-loop
scene: up-loop
mode: video

# Steps the offline embed runs (status --review / apply / status). The
# generator builds the embed config from the steps marked `offline: true`.
# The embed seeds the project *already produced*: messages.fr.json carries the
# content memory's French, exactly what `kapi up` materializes in the recording.
embed:
  files:
    - path: kapi.yaml
      content: |
        version: v1
        name: demo
        defaults:
          source_language: en
          target_languages: [fr]
          flow: memory-recycle
          materialize: on-converge
        ship_gate: { translated: 100, established: 100 }
        collections:
          - path: messages.json
            target: "messages.{lang}.json"
        flows:
          memory-recycle:
            steps:
              - tool: recycle
    - path: messages.json
      content: |
        {
          "greeting": "Hello, World!",
          "farewell": "See you tomorrow",
          "items": {
            "cart": "Your cart is empty"
          }
        }
    - path: messages.fr.json
      content: |
        {
          "greeting": "Bonjour le monde !",
          "farewell": "À demain",
          "items": {
            "cart": "Votre panier est vide"
          }
        }
    - path: review.jsonl
      content: |
        {"op":"decide","at":{"doc":"messages.json","block":"greeting","edition":"fr"},"if_match":"r:1a83287c7ed96132","outcome":"establish"}
        {"op":"decide","at":{"doc":"messages.json","block":"farewell","edition":"fr"},"if_match":"r:4bd26660d12e70bf","outcome":"establish"}
        {"op":"decide","at":{"doc":"messages.json","block":"items.cart","edition":"fr"},"if_match":"r:5d8eff15e7ca8118","outcome":"establish"}

tape:
  width: 1000
  height: 700
  theme: Dracula
  padding: 20
  fontSize: 16

# Recording fixtures: the kit catalog, the committed content-memory bundle that
# supplies the French, the recipe with a translated and approved ship gate, and
# the reviewer's change set. The recording starts with no French file, and
# `kapi up` writes it.
seed:
  - messages.json
files:
  - path: project.memory.json
    content: |
      {
        "schemaVersion": "1.0",
        "kind": "kapi-memory",
        "entries": [
          {
            "id": "mem:en-fr:hello-world",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Hello, World!"
                }
              ],
              "fr": [
                {
                  "text": "Bonjour le monde !"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:see-you-tomorrow",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "See you tomorrow"
                }
              ],
              "fr": [
                {
                  "text": "À demain"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:your-cart-is-empty",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Your cart is empty"
                }
              ],
              "fr": [
                {
                  "text": "Votre panier est vide"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          }
        ]
      }
  - path: kapi.yaml
    content: |
      version: v1
      name: demo
      defaults:
        source_language: en
        target_languages: [fr]
        flow: memory-recycle
        materialize: on-converge
      ship_gate: { translated: 100, established: 100 }
      collections:
        - path: messages.json
          target: "messages.{lang}.json"
      flows:
        memory-recycle:
          steps:
            - tool: recycle
  - path: review.jsonl
    content: |
      {"op":"decide","at":{"doc":"messages.json","block":"greeting","edition":"fr"},"if_match":"r:1a83287c7ed96132","outcome":"establish"}
      {"op":"decide","at":{"doc":"messages.json","block":"farewell","edition":"fr"},"if_match":"r:4bd26660d12e70bf","outcome":"establish"}
      {"op":"decide","at":{"doc":"messages.json","block":"items.cart","edition":"fr"},"if_match":"r:5d8eff15e7ca8118","outcome":"establish"}

steps:
  - comment: The ship gate requires translated 100% and approved 100%. A machine can meet the first; only a person can meet the second.
  - command: kapi memory import project.memory.json
    narration: Import the committed bundle into the project's content memory. The flow reuses these translations without calling a provider.
    offline: false
  - command: kapi up --plan
    narration: --plan reports pending units, exact content-memory matches, remaining AI work and estimated tokens for each locale. It makes no provider calls or writes.
    offline: false
  - command: kapi up
    narration: up recycles all three French units from content memory and holds them back for review, so it writes no target file yet. The command exits zero.
    offline: false
  - command: kapi status --review
    narration: List translated units awaiting approval, each with the source document, block and language a decision names.
    # offline: true runs it in the embed against the seeded French file.
    # smoke: false, because it needs the multi-file project seeded and W7 runs
    # each command on its own (as kapi-review-and-approve does).
    offline: true
    smoke: false
  - command: kapi check --ship
    narration: Approved coverage is 0%, so check --ship fails with exit code 3. A release pipeline can use this exit status to enforce the gate.
    offline: false
  - comment: A person reads the three translations and records the decisions.
  - command: kapi apply review.jsonl
    narration: apply records each review decision, bound to the revision of the translation it names.
    offline: true
    smoke: false
  - command: kapi check --ship
    narration: The ship check now passes with exit code 0. The recorded approvals satisfy the review requirement without retranslating the content.
    offline: false
  - command: kapi status
    narration: French is shippable, with 100% translated and 100% approved coverage.
    offline: true
    smoke: false
  - command: kapi up
    narration: The decisions released French, so up writes messages.fr.json and reports produced 3.
    offline: false
