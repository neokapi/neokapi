# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-up-loop
#
# The kapi loop end to end: `up --plan`, `up`, `status --review`,
# `check --ship` failing with exit code 3, `apply`, and the same check passing.
#
# mode: video. `kapi up` and `kapi check` are native-only, so the exit codes
# are recorded. The embed runs `status --review`, `apply` and the closing
# `status` against a project whose French is already produced. The
# memory-recycle flow reads content memory and calls no provider. The ship
# gate needs established: 100, so only a person's approval clears it.

id: kapi-up-loop
scene: up-loop
mode: video

# Steps the offline embed runs (status --review / apply / status). The
# generator builds the embed config from the steps marked `offline: true`.
# The embed seeds the project *already produced*: messages.fr.json carries the
# content memory's French, exactly what `kapi up` materializes in the recording.
embed:
  files:
    - path: kapi.yaml
      content: |
        version: v1
        name: demo
        defaults:
          source_language: en
          target_languages: [fr]
          flow: memory-recycle
          materialize: on-converge
        ship_gate: { translated: 100, established: 100 }
        collections:
          - path: messages.json
            target: "messages.{lang}.json"
        flows:
          memory-recycle:
            steps:
              - tool: recycle
    - path: messages.json
      content: |
        {
          "greeting": "Hello, World!",
          "farewell": "See you tomorrow",
          "items": {
            "cart": "Your cart is empty"
          }
        }
    - path: messages.fr.json
      content: |
        {
          "greeting": "Bonjour le monde !",
          "farewell": "À demain",
          "items": {
            "cart": "Votre panier est vide"
          }
        }
    - path: review.jsonl
      content: |
        {"op":"decide","at":{"doc":"messages.json","block":"greeting","edition":"fr"},"if_match":"r:1a83287c7ed96132","outcome":"establish"}
        {"op":"decide","at":{"doc":"messages.json","block":"farewell","edition":"fr"},"if_match":"r:4bd26660d12e70bf","outcome":"establish"}
        {"op":"decide","at":{"doc":"messages.json","block":"items.cart","edition":"fr"},"if_match":"r:5d8eff15e7ca8118","outcome":"establish"}

tape:
  width: 1000
  height: 700
  theme: Dracula
  padding: 20
  fontSize: 16

# Recording fixtures: the kit catalog, the committed content-memory bundle that
# supplies the French, the recipe with a translated and approved ship gate, and
# the reviewer's change-set. The recording starts from an unproduced project;
# `kapi up` does the work.
seed:
  - messages.json
files:
  - path: project.memory.json
    content: |
      {
        "schemaVersion": "1.0",
        "kind": "kapi-memory",
        "entries": [
          {
            "id": "mem:en-fr:hello-world",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Hello, World!"
                }
              ],
              "fr": [
                {
                  "text": "Bonjour le monde !"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:see-you-tomorrow",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "See you tomorrow"
                }
              ],
              "fr": [
                {
                  "text": "À demain"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:your-cart-is-empty",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Your cart is empty"
                }
              ],
              "fr": [
                {
                  "text": "Votre panier est vide"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          }
        ]
      }
  - path: kapi.yaml
    content: |
      version: v1
      name: demo
      defaults:
        source_language: en
        target_languages: [fr]
        flow: memory-recycle
        materialize: on-converge
      ship_gate: { translated: 100, established: 100 }
      collections:
        - path: messages.json
          target: "messages.{lang}.json"
      flows:
        memory-recycle:
          steps:
            - tool: recycle
  - path: review.jsonl
    content: |
      {"op":"decide","at":{"doc":"messages.json","block":"greeting","edition":"fr"},"if_match":"r:1a83287c7ed96132","outcome":"establish"}
      {"op":"decide","at":{"doc":"messages.json","block":"farewell","edition":"fr"},"if_match":"r:4bd26660d12e70bf","outcome":"establish"}
      {"op":"decide","at":{"doc":"messages.json","block":"items.cart","edition":"fr"},"if_match":"r:5d8eff15e7ca8118","outcome":"establish"}

steps:
  - comment: The ship gate requires translated 100% and approved 100%. A machine can meet the first; only a person can meet the second.
  - command: kapi memory import project.memory.json
    narration: Import the committed bundle into the project's content memory. The flow reuses these translations instead of calling a provider.
    offline: false
  - command: kapi up --plan
    narration: "--plan reports what is pending per language: exact content-memory matches, the AI work left and an estimate of its tokens. It calls no provider and writes nothing."
    offline: false
  - command: kapi up
    narration: up fills every French target from content memory. French then waits for review, because only a person can approve. The command exits zero.
    offline: false
  - command: kapi status --review
    narration: List the translated blocks awaiting approval, each with the document, block and language a decision names.
    # offline:true: runs live in the embed against the pre-produced project.
    # smoke:false: needs the multi-file project seeded; W7 runs commands in
    # isolation (same policy as kapi-review-and-approve).
    offline: true
    smoke: false
  - command: kapi check --ship
    narration: Approved coverage is 0%, so check --ship fails with exit code 3. A release pipeline can use this exit code as the gate.
    offline: false
  - comment: A person reads the three translations and records the decisions.
  - command: kapi apply review.jsonl
    narration: apply records each review decision, bound to the revision of the translation it names.
    offline: true
    smoke: false
  - command: kapi check --ship
    narration: The ship check now passes with exit code 0. The recorded approvals satisfy the review requirement, and nothing was retranslated.
    offline: false
  - command: kapi status
    narration: "French is shippable: 100% translated and 100% approved."
    offline: true
    smoke: false
