# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-project-workflow
#
# The project lifecycle (AD-026) in the order people run it: init, ls,
# memory import, status, up, then the steps up automates: run, merge,
# status, extract.
#
# `kapi up` runs the project's flow over every target language until each
# ship gate is met or the rest waits for a person. The memory-recycle flow
# reads content memory and calls no provider, so every runnable step works in
# the browser embed. `kapi up` is native-only; run and merge do its work there.

id: kapi-project-workflow
scene: project-workflow
mode: interactive

# messages.json is the kit fixture (greeting, farewell, cart).
# project.memory.json is the committed content-memory bundle with the matching
# French, so content memory fills real targets offline. kapi.yaml is the recipe
# `kapi init` scaffolds, pre-written here with the content declared (a target
# template makes coverage derivable) and a memory-recycle flow as
# defaults.flow. The flow has a name of its own so it reads apart from the
# built-in verbs. init is runnable below: it is idempotent and reports that the
# project is already initialized.
seed:
  - messages.json
files:
  - path: project.memory.json
    content: |
      {
        "schemaVersion": "1.0",
        "kind": "kapi-memory",
        "entries": [
          {
            "id": "mem:en-fr:hello-world",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Hello, World!"
                }
              ],
              "fr": [
                {
                  "text": "Bonjour le monde !"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:see-you-tomorrow",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "See you tomorrow"
                }
              ],
              "fr": [
                {
                  "text": "À demain"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:your-cart-is-empty",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Your cart is empty"
                }
              ],
              "fr": [
                {
                  "text": "Votre panier est vide"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          }
        ]
      }
  - path: kapi.yaml
    content: |
      version: v1
      name: demo
      defaults:
        source_language: en
        target_languages: [fr]
        flow: memory-recycle
      collections:
        - path: messages.json
          target: "messages.{lang}.json"
      flows:
        memory-recycle:
          steps:
            - tool: recycle

steps:
  - comment: A kapi project keeps config-as-code (languages, content, flows) in a committed recipe; .kapi/ beside it is a cache that version control ignores.
  - command: kapi init --name demo --source-locale en --target-locale fr
    narration: init writes the recipe with a collection for each kind of content it recognises, an MCP entry and one short skill for coding agents. Run it again on an existing project and it leaves the collections as they are.
    smoke: true
  - command: kapi ls
    narration: ls lists the files the recipe tracks. Here, one JSON catalog, mapped to a messages.{lang}.json target per language.
    smoke: true
  - comment: Seed the project content memory so the flow has matches to reuse.
  - command: kapi memory import project.memory.json
    narration: memory import loads the committed bundle into the project's content memory, so the flow can reuse it.
    smoke: true
  - command: kapi status
    narration: status reports each language's coverage. French has no translated content yet. That is pending work, not a build failure.
    smoke: true
  - comment: One verb brings the project up to date.
  - command: kapi up
    narration: up runs the project's flow until each language meets its ship gate or waits for review. Here content memory supplies every French translation in one pass, and up writes messages.fr.json.
    # offline:false: `up` is not wired into the wasm build; the run then merge
    # beats below do the same work in the embed.
    offline: false
  - comment: Under the hood, up loops plumbing you can run by hand.
  - command: kapi run memory-recycle -i messages.json
    narration: run executes one pass of a named flow and stores the results, for merge to write to files.
    # smoke:false: consumes the content memory seeded by the prior memory import step; W7 would
    # run it in isolation (no content memory) and reuse nothing.
    smoke: false
  - command: kapi merge
    narration: merge writes each target file from the stored translations, here messages.fr.json. A file that already matches the store is left alone, so after up it reports nothing written.
    # smoke:false: consumes the overlays committed by the prior run step.
    smoke: false
  - command: kapi status
    narration: French now has 100% translated coverage, derived from the current content.
    # smoke:false: depends on the merge step above having written the target.
    smoke: false
  - comment: extract and merge are also the interchange doors when a person translates.
  - command: kapi extract --target-lang fr
    narration: extract writes a bilingual XLIFF per target language, pre-filled from content memory. A translator edits that file, and merge applies the returned translations.
    smoke: true
