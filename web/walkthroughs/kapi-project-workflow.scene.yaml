# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-project-workflow
#
# Walks the .kapi *project* lifecycle (AD-026), led by the verb people run
# day to day:
#
#   init → ls → tm import → status → up → (under the hood: run → merge →
#   status → extract)
#
# `kapi up` is the porcelain: it treats the recipe as the desired state and
# loops the project's flow across every target locale until each ship gate is
# met or the remainder parks for a person. The closing beats run the plumbing
# that loop automates — one flow pass (`run`), materializing files (`merge`),
# and the bilingual handoff (`extract`).
#
# Offline contract: the recipe's tm-recycle flow leverages content memory
# only (no LLM), and `tm import` tops up the wasm build's pre-seeded in-memory
# content memory — so every runnable step works in the browser embed. `kapi up` itself is
# not wired into the wasm build (kapi/cmd/kapi-wasm-cli); it is offline: false
# and appears in the tape + narration only. The run → merge beats do the same
# work in the embed, so both venues end on the same up-to-date grid.

id: kapi-project-workflow
scene: project-workflow
mode: interactive

# messages.json is the kit fixture (greeting / farewell / cart). project.tmx
# carries the matching French so the content memory fills real targets offline. kapi.yaml
# is the recipe `kapi init` scaffolds — here pre-written with the content
# already declared (a target template is what makes coverage derivable) and a
# tm-recycle flow as defaults.flow. Flow names must not shadow the built-in
# porcelain flows (translate, pseudo-translate), so the recipe flow gets its
# own name. (init is genuinely runnable below — it is idempotent and reports
# the project is already initialized.)
seed:
  - messages.json
files:
  - path: project.tmx
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <tmx version="1.4">
        <header creationtool="neokapi" creationtoolversion="1.0"
                segtype="sentence" o-tmf="unknown" adminlang="en"
                srclang="en" datatype="plaintext"/>
        <body>
          <tu>
            <tuv xml:lang="en"><seg>Hello, World!</seg></tuv>
            <tuv xml:lang="fr"><seg>Bonjour le monde !</seg></tuv>
          </tu>
          <tu>
            <tuv xml:lang="en"><seg>See you tomorrow</seg></tuv>
            <tuv xml:lang="fr"><seg>À demain</seg></tuv>
          </tu>
          <tu>
            <tuv xml:lang="en"><seg>Your cart is empty</seg></tuv>
            <tuv xml:lang="fr"><seg>Votre panier est vide</seg></tuv>
          </tu>
        </body>
      </tmx>
  - path: kapi.yaml
    content: |
      version: v1
      name: demo
      defaults:
        source_language: en
        target_languages: [fr]
        flow: tm-recycle
      content:
        - path: messages.json
          target: "messages.{lang}.json"
      flows:
        tm-recycle:
          steps:
            - tool: recycle

steps:
  - comment: A .kapi project keeps config-as-code — languages, content, flows — in a committed recipe beside a .kapi/ state dir.
  - command: kapi init --name demo --source-locale en --target-locale fr
    narration: init scaffolds the {name}.kapi recipe and the .kapi/ state dir. It is idempotent — safe to re-run on an existing project.
    smoke: true
  - command: kapi ls
    narration: ls lists the files the recipe's content tracks. Here one JSON catalog, mapped to a messages.{lang}.json target per locale.
    smoke: true
  - comment: Seed the project content memory so the flow has matches to reuse.
  - command: kapi tm import project.tmx
    narration: tm import loads existing translations into the project content memory (.kapi/tm.db). The flow leverages it before any AI is asked.
    smoke: true
  - command: kapi status
    narration: status derives each locale's standing from the working tree. fr is at zero — pending work, never a build failure.
    smoke: true
  - comment: One verb brings the project up to date.
  - command: kapi up
    narration: up treats the recipe as the desired state. It runs the project's flow across every target locale, pass after pass, until each ship gate is met or the rest parks for a person. Here the content memory covers everything, so fr catches up in one pass.
    # offline:false — `up` is not wired into the wasm build; the run → merge
    # beats below do the same work in the embed.
    offline: false
  - comment: Under the hood, up loops plumbing you can run by hand.
  - command: kapi run tm-recycle -i messages.json
    narration: run executes one pass of one named flow. In a project the pass is process-only — it commits results to the project store, not to files.
    # smoke:false — consumes the content memory seeded by the prior tm import step; W7 would
    # run it in isolation (no content memory) and leverage nothing.
    smoke: false
  - command: kapi merge
    narration: merge materializes the localized files from the store — it replays the stored fr targets onto the source and writes messages.fr.json.
    # smoke:false — consumes the overlays committed by the prior run step.
    smoke: false
  - command: kapi status
    narration: The grid `up` catches up toward — fr translated 100%. Coverage is derived from the files on every run, never tracked as state.
    # smoke:false — depends on the merge step above having written the target.
    smoke: false
  - comment: extract and merge are also the interchange doors when a person translates.
  - command: kapi extract --target-lang fr
    narration: extract emits a bilingual XLIFF per target locale, pre-filled from the content memory — the handoff a human translator works in. merge applies the returned file. up automates this loop; the plumbing stays addressable.
    smoke: true
