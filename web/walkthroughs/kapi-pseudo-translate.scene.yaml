# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-pseudo-translate

id: kapi-pseudo-translate
scene: pseudo-translate
mode: interactive

seed:
  - messages.json
files: []

steps:
  - comment: The pre-flight check — prove the UI is ready before buying any translation
  - command: kapi pseudo-translate messages.json -o messages.fr.json
    narration: >-
      Expands every string with locale-shaped accent characters and length
      padding, so truncation, concatenation, and hardcoded-string bugs surface
      before any real translation is bought. No AI provider, no keys.
  - comment: When the UI holds up, `kapi translate` produces the real translations for ad-hoc files — or `kapi up` brings a whole project up to date.
