# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-terminology-checks
#
# The first step imports the inline terms bundle (`terms.json`, the committed,
# reviewable form a terms store compiles from) into a terms store, `terms.db`
# beside it. The stats, lookup and search steps read that store, and
# `term-check` enforces it through `--termstore`, in the browser embed as in a
# terminal: the browser build runs the same SQLite stores.

id: kapi-terminology-checks
scene: terms-checks
mode: interactive

seed: []
