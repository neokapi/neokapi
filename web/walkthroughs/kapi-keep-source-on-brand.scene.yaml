# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-keep-source-on-brand
#
# STATUS: script authored, NOT yet recorded. The docs reference it via a
# <PendingMedia> placeholder until the owner approves regeneration via the
# harness.
#
# Surface note (2026-07): `kapi check` carries the file-against-profile check
# (--profile-file); `kapi voice check` reads text from --input-text/stdin and
# scores it. `kapi voice rewrite` is the deterministic, offline term
# substitution — kapi does not send content to a model to rewrite it; tone and
# style fixes go through `kapi apply` with the voice guide as context.
# The former seed fixtures (product-page.md, voice.yaml) were not in the
# playground kit, so both are inline files now.
#
# Wasm note: `kapi stats` runs in the browser embed; `kapi check` and the
# `kapi voice` group are not wired into the wasm build, so those steps are
# offline: false (tape + narration only).

id: kapi-keep-source-on-brand
scene: keep-source-on-brand
mode: interactive

seed: []
files:
  - path: voice.yaml
    content: |
      name: Lumen Notes
      description: Plain, direct product voice for Lumen Notes pages.

      tone:
        personality: [clear, direct, calm]
        formality: neutral
        guidelines: Address the reader as "you". State what the product does; avoid hype.

      style:
        active_voice: true

      vocabulary:
        preferred_terms:
          - term: sign in
            note: not "log in"
        forbidden_terms:
          - term: utilize
            replacement: use
            severity: minor
          - term: game-changing
            replacement: ""
            severity: major
        competitor_terms:
          - term: NoteCorp
            replacement: other note apps
            severity: major
  - path: product-page.md
    content: |
      # Lumen Notes

      Lumen Notes keeps every note in plain Markdown files you own.

      ## Why teams switch

      Our game-changing sync engine means you can utilize your notes
      anywhere. Unlike NoteCorp, Lumen Notes works offline first.

      ## Get started

      Log in, create a notebook, and invite your team.

steps:
  - comment: Survey the source before checking it
  - command: kapi stats product-page.md
    narration: >-
      A content-metrics overview — blocks, words, and a by-role breakdown —
      so you know the shape of what you are about to check.
  - comment: Check the source against the voice profile
  - command: kapi check product-page.md --profile-file voice.yaml
    narration: >-
      The profile carries the vocabulary, forbidden terms, and tone rules.
      The check returns a score and one located finding per off-brand block.
    offline: false
  - comment: Read the report — each finding names the rule it violated and where
  - command: kapi check product-page.md --profile-file voice.yaml --json
    narration: >-
      The same report as machine-readable JSON. The stable rule id is the key
      an AI fix-loop tracks across iterations; --max-major 0 turns the score
      into a gate.
    offline: false
  - comment: Fix the terms deterministically — no model involved
  - command: kapi voice rewrite --profile-file voice.yaml --input-text "Unlike NoteCorp, you can utilize Lumen Notes offline."
    narration: >-
      brand rewrite substitutes forbidden and competitor terms for their
      approved replacements, offline, and reports each change. Tone and style
      fixes go through kapi apply, with the voice guide as context.
    offline: false
  - comment: Re-check until the gate is green — the same loop `kapi check --ship` enforces in a project
