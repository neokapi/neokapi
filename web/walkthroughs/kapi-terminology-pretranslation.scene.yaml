# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-terminology-pretranslation
#
# The inline files below provide the source catalogue and the committed
# content-memory bundle. `memory import` loads the bundle into a content memory,
# `memory.db` beside it, which `recycle --memory` leverages. The three steps
# (content-memory leverage, pseudo-translating the misses, term-check) run
# offline, in the browser embed as in a terminal: the browser build runs the
# same SQLite stores.

id: kapi-terminology-pretranslation
scene: terms-pretranslation
mode: interactive

seed: []
files:
  - path: project.memory.json
    content: |
      {
        "schemaVersion": "1.0",
        "kind": "kapi-memory",
        "entries": [
          {
            "id": "mem:en-fr:file-upload",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "File upload"
                }
              ],
              "fr": [
                {
                  "text": "Téléversement de fichier"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:settings",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Settings"
                }
              ],
              "fr": [
                {
                  "text": "Paramètres"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          }
        ]
      }
  - path: messages_en.json
    content: |
      {
        "login_title": "Log in to your dashboard",
        "login_prompt": "Enter your username and password",
        "settings_label": "Settings",
        "upload_heading": "File upload",
        "encryption_note": "All files use encryption"
      }

steps:
  - comment: This is the front half of the default flow `kapi up` loops — run here one move at a time.
  # memory import / recycle run against the scene's inline project.memory.json /
  # messages_en.json — W7 seeds the same sandbox the embed does, so both
  # venues run them live. The bundle is the native serialization, so the import
  # needs no locale or format flags — the .memory.json suffix resolves it.
  - command: kapi memory import project.memory.json
    narration: Load the committed content-memory bundle for reuse before translation.
  - comment: Step 1 — leverage content memory
  - command: kapi exec recycle messages_en.json -o step1_tm.json --source-lang en --target-lang fr --memory memory.db
    narration: recycle is the first step of up's default flow. Exact and fuzzy matches fill from the content memory; the rest stay untranslated.
  - comment: Step 2 — pseudo-translate the remaining misses
  - command: kapi pseudo-translate step1_tm.json -o step2_translated.json
    narration: Pseudo-translate the unmatched content. The default up flow uses AI translation at this step.
    # smoke:false — consumes step1_tm.json from the previous step; W7 would run
    # it in isolation (no skip token on step1_tm.json) and fail.
    smoke: false
  - comment: Step 3 — verify terminology compliance
  - command: kapi exec term-check step2_translated.json --source-lang en --target-lang fr
    narration: Check the output against the required terminology. up applies the same check after each pass.
    # smoke:false — consumes step2_translated.json from the previous step.
    smoke: false
