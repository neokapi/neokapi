# Unified scene spec (W3, issue #661). See kapi-overview.scene.yaml for the
# full schema. Regenerate with:
#   node --experimental-strip-types scripts/walkthrough-gen/gen.ts kapi-under-the-hood
#
# The plumbing track for localization engineers. `kapi up` is porcelain; this
# scene runs the layer underneath, one move at a time, and maps each move to
# what `up` automates:
#
#   exec <tool>   → one registry tool, one pass, no guardrails
#   run <flow>    → one pass of one composed pipeline (process-only in a project)
#   extract/merge → the bilingual interchange a human translator works in
#
# Pairs with the docs "Understanding the CLI layers" page
# (/kapi/direct-execution-layer).
#
# Fully offline: recycle leverages the pre-seeded/in-memory content memory, the composed
# flow is recycle + deterministic rule-based checks, and extract/merge are pure
# filesystem + skeleton round-trip. Every runnable step works in the wasm embed.

id: kapi-under-the-hood
scene: under-the-hood
mode: interactive

# messages.json is the kit fixture (greeting / farewell / cart).
# project.memory.json is the committed content-memory bundle carrying the
# matching French so recycle has real leverage. kapi.yaml declares
# the content (with a target template) and two non-shadowing flows: tm-recycle
# (the single content memory step) and leverage-check (recycle composed with the
# deterministic rule-based checks).
seed:
  - messages.json
files:
  - path: project.memory.json
    content: |
      {
        "schemaVersion": "1.0",
        "kind": "kapi-memory",
        "entries": [
          {
            "id": "mem:en-fr:hello-world",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Hello, World!"
                }
              ],
              "fr": [
                {
                  "text": "Bonjour le monde !"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:see-you-tomorrow",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "See you tomorrow"
                }
              ],
              "fr": [
                {
                  "text": "À demain"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          },
          {
            "id": "mem:en-fr:your-cart-is-empty",
            "hintSrcLang": "en",
            "variants": {
              "en": [
                {
                  "text": "Your cart is empty"
                }
              ],
              "fr": [
                {
                  "text": "Votre panier est vide"
                }
              ]
            },
            "created": "2026-01-01T00:00:00Z",
            "updated": "2026-01-01T00:00:00Z"
          }
        ]
      }
  - path: kapi.yaml
    content: |
      version: v1
      name: demo
      defaults:
        source_language: en
        target_languages: [fr]
        flow: tm-recycle
      collections:
        - path: messages.json
          target: "messages.{lang}.json"
      flows:
        tm-recycle:
          steps:
            - tool: recycle
        leverage-check:
          steps:
            - tool: recycle
            - tool: qa

steps:
  - comment: kapi up is porcelain. This is the layer underneath — one tool, one flow pass, and the interchange files.
  - command: kapi memory import project.memory.json
    narration: Seed the project content memory from the committed bundle so the plumbing has leverage to work with. up tops up the same store on every merge.
    smoke: true
  - comment: One tool, one pass — kapi exec.
  - command: kapi exec recycle messages.json -o step1.json --source-lang en --target-lang fr
    narration: exec runs exactly one registry tool, nothing around it. recycle is the content memory step of up's default flow — exact and fuzzy matches fill the targets; the rest stay untranslated.
    smoke: true
  - comment: One named pipeline, one pass — kapi run.
  - command: kapi run leverage-check -i messages.json
    narration: run executes a composed flow once — recycle, then the deterministic rule-based checks. In a project the pass commits to the project store. up is this pass, looped until every gate is met or the rest parks.
    # smoke:false — consumes the content memory seeded by the prior memory import step; W7 would
    # run it in isolation (no content memory) and leverage nothing.
    smoke: false
  - comment: The interchange doors — extract and merge.
  - command: kapi extract --target-lang fr
    narration: extract emits one bilingual XLIFF per source and target pair, pre-filled from the content memory — the handoff a human translator works in.
    smoke: true
  - command: kapi merge -i out/messages.en-to-fr.xliff
    narration: merge applies the returned file back onto the source and writes messages.fr.json. Applied targets also land in the content memory, so the next pass starts further ahead.
    # smoke:false — consumes the XLIFF emitted by the prior extract step.
    smoke: false
  - comment: Every move here is one up runs for you — re-extract, produce a pass, materialize. The plumbing stays addressable when you need one move at a time.
