# Dogfood recipe: neokapi localizes its own surfaces with kapi.
#
# This is the repo-root project that the upward recipe walk discovers
# (core/project.ResolveLayout). Every other in-repo kapi invocation must
# isolate itself per the contract in CLAUDE.md ("Dogfooding kapi") —
# KAPI_NO_PROJECT=1 et al. — so only the dogfood workflow binds here.
#
# Surfaces. Collection names are <product>-<channel>: the product the content
# belongs to, then the surface it ships on.
#
# The product axis names the two things this repo ships: `neokapi`, the
# open-source framework and the kapi CLI built on it, and `bowrain`, the
# platform. The binary is called kapi and the framework is called neokapi, so
# naming the axis after the binary made the framework's own surfaces read as
# the CLI's. `kapi` is a channel within neokapi, not a product beside bowrain.
#
#   neokapi-cli            — the CLI's own help and output chrome
#                            (host/i18n/commands.json) → gettext MO catalogs
#                            embedded in the kapi binary (host/i18n)
#   neokapi-engine         — generated tool/format metadata → gettext MO
#                            catalogs embedded in the kapi binary (core/i18n)
#   neokapi-desktop        — KBF catalogs extracted from the React frontend by
#                            @neokapi/i18n-react →
#                            public/translations/<locale>.json
#   bowrain-app            — the shared bowrain SPA (bowrain/packages/{app,ui}
#                            + the web and desktop shells), same neokapi-i18n
#                            pipeline → each shell's
#                            public/translations/<locale>.json
#   bowrain-ctrl           — the ctrl admin app (bowrain/apps/ctrl)
#   bowrain-pulse          — the pulse dashboard (bowrain/apps/pulse)
#   neokapi-docs           — the kapi Docusaurus site → web/i18n/<locale>/ tree
#   bowrain-docs           — the bowrain Docusaurus site (bowrain/web/docs) →
#                            bowrain/web/docs/i18n/<locale>/ tree
#   neokapi-demos          — harness demo scripts → generated demo.<lang>.yaml
#                            sidecars (harness/demos/<id>/, overlaid at load
#                            time)
#   bowrain-email          — KBF catalogs extracted from the React Email
#                            templates (bowrain/emails/src) by
#                            @neokapi/i18n-react → per-locale template renders
#                            under bowrain/mailer/templates/<lang>/
#                            (make l10n-emails)
#   bowrain-email-subjects — transactional-email subject lines
#                            (bowrain/mailer/subjects/en.json) →
#                            subjects/<lang>.json
#   bowrain-landing        — KBF catalogs extracted from the bowrain landing
#                            SPA (bowrain/web/landing/src) → committed runtime
#                            catalogs
#                            bowrain/web/landing/translations/<lang>.json
#                            (make l10n-landing)
#
# Drive it with the l10n-* Makefile targets. Seeds (brand voice, terms,
# reviewed content memory) live under l10n/.
version: v1
name: neokapi
defaults:
  source_language: en
  target_languages: [nb]
  brand_voice:
    profile_file: context/brand-voice.yaml
  # terms_source is the committed, git-tracked terms document (the review
  # surface `kapi apply` term-edits write to); it compiles into the project
  # store (.kapi/store.db), which is derived. Source of truth lives in git,
  # never in the store.
  terms_source: context/terms.json
  memory:
    fuzzy_threshold: 75
  # YAML surface = the harness demo scripts (the only yaml content items).
  # Only the spoken/displayed keys are translatable — never ids, beats,
  # commands, paths, or timings. Declared here (not per-item) because the
  # flow-run path that l10n-demos drives binds reader config from
  # defaults.formats; extract/up/merge merge these same defaults per item.
  formats:
    yaml:
      config:
        keyPathPatterns:
          - title
          - subtitle
          - narration.*.text
          - narration.*.caption
    # Docs frontmatter: same reason as yaml above — the flow-run path behind
    # l10n-docs / l10n-bowrain-docs binds reader config from defaults.formats
    # only, so the frontmatter keys must live here too (the per-item config
    # below covers extract/up/merge, which overlay these defaults per item).
    markdown:
      config:
        translateFrontMatter: true
        frontMatterKeys: [title, description, sidebar_label]
    mdx:
      config:
        translateFrontMatter: true
        frontMatterKeys: [title, description, sidebar_label]
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - "web/build/**"
    - "web/i18n/**"
    - "bowrain/web/docs/build/**"
    - "bowrain/web/docs/i18n/**"
    - "harness/public/**"
    - "**/testdata/**"
# The coordinate space this project's content sits in. Two products share one
# repository and one kapi project, so `product` is what tells their content
# apart; `channel` is the surface it appears on. Values are slugs — stable
# identifiers that cross the sync wire, not vocabulary.
coordinates:
  product: [neokapi, bowrain]
  channel: [cli, engine, desktop, docs, demos, app, ctrl, pulse, landing, email]

# Governance bound to a point in that space. A collection matching no profile
# falls back to defaults.brand_voice below.
profiles:
  - when: { product: neokapi }
    voice: context/brand-voice.yaml
  - when: { product: bowrain }
    voice: context/bowrain-voice.yaml

content:
  - name: neokapi-engine
    context: { product: neokapi, channel: engine }
    items:
      - path: core/i18n/builtins/metadata.json
        format:
          name: json
          config:
            extractAllPairs: false
            useKeyAsName: true
            useFullKeyPath: true
            useLeadingSlashOnKeyPath: true
            extractionRules: "(display_name|description|title|label)$"
        target: core/i18n/catalogs/{lang}.mo
  # The CLI's own help and output chrome. It was the one shipped surface the
  # graph never named: `make l10n-cli` has always produced its catalogs, but
  # with no collection declaring it, nothing about the text a user reads at the
  # terminal was governed, searchable, or visible in the workspace.
  - name: neokapi-cli
    context: { product: neokapi, channel: cli }
    items:
      # Bare `json`, matching `make l10n-cli` exactly — it recycles this file
      # with `kapi exec recycle host/i18n/commands.json -f json`. The catalog
      # holds command help (short/long) alongside output chrome, so a narrower
      # extraction rule would govern some of the text a user reads and not the
      # rest, and the collection would disagree with the target it produces.
      - path: host/i18n/commands.json
        format:
          name: json
        target: host/i18n/catalogs/{lang}.mo
  - name: neokapi-desktop
    context: { product: neokapi, channel: desktop }
    items:
      - path: apps/kapi-desktop/frontend/i18n/**/*.kbf.json
        target: apps/kapi-desktop/frontend/i18n-{lang}/{filename}
  - name: bowrain-app
    context: { product: bowrain, channel: app }
    items:
      - path: bowrain/packages/app/i18n/**/*.kbf.json
        target: bowrain/packages/app/i18n-{lang}/{filename}
  - name: bowrain-ctrl
    context: { product: bowrain, channel: ctrl }
    items:
      - path: bowrain/apps/ctrl/i18n/**/*.kbf.json
        target: bowrain/apps/ctrl/i18n-{lang}/{filename}
  - name: bowrain-pulse
    context: { product: bowrain, channel: pulse }
    items:
      - path: bowrain/apps/pulse/i18n/**/*.kbf.json
        target: bowrain/apps/pulse/i18n-{lang}/{filename}
  - name: neokapi-docs
    context: { product: neokapi, channel: docs }
    items:
      # Docusaurus v3 parses .md as MDX by default (no markdown.format
      # override in docusaurus.config.ts), and these files use ESM imports and
      # JSX freely — so the mdx reader is the truthful format. The markdown
      # reader treated an `import { BlockPreview } …` line as a paragraph of
      # prose, and the first convergence run translated it.
      - path: web/docs/**/*.md
        format:
          name: mdx
          config:
            translateFrontMatter: true
            frontMatterKeys: [title, description, sidebar_label]
        target: web/i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.md
      - path: web/docs/**/*.mdx
        format:
          name: mdx
          config:
            translateFrontMatter: true
            frontMatterKeys: [title, description, sidebar_label]
        target: web/i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.mdx
  - name: bowrain-docs
    context: { product: bowrain, channel: docs }
    items:
      # .md is MDX here for the same reason as the neokapi docs above.
      - path: bowrain/web/docs/docs/**/*.md
        format:
          name: mdx
          config:
            translateFrontMatter: true
            frontMatterKeys: [title, description, sidebar_label]
        target: bowrain/web/docs/i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.md
      - path: bowrain/web/docs/docs/**/*.mdx
        format:
          name: mdx
          config:
            translateFrontMatter: true
            frontMatterKeys: [title, description, sidebar_label]
        target: bowrain/web/docs/i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.mdx
  - name: bowrain-email
    context: { product: bowrain, channel: email }
    items:
      - path: bowrain/emails/i18n/**/*.kbf.json
        target: bowrain/emails/i18n-{lang}/{filename}
  - name: bowrain-email-subjects
    context: { product: bowrain, channel: email }
    items:
      - path: bowrain/mailer/subjects/en.json
        format:
          name: json
        target: bowrain/mailer/subjects/{lang}.json
  - name: bowrain-landing
    context: { product: bowrain, channel: landing }
    items:
      - path: bowrain/web/landing/i18n/**/*.kbf.json
        target: bowrain/web/landing/i18n-{lang}/{filename}
  - name: neokapi-demos
    context: { product: neokapi, channel: demos }
    items:
      # Narrated demo-video scripts. The English demo.yaml is the master;
      # localized narration is GENERATED into committed demo.<lang>.yaml
      # sidecars (make l10n-demos, content memory-driven) that the harness overlays at
      # load time. Never hand-edit a sidecar — fix the content memory seed instead
      # (context/memory/demo-narration-<lang>.memory.json). Translatable keys are
      # selected by defaults.formats.yaml.config.keyPathPatterns above.
      - path: harness/demos/*/demo.yaml
        format:
          name: yaml
        target: harness/demos/{dir}/demo.{lang}.yaml
flows:
  # Exact-match content-memory leverage only (no AI, no checks): the deterministic pass
  # behind `make l10n-demos`. Named tm-recycle so it does not shadow the
  # built-in `recycle`/`translate` flows (built-ins win in `kapi run`).
  tm-recycle:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
  # content memory-driven translation: reviewed translations live in the project content memory
  # (seeded from context/memory/*.tmx); exact matches fill the target, terminology
  # compliance is checked against the project terms.
  translate:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
      - tool: term-check
  # AI translation for new/changed strings: content memory first, then translate for
  # the misses (brand voice + glossary are bound project-wide), then checks.
  # Requires provider credentials (keychain or ANTHROPIC_API_KEY).
  translate-ai:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
      - tool: translate
        config:
          provider: anthropic
      - tool: term-check
      - tool: qa
  pseudo:
    steps:
      - tool: pseudo-translate

# ─────────────────────────────────────────────────────────────────────────────
# Customer #1: bowrain.cloud dogfood — ACTIVATED 2026-07-17 (epic 017-F, D2)
#
# neokapi is the first real workspace on Bowrain. `kapi push` sends every surface
# above to the project below; nb drafts land in the governed review queue and
# approved segments round-trip back into context/memory/*.memory.json.
#
# converge: manual — a push moves content but does NOT auto-start a server AI
# convergence run. The first on-push run (2026-07-17) tried to AI-draft the whole
# ~18.8k-block untranslated corpus with an empty server content memory (content memory 0 · AI everything)
# and stalled on the workspace credit allowance. Convergence is now started
# deliberately — scoped, and only once the server content memory is seeded and/or a BYO AI
# key is set (BYO burns no credits, DECISIONS L3) — via `kapi up` or the REST
# convergence endpoint. Transport (kapi push) stays pure either way.
#
# This `server:` block makes the recipe bowrain-connected. It is the ONLY in-repo
# kapi invocation that binds here — every other one isolates via KAPI_NO_PROJECT
# (CLAUDE.md "Dogfooding kapi"), so tests / make targets / recorders are
# unaffected. The nightly + manual sync runs in .github/workflows/dogfood-sync.yml
# (gated on the DOGFOOD_SYNC_ENABLED repo variable, token in BOWRAIN_AUTH_TOKEN).
#
# To disconnect: re-comment this block and unset DOGFOOD_SYNC_ENABLED. Runbook:
# web/docs/contribute/implementation/dogfood-sync.md
server:
  url: "https://app.bowrain.cloud/bowrain-hq/uek630Q5"   # <server>/<workspace>/<project-id>
  stream: "$auto"      # auto-detect from git branch / CI (default)
  converge: manual     # push never auto-converges; start the loop deliberately
