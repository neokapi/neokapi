# Dogfood recipe: neokapi translates its own surfaces with kapi.
#
# This is the repo-root project that the upward recipe walk discovers
# (core/project.ResolveLayout). Every other in-repo kapi invocation must
# isolate itself per the contract in CLAUDE.md ("Dogfooding kapi") —
# KAPI_NO_PROJECT=1 et al. — so only the dogfood workflow binds here.
#
# Surfaces. A collection is named <profile>-<channel>: the product the content
# belongs to, then the surface it ships on. Both come from `channel:`, which
# names the point in the context space the collection's content sits at.
#
# The profile names the two things this repo ships: `neokapi`, the open-source
# framework and the kapi CLI built on it, and `bowrain`, the platform. The
# binary is called kapi and the framework is called neokapi, so naming the
# profile after the binary made the framework's own surfaces read as the CLI's.
# `cli` is a channel within neokapi, not a product beside bowrain.
#
#   neokapi-cli            — the CLI's own help and output chrome
#                            (host/i18n/commands.json) → host/i18n/catalogs/
#                            <lang>.json
#   neokapi-engine         — generated tool/format metadata
#                            (core/i18n/builtins/metadata.json) →
#                            core/i18n/catalogs/<lang>.json
#
# Both Go collections write translated JSON in the shape of their source: text
# a reviewer reads in a diff. gettext MO stays the runtime format, and
# `go run ./core/i18n/gen/catalogs` compiles each committed <lang>.json into
# the sibling <lang>.mo the binary embeds. The MO is build output — regenerated
# ahead of anything that compiles core/i18n or host/i18n, and not in version
# control.
#   neokapi-desktop        — KBF catalogs extracted from the React frontend by
#                            @neokapi/i18n-react →
#                            public/translations/<locale>.json
#   bowrain-app            — the shared bowrain SPA (bowrain/packages/{app,ui}
#                            + the web and desktop shells), same neokapi-i18n
#                            pipeline → each shell's
#                            public/translations/<locale>.json
#   bowrain-ctrl           — the ctrl admin app (bowrain/apps/ctrl)
#   bowrain-pulse          — the pulse dashboard (bowrain/apps/pulse)
#   neokapi-docs           — the kapi Docusaurus site → web/i18n/<locale>/ tree
#   neokapi-docs-reference — the authored dossiers the Format/Tool Reference is
#                            generated from (scripts/gen-refs/nativedocs/) —
#                            source-only, checked and never converged
#   bowrain-docs           — the bowrain Docusaurus site (bowrain/web/docs) →
#                            bowrain/web/docs/i18n/<locale>/ tree
#   neokapi-demos          — harness demo scripts → generated demo.<lang>.yaml
#                            sidecars (harness/demos/<id>/, overlaid at load
#                            time)
#   bowrain-email          — KBF catalogs extracted from the React Email
#                            templates (bowrain/emails/src) by
#                            @neokapi/i18n-react → per-locale template renders
#                            under bowrain/mailer/templates/<lang>/
#   bowrain-email-subjects — transactional-email subject lines
#                            (bowrain/mailer/subjects/en.json) →
#                            subjects/<lang>.json
#   bowrain-landing        — KBF catalogs extracted from the bowrain landing
#                            SPA (bowrain/web/landing/src) → committed runtime
#                            catalogs
#                            bowrain/web/landing/translations/<lang>.json
#
# Drive it with `make l10n`: one kapi pass over this whole recipe, wrapped in the
# extraction and catalog-compilation stages a recipe may not name itself
# (AD-038). Adding a collection here needs no Makefile change — see
# docs/internals/l10n-ci.md. The context graph this project is governed by —
# voice profile, terms, reviewed content memory — is shared on the
# refs/kapi/context ref of this repository: `kapi context pull` reads it and
# `kapi context push` shares what you recorded.
version: v1
# This project's stable identity. It survives a rename, a move and a clone,
# and everything kapi records about the project is keyed on it. Keep it.
id: prj_6x7ttpbbrhisq4m63uqjrm7uki
name: neokapi
context:
  backend: git
defaults:
  source_language: en
  target_languages: [nb]
  # A converged locale's target files are written by the run that converged it.
  # This repository's targets are build artifacts a later stage consumes (MO
  # compilation, the Docusaurus i18n trees, the demo sidecars), so a run that
  # left them in the store would hand the next stage the previous run's output.
  materialize: on-converge
  # qps is a demo locale, not a translation: the mangled text IS the signal
  # that a string went through the machinery, and the ▒ brackets around each
  # block are scaffolding that reads as noise on a page someone is being shown.
  # Scoped to qps, so nb and every other locale keep the markers that make a
  # pseudo run legible in a diff.
  locales:
    qps:
      tools:
        pseudo-translate:
          prefix: ""
          suffix: ""
  # The loop this project runs locally. memory-recycle is exact-match content-memory
  # leverage and nothing else, so a checkout with no credentials converges from
  # the pulled context alone and the pass is a deterministic function of the
  # source and that context. AI convergence happens at the server venue (the bowrain:
  # block below), on the org's keys and against the org's shared memory; a
  # deliberate local AI pass is `kapi run translate-ai`. Without this the
  # built-in default flow ends in `translate`, and a fresh clone stops on a
  # missing provider credential having recycled nothing.
  flow: memory-recycle
  # The voice is bound by name: the profile the project's context holds, which
  # `kapi context pull` reads from refs/kapi/context (the `context.backend`
  # above). The terms need no binding: the project has one terms store, and it
  # governs every collection.
  voice:
    profile: neokapi-documentation
  memory:
    fuzzy_threshold: 75
  # YAML surface = the harness demo scripts (the only yaml content items).
  # Only the spoken/displayed keys are translatable — never ids, beats,
  # commands, paths, or timings. Declared here (not per-item) because the
  # flow-run path that l10n-demos drives binds reader config from
  # defaults.formats; extract/up/merge merge these same defaults per item.
  formats:
    yaml:
      config:
        keyPathPatterns:
          - title
          - subtitle
          - outro.line
          - narration.*.text
          - narration.*.caption
    # Docs frontmatter, declared once for every consumer: the flow-run path
    # binds reader config from defaults.formats, and extract/up/merge overlay
    # these same defaults per item (keyed by the item's effective format, so a
    # `.md` item overridden to the mdx reader still picks up `mdx:` here).
    markdown:
      config:
        translateFrontMatter: true
        frontMatterKeys: [title, description, sidebar_label]
    mdx:
      config:
        translateFrontMatter: true
        frontMatterKeys: [title, description, sidebar_label]
  # Code comments are prose, and the collections at source/comments below
  # declare them. A comment line that opens with one of these markers is read
  # by the contract audit (.contract-audit), so a check sets it aside rather
  # than reading it as a sentence.
  comments:
    directives:
      - "okapi:"
      - "okapi-skip:"
      - "okapi-unmapped:"
      - "okapi-deferred:"
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - "web/build/**"
    - "web/i18n/**"
    - "bowrain/web/docs/build/**"
    - "bowrain/web/docs/i18n/**"
    - "harness/public/**"
    - "**/testdata/**"
    # What the comment collections below leave out. This list is the only
    # allowlist `make check-comment-coverage` accepts, so each entry says why.
    # Build output.
    - "**/dist/**"
    # Recipes. The content resolver never claims a file named kapi.yaml, so no
    # collection can declare a recipe's comments.
    - "**/kapi.yaml"
    # Generated: the Wails bindings (wails3 generate bindings), the rendered
    # mail templates (make l10n-compile), the demo narration sidecars and the
    # pseudo-translated reference dossiers (both written by the loop), and the
    # docs palette (make generate-docs-palette).
    - "apps/kapi-desktop/frontend/bindings/**"
    - "bowrain/apps/bowrain/frontend/bindings/**"
    - "bowrain/mailer/templates/**"
    - "harness/demos/*/demo.*.yaml"
    - "scripts/gen-refs/nativedocs/qps/**"
    - "**/palette.generated.css"
    # Sample projects and test fixtures: content written to be read by a check
    # or a test, faults included, rather than prose about this repository.
    - "samples/**"
    - "apps/kapi-desktop/backend/sample/**"
    - "bowrain/apps/bowrain/samples/**"
    - "**/e2e/fixtures/**"
    - "**/e2e/seed/**"

# Governance bound to a product. Two products share one repository and one kapi
# project, so the profile is what tells their content apart; the channels it
# declares are the surfaces that product ships on. A collection binding no
# channel falls back to defaults.voice above.
#
# Profile names and channels are slugs — stable identifiers that cross the sync
# wire as the product and channel coordinates, not vocabulary.
profiles:
  neokapi:
    channels: [cli, engine, desktop, docs, demos]
    voice:
      profile: neokapi-documentation
  bowrain:
    channels: [app, ctrl, pulse, docs, email, landing]
    voice:
      profile: bowrain-platform
  # The code comments of both products. The comment voice holds them to its
  # length limits and to the writing tells a comment avoids. The profile binds
  # no terms store of its own, so the project's terms govern comments as they
  # govern everything else.
  source:
    channels: [comments]
    voice:
      profile: source-comments

# A channel is always bound as `<profile>/<channel>`: the product owns the
# surface, and the binding reads as one.
collections:
  - name: neokapi-engine
    channel: neokapi/engine
    base: core/i18n
    content:
      # The block name the reader derives from the key path is the gettext
      # msgctxt the compiled catalog is keyed by, and the Scope the runtime
      # looks a string up under (core/i18n.Scope) — dot-separated, no leading
      # slash, which is what useKeyAsName alone produces. Only the keys that
      # hold prose are extracted; ids, categories, extensions and mime types
      # are not text a reader sees.
      #
      # An enum description is keyed by the enum value it describes, so its
      # leaf is `hybrid` or `ner` rather than `description` and the anchored
      # alternation above cannot reach it. It is prose all the same — it sits
      # beside the translated `label` in the desktop's engine picker, and
      # core/i18n/schema.go resolves it at <base>.enumDescriptions.<value>, a
      # lookup core/i18n/schema_test.go already exercises against a translated
      # answer. Naming the container is what lets the loop supply one.
      - path: builtins/metadata.json
        format:
          name: json
          config:
            extractAllPairs: false
            useKeyAsName: true
            extractionRules: '(displayName|description|title|label|note)$|enumDescriptions\.[^.]+$'
        target: catalogs/{lang}.json
  # The CLI's own help and output strings.
  - name: neokapi-cli
    channel: neokapi/cli
    base: host/i18n
    content:
      # Bare `json`: the whole file is recycled as one item. The catalog
      # holds command help (short/long) alongside output chrome, so a narrower
      # extraction rule would govern some of the text a user reads and not the
      # rest, and the collection would disagree with the target it produces.
      - path: commands.json
        format:
          name: json
        target: catalogs/{lang}.json
  - name: neokapi-desktop
    channel: neokapi/desktop
    base: apps/kapi-desktop/frontend
    # A reviewer can read one of these strings inside the component that ships
    # it. Declared per collection because this repository publishes one host per
    # surface it ships — the desktop app's components and the web app's are two
    # Storybooks, both deployed from here on every push to main
    # (pages-deploy.yml).
    preview:
      kind: storybook
      url: https://neokapi.github.io/storybook/kapi/
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  - name: bowrain-app
    channel: bowrain/app
    base: bowrain/packages/app
    preview:
      kind: storybook
      url: https://neokapi.github.io/storybook/bowrain/
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  - name: bowrain-ctrl
    channel: bowrain/ctrl
    base: bowrain/apps/ctrl
    preview:
      kind: storybook
      url: https://neokapi.github.io/storybook/bowrain/
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  - name: bowrain-pulse
    channel: bowrain/pulse
    base: bowrain/apps/pulse
    preview:
      kind: storybook
      url: https://neokapi.github.io/storybook/bowrain/
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  - name: neokapi-docs
    channel: neokapi/docs
    base: web
    content:
      # Docusaurus v3 parses .md as MDX by default (no markdown.format
      # override in docusaurus.config.ts), and these files use ESM imports and
      # JSX freely — so the mdx reader is the truthful format. The markdown
      # reader treated an `import { BlockPreview } …` line as a paragraph of
      # prose, and the first convergence run translated it.
      - path: docs/**/*.md
        format:
          name: mdx
        target: i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.md
      - path: docs/**/*.mdx
        target: i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.mdx
      # The site tagline. It used to sit in docusaurus.config.ts, which is
      # TypeScript and has no reader, so the only thing checking it was the bash
      # guard. Moving it into JSON put it where kapi governs it. No key
      # narrowing: the file holds the tagline and nothing else, so the reader
      # yields exactly one block. Add keys here only if the file grows.
      - path: brand.json
  # The Format and Tool Reference pages under web/docs/reference/ carry a
  # DO-NOT-EDIT banner and no prose of their own: `make generate-reference-pages`
  # writes a frontmatter block and one React component, and every sentence a
  # reader sees comes from packages/reference-data/data/*.json, which
  # `make generate-reference-docs` compiles out of the dossiers below. So this
  # is where the reference's prose is authored, and the only place a finding
  # against it can be acted on — a fix applied to a generated page is gone on
  # the next regeneration. Declaring the dossiers holds them to the register the
  # rest of the docs are held to, at the point of authorship.
  #
  # The loop writes each dossier's translation to <lang>/<kind>/<id>.yaml
  # beside the source tree, and scripts/gen-refs overlays those onto the
  # dataset variant it writes for that locale (packages/reference-data/data/
  # <lang>/), the way the English dossiers are overlaid onto the English
  # dataset. The names, command help and model notes the pages also print
  # come from the neokapi-engine and neokapi-cli catalogs above by the same
  # route, so a reference page in a target locale is the same dataset, read
  # in that locale by the site's reference-locale plugin.
  - name: neokapi-docs-reference
    channel: neokapi/docs
    base: scripts/gen-refs/nativedocs
    content:
      # `*/*.yaml` is the generator's own glob (loadNativeDocs reads
      # <kind>s/*.yaml), so the checked set is exactly the set it compiles.
      #
      # Only the keys that hold prose are extracted. A dossier is mostly
      # machine-facing: `examples[].config` is a YAML configuration snippet,
      # `wikiUrl` a link, `dependsOn[].property` a schema property path,
      # `introducedIn` a version and `seeAlso` a cross-reference. Grading those
      # as sentences is how a check earns the reputation that stops anyone
      # reading its findings. `parameters` keys are schema property paths and
      # carry dots of their own (`parser.preserveWhitespace`), so the patterns
      # under it span segments with `**` rather than one with `*`.
      - path: "*/*.yaml"
        target: "{lang}/{path}.yaml"
        format:
          name: yaml
          config:
            keyPathPatterns:
              - displayName
              - description
              - overview
              - limitations.*
              - processingNotes.*
              - examples.*.title
              - examples.*.description
              - parameters.**.description
              - parameters.**.help
              - parameters.**.values
              - parameters.**.notes.*
              - parameters.**.examples.*
              - parameters.**.dependsOn.*.condition
  - name: bowrain-docs
    channel: bowrain/docs
    base: bowrain/web/docs
    content:
      # .md is MDX here for the same reason as the neokapi docs above.
      - path: docs/**/*.md
        format:
          name: mdx
        target: i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.md
      - path: docs/**/*.mdx
        target: i18n/{lang}/docusaurus-plugin-content-docs/current/{path}.mdx
      # The site tagline. It used to sit in docusaurus.config.ts, which is
      # TypeScript and has no reader, so the only thing checking it was the bash
      # guard. Moving it into JSON put it where kapi governs it. No key
      # narrowing: the file holds the tagline and nothing else, so the reader
      # yields exactly one block. Add keys here only if the file grows.
      - path: brand.json
  - name: bowrain-email
    channel: bowrain/email
    base: bowrain/emails
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  - name: bowrain-email-subjects
    channel: bowrain/email
    base: bowrain/mailer/subjects
    content:
      - path: en.json
        format:
          name: json
        target: "{lang}.json"
  - name: bowrain-landing
    channel: bowrain/landing
    base: bowrain/web/landing
    content:
      - path: i18n/**/*.kbf.json
        target: i18n-{lang}/{filename}
  # Distribution metadata: the description a user reads in a package manager
  # before anything is installed, and the one Windows shows in file properties.
  # Both are product copy that no docs sweep has ever looked at, and neither is
  # reachable from any other collection's base.
  #
  # Source-only — the items name no `target:`. A package description is not
  # translated today: nfpm builds one artifact and the Windows resource block is
  # single-locale. Declaring them governs the English, which is the whole point.
  - name: neokapi-cli-package
    channel: neokapi/cli
    base: packaging
    source_only: true
    content:
      # Only `description` holds prose. maintainer, vendor, license and homepage
      # are identifiers, and `contents` is a list of file paths — grading those
      # as sentences is how a check earns the reputation that stops anyone
      # reading its findings.
      - path: nfpm.yaml
        format:
          name: yaml
          config:
            keyPathPatterns:
              - description
  - name: neokapi-desktop-build
    channel: neokapi/desktop
    base: apps/kapi-desktop/build
    source_only: true
    content:
      # extractAllPairs off + exceptions as an INCLUDE list: the file is mostly
      # version numbers and company/product names, and only these two keys are
      # sentences a user reads in the file's properties dialog.
      # The Wails build config. `description` and `comments` are the product
      # line the installer and the .app bundle carry; everything else in the
      # file is a version, a company name or a bundle identifier, so the keys
      # are named rather than the file being read whole. Read without them the
      # reader yields 26 blocks, of which two are prose.
      - path: config.yml
        format:
          name: yaml
          config:
            keyPathPatterns:
              - info.description
              - info.comments
      - path: windows/info.json
        format:
          name: json
          config:
            extractAllPairs: false
            exceptions: "FileDescription|Comments"
  # The Homebrew cask. `desc` is the line `brew info` prints and `caveats` is
  # what Homebrew prints after install — product copy in a file kapi could not
  # open until the sourcecode reader existed.
  #
  # `source_only:` here is not a preference: the format registers a reader and
  # no writer, so there is nothing a `target:` could mean.
  #
  # Needs the kapi-sourcecode plugin. Without it the format is unsupported and
  # this collection contributes nothing — the same posture pdf has.
  - name: neokapi-desktop-cask
    channel: neokapi/desktop
    base: deploy/homebrew
    source_only: true
    content:
      - path: "*.rb"
        format:
          name: sourcecode
          config:
            # Declared, though the extension names the same grammar: a kapi that
            # sends the plugin no file name reads the cask through this alone.
            language: ruby
            # Everything else in a cask is a path, a URL, a bundle id or a
            # version. The tree tells them apart; this says which two calls hold
            # the sentences.
            nodePathPatterns: [desc, caveats]
  - name: neokapi-demos
    channel: neokapi/demos
    base: harness/demos
    content:
      # Narrated demo-video scripts. The English demo.yaml is the master;
      # translated narration is GENERATED into committed demo.<lang>.yaml
      # sidecars (content memory-driven) that the harness overlays at load
      # time. A sidecar identical to its source carries nothing and is dropped
      # rather than committed, so a demo has one exactly when its narration has
      # been translated. Never hand-edit a sidecar: correct the wording where it
      # is reviewed, and the next convergence writes it. Translatable keys are
      # selected by defaults.formats.yaml.config.keyPathPatterns above.
      - path: "*/demo.yaml"
        format:
          name: yaml
        target: "{dir}/demo.{lang}.yaml"
  # ── Code comments ────────────────────────────────────────────────────────
  #
  # A comment is prose that a person or an agent writes beside the code. These
  # collections place the comments of the repository's sources at
  # source/comments, where the comment voice checks them. Each item declares
  # its files for their comments alone (`comments: {only: true}`), so no run
  # extracts, converges, merges or counts a value in them. They come last, and
  # a file declared above keeps that item for its values. Its comments are
  # checked at source/comments when a collection here matches it, unless the
  # item that claims its values declares comments of its own first.
  #
  # The patterns name the directories that hold code rather than `**` from a
  # package root. A workspace package keeps a node_modules of symlinks into the
  # pnpm store, and a glob follows them, which costs seconds on every
  # resolution. A new package needs its directory added here.
  - name: source-go-comments
    channel: source/comments
    source_only: true
    content:
      - path: "{bench,cli,cmd,core,examples,host,kapi,kpz,memory,plugins,providers,scripts,terms,voice}/**/*.go"
        comments:
          only: true
      - path: "bowrain/{agent,ai,analytics,apierror,auth,billing,cmd,connector,contextscan,core,credentials,crypto,e2e,editorclient,event,forge,graph,jobs,knowledge,mailer,memory,migrations,observe,platformconfig,plugin,proto,resilience,review,safehttp,sandbox,server,service,storage,store,sync,terms,testutil,voice}/**/*.go"
        comments:
          only: true
      - path: "{apps/kapi-desktop,bowrain/apps/bowrain}/*.go"
        comments:
          only: true
      - path: "{apps/kapi-desktop,bowrain/apps/bowrain}/{backend,cmd}/**/*.go"
        comments:
          only: true
  - name: source-code-comments
    channel: source/comments
    source_only: true
    content:
      # TypeScript, JavaScript and CSS under each package's src/, and the
      # scripts. The sourcecode plugin reads these; without it a check names
      # the plugin and counts the files as not checked.
      - path: "{bowrain/apps,bowrain/packages,packages}/*/src/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{apps/kapi-desktop/frontend,bowrain/apps/bowrain/frontend,bowrain/emails,bowrain/web/landing,web}/src/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{bowrain/packages,packages}/*/{examples,tests}/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{bowrain/apps/*,bowrain/apps/bowrain/frontend}/e2e/**/*.{ts,tsx,js,mjs}"
        comments:
          only: true
      - path: "{bowrain/storybook,storybook}/.storybook/*.{ts,tsx,js,css}"
        comments:
          only: true
      - path: "*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{apps/kapi-desktop/frontend,bowrain/apps/*,bowrain/apps/bowrain/frontend,bowrain/packages/*,bowrain/web/docs,bowrain/web/landing,packages/*,web}/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{apps/kapi-desktop/frontend/scripts,bowrain/apps/bowrain/frontend/scripts,bowrain/emails/scripts,bowrain/web/docs/src,bowrain/web/landing/e2e,packages/*/cli,.skills,examples,.claude/workflows}/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "web/{plugins,scripts}/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{bowrain/e2e,harness,scripts}/**/*.{ts,tsx,js,mjs,cjs,css}"
        comments:
          only: true
      - path: "{.skills,bench,bowrain/docker,bowrain/e2e,bowrain/scripts,core,examples,harness,kapi,plugins,scripts}/**/*.{sh,py,rs,c,h,cs,java,rb}"
        comments:
          only: true
  - name: source-config-comments
    channel: source/comments
    source_only: true
    content:
      - path: "{*,.*}.{yaml,yml}"
        comments:
          only: true
      - path: "{apps/kapi-desktop,bowrain/apps/bowrain,bowrain/web/docs}/*.{yaml,yml}"
        comments:
          only: true
      - path: "bowrain/apps/bowrain/build/**/*.{yaml,yml}"
        comments:
          only: true
      - path: "{.github,.skills,apps/kapi-desktop/build,bowrain/deploy,bowrain/docker,bowrain/e2e,cli,core,docs,harness,scripts,specs,web/demos,web/scenes,web/walkthroughs}/**/*.{yaml,yml}"
        comments:
          only: true
      - path: "bowrain/*.yaml"
        comments:
          only: true
  - name: source-markup-comments
    channel: source/comments
    source_only: true
    content:
      - path: "*.md"
        comments:
          only: true
      - path: "{.skills,bowrain/docker,bowrain/e2e,bowrain/graph,bowrain/web/docs,cli,core,deploy,docs,examples,harness,host,packages/kapi-claude-plugin,plugins,scripts,specs,web/demos,web/static,web/walkthroughs}/**/*.{md,mdx,html}"
        comments:
          only: true
      - path: "{apps/kapi-desktop/frontend,bowrain,bowrain/apps/bowrain/frontend,bowrain/web/landing,packages/*}/*.{md,html}"
        comments:
          only: true
      - path: "packages/ui/docs/**/*.{md,mdx}"
        comments:
          only: true
      - path: "{.claude,bowrain/apps/*,bowrain/web/landing/public}/*.{md,html}"
        comments:
          only: true
      - path: "web/src/**/*.{md,mdx}"
        comments:
          only: true
      - path: "{apps/kapi-desktop/build,harness,web/scenes}/**/*.{xml,resx,tmx,xlf,properties,po}"
        comments:
          only: true
flows:
  # Exact-match content-memory leverage plus the one check that is about
  # correctness rather than coverage: the deterministic pass `defaults.flow`
  # binds, run over the whole recipe. A built-in flow name runs the built-in,
  # so this flow takes a name of its own rather than `recycle`.
  #
  # placeholder-check is bound here because a target that dropped an
  # interpolation placeholder is not a partial translation, it is a wrong one: a
  # reader gets the sentence with the count, the name or the link missing from
  # it. `recycle` already refuses to fill from a match whose target dropped an
  # inline code, and this is the same predicate applied to what a pass produced,
  # whatever venue produced it. It reports; the return-leg gate
  # (scripts/check-sync-backed.sh) is what refuses.
  memory-recycle:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
      - tool: placeholder-check
  # AI translation for new/changed strings: content memory first, then translate for
  # the misses (voice profile + terms are bound project-wide), then checks.
  # Requires provider credentials (keychain or ANTHROPIC_API_KEY).
  translate-ai:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
      - tool: translate
        config:
          provider: anthropic
      - tool: term-check
      - tool: qa
  pseudo:
    steps:
      - tool: pseudo-translate

# ─────────────────────────────────────────────────────────────────────────────
# Customer #1: bowrain.cloud dogfood — ACTIVATED 2026-07-17 (epic 017-F, D2)
#
# neokapi is the first real workspace on Bowrain. `kapi push` sends every surface
# above to the project below; nb drafts land in the governed review queue, and
# the decisions made there come home on refs/kapi/context.
#
# converge: manual — a push moves content but does NOT auto-start a server AI
# convergence run. The first on-push run (2026-07-17) tried to AI-draft the whole
# ~18.8k-block untranslated corpus with an empty server content memory (content memory 0 · AI everything)
# and stalled on the workspace credit allowance. Convergence is now started
# deliberately — scoped, and only once the server content memory is seeded and/or a BYO AI
# key is set (BYO burns no credits, DECISIONS L3) — via `kapi up` or the REST
# convergence endpoint. Transport (kapi push) stays pure either way.
#
# This `bowrain:` block is the platform's own key, and declaring it is what makes
# the recipe bowrain-connected: kapi reads `url:` and `converge:` through the
# venue seam and never the key's name. It is the ONLY in-repo kapi invocation
# that binds here — every other one isolates via KAPI_NO_PROJECT (CLAUDE.md
# "Dogfooding kapi"), so tests / make targets / recorders are unaffected. The
# nightly + manual sync runs in .github/workflows/dogfood-sync.yml (gated on the
# DOGFOOD_SYNC_ENABLED repo variable, token in BOWRAIN_AUTH_TOKEN).
#
# To disconnect: re-comment this block and unset DOGFOOD_SYNC_ENABLED.
bowrain:
  url: "https://app.bowrain.cloud/bowrain-hq/uek630Q5"   # <server>/<workspace>/<project-id>
  converge: manual     # push never auto-converges; start the loop deliberately
