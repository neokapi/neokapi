id: bowrain-web-review
title: Gjennomgå og godkjenn
subtitle: Teamarbeidsflyten på innhold synkronisert fra kapi.
tagline: den serversidige plattformkompanjonen til kapi
kind: brukstilfelle
publishAs: bowrain-web-review
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read — uniform voice across scenes.
oneshot: true
aspects:
  - Innhold synkronisert fra kapi
  - En fokusert gjennomgangsflate
  - Godkjenn blokk for blokk
  - Fremdrift mot ferdig

narration:
  - id: title
    kind: title
    text: >-
      Fra kapi til en gjennomgått oversettelse — godkjenningssløyfen et team kjører på Bowrain.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Med kapi alene er gjennomgang enkeltspiller: kapi status --review viser hva som venter på en beslutning, og kapi apply registrerer den i prosjektets tilstandslager. Push prosjektet til Bowrain og de samme beslutningene får en teamflate — prosjekter et arbeidsområde gjennomgår sammen.
  - id: åpne-prosjekt
    kind: desktop
    beat: åpne-prosjekt
    text: >-
      Åpne et prosjekt for å se filene og hvor langt hver av dem har kommet.
  - id: open-file
    kind: desktop
    beat: open-file
    text: >-
      Åpne en fil for å begynne å arbeide deg gjennom den.
  - id: fokus
    kind: desktop
    beat: focus
    caption: "En fokusert gjennomgang, én blokk om gangen."
    text: >-
      Fokusmodus tar det én blokk om gangen — kilde, mål og statusen som holder styr på hvor hver blokk står.
  - id: gjennomgang
    kind: desktop
    beat: gjennomgang
    caption: "Godkjenn en blokk, gå til neste."
    text: >-
      En gjennomgår godkjenner en blokk og går videre til den neste — hver endring registrert mot arbeidsområdet, ikke en lokal fil.
  - id: progress
    kind: desktop
    beat: fremdrift
    caption: "Fremdrift mot ferdig, gjennom hele filen."
    text: >-
      Statustellingene sporer filen fra utkast til oversatt til gjennomgått, slik at teamet alltid vet hva som gjenstår.
  - id: outro
    kind: outro
    text: >-
      Gjennomgått på serveren, deretter hentet tilbake til repositoriet med kapi — den samme gjennomgangsstatusen som enkeltspillerløkken registrerer, nå ivaretatt av arbeidsområdet. Én rundtur, styrt fra ende til ende.
