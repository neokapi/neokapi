id: bowrain-web-review
title: Ingen godkjenner sin egen oversettelse
subtitle: "Én kø, to personer og en regel som serveren håndhever."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-review
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Angi policyen under Medlemmer og roller.
  pointer: kapi pull
aspects:
  - One queue per project
  - A verdict against every bar
  - Separation of duties, enforced

narration:
  - id: title
    kind: title
    text: >-
      To personer, én kø og en regel som serveren håndhever: Ingen godkjenner sin egen oversettelse. Se én godkjenning bli registrert og én bli avvist.
  - id: queue
    kind: desktop
    beat: queue
    caption: "Alt som er oversatt, men ennå ikke avgjort."
    hold: 14
    crop: { x: 0.14, y: 0.05, w: 0.28, h: 0.45 }
    text: >-
      Innboksen i arbeidsområdet samler alle prosjekter som venter på en avgjørelse. I et prosjekt viser køen alt som er oversatt, men ennå ikke avgjort. Køen gjelder ett språk, og kilden er markert.
  - id: focus
    kind: desktop
    beat: focus
    caption: "Vurderingen, før noen tar en avgjørelse."
    hold: 14
    crop: { selector: '[data-slot="reviewer-unit-header"]' }
    highlight: { selector: '[data-testid="reviewer-verdict-passing"]' }
    text: >-
      Når du åpner en enhet, vises vurderingen. Serveren bruker kontroller, termer og terskelen for stemmeprofilen når noen trykker på Godkjenn. Statusmerket viser på forhånd om en godkjenning vil bli godtatt.
  - id: approve
    kind: desktop
    beat: approve
    caption: "Godkjent, og køen går videre."
    hold: 13
    crop: { selector: '[data-slot="review-session-header"]' }
    text: >-
      En kollega har skrevet denne oversettelsen, og den oppfyller alle kravene. Godkjenningen registreres i arbeidsområdet, ikke i en fil på én bærbar PC. Deretter går køen videre til neste enhet.
  - id: duties
    kind: desktop
    beat: duties
    caption: "Avvist: Den som har skrevet oversettelsen, kan ikke gjennomgå den."
    hold: 15
    crop: { selector: '[data-testid="error-notice"]' }
    highlight: { selector: '[data-testid="error-notice"]' }
    text: >-
      Denne har hun skrevet selv. Serveren avviser godkjenningen og viser begrunnelsen: Oppgavedeling er satt til å blokkere. Den som skriver en oversettelse, kan derfor ikke godkjenne den.
  - id: second-reviewer
    kind: desktop
    beat: second-reviewer
    caption: "En kollega tar avgjørelsen, og antallet synker."
    hold: 13
    crop: { selector: '[data-slot="review-session-header"]' }
    text: >-
      En kollega med gjennomgangstillatelse for språket tar avgjørelsen i stedet, og antallet som venter, synker. To personer, én registrering og en regel som ingen brukerflate kan omgå.
  - id: outro
    kind: outro
    text: >-
      Gjennomgått på serveren og deretter hentet tilbake til repositoriet den kom fra.
