id: bowrain-web-review
title: Review and approve as a team
subtitle: One queue, one decision, and a second pair of eyes.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-review
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
aspects:
  - Content synced from kapi
  - A focused review surface
  - The context behind a decision
  - Separation of duties

narration:
  - id: title
    kind: title
    text: >-
      From kapi to a reviewed translation, on a workspace two people share.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      With kapi alone, review is single-player. Push the project to Bowrain and
      the same decisions get a team surface. The review inbox rolls up every
      project in the workspace that is waiting on someone, the busiest first.

  - id: open-project
    kind: desktop
    beat: open-project
    caption: Into one project's review session.
    text: >-
      Opening a project lands on its review session: one queue of everything
      translated but not yet decided, and one unit in focus beside it.

  - id: scope
    kind: desktop
    beat: scope
    caption: One language selector, with the source marked.
    text: >-
      The language selector scopes the queue, marks which language is the
      source, and carries how much is pending in each. The verdict filters cut
      it to what clears every bar, or what does not.

  - id: focus
    kind: desktop
    beat: focus
    caption: The verdict against every bar the server applies.
    text: >-
      A unit in focus opens with its verdict. Checks, terminology and the voice
      bar are the three the server applies when someone approves, so the chip
      says in advance whether an approval will hold.

  - id: context
    kind: desktop
    beat: context
    caption: What governs here, what is nearby, what was already approved.
    text: >-
      Beside it sits the context that shaped the translation. The profile and
      term rules in force at this point, the blocks around it, the approved
      wording the content memory already holds, and who decided what before.

  - id: approve
    kind: desktop
    beat: approve
    caption: Approve, and the queue moves on.
    text: >-
      Approving records the decision against the workspace rather than a local
      file, and the queue moves to the next unit.

  - id: duties
    kind: desktop
    beat: duties
    caption: You cannot approve your own writing.
    text: >-
      This one she wrote herself, and the workspace refuses it. Separation of
      duties is a policy the workspace sets, and when it is set to block, the
      server declines an approval of the approver's own work and says so.

  - id: second-reviewer
    kind: desktop
    beat: second-reviewer
    caption: A colleague decides it instead.
    text: >-
      A colleague with the review permission for that language decides it
      instead, and the count drops. Two people, one record, and a rule that no
      surface can talk its way around.

  - id: outro
    kind: outro
    text: >-
      Reviewed on the server, then pulled back into the repository with kapi.
      The same review state the single-player loop records, now carried by the
      workspace and governed end to end.
