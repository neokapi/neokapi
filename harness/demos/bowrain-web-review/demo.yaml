id: bowrain-web-review
title: Nobody approves their own translation
subtitle: One queue, two people, and a rule the server applies.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-review
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Set the policy under Members and roles.
  pointer: kapi pull
aspects:
  - One queue per project
  - A verdict against every bar
  - Separation of duties, enforced

narration:
  - id: title
    kind: title
    text: >-
      Two people, one queue, and a rule the server applies: nobody approves
      their own translation. Watch one approval land, and one be refused.

  - id: queue
    kind: desktop
    beat: queue
    caption: Everything translated and not yet decided.
    hold: 14
    crop: { x: 0.14, y: 0.05, w: 0.28, h: 0.45 }
    text: >-
      The workspace inbox rolls up every project waiting on somebody. Inside
      one, the queue is everything that has been translated and not yet
      decided, scoped to a single language with the source marked.

  - id: focus
    kind: desktop
    beat: focus
    caption: The verdict, before anyone decides.
    hold: 14
    crop: { selector: '[data-slot="reviewer-unit-header"]' }
    highlight: { selector: '[data-testid="reviewer-verdict-passing"]' }
    text: >-
      A unit in focus opens with its verdict. Checks, terms and the voice bar
      are the three the server applies when someone presses approve, so the
      chip says in advance whether an approval will hold.

  - id: approve
    kind: desktop
    beat: approve
    caption: Approved, and the queue moves on.
    hold: 13
    crop: { selector: '[data-slot="review-session-header"]' }
    text: >-
      This target a colleague wrote, and it clears every bar. Approving records
      the decision against the workspace rather than a file on one laptop, and
      the queue moves to the next unit.

  - id: duties
    kind: desktop
    beat: duties
    caption: "Refused: the author cannot be the reviewer."
    hold: 15
    crop: { selector: '[data-testid="error-notice"]' }
    highlight: { selector: '[data-testid="error-notice"]' }
    text: >-
      This one she wrote herself. The server declines the approval and prints
      its own reason: separation of duties is set to block, so the author of a
      translation is never the person who signs it off.

  - id: second-reviewer
    kind: desktop
    beat: second-reviewer
    caption: A colleague decides it, and the count drops.
    hold: 13
    crop: { selector: '[data-slot="review-session-header"]' }
    text: >-
      A colleague who holds review permission for that language decides it
      instead, and the pending count drops. Two people, one record, and a rule
      no surface can talk its way around.

  - id: outro
    kind: outro
    text: >-
      Reviewed on the server, then pulled back into the repository it came from.
