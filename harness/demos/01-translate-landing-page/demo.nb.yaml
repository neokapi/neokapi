id: 01-translate-landing-page
title: Oppmerkingen forblir uendret
subtitle: "Én forespørsel i Claude Code, og bare teksten de besøkende leser, endres."
kind: zero-to-hero
aspects:
  - AI translation
  - HTML round-trip
  - format-aware
needsAi: true
model: sonnet
captureTimeoutSec: 300
outro:
  line: "Installer ferdigheten, og be om det på vanlig engelsk."
  pointer: /plugin install kapi@neokapi-plugins

prompt: >
  We're launching Lumen Notes in France next week. Can you translate our landing page,
  index.html, into French? Save the French version as index.fr.html.

artifacts:
  - id: before
    caption: "index.html: the English page"
    source: html
    path: index.html
    width: 1280
    height: 900
  - id: after
    caption: "index.fr.html: the same page, text in French"
    source: html
    path: index.fr.html
    width: 1280
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Gi Claude Code en landingsside og be om å få den på fransk. Når kapi-ferdigheten er installert, bruker assistenten formatbevisst oversettelse, og HTML-strukturen bevares.
  - id: before
    kind: artifact
    artifact: before
    caption: "En toppseksjon, en handlingsoppfordring og tre kort. Alt sammen er oppmerking."
    text: >-
      Slik ser siden ut i dag. Den har en toppseksjon, en handlingsoppfordring og tre funksjonskort. Rundt hver setning ligger klassene og lenkene som gjør innholdet til en nettside.
  - id: recognise
    kind: terminal
    caption: "Ferdigheten håndterer forespørselen, og deretter følger ett kapi-kall."
    highlight: { text: [Skill, kapi translate] }
    text: >-
      Claude leser forespørselen, gjenkjenner en oversettelsesoppgave og laster kapi-ferdigheten før noe kjøres. Kallet oppgir filen og målspråket, og ingenting annet.
  - id: round-trip
    kind: terminal
    caption: "Teksten hentes ut, oversettes og settes tilbake i de samme taggene."
    text: >-
      kapi skiller den lesbare teksten fra oppmerkingen og gjenbruker ordlyd som allerede er godkjent for prosjektet. Resten sendes til den konfigurerte leverandøren. Deretter kjører kapi kontroller før resultatet skrives tilbake i samme struktur.
  - id: after
    kind: artifact
    artifact: after
    caption: "Samme klasser, samme oppsett. Bare teksten er endret."
    text: >-
      Og her er den franske siden. Klassene, oppsettet og lenkene er de samme som før. Det som er endret, er teksten de besøkende leser.
  - id: outro
    kind: outro
    text: >-
      Installer ferdigheten i Claude Code, og be deretter om å få en side på et annet språk, slik denne forespørselen gjorde.
