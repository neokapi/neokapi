id: 01-translate-landing-page
title: The markup comes back untouched
subtitle: One request in Claude Code, and only the words a visitor reads change.
kind: zero-to-hero
aspects:
  - AI translation
  - HTML round-trip
  - format-aware
needsAi: true
model: sonnet
captureTimeoutSec: 300
outro:
  line: Install the skill, then ask in plain English.
  pointer: /plugin install kapi@neokapi-plugins

prompt: >
  We're launching Lumen Notes in France next week. Can you translate our landing page,
  index.html, into French? Save the French version as index.fr.html.

artifacts:
  - id: before
    caption: "index.html: the English page"
    source: html
    path: index.html
    width: 1280
    height: 900
  - id: after
    caption: "index.fr.html: the same page, text in French"
    source: html
    path: index.fr.html
    width: 1280
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Hand a landing page to Claude Code and ask for it in French. With the kapi
      skill installed, the assistant reaches for a format-aware translate, and
      the HTML comes back intact.

  - id: before
    kind: artifact
    artifact: before
    caption: A hero, a call to action, three cards. All of it markup.
    text: >-
      Here is the page today. A hero, a call to action, three feature cards, and
      around every sentence the classes and links that make it a page rather
      than a document.

  - id: recognise
    kind: terminal
    caption: The skill answers the request, and one kapi call follows.
    highlight: { text: [Skill, kapi translate] }
    text: >-
      Claude reads the request, recognises a translation job, and loads the kapi
      skill before it runs anything. The call it makes names the file and the
      target language, and nothing else.

  - id: round-trip
    kind: terminal
    caption: Text out, translated, and back into the same tags.
    text: >-
      kapi separates the readable text from the markup, reuses the wording this
      project has already approved, sends the remainder to the configured
      provider, and runs its checks before writing the result back into the same
      structure.

  - id: after
    kind: artifact
    artifact: after
    caption: Same classes, same layout. Only the words changed.
    text: >-
      And the French page. The classes, the layout and the links are the ones
      that were there before. What changed is the text a visitor reads.

  - id: outro
    kind: outro
    text: >-
      Install the skill in Claude Code, then ask for a page in another language
      the way this request did.
