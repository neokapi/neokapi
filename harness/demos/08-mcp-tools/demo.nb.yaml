id: 08-mcp-tools
title: Nå kapi via MCP
subtitle: "Den samme motoren, eksponert for assistenten som Model Context Protocol-verktøy."
kind: integration
aspects:
  - MCP-integrasjon
  - uttrekk og statistikk
  - pseudo-oversett
needsAi: false
mcp: true
model: sonnet
captureTimeoutSec: 300

prompt: >
  Bruk kapi og ta en titt på content.json for meg: hvilket format er det, hvor mange oversettbare ord har det, og hva kan kapi gjøre med det? Vis meg deretter en rask pseudooversatt forhåndsvisning av innholdet.
artifacts:
  - id: wordcount
    caption: "kapi stats på content.json — det virkelige tallet"
    source: command
    command: kapi stats content.json --json
    report: stats
    width: 1000
    height: 640

narration:
  - id: title
    kind: title
    text: >
      Det er to måter å gi en assistent kapias evner på. Den ene er ferdigheten. Den andre er Model Context Protocol: kapi kjører som en server og eksponerer arbeidet sitt som verktøy.
  - id: prompt
    kind: prompt
    text: >
      Forespørselen er en vanlig en — hva er denne filen, hvor stor er den, hva kan vi gjøre med den. I denne økten er skallet slått av, så den eneste måten å nå kapi på er gjennom verktøyene.
  - id: tools
    kind: terminal
    text: >
      Hvert trinn er et typet verktøykall med et strukturert resultat, ikke tekst skrapet fra en konsoll. Claude ber kapi om å oppdage formatet, måle innholdet med stats-verktøyet og liste opp flyene det tilbyr — de samme registerverktøyene som kapi up og porselensverbene driver; på kommandolinjen er kapi exec den rå inngangsporten til dem.
    caption: "Typede MCP-verktøykall til kapi, der hvert returnerer strukturerte data"
  - id: pseudo
    kind: terminal
    text: >
      Den kjører en pseudooversettelses gjennom det samme grensesnittet. Dette er hvordan kapi kobles til andre MCP-klienter, som Cursor eller Windsurf — den samme motoren, en annen inngangsport.
    caption: "Pseudooversett via MCP — samme motor, nådd som et verktøy"
  - id: wordcount
    kind: artefakt
    artifact: wordcount
    text: >
      Tallene kom direkte fra motoren: det oppdagede formatet og antall oversettbare ord og segmenter i filen. Ingen gjetning.
  - id: outro
    kind: outro
    text: >
      Enten ferdighet eller MCP, kaller assistenten en ekte innholdsmotor — lokal, og den samme uansett.
