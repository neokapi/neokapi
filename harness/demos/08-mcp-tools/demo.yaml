id: 08-mcp-tools
title: An assistant with no shell
subtitle: kapi as Model Context Protocol tools, down to a recorded pre-review.
kind: integration
aspects:
  - MCP integration
  - size before you act
  - the review queue
  - a pre-review with a name on it
needsAi: false
mcp: true
model: sonnet
captureTimeoutSec: 300
# The sandbox IS the project: a recipe at its root with a drafted French
# catalog, so the project-scoped tools (review_queue, review_unit, pre_review_unit)
# have a real queue to work. An assistant records a pre-review and never
# establishes a unit, so the queue keeps its length and gains a score. The sandbox lives in os.tmpdir(), outside the repo.
project: true
# The fixture's voice profile is a file until a person reads it into this
# machine's store, which is where the tools answer from.
setup:
  - kapi context import
outro:
  line: Add kapi to your assistant's MCP config.
  pointer: /reference/mcp

prompt: >
  Using kapi, take a look at content.json for me: what format is it, and how much
  translatable content does it hold? Then show me what is waiting for review in French,
  open the first unit with everything that governs it, and record your pre-review of
  it with a score and your reasons.

artifacts:
  - id: wordcount
    caption: "kapi stats on content.json: the real figure"
    source: command
    command: kapi stats content.json --json
    report: stats
    width: 1000
    height: 640
  - id: queue
    caption: "the review queue afterwards, with the assistant's score on one unit"
    source: command
    command: kapi status --review -p . --json
    report: json
    reportTitle: "review_queue"
    reportSub: "every unit awaiting a person, addressed by file, key and locale"
    width: 1100
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      An assistant can reach kapi without a shell, as Model Context Protocol
      tools with typed results. Here it sizes a file, reads the French review
      queue, and records a pre-review under its own name.

  - id: tools
    kind: terminal
    caption: Typed calls, structured results, no console to scrape.
    text: >-
      The shell is switched off in this session, so every step is a tool call
      with a structured result rather than text scraped from a console.

  - id: wordcount
    kind: artifact
    artifact: wordcount
    caption: The engine's own count, for this file.
    text: >-
      The first two calls detect the format and size the content, and these are
      the figures the engine itself keeps: translatable words and segments, for
      this file, in this format.

  - id: review
    kind: terminal
    caption: One unit, and everything a decision is made in.
    text: >-
      Then the review queue, filtered to French. A second call opens one unit
      and returns what the decision is made in: the point governing the file,
      the voice in force there, the neighbouring blocks, and the version
      established last time, when there is one.

  - id: approve
    kind: terminal
    caption: A pre-review, recorded with the agent's name on it.
    text: >-
      The pre-review is its own call: a score and the reasons for it, bound to
      the exact text the assistant judged and marked as an assistant's. It
      informs the person who reviews next, and only a person establishes the
      unit.

  - id: queue
    kind: artifact
    artifact: queue
    caption: The same queue, with the score on the unit.
    text: >-
      And the queue afterwards. The unit is still there, now carrying the
      assistant's score. Every row addresses a unit by file, key and locale,
      which is what a person opening Kapi Desktop sees next.

  - id: outro
    kind: outro
    text: >-
      Point your assistant's configuration at the kapi server, and it reaches
      the same review queue a person works from.
