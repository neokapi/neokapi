id: bowrain-web-editor
title: Oversett en side der leseren vil se den
subtitle: "Et redigeringskort over siden, i alle målspråk."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-editor
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Filer kommer inn via en kobling eller via en push.
  pointer: kapi push
aspects:
  - An editing card over the document
  - A live preview of the page
  - The memory and terms, one click away
  - Every target language in one file

narration:
  - id: title
    kind: title
    text: >-
      Oversett en side der leseren vil se den. Redigeringskortet ligger over det gjengitte dokumentet, og siden oppdateres mens du skriver.
  - id: split
    kind: desktop
    beat: split
    caption: "Kortet, over siden det oversetter."
    hold: 16
    crop: { selector: '[data-testid="visual-editor-card"]' }
    text: >-
      Dette er én fil i Translate-arbeidsbenken. Visuell visning plasserer et redigeringskort over selve dokumentet, med fremdriften for hele filen ved siden av, slik at en blokk aldri redigeres løsrevet fra konteksten.
  - id: edit
    kind: desktop
    beat: edit
    caption: "Lagret, og siden gjengis på nytt."
    hold: 22
    crop: { selector: '[data-testid="visual-editor-card"]' }
    highlight: { selector: '[data-testid="target-display"]' }
    text: >-
      Skriv en oversettelse inn i blokken og lagre den. Forhåndsvisningen ved siden av kortet gjengir siden på nytt med den nye teksten, slik at en setning vurderes der leseren møter den og ikke som en rad i en liste med strenger. En linje som flyter over knappen sin, viser det her – ikke etter at den er sendt ut.
  - id: memory
    kind: desktop
    beat: memory
    caption: "Den godkjente teksten, brukt med ett klikk."
    hold: 14
    crop: { selector: '[data-testid="context-panel"]' }
    text: >-
      Arbeidsområdets inneholdsminne har allerede svar på noen av disse strengene. Ett klikk bruker teksten teamet godkjente, og termene som gjelder for denne blokken, ligger i samme panel ved siden av.
  - id: locale
    kind: desktop
    beat: locale
    caption: "Samme fil, neste språk."
    hold: 11
    crop:
      selector:
        - '[data-testid="locale-selector"]'
        - '[data-testid="visual-editor-card"]'
    text: >-
      Én editor dekker alle målspråk. Bytt fra fransk til tysk, og kortet, innholdsminnets treff og forhåndsvisningen følger med – uten at du forlater dokumentet.
  - id: outro
    kind: outro
    text: >-
      Filer kommer inn via en kobling eller via en push, og redigeringene går tilbake på samme måte.
