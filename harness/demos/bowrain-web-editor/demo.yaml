id: bowrain-web-editor
title: Translate a page where the reader will see it
subtitle: An editing card over the page, in every target language.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-editor
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Files arrive from a connector or from a push.
  pointer: kapi push
aspects:
  - An editing card over the document
  - A live preview of the page
  - The memory and terms, one click away
  - Every target language in one file

narration:
  - id: title
    kind: title
    text: >-
      Translate a page where the reader will see it. The editing card sits over
      the rendered document, and the page redraws as you type.

  - id: split
    kind: desktop
    beat: split
    caption: The card, over the page it is translating.
    hold: 16
    crop: { selector: '[data-testid="visual-editor-layout"]' }
    zoom: 1.4
    text: >-
      This is one file in the Translate workbench. The visual view puts an
      editing card over the document itself, with the progress across the whole
      file beside it, so a block is never edited out of its context.

  - id: edit
    kind: desktop
    beat: edit
    caption: Saved, and the page redraws.
    hold: 22
    crop:
      selector:
        - '[data-testid="visual-editor-card"]'
        - '[data-testid="preview-iframe"]'
    zoom: 1.6
    highlight: { selector: '[data-testid="preview-iframe"]' }
    text: >-
      Type a translation into the block and save it. The preview beside the card
      re-renders the page with the new wording, so a sentence is judged where a
      reader will meet it and not as a row in a list of strings. A line that
      overflows its button says so here, not after it ships.

  - id: memory
    kind: desktop
    beat: memory
    caption: The approved wording, applied in one click.
    hold: 14
    crop: { selector: '[data-testid="context-panel"]' }
    zoom: 1.8
    text: >-
      The workspace content memory already answers for some of these strings.
      One click applies the wording the team approved, and the terms that govern
      this block sit in the same rail beside it.

  - id: locale
    kind: desktop
    beat: locale
    caption: The same file, the next language.
    hold: 11
    crop:
      selector:
        - '[data-testid="locale-selector"]'
        - '[data-testid="visual-editor-card"]'
    zoom: 1.4
    text: >-
      One editor serves every target language. Switch from French to German and
      the card, the memory matches and the preview all follow, without leaving
      the document.

  - id: outro
    kind: outro
    text: >-
      Files arrive from a connector or from a push, and the edits go back the
      same way.
