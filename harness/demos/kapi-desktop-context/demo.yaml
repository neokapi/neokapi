id: kapi-desktop-context
title: Decide what your assistants suggest
subtitle: Coding assistants suggest rules as they work. You keep the right ones.
kind: use-case
publishAs: kapi-desktop-context
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Suggestions on the Overview
  - Decide
  - What an assistant reads

# Every beat sets a box crop. The walk still marks what it acts on
# (beatSpan in record-desktop.ts), and a box here wins over that region.
#
# The sample comes with two assistant sessions (claude-code, then codex). The
# walk creates it on camera and decides on its suggestions.
#
# Cue words the walk waits for, by beat: map (row, decide), decide (codex,
# claude-code), keep (places, k), word (check, k), choose (codex,
# claude-code's, keep), assistant (for, basket).
outro:
  line: Open Decide, and press K on the first suggestion that is right.

narration:
  - id: title
    kind: title
    text: >-
      Coding assistants suggest writing rules as they work in your project. In
      this video, you keep the ones that are right.

  - id: map
    kind: desktop
    beat: map
    caption: Suggestions wait on the Overview.
    crop: { x: 0.28, y: 0.58, w: 0.46, h: 0.25 }
    text: >-
      Click Try with KapiMart to open the sample. On the Overview, each row
      under What your files do is a suggestion. The Decide button shows how
      many are waiting.

  - id: decide
    kind: desktop
    beat: decide
    caption: One question for each suggestion.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Click Decide. Each suggestion is one question. At the top, two
      assistants disagree: codex suggests log in, and claude-code suggests
      sign in.

  - id: keep
    kind: desktop
    beat: keep
    caption: Keep the spelling your files use.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      First, select KapiMart. The first option is the spelling your files
      use. The line above the buttons shows how many places a check will
      report. Press K to keep it.

  - id: word
    kind: desktop
    beat: word
    caption: Keep a word as a rule.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Next, basket. Your store writes cart, so claude-code suggests avoiding
      basket. The line shows what a check will report. Press K to keep it.

  - id: choose
    kind: desktop
    beat: choose
    caption: Pick one side, and keep it.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Now the disagreement. codex suggests log in. claude-code's side, sign
      in, comes from an edit a person made. Pick sign in, and press K to keep
      it.

  - id: assistant
    kind: desktop
    beat: assistant
    caption: Your assistants get the rule.
    crop: { x: 0.03, y: 0.1, w: 0.45, h: 0.38 }
    text: >-
      On Assistants, you see what an assistant reads for each file. Choose the
      store's interface file. It now tells the assistant to avoid basket.

  - id: outro
    kind: outro
    text: >-
      Open Decide, and keep the suggestions that are right. Checks then report
      any text that breaks them.
