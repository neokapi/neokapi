id: kapi-desktop-context
title: Decide what your assistants suggest
subtitle: Coding assistants suggest rules as they work. You keep the right ones.
kind: use-case
publishAs: kapi-desktop-context
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Suggestions on the Overview
  - Decide
  - What an assistant reads

# Every beat sets a box crop. The walk still marks what it acts on
# (beatSpan in record-desktop.ts), and a box here wins over that region.
#
# The sample comes with two assistant sessions (claude-code, then codex). The
# walk creates it on camera and decides on its suggestions.
#
# Cue words the walk waits for, by beat: map (row, decide), decide (codex,
# claude-code), keep (places, k), word (check, k), choose (codex,
# claude-code's, keep), assistant (for, basket).
outro:
  line: Open Decide, and press K on the first suggestion that is right.

narration:
  - id: title
    kind: title
    text: >-
      Coding assistants such as Claude Code record suggested writing rules
      while they work in your project. You'll choose which ones become rules.

  - id: map
    kind: desktop
    beat: map
    caption: Suggestions wait on the Overview.
    crop: { x: 0.28, y: 0.58, w: 0.46, h: 0.25 }
    text: >-
      Click Try with KapiMart to open the sample. On the Overview, each row
      under What your files do is one suggestion. The Decide button shows the
      count.

  - id: decide
    kind: desktop
    beat: decide
    caption: One question per suggestion.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Click Decide. Each suggestion appears as one question. The first is a
      conflict: codex suggested log in, and claude-code suggested sign in.

  - id: keep
    kind: desktop
    beat: keep
    caption: Keep the most used spelling.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Select KapiMart. The first option is the spelling used most in the
      project. The line above the buttons shows how many places a check would
      report. Press K to keep it.

  - id: word
    kind: desktop
    beat: word
    caption: Keep a word as a rule.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Next, select basket. Cart appears throughout the store's text, so
      claude-code suggested a rule against basket. The line shows what a check would
      report. Press K to keep it.

  - id: choose
    kind: desktop
    beat: choose
    caption: Pick one side, and keep it.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Now the conflict. codex suggested log in. claude-code's suggestion, sign
      in, comes from an edit a person made. Pick sign in, and press K to keep
      it.

  - id: assistant
    kind: desktop
    beat: assistant
    caption: What an assistant reads for a file.
    crop: { x: 0.03, y: 0.1, w: 0.45, h: 0.38 }
    text: >-
      Open Assistants and pick a file, for example the store's interface file.
      This is what an assistant reads before it edits that file, and basket is
      now listed as a word to avoid.

  - id: outro
    kind: outro
    text: >-
      Open Decide and press K on each suggestion you want as a rule.
