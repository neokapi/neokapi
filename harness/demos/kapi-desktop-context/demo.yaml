id: kapi-desktop-context
title: Decide what your assistants suggest
subtitle: Coding assistants suggest rules as they work. You keep the right ones.
kind: use-case
publishAs: kapi-desktop-context
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Suggestions on the Overview
  - Decide
  - What an assistant reads
  - A new suggestion
  - Share and Preview

# Every beat sets a box crop. The walk still marks what it acts on
# (beatSpan in record-desktop.ts), and a box here wins over that region.
#
# The sample comes with two assistant sessions (claude-code, then codex). The
# walk creates it on camera, decides on its suggestions, and records one more
# note as claude-code from a shell while the Overview is on screen.
#
# Cue words the walk waits for, by beat: map (row, decide), decide (codex,
# claude-code), keep (blocks, k), word (check, k), choose (codex,
# claude-code's, keep), assistant (for, basket), live (test, row, decide),
# preview (preview, rules, kept).
outro:
  line: Open Decide, and press K on the first suggestion that is right.
  pointer: kapi rules

narration:
  - id: title
    kind: title
    text: >-
      When a coding assistant works in your project, it records how your
      files are written. In Kapi Desktop, you read these suggestions and keep
      the ones that are right.

  - id: map
    kind: desktop
    beat: map
    caption: Suggestions wait on the Overview.
    crop: { x: 0.28, y: 0.58, w: 0.46, h: 0.25 }
    text: >-
      Click Try with KapiMart to open the sample. On the Overview, each row
      under What your files do is a suggestion from an assistant. The Decide
      button shows how many are waiting.

  - id: decide
    kind: desktop
    beat: decide
    caption: One question for each suggestion.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Click Decide. The first suggestion is a disagreement between two
      assistants. codex wants log in, and claude-code wants sign in.

  - id: keep
    kind: desktop
    beat: keep
    caption: Keep the product name as your files write it.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Select KapiMart. The question is which spelling your files use. The
      line above the buttons shows how many blocks a check will report, and
      where the rule applies. Press K to keep it.

  - id: word
    kind: desktop
    beat: word
    caption: Keep a word as a rule.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Next is basket. Your store writes cart, not basket, so claude-code
      suggests a rule. You also see what a check will report. Press K to keep
      it.

  - id: choose
    kind: desktop
    beat: choose
    caption: Pick one side, and keep it.
    crop: { x: 0.03, y: 0.09, w: 0.56, h: 0.3 }
    text: >-
      Now the disagreement. The text that codex quoted says signing in, so it
      goes against its own suggestion. claude-code's side comes from a change
      that a person made. Pick sign in, and press K to keep it. Log in is set
      aside.

  - id: assistant
    kind: desktop
    beat: assistant
    caption: What an assistant reads for one file.
    crop: { x: 0.03, y: 0.1, w: 0.45, h: 0.38 }
    text: >-
      On Assistants, you see what an assistant reads for each file. Choose
      the store's interface file. Its terms now mark basket as discouraged.
      That is the rule you just kept.

  - id: live
    kind: desktop
    beat: live
    caption: A new suggestion appears.
    crop: { x: 0.28, y: 0.58, w: 0.46, h: 0.25 }
    text: >-
      Back on the Overview, claude-code records a note from a terminal. The
      docs say sandbox, not test mode. A moment later, the note appears as a
      new row, and the number on Decide goes up by one.

  - id: share
    kind: desktop
    beat: share
    caption: Where your rules are kept.
    crop: { x: 0.03, y: 0.08, w: 0.41, h: 0.36 }
    text: >-
      Share shows where the project's rules are kept. Right now they are on
      this Mac, and every copy of the project on this Mac uses them. You can
      also share them with your team, or through Bowrain.

  - id: preview
    kind: desktop
    beat: preview
    caption: The project as Bowrain shows it.
    crop: { x: 0.79, y: 0.0, w: 0.21, h: 0.32 }
    text: >-
      Click Preview to see the project as a Bowrain project page shows it.
      No server is connected, so it uses the data on this Mac. Open the Rules
      tab. Kept by lists the rules you kept, with who kept each one and when.

  - id: outro
    kind: outro
    text: >-
      A suggestion is only advice. When you keep it, it becomes a rule, and
      checks report any text that breaks it.
