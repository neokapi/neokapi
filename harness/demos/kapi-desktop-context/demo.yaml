id: kapi-desktop-context
title: What your assistant noticed, and what you decide
subtitle: Context grows while you work; the desktop is where you keep what is right.
kind: use-case
publishAs: kapi-desktop-context
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - What waits on the Map
  - One question per suggestion
  - The brief an assistant reads
  - What a session recorded
  - A note arriving from outside the app
  - How far the context reaches
  - The project as Bowrain would show it

# keep, word, choose, assistant and preview carry no crop: the walk crops each
# to what it marks (beatSpan in record-desktop.ts). That is
# the row answered in Decide's list and the question beside it, the file
# picker and the kept rule's line, or the Preview's tabs and its Kept by list.
#
# The sample arrives with two assistant sessions (claude-code, then codex),
# seeded by the desktop backend when the sample is created. The walk creates
# it on camera from the Open screen, reviews it, and records one more note as
# claude-code from a shell while the Map is on screen.
outro:
  line: Open Decide and press k on the first thing that is right.
  pointer: kapi rules

narration:
  - id: title
    kind: title
    text: >-
      While an assistant works in your project, it notices how your files are
      written. On the desktop you read what it noticed and decide what becomes
      a rule.

  - id: map
    kind: desktop
    beat: map
    caption: What is waiting for you.
    crop: { selector: ['[data-slot="map-decide"]', '[data-slot="map-counts"]', '[data-slot="map-suggestions"]'] }
    text: >-
      Try with KapiMart opens the sample on its Map. Each row under What your
      files do is something an assistant noticed that nobody has decided yet.
      The Decide button shows how many are waiting.

  - id: decide
    kind: desktop
    beat: decide
    caption: One question per suggestion.
    crop: { selector: ['[data-slot="list-detail-list"]', '[data-slot="decide-question"]'] }
    text: >-
      Click Decide. You get one question per suggestion, with the disagreement
      first. Its options are the two sides: codex says log in, claude-code
      says sign in, and each side says what keeping it would do.

  - id: keep
    kind: desktop
    beat: keep
    caption: Keep the spelling your files use.
    text: >-
      For the product name, the question is which spelling your files use. The
      line above the buttons says how many blocks a check would flag, and
      where the rule applies. Press k. That keeps KapiMart, and the next
      question is selected for you.

  - id: word
    kind: desktop
    beat: word
    caption: A word, kept as a rule.
    text: >-
      claude-code also noticed that the store says cart, not basket. The
      question is whether to keep that, and what a check would flag once you
      do. Press k to keep it.

  - id: choose
    kind: desktop
    beat: choose
    caption: Pick one side. The other is set aside.
    text: >-
      Now the disagreement. The sentence codex quoted says signing in, the
      opposite of its own rule. claude-code's side is a change a person made
      in the error messages. Pick sign in and keep it. Log in is set aside.

  - id: assistant
    kind: desktop
    beat: assistant
    caption: The brief for one file carries your rule.
    text: >-
      Assistants shows what an assistant reads before it writes. For the
      store's interface strings, the brief marks basket as discouraged and
      says to use cart, the rule you kept a moment ago. kapi context prints
      the same answer for that file.

  - id: sessions
    kind: desktop
    beat: sessions
    caption: What one session recorded.
    text: >-
      Below the assistants, Sessions lists what each one recorded. Open
      claude-code's session to see every operation in it with its status. The
      name and the word you kept are in force. Reset to before this session
      takes the whole session back.

  - id: live
    kind: desktop
    beat: live
    caption: A note from a terminal arrives live.
    crop: { selector: ['[data-slot="map-decide"]', '[data-slot="map-counts"]', '[data-slot="map-suggestions"]'] }
    text: >-
      Back on the Map, a note arrives from a terminal off screen, recorded by
      claude-code: the docs say sandbox, not test mode. Within a second it is
      a row in the list, and Decide counts one more.

  - id: share
    kind: desktop
    beat: share
    caption: How far this context reaches.
    crop: { selector: '[data-slot="share-panel"]' }
    text: >-
      Share shows how far your project's context reaches. Right now it is on
      this Mac, where every clone and worktree of the project reads it.
      Sharing with your team is not set up, and Bowrain is not connected.

  - id: preview
    kind: desktop
    beat: preview
    caption: The project as Bowrain would show it.
    text: >-
      Click Preview to see the project the way a Bowrain project page shows
      it. With no server connected, it reads this Mac and says so. The Map tab
      is the page a Bowrain project opens on. On the Rules tab, Kept by lists
      the rules you kept a moment ago, with who kept each and when.

  - id: outro
    kind: outro
    text: >-
      Every suggestion is advice until you keep it. Then it is a rule the
      checks enforce.
