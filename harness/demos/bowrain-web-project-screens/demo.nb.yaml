id: bowrain-web-project-screens
title: "Én oversikt over prosjektets regler, for hele teamet"
subtitle: "Et prosjekts Oversikt, Leser og Regler i nettleseren."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-project-screens
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
aspects:
  - A project opens on its Overview
  - A check over every file, on the server
  - A fix filed as a source proposal
  - The team queue and who kept what

# Recording needs the Docker stack and a seed run, which writes
# BOWRAIN_SCREENS_PROJECT_ID. That project's context holds undecided
# suggestions, synced with the bowrain context backend, and one of its files
# has a fixable finding. The walk refuses to start without the id.
#
# reader, fix, assign and keep carry no crop: the walk crops each to what it
# marks (beatSpan in record-desktop.ts). assign drives the team queue's
# assignee picker.
outro:
  line: Legg til kontekst med backend-en bowrain i kapi.yaml.
  pointer: kapi context sync

narration:
  - id: title
    kind: title
    text: >-
      Et prosjekt på Bowrain åpnes på Oversikten. Teamet leser hva assistentene la merke til, sjekker alle filer på serveren og bestemmer hva som gjelder – på ett sted.
  - id: overview
    kind: desktop
    beat: overview
    caption: Et prosjekt åpnes på Oversikten.
    crop: { selector: ['[data-slot="overview-decide"]', '[data-slot="overview-counts"]', '[data-slot="overview-suggestions"]'] }
    text: >-
      Å åpne et prosjekt lander på Oversikten. Tellerne viser filer, blokker, regler og funn. Hver rad under Forslag er noe en assistent har foreslått og ingen har tatt stilling til ennå, og Bestem-knappen teller dem.
  - id: run
    kind: desktop
    beat: run
    caption: "Alle filer, sjekket på serveren."
    crop: { selector: ['[data-slot="overview-run"]', '[data-slot="overview-counts"]'] }
    text: >-
      Kjør på alt sjekker alle filer på serveren som én jobb, som krever gjennomgangs-tillatelse. Når jobben er ferdig, viser funntellingen hva sjekkene rapporterte.
  - id: reader
    kind: desktop
    beat: reader
    caption: "Én fil, dens funn og reglene som gjelder for den."
    text: >-
      En fil åpnes i Leseren. Hvert funn ligger under blokken det tilhører, og margen lister opp reglene som gjelder for denne filen.
  - id: fix
    kind: desktop
    beat: fix
    caption: "En rettelse, registrert som et kildeforslag."
    text: >-
      Rett registrerer et kildeforslag og lar filen stå som den er. Foreslått tar knappens plass og åpner listen over åpne forslag, der en godkjenning anvender endringen og beholder all innebygd kode.
  - id: rules
    kind: desktop
    beat: rules
    caption: Teamkøen.
    crop: { selector: ['[data-slot="list-detail-list"]', '[data-slot="decide-question"]'] }
    text: >-
      Regler er teamkøen. Hver forslag som venter på en beslutning er en rad, ved siden av spørsmålet om den valgte.
  - id: assign
    kind: desktop
    beat: assign
    caption: Tildelt en kollega.
    text: >-
      Tildelt den som svarer på det. Velgeren lister opp arbeidsområdets medlemmer, Maria tar denne, og køen viser navnet hennes.
  - id: keep
    kind: desktop
    beat: keep
    caption: "Beholdt, som deg."
    text: >-
      Behold registrerer regelen som deg, i prosjektets kontekst, og raden forlater køen.
  - id: kept
    kind: desktop
    beat: kept
    caption: "Hvem som beholdt hver regel, nyeste først."
    crop: { selector: '[data-slot="kept-rules"]' }
    text: >-
      Beholdt av lister opp alle regler som gjelder, med hvem som beholdt den, datoen og hvor den gjelder. Regelen du beholdt er øverst.
  - id: outro
    kind: outro
    text: >-
      Alle utsjekkinger leser de samme beslutningene ved neste kapi context-synkronisering.
