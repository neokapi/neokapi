id: kapi-desktop-review
title: A translation, read where it sits
subtitle: Five layers under one block, and a keystroke to decide.
kind: use-case
publishAs: kapi-desktop-review
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - One review queue
  - The point a block sits at
  - Prior decisions and approved wording
  - Findings anchored in the runs
outro:
  line: Open Review and press A on a clean block.
  pointer: kapi status --review

narration:
  - id: title
    kind: title
    text: >-
      Review shows you a translation where it sits: what applies there, what
      is next to it, and what was approved before.

  - id: queue
    kind: desktop
    beat: queue
    caption: One list for every language.
    text: >-
      Review is one list for every language. Each language has a count, and
      chips show what a check flagged.

  - id: open-unit
    kind: desktop
    beat: open-unit
    caption: Source, translation, and what shaped them.
    text: >-
      Open a block to see the source and the translation, with what shaped
      them underneath.

  - id: point
    kind: desktop
    beat: point
    caption: What applies here.
    crop: { selector: '[data-slot="review-point"]' }
    text: >-
      First, where this content sits: its coordinates, the voice profile that
      applies there, and the term rules bound to it.

  - id: neighbourhood
    kind: desktop
    beat: neighbourhood
    caption: What sits either side.
    crop: { selector: '[data-slot="review-neighbourhood"]' }
    text: >-
      Second, the neighbours: the blocks before and after, so you read the
      sentence where a reader will meet it.

  - id: history
    kind: desktop
    beat: history
    caption: What was decided before.
    crop: { selector: '[data-slot="review-history"]' }
    text: >-
      Third, the history: the version approved last time, next to the match
      content memory offers now.

  - id: findings
    kind: desktop
    beat: findings
    caption: What the checks found.
    crop: { selector: '[data-slot="review-findings"]' }
    highlight: { selector: '[data-slot="review-finding"]' }
    text: >-
      Fourth, the checks. Each finding points at the run it is about, so a
      complaint about a placeholder points at that placeholder.

  - id: provenance
    kind: desktop
    beat: provenance
    caption: Who decided, and when.
    crop: { selector: '[data-slot="review-provenance"]' }
    text: >-
      Fifth, provenance: who wrote it, who decided it, and whether the text
      has changed since. This block carries none.

  - id: decide
    kind: desktop
    beat: decide
    caption: One keystroke, then the clean ones together.
    text: >-
      When you have read it, one keystroke records your decision, bound to the
      text you judged. The blocks no check flagged, you can approve together.

  - id: outro
    kind: outro
    text: >-
      Every decision you make here is the same record the command line reads
      and writes.
