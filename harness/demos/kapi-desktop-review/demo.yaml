id: kapi-desktop-review
title: Review a translation
subtitle: Read each translation in its place, then approve it with one key.
kind: use-case
publishAs: kapi-desktop-review
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The review list
  - Source and translation
  - What helps you judge it
  - Approve
outro:
  line: Open Review, and press A on a translation that reads right.

narration:
  - id: title
    kind: title
    text: >-
      In this video, you read a translation, check it in its place, and
      approve it with one key.

  - id: queue
    kind: desktop
    beat: queue
    crop: { x: 0.03, y: 0.05, w: 0.95, h: 0.42 }
    caption: Everything waiting for you, in one list.
    text: >-
      Open Review. The list on the left holds every translation waiting for
      you. Use the menus at the top to show one language, or only the
      translations with problems.

  - id: open-unit
    kind: desktop
    beat: open-unit
    crop: { x: 0.19, y: 0.1, w: 0.79, h: 0.45 }
    caption: The English and the translation.
    text: >-
      Click one. You see the English and the translation side by side.

  - id: details
    kind: desktop
    beat: details
    crop: { x: 0.19, y: 0.35, w: 0.45, h: 0.48 }
    caption: What helps you judge it.
    text: >-
      Below, you see the text around it, the version approved before, and any
      problems the checks found.

  - id: decide
    kind: desktop
    beat: decide
    crop: { x: 0.03, y: 0.06, w: 0.5, h: 0.4 }
    caption: Approve with one key.
    text: >-
      Press A to approve it, and the next one opens. To approve every
      translation with no problems at once, click Approve clean blocks.

  - id: outro
    kind: outro
    text: >-
      Open Review, read each translation in its place, and press A when it
      reads right.
