id: kapi-desktop-review
title: Review a translation
subtitle: Read each translation in its place, then approve it with one key.
kind: use-case
publishAs: kapi-desktop-review
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The review list
  - Source and translation
  - What helps you judge it
  - Approve
outro:
  line: Open Review, and press A on a translation that reads right.

narration:
  - id: title
    kind: title
    text: >-
      You'll read a translation in its place and approve it with one key.

  - id: queue
    kind: desktop
    beat: queue
    caption: Every translation to review.
    text: >-
      Open Review. The list on the left shows every translation to review.

  - id: filters
    kind: desktop
    beat: filters
    caption: Filter by language or by problem.
    text: >-
      Use the menus at the top to filter by language, or to show only
      translations with problems.

  - id: open-unit
    kind: desktop
    beat: open-unit
    caption: The English and the translation.
    text: >-
      Click a translation. The English and the translation appear side by
      side.

  - id: details
    kind: desktop
    beat: details
    caption: The context for this translation.
    text: >-
      Below, read the text around it and the version approved last time.

  - id: checks
    kind: desktop
    beat: checks
    caption: What the checks found.
    text: >-
      Problems found by the checks appear here as well.

  - id: decide
    kind: desktop
    beat: decide
    caption: Approve with one key.
    text: >-
      Press A to approve it, and the next translation opens. To approve all
      translations without problems, click Approve clean blocks.

  - id: outro
    kind: outro
    text: >-
      Open Review and press A on each translation you approve.
