id: kapi-desktop-review
title: Judged where it sits
subtitle: Five layers under one unit, and a keystroke to decide.
kind: use-case
publishAs: kapi-desktop-review
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - One review queue
  - The point a unit sits at
  - Prior decisions and approved wording
  - Findings anchored in the runs
outro:
  line: Open Review and press A on a clean unit.
  pointer: kapi status --review

narration:
  - id: title
    kind: title
    text: >-
      A translation is judged where it sits: at its point, beside its
      neighbours, against what was approved before.

  - id: queue
    kind: desktop
    beat: queue
    crop: { x: 0.01, y: 0.02, w: 0.92, h: 0.5 }
    caption: One list, every language, two ways to narrow it.
    text: >-
      Review is one queue. Every language is in the same list, with a count per
      language and chips for what a check flagged.

  - id: open-unit
    kind: desktop
    beat: open-unit
    crop: { x: 0.17, y: 0.05, w: 0.76, h: 0.42 }
    caption: Source, target, and the layers beneath them.
    text: >-
      Opening a unit gives the source and the translation, with what shaped
      them stacked underneath.

  - id: point
    kind: desktop
    beat: point
    caption: What governs here?
    crop: { x: 0.17, y: 0.06, w: 0.5, h: 0.25 }
    text: >-
      The first layer is the point this content sits at: its coordinates, the
      voice governing there, and the term rules bound to it.

  - id: neighbourhood
    kind: desktop
    beat: neighbourhood
    caption: What sits either side of it?
    crop: { x: 0.17, y: 0.32, w: 0.76, h: 0.32 }
    text: >-
      The second is the neighbourhood: the blocks either side of it, so a
      sentence is read where a reader will meet it.

  - id: history
    kind: desktop
    beat: history
    caption: What was decided before?
    crop: { x: 0.17, y: 0.49, w: 0.76, h: 0.32 }
    text: >-
      The third is what was decided before: the version approved last time,
      beside the match memory offers now.

  - id: findings
    kind: desktop
    beat: findings
    caption: What did the checks find, and where?
    crop: { x: 0.17, y: 0.66, w: 0.5, h: 0.25 }
    highlight: { selector: '[data-slot="review-finding"]' }
    text: >-
      The fourth is the checks. A finding is anchored in the run it names, so a
      complaint about a placeholder points at the placeholder.

  - id: provenance
    kind: desktop
    beat: provenance
    caption: Who decided, and when?
    crop: { x: 0.17, y: 0.75, w: 0.5, h: 0.25 }
    text: >-
      The fifth is provenance: who wrote it, who decided it, and whether the
      text has moved since. This one carries none.

  - id: decide
    kind: desktop
    beat: decide
    crop: { x: 0.01, y: 0.03, w: 0.5, h: 0.5 }
    caption: One keystroke, then the clean ones together.
    text: >-
      With that read, the decision is a keystroke bound to the text it judged,
      and the units no check flagged go together.

  - id: outro
    kind: outro
    text: >-
      Every decision here is the record the command line reads and writes, so
      the surface you work from is a preference.
