id: 03-translate-docx
title: Et Word-dokument ingen åpnet
subtitle: "Oversatt til japansk med alle overskrifter, lister og datoer i fet skrift på plass."
kind: use-case
publishAs: claude-translate-document
aspects:
  - document formats
  - translation
  - structure-preserving
needsAi: true
model: sonnet
captureTimeoutSec: 240
outro:
  line: La en person gå gjennom den før den publiseres.
  pointer: kapi status --review

prompt: >
  Can you translate announcement.docx into Japanese?

artifacts:
  - id: before
    caption: "announcement.docx: the original English document"
    source: docx
    path: announcement.docx
    from: fixture
    reportTitle: "announcement.docx"
    reportSub: "English, the original Word document"
    width: 1100
    height: 860
  - id: after
    caption: "announcement.ja.docx: translated, structure and formatting intact"
    source: docx
    path: announcement.ja.docx
    reportTitle: "announcement.ja.docx"
    reportSub: "kapi · Japanese, headings / lists / bold preserved"
    width: 1100
    height: 860

narration:
  - id: title
    kind: title
    text: >-
      Et Word-dokument kan oversettes uten at noen åpner Word. Med én forespørsel til Claude leser kapi filen, oversetter teksten og skriver et nytt dokument med alle overskrifter og datoer i fet skrift på samme sted som før.
  - id: before
    kind: artifact
    artifact: before
    caption: "Overskrifter, en punktliste, datoer i fet skrift og en kontaktlinje."
    text: >-
      Her er originalen. Overskrifter, en punktliste, datoer i fet skrift og en kontaktlinje – den delen av et dokument som tåler kopiering og innliming dårligst.
  - id: read
    kind: terminal
    caption: "Lest som et dokument, med lister og fet skrift."
    text: >-
      Claude sender filen til kapi, som åpner Word-formatet direkte og henter ut avsnittene, listepunktene og tekstpartiene i fet skrift. Ingenting konverteres til ren tekst underveis.
  - id: write
    kind: terminal
    caption: Et nytt dokument med samme struktur som originalen.
    text: >-
      Teksten sendes til den konfigurerte leverandøren. Resultatet skrives til et nytt dokument med samme struktur som originalen. Den samme kommandoen leser alle dokumentformatene kapi støtter.
  - id: after
    kind: artifact
    artifact: after
    caption: Japansk tekst med samme struktur som det engelske dokumentet.
    text: >-
      Og her er den japanske versjonen. Overskriftene er fortsatt overskrifter, listen er fortsatt en liste, datoene er fortsatt i fet skrift, og produktnavnet er uendret.
  - id: outro
    kind: outro
    text: >-
      Dette er en ren maskinoversettelse. Kjør gjennomgangskøen på den, så lister kapi opp det en person bør lese før den publiseres.
