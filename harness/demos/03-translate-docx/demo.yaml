id: 03-translate-docx
title: A Word document nobody opened
subtitle: Translated into Japanese with every heading, list and bold date in place.
kind: use-case
publishAs: claude-translate-document
aspects:
  - document formats
  - translation
  - structure-preserving
needsAi: true
model: sonnet
captureTimeoutSec: 240
outro:
  line: Put a person on it before it ships.
  pointer: kapi status --review

prompt: >
  Can you translate announcement.docx into Japanese?

artifacts:
  - id: before
    caption: "announcement.docx: the original English document"
    source: docx
    path: announcement.docx
    from: fixture
    reportTitle: "announcement.docx"
    reportSub: "English, the original Word document"
    width: 1100
    height: 860
  - id: after
    caption: "announcement.ja.docx: translated, structure and formatting intact"
    source: docx
    path: announcement.ja.docx
    reportTitle: "announcement.ja.docx"
    reportSub: "kapi · Japanese, headings / lists / bold preserved"
    width: 1100
    height: 860

narration:
  - id: title
    kind: title
    text: >-
      A Word document can be translated without anyone opening Word. One request
      to Claude, and kapi reads the file, translates the text, and writes a new
      document with every heading and bold date where it was.

  - id: before
    kind: artifact
    artifact: before
    caption: Headings, a bullet list, bold dates, a contact line.
    text: >-
      Here is the original. Headings, a bullet list, bold dates and a contact
      line, which is the part of a document that survives a copy and paste
      least well.

  - id: read
    kind: terminal
    caption: The file is read as a document, not as bytes.
    text: >-
      Claude hands the file to kapi, which opens the Word format directly and
      pulls out the paragraphs, the list items and the runs of bold inside them.
      Nothing is converted to plain text on the way.

  - id: write
    kind: terminal
    caption: A new document, written from the same structure.
    text: >-
      The text goes to the configured provider, and what comes back is written
      into a new document that carries the original structure. The same one
      command reads every document format kapi supports.

  - id: after
    kind: artifact
    artifact: after
    caption: Japanese text in the English document's shape.
    text: >-
      And the Japanese version. The headings are still headings, the list is
      still a list, the dates are still bold, and the product name is still the
      product name.

  - id: outro
    kind: outro
    text: >-
      This is a plain machine translation. Run the review queue over it and kapi
      lists what a person should read before it ships.
