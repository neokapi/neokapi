id: bowrain-web-collaboration
title: En kollegas avatar vises på under ett sekund
subtitle: "To personer i én fil, via én server, uten fletting."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-collaboration
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Inviter via e-post under Medlemmer og roller.
  pointer: bowrain.cloud
aspects:
  - Live presence in the editor
  - Two people, one file
  - Invited by email, governed by role

# Recorded with TWO genuine authenticated users: the camera is the first user
# (Alice); a second, off-camera session (Bob) joins the same Translate file, so
# his presence avatar appears live over the real collab WebSocket. The beats
# below match harness/src/driver/record-desktop.ts `bowrainCollaborationWalk`.
# Seed with harness/scripts/seed-collaboration.mjs (prints both tokens + the
# project/item/locale) and pass BOWRAIN_PEER_TOKEN to record the live presence.

narration:
  - id: title
    kind: title
    text: >-
      Når en kollega åpner filen du arbeider i, vises kollegaens avatar i redigeringsverktøyet ditt innen ett sekund.
  - id: teammate-joins
    kind: desktop
    beat: teammate-joins
    caption: En annen person i samme fil.
    hold: 20
    crop: { selector: '[data-testid="presence-avatars"]' }
    zoom: 2.5
    highlight: { selector: '[data-testid="presence-avatars"]' }
    text: >-
      Dette er en annen person, i en annen nettleser, logget inn med sin egen konto. Serveren formidler tilstedeværelsen fortløpende. Dermed kan ingen endre en fil du arbeider i uten at du ser at de er der. Ingenting ble eksportert, og ingenting må flettes inn igjen etterpå.
  - id: co-editing
    kind: desktop
    beat: co-editing
    caption: Tilstedeværelsen følger personen.
    hold: 18
    crop: { x: 0.12, y: 0.15, w: 0.76, h: 0.42 }
    text: >-
      Kollegaen går til en annen blokk, og tilstedeværelsen følger med. To oversettere arbeider samtidig i samme fil, med samme delte innholdsminne og de samme termene. Ingen av dem trenger å gjette hva den andre allerede har bestemt.
  - id: members
    kind: desktop
    beat: members
    caption: Invitert via e-post og tildelt en rolle.
    hold: 14
    crop: { selector: '[role="dialog"]' }
    text: >-
      Du bestemmer hvem som får tilgang. Inviter en kollega via e-post under Medlemmer og roller. Gi kollegaen rollen som trengs for språkarbeidet: eier, administrator, medlem eller leser.
  - id: outro
    kind: outro
    text: >-
      Ett arbeidsområde, delt i sanntid, med tilgang styrt av rollen hver person har.
