id: bowrain-web-collaboration
title: Sanntidssamarbeid
subtitle: "To personer, ett dokument, direkte."
tagline: serverside-plattformfølgesvennen til kapi
kind: use-case
publishAs: bowrain-web-collaboration
terminal: skrivebord
target: web
brand: bowrain
needsAi: false
# One continuous narration read — uniform voice across scenes.
oneshot: true
aspects:
  - Ett delt arbeidsområde
  - Live-tilstedeværelse i editoren
  - "To personer, én fil"
  - Styrt av rolle

# Recorded with TWO genuine authenticated users: the camera is the first user
# (Alice); a second, off-camera session (Bob) joins the same Translate file, so
# his presence avatar appears live over the real collab WebSocket. The beats
# below match harness/src/driver/record-desktop.ts `bowrainCollaborationWalk`.
# Seed with harness/scripts/seed-collaboration.mjs (prints both tokens + the
# project/item/locale) and pass BOWRAIN_PEER_TOKEN to record the live presence.

narration:
  - id: title
    kind: title
    text: >-
      Et team som jobber i ett dokument samtidig — direkte tilstedeværelse i editoren, alt i et delt, styrt arbeidsområde.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Et arbeidsområde deles av hele teamet — prosjekter, hukommelse og terminologi er samlet på ett sted, ikke på én bærbar.
  - id: open-file
    kind: desktop
    beat: open-file
    caption: Åpne en fil i Oversett-flaten.
    text: >-
      En oversetter åpner en fil i Oversett-flaten — kilde og mål side om side, med live forhåndsvisning av siden som oversettes.
  - id: teammate-joins
    kind: desktop
    beat: teammate-joins
    caption: En kollega bli med — tilstedeværelsen deres vises direkte.
    text: >-
      Når en kollega åpner den samme filen, vises avataren deres i editoren med en gang. Hver person kan se hvem andre som er her og arbeider i nøyaktig det samme dokumentet.
  - id: co-editing
    kind: desktop
    beat: co-editing
    caption: "To personer, én fil, i sanntid."
    text: >-
      Begge arbeider i den samme filen sammen — ingen eksporterte regneark, ingen sammenslåingstrinn etterpå. Den delte hukommelsen og terminologien holder alle konsistente underveis.
  - id: members
    kind: desktop
    beat: members
    caption: "Delt, men styrt av rolle."
    text: >-
      Tilgang er styrt: folk inviteres via e-post og tildeles en rolle — medlem, administrator eller leser — slik at arbeidsområdet forblir åpent for teamet, men kontrollert.
  - id: desktop-handoff
    kind: desktop
    beat: desktop-handoff
    caption: "Det samme arbeidsområdet, i skrivebordsappen."
    text: >-
      Og når du ønsker native hastighet og frakoblet tilgang, åpnes det samme arbeidsområdet i skrivebordsappen.
  - id: outro
    kind: outro
    text: >-
      Et team som redigerer delt innhold sammen i sanntid – styringssjiktet over de åpne kapi-verktøyene.
