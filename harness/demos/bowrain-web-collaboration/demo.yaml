id: bowrain-web-collaboration
title: A teammate's avatar arrives in under a second
subtitle: Two people in one file, over one server, with no merge step.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-collaboration
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Invite by email under Members and roles.
  pointer: bowrain.cloud
aspects:
  - Live presence in the editor
  - Two people, one file
  - Invited by email, governed by role

# Recorded with TWO genuine authenticated users: the camera is the first user
# (Alice); a second, off-camera session (Bob) joins the same Translate file, so
# his presence avatar appears live over the real collab WebSocket. The beats
# below match harness/src/driver/record-desktop.ts `bowrainCollaborationWalk`.
# Seed with harness/scripts/seed-collaboration.mjs (prints both tokens + the
# project/item/locale) and pass BOWRAIN_PEER_TOKEN to record the live presence.

narration:
  - id: title
    kind: title
    text: >-
      When a teammate opens the file you are already in, their avatar appears in
      your editor within a second.

  - id: teammate-joins
    kind: desktop
    beat: teammate-joins
    caption: A second person, in the same file.
    hold: 20
    crop: { selector: '[data-testid="presence-avatars"]' }
    zoom: 2.5
    highlight: { selector: '[data-testid="presence-avatars"]' }
    text: >-
      That is a second person, in a second browser, signed in as themselves. The
      server relays their presence as it happens, so a file you are working in
      is never quietly being changed by somebody you cannot see. Nothing was
      exported, and nothing has to be merged back afterwards.

  - id: co-editing
    kind: desktop
    beat: co-editing
    caption: The presence follows the person.
    hold: 18
    crop: { x: 0.12, y: 0.15, w: 0.76, h: 0.42 }
    text: >-
      They move to a block of their own, and the presence moves with them. Two
      translators work the same file at the same time, on the same shared
      memory and the same terms, so neither has to guess what the other has
      already decided.

  - id: members
    kind: desktop
    beat: members
    caption: Invited by email, given a role.
    hold: 14
    crop: { selector: '[role="dialog"]' }
    text: >-
      Who is allowed in is a decision rather than a side effect. Invite a
      colleague by email under Members and roles, and give them the role the
      language needs: owner, admin, member or viewer.

  - id: outro
    kind: outro
    text: >-
      One workspace, shared live, and governed by the role each person holds.
