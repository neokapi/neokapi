id: bowrain-web-collaboration
title: Real-time collaboration
subtitle: Two people, one document, live.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-collaboration
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
aspects:
  - One shared workspace
  - Live presence in the editor
  - Two people, one file
  - Governed by role

# Recorded with TWO genuine authenticated users: the camera is the first user
# (Alice); a second, off-camera session (Bob) joins the same Translate file, so
# his presence avatar appears live over the real collab WebSocket. The beats
# below match harness/src/driver/record-desktop.ts `bowrainCollaborationWalk`.
# Seed with harness/scripts/seed-collaboration.mjs (prints both tokens + the
# project/item/locale) and pass BOWRAIN_PEER_TOKEN to record the live presence.

narration:
  - id: title
    kind: title
    text: >-
      A team working in one document at the same time, with live presence in
      the editor and a shared, governed workspace behind it.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      A workspace is shared by a whole team. Its projects, memory and terms
      live in one place rather than on one laptop.

  - id: open-file
    kind: desktop
    beat: open-file
    caption: Open a file in the Translate surface.
    text: >-
      One translator opens a file in the Translate surface, with the editing
      card over a live preview of the page being translated.

  - id: teammate-joins
    kind: desktop
    beat: teammate-joins
    caption: A teammate joins, and their presence appears live.
    text: >-
      When a teammate opens the same file, their avatar appears in the editor
      straight away. Each person can see who else is here, working in the very
      same document.

  - id: co-editing
    kind: desktop
    beat: co-editing
    caption: Two people, one file, in real time.
    text: >-
      Both work in the same file together, with no exported spreadsheets and
      no merge step afterwards. The shared memory and terms keep everyone
      consistent as they go.

  - id: members
    kind: desktop
    beat: members
    caption: Shared, but governed by role.
    text: >-
      Access is governed. People are invited by email and given a role, owner,
      admin, member or viewer, so the workspace stays open to the team and still
      controlled.

  - id: desktop-handoff
    kind: desktop
    beat: desktop-handoff
    caption: The same workspace, in the desktop app.
    text: >-
      And when you want native speed and offline, the same workspace opens in
      the desktop app.

  - id: outro
    kind: outro
    text: >-
      A team editing shared content together in real time. The stewardship
      layer over the open kapi tools.
