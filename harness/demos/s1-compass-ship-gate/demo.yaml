id: s1-compass-ship-gate
title: The picker is the gate
subtitle: A review in the morning is why a language is offered in the afternoon.
kind: use-case
publishAs: multilingual-ship-states
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/compass
needsAi: false
# The sandbox IS the Compass sample project, copied from samples/compass so the
# recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/compass
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi store import ./context
captureTimeoutSec: 240
aspects:
  - review moves the edge
  - ship states, not file presence
  - one file the site reads
outro:
  line: Let your build read one file.
  pointer: kapi status --ship --emit ship.json

script:
  - comment: Compass ships three languages from one source. Bring them up to date first.
  - command: kapi up
  - comment: Norwegian and German clear the ship gate on translated work. Dutch waits for review, because one of its blocks fails the project's bound checks.
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json
  - comment: The review queue names each block's document, key and language, which a decision addresses. This selects the Dutch a person wrote and leaves what the stub drafted.
  - command: >-
      kapi status --review --json --jq '.pending[]|select(.locale=="nl" and (.target|startswith("⟦")|not))|{op:"decide",at:{doc:.relative,block:.key,edition:.locale},if_match:"*",outcome:"establish"}' > dutch.json
  # The report goes to stderr, so the tail has to see stderr to trim it.
  - command: kapi apply dutch.json 2>&1 | tail -3
  - comment: Each approval is in the record as it is made, attributable, and reviewable in the context log.
  - comment: A decision releases the language, so run the loop again. The drafts it already made are recycled, so the provider is asked for nothing a second time.
  - command: kapi up
  - comment: Dutch is offered now, in the translated state, because not every block in it is approved.
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json
  - comment: Establish the rest of Norwegian, and the same file says so.
  - command: >-
      kapi status --review --json --jq '.pending[]|select(.locale=="nb")|{op:"decide",at:{doc:.relative,block:.key,edition:.locale},if_match:"*",outcome:"establish"}' > norwegian.json
  - command: kapi apply norwegian.json 2>&1 | tail -2
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json

artifacts:
  # The page fetches ship.json and a catalog, so it needs a server rather than a
  # file:// load. The default server roots at the sandbox, so the path carries
  # the site/ prefix; settleMs covers the two fetches before the shot.
  - id: picker
    caption: "site/index.html: the picker, built from ship.json"
    source: url
    path: /site/index.html
    port: 4599
    settleMs: 1500
    width: 1200
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      Here the language picker is the gate. A language appears on the site
      when someone has reviewed it, and not before.

  - id: parked
    kind: terminal
    through: 5
    highlight: { text: ["waiting for review", withheld] }
    caption: Dutch is drafted and held back.
    text: >-
      Dutch waits for review because one check failed. Its drafts are safe in
      the project store. What the gate holds back is delivery, until someone
      has looked at the block that failed.

  - id: review
    kind: terminal
    through: 10
    caption: Twenty decisions on the record.
    text: >-
      The queue says what each decision is about. This filter shows the Dutch
      a person wrote and hides what the stub drafted. Twenty approvals go on
      the record as you make them. Run the loop again, and it asks the
      provider for nothing.

  - id: offered
    kind: terminal
    through: 19
    highlight: { text: [nl, nb] }
    caption: Dutch is offered as translated. Norwegian is approved.
    text: >-
      Dutch is offered now, as translated, because not every block in it is
      approved yet. Approve the rest of Norwegian, and the same file offers it
      as approved. None of this was configured by hand.

  - id: picker
    kind: artifact
    artifact: picker
    caption: What the gate cleared, a reader can choose.
    text: >-
      This is where it lands. The picker offers what the gate cleared, marks
      what is translated but not yet approved, and leaves out what is not
      ready. One file connects the loop and the site.

  - id: outro
    kind: outro
    text: >-
      Have your build read the same file. A language appears the moment a
      person decides it is ready.
