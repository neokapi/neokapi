id: s1-compass-ship-gate
title: Velgeren er porten
subtitle: En gjennomgang om morgenen er grunnen til at et språk tilbys om ettermiddagen.
kind: use-case
publishAs: multilingual-ship-states
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/compass
needsAi: false
# The sandbox IS the Compass sample project, copied from samples/compass so the
# recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/compass
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi store import ./context
captureTimeoutSec: 240
aspects:
  - review moves the edge
  - ship states, not file presence
  - one file the site reads
outro:
  line: La bygget ditt lese én fil.
  pointer: kapi status --ship --emit ship.json

script:
  - comment: Compass ships three languages from one source. Bring them up to date first.
  - command: kapi up
  - comment: Norwegian and German clear the ship gate on translated work. Dutch waits for review, because one of its units fails the project's bound checks.
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json
  - comment: The review queue names each unit's document, block and language, which a decision addresses. This selects the Dutch a person wrote and leaves what the stub drafted.
  - command: >-
      kapi status --review --json --jq '.pending[]|select(.locale=="nl" and (.target|startswith("⟦")|not))|{op:"decide",at:{doc:.relative,block:.key,edition:.locale},if_match:"*",outcome:"establish"}' > dutch.json
  # The report goes to stderr, so the tail has to see stderr to trim it.
  - command: kapi apply dutch.json 2>&1 | tail -3
  - comment: Each approval is in the record as it is made, attributable, and reviewable in the context log.
  - comment: A decision releases the language, so run the loop again. The drafts it already made are recycled, so the provider is asked for nothing a second time.
  - command: kapi up
  - comment: Dutch is offered now, in the translated state, because not every string in it is approved.
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json
  - comment: Establish the rest of Norwegian, and the same file says so.
  - command: >-
      kapi status --review --json --jq '.pending[]|select(.locale=="nb")|{op:"decide",at:{doc:.relative,block:.key,edition:.locale},if_match:"*",outcome:"establish"}' > norwegian.json
  - command: kapi apply norwegian.json 2>&1 | tail -2
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json

artifacts:
  # The page fetches ship.json and a catalog, so it needs a server rather than a
  # file:// load. The default server roots at the sandbox, so the path carries
  # the site/ prefix; settleMs covers the two fetches before the shot.
  - id: picker
    caption: "site/index.html: the picker, built from ship.json"
    source: url
    path: /site/index.html
    port: 4599
    settleMs: 1500
    width: 1200
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      Hvem bestemmer at en leser kan se et språk? Her er språkvelgeren porten, og en gjennomgang om morgenen er grunnen til at et språk tilbys om ettermiddagen.
  - id: parked
    kind: terminal
    through: 5
    highlight: { text: ["waiting for review", withheld] }
    caption: "Nederlandsk er kladdet, bevart og ikke tilbudt."
    text: >-
      Nederlandsk venter på gjennomgang på grunn av en mislykket sjekk. Kladder er trygge i prosjektlageret og ingenting av dem går tapt; det porten holder tilbake er levering, inntil noen har sett på enheten som feilet.
  - id: review
    kind: terminal
    through: 10
    caption: "Tjue beslutninger, på rekorden, og løkken kladder ingenting."
    text: >-
      Køen navngir hva hver beslutning gjelder, og dette filteret beholder det en person skrev på nederlandsk og forkaster det stubben kladdet. Tjue godkjenninger havner i rekorden etter hvert som de gjøres. Å kjøre løkken igjen ber leverandøren om ingenting.
  - id: offered
    kind: terminal
    through: 19
    highlight: { text: [nl, nb] }
    caption: Nederlandsk tilbudt som oversatt. Norsk er godkjent.
    text: >-
      Nederlandsk tilbys nå, i oversatt tilstand, fordi ikke alle strenger i det er godkjent. Godkjenn resten av norsk, og den samme filen tilbyr det som godkjent. Tre språk, to tilstander, og ingen av dem konfigurert for hånd.
  - id: picker
    kind: artifact
    artifact: picker
    caption: Det porten godkjente er det en leser kan velge.
    text: >-
      Og her lander det. Velgeren tilbyr det porten godkjente, markerer det som er oversatt men ikke ennå etablert, og utelater det som ikke er klart. Én fil går mellom løkken og nettstedet.
  - id: outro
    kind: outro
    text: >-
      La bygget ditt lese den samme filen, så dukker et språk opp i det øyeblikket noen beslutter at det er klart.
