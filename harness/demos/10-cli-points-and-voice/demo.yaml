id: 10-cli-points-and-voice
title: Ask a file where it sits
subtitle: Three surfaces, two brands, and one command that answers for any of them.
kind: use-case
publishAs: cli-points-and-voice
# A scripted plain-shell demo: every command is deterministic and offline, so it
# runs for real and its output is recorded exactly.
#
# `fixtures/context/voice.yaml` holds the voice the recipe binds by name, and
# `setup:` reads it into the sandbox's store, which is where every answer and
# the gate come from. The import keeps the voice and moves the file's word
# rules into the project's terms; the forbidden term among them is the one the
# partner page trips.
#
# One `kapi check` run exits 3 on purpose (the failing gate is the
# point of that beat) and declares it with `expectExit: 3`, so a take where the
# gate silently passed would fail the capture instead of shipping.
terminal: shell
brand: kapi
cwd: ~/voltway
needsAi: false
# The sandbox IS the project: a recipe at its root, so every command reads the
# way a user types it. The sandbox lives in os.tmpdir(), outside the repo.
project: true
setup:
  - kapi context import ./context
captureTimeoutSec: 180
aspects:
  - coordinates, not folders
  - the voice in force here
  - one gate over every surface
outro:
  line: Ask a file in your own repository where it sits.
  pointer: kapi context <path>

script:
  - comment: "Voltway sells metering software: operator documentation, console strings, and a portal that ships under a partner's brand."
  - command: ls
  - comment: The brand every collection inherits is a decision, so it is recorded as one rather than typed into the file.
  - command: echo '{"kind":"recipe","op":"set","path":"defaults.coordinates.brand","value":"voltway"}' > coordinates.jsonl
  - command: kapi apply coordinates.jsonl
  - comment: Ask any file where it sits. The documentation answers with the docs channel.
  - command: kapi context docs/quickstart.md --explain
  - comment: The partner page is three directories away, on another brand, and answers with the portal channel.
  - command: kapi context partner/index.md --explain
  - comment: The voice guide for the same path. The path selects the portal's register, so no channel is named.
  - command: kapi voice guide partner/index.md
  - comment: And this is the gate, over every surface, with no flags.
  # The gate must fail here: the forbidden word on the partner page is the beat.
  - command: kapi check
    expectExit: 3
  - comment: One word, corrected at the source.
  - command: ksed -i 's/Our seamless platform/Our unified platform/' partner/index.md
  - command: kapi check

artifacts:
  - id: recipe
    caption: "kapi.yaml: each surface at a point, and one of them on another brand"
    source: report
    report: code
    path: kapi.yaml
    width: 1200
    height: 1000

narration:
  - id: title
    kind: title
    text: >-
      One product ships on three surfaces, one of them under a partner's brand.
      From a terminal, every file can say where it sits and what voice governs
      it there.

  - id: recipe
    kind: artifact
    artifact: recipe
    caption: A point per surface, and one collection on another brand.
    text: >-
      The recipe binds each surface to a point: the product, and the channel it
      ships on. The portal collection moves on one axis only, the brand, and
      keeps the product and the channel it inherits. Nothing declares a folder
      taxonomy beside the content.

  - id: where
    kind: terminal
    through: 9
    highlight: { text: [portal, helios] }
    caption: Two files, three directories apart, two answers.
    text: >-
      Ask the documentation where it sits and it answers with the docs channel.
      Ask the partner page, three directories away, and it answers with the
      portal channel and the Helios brand. The path did not decide either
      answer, the recipe did.

  - id: voice
    kind: terminal
    through: 11
    caption: The portal's register, selected by the path.
    text: >-
      Ask for the voice guide by path and the portal's register comes back
      with no channel named on the command line. The guide holds tone, style
      and examples. The terms are held once for the whole company, which is why
      both answers above listed the same ones.

  - id: gate
    kind: terminal
    through: 16
    highlight: { text: [FAILS, seamless] }
    caption: One word fails the gate, then the same command passes.
    text: >-
      The configured checks read the same voice and terms. One forbidden word on
      the partner page fails the check, the command exits three, and correcting
      the source is enough to make the identical command pass. The result covers
      the configured wording rules; it is not a general judgment of voice or
      factual accuracy.

  - id: outro
    kind: outro
    text: >-
      Run the same question against a file in your own repository, and the
      answer names the point, the voice, and the collection it belongs to.
