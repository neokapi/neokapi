# Voltway: one product, three surfaces, two brands.
#
# The context this recipe binds ships as files under context/, read in with
# `kapi store import ./context`. No server, no provider credential: the gate
# runs from what the import put in the project's store.
version: v1
name: voltway
defaults:
  source_language: en
  target_languages: [fr]
  # Voltway establishes its own source wording; a translation carries whatever
  # the source said, so the source ladder gates the loop as well.
  translate_after: established
  flow: converge
  voice:
    profile: voltway
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"

profiles:
  voltway:
    channels: [docs, app, portal]
    voice:
      profile: voltway

collections:
  # Operator documentation.
  - name: voltway-docs
    channel: voltway/docs
    base: docs
    source_only: true
    content:
      - path: "*.md"

  # Console strings, one block per key, with a French catalog beside them.
  - name: voltway-app
    channel: voltway/app
    base: app
    content:
      - path: strings.en.json
        format:
          name: json
        target: "strings.{lang}.json"

  # The same product, shipped under a partner's brand. This collection moves on
  # the brand axis alone and keeps the product and channel it inherits.
  - name: helios-portal
    channel: voltway/portal
    base: partner
    coordinates:
      brand: helios
    source_only: true
    content:
      - path: index.md

flows:
  # term_rules is the one key the terminology tools all read: one term, what the
  # translation must say for it, and whether a miss fails. A rule marked
  # advisory reports; any other rule fails. The same list is handed to the
  # model that drafts and to the check that holds the draft to it.
  converge:
    steps:
      - tool: recycle
        config:
          fillTarget: true
          fillTargetThreshold: 100
      - tool: translate
        config:
          provider: demo
          skipMatched: true
          term_rules: &term_rules
            - term: billing period
              replacement: période de facturation
              note: The invoice window has one French name, and the console and the documentation both use it
            - term: reading
              replacement: relevé
              advisory: true
              note: Prefer relevé over lecture for a measurement taken from a meter
      - tool: term-check
        config:
          term_rules: *term_rules
