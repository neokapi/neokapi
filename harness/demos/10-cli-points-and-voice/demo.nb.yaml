id: 10-cli-points-and-voice
title: Spør en fil hvor den befinner seg
subtitle: "Tre flater, to merkevarer og én kommando som svarer for dem alle."
kind: use-case
publishAs: cli-points-and-voice
# A scripted plain-shell demo: every command is deterministic and offline, so it
# runs for real and its output is recorded exactly.
#
# `fixtures/context/voice.yaml` holds the voice the recipe binds by name.
# `setup:` imports it into the sandbox's store: the voice stays a voice, and its
# word rules move into the project's terms. The partner page uses the forbidden
# term among them.
#
# One `kapi check` run exits 3 on purpose and declares it with `expectExit: 3`.
# A take where that check passes fails the capture.
terminal: shell
brand: kapi
cwd: ~/voltway
needsAi: false
# The sandbox IS the project: a recipe at its root, so every command reads the
# way a user types it. The sandbox lives in os.tmpdir(), outside the repo.
project: true
setup:
  - kapi store import ./context
captureTimeoutSec: 180
aspects:
  - coordinates, not folders
  - the voice in force here
  - one gate over every surface
outro:
  line: Spør en fil i ditt eget repositorium hvor den befinner seg.
  pointer: kapi context <path>

script:
  - comment: "Voltway sells metering software: operator documentation, console strings, and a portal that ships under a partner's brand."
  - command: ls
  - comment: The brand every collection inherits is a decision, so it is recorded as one rather than typed into the file.
  - command: echo '{"op":"recipe","path":"defaults.coordinates.brand","value":"voltway"}' > coordinates.jsonl
  - command: kapi apply coordinates.jsonl
  - comment: Ask any file where it sits. The documentation answers with the docs channel.
  - command: kapi context docs/quickstart.md --explain
  - comment: The partner page is three directories away, on another brand, and answers with the portal channel.
  - command: kapi context partner/index.md --explain
  - comment: What a writer reads for the same path. The path selects the portal's register, so no channel is named.
  - command: kapi context partner/index.md
  - comment: And this is the gate, over every surface, with no flags.
  # The gate must fail here: the forbidden word on the partner page is the beat.
  - command: kapi check
    expectExit: 3
  - comment: One word, corrected at the source.
  - command: ksed -i 's/Our seamless platform/Our unified platform/' partner/index.md
  - command: kapi check

artifacts:
  - id: recipe
    caption: "kapi.yaml: each surface at a point, and one of them on another brand"
    source: report
    report: code
    path: kapi.yaml
    width: 1200
    height: 1000

narration:
  - id: title
    kind: title
    text: >-
      Ett produkt leveres på tre flater, én av dem under en partners merkevare. Fra en terminal kan enhver fil si hvor den befinner seg og hvilken stemprofil som gjelder der.
  - id: recipe
    kind: artifact
    artifact: recipe
    caption: "Ett punkt per flate, og én samling under en annen merkevare."
    text: >-
      Oppskriften knytter hver flate til et punkt: produktet og kanalen det leveres på. Portalsamlingen beveger seg langs én akse alene – merkevaren – og beholder produktet og kanalen den arver. Ingenting deklarerer en mappetaksonomi ved siden av innholdet.
  - id: where
    kind: terminal
    through: 9
    highlight: { text: [portal, helios] }
    caption: "To filer, tre kataloger fra hverandre, to svar."
    text: >-
      Spør dokumentasjonen hvor den befinner seg, og den svarer med docs-kanalen. Spør partnersiden, tre kataloger unna, og den svarer med portalkanalen og Helios-merkevaren. Banen avgjorde ingen av svarene – det gjorde oppskriften.
  - id: voice
    kind: terminal
    through: 11
    caption: "Portalens register, valgt ut fra banen."
    text: >-
      Spør hva som gjelder for partnersiden, og portalens register returneres uten at noen kanal er angitt på kommandolinjen. Svaret inneholder tonen, stilen og eksemplene. Termene lagres én gang for hele selskapet, og det er derfor begge svarene ovenfor viste de samme termene.
  - id: gate
    kind: terminal
    through: 16
    highlight: { text: [FAILS, seamless] }
    caption: "Ett ord feiler sjekken, så passerer den samme kommandoen."
    text: >-
      De konfigurerte sjekkene leser den samme stemprofilen og de samme termene. Ett forbudt ord på partnersiden feiler sjekken, kommandoen avsluttes med kode tre, og det er nok å rette kilden for at den identiske kommandoen skal bestå. Resultatet dekker de konfigurerte ordlydreglene; det er ikke en generell vurdering av stemme eller faktanøyaktighet.
  - id: outro
    kind: outro
    text: >-
      Kjør det samme spørsmålet mot en fil i ditt eget repositorium, og svaret navngir punktet, stemprofilen og samlingen den tilhører.
