id: kapi-desktop-config
title: Settings and API keys
subtitle: Add a provider key, choose the appearance, and see your plugins.
kind: use-case
publishAs: kapi-desktop-config
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Appearance
  - API keys
  - Plugins
outro:
  line: Add your key once, in App Settings.

narration:
  - id: title
    kind: title
    text: >-
      You'll add an API key and look at the other app settings.

  - id: open-settings
    kind: desktop
    beat: open-settings
    caption: Open the app settings.
    text: >-
      On the Open screen, click Settings.

  - id: general
    kind: desktop
    beat: general
    crop: { x: 0.03, y: 0.04, w: 0.4, h: 0.3 }
    caption: Light, dark, or the same as your system.
    text: >-
      On General, choose Light, Dark or System, and the app language.

  - id: credentials
    kind: desktop
    beat: credentials
    crop: { x: 0.38, y: 0.36, w: 0.24, h: 0.28 }
    caption: Your key is stored in the keychain.
    text: >-
      On AI Models, click Add Credentials, choose a model, and paste your API
      key. The key is stored in your Mac's keychain, apart from your project
      files.

  - id: plugins
    kind: desktop
    beat: plugins
    crop: { x: 0.03, y: 0.04, w: 0.95, h: 0.3 }
    caption: Plugins add file formats and tools.
    text: >-
      Plugins lists what is installed. A plugin adds file formats or tools.
      Open the Available tab to install one.

  - id: outro
    kind: outro
    text: >-
      Add your key once. Every project on this Mac uses it.
