id: kapi-desktop-config
title: Settings and API keys
subtitle: Add a provider key, choose the appearance, and see your plugins.
kind: use-case
publishAs: kapi-desktop-config
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Appearance
  - AI models
  - API keys in the keychain
  - Plugins
outro:
  line: Add your key once. The command line uses it too.
  pointer: kapi credentials add

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop keeps your provider keys in the system keychain, and your
      kapi.yaml file never contains a key. This video shows where you add a
      key, and the other app settings.

  - id: open-settings
    kind: desktop
    beat: open-settings
    caption: Open the app settings.
    text: >-
      On the Open screen, click Settings. The app settings have tabs for
      General, AI Models, Plugins, Formats and Languages.

  - id: general
    kind: desktop
    beat: general
    crop: { x: 0.03, y: 0.04, w: 0.4, h: 0.3 }
    caption: Light, dark, or the same as your system.
    text: >-
      On General, choose System, Light or Dark. You can also change the
      language of the app.

  - id: credentials
    kind: desktop
    beat: credentials
    caption: Your API key is saved in the keychain.
    crop: { x: 0.38, y: 0.36, w: 0.24, h: 0.28 }
    text: >-
      On AI Models, click Add Credentials for a provider. Enter a name, a
      model and your API key. When you click Save, the key goes into the
      keychain. kapi.yaml stores only the name of the credential.

  - id: plugins
    kind: desktop
    beat: plugins
    crop: { x: 0.03, y: 0.04, w: 0.95, h: 0.3 }
    caption: Plugins add file formats and tools.
    text: >-
      Plugins lists the plugins you have installed. A plugin adds more file
      formats or tools. Open the Available tab to install one.

  - id: outro
    kind: outro
    text: >-
      Add a key once in the app. kapi on the command line uses the same key,
      because both read the same keychain.
