id: kapi-desktop-config
title: The key never reaches the recipe
subtitle: Provider keys go to the operating system keychain, not into what you commit.
kind: use-case
publishAs: kapi-desktop-config
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Appearance
  - AI providers
  - Plugins
  - Keychain-backed keys
outro:
  line: Add the key once; both surfaces use it.
  pointer: kapi credentials add

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop puts a provider key in the operating system keychain, so the
      recipe you commit never carries one. Settings is where the key is added,
      and where plugins and appearance live too.

  - id: open-settings
    kind: desktop
    beat: open-settings
    caption: Appearance, models, plugins and locales, in one place.
    text: >-
      Settings gathers appearance, the AI models a project can translate with,
      plugins, and the languages the interface itself can run in.

  - id: general
    kind: desktop
    beat: general
    caption: Follows the system, or pinned either way.
    text: >-
      Appearance follows your system by default, or you can pin light or dark.
      The interface can also run in a pseudo-language, which is how you test
      that a screen survives longer words.

  - id: credentials
    kind: desktop
    beat: credentials
    caption: The key is typed here, and stored by the keychain.
    crop: { selector: '[role="dialog"]' }
    zoom: 1.2
    text: >-
      AI Models lists the providers and the models under each. Adding
      credentials asks for a name, a model and the key, and the key goes to the
      operating system keychain. The recipe records which credential to use, and
      never the secret itself.

  - id: plugins
    kind: desktop
    beat: plugins
    caption: Plugins add formats, connectors and tools.
    text: >-
      Plugins extend what the project can read and run, adding formats,
      connectors and tools beyond the built-in set.

  - id: outro
    kind: outro
    text: >-
      Add a key once here and the command line in the same folder uses the same
      one, because both read the same keychain.
