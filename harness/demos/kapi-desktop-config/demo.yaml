id: kapi-desktop-config
title: The keychain holds the key
subtitle: A recipe records which credential to use, and the secret stays out of it.
kind: use-case
publishAs: kapi-desktop-config
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Appearance
  - AI providers
  - Plugins
  - Keychain-backed keys
outro:
  line: Add the key once; both surfaces use it.
  pointer: kapi credentials add

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop stores a provider key in your operating system keychain, so
      the recipe you commit never contains one. Settings is where you add the
      key, and where plugins and appearance live.

  - id: open-settings
    kind: desktop
    beat: open-settings
    caption: Appearance, models, plugins and locales.
    text: >-
      Settings has appearance, the AI models a project can translate with,
      plugins, and the languages the interface itself can run in.

  - id: general
    kind: desktop
    beat: general
    caption: Follow the system, or pin light or dark.
    text: >-
      Appearance follows your system, or you pin light or dark. You can also
      run the interface in a pseudo-language, to check that a screen survives
      longer words.

  - id: credentials
    kind: desktop
    beat: credentials
    caption: Type the key here. The keychain stores it.
    crop: { selector: '[role="dialog"]' }
    text: >-
      AI Models lists the providers and their models. Add credentials with a
      name, a model and the key. The key goes to the keychain, and the recipe
      records only which credential to use.

  - id: plugins
    kind: desktop
    beat: plugins
    caption: Plugins add formats, connectors and tools.
    text: >-
      Plugins extend what the project can read and run: formats, connectors
      and tools beyond the built-in set.

  - id: outro
    kind: outro
    text: >-
      Add a key once. The command line in the same folder uses the same key,
      from the same keychain.
