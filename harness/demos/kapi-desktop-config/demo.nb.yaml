id: kapi-desktop-config
title: Konfigurer Kapi Desktop
subtitle: "Utseende, AI-leverandører og plugins — på ett sted."
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-config
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Appearance
  - AI providers
  - Plugins
  - Keychain-backed keys

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop holder all konfigurasjon på ett sted.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Fra startskjermen åpner tannhjulet nederst Innstillinger.
  - id: open-settings
    kind: desktop
    beat: open-settings
    caption: "Innstillinger — utseende, legitimasjon, programtillegg, lokaliteter."
    text: >-
      Innstillinger samler utseende, AI-legitimasjon, plugins og språk under ett tak.
  - id: general
    kind: desktop
    beat: general
    caption: "Utseende følger systemet, eller fest lyst eller mørkt."
    text: >-
      Utseende følger systemet ditt, eller du kan feste lyst eller mørkt. Selve grensesnittet kan til og med kjøre i pseudo-engelsk for språktesting.
  - id: credentials
    kind: desktop
    beat: credentials
    caption: AI-legitimasjon — nøkler lagres i OS-nøkkelringen.
    text: >-
      AI-legitimasjon inneholder leverandørene Kapi oversetter med — Anthropic, OpenAI, Gemini. Nøklene lagres i operativsystemets nøkkelring, aldri på disk.
  - id: plugins
    kind: desktop
    beat: plugins
    caption: Programtillegg utvider tilgjengelige formater og verktøy.
    text: >-
      Og plugins utvider Kapi — ved å legge til formater, koblinger og verktøy utover det innebygde settet.
  - id: outro
    kind: outro
    text: >-
      Utseende, leverandører, programtillegg — konfigurert én gang, brukt overalt.
