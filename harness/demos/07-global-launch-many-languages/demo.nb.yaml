id: 07-global-launch-many-languages
title: Se regningen før du bruker den
subtitle: "Fire språk, én kjøring, og en plan som kjører uten kall til en leverandør."
kind: zero-to-hero
aspects:
  - multi-locale
  - CJK / non-Latin
  - placeholders preserved
needsAi: true
model: sonnet
captureTimeoutSec: 360
# The sandbox IS the project: a recipe at its root naming the four target
# languages, so the commands read the way a user types them. The sandbox lives
# in os.tmpdir(), outside the repo.
project: true
outro:
  line: Les planen før du kjører passet.
  pointer: kapi up --plan

# Both legs are stated as instructions in one message, in order, with the
# go-ahead in it. A headless `claude -p` session gets no second turn, so a
# request that reads as a checkpoint ends the take on "Shall I proceed?" (#2576):
# the plan is presented, nobody answers, and the artifact stage finds no
# catalogs to spotlight.
prompt: >
  We're launching our notes app in more markets. The recipe already lists German,
  Spanish, French and Japanese. Do both of these, in order, without stopping to ask:
  first show me the plan for the pending work, then bring the project up to date so
  each language has a catalog beside src/en.json.

artifacts:
  - id: plan
    caption: "kapi up --plan: the pending work, before anything runs"
    source: command
    # The plan runs on the committed fixtures, because on the post-run snapshot
    # it is empty. `from: fixture` runs it in a copy under the system temp
    # directory. A dry run still opens a project store, and a recording must
    # write nothing into a tracked tree. Artifact commands run with project
    # discovery off, so the command names the recipe.
    command: d=$(mktemp -d) && cp -R . "$d" && cd "$d" && kapi up --plan --json -p kapi.yaml
    from: fixture
    report: json
    reportTitle: "kapi up --plan --json"
    reportSub: "units, memory leverage and an estimate per locale, computed locally"
    width: 1120
    height: 760
  - id: ja
    caption: "src/ja.json: Japanese, placeholders intact"
    source: report
    report: catalog
    reportTitle: "src/ja.json (日本語)"
    reportSub: "kapi · {{name}} and {{price}} preserved"
    path: src/ja.json
    width: 1120
    height: 720
  - id: status
    caption: "kapi status: four locales, after one pass"
    source: command
    command: kapi status -p kapi.yaml --json
    report: json
    reportTitle: "kapi status --json"
    reportSub: "per locale: how much is there, and how far it has come"
    width: 1120
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      Fire målspråk fra én engelsk fil er ett prosjekt å holde oppdatert, og planen viser hva det vil koste før noe er brukt.
  - id: plan
    kind: artifact
    artifact: plan
    caption: "Hva som er utestående, per lokasjon, før en leverandør kalles."
    text: >-
      Dette er forhåndsvisningen. Per lokasjon: enheter uten mål ennå, hvor mange av dem prosjektets eget innholdsminne kan svare på, og et estimat for resten. Den beregnes på denne maskinen, så det koster ingenting å lese den.
  - id: work
    kind: terminal
    caption: "Én kjøring, fire lokasjoner, nøkler og plassholdere bevart."
    text: >-
      Én kjøring samler alle fire. kapi leser filen som en katalog, så hver nøkkel og hver interpolasjonsplassholder er struktur den bærer – ikke tekst en modell kan skrive om.
  - id: ja
    kind: artifact
    artifact: ja
    caption: "Japansk, med plassholderne der koden forventer dem."
    text: >-
      Her er japansk. Grensesnitteksten er på et ikke-latinsk skrift, navn- og prisplassholderne sitter nøyaktig der koden leser dem, og filen er fortsatt gyldig JSON.
  - id: status
    kind: artifact
    artifact: status
    caption: "Fire lokasjoner, én linje hver."
    text: >-
      Og dette er hvor prosjektet står etterpå. Én linje per lokasjon, og å legge til et femte marked senere er én linje til i oppskriften – ikke et femte jobb å planlegge.
  - id: outro
    kind: outro
    text: >-
      Kjør planen mot ditt eget prosjekt først. Den leser det utestående arbeidet uten å kalle en leverandør, så antallet er klart før regningen kommer.
