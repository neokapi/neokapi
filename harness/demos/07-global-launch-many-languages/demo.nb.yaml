id: 07-global-launch-many-languages
title: Oversett appstrenger til fire språk
subtitle: "Én kildefil, fire målspråk, inkludert ett ikke-latinsk skript."
kind: zero-to-hero
aspects:
  - multi-locale
  - CJK / non-Latin
  - placeholders preserved
needsAi: true
model: sonnet
captureTimeoutSec: 360

prompt: >
  We're launching our notes app in more markets. Can you translate our app strings,
  src/en.json, into German, Spanish, French and Japanese? Save each one next to it as
  src/de.json, src/es.json, src/fr.json and src/ja.json.

artifacts:
  - id: ja
    caption: "src/ja.json — Japanese, placeholders intact"
    source: report
    report: catalog
    reportTitle: "src/ja.json — 日本語"
    reportSub: "kapi · {{name}} and {{price}} preserved"
    path: src/ja.json
    width: 1120
    height: 720
  - id: de
    caption: "src/de.json — German, same keys"
    source: report
    report: catalog
    reportTitle: "src/de.json — Deutsch"
    reportSub: "kapi · keys and placeholders intact"
    path: src/de.json
    width: 1120
    height: 720

narration:
  - id: title
    kind: title
    text: >
      Fire målspråk fra én engelsk fil, ett av dem med ikke-latinsk skript. I et kapi-prosjekt er dette én avstemming, ikke fire oversettingsjobber.
  - id: prompt
    kind: prompt
    text: >
      Forespørselen lister opp språkene og hvor hver fil skal plasseres. Den sier ikke hvordan — ferdigheten setter de fire lokalene som prosjektmål og lar kapi avstemme dem.
  - id: work
    kind: terminal
    text: >
      kapi up --plan forhåndsviser først det ventende arbeidet — enhetene, innholds­minne­utnyttelsen og et token-estimat — før noe brukes. Deretter konvergerer én kapi up-kjøring alle fire lokaliteter samtidig. Fordi kapi parser JSON-en, bæres hver nøkkel og hver interpolasjonsplassholder gjennom; bare verdiene endres.
    caption: "kapi up --plan forhåndsviser arbeidet; én up-kjøring konvergerer alle fire lokaliteter"
  - id: ja
    kind: artifact
    artifact: ja
    text: >
      Den japanske katalogen. Grensesnitt­teksten er oversatt, og plassholderne for navnet og prisen sitter nøyaktig der koden forventer dem. Filen er fortsatt gyldig JSON.
  - id: de
    kind: artifact
    artifact: de
    text: >
      Og tysk, med sine lengre sammensatte ord, fra samme gjennomgang. Samme nøkler, samme plassholdere. Å legge til et marked senere er bare én ekstra mållokalitet i oppskriften.
  - id: outro
    kind: outro
    text: >
      Den engelske kildeteksten forblir nøkkelen i alle filer, slik at koden leses likt uavhengig av hvilket språk som er lastet inn.
