id: 07-global-launch-many-languages
title: See the bill before you spend it
subtitle: Four languages, one pass, and a plan that runs with no provider calls.
kind: zero-to-hero
aspects:
  - multi-locale
  - CJK / non-Latin
  - placeholders preserved
needsAi: true
model: sonnet
captureTimeoutSec: 360
# The sandbox IS the project: a recipe at its root naming the four target
# languages, so the commands read the way a user types them. The sandbox lives
# in os.tmpdir(), outside the repo.
project: true
outro:
  line: Read the plan before you run the pass.
  pointer: kapi up --plan

# Both legs are stated as instructions in one message, in order, with the
# go-ahead in it. A headless `claude -p` session gets no second turn, so a
# request that reads as a checkpoint ends the take on "Shall I proceed?" (#2576):
# the plan is presented, nobody answers, and the artifact stage finds no
# catalogs to spotlight.
prompt: >
  We're launching our notes app in more markets. The recipe already lists German,
  Spanish, French and Japanese. Do both of these, in order, without stopping to ask:
  first show me the plan for the pending work, then bring the project up to date so
  each language has a catalog beside src/en.json.

artifacts:
  - id: plan
    caption: "kapi up --plan: the pending work, before anything runs"
    source: command
    # The pristine tree: on the post-run snapshot the plan is empty, because the
    # run it previews has already happened. `from: fixture` puts the command's
    # cwd in the COMMITTED fixtures directory, so the plan is read in a copy
    # made under the system temp directory: a dry run still opens a project
    # store, and nothing a recording does may land in a tracked tree. Artifact
    # commands run under the harness's kapi isolation, which turns recipe
    # discovery off, so the recipe is named rather than walked to.
    command: d=$(mktemp -d) && cp -R . "$d" && cd "$d" && kapi up --plan --json -p kapi.yaml
    from: fixture
    report: json
    reportTitle: "kapi up --plan --json"
    reportSub: "units, memory leverage and an estimate per locale, computed locally"
    width: 1120
    height: 760
  - id: ja
    caption: "src/ja.json: Japanese, placeholders intact"
    source: report
    report: catalog
    reportTitle: "src/ja.json (日本語)"
    reportSub: "kapi · {{name}} and {{price}} preserved"
    path: src/ja.json
    width: 1120
    height: 720
  - id: status
    caption: "kapi status: four locales, after one pass"
    source: command
    command: kapi status -p kapi.yaml --json
    report: json
    reportTitle: "kapi status --json"
    reportSub: "per locale: how much is there, and how far it has come"
    width: 1120
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      Four target languages from one English file is one project to bring up to
      date, and the plan shows what it will cost before anything is spent.

  - id: plan
    kind: artifact
    artifact: plan
    caption: What is pending, per locale, before a provider is called.
    text: >-
      This is the preview. Per locale, the units with no target yet, how many of
      them the project's own memory can answer, and an estimate for the rest. It
      is computed on this machine, so reading it costs nothing.

  - id: work
    kind: terminal
    caption: One pass, four locales, keys and placeholders carried.
    text: >-
      Then one pass converges all four together. kapi parses the file as a
      catalog, so every key and every interpolation placeholder is structure it
      carries rather than text a model can rewrite.

  - id: ja
    kind: artifact
    artifact: ja
    caption: Japanese, with the placeholders where the code expects them.
    text: >-
      Here is the Japanese. The interface text is in a non-Latin script, the
      name and price placeholders sit exactly where the code reads them, and the
      file is still valid JSON.

  - id: status
    kind: artifact
    artifact: status
    caption: Four locales, one line each.
    text: >-
      And this is where the project stands afterwards. One line per locale, and
      adding a fifth market later is one more entry in the recipe rather than a
      fifth job to schedule.

  - id: outro
    kind: outro
    text: >-
      Run the plan on your own project first. It reads the pending work without
      calling a provider, so the number arrives before the bill does.
