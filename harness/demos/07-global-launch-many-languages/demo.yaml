id: 07-global-launch-many-languages
title: Translate app strings into four languages
subtitle: One source file, four target languages, including a non-Latin script.
kind: zero-to-hero
aspects:
  - multi-locale
  - CJK / non-Latin
  - placeholders preserved
needsAi: true
model: sonnet
captureTimeoutSec: 360
# The sandbox IS the project: a recipe at its root naming the four target
# languages, so the commands read the way a user types them. The sandbox lives
# in os.tmpdir(), outside the repo.
project: true

prompt: >
  We're launching our notes app in more markets. The recipe already lists German,
  Spanish, French and Japanese. Can you bring the project up to date so each language
  has a catalog beside src/en.json? Show me the plan before you spend anything.

artifacts:
  - id: ja
    caption: "src/ja.json: Japanese, placeholders intact"
    source: report
    report: catalog
    reportTitle: "src/ja.json (日本語)"
    reportSub: "kapi · {{name}} and {{price}} preserved"
    path: src/ja.json
    width: 1120
    height: 720
  - id: de
    caption: "src/de.json: German, same keys"
    source: report
    report: catalog
    reportTitle: "src/de.json (Deutsch)"
    reportSub: "kapi · keys and placeholders intact"
    path: src/de.json
    width: 1120
    height: 720

narration:
  - id: title
    kind: title
    text: >
      Four target languages from one English file, one of them in a non-Latin script. In a
      kapi project this is one reconciliation, not four translation jobs.
  - id: prompt
    kind: prompt
    text: >
      The request names the outcome and asks to see the plan first. The four target
      languages are already in the recipe, so there is one project to bring up to date
      rather than four translation jobs to run.
  - id: work
    kind: terminal
    text: >
      kapi up --plan previews the pending work first: the units missing a target, the exact
      content-memory leverage, and a rough token estimate per locale, computed locally with no
      provider calls. Then one kapi up pass converges all four locales together. Because kapi
      parses the JSON, every key and every interpolation placeholder is carried through; only
      the values change.
    caption: "kapi up --plan previews the work; one up pass converges all four locales"
  - id: ja
    kind: artifact
    artifact: ja
    text: >
      The Japanese catalog. The interface text is translated, and the placeholders for the
      name and the price sit exactly where the code expects them. The file is still valid JSON.
  - id: de
    kind: artifact
    artifact: de
    text: >
      And German, with its longer compound words, from the same pass. Same keys, same
      placeholders. Adding a market later is one more target locale in the recipe.
  - id: outro
    kind: outro
    text: >
      The source English text stays the key in every file, so the code reads the same
      whichever language is loaded.
