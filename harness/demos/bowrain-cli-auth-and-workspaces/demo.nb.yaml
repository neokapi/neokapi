id: bowrain-cli-auth-and-workspaces
title: Fremkall layoutfeil før en oversetter ser dem
subtitle: "Pseudooversett lokalt, og sjekk deretter hvor innholdet havner."
tagline: the bowrain plugin handles the server; kapi handles the files.
kind: use-case
publishAs: bowrain-cli-auth-and-workspaces
terminal: shell
brand: bowrain
cwd: ~/bowmart/help-center
needsAi: false
captureTimeoutSec: 180
outro:
  line: Logg inn hvis det første svaret er tomt.
  pointer: kapi auth login
aspects:
  - Pseudo-translate before you send
  - Server and account at a glance
  - Every workspace you can push to

script:
  - comment: Before sending anything for real translation, pseudo-translate locally.
  - command: kapi pseudo-translate src/locales/en.json
  - comment: Padded, accented copy (qps) surfaces truncation and layout bugs early.
  - command: cat src/locales/en_qps.json
  - comment: Which server and account is this checkout connected to?
  - command: kapi auth status
  - comment: List the workspaces you can push projects to.
  - command: kapi workspace list

narration:
  - id: title
    kind: title
    text: >-
      Tre spørsmål du kan få svar på i terminalen fra en tilkoblet utsjekking: Er innholdet mitt klart? Hvilken server og konto er utsjekkingen koblet til? Hvor kan jeg pushe?
  - id: pseudo
    kind: terminal
    through: 4
    caption: "Engelsk med utfylling og aksenttegn, fortsatt lesbar."
    hold: 20
    text: >-
      Pseudooversetting skriver om katalogen til tekst med utfylling og aksenttegn. Hver streng blir lengre, slik den også gjør ved en faktisk oversettelse. Aksenttegnene gjør det lett å se strenger som ikke er oversatt. Dermed ser du avkortet tekst og layoutfeil på din egen skjerm, i stedet for i en fil du allerede har betalt en oversetter for å fylle ut.
  - id: auth
    kind: terminal
    through: 6
    caption: Serveren og kontoen denne utsjekkingen er koblet til.
    hold: 12
    text: >-
      kapi auth status viser serveren og kontoen denne utsjekkingen er koblet til. Det er nyttig når du arbeider med mer enn én Bowrain-server.
  - id: workspace
    kind: terminal
    through: 8
    caption: Hvor et prosjekt kan pushes.
    hold: 17
    text: >-
      kapi workspace list viser alle arbeidsområdene du kan pushe et prosjekt til. Hvert arbeidsområde har egne prosjekter, eget innholdsminne og egne termer. Dermed kan du sjekke hvor du kan pushe, før du velger feil arbeidsområde.
  - id: outro
    kind: outro
    text: >-
      Logg inn hvis det første svaret er tomt.
