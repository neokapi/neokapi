id: bowrain-cli-auth-and-workspaces
title: Break the layout before a translator sees it
subtitle: Pseudo-translate locally, then check where the content goes.
tagline: the bowrain plugin handles the server; kapi handles the files.
kind: use-case
publishAs: bowrain-cli-auth-and-workspaces
terminal: shell
brand: bowrain
cwd: ~/bowmart/help-center
needsAi: false
captureTimeoutSec: 180
outro:
  line: Sign in if the first answer is empty.
  pointer: kapi auth login
aspects:
  - Pseudo-translate before you send
  - Server and account at a glance
  - Every workspace you can push to

script:
  - comment: Before sending anything for real translation, pseudo-translate locally.
  - command: kapi pseudo-translate src/locales/en.json
  - comment: Padded, accented copy (qps) surfaces truncation and layout bugs early.
  - command: cat src/locales/en_qps.json
  - comment: Which server and account is this checkout connected to?
  - command: kapi auth status
  - comment: List the workspaces you can push projects to.
  - command: kapi workspace list

narration:
  - id: title
    kind: title
    text: >-
      Three questions a connected checkout answers from the terminal: is my
      content ready, which server and account is this, and where can I push.

  - id: pseudo
    kind: terminal
    through: 4
    caption: Padded, accented, and still readable English.
    hold: 16
    text: >-
      Pseudo-translate rewrites the catalogue as padded, accented copy. Every
      string grows the way a real translation does, and the accents make an
      untranslated string obvious, so truncation and broken layout show up on
      your own screen rather than in a file a translator has already been paid
      to fill in.

  - id: auth
    kind: terminal
    through: 6
    caption: The server and account this checkout uses.
    hold: 12
    text: >-
      kapi auth status names the server and the account this checkout is
      connected to, which starts to matter the moment you work across more than
      one Bowrain server.

  - id: workspace
    kind: terminal
    through: 8
    caption: Where a project can be pushed.
    hold: 13
    text: >-
      kapi workspace list shows every workspace you can push a project into.
      Each keeps its own projects, its own content memory and its own terms, so
      pushing to the wrong one is a question the CLI answers before you do it.

  - id: outro
    kind: outro
    text: >-
      Sign in if the first of those answers comes back empty.
