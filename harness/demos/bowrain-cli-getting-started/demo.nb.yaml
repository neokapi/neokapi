id: bowrain-cli-getting-started
title: Innholdet ditt ligger i repositoryet ditt
subtitle: "init kobler det til, push flytter det, up kjører løkken."
tagline: your files stay yours, and the server adds the team, the memory and the governance.
kind: use-case
publishAs: bowrain-cli-getting-started
# A scripted plain-shell demo (no Claude): the bowrain CLI runs for real against
# a live server (seeded by `make harness-seed`), so the commands and their output
# are recorded exactly as a developer would see them.
terminal: shell
brand: bowrain
cwd: ~/bowmart/help-center
needsAi: false
captureTimeoutSec: 180
outro:
  line: "I CI, de samme to kommandoene."
  pointer: kapi push && kapi up
aspects:
  - init connects the project
  - push is pure transport
  - up runs the loop on the server
  - results land in the same files

script:
  - comment: BowMart's help-center copy, in English, sitting in your repo.
  - command: cat src/locales/en.json
  - comment: Connect this project to your Bowrain server.
  - command: kapi init --name help-center --source-locale en --target-locale fr --target-locale de --server $BOWRAIN_SERVER_URL -y
  - comment: Track the files you want translated.
  - command: kapi add "src/locales/*.json"
  - comment: Push the source up. Pure transport, like git push.
  - command: kapi push
  - comment: Check standing, the coverage and what's pending, like git status.
  - command: kapi status
  - comment: Catch the project up. kapi up runs the loop on the server and pulls the results back.
  - command: kapi up
  - comment: The French catalog, in the file and format you started with.
  - command: cat src/locales/fr.json

narration:
  - id: title
    kind: title
    text: >-
      Innholdet ditt ligger i repositoryet ditt. kapi init kobler det til et Bowrain-arbeidsområde, og serveren legger til teamet, delt memory og porter.
  - id: push
    kind: terminal
    through: 8
    caption: Push flytter kilden og oversetter ingenting.
    hold: 16
    text: >-
      Spor filene du vil ha oversatt, og push deretter. Push er ren transport: det flytter kilden opp slik git push gjør, og oversetter ingenting. Ingenting har forlatt repositoryet ditt bortsett fra en kopi av engelsk.
  - id: status
    kind: terminal
    through: 10
    highlight: { text: [content, governance] }
    caption: "To akser: innhold og styring."
    hold: 19
    text: >-
      kapi status leser statusen på to akser. Innholdslinjen teller hva som venter på å flyttes i hver retning. Styringslinjen viser om termene og beslutningene dette prosjektet observerte fortsatt er de samme som serveren holder, noe som er den halvdelen som går stille galt.
  - id: up
    kind: terminal
    through: 12
    highlight: venue
    caption: "Stedet først, deretter arbeidet."
    hold: 20
    text: >-
      kapi up kjører løkken og skriver først ut stedet: server, fordi oppskriften deklarerer én. Arbeidet skjer på Bowrain-serveren med teamets nøkler, delt memory og porter, i rekkefølgen memory, deretter AI, deretter kontroller, og fremdriften strømmer tilbake til terminalen din.
  - id: pulled
    kind: terminal
    through: 14
    caption: Tilbake i samme fil og format.
    hold: 14
    text: >-
      Resultatene kommer tilbake til filene og formatet du startet med. Her er den franske katalogen ved siden av den engelske den kom fra, og det som trenger en person, er parkert til gjennomgang.
  - id: outro
    kind: outro
    text: >-
      I CI gjør de samme to kommandoene hele jobben.
