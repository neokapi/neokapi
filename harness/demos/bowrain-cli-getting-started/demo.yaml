id: bowrain-cli-getting-started
title: Your content stays in your repository
subtitle: init connects it, push moves it, up runs the loop.
tagline: your files stay yours, and the server adds the team, the memory and the governance.
kind: use-case
publishAs: bowrain-cli-getting-started
# A scripted plain-shell demo (no Claude): the bowrain CLI runs for real against
# a live server (seeded by `make harness-seed`), so the commands and their output
# are recorded exactly as a developer would see them.
terminal: shell
brand: bowrain
cwd: ~/bowmart/help-center
needsAi: false
captureTimeoutSec: 180
outro:
  line: In CI, the same two commands.
  pointer: kapi push && kapi up
aspects:
  - init connects the project
  - push is pure transport
  - up runs the loop on the server
  - results land in the same files

script:
  - comment: BowMart's help-center copy, in English, sitting in your repo.
  - command: cat src/locales/en.json
  - comment: Connect this project to your Bowrain server.
  - command: kapi init --name help-center --source-locale en --target-locale fr --target-locale de --server $BOWRAIN_SERVER_URL -y
  - comment: Track the files you want translated.
  - command: kapi add "src/locales/*.json"
  - comment: Push the source up. Pure transport, like git push.
  - command: kapi push
  - comment: Check standing, the coverage and what's pending, like git status.
  - command: kapi status
  - comment: Catch the project up. kapi up runs the loop on the server and pulls the results back.
  - command: kapi up
  - comment: The French catalog, in the file and format you started with.
  - command: cat src/locales/fr.json

narration:
  - id: title
    kind: title
    text: >-
      Your content stays in your repository. kapi init connects it to a Bowrain
      workspace, and the server adds the team, the shared memory and the gates.

  - id: push
    kind: terminal
    through: 8
    caption: Push moves the source, and translates nothing.
    hold: 16
    text: >-
      Track the files you want translated, then push. Push is pure transport: it
      moves the source up the way git push does, and it translates nothing at
      all. Nothing has left your repository except a copy of the English.

  - id: status
    kind: terminal
    through: 10
    highlight: { text: [content, governance] }
    caption: Two axes, content and governance.
    hold: 19
    text: >-
      kapi status reads the standing on two axes. The content line counts what
      is waiting to move in each direction. The governance line says whether the
      terms and decisions this project observed are still the ones the server
      holds, which is the half that goes wrong quietly.

  - id: up
    kind: terminal
    through: 12
    highlight: venue
    caption: The venue first, then the work.
    hold: 20
    text: >-
      kapi up runs the loop, and it prints its venue first: server, because the
      recipe declares one. The work happens on the Bowrain server with the
      team's keys, shared memory and gates, in the order memory, then AI, then
      checks, and the progress streams back into your terminal.

  - id: pulled
    kind: terminal
    through: 14
    caption: Back in the same file and format.
    hold: 14
    text: >-
      The results come back into the files and the format you started with. Here
      is the French catalog beside the English it came from, and whatever needs
      a person is parked for review.

  - id: outro
    kind: outro
    text: >-
      In CI, the same two commands do the whole of it.
