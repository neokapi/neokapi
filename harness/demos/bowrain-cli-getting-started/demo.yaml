id: bowrain-cli-getting-started
title: Connect a project and bring it up to date
subtitle: kapi init connects your local files to a Bowrain server; push and pull move content like git, and kapi up runs the loop on the server.
tagline: your files stay yours — the server adds the team, the memory, and the governance.
kind: use-case
publishAs: bowrain-cli-getting-started
# A scripted plain-shell demo (no Claude): the bowrain CLI runs for real against
# a live server (seeded by `make harness-seed`), so the commands and their output
# are recorded exactly as a developer would see them.
terminal: shell
brand: bowrain
cwd: ~/bowmart/help-center
needsAi: false
captureTimeoutSec: 180
aspects:
  - kapi init · push · up
  - your files, the team's server
  - push/pull like git
  - the loop, run on the server

script:
  - comment: BowMart's help-center copy — English, sitting in your repo.
  - command: cat src/locales/en.json
  - comment: Connect this project to your Bowrain server.
  - command: kapi init --name help-center --source en --targets fr,de --server $BOWRAIN_SERVER_URL -y
  - comment: Track the files you want translated.
  - command: kapi add "src/locales/*.json"
  - comment: Push the source up — pure transport, like git push.
  - command: kapi push
  - comment: Check standing — coverage and what's pending, like git status.
  - command: kapi status
  - comment: Catch the project up — kapi up runs the loop on the server and pulls the results back.
  - command: kapi up

narration:
  - id: title
    kind: title
    text: >
      Bowrain is the server-side companion to kapi. Your content stays in your
      repository; the server adds a team, shared translation memory, and
      governance over time. Connecting a project to it takes a single command.
  - id: init
    kind: terminal
    text: >
      Here is BowMart's help-center copy — a few English strings in a JSON file.
      kapi init scaffolds the project and creates it in your workspace on the
      Bowrain server, with the source and target languages set.
    caption: "kapi init — connect the project to Bowrain"
  - id: push
    kind: terminal
    text: >
      Track the files you want translated, then push. Push is pure transport — it
      moves the source up to the server, like git push; it does not translate on
      its own. kapi status then shows the standing: the per-locale coverage grid,
      plus the server line, the terms line, and the venue line — which server this
      project belongs to, what the org's terms require, and where the loop will
      run.
    caption: "kapi push — source up to the server"
  - id: up
    kind: terminal
    text: >
      kapi up runs the loop, and it prints its venue first: server, because the
      recipe declares one. Everything behind catches up on the Bowrain server,
      with the team's keys, shared memory, and gates — memory first, then AI,
      then checks — and it streams the progress back into your terminal, pulling
      the results into the same files and format you started with. Anything that
      needs a person is parked for review. Before spending anything, kapi up
      --plan previews the pending work and its cost. This is the command your CI
      runs.
    caption: "kapi up — run the loop on the server"
  - id: outro
    kind: outro
