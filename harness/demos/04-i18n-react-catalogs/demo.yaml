id: 04-i18n-react-catalogs
title: Two more languages in the folder you already have
subtitle: A react-i18next catalog gains French and German, placeholders intact.
kind: framework
aspects:
  - i18n setup
  - react-i18next
  - placeholders & plurals
needsAi: true
model: sonnet
captureTimeoutSec: 360
outro:
  line: Point kapi at the catalog you already have.
  pointer: kapi translate --target-lang fr

prompt: >
  This is a React app that uses react-i18next, with its English strings in
  public/locales/en/translation.json. Can you add French and German?

artifacts:
  - id: fr
    caption: "public/locales/fr/translation.json"
    source: report
    report: catalog
    reportTitle: "public/locales/fr/translation.json"
    reportSub: "kapi · placeholders and plural keys preserved"
    path: public/locales/fr/translation.json
    width: 1120
    height: 720
  - id: checks
    caption: "kapi check over the French catalog"
    source: command
    command: kapi check public/locales/en/translation.json --target public/locales/fr/translation.json --target-lang fr --json
    report: json
    reportTitle: "kapi check --json"
    reportSub: "every placeholder and plural key, read against the English"
    width: 1120
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      Most apps already own a catalog folder. The work is filling it without
      breaking a placeholder or a plural, and that is the part a checker can
      answer for you.

  - id: preflight
    kind: terminal
    caption: The pre-flight answers whether the English is ready.
    highlight: pseudo
    text: >-
      Claude runs a pseudo-translation first. It expands every English string
      and reorders nothing else, so a placeholder the catalog spells wrongly or
      a plural key the framework will not accept shows up here, before a
      provider is paid for anything.

  - id: translate
    kind: terminal
    caption: French and German, from the format kapi read.
    text: >-
      Then the translation runs for both languages. kapi reads the file as an
      i18next catalog rather than as JSON, so the interpolation placeholders and
      the plural suffixes are structure it carries rather than text it can
      rewrite.

  - id: fr
    kind: artifact
    artifact: fr
    caption: The keys are the English text. Nothing in the code moves.
    text: >-
      Here is the French. The name and count placeholders sit where the code
      expects them, the plural keys are complete, and the key of every entry is
      still the English sentence.

  - id: checks
    kind: artifact
    artifact: checks
    caption: Placeholders and plurals, verified against the source.
    text: >-
      And this is the check that says so, run over the pair. It reads the French
      against the English and reports on every placeholder and every plural
      form, which is the answer you want before a release rather than after one.

  - id: outro
    kind: outro
    text: >-
      Run the same command against the catalog your app already ships, and add
      the next language the same way.
