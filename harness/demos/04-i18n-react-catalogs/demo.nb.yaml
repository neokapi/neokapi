id: 04-i18n-react-catalogs
title: To nye språk i mappen du allerede har
subtitle: "En react-i18next-katalog får fransk og tysk, med plassholderne intakte."
kind: framework
aspects:
  - i18n setup
  - react-i18next
  - placeholders & plurals
needsAi: true
model: sonnet
captureTimeoutSec: 360
outro:
  line: Gi kapi katalogen du allerede har.
  pointer: kapi translate --target-lang fr

# The English catalog is a fixture, so the prompt's claim about it is true and
# the run is the same every time: the placeholders and the plural keys the
# checks beat reads are the ones committed here, not ones a model invented.
prompt: >
  This is a React app that uses react-i18next, with its English strings in
  public/locales/en/translation.json. Can you add French and German?

artifacts:
  - id: fr
    caption: "public/locales/fr/translation.json"
    source: report
    report: catalog
    reportTitle: "public/locales/fr/translation.json"
    reportSub: "kapi · placeholders and plural keys preserved"
    path: public/locales/fr/translation.json
    width: 1120
    height: 720
  - id: checks
    caption: "kapi check over the French catalog"
    source: command
    command: kapi check public/locales/en/translation.json --target public/locales/fr/translation.json --target-lang fr --json
    report: json
    reportTitle: "kapi check --json"
    reportSub: "every placeholder and plural key, read against the English"
    width: 1120
    height: 760

narration:
  - id: title
    kind: title
    text: >-
      De fleste apper har allerede en katalogmappe. Jobben er å fylle den uten å ødelegge plassholdere eller flertallsformer. Det kan en kontroll avdekke.
  - id: preflight
    kind: terminal
    caption: Forhåndskontrollen viser om den engelske teksten er klar.
    highlight: pseudo
    text: >-
      Claude kjører først en pseudooversettelse. Den utvider hver engelske streng uten å endre rekkefølgen på noe annet. Dermed oppdages feilskrevne plassholdere i katalogen og flertallsnøkler som rammeverket ikke godtar, før du betaler en leverandør.
  - id: translate
    kind: terminal
    caption: "Fransk og tysk, i formatet kapi leste."
    text: >-
      Deretter kjøres oversettelsen for begge språkene. kapi leser filen som en i18next-katalog, ikke som JSON. Dermed behandles interpolasjonsplassholdere og flertallssuffikser som struktur som bevares, ikke som tekst som kan omskrives.
  - id: fr
    kind: artifact
    artifact: fr
    caption: Nøklene er den engelske teksten. Ingenting i koden flyttes.
    text: >-
      Her er den franske teksten. Plassholderne for navn og antall står der koden forventer dem, flertallsnøklene er komplette, og nøkkelen for hver oppføring er fortsatt den engelske setningen.
  - id: checks
    kind: artifact
    artifact: checks
    caption: Plassholdere og flertallsformer er kontrollert mot kildeteksten.
    text: >-
      Her er kontrollen som bekrefter dette, kjørt på språkparet. Den sammenligner den franske teksten med den engelske og rapporterer om hver plassholder og flertallsform. Da får du svaret før en utgivelse, ikke etterpå.
  - id: outro
    kind: outro
    text: >-
      Kjør samme kommando på katalogen som allerede følger med appen, og legg til neste språk på samme måte.
