id: 04-i18n-react-catalogs
title: Legg til fransk og tysk i en React-app
subtitle: Et eksisterende react-i18next-prosjekt og en forespørsel om to flere språk.
kind: rammeverk
aspects:
  - i18n-oppsett
  - react-i18next
  - plassholdere og flertall
needsAi: true
model: sonnet
captureTimeoutSec: 360

prompt: >
  Dette er en React-app som bruker react-i18next, med engelske strenger i public/locales/en/translation.json. Kan du legge til fransk og tysk?
artifacts:
  - id: fr
    caption: "public/locales/fr/translation.json"
    source: rapport
    report: katalog
    reportTitle: "public/locales/fr/translation.json"
    reportSub: "kapi · plassholdere og flertallsnøkler bevart"
    path: public/locales/fr/translation.json
    width: 1120
    height: 720
  - id: de
    caption: "public/locales/de/translation.json"
    source: rapport
    report: katalog
    reportTitle: "public/locales/de/translation.json"
    reportSub: "kapi · samme katalog, på tysk"
    path: public/locales/de/translation.json
    width: 1120
    height: 720

narration:
  - id: tittel
    kind: tittel
    text: >
      De fleste apper har allerede et i18n-oppsett — meldingskataloger i en mappe, klare til å fylles ut. Denne bruker react-i18next og trenger to nye språk.
  - id: prompt
    kind: prompt
    text: >
      Forespørselen navngir rammeverket og peker på den engelske katalogen. Den sier ikke hvor de franske og tyske filene skal plasseres, eller hvordan plassholderne skal holdes intakte.
  - id: arbeid
    kind: terminal
    text: >
      Claude sjekker hvordan kapi forventer at react-i18next-kataloger skal være strukturert, kjører en pseudooversettelsesrunde for å bekrefte at den engelske filen er klar, og kjører deretter kapi translate for fransk og tysk. Fordi kapi forstår i18next-formatet, overføres interpolasjonsplassholderne og flertallsnøklene uendret — og de innebygde kontrollene bekrefter at de overlevde.
    caption: "Claude bekrefter strukturen, sjekker beredskap, og oversetter deretter fr og de"
  - id: fr
    kind: artefakt
    artifact: fr
    text: >
      Den franske katalogen. Navn- og antall-plassholderne sitter der koden forventer dem, flertallsnøklene er intakte, og verdiene er oversatt.
  - id: de
    kind: artefakt
    artifact: de
    text: >
      Og tysk, fra samme kjøring. Å legge til et nytt språk er den samme forespørselen igjen; den engelske kildeteksten forblir nøkkelen, så ingenting annet i koden trenger å flyttes.
  - id: outro
    kind: outro
    text: >
      Ingen nytt rammeverk og ingen meldings-IDer. kapi leser og skriver katalogformatet prosjektet allerede bruker.
