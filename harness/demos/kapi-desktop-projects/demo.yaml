id: kapi-desktop-projects
title: Create and manage a project
subtitle: Set up a localisation project in Kapi Desktop.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-projects
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Projects
  - Source & target languages
  - Content patterns
  - Project settings

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop — let's create and set up a localisation project.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      It opens to a home screen. A new project starts right here.

  - id: new-project
    kind: desktop
    beat: new-project
    caption: New Project asks only for a name.
    text: >-
      New Project asks only for a name — here, the Acme Help Center. Kapi
      derives the folder and the rest from it.

  - id: templates
    kind: desktop
    beat: templates
    caption: Or start from the KapiMart sample.
    text: >-
      Or start from KapiMart — a ready-made sample project with content
      collections, target languages, and a stocked content memory.

  - id: project-home
    kind: desktop
    beat: project-home
    caption: The project opens to its collections and ship standing.
    text: >-
      The project opens to one surface: its content collections, and each
      locale's ladder toward the ship gate — drafted, translated, reviewed,
      ready.

  - id: project-settings
    kind: desktop
    beat: project-settings
    caption: "Project Settings: languages, plugins, processing."
    text: >-
      Project Settings is where you choose the source language and the locales
      you're translating into, alongside plugins and processing options.

  - id: content
    kind: desktop
    beat: content
    caption: Each collection defines which files belong to the project.
    text: >-
      Each collection defines which files belong to the project — glob patterns
      the engine reads from and writes back to. Bring up to date is the
      project's one main action: it runs the default flow, pass after pass,
      until every gated scope ships or parks what needs a person.

  - id: outro
    kind: outro
    text: >-
      That's a project — created, structured, and one click from up to date.
