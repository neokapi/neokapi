id: kapi-desktop-projects
title: A recipe written for you
subtitle: Name a project, give it a language, point it at content, and read the plan.
kind: use-case
publishAs: kapi-desktop-projects
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Projects
  - Source & target languages
  - Content patterns
  - The catch-up plan
outro:
  line: Create one, add a language, read the plan.
  pointer: kapi up --plan

narration:
  - id: title
    kind: title
    text: >-
      A kapi project is a recipe beside your files, and Kapi Desktop writes it
      for you. Name it, give it a language, point it at content, and see what
      one click would do.

  - id: new-project
    kind: desktop
    beat: new-project
    caption: Created, and governing nothing yet.
    text: >-
      A new project asks for a name and a structure, and nothing else. What it
      opens on is the standing, which at this point is empty: no target
      language, no content read, nothing to be behind on.

  - id: add-language
    kind: desktop
    beat: add-language
    caption: One language added, and the ladder appears.
    zoom: 1.4
    text: >-
      Project Settings is where the source language and the languages you
      translate into are declared. Adding French writes one line into the
      recipe, and the home gains a ladder for it.

  - id: add-collection
    kind: desktop
    beat: add-collection
    caption: A name and one glob, counted as you type.
    crop: { selector: ['[data-slot="code-input"]', '[data-testid="pattern-match-count"]'] }
    zoom: 1.2
    text: >-
      A collection is a name and the patterns that define it. The editor counts
      what each pattern matched while you type it, so a glob that finds nothing
      says so before you save it rather than after a run.

  - id: plan
    kind: desktop
    beat: plan
    caption: A dry run. Nothing written, no provider called.
    crop: { selector: '[data-slot="converge-plan-dialog"]' }
    zoom: 1.1
    hold: 10
    text: >-
      On a project that already has content, the plan reads what is pending
      before anything runs. Units with no target, what the project's own memory
      can answer, and an estimate for the rest, all computed on this machine.

  - id: outro
    kind: outro
    text: >-
      Create a project, declare a language and a pattern, then read the plan
      before you press the one button that does the work.
