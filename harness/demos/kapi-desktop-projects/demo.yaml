id: kapi-desktop-projects
title: Set up a project
subtitle: Open a folder, add a language, choose where translations go, and see what needs translating.
kind: use-case
publishAs: kapi-desktop-projects
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - A folder becomes a project
  - Languages
  - Where translations go
  - The plan
outro:
  line: Click Bring up to date to translate the new text.

# The folder holds a few help pages, made off camera. The app proposes a
# collection for them when the folder opens, and the walk gives it a target
# path, so the plan has work to show on the same project.
narration:
  - id: title
    kind: title
    text: >-
      You'll open a folder of help pages as a project and add French as a
      language.

  - id: new-project
    kind: desktop
    beat: new-project
    caption: Drop a folder to open it as a project.
    text: >-
      Drop the folder on the Open screen. The app finds the three help pages
      and shows the next steps.

  - id: add-language
    kind: desktop
    beat: add-language
    caption: Add French.
    text: >-
      Open Project Settings. Under Translate into, pick French, and click Save
      Changes.

  - id: add-collection
    kind: desktop
    beat: add-collection
    caption: Choose where the translations go.
    text: >-
      On the Content tab, edit the collection the app found, enter a folder
      for the translations, and click Save Changes.

  - id: plan
    kind: desktop
    beat: plan
    caption: See the work before it runs.
    hold: 10
    text: >-
      Back on the Overview, click Plan to see how much text has no French
      translation yet. Click Bring up to date when you want to translate it.

  - id: outro
    kind: outro
    text: >-
      Click Bring up to date to translate the new text.
