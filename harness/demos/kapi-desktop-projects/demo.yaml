id: kapi-desktop-projects
title: A recipe written for you
subtitle: Open a folder, give it a language, point it at content, and read the plan.
kind: use-case
publishAs: kapi-desktop-projects
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Projects
  - Languages + and the first target language
  - Content patterns
  - The catch-up plan
outro:
  line: Open a folder, add a language, read the plan.
  pointer: kapi up --plan

narration:
  - id: title
    kind: title
    text: >-
      A kapi project is a recipe file beside your content, and Kapi Desktop
      writes it for you. Open a folder, add a language, point it at your
      content, and read what one click would do.

  - id: new-project
    kind: desktop
    beat: new-project
    caption: An empty folder, opened.
    text: >-
      A project starts from a folder. Drop one on the Open screen. An empty
      folder opens on its Map, which offers to set the project up, and a
      template gives it a structure. After that there is nothing to do yet: no
      target language, no content read, nothing behind.

  - id: add-language
    kind: desktop
    beat: add-language
    caption: Languages +, then Review.
    text: >-
      Until the project has a target language, the rail shows Languages with a
      plus. Click it to pick one. Choosing French adds it, and saving writes
      one line into the recipe beside your files. The plus goes away, and
      Review appears next to it.

  - id: add-collection
    kind: desktop
    beat: add-collection
    caption: A name and a pattern, counted as you type.
    crop: { selector: ['[data-slot="code-input"]', '[data-testid="pattern-match-count"]'] }
    text: >-
      A collection is a name and the patterns that select its files. As you
      type a pattern, the editor counts what it matches, so a pattern that
      finds nothing tells you before you save it.

  - id: plan
    kind: desktop
    beat: plan
    caption: "A dry run: nothing written, no provider called."
    crop: { x: 0.38, y: 0.05, w: 0.24, h: 0.3 }
    hold: 10
    text: >-
      On a project with content, the plan shows what is pending before
      anything runs: blocks with no translation, what the project's own
      content memory can fill, and an estimate for the rest. All of it is
      computed on your machine.

  - id: outro
    kind: outro
    text: >-
      Open a folder, add a language and a pattern, then read the plan before
      you press the button that does the work.
