id: kapi-desktop-projects
title: Opprett og administrer et prosjekt
subtitle: Sett opp et flerspråklig innholdsprosjekt i Kapi Desktop.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-projects
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Projects
  - Source & target languages
  - Content patterns
  - Project settings

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop — la oss opprette og sette opp et flerspråklig innholdsprosjekt.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Det åpnes til en startskjerm. Et nytt prosjekt starter her.
  - id: new-project
    kind: desktop
    beat: new-project
    caption: Nytt prosjekt krever bare et navn.
    text: >-
      Nytt prosjekt krever bare et navn — her, Acme Help Center. Kapi utleder mappen og resten fra det.
  - id: templates
    kind: desktop
    beat: templates
    caption: Eller start fra KapiMart-eksempelet.
    text: >-
      Eller start fra KapiMart — et ferdiglaget eksempelprosjekt med innholdssamlinger, målspråk og et fylt innholdsminne.
  - id: project-home
    kind: desktop
    beat: project-home
    caption: Prosjektet åpnes til samlingene og skipets status.
    text: >-
      Prosjektet åpnes til én flate: innholdssamlingene, og hver lokals stige mot leveringsporten — utkast, oversatt, gjennomgått, klar.
  - id: project-settings
    kind: desktop
    beat: project-settings
    caption: "Prosjektinnstillinger: språk, programtillegg, behandling."
    text: >-
      Prosjektinnstillinger er der du velger kildespråket og lokalitetene du oversetter til, sammen med programtillegg og behandlingsalternativer.
  - id: content
    kind: desktop
    beat: content
    caption: Hver samling definerer hvilke filer som tilhører prosjektet.
    text: >-
      Hver samling definerer hvilke filer som tilhører prosjektet — glob-mønstre som motoren leser fra og skriver tilbake til. Oppdater er prosjektets ene hovedhandling: den kjører standard-flyten, runde etter runde, til alle portlagte omfang leveres eller parkeres for den som trenger et menneske.
  - id: outro
    kind: outro
    text: >-
      Det er et prosjekt — opprettet, strukturert og ett klikk unna å være oppdatert.
