id: kapi-cli-first-project
title: Your first project, from the terminal
subtitle: Set up a project, choose your rules, fix the text that breaks them, and share the rules.
kind: use-case
publishAs: kapi-cli-first-project
# The CLI half of "Your first project" (web/docs/kapi/get-started/first-project.mdx),
# step for step. Every command is deterministic and offline, and nothing calls
# a model. The last line of each `kapi look` names the next step, so the looks
# walk the guide's order.
#
# `kapi rules` runs in a pseudo-terminal (`keys:`), so it asks as it does for a
# person, and the two answers are typed at its prompts. The `kapi check` with
# `expectExit: 3` is the kept rule failing on camera; a take where it passed
# fails the capture.
terminal: shell
brand: kapi
cwd: ~/acme-docs
needsAi: false
# The sandbox is the folder; kapi init writes the recipe on camera, and every
# command after it finds the project by walking up.
project: true
captureTimeoutSec: 240
aspects:
  - one project, start to finish
  - the next step on every look
  - rules Claude Code follows
outro:
  line: Try it in a folder of your own.
  pointer: kapi init

# A repository with a remote, so `kapi share --via git` has somewhere to push.
# The remote is a bare repository inside the sandbox, kept out of the tree.
setup:
  - git init -q
  - git config user.email docs@acme.example
  - git config user.name Acme
  - git init -q --bare .origin.git
  - echo .origin.git >> .git/info/exclude
  - git remote add origin "$PWD/.origin.git"
  - git add -A
  - git commit -qm "Acme help center"
  - git push -q origin HEAD

script:
  - comment: A folder of help-center docs, with a README and five pages.
  - command: ls README.md docs
  - comment: Set up the project and Claude Code.
  - command: kapi init
  - comment: See a summary of the project.
  - command: kapi look
  - comment: Press k to keep each suggestion.
  - command: kapi rules
    keys: [k, k]
  - comment: See the rules for the guide.
  - command: kapi context docs/guide.md
  - command: kapi look
  # The kept rule must fail here: this is the beat.
  - command: kapi check docs/guide.md
    expectExit: 3
  - comment: Fix the text that breaks a rule.
  - command: kapi fix
  - command: kapi look
  - comment: Claude Code is already set up.
  - command: kapi connect
  - comment: Commit, then share the rules through git.
  - command: git add -A && git commit -qm "Add kapi"
  - command: kapi share --via git
  - command: kapi look

narration:
  - id: title
    kind: title
    text: >-
      This is a folder of help-center docs. In this video you set up kapi,
      choose your writing rules, fix the text that breaks them, and share the
      rules with your team.

  - id: init
    kind: terminal
    through: 4
    highlight: { text: [collections, CLAUDE.md] }
    caption: Set up the project.
    text: >-
      Type kapi init. It lists the files kapi will read and saves the project
      in kapi.yaml. It also sets up Claude Code, so Claude reads your rules
      from CLAUDE.md.

  - id: look
    kind: terminal
    through: 6
    highlight: { text: ["kapi suggests 2", "Decide with"] }
    caption: See the project and two suggested rules.
    text: >-
      Type kapi look to see a summary. There are six files and no rules yet.
      There are two suggestions, based on how the files are already written:
      write email, not e-mail, and call the reader you. The last line tells you
      what to do next.

  - id: decide
    kind: terminal
    through: 8
    highlight: { text: ["Which one do your files use?", "Kept 2"] }
    caption: Keep the rules you want.
    text: >-
      Type kapi rules. For each suggestion, you see where it was found and
      what happens if you keep it. Press k to keep the first one, and k again
      for the second. You now have two rules.

  - id: reads
    kind: terminal
    through: 10
    highlight: { text: ["Say this, not that"] }
    caption: See the rules for a file.
    text: >-
      Type kapi context with a file name to see the rules for that file.
      Claude Code sees the same rules in CLAUDE.md.

  - id: check
    kind: terminal
    through: 12
    highlight: { text: [FAILS, "Fix what fails"] }
    caption: Find the text that breaks a rule.
    text: >-
      Type kapi look again. The next step is to fix what fails. kapi check
      shows e-mail twice in the guide. It ends with an error, so you can use
      the same command in CI to stop a change that breaks a rule.

  - id: fix
    kind: terminal
    through: 15
    highlight: { text: ["2 fixed", "Share the rules"] }
    caption: Fix the text.
    text: >-
      Type kapi fix. It changes e-mail to email in both places and leaves the
      rest of the file as it was. The next step is to share the rules.

  - id: connect
    kind: terminal
    through: 17
    highlight: { text: [kept] }
    caption: Claude Code is already set up.
    text: >-
      Claude Code is already set up, so kapi connect changes nothing. To add
      another assistant, such as Cursor, type kapi connect cursor.

  - id: share
    kind: terminal
    through: 21
    highlight: { text: ["With your team", "Check with"] }
    caption: Share the rules through git.
    text: >-
      Commit the new files, then type kapi share with git. Everyone who pulls
      the repository gets the same rules. Now kapi look only asks you to run
      kapi check after each change.

  - id: outro
    kind: outro
    text: >-
      Try it in a folder of your own. Type kapi init, then follow the last
      line of kapi look.
