id: 06-multi-format-publishing
title: Two formats, one request, no conversion step
subtitle: Markdown and a properties file, each written back as what it was.
kind: use-case
aspects:
  - format-aware
  - Markdown round-trip
  - .properties round-trip
needsAi: true
model: sonnet
captureTimeoutSec: 320
outro:
  line: Try it on the odd format in your repo.
  pointer: kapi formats

prompt: >
  We need French versions of two files: our getting-started guide README.md, and our UI
  strings messages.properties. Can you translate both into French, keeping each in its own
  format? Save them as README.fr.md and messages.fr.properties.

artifacts:
  - id: md-before
    caption: "README.md: the English guide, rendered"
    source: report
    report: markdown
    reportTitle: "README.md (English)"
    path: README.md
    width: 1100
    height: 820
  - id: md-after
    caption: "README.fr.md: same headings, lists and quote, in French"
    source: report
    report: markdown
    reportTitle: "README.fr.md (Français)"
    path: README.fr.md
    width: 1100
    height: 820
  - id: props
    caption: "messages.fr.properties: keys preserved, values translated"
    source: report
    report: catalog
    reportTitle: "messages.fr.properties"
    reportSub: "kapi · Java properties round-trip"
    path: messages.fr.properties
    width: 1100
    height: 700

narration:
  - id: title
    kind: title
    text: >-
      One request, two files, two formats. kapi reads Markdown and Java
      properties as what they are, translates only the text a reader sees, and
      writes each back in its own format.

  - id: md-before
    kind: artifact
    artifact: md-before
    caption: Headings, a list, a blockquote. All of it syntax.
    text: >-
      Here is the English guide. Around the sentences are headings, a list and a
      blockquote, and a translator working on the raw file has to step over
      every one of them.

  - id: markdown
    kind: terminal
    caption: Prose out, French back, the syntax untouched.
    text: >-
      kapi parses the file as Markdown. The prose goes to the provider as prose,
      the emphasis and the link targets travel with it as structure, and what
      comes back is written as Markdown again.

  - id: md-after
    kind: artifact
    artifact: md-after
    caption: The same document, in French.
    text: >-
      The French guide renders as the English one did. Same heading levels, same
      list, same blockquote, and the code sample in the middle of it is still
      the code sample.

  - id: props
    kind: artifact
    artifact: props
    caption: Keys on the left. Only the right-hand side moved.
    text: >-
      The properties file went through the same run and came back as a
      properties file. Every key on the left of the equals sign is the key the
      code looks up, and only the message on the right was translated.

  - id: outro
    kind: outro
    text: >-
      Ask kapi what it reads, then run the same request against the format in
      your repository that nothing else will open.
