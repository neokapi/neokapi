id: 06-multi-format-publishing
title: "To formater, én forespørsel, ingen konvertering"
subtitle: "Markdown og en properties-fil, begge skrevet tilbake i sitt opprinnelige format."
kind: use-case
aspects:
  - format-aware
  - Markdown round-trip
  - .properties round-trip
needsAi: true
model: sonnet
captureTimeoutSec: 320
outro:
  line: Prøv det på et uvanlig format i repoet ditt.
  pointer: kapi formats

prompt: >
  We need French versions of two files: our getting-started guide README.md, and our UI
  strings messages.properties. Can you translate both into French, keeping each in its own
  format? Save them as README.fr.md and messages.fr.properties.

artifacts:
  - id: md-before
    caption: "README.md: the English guide, rendered"
    source: report
    report: markdown
    reportTitle: "README.md (English)"
    path: README.md
    width: 1100
    height: 820
  - id: md-after
    caption: "README.fr.md: same headings, lists and quote, in French"
    source: report
    report: markdown
    reportTitle: "README.fr.md (Français)"
    path: README.fr.md
    width: 1100
    height: 820
  - id: props
    caption: "messages.fr.properties: keys preserved, values translated"
    source: report
    report: catalog
    reportTitle: "messages.fr.properties"
    reportSub: "kapi · Java properties round-trip"
    path: messages.fr.properties
    width: 1100
    height: 700

narration:
  - id: title
    kind: title
    text: >-
      Én forespørsel, to filer, to formater. kapi leser Markdown og Java properties i sine egne formater, oversetter bare teksten som er synlig for leseren, og skriver hver fil tilbake i sitt eget format.
  - id: md-before
    kind: artifact
    artifact: md-before
    caption: "Overskrifter, en liste og et blokksitat. Alt er syntaks."
    text: >-
      Her er den engelske veiledningen. Setningene er omgitt av overskrifter, en liste og et blokksitat. En oversetter som arbeider direkte i filen, må ta hensyn til all denne syntaksen.
  - id: markdown
    kind: terminal
    caption: "Tekst ut, fransk tilbake, syntaksen uendret."
    text: >-
      kapi parser filen som Markdown. Teksten sendes til leverandøren som tekst, mens utheving og lenkemål følger med som struktur. Resultatet skrives tilbake som Markdown.
  - id: md-after
    kind: artifact
    artifact: md-after
    caption: "Det samme dokumentet, på fransk."
    text: >-
      Den franske veiledningen vises på samme måte som den engelske. Den har de samme overskriftsnivåene, den samme listen og det samme blokksitatet. Kodeeksempelet i midten er fortsatt et kodeeksempel.
  - id: props
    kind: artifact
    artifact: props
    caption: Nøkler til venstre. Bare høyresiden ble oversatt.
    text: >-
      Properties-filen gikk gjennom samme kjøring og ble skrevet tilbake som en properties-fil. Hver nøkkel til venstre for likhetstegnet er en nøkkel som koden slår opp. Bare meldingen til høyre ble oversatt.
  - id: outro
    kind: outro
    text: >-
      Spør kapi hvilke formater det kan lese. Kjør deretter den samme forespørselen mot formatet i repoet ditt som ingenting annet kan åpne.
