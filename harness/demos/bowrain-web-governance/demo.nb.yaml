id: bowrain-web-governance
title: En avtalt term bør ikke diskuteres to ganger
subtitle: "Ett konsept, formuleringen per språk, tilgjengelig der du skriver."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-governance
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: "Push et prosjekt, så ankommer termene her."
  pointer: kapi push
aspects:
  - Concepts, with a status per language
  - Shared content memory
  - The agreed wording, beside the block

narration:
  - id: title
    kind: title
    text: >-
      En term som bestemmes én gang på en bærbar PC, må bestemmes på nytt på den neste. Bowrain lagrer teamets termer på serveren i stedet.
  - id: concept
    kind: desktop
    beat: concept
    caption: "Ett konsept, ett avtalt ord per språk."
    hold: 17
    crop:
      selector:
        - '[data-testid="concept-header"]'
        - '[data-slot="concept-languages"]'
    highlight: { selector: '[data-testid="concept-header"]' }
    text: >-
      Dette er ett konsept: selve ideen, hva teamet kaller det på hvert språk, og hvilken status hvert av disse ordene har. Det er posten to oversettere ellers ville argumentert for fra hukommelsen – og ingen av det ligger i noen sitt lokale utsjekk.
  - id: tm-search
    kind: desktop
    beat: tm-search
    caption: "Den samme formuleringen, allerede registrert."
    hold: 14
    crop:
      selector:
        - '[data-slot="memory-search"]'
        - '[data-slot="memory-pair"]'
    text: >-
      Arbeidsområdets innholdsminne svarer for setningene teamet allerede har godkjent. Søk i det, og hvert prosjekt i arbeidsområdet bruker de samme svarene i stedet for å betale for å oversette dem på nytt.
  - id: in-the-editor
    kind: desktop
    beat: in-the-editor
    caption: "Gjeldende termer, ved siden av blokken."
    hold: 21
    crop:
      selector:
        - '[data-testid="term-sidebar"]'
        - '[data-testid="visual-editor-card"]'
    highlight: { selector: '[data-testid="term-sidebar"]' }
    text: >-
      Og dette er grunnen til at begge hører hjemme på en server. Åpne en fil i Translate, så ligger termene som gjelder for denne blokken ved siden av redigeringskortet – med innholdsminnetreff for den – før noen har skrevet et ord. Avgjørelsen følger arbeidet i stedet for å vente på å bli slått opp.
  - id: outro
    kind: outro
    text: >-
      Push et prosjekt, så ankommer termene og avgjørelsene her for teamet.
