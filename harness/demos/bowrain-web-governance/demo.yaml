id: bowrain-web-governance
title: Shared terminology and memory
subtitle: One governed source of voice, terms, and translations for a team.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-governance
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
aspects:
  - Shared content memory
  - Terminology as concepts
  - Multi-locale terms
  - Stewarded across a team

narration:
  - id: title
    kind: title
    text: >-
      Bowrain is where a team's terms and content memory live, shared and
      governed.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      With kapi, the terms and the content memory are local files one builder
      owns. Bowrain holds them on the server, shared across everyone.

  - id: open-memory
    kind: desktop
    beat: open-memory
    caption: The workspace content memory.
    text: >-
      The content memory keeps every approved translation, available to every
      project and every translator in the workspace.

  - id: tm-list
    kind: desktop
    beat: tm-list
    caption: One memory, reused across projects.
    text: >-
      Each entry pairs a source string with its translations, so the same wording
      is reused instead of being retranslated.

  - id: tm-search
    kind: desktop
    beat: tm-search
    caption: Full-text search across the memory.
    text: >-
      It is searchable in an instant. Here, every remembered string about the
      company's mission.

  - id: open-concepts
    kind: desktop
    beat: open-concepts
    caption: Context, then Concepts, for governed terminology.
    text: >-
      Terms are governed the same way, in the Context hub, as concepts. The
      ideas behind the words, held in one place rather than scattered across
      checkouts.

  - id: concept-list
    kind: desktop
    beat: concept-list
    caption: Concepts, with terms and status per locale.
    text: >-
      Each concept lists what the team calls it in every locale, with a status
      that marks the wording the team has agreed on.

  - id: concept-detail
    kind: desktop
    beat: concept-detail
    caption: One concept, one truth, every language.
    text: >-
      Open a concept and its whole story is here: its terms across every
      language and their agreed status. One truth, shared by every editor,
      every AI call, and every run of the loop.

  - id: outro
    kind: outro
    text: >-
      Shared, versioned and governed. The memory and the concepts a team
      stewards over time, on top of the open kapi tools.
