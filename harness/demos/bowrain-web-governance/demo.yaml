id: bowrain-web-governance
title: A term agreed once should not be argued twice
subtitle: One concept, its wording per language, read where you type.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-web-governance
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Push a project, and its terms arrive here.
  pointer: kapi push
aspects:
  - Concepts, with a status per language
  - Shared content memory
  - The agreed wording, beside the block

narration:
  - id: title
    kind: title
    text: >-
      A term decided once on a laptop is decided again on the next one. Bowrain
      holds a team's terms on the server instead.

  - id: concept
    kind: desktop
    beat: concept
    caption: One concept, one agreed word per language.
    hold: 17
    crop:
      selector:
        - '[data-testid="concept-header"]'
        - '[data-slot="concept-geography"]'
    highlight: { selector: '[data-testid="concept-header"]' }
    text: >-
      This is one concept: the idea itself, what the team calls it in each
      language, and the status each of those words carries. It is the record two
      translators would otherwise argue from memory, and none of it lives in
      anybody's checkout.

  - id: tm-search
    kind: desktop
    beat: tm-search
    caption: The same wording, already on record.
    hold: 14
    crop: { selector: '[data-testid="tm-browser"]' }
    text: >-
      The workspace content memory answers for the sentences the team has
      already approved. Search it, and every project in the workspace draws on
      the same answers instead of paying to translate them a second time.

  - id: in-the-editor
    kind: desktop
    beat: in-the-editor
    caption: The terms in force, beside the block.
    hold: 21
    crop:
      selector:
        - '[data-testid="term-sidebar"]'
        - '[data-testid="visual-editor-card"]'
    highlight: { selector: '[data-testid="term-sidebar"]' }
    text: >-
      And this is why either one belongs on a server. Open a file in Translate,
      and the terms that govern this block sit beside the editing card with the
      memory matches for it, before anyone has typed a word. The decision
      travels to the work rather than waiting to be looked up.

  - id: outro
    kind: outro
    text: >-
      Push a project, and its terms and its decisions arrive here for the team.
