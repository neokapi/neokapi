id: 02-nextjs-zero-to-i18n
title: Fra null til japansk — i18n en Next.js-app med kapi
subtitle: "En fungerende engelsk Next.js-app. Claude kobler opp neokapi-i18n og leverer den på japansk — samme grensesnitt, oversatt."
kind: rammeverk
publishAs: claude-app-i18n
aspects:
  - i18n-oppsett
  - neokapi-i18n
  - pseudo-oversett
  - flerspråklig
needsAi: true
model: sonett
captureTimeoutSec: 480

# A complete English app with base deps installed, but neokapi-i18n is NOT installed
# or wired — Claude adopts it. @neokapi/i18n-react is served from a local registry
# (.npmrc routes @neokapi → http://localhost:4873; run `npm run setup` to publish it),
# so `npm install -D @neokapi/i18n-react` works cleanly (React stays a single peer copy).
setup:
  - npm install --no-audit --no-fund --loglevel=error

prompt: >
  Vi skal ta Lumen Notes til Japan. Kan du sette opp i18n med neokapi-i18n og legge til en japansk oversettelse?
artifacts:
  - id: engelsk
    caption: "Appen i dag — engelsk"
    source: url
    serve: "npm run dev -- -p 4599"
    port: 4599
    path: "/"
    settleMs: 1000
    serveTimeoutMs: 220000
    width: 1200
    height: 820
  - id: kilde
    caption: "Før / etter — samme JSX; neokapi-i18n legger til en import og pakker kun inn datastrengene"
    source: kodediff
    reportTitle: "src/app/page.tsx — før og etter neokapi-i18n"
    reportSub: "Ren JSX-tekst ekstraheres automatisk ved byggetid; bare strenger som befinner seg i data får t()"
    path: src/app/page.tsx
    width: 1800
    height: 1000
  - id: japansk
    caption: "Den samme appen — japansk, layout uendret, plassholdere intakte"
    source: url
    serve: "npm run dev -- -p 4600"
    port: 4600
    path: "/?lang=ja"
    settleMs: 3500
    serveTimeoutMs: 220000
    width: 1200
    height: 820

narration:
  - id: tittel
    kind: tittel
    text: >
      En fungerende Next.js-notisapp, på engelsk, ikke koblet opp for oversettelse ennå. Oppgaven: levere den på japansk.
  - id: prompt
    kind: prompt
    text: >
      Utvikleren ber bare Claude om å sette opp neokapi-i18n og legge til japansk — ingen nevnelse av uttrekking, kataloger eller plassholdere.
  - id: arbeid
    kind: terminal
    text: >
      Claude kobler opp neokapi-i18n-stacken — null-innpaknings-tilnærmingen, der brukergrensesnittet forblir som vanlig JSX — og trekker alle oversettbare strenger ut av komponentene og inn i en katalog. Det er et strukturert steg prosjektet kjører på nytt hver gang grensesnittet endres.
    caption: "Claude tar i bruk neokapi-i18n og trekker ut UI-strengene fra JSX"
  - id: oversett
    kind: terminal
    text: >
      En pseudo-oversettelse er forsjekket som bekrefter at appen er klar for lokalisering. Deretter produserer kapi translate det japanske innholdet — med navneplassholderen nøyaktig der koden forventer den — og strengene kompileres til en ordbok som appen laster inn ved kjøretid.
    caption: "Pseudo-oversett for klargjøring, oversett deretter til japansk og kompiler"
  - id: engelsk
    kind: artefakt
    artifact: engelsk
    text: >
      Her er appen slik den leveres i dag — det virkelige grensesnittet, på engelsk.
  - id: kilde
    kind: artefakt
    artifact: kilde
    text: >
      Her er kilden, før og etter. Det er den samme vanlige JSX-en — neokapi-i18n legger til én import og pakker bare inn den håndfull strenger som befinner seg i data heller enn i markup. Ingen meldings-ID-er, ingen omskrivinger; teksten i markup-en er det kapi trekker ut og oversetter.
  - id: japansk
    kind: artefakt
    artifact: japansk
    text: >
      Og den samme appen, nå på japansk. Her er oversettelsen maskinprodusert og ikke gjennomgått. I et kapi-prosjekt ville de samme strengene flyte mot en utsendingsport — kontroller etter hver gjennomgang, og en gjennomgangs-arbeidsliste for det som trenger en person.
  - id: outro
    kind: outro
    text: >
      Fra en fungerende engelsk app til en som snakker japansk — én vanlig forespørsel, og kapi gjorde det den gjør best: trekke innholdet ut av koden og sende oversettelsen tilbake.
