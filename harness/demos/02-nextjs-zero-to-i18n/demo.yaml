id: 02-nextjs-zero-to-i18n
title: The same JSX, now in Japanese
subtitle: One import, one catalog, and the components stay as they were written.
kind: framework
publishAs: claude-app-i18n
aspects:
  - i18n setup
  - neokapi-i18n
  - pseudo-translate
  - multilingual
needsAi: true
model: sonnet
captureTimeoutSec: 480
outro:
  line: Add it to your app, then ask for a language.
  pointer: npm install -D @neokapi/i18n-react

# A complete English app with base deps installed, but neokapi-i18n is NOT installed
# or wired, so Claude adopts it. @neokapi/i18n-react is served from a local registry
# (.npmrc routes @neokapi → http://localhost:4873; run `npm run setup` to publish it),
# so `npm install -D @neokapi/i18n-react` works cleanly (React stays a single peer copy).
setup:
  - npm install --no-audit --no-fund --loglevel=error

prompt: >
  We're taking Lumen Notes to Japan. Can you set up i18n with neokapi-i18n and add a Japanese
  translation?

artifacts:
  - id: source
    caption: "Before and after: the same JSX, with an import added and only the data strings wrapped"
    source: codediff
    reportTitle: "src/app/page.tsx before and after neokapi-i18n"
    reportSub: "Plain JSX text is auto-extracted at build time; only strings that live in data get t()"
    path: src/app/page.tsx
    width: 1800
    height: 1000
  - id: japanese
    caption: "The same app in Japanese, layout untouched, placeholders intact"
    source: url
    serve: "npm run dev -- -p 4600"
    port: 4600
    path: "/?lang=ja"
    settleMs: 3500
    serveTimeoutMs: 220000
    width: 1200
    height: 820

narration:
  - id: title
    kind: title
    text: >-
      A React app can ship in a second language with its JSX left as it was
      written. Watch Claude add Japanese to a Next.js app: one import, one
      catalog, and the same components.

  - id: source
    kind: artifact
    artifact: source
    caption: One import added. The markup text is untouched.
    text: >-
      This is the whole change to the source. One import, and a wrapper on the
      handful of strings that live in data rather than in markup. Everything a
      reader sees stays plain JSX, which is what the build extracts.

  - id: work
    kind: terminal
    caption: The strings leave the components as a catalog.
    text: >-
      Claude installs the package, wires the build plugin, and runs the extract.
      Every translatable string in the interface lands in a catalog keyed by the
      English text, so the components need no message identifiers.

  - id: translate
    kind: terminal
    caption: Pseudo first, then Japanese, then compiled.
    text: >-
      A pseudo-translation runs first and answers whether the app survives longer
      text and reordered placeholders. Then kapi translates the catalog into
      Japanese, keeping the name placeholder where the code expects it, and
      compiles it into the dictionary the app loads.

  - id: japanese
    kind: artifact
    artifact: japanese
    caption: Japanese, on the layout that was already there.
    text: >-
      And the app in Japanese. The layout is the one the components describe,
      and the machine output here has had no person read it, which in a project
      is what the review queue is for.

  - id: outro
    kind: outro
    text: >-
      Install the package in your own app, run the extract once, then ask for
      the language you need.
