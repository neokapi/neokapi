id: 02-nextjs-zero-to-i18n
title: Zero to Japanese in a Next.js app
subtitle: A working English Next.js app. Claude wires up neokapi-i18n and ships it in Japanese, with the same UI.
kind: framework
publishAs: claude-app-i18n
aspects:
  - i18n setup
  - neokapi-i18n
  - pseudo-translate
  - multilingual
needsAi: true
model: sonnet
captureTimeoutSec: 480

# A complete English app with base deps installed, but neokapi-i18n is NOT installed
# or wired, so Claude adopts it. @neokapi/i18n-react is served from a local registry
# (.npmrc routes @neokapi → http://localhost:4873; run `npm run setup` to publish it),
# so `npm install -D @neokapi/i18n-react` works cleanly (React stays a single peer copy).
setup:
  - npm install --no-audit --no-fund --loglevel=error

prompt: >
  We're taking Lumen Notes to Japan. Can you set up i18n with neokapi-i18n and add a Japanese
  translation?

artifacts:
  - id: english
    caption: "The app today, in English"
    source: url
    serve: "npm run dev -- -p 4599"
    port: 4599
    path: "/"
    settleMs: 1000
    serveTimeoutMs: 220000
    width: 1200
    height: 820
  - id: source
    caption: "Before and after: the same JSX, with an import added and only the data strings wrapped"
    source: codediff
    reportTitle: "src/app/page.tsx before and after neokapi-i18n"
    reportSub: "Plain JSX text is auto-extracted at build time; only strings that live in data get t()"
    path: src/app/page.tsx
    width: 1800
    height: 1000
  - id: japanese
    caption: "The same app in Japanese, layout untouched, placeholders intact"
    source: url
    serve: "npm run dev -- -p 4600"
    port: 4600
    path: "/?lang=ja"
    settleMs: 3500
    serveTimeoutMs: 220000
    width: 1200
    height: 820

narration:
  - id: title
    kind: title
    text: >
      A working Next.js notes app, in English, not wired up for translation yet. The task:
      ship it in Japanese.
  - id: prompt
    kind: prompt
    text: >
      The developer just asks Claude to set up neokapi-i18n and add Japanese, with no
      mention of extraction, catalogs, or placeholders.
  - id: work
    kind: terminal
    text: >
      Claude wires up the neokapi-i18n stack, which leaves the UI as plain JSX, and pulls
      every translatable string out of the components into a catalog. It's a structured step
      the project re-runs whenever the interface changes.
    caption: "Claude adopts neokapi-i18n and extracts the UI strings from the JSX"
  - id: translate
    kind: terminal
    text: >
      A pseudo-translation is the pre-flight check that the app is ready to carry another
      language. Then kapi translate produces the Japanese, keeping the name placeholder exactly
      where the code expects it, and the strings compile into a dictionary the app loads at
      runtime.
    caption: "Pseudo-translate for readiness, then translate to Japanese and compile"
  - id: english
    kind: artifact
    artifact: english
    text: >
      Here's the app as it ships today: the real interface, in English.
  - id: source
    kind: artifact
    artifact: source
    text: >
      Here's the source, before and after. It's the same ordinary JSX. neokapi-i18n adds one
      import and wraps only the handful of strings that live in data rather than markup. No
      message IDs, no rewrites; the text in the markup is what kapi extracts and translates.
  - id: japanese
    kind: artifact
    artifact: japanese
    text: >
      And the same app, now in Japanese. Here the translation is machine output, unreviewed.
      In a kapi project the same strings would flow toward a ship gate, with checks after
      every pass and a review worklist for what needs a person.
  - id: outro
    kind: outro
    text: >
      From a working English app to one that speaks Japanese, on one ordinary request. kapi
      pulled the content out of the code and round-tripped the translation back.
