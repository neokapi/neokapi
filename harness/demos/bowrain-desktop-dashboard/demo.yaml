id: bowrain-desktop-dashboard
title: It keeps working when the network drops
subtitle: The same workspace, natively, with an outbox behind it.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-desktop-dashboard
terminal: desktop
target: bowrain-desktop
brand: bowrain
needsAi: false
oneshot: true
outro:
  line: Install the app, sign in, and keep working.
  pointer: brew install --cask neokapi/tap/bowrain
aspects:
  - The same shared workspace
  - Edits queue while offline
  - Replayed in order on reconnect

narration:
  - id: title
    kind: title
    text: >-
      The desktop app is the same workspace as the browser, mounted natively,
      with one difference: it keeps working when the network drops.

  - id: projects
    kind: desktop
    beat: projects
    caption: The same projects the browser opens.
    hold: 13
    crop: { x: 0.03, y: 0.1, w: 0.94, h: 0.56 }
    text: >-
      Same workspace, same projects, same editor. Signing in on the desktop
      opens exactly what the browser opens, because both are clients of one
      server rather than two copies of the work.

  - id: edit
    kind: desktop
    beat: edit
    caption: Written through to the server.
    hold: 12
    crop: { selector: '[data-testid="visual-editor-card"]' }
    text: >-
      Open a file and translate a block. With the server reachable the edit is
      written straight through, and everyone else in the workspace has it a
      moment later.

  - id: offline
    kind: desktop
    beat: offline
    caption: Offline, with edits waiting to be sent.
    hold: 18
    crop:
      selector:
        - '[data-testid="offline-pending"]'
        - '[data-testid="visual-editor-card"]'
    highlight: { selector: '[data-testid="offline-pending"]' }
    text: >-
      Now the connection goes. Translating carries on: the edits land in a
      local outbox instead of on the server, and the chrome counts what is
      waiting. On a train, or on a conference network, this is the hour a
      browser tab gives you nothing.

  - id: replayed
    kind: desktop
    beat: replayed
    caption: Reconnected, and the queue drained itself.
    hold: 15
    crop:
      selector:
        - '[data-testid="connection-status"]'
        - '[data-testid="visual-editor-card"]'
    text: >-
      When the connection returns the queue replays in order, on its own. There
      is nothing to retry by hand, nothing typed offline is lost, and the
      workspace ends up in the state it would have reached anyway.

  - id: outro
    kind: outro
    text: >-
      The same governed workspace, in an app that survives the network.
