id: bowrain-desktop-dashboard
title: "Skrivebordsappen, på teamets server"
subtitle: "En likestilt, sanntidsklient av det delte arbeidsområdet."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-desktop-dashboard
terminal: desktop
target: bowrain-desktop
brand: bowrain
needsAi: false
oneshot: true
aspects:
  - Native desktop app
  - An equal real-time client
  - The same shared workspace
  - Works offline, syncs back

narration:
  - id: title
    kind: title
    text: >-
      Bowrain Desktop — en innebygd, sanntidsklient til teamets server.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Bowrain leveres også som en innebygd skrivebordsapp — den samme delte appen nettleseren kjører, montert innebygd. Den åpner nøyaktig det samme arbeidsområdet, med tilstedeværelse og redigeringer delt direkte, og en frakoblet redigeringskø som holder deg i arbeid uten tilkobling og synkroniserer tilbake når du kobler til igjen.
  - id: stats
    kind: desktop
    beat: stats
    caption: Arbeidsområdet på et øyeblikk.
    text: >-
      Dashbordet oppsummerer arbeidsområdet — prosjekter, ord, språk og filer — hentet direkte fra serveren.
  - id: projects
    kind: desktop
    beat: projects
    caption: "Teamets prosjekter, på skrivebordet."
    text: >-
      Hvert prosjekt teamet jobber med er her, med sine språk og filantall, klart til å åpnes i den samme editoren nettleseren bruker.
  - id: connectors
    kind: desktop
    beat: connectors
    caption: Koble til eksterne innholdskilder.
    text: >-
      Koblinger konfigureres per prosjekt. Åpne ett, og Koblinger-visningen kobler til eksterne innholdskilder — et CMS, et designverktøy — slik at innhold strømmer inn og ferdige oversettelser strømmer tilbake ut.
  - id: outro
    kind: outro
    text: >-
      Det samme styrte arbeidsområdet, i en innebygd app — skrivebordssiden av plattformen som forvalter et teams arbeid på toppen av de åpne kapi-verktøyene.
