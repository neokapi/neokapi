id: 09-toolbox-find-replace
title: "grep, sed og cat — for alle formater"
subtitle: "kcat, kgrep og ksed arbeider på teksten kapi leser ut av et dokument — Word, Excel, Markdown — ikke rå bytes."
tagline: muscle memory from the tools you already know, on content those tools can't see into.
kind: use-case
publishAs: toolbox-explainer
# A scripted plain-shell demo (no Claude): the toolbox is deterministic, so the
# commands run for real and their output is recorded exactly.
terminal: shell
brand: kapi
cwd: ~/sales
needsAi: false
captureTimeoutSec: 120
aspects:
  - format-aware
  - kcat · kgrep · ksed
  - docx + xlsx + markdown
  - one pass, in place

# Each comment names exactly what the command below it does. Wildcards (`*`)
# fan a single pattern or substitution across every file, regardless of format.
script:
  - comment: A sales team's collateral — one product name, three formats.
  - command: ls
  - comment: kcat the Word proposal — its prose, as plain lines.
  - command: kcat proposal.docx
  - comment: kcat the Excel price list — one cell per line.
  - command: kcat pricing.xlsx
  - comment: kgrep every "SalesPilot" across all three files at once.
  - command: kgrep -n SalesPilot *
  - comment: ksed renames SalesPilot to Northstar, in place, in all three.
  - command: ksed -i 's/SalesPilot/Northstar/g' *
  - comment: kgrep the new name to confirm — same matches, renamed.
  - command: kgrep -c Northstar *
  - command: kcat proposal.docx

artifacts:
  - id: after
    caption: "proposal.docx — renamed to Northstar, heading and bold intact"
    source: docx
    path: proposal.docx
    reportTitle: "proposal.docx"
    reportSub: "still a valid Word document — only the words changed"
    width: 1100
    height: 760

narration:
  - id: title
    kind: title
    text: >
      Hva om du kunne kjøre klassiske CLI-verktøy — som cat og grep, eller til og med sed — på både tekst og innholdet inne i binære formater, som Word- og Excel-dokumenter? Nå kan du det.
  - id: cat
    kind: terminal
    text: >
      Her er salgsteamets materiell: en Markdown-presentasjon, et Word-forslag og en Excel-prisliste. kcat leser teksten direkte ut av Word-dokumentet og regnearket, som vanlige linjer.
    caption: "kcat leser teksten inne i .docx og .xlsx"
  - id: grep
    kind: terminal
    text: >
      kgrep søker gjennom den teksten i alle tre filene samtidig, og finner hvert eneste sted produktnavnet er nevnt.
    caption: "kgrep finner produktnavnet på tvers av alle formater"
  - id: sed
    kind: terminal
    text: >
      Og én ksed gir produktet nytt navn overalt, på stedet — hver fil lagret tilbake i sitt eget format.
    caption: "én ksed omdøper på tvers av alle tre, på stedet"
  - id: after
    kind: artifact
    artifact: after
    text: >
      Forslaget er fortsatt et gyldig Word-dokument — overskrift og struktur intakt. Bare ordene ble endret.
  - id: outro
    kind: outro
    text: >
      kcat, kgrep og ksed: grep, sed og cat, for ordene inne i alle de mer enn femti filformatene neokapi leser.
