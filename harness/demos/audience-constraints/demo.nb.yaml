id: audience-constraints
title: "Endre forklaringen, behold den felles regelen"
subtitle: "Fire lesesituasjoner, én felles formateringsregel og eksplisitte grenser for hva som ble kontrollert."
kind: use-case
publishAs: audience-constraints
terminal: shell
brand: kapi
cwd: ~/harbor-help
needsAi: false
fixturesFrom: samples/audience-context
project: true
captureTimeoutSec: 180
# A scripted plain-shell demo: every command is deterministic and offline, so
# it runs for real and its output is recorded exactly. Edits to the pages are
# made with ksed, which changes the text inside the JSON and keeps its shape.
aspects:
  - Shared constraints across audience treatments
  - Provenance in the finding
  - Factual guidance remains unverified
outro:
  line: Undersøk gjeldende veiledning og kontrollene som faktisk ble kjørt.
  pointer: kapi context <path>
setup:
  # The sample ships its context as files, and a fresh sandbox has a store that
  # has never held them.
  - kapi store import ./context
script:
  - comment: The same service is explained for four reading situations. The child page first.
  - command: kapi context site/locales/en/child.json
  - comment: The adult page sits at another point, in another register, under the same shared constraints.
  - command: kapi context site/locales/en/adult.json | head -9
  - comment: The prepared pages pass the configured checks.
  - command: kapi check site/locales/en/*.json
  - comment: Put the same unsupported assurance into every page.
  - command: ksed -i 's/is not recorded/is risk-free/' site/locales/en/*.json
  # The gate must fail here: four pages, one shared rule, four findings.
  - command: kapi check site/locales/en/*.json
    expectExit: 3
  - comment: Each finding carries the shared rule's identifier, version and source.
  # The gate failure itself was on screen one step earlier, so stderr is
  # dropped and the four provenance lines stand alone.
  - command: >-
      kapi check site/locales/en/*.json --json --jq '.findings[]|"\(.location.file)  \(.metadata.constraint_id) v\(.metadata.constraint_version)  \(.metadata.constraint_source)"' 2>/dev/null
    expectExit: 3
  - comment: Restore the prepared wording, and the same check passes.
  - command: ksed -i 's/is risk-free/is not recorded/' site/locales/en/*.json
  - command: kapi check site/locales/en/*.json
  - comment: A different sentence contradicts the service facts without using the prohibited wording.
  - command: ksed -i 's/cannot see inside your device/can open all your files/' site/locales/en/child.json
  - command: kapi check site/locales/en/child.json
narration:
  - id: title
    kind: title
    text: >-
      Forklaringen endres med leseren. Den felles regelen forblir. Dette eksempelet bruker fire lesesituasjoner og én felles formateringsregel. Den faktabaserte veiledningen forblir et separat gjennomgangsansvar.
  - id: context
    kind: terminal
    through: 6
    caption: "Ulik veiledning for ulike målgrupper, de samme felles begrensningene."
    text: >-
      Be om veiledningen på barnesiden og på voksensiden. Registeret er ulikt, og de samme to felles begrensningene gjelder for begge, hver med en identifikator, en versjon og en kilde. Den ene forbyr uunderbyggede forsikringer; den andre angir tjenestefakta. De forberedte sidene består de konfigurerte kontrollene.
  - id: violation
    kind: terminal
    through: 11
    highlight: { text: [FAILS, risk-free] }
    caption: Den forbudte frasen feiler for alle fire målgrupper.
    text: >-
      Legg den samme forbudte frasen inn på alle fire sider. Kontrollen avslutter tre av dem med fire avvikende funn, ett per side, og hvert navngir den samme felles regelen med versjon og kilde. Målgruppestiloverordninger lar den begrensningen forbli i kraft.
  - id: repair
    kind: terminal
    through: 14
    highlight: { text: [voice.guidance] }
    caption: Forberedt formulering gjenopprettet; konfigurerte kontroller består.
    text: >-
      Gjenopprett den forberedte formuleringen, og den samme kontrollen består. Dekningslinjen navngir analysen som ble forespurt, men ikke kjørt: veiledningen for tjenestefakta, som deterministiske regler ikke vurderer.
  - id: boundary
    kind: terminal
    through: 17
    highlight: { text: [PASS, voice.guidance] }
    caption: En deterministisk bestått kontroll verifiserer ikke tjenestefaktaene.
    text: >-
      Endre nå én setning slik at den motsier tjenestefaktaene uten den forbudte frasen. Kontrollen består, og dekningslinjen sier igjen at veiledningen ikke ble vurdert. Bestått etablerer ingenting om faktanøyaktighet. Setningen trenger fortsatt en person, eller en semantisk gjennomgang som evalueres separat.
  - id: outro
    kind: outro
    text: >-
      Bruk den gjeldende veiledningen, og undersøk deretter hvilke kontroller som ble fullført. Hold de uverifiserte delene synlige i gjennomgangen.
