id: audience-constraints
title: Change the explanation, keep the shared rule
subtitle: Four reading situations, one shared wording rule, and explicit limits on what was checked.
kind: use-case
publishAs: audience-constraints
terminal: shell
brand: kapi
cwd: ~/harbor-help
needsAi: false
fixturesFrom: samples/audience-context
project: true
captureTimeoutSec: 180
# A scripted plain-shell demo: every command is deterministic and offline, so
# it runs for real and its output is recorded exactly. Edits to the pages are
# made with ksed, which changes the text inside the JSON and keeps its shape.
aspects:
  - Shared constraints across audience treatments
  - Provenance in the finding
  - Factual guidance remains unverified
outro:
  line: Inspect the applicable guidance and the checks that actually ran.
  pointer: kapi context <path>
setup:
  # The sample ships its context as files, and a fresh sandbox has a store that
  # has never held them.
  - kapi context import ./context
script:
  - comment: The same service is explained for four reading situations. The child page first.
  - command: kapi context site/locales/en/child.json
  - comment: The adult page sits at another point, in another register, under the same shared constraints.
  - command: kapi context site/locales/en/adult.json | head -9
  - comment: The prepared pages pass the configured checks.
  - command: kapi check site/locales/en/*.json
  - comment: Put the same unsupported assurance into every page.
  - command: ksed -i 's/is not recorded/is risk-free/' site/locales/en/*.json
  # The gate must fail here: four pages, one shared rule, four findings.
  - command: kapi check site/locales/en/*.json
    expectExit: 3
  - comment: Each finding carries the shared rule's identifier, version and source.
  # The gate failure itself was on screen one step earlier, so stderr is
  # dropped and the four provenance lines stand alone.
  - command: >-
      kapi check site/locales/en/*.json --json --jq '.findings[]|"\(.location.file)  \(.metadata.constraint_id) v\(.metadata.constraint_version)  \(.metadata.constraint_source)"' 2>/dev/null
    expectExit: 3
  - comment: Restore the prepared wording, and the same check passes.
  - command: ksed -i 's/is risk-free/is not recorded/' site/locales/en/*.json
  - command: kapi check site/locales/en/*.json
  - comment: A different sentence contradicts the service facts without using the prohibited wording.
  - command: ksed -i 's/cannot see inside your device/can open all your files/' site/locales/en/child.json
  - command: kapi check site/locales/en/child.json
narration:
  - id: title
    kind: title
    text: >-
      The explanation changes with the reader. The shared rule remains.
      This example uses four reading situations and one shared wording rule.
      Its factual guidance remains a separate review responsibility.
  - id: context
    kind: terminal
    through: 6
    caption: Different audience guidance, the same shared constraints.
    text: >-
      Ask for the guidance on the child page and on the adult page. The
      register differs, and the same two shared constraints apply to both,
      each with an identifier, a version and a source. One prohibits
      unsupported assurances; the other states service facts. The prepared
      pages pass the configured checks.
  - id: violation
    kind: terminal
    through: 11
    highlight: { text: [FAILS, risk-free] }
    caption: The prohibited phrase fails in all four audiences.
    text: >-
      Put the same prohibited phrase into all four pages. The check exits
      three with four failing findings, one per page, and each names the same
      shared rule with its version and source. Audience style overrides leave
      that constraint in force.
  - id: repair
    kind: terminal
    through: 14
    highlight: { text: [voice.guidance] }
    caption: Prepared wording restored; configured checks pass.
    text: >-
      Restore the prepared wording and the same check passes. Its coverage
      line names the analysis that was requested and did not run: the service
      facts guidance, which deterministic rules do not assess.
  - id: boundary
    kind: terminal
    through: 17
    highlight: { text: [PASS, voice.guidance] }
    caption: A deterministic pass does not verify the service facts.
    text: >-
      Now change one sentence so that it contradicts the service facts without
      the prohibited phrase. The check passes, and the coverage line again says
      the guidance was not assessed. The pass establishes nothing about factual
      accuracy. The sentence still needs a person, or a semantic review that is
      evaluated separately.
  - id: outro
    kind: outro
    text: >-
      Use the guidance that applies, then inspect which checks completed.
      Keep the unverified parts visible in the review.
