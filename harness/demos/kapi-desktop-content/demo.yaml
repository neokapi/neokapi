id: kapi-desktop-content
title: Nothing is read until you read it
subtitle: One extract, and every collection has a number against every language.
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Content collections
  - File patterns
  - Keyed file preview
  - Format detection
outro:
  line: Extract once; edits re-extract themselves.
  pointer: kapi status

narration:
  - id: title
    kind: title
    text: >-
      A collection is a set of file patterns, and until the project reads them
      it knows nothing about what is inside. One extract, and every language has
      a number against it.

  - id: open-project
    kind: desktop
    beat: open-project
    caption: Four collections, and nothing read yet.
    text: >-
      The sample opens on its standing: four collections, every coverage column
      empty, and a panel saying in as many words that nothing has been
      extracted.

  - id: extract
    kind: desktop
    beat: extract
    caption: Read once, and the coverage fills in.
    crop: { selector: ['[data-slot="ship-gate-cell"]', '[data-testid="collection-file-count"]'] }
    zoom: 1.3
    highlight: { selector: '[data-slot="ship-gate-cell"]' }
    hold: 12
    text: >-
      Extract reads every matched file with the format Kapi detected for it and
      turns each one into blocks. The counts and the ladder for each language
      arrive from that, which is why the screen was blank until now.

  - id: patterns
    kind: desktop
    beat: patterns
    caption: The patterns, and the files each one matched.
    crop: { selector: '[data-slot="matched-files-scroll"]' }
    zoom: 1.2
    text: >-
      Opening a collection shows the patterns that define it. Each output
      pattern opens to the source file above its language files, every one
      carrying the format Kapi read it as.

  - id: keys
    kind: desktop
    beat: keys
    caption: The key column names the block Review decides on.
    crop: { selector: '[data-preview="keyed-table"]' }
    zoom: 1.6
    text: >-
      A JSON catalog is a list of keys with text against them, so the preview
      reads it as a table. The key column is what makes it navigable, and it is
      the same key that names the block in Review.

  - id: code
    kind: desktop
    beat: code
    caption: The same file, as it is written on disk.
    crop: { selector: '[data-preview="data"]' }
    zoom: 1.4
    text: >-
      The other tab is the file itself, with the line for the selected key
      highlighted. Structure on one, bytes on the other, and the same content
      underneath both.

  - id: outro
    kind: outro
    text: >-
      Extract once. After that an edit to a source file re-extracts it, so what
      the project knows stays level with the working tree.
