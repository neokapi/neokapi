id: kapi-desktop-content
title: One file, and what applies to it
subtitle: The Map lists every file; the Reader shows one with its rules and findings.
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The Map's counts and files
  - A file in the Reader
  - The rules that hold at a file
  - Fix, and what is edited by hand

# open, fix and by-hand carry no crop: the walk marks what each beat is about
# (beatSpan in record-desktop.ts): the file's row and the Reader's header, the
# block with the fixable finding, and the block whose finding is edited by hand.
outro:
  line: Open a file from the Map and fix what names its replacement.
  pointer: kapi context web/en/faq.md

narration:
  - id: title
    kind: title
    text: >-
      Every content file in a project is listed on its Map. Opening one shows
      its blocks, the rules that hold there, and what the checks found.

  - id: map
    kind: desktop
    beat: map
    caption: Four counts, and one row per file.
    text: >-
      The sample opens on its Map. The counts at the top are its files, blocks,
      rules and findings. Under Files, each row is one content file with its
      format, its blocks and its findings.

  - id: open
    kind: desktop
    beat: open
    caption: The FAQ, block by block.
    text: >-
      Open on the FAQ shows it in the Reader. Its blocks run in file order at
      reading width, and the line under the path counts the blocks and the
      findings.

  - id: margin
    kind: desktop
    beat: margin
    caption: The rules that hold at this file.
    text: >-
      Down the margin are the rules that hold at this file, in the order kapi
      context prints them for the same path.

  - id: fix
    kind: desktop
    beat: fix
    caption: A finding with a replacement, fixed in one click.
    text: >-
      A finding is marked on the words it is about, with its row under the
      block. This rule names FAQ in place of the long form, so the row offers
      Fix. One click writes the change into the file, and the finding is gone.

  - id: by-hand
    kind: desktop
    beat: by-hand
    caption: No replacement named, so it is edited by hand.
    text: >-
      The exclamation rule names no replacement, so its row says to edit by
      hand: you change the wording in the file yourself.

  - id: outro
    kind: outro
    text: >-
      The Reader shows a file with what applies to it. kapi context prints the
      same rules from a terminal in the same folder.
