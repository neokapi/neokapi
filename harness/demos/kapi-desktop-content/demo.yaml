id: kapi-desktop-content
title: Your files and progress
subtitle: See how far each language has come, and open a file to read it.
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Progress by language
  - Your files
  - Reading a file
outro:
  line: Edit a file, and the progress updates.

narration:
  - id: title
    kind: title
    text: >-
      In this video, you see how far each language has come, and open a file
      to read its text.

  - id: open-project
    kind: desktop
    beat: open-project
    crop: { x: 0.03, y: 0.08, w: 0.5, h: 0.3 }
    caption: The project at a glance.
    text: >-
      Open the KapiMart sample, then Project Settings, and the Content tab.
      At the top, you see how much text the project has, and its languages.

  - id: extract
    kind: desktop
    beat: extract
    crop: { x: 0.03, y: 0.42, w: 0.95, h: 0.38 }
    hold: 8
    caption: Progress for each group of files.
    text: >-
      Further down, each group of files has a row, with how much of each
      language is done.

  - id: patterns
    kind: desktop
    beat: patterns
    crop: { x: 0.03, y: 0.58, w: 0.68, h: 0.24 }
    caption: The files in a group.
    text: >-
      Click a group to see its files.

  - id: keys
    kind: desktop
    beat: keys
    crop: { x: 0.5, y: 0.0, w: 0.34, h: 0.36 }
    hold: 6
    caption: The text of one file.
    text: >-
      Click a file to read it. Each line of text sits next to its name in the
      file.

  - id: outro
    kind: outro
    text: >-
      When you edit a file, the progress updates on its own.
