id: kapi-desktop-content
title: Your files and progress
subtitle: See how far each language has come, and open a file to read it.
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Progress by language
  - Your files
  - Reading a file
outro:
  line: Edit a file, and the progress updates.

narration:
  - id: title
    kind: title
    text: >-
      You'll check the progress of each language and read one file.

  - id: open-project
    kind: desktop
    beat: open-project
    crop: { x: 0.03, y: 0.08, w: 0.5, h: 0.3 }
    caption: The project at a glance.
    text: >-
      Open the KapiMart sample. In Project Settings, open the Content tab. The
      top shows the amount of text and the languages.

  - id: extract
    kind: desktop
    beat: extract
    crop: { x: 0.03, y: 0.42, w: 0.95, h: 0.38 }
    hold: 8
    caption: Progress for each group of files.
    text: >-
      Below, each group of files has a row with the progress for each
      language.

  - id: patterns
    kind: desktop
    beat: patterns
    crop: { x: 0.03, y: 0.58, w: 0.68, h: 0.24 }
    caption: The files in a group.
    text: >-
      Click a group to list its files.

  - id: keys
    kind: desktop
    beat: keys
    crop: { x: 0.5, y: 0.0, w: 0.34, h: 0.36 }
    hold: 6
    caption: The text of one file.
    text: >-
      Click a file to read it. Each line of text appears next to its key.

  - id: outro
    kind: outro
    text: >-
      Edit a file, and the progress shown here updates.
