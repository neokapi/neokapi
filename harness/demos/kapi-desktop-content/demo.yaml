id: kapi-desktop-content
title: One file, and what applies to it
subtitle: The Map lists every file; the Reader shows one with its rules and findings.
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The Map's counts and files
  - A file in the Reader
  - The rules that hold at a file
  - Fix, and what is edited by hand

# open, fix and by-hand carry no crop: the walk marks what each beat is about
# (beatSpan in record-desktop.ts): the file's row and the Reader's header, the
# block with the fixable finding, and the block whose finding is edited by hand.
outro:
  line: Open a file from the Map and fix what has a replacement.
  pointer: kapi context web/en/faq.md

narration:
  - id: title
    kind: title
    text: >-
      Every file in your project is on the Map. Open one to see its blocks,
      the rules that apply to it, and what the checks found.

  - id: map
    kind: desktop
    beat: map
    caption: "The Map: four counts, then one row per file."
    text: >-
      The sample opens on its Map. At the top you see four counts: files,
      blocks, rules and findings. Under Files, each row is one file, with its
      format, its blocks and its findings.

  - id: open
    kind: desktop
    beat: open
    caption: The FAQ, block by block.
    text: >-
      Click Open on the FAQ. The Reader shows the file block by block, in file
      order. The line under the path counts its blocks and its findings.

  - id: margin
    kind: desktop
    beat: margin
    caption: The rules that apply to this file.
    text: >-
      In the margin you see the rules that apply to this file. They are the
      same rules kapi context prints for the same path.

  - id: fix
    kind: desktop
    beat: fix
    caption: A finding with a fix.
    text: >-
      A finding is marked on the words it is about, with a row under the
      block. This rule says to write FAQ instead of the long form, so the row
      offers Fix. Click it: the file is changed and the finding is gone.

  - id: by-hand
    kind: desktop
    beat: by-hand
    caption: No fix offered, so you edit by hand.
    text: >-
      The exclamation rule names no replacement, so its row says edit by hand.
      You change the wording in the file yourself.

  - id: outro
    kind: outro
    text: >-
      Open a file from the Map to see what applies to it. From a terminal,
      kapi context prints the same rules for the same file.
