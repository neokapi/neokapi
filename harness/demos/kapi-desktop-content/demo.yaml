id: kapi-desktop-content
title: The content a project translates
subtitle: Collections on the project home, and what one file holds.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Content collections
  - File patterns
  - Keyed file preview
  - Format detection

narration:
  - id: title
    kind: title
    text: >-
      In Kapi, a project's content is the set of files it translates.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      We'll open a sample project to see how that content is organised.

  - id: open-project
    kind: desktop
    beat: open-project
    caption: KapiMart, a ready-made sample project.
    text: >-
      KapiMart is a ready-made sample. A small store with documentation, a
      storefront, contracts and templates.

  - id: overview
    kind: desktop
    beat: overview
    caption: Where the content sits, and what governs it there.
    text: >-
      The project opens on its standing. Where the content sits, the voice
      governing it there, and how far each language has come.

  - id: content
    kind: desktop
    beat: content
    caption: Collections sit on the same surface.
    text: >-
      The collections sit on that same surface, one row each. A collection is a
      set of glob patterns, the files they match, and the coverage of every
      language across them.

  - id: patterns
    kind: desktop
    beat: patterns
    caption: A collection opens to its patterns and files.
    text: >-
      Opening one shows the patterns that define it. Each output pattern is a
      row that opens to the source file above its language files, every one
      carrying the format Kapi detected for it.

  - id: files
    kind: desktop
    beat: files
    caption: A JSON catalog, read as keys and values.
    text: >-
      Opening a file raises the preview. A JSON catalog is a list of keys with
      text against them, so Kapi reads it as a table rather than as a document.

  - id: keys
    kind: desktop
    beat: keys
    caption: The key beside the text it names.
    text: >-
      The key column is what makes this file navigable. It is the same key that
      names the block in Review, so a decision and a line in the file point at
      one another.

  - id: code
    kind: desktop
    beat: code
    caption: The file itself, one click away.
    text: >-
      The file view shows what is written to disk, with the line for the
      selected key highlighted. Structure on one tab, bytes on the other.

  - id: properties
    kind: desktop
    beat: properties
    caption: A properties catalog, read the same way.
    text: >-
      A Java properties catalog reads the same way, and so do YAML and the other
      keyed formats. These messages are the ones the review queue opens with.

  - id: outro
    kind: outro
    text: >-
      Edit a source file and the project re-extracts it, so the content stays in
      step with the working tree. That is a project's content: grouped, matched,
      and ready to bring up to date.
