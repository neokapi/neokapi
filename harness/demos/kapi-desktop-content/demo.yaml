id: kapi-desktop-content
title: Manage content in a project
subtitle: The files a project translates, and how they map.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Content collections
  - File patterns
  - Source & target files
  - Format detection

narration:
  - id: title
    kind: title
    text: >-
      In Kapi, a project's content is the set of files it translates.

  - id: intro
    kind: desktop
    beat: intro
    text: >-
      We'll open a sample project to see how that content is organised.

  - id: open-project
    kind: desktop
    beat: open-project
    caption: KapiMart — a ready-made sample project.
    text: >-
      KapiMart is a ready-made sample — a small store with documentation, a
      storefront, contracts and templates.

  - id: overview
    kind: desktop
    beat: overview
    caption: Source and target languages sit across the top.
    text: >-
      The source language and the locales it translates into sit across the top
      of the project.

  - id: content
    kind: desktop
    beat: content
    caption: Content is one card per collection.
    text: >-
      Content is organised as one card per collection: each card carries the
      patterns that define what belongs to it, and the files they match.

  - id: patterns
    kind: desktop
    beat: patterns
    caption: Patterns are grouped into named collections.
    text: >-
      Patterns are grouped into collections — the website, the online store, the
      contracts and the templates — each a glob that the engine reads from and
      writes back to.

  # The matched-files table is two levels since #1442: one row per output
  # pattern, opening to the source file and the per-locale language files.
  - id: files
    kind: desktop
    beat: files
    caption: Each pattern opens to its source and language files.
    text: >-
      Inside a collection, each output pattern is one row. Open it and the
      source file sits above the language files, every one with the format Kapi
      detected for it — Markdown, JSON, properties, Office documents and more.
      A locale that hasn't been generated yet stays listed, marked pending.

  - id: outro
    kind: outro
    text: >-
      Edit a source file and the project re-extracts it automatically — the
      content stays in step with the working tree. That's a project's content:
      grouped, matched, and ready to bring up to date.
