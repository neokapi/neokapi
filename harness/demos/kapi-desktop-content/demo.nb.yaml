id: kapi-desktop-content
title: Håndter innhold i et prosjekt
subtitle: The files a project translates, and how they map.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Content collections
  - File patterns
  - Source & target files
  - Format detection

narration:
  - id: title
    kind: title
    text: >-
      I Kapi er innholdet i et prosjekt settet av filer det oversetter.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Vi åpner et eksempelprosjekt for å se hvordan innholdet er organisert.
  - id: open-project
    kind: desktop
    beat: open-project
    caption: KapiMart — et ferdig eksempelprosjekt.
    text: >-
      KapiMart er et ferdig eksempel — en liten butikk med dokumentasjon, en nettbutikk, kontrakter og maler.
  - id: overview
    kind: desktop
    beat: overview
    caption: Kildespråk og målspråk ligger øverst.
    text: >-
      Kildespråket og språkene det oversettes til ligger øverst i prosjektet.
  - id: content
    kind: desktop
    beat: content
    caption: Innholdet er ett kort per samling.
    text: >-
      Innholdet er organisert som ett kort per samling: hvert kort bærer mønstrene som definerer hva som hører til, og filene de treffer.
  - id: patterns
    kind: desktop
    beat: patterns
    caption: Mønstrene er gruppert i navngitte samlinger.
    text: >-
      Mønstrene er gruppert i samlinger — nettstedet, nettbutikken, kontraktene og malene — hvert et glob-mønster som motoren leser fra og skriver tilbake til.
  - id: files
    kind: desktop
    beat: files
    caption: Each matched file carries its detected format.
    text: >-
      Inside a collection, every matched file is listed with the format Kapi
      detected for it — Markdown, JSON, properties, Office documents and more.
      On a server-connected project, a sync column shows what still has to be
      pushed.

  - id: outro
    kind: outro
    text: >-
      Edit a source file and the project re-extracts it automatically — the
      content stays in step with the working tree. That's a project's content:
      grouped, matched, and ready to bring up to date.
