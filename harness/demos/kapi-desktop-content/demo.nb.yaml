id: kapi-desktop-content
title: Administrer innhold i et prosjekt
subtitle: "Filene et prosjekt oversetter, og hvordan de tilordnes."
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-content
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Content collections
  - File patterns
  - Source & target files
  - Format detection

narration:
  - id: title
    kind: title
    text: >-
      I Kapi er innholdet i et prosjekt det settet med filer det oversetter.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Vi åpner et eksempelprosjekt for å se hvordan innholdet er organisert.
  - id: open-project
    kind: desktop
    beat: open-project
    caption: KapiMart — et ferdiglagd eksempelprosjekt.
    text: >-
      KapiMart er et ferdiglagd eksempel — en liten butikk med dokumentasjon, en butikkfront, kontrakter og maler.
  - id: overview
    kind: desktop
    beat: overview
    caption: Kilde- og målspråk vises øverst.
    text: >-
      Kildespråket og lokalene det oversettes til, vises øverst i prosjektet.
  - id: content
    kind: desktop
    beat: content
    caption: Innhold er ett kort per samling.
    text: >-
      Innhold er organisert som ett kort per samling: hvert kort inneholder mønstrene som definerer hva som hører til det, og filene de samsvarer med.
  - id: patterns
    kind: desktop
    beat: patterns
    caption: Mønstre er gruppert i navngitte samlinger.
    text: >-
      Mønstre er gruppert i samlinger — nettstedet, nettbutikken, kontraktene og malene — hver en glob som motoren leser fra og skriver tilbake til.
  # The matched-files table is two levels since #1442: one row per output
  # pattern, opening to the source file and the per-locale language files.
  - id: files
    kind: desktop
    beat: files
    caption: Hvert mønster åpner til kilde- og språkfilene sine.
    text: >-
      Inne i en samling er hvert utdatamønster én rad. Åpne den, og kildefilen ligger over språkfilene, alle med formatet Kapi registrerte for dem — Markdown, JSON, properties, Office-dokumenter og mer. Et språkområde som ennå ikke er generert, forblir oppført, merket som ventende.
  - id: outro
    kind: outro
    text: >-
      Rediger en kildefil, og prosjektet trekker den ut på nytt automatisk — innholdet holder tritt med arbeidsområdet. Det er et prosjekts innhold: gruppert, matchet og klart til å oppdateres.
