id: 01-localize-landing-page
title: Oversett en landingsside til fransk
subtitle: En enkel forespørsel — oversett denne siden — og kapi-ferdigheten tar seg av resten og holder HTML-en intakt.
kind: zero-to-hero
aspects:
  - KI-oversettelse
  - HTML-rundtur
  - formatbevisst
needsAi: true
model: sonnet
captureTimeoutSec: 300

prompt: >
  Vi lanserer Lumen Notes i Frankrike neste uke. Kan du oversette landingssiden vår, index.html, til fransk? Lagre den franske versjonen som index.fr.html.
artifacts:
  - id: before
    caption: "index.html — den engelske siden"
    source: html
    path: index.html
    width: 1280
    height: 900
  - id: after
    caption: "index.fr.html — samme side, tekst på fransk"
    source: html
    path: index.fr.html
    width: 1280
    height: 900

narration:
  - id: title
    kind: title
    text: >
      Dette er Claude Code med kapi-ferdigheten installert. Oppgaven er et oversettelsesoppdrag som en utvikler kan sette bort hvilken som helst uke: ta en landingsside og lag en fransk versjon.
  - id: prompt
    kind: prompt
    text: >
      Her er hele forespørselen. Den angir filen og språket og hvor resultatet skal lagres. Den sier ingenting om formater, analysering eller hvilken kommando som skal kjøres.
  - id: work
    kind: terminal
    text: >
      Claude leser siden, gjenkjenner en oversettelsesoppgave og kaller kapi translate. kapi analyserer HTML-en, skiller den lesbare teksten fra markeringen, gjenbruker eventuell oversettelsesminne den har, sender resten til den konfigurerte AI-leverandøren og kjører deterministiske kontroller over resultatet før det skrives tilbake i den samme strukturen.
    caption: "Claude kaller kapi translate; teksten reiser tilbake inn i HTML-en"
  - id: before
    kind: artifact
    artifact: before
    text: >
      Dette er den opprinnelige siden: en hero, en oppfordring til handling og tre funksjonskort, på engelsk.
  - id: after
    kind: artifact
    artifact: after
    text: >
      Og den franske versjonen kapi produserte. Strukturen, klassene og stilen er de samme; bare teksten den besøkende leser er endret.
  - id: outro
    kind: outro
    text: >
      kapi leser og skriver formatet. Det er ferdigheten som lot Claude nå for den fra en én-linjes forespørsel, uten å bli fortalt hvordan.
