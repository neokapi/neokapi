id: kapi-bilingual-workflow
title: The hand-off is a bilingual file
subtitle: kapi writes the XLIFF pre-filled from memory, and takes the translated one back.
kind: use-case
publishAs: bilingual-workflow
# A scripted plain-shell demo (no Claude): extract/merge/memory are deterministic, so
# the commands run for real and their output is recorded exactly. KAPI_NO_PROJECT
# is set by the shell harness, so extract/merge take the recipe via `-p kapi.yaml`.
terminal: shell
brand: kapi
cwd: ~/app
needsAi: false
captureTimeoutSec: 120
aspects:
  - XLIFF 2.x round-trip
  - Content-memory pre-fill + absorb
  - any CAT tool
  - full provenance
outro:
  line: Extract, send the folder, merge the return.
  pointer: kapi extract && kapi merge -i out/

# Each comment names exactly what the command below it does. The XLIFF file name
# is <source-rel-slug>.<src>-to-<tgt>.xliff (host/extract.go), so the pre-fill
# beat can name the French file without a wildcard.
script:
  - comment: A React app's English strings, ready to send out for translation.
  - command: cat src/locales/en/messages.json
  - comment: "One-time: seed the project content memory from a corporate TMX."
  - command: kapi memory import corporate.tmx -p kapi.yaml --all-pairs
  - comment: kapi extract writes one bilingual XLIFF per target locale, pre-filled from memory.
  - command: kapi extract -p kapi.yaml
  - command: ls out/
  - comment: Inside the file, every segment the memory already answers arrives with a target on it.
  - command: head -20 out/src-locales-en-messages.en-US-to-fr-FR.xliff
  - comment: A translator fills the rest in their CAT tool. Here, a stand-in that writes what a returned file carries.
  - command: ./translator-returns.sh out/*.xliff
  - comment: kapi merge applies the returned XLIFFs back onto the source.
  - command: kapi merge -p kapi.yaml -i out/
  - comment: kapi memory audit traces exactly what this merge wrote into the memory.
  - command: kapi memory audit -p kapi.yaml --batch $(ls .kapi/work/cache/extractions | head -1) --limit 10
  - comment: The catalog is now translated into French, ready to ship.
  - command: cat src/locales/fr-FR/messages.json

artifacts:
  - id: fr
    caption: "src/locales/fr-FR/messages.json, merged from the translator's return"
    source: report
    report: catalog
    reportTitle: "src/locales/fr-FR/messages.json (Français)"
    reportSub: "kapi · keys preserved, every value translated"
    path: src/locales/fr-FR/messages.json
    width: 1120
    height: 720

narration:
  - id: title
    kind: title
    text: >-
      When a person does the translating, the hand-off is a bilingual file. kapi
      writes the XLIFF pre-filled from content memory, takes the translated file
      back, and records where every entry came from.

  - id: extract
    kind: terminal
    through: 7
    caption: One file per locale, and the leverage counted before it is sent.
    text: >-
      The project's memory is seeded once from a corporate exchange file. Then
      one extract writes a bilingual file per target locale, and it reports what
      it found: the exact matches, the fuzzy ones, and the segments nobody has
      seen before.

  - id: prefilled
    kind: terminal
    through: 9
    highlight: { text: ["<target"] }
    caption: The memory's answers are already in the file.
    text: >-
      Open the French file and the pre-fill is visible. A segment the memory
      answers arrives with a target already on it, so the translator opens a
      file that is part done rather than empty.

  - id: merge
    kind: terminal
    through: 15
    caption: Applied, absorbed, and traceable to the return it came from.
    text: >-
      The translator returns the files and merge applies them back onto the
      source. Every accepted segment is absorbed into the project's memory, and
      the audit names which return each entry came from, which is what makes the
      next extract warmer than this one.

  - id: fr
    kind: artifact
    artifact: fr
    caption: Every key preserved, every value translated.
    text: >-
      The French catalog is complete. Keys untouched, values translated, and the
      memory now holds wording a person approved rather than wording a model
      produced.

  - id: outro
    kind: outro
    text: >-
      Extract, send the folder to whoever is translating, and merge what comes
      back. Any tool that reads the exchange format fits in the middle.
