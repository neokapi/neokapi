id: kapi-bilingual-workflow
title: Overleveringen er en tospråklig fil
subtitle: kapi skriver XLIFF forhåndsutfylt fra memory og tar den oversatte filen tilbake.
kind: use-case
publishAs: bilingual-workflow
# A scripted plain-shell demo (no Claude): extract/merge/memory are deterministic, so
# the commands run for real and their output is recorded exactly. KAPI_NO_PROJECT
# is set by the shell harness, so extract/merge take the recipe via `-p kapi.yaml`.
terminal: shell
brand: kapi
cwd: ~/app
needsAi: false
captureTimeoutSec: 120
aspects:
  - XLIFF 2.x round-trip
  - Content-memory pre-fill + absorb
  - any CAT tool
  - full provenance
outro:
  line: "Trekk ut, send mappen, flett inn returen."
  pointer: kapi extract && kapi merge -i out/

# Each comment names exactly what the command below it does. The XLIFF file name
# is <source-rel-slug>.<src>-to-<tgt>.xliff (host/extract.go), so the pre-fill
# beat can name the French file without a wildcard.
script:
  - comment: A React app's English strings, ready to send out for translation.
  - command: cat src/locales/en/messages.json
  - comment: "One-time: seed the project content memory from a corporate TMX."
  - command: kapi memory import corporate.tmx -p kapi.yaml --all-pairs
  - comment: kapi extract writes one bilingual XLIFF per target locale, pre-filled from memory.
  - command: kapi extract -p kapi.yaml
  - command: ls out/
  - comment: Inside the file, every segment the memory already answers arrives with a target on it.
  - command: head -20 out/src-locales-en-messages.en-US-to-fr-FR.xliff
  - comment: A translator fills the rest in their CAT tool. Here, a stand-in that writes what a returned file carries.
  - command: ./translator-returns.sh out/*.xliff
  - comment: kapi merge applies the returned XLIFFs back onto the source.
  - command: kapi merge -p kapi.yaml -i out/
  - comment: kapi memory audit traces exactly what this merge wrote into the memory.
  - command: kapi memory audit -p kapi.yaml --batch $(ls .kapi/work/cache/extractions | head -1) --limit 10
  - comment: The catalog is now translated into French, ready to ship.
  - command: cat src/locales/fr-FR/messages.json

artifacts:
  - id: fr
    caption: "src/locales/fr-FR/messages.json, merged from the translator's return"
    source: report
    report: catalog
    reportTitle: "src/locales/fr-FR/messages.json (Français)"
    reportSub: "kapi · keys preserved, every value translated"
    path: src/locales/fr-FR/messages.json
    width: 1120
    height: 720

narration:
  - id: title
    kind: title
    text: >-
      Når et menneske gjør oversettelsen, er overleveringen en tospråklig fil. kapi skriver XLIFF forhåndsutfylt fra content memory, tar den oversatte filen tilbake og registrerer hvor hver oppføring kom fra.
  - id: extract
    kind: terminal
    through: 7
    caption: "Én fil per språkkode, og gjenbruk talt opp før den sendes."
    text: >-
      Prosjektets memory seedes én gang fra en corporate exchange-fil. Deretter skriver ett uttrekk én tospråklig fil per målspråkkode, og rapporten viser hva som ble funnet: eksakte treff, fuzzy-treff og segmenter ingen har sett før.
  - id: prefilled
    kind: terminal
    through: 9
    highlight: { text: ["<target"] }
    caption: Svarene fra memory er allerede i filen.
    text: >-
      Åpne den franske filen og forhåndsutfyllingen er synlig. Et segment som memory svarer på, ankommer allerede med en målverdi, så oversetteren åpner en fil som er delvis ferdig – ikke tom.
  - id: merge
    kind: terminal
    through: 15
    caption: "Lagt til, absorbert og sporbar til returen den kom fra."
    text: >-
      Oversetteren returnerer filene, og flett legger dem tilbake på kilden. Hvert godkjente segment absorberes i prosjektets memory, og revisjonsloggen navngir hvilken retur hver oppføring kom fra – det er det som gjør neste uttrekk varmere enn dette.
  - id: fr
    kind: artifact
    artifact: fr
    caption: "Hver nøkkel bevart, hver verdi oversatt."
    text: >-
      Den franske katalogen er ferdig. Nøkler urørt, verdier oversatt, og memory inneholder nå ordlyd en person godkjente – ikke ordlyd en modell produserte.
  - id: outro
    kind: outro
    text: >-
      Trekk ut, send mappen til den som oversetter, og flett inn det som kommer tilbake. Ethvert verktøy som leser exchange-formatet passer inn i midten.
