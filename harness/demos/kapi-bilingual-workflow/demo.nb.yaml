id: kapi-bilingual-workflow
title: "Den tospråklige rundturen — ekstraher, oversett, slå sammen"
subtitle: "kapi sender ut en ren tospråklig XLIFF, tar imot den oversatte versjonen tilbake, og holder prosjektets innholdsminne i løkken på begge sider."
tagline: limet som holder ingeniørprosessen sammen rundt overlevering til oversetter — med full innholds- og minneproveniense.
kind: brukstilfelle
publishAs: bilingual-workflow
# A scripted plain-shell demo (no Claude): extract/merge/memory are deterministic, so
# the commands run for real and their output is recorded exactly. KAPI_NO_PROJECT
# is set by the shell harness, so extract/merge take the recipe via `-p kapi.yaml`.
terminal: skall
brand: kapi
cwd: ~/app
needsAi: false
captureTimeoutSec: 120
aspects:
  - XLIFF 2.x tur-retur
  - Forhåndsutfylling og absorpsjon av innholdsminne
  - et hvilket som helst CAT-verktøy
  - full sporbarhet

# Each comment names exactly what the command below it does.
script:
  - comment: "En React-apps engelske strenger, klare til å sendes ut for oversettelse."
  - command: cat src/locales/en/messages.json
  - comment: "Én gang: seed prosjektets innholdsminne fra en bedrifts-TMX."
  - command: kapi memory import corporate.tmx -p kapi.yaml --all-pairs
  - comment: "kapi extract — én tospråklig XLIFF per mållokalitet, forhåndsutfylt fra minnet."
  - command: kapi extract -p kapi.yaml
  - command: ls out/
  - comment: "En oversetter fyller ut <target>ene i CAT-verktøyet sitt (her, en erstatning)."
  - command: ./fake-translator.sh out/*.xliff
  - comment: kapi merge — bruk de returnerte XLIFF-ene tilbake på kilden.
  - command: kapi merge -p kapi.yaml -i out/
  - comment: kapi memory audit — spor nøyaktig hva denne sammenslåingen skrev inn i minnet.
  - command: kapi memory audit -p kapi.yaml --batch $(ls .kapi/work/cache/extractions | head -1) --limit 10
  - comment: "Katalogen er nå oversatt — fransk, klar til levering."
  - command: cat src/locales/fr-FR/messages.json

artifacts:
  - id: fr
    caption: "src/locales/fr-FR/messages.json — slått sammen fra oversettelsens retur"
    source: report
    report: catalog
    reportTitle: "src/locales/fr-FR/messages.json — Français"
    reportSub: "kapi · nøkler bevart, alle verdier oversatt"
    path: src/locales/fr-FR/messages.json
    width: 1120
    height: 720

narration:
  - id: title
    kind: title
    text: >
      Det meste av seriøst flerspråklig arbeid kjører på tospråklige utvekslingsfiler — XLIFF — som en oversetter åpner i et CAT-verktøy, fyller ut og sender tilbake. kapi er limen på ingeniørsiden på begge sider av denne overleveringen.
  - id: extract
    kind: terminal
    text: >
      Her er en React-apps engelske strenger. Vi seeder prosjektets innholdsminne fra en bedrifts-TMX, og kjører deretter extract — og kapi skriver én tospråklig XLIFF per mållokalitet, og forhåndsutfyller hvert segment minnet allerede kjenner.
    caption: "extract sender ut én XLIFF per lokalitet, forhåndsutfylt fra minnet"
  - id: merge
    kind: terminal
    text: >
      Oversetteren fyller ut de gjenværende målsegmentene og returnerer filene. Sammenslåingen anvender dem tilbake på kilden, absorberer hvert godkjente segment inn i minnet, og minnerevisjonen sporer nøyaktig hvilken retur hver oppføring stammer fra.
    caption: "merge avstemmer returen og absorberer den i minnet, med proveniens"
  - id: fr
    kind: artefakt
    artifact: fr
    text: >
      Den franske katalogen er fullstendig — hver nøkkel bevart, hver verdi oversatt — og minnet er rikere for neste ekstraksjon.
  - id: outro
    kind: outro
    text: >
      Ekstraher, oversett, slå sammen: en ren tospråklig rundtur gjennom et hvilket som helst CAT-verktøy, med innholdsminnet i løkken på begge sider.
