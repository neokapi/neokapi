id: 05-ai-checks-guardrail
title: Sjekk AI-output slik du tester kode
subtitle: En AI oversatte appen til tysk. kapi check leser oversettelsen mot kilden og rapporterer nøyaktig hva som ville gå galt i produksjon.
tagline: "do-not-translate, plassholere og terminologi — deterministiske sjekker som stopper en dårlig oversettelse før den sendes ut."
kind: brukstilfelle
publishAs: kapi-checks-guardrail
# A scripted plain-shell demo (no Claude): the checks are deterministic, so the
# commands run for real and their output is recorded exactly.
terminal: shell
brand: kapi
cwd: ~/checkout
needsAi: false
captureTimeoutSec: 120
aspects:
  - sjekker som tester
  - do-not-translate
  - plassholder-integritet
  - port i CI

# --no-fail keeps the demo's exit code clean while still printing the FAIL
# verdict and the findings; with the gate on (no --no-fail) the same check exits
# non-zero and blocks a merge.
script:
  - comment: En AI oversatte app.json til tysk. Er det trygt å sende ut?
  - command: cat app.de.json
  - comment: Sjekk oversettelsen mot kilden — som å kjøre tester.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" --no-fail 2>/dev/null
  - comment: To reelle feil — en manglende plassholder og et oversatt produktnavn. Bruk rettelsene.
  - command: cp -f app.de.fixed.json app.de.json && cat app.de.json
  - comment: Kjør den samme sjekken igjen.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" --no-fail 2>/dev/null

narration:
  - id: title
    kind: title
    text: >
      En AI oversatte denne appen til tysk. Det meste er greit — men to ting ville brutt i produksjon: en plassholder ble utelatt, og produktnavnet ble oversatt.
  - id: check
    kind: terminal
    text: >
      kapi check leser det tyske mot det engelske og kjører reglene som tester — do-not-translate, plassholder-integritet, terminologi. Den rapporterer nøyaktig hva som gikk galt: count-plassholderen mangler, og Acme Cloud ble oversatt.
    caption: "kapi check rapporterer funn for ikke-oversett og plassholdere"
  - id: fix
    kind: terminal
    text: >
      Vi bruker de to rettelsene — gjenoppretter plassholderen, beholder produktnavnet ordrett — og kjører nøyaktig den samme sjekken igjen.
    caption: "bruk rettelsene, kjør sjekken på nytt"
  - id: pass
    kind: terminal
    text: >
      Nå er den godkjent. Med porten aktivert er dette det som hindrer en dårlig oversettelse fra å bli sendt ut — i kontinuerlig integrasjon, eller inne i en assistents rettelsesløkke.
  - id: outro
    kind: outro
    text: >
      Sjekker som holder AI-output i tøylen, slik tester holder kode i tøylen: deterministiske, flerspråklige og kjørt ved hver endring.
