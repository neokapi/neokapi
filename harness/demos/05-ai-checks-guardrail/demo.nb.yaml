id: 05-ai-checks-guardrail
title: Finn en manglende plassholder og et endret produktnavn
subtitle: "En manglende plassholder og et oversatt produktnavn, funnet slik en test finner dem."
kind: use-case
publishAs: kapi-checks-guardrail
# A scripted plain-shell demo (no Claude): the checks are deterministic, so the
# commands run for real and their output is recorded exactly.
terminal: shell
brand: kapi
cwd: ~/checkout
needsAi: false
captureTimeoutSec: 120
aspects:
  - checks as tests
  - do-not-translate
  - placeholder integrity
  - gate in CI
outro:
  line: Legg porten til i CI-jobben din.
  pointer: kapi check --ship

# The first check exits 3 on camera, as it would block a merge. `expectExit: 3`
# makes a take where that check passes fail the capture. Both runs drop stderr,
# so the recording shows only the findings table and the verdict.
script:
  - comment: A prepared German fixture contains two planted defects.
  - command: cat app.de.json
  - comment: Check the translation against the source, the way you run tests.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" 2>/dev/null
    expectExit: 3
  - comment: "A dropped placeholder and a changed product name. Copy the prepared repair."
  - command: cp -f app.de.fixed.json app.de.json && cat app.de.json
  - comment: Run the same check again.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" 2>/dev/null

narration:
  - id: title
    kind: title
    text: >-
      Dette forberedte eksempelet har to innplantede feil: en manglende plassholder og et endret produktnavn. Vi kjører den faktiske sjekken, og kopierer deretter en forberedt reparasjon for å vise at de samme sjekkene passerer.
  - id: german
    kind: terminal
    through: 2
    caption: En forberedt målfil med to innplantede feil.
    text: >-
      Målfilen inneholder en manglende antallsplassholder og et endret beskyttet navn. Kilden og det konfigurerte beskyttede begrepet gir grunnlaget for disse sjekkene.
  - id: check
    kind: terminal
    through: 4
    highlight: { text: [FAILS] }
    caption: Porten feiler og navngir begge funnene.
    text: >-
      kapi check leser den tyske teksten mot den engelske og kjører reglene slik tester kjører: beskyttede navn og plassholderintegritet. Antallsplassholderen mangler, produktnavnet ble oversatt, og kommandoen avsluttes med tre.
  - id: fix
    kind: terminal
    through: 6
    caption: "Kopier en forberedt reparasjon, og kjør sjekkene på nytt."
    text: >-
      Kopieringskommandoen erstatter målfilen med en forberedt reparasjon. Den gjenoppretter plassholderen og det beskyttede navnet. Dette trinnet demonstrerer en reparasjonsfil, ikke en agent som diagnostiserer eller skriver rettelsen.
  - id: pass
    kind: terminal
    through: 8
    highlight: { text: [PASS] }
    caption: "Exit 0, fra kommandoen som nettopp avsluttet med 3."
    text: >-
      Den samme sjekken igjen, og den passerer. Kommandoen endret seg ikke, reglene endret seg ikke, og målteksten endret seg. Denne passeringen dekker de konfigurerte sjekkene, ikke faktanøyaktighet eller den generelle oversettelseskvaliteten.
  - id: outro
    kind: outro
    text: >-
      Legg porten inn i den kontinuerlige integrasjonsjobben din. Exit tre stopper sammenslåingen, slik en feilende test gjør.
