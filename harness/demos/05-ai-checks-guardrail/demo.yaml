id: 05-ai-checks-guardrail
title: Find a missing placeholder and a changed product name
subtitle: A dropped placeholder and a translated product name, found the way a test finds them.
kind: use-case
publishAs: kapi-checks-guardrail
# A scripted plain-shell demo (no Claude): the checks are deterministic, so the
# commands run for real and their output is recorded exactly.
terminal: shell
brand: kapi
cwd: ~/checkout
needsAi: false
captureTimeoutSec: 120
aspects:
  - checks as tests
  - do-not-translate
  - placeholder integrity
  - gate in CI
outro:
  line: Add the gate to your CI job.
  pointer: kapi check --ship

# The gate is on: the first check exits 3 on camera, which is what a merge is
# held to. `expectExit: 3` binds it both ways, so a take where the gate passed
# would fail the capture instead of shipping. stderr is dropped from both runs
# so the recorded output is the findings table and the verdict, nothing else.
script:
  - comment: A prepared German fixture contains two planted defects.
  - command: cat app.de.json
  - comment: Check the translation against the source, the way you run tests.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" 2>/dev/null
    expectExit: 3
  - comment: "A dropped placeholder and a changed product name. Copy the prepared repair."
  - command: cp -f app.de.fixed.json app.de.json && cat app.de.json
  - comment: Run the same check again.
  - command: kapi check app.json --target app.de.json --target-lang de --dnt "Acme Cloud" 2>/dev/null

narration:
  - id: title
    kind: title
    text: >-
      This prepared example has two planted defects: a dropped placeholder and
      a changed product name. We run the real checker, then copy a prepared
      repair to show the same checks passing.

  - id: german
    kind: terminal
    through: 2
    caption: A prepared target file with two planted defects.
    text: >-
      The target file contains a missing count placeholder and a changed
      protected name. The source and the configured protected term provide
      the evidence for these checks.

  - id: check
    kind: terminal
    through: 4
    highlight: { text: [CRITICAL, MAJOR] }
    caption: The gate fails, and names both findings.
    text: >-
      kapi check reads the German against the English and runs the rules the way
      tests run: protected names and placeholder integrity. The count
      placeholder is missing, the product name was translated, and the command
      exits three.

  - id: fix
    kind: terminal
    through: 6
    caption: Copy a prepared repair, then run the checks again.
    text: >-
      The copy command replaces the target with a prepared repair. It restores
      the placeholder and protected name. This step demonstrates a repair
      fixture, not an agent diagnosing or writing the correction.

  - id: pass
    kind: terminal
    through: 8
    highlight: { text: [PASS] }
    caption: Exit 0, from the command that just exited 3.
    text: >-
      The same check again, and it passes. The command did not change, the rules
      did not change, and the target text changed. This pass establishes those
      configured checks, not factual accuracy or overall translation quality.

  - id: outro
    kind: outro
    text: >-
      Put the gate in your continuous integration job. Exit three stops the
      merge, the way a failing test does.
