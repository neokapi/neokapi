id: s2-tidewatch-build-output
title: i18n-treet er byggresultat
subtitle: "Løkken skriver filene der byggingen leter. Et språk som ikke oppfyller leveringskravet, får ingen filer."
kind: use-case
publishAs: docs-site-convergence
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/tidewatch-docs
needsAi: false
# The sandbox IS the Tidewatch docs sample, copied from samples/tidewatch-docs so
# the recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/tidewatch-docs
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi store import ./context
captureTimeoutSec: 300
aspects:
  - the i18n tree is build output
  - front matter is content
  - delivery follows the ship gate
outro:
  line: Hold det genererte treet utenfor versjonskontroll.
  pointer: echo 'i18n/' >> .gitignore

script:
  - comment: A documentation site. Four pages, English, and a target layout its build already understands.
  - command: ls docs
  - comment: The i18n tree is not in git. It is written by the loop from the source and the committed context, so a clone regenerates it and no diff ever carries a generated translation.
  - command: cat .gitignore
  - comment: One verb. Approved wording is recycled; only the remainder reaches a provider.
  - command: kapi up
  - comment: Norwegian ships on translated work. Dutch waits for review, because nothing in it has been read by a person.
  - command: kapi status
  - comment: Front matter is content, so a title in a sidebar and a description in a search result converge with the prose.
  - command: head -6 i18n/nb/docusaurus-plugin-content-docs/current/index.md
  - comment: And only Norwegian is on disk. The ship gate controls delivery, so a language held back by its gate has no files rather than unblessed ones.
  - command: find i18n -name '*.md' | sort

artifacts:
  - id: translated
    caption: "i18n/nb/…/index.md: front matter and prose, where the build looks"
    source: report
    report: markdown
    path: i18n/nb/docusaurus-plugin-content-docs/current/index.md
    reportTitle: "i18n/nb/…/current/index.md"
    reportSub: "written by kapi up; not in git"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Et oversatt dokumentasjonstre er byggresultat. Løkken skriver det der nettstedets byggeprosess allerede leter, og git ignorerer det. Et språk som fortsatt venter på gjennomgang, får ingen filer.
  - id: shape
    kind: terminal
    through: 4
    highlight: { text: [i18n] }
    caption: "Genereres, ignoreres og genereres på nytt fra en klone."
    text: >-
      Fire sider og en oppskrift. Målbanen er filtreet som nettstedet allerede leser oversettelser fra. Git ignorerer dette treet. Det genereres fra kilden og konteksten som er sjekket inn, så en pull request inneholder aldri en generert oversettelse til gjennomgang.
  - id: converge
    kind: terminal
    through: 8
    highlight: { text: [nb, nl] }
    caption: "Norsk leveres. Nederlandsk venter på gjennomgang, og ingenting feilet."
    text: >-
      Ett verb konvergerer innholdet på begge språk. De norske oversettelsene oppfyller leveringskravet. Nederlandsk venter på gjennomgang. Kravet er at en person skal ha lest halvparten av enhetene, og ingen av dem er lest.
  - id: translated
    kind: artifact
    artifact: translated
    caption: "Tittel, sidefeltetikett og brødtekst er alle innhold."
    text: >-
      Dette er filen løkken skrev. Front matter følger med brødteksten, fordi leseren også leser tittelen i sidefeltet og beskrivelsen i søkeresultatet. Stubben har satt sine egne merker på hver streng den har generert.
  - id: delivered
    kind: terminal
    through: 12
    caption: "Bare språket som oppfylte leveringskravet, ligger på disk."
    text: >-
      Bare norsk ligger på disk. Levering følger leveringskravet. Et språk som ikke oppfyller kravet, får derfor ingen filer i det hele tatt.
  - id: outro
    kind: outro
    text: >-
      Legg det genererte treet til i ignore-filen, og la løkken skrive filene. Fra en klone kan du generere språkene som er klare, på nytt.
