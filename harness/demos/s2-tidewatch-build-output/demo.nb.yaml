id: s2-tidewatch-build-output
title: i18n-treet er byggutdata
subtitle: "Løkken skriver dit byggingen leter, og et parkert språk etterlater ingen filer."
kind: use-case
publishAs: docs-site-convergence
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/tidewatch-docs
needsAi: false
# The sandbox IS the Tidewatch docs sample, copied from samples/tidewatch-docs so
# the recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/tidewatch-docs
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi context import ./context
captureTimeoutSec: 300
aspects:
  - the i18n tree is build output
  - front matter is content
  - delivery follows the ship gate
outro:
  line: Hold det genererte treet utenfor versjonskontroll.
  pointer: echo 'i18n/' >> .gitignore

script:
  - comment: A documentation site. Four pages, English, and a target layout its build already understands.
  - command: ls docs
  - comment: The i18n tree is not in git. It is written by the loop from the source and the committed context, so a clone regenerates it and no diff ever carries a generated translation.
  - command: cat .gitignore
  - comment: One verb. Approved wording is recycled; only the remainder reaches a provider.
  - command: kapi up
  - comment: Norwegian ships on drafted work. Dutch parks, because nothing in it has been read by a person.
  - command: kapi status
  - comment: Front matter is content, so a title in a sidebar and a description in a search result converge with the prose.
  - command: head -6 i18n/nb/docusaurus-plugin-content-docs/current/index.md
  - comment: And only Norwegian is on disk. The ship gate decides delivery, so a parked language has no files rather than unblessed ones.
  - command: find i18n -name '*.md' | sort

artifacts:
  - id: translated
    caption: "i18n/nb/…/index.md: front matter and prose, where the build looks"
    source: report
    report: markdown
    path: i18n/nb/docusaurus-plugin-content-docs/current/index.md
    reportTitle: "i18n/nb/…/current/index.md"
    reportSub: "written by kapi up; not in git"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Et oversatt dokumentasjonstre er byggutdata. Løkken skriver det dit nettstedsbyggingen allerede leter, git ignorerer det, og et språk som fremdeles venter på et menneske etterlater ingen filer i det hele tatt.
  - id: shape
    kind: terminal
    through: 4
    highlight: { text: [i18n] }
    caption: "Generert, ignorert og regenerert fra et klon."
    text: >-
      Fire sider og en oppskrift. Målstien er treet nettstedet allerede leser oversettelser fra, og det treet er ignorert av git: det er avledet fra kilden og den committede konteksten, så en pull request bærer aldri en generert oversettelse inn i gjennomgang.
  - id: converge
    kind: terminal
    through: 8
    highlight: { text: [nb, nl] }
    caption: "Norsk leveres. Nederlandsk parkeres, og ingenting feilet."
    text: >-
      Ett verb håndterer begge språk. Norsk passerer ship gate på utkastet. Nederlandsk stopper, fordi gate-en krever at halvparten av enhetene er lest av et menneske – og ingen av dem er det.
  - id: translated
    kind: artifact
    artifact: translated
    caption: "Tittel, sidefeltsetikett og brødtekst – alt er innhold."
    text: >-
      Dette er filen løkken skrev. Front matter følger med prosaen, fordi en tittel i en sidefelt og en beskrivelse i et søkeresultat er ting en leser leser, og stubbens egne merker er på hver streng den laget.
  - id: delivered
    kind: terminal
    through: 12
    caption: Bare språket som passerte gate-en er på disk.
    text: >-
      Og bare norsk er på disk. Leveransen følger ship gate, så et parkert språk har ingen filer i det hele tatt – i stedet for filer ingen har godkjent.
  - id: outro
    kind: outro
    text: >-
      Legg det genererte treet til ignore-filen din og la løkken skrive det. Et klon regenererer språkene som er klare.
