id: s2-tidewatch-docs
title: Et dokumentasjonssted som tar igjen på egen hånd
subtitle: "Fire håndboksider, to nye språk, og en CI-jobb som rapporterer hva som er etter i stedet for å feile på det."
tagline: drift is work, not a broken build.
kind: use-case
publishAs: docs-site-convergence
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/tidewatch-docs
needsAi: false
# The sandbox IS the Tidewatch docs sample, copied from samples/tidewatch-docs so
# the recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/tidewatch-docs
project: true
captureTimeoutSec: 300
aspects:
  - the i18n tree is build output
  - front matter is content
  - coverage, not a verdict
  - the build never waits for a language

script:
  # --- 1. The shape -------------------------------------------------------
  - comment: A documentation site. Four pages, English, and a target layout its build already understands.
  - command: ls docs
  - command: cat kapi.yaml
  - comment: The i18n tree is not in git. It is written by the loop from the source and the committed context, so a clone regenerates it and no diff ever carries a generated translation.
  - command: cat .gitignore

  # --- 2. Converge --------------------------------------------------------
  - comment: One verb. Approved wording is recycled; only the remainder reaches a provider.
  - command: kapi up
  - comment: Front matter is content — a reader sees the title in the sidebar and the description in a search result — so it converges with the prose.
  - command: head -6 i18n/nb/docusaurus-plugin-content-docs/current/index.md
  - comment: And it landed where Docusaurus looks, with no copy step and no plugin.
  - command: find i18n -name '*.md' | sort

  # --- 3. What CI reports -------------------------------------------------
  - comment: This is what the pull-request job posts. Coverage per language, in machine shape.
  - command: >-
      kapi status --json --jq '.locales[]|"\(.locale)  translated \(.pct.translated)%  reviewed \(.pct.reviewed)%  \(if .shippable then "ready" else "pending" end)"'
  - comment: Review Norwegian and it clears the ship gate. Dutch has not been reviewed, so it does not.
  - command: >-
      kapi status --review --json --jq '.pending[]|select(.locale=="nb")|{kind:"review",op:"add",file,id:.key,locale,status:"reviewed"}' > nb.json
  - command: kapi apply nb.json 2>&1 | tail -2
  - command: kapi commit
  - command: kapi status

  # --- 4. Behind is not broken --------------------------------------------
  - comment: Dutch is behind. Nothing about that fails — the source gate is what a pull request is held to, and it is about the source.
  - command: kapi check --strict
  - comment: One advisory finding, and it is the API reference keeping a name the vocabulary retired. Reported, never blocking.
  - comment: The CI job that builds the site does not depend on the job that converges it. That is the whole arrangement.
  - command: cat .github/workflows/kapi.yml

artifacts:
  - id: coverage
    caption: "kapi status --json — coverage per language, what CI reads"
    source: command
    # Artifact commands run under the harness's kapi isolation, which turns
    # recipe discovery off, so the recipe is named rather than walked to.
    command: kapi status -p kapi.yaml --json
    report: json
    reportTitle: "kapi status --json"
    reportSub: "per language: how much is there, how much a person has read"
    width: 1200
    height: 900
  - id: translated
    caption: "i18n/nb/…/index.md — front matter and prose, where the build looks"
    source: report
    report: markdown
    path: i18n/nb/docusaurus-plugin-content-docs/current/index.md
    reportTitle: "i18n/nb/…/current/index.md"
    reportSub: "written by kapi up; not in git"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >
      Et dokumentasjonssted er det enkleste stedet å se hvorfor et oversatt prosjekt trenger en løkke snarere enn en prosjektplan. Kilden beveger seg hver uke, språkene følger i sitt eget tempo, og det ene som aldri må skje er at et bygg mislykkes fordi en oversetter ikke har klart å holde tritt ennå.
  - id: shape
    kind: terminal
    text: >
      Fire håndboksider og en oppskrift. Målstien er treet Docusaurus allerede leser oversettelser fra, så ingenting kopierer noe: løkken skriver der byggeprosessen leter. Og det treet er ikke i versjonskontroll. Det er avledet fra kilden og den committede konteksten, så en kloning regenererer det og en pull-forespørsel bærer aldri en generert oversettelse inn i gjennomgang.
    caption: "i18n-treet er byggeresultat, ikke en oversikt"

  - id: converge
    kind: terminal
    text: >
      Ett verb konvergerer begge språk. Formuleringer prosjektet har godkjent tidligere gjenbrukes først; bare det som er igjen når frem til en leverandør, som her er den frakoblede demostubben som merker alt den produserer. Front matter følger med prosen, fordi en tittel i en sidefelt og en beskrivelse i et søkeresultat er ting en leser leser.
    caption: "gjenbrukt først, utkast andre, front matter inkludert"

  - id: translated
    kind: artifact
    artifact: translated
    text: >
      Dette er filen løkken skrev. Tittel, sidefeltetikett og innhold, i treet som nettstedsbyggingen allerede kjenner til – og stubbens egne merker på strengene den fant på, slik at ingen forveksler en demo med en oversettelse.
  - id: coverage
    kind: artifact
    artifact: coverage
    text: >
      Og dette er det kontinuerlig-integrasjonsjobben legger ut på en pull request: hvor mye av hvert språk som finnes, hvor mye av det en person har lest, og om det passerer terskelen for å bli tilbudt. Det er en rapport, ikke en dom. Jobben som legger den ut kan ikke feile bygget.
  - id: review
    kind: terminal
    text: >
      Gjennomgå norsk og det passerer ship-porten. Nederlandsk er ikke gjennomgått, så det gjør det ikke — og det er den vanlige tilstanden til et oversatt nettsted snarere enn en hendelse. Det er engelsken pull-requesten faktisk holdes til, og kildeporten passerer med ett rådgivende funn: en API-referanse som beholder et feltnavn vokabularet avviklet, rapportert og aldri blokkerende.
    caption: "ett språk klart, ett venter, ingenting feiler"

  - id: workflow
    kind: terminal
    text: >
      Arbeidsflyten sier det tydelig. En pull-request får en tørrkjøring og en dekningskommentar; standardgrenen konvergerer og committer det som flyttet seg; og jobben som bygger nettstedet er ikke avhengig av noen av dem. Fail-on-parked forblir av, med vilje — parkert betyr at et språk venter på en person, som er tilstanden hele dette opplegget er laget for å gjøre overlevbar.
    caption: "byggejobben er avhengig av ingen av dem"

  - id: outro
    kind: outro
    text: >
      Kilde streng, mål advarer. Dekning rapportert, aldri håndhevet ved en push. Et språk som henger etter er et pågående arbeid, og nettstedet leveres på de språkene som er klare mens det tar igjen.
