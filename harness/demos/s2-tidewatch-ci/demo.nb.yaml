id: s2-tidewatch-ci
title: Nettstedet publiseres uten språket
subtitle: "Dekningsgraden rapporteres i pull requesten, og bare kildeteksten må bestå kontrollen."
kind: use-case
publishAs: docs-coverage-in-ci
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/tidewatch-docs
needsAi: false
# The sandbox IS the Tidewatch docs sample, copied from samples/tidewatch-docs so
# the recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/tidewatch-docs
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi store import ./context
captureTimeoutSec: 300
aspects:
  - coverage, not a verdict
  - the check on the source
  - the build never waits for a language
outro:
  line: "Rapporter dekningsgraden, og krev bare at kildeteksten består kontrollen."
  pointer: kapi status --json

script:
  - comment: The same documentation site, brought up to date. Norwegian ships; Dutch is behind.
  - command: kapi up
  - command: kapi status
  - comment: This is what the pull-request job posts. Coverage per language, in machine shape.
  - command: >-
      kapi status --json --jq '.locales[]|"\(.locale)  translated \(.pct.translated)%  established \(.pct.established)%  \(if .shippable then "ready" else "pending" end)"'
  - comment: While a language was behind, nothing failed. The check on the source is what a pull request is held to.
  - command: kapi check
  - comment: One finding reports. The integration page names the retired word where it explains the field that keeps it, and a reported finding never blocks.

artifacts:
  - id: coverage
    caption: "kapi status --json: coverage per language, what CI reads"
    source: command
    # Artifact commands run under the harness's kapi isolation, which turns
    # recipe discovery off, so the recipe is named rather than walked to.
    command: kapi status -p kapi.yaml --json
    report: json
    reportTitle: "kapi status --json"
    reportSub: "per language: how much is there, how much a person has read"
    width: 1200
    height: 900
  - id: workflow
    caption: ".github/workflows/kapi.yml: the build job depends on neither"
    source: report
    report: code
    path: .github/workflows/kapi.yml
    reportTitle: ".github/workflows/kapi.yml"
    reportSub: "a dry run and a comment on a pull request; a converge on the default branch"
    width: 1200
    height: 1000

narration:
  - id: title
    kind: title
    text: >-
      Byggingen av nettstedet må aldri feile fordi en oversettelse ligger etter. Pull requesten vurderes ut fra kildeteksten. Fremdriften for hvert språk rapporteres ved siden av.
  - id: coverage-run
    kind: terminal
    through: 5
    highlight: { text: [nb, nl] }
    caption: "Én linje per språk, uten noen konklusjon."
    text: >-
      Én linje per språk viser hvor mye som er oversatt, hvor mye et menneske har lest, og om språket oppfyller kravene for å tilbys. Nederlandsk ligger etter. Det er en del av det løpende arbeidet, ikke en feil.
  - id: coverage
    kind: artifact
    artifact: coverage
    caption: En rapport som jobben legger ut. Den kan ikke få bygget til å feile.
    text: >-
      Dette legger CI-jobben ut i en pull request. Det er en rapport. Jobben som legger den ut, kan ikke få bygget til å feile.
  - id: gate
    kind: terminal
    through: 8
    highlight: { text: [REPORTS] }
    caption: "Kontrollen av kildeteksten består, med ett funn som bare rapporteres."
    text: >-
      Gjennom hele prosessen er det den engelske kildeteksten pull requesten vurderes mot. Kontrollen av kildeteksten består, med ett funn som bare rapporteres. Integrasjonssiden nevner det utgåtte ordet mooring når den forklarer feltnavnet som fortsatt inneholder ordet.
  - id: workflow
    kind: artifact
    artifact: workflow
    caption: Konvergeringsjobben deler det som ble registrert. Byggejobben kjøres uansett.
    text: >-
      Arbeidsflyten viser det tydelig. En pull request får en prøvekjøring og en kommentar om dekningsgraden. Standardgrenen kjører konvergering og pusher konteksten som ble registrert. Jobben som bygger nettstedet, er ikke avhengig av noen av dem.
  - id: outro
    kind: outro
    text: >-
      Rapporter dekningsgraden i pull requesten, og krev bare at kildeteksten består kontrollen. Et språk som ligger etter, er arbeid som pågår. Nettstedet publiseres uten det.
