id: s1-compass-converge
title: Recycle first, draft the rest
subtitle: Three languages from one source, and a provider asked only for what is left.
kind: use-case
publishAs: multilingual-converge
# A scripted plain-shell demo: every command is deterministic and offline. The AI
# leg is the built-in `demo` provider, which needs no key and no network and
# marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/compass
needsAi: false
# The sandbox IS the Compass sample project, copied from samples/compass so the
# recording and the sample a reader clones cannot drift apart.
fixturesFrom: samples/compass
project: true
# The sample ships its context as files, and a fresh sandbox has a store that
# has never held them, so the take starts where a reader does.
setup:
  - kapi store import ./context
captureTimeoutSec: 240
aspects:
  - one point, one more axis
  - recycle before AI
  - ship states, not file presence
outro:
  line: Let the loop recycle before it drafts.
  pointer: kapi up

script:
  - comment: Compass is the product whose interface strings the monolingual sample already governs. One line makes it multilingual.
  - command: kapi context site/locales/en-GB.json | head -6
  - comment: Both axes, on one screen. The source gained a Tide window panel last week; no language carries it.
  - command: kapi status
  - comment: The deployed page builds its language picker from one file, and kapi writes it. Nothing is offered yet.
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json
  - comment: One verb. Approved wording is recycled; only what is left reaches a provider.
  - command: kapi up
  - comment: Norwegian and German clear the ship gate on translated work. Dutch waits for review, because one of its blocks fails the project's bound checks.
  - command: kapi status
  - command: kapi status --ship --emit site/ship.json
  - command: cat site/ship.json

artifacts:
  - id: ship
    caption: "site/ship.json: locale to shippable and ship state"
    source: report
    report: json
    path: site/ship.json
    reportTitle: "kapi status --ship"
    reportSub: "the whole contract between the loop and the delivery edge"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Adding a second language adds one more axis to content you already
      govern. The loop reuses the wording your project approved before and
      asks a provider only for the rest.

  - id: standing
    kind: terminal
    through: 7
    highlight: { text: ["false"] }
    caption: Four blocks behind. Nothing offered yet.
    text: >-
      Both axes on one screen. Last week the source gained a Tide window
      panel, four blocks, and no language has it yet. That is ordinary work,
      not a failure, and it is enough to hold every language behind the ship
      gate.

  - id: converge
    kind: terminal
    through: 9
    caption: Recycled first. Only the rest is drafted.
    text: >-
      One command converges. Thirty-seven of Norwegian's thirty-eight blocks
      come back from the project's own content memory. Only the rest reaches a
      provider, here the offline stub that marks everything it writes.

  - id: gated
    kind: terminal
    through: 13
    highlight: { text: [blocked, checks] }
    caption: Two languages offered. Dutch waits for review.
    text: >-
      Norwegian and German clear the ship gate on translated work. Dutch waits
      for review: one of its blocks fails a check the project binds, and a
      language with a failing block is held back until someone looks. Its
      drafts are safe in the store. Only delivery waits.

  - id: ship
    kind: artifact
    artifact: ship
    caption: Two answers per language.
    text: >-
      This file is the whole contract between the loop and the deployed site.
      For each language it answers two questions: is it safe to offer at all,
      and is every block approved or only translated. For Dutch it also notes
      that no terms apply.

  - id: outro
    kind: outro
    text: >-
      Run the loop on a project that already has approved wording, and watch
      how little of it reaches a provider.
