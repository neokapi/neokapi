id: kapi-desktop-explorer
title: What did we agree for this word?
subtitle: Terms and content memory, searched at the project that agreed them.
kind: use-case
publishAs: kapi-desktop-explorer
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Terms
  - Content memory
  - Multi-locale terms
  - Inline formatting
  - Entity placeholders

# A "desktop" demo replays the recorded Kapi Desktop screencast (public/<id>/
# screencast.{json,webm}) inside the macOS window frame. Each narration scene of
# kind "desktop" names a `beat` from screencast.json.
outro:
  line: The same two stores answer from a terminal.
  pointer: kapi terms search cart

narration:
  - id: title
    kind: title
    text: >-
      The words a project has agreed, and the wording it has already approved,
      are decisions. Both belong to the project, and both answer a search.

  - id: search-term
    kind: desktop
    beat: search-term
    caption: One word typed, and the list narrows to it.
    zoom: 1.3
    text: >-
      These are the concepts this project has agreed, in the first of its two
      stores. Typing narrows the list as you go rather than on a keystroke, so
      finding what the company calls something takes a word and a moment.

  - id: concept
    kind: desktop
    beat: concept
    caption: Its approved terms, language by language.
    zoom: 1.3
    text: >-
      A concept carries a definition and the approved term for it in every
      language the project ships. A status badge marks the preferred wording and
      flags the ones that have been retired.

  - id: search-tm
    kind: desktop
    beat: search-tm
    caption: Every string that mentions checkout, in one query.
    zoom: 1.2
    text: >-
      Content memory works the same way, one section across. It holds every
      translation this project has approved, and a search over it answers with
      the strings a word actually appears in.

  - id: inspect-tm
    kind: desktop
    beat: inspect-tm
    caption: Formatting kept as tags, names kept as placeholders.
    zoom: 1.4
    text: >-
      An entry pairs a source string with its translations. Bold text and links
      are kept as tags rather than as literal markup, and a name is held as a
      placeholder, so the entry can be reused with a different one in it.

  - id: outro
    kind: outro
    text: >-
      Both stores answer the same questions from a terminal in the same folder,
      because both belong to the project rather than to the app.
