id: kapi-desktop-explorer
title: What did we agree for this word?
subtitle: Terms and content memory, searched at the project that agreed them.
kind: use-case
publishAs: kapi-desktop-explorer
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Terms
  - Content memory
  - Multi-locale terms
  - Where a memory entry came from

# A "desktop" demo replays the recorded Kapi Desktop screencast (public/<id>/
# screencast.{json,webm}) inside the macOS window frame. Each narration scene of
# kind "desktop" names a `beat` from screencast.json.
outro:
  line: The same two stores answer from a terminal.
  pointer: kapi terms search cart

narration:
  - id: title
    kind: title
    text: >-
      The terms your project has agreed and the wording it has approved are
      both decisions. Both belong to the project, and you can search both.

  - id: search-term
    kind: desktop
    beat: search-term
    caption: Type a word, and the list narrows.
    text: >-
      This is the terms store: the concepts your project has agreed. The list
      narrows as you type, so finding what the company calls something takes a
      word and a moment.

  - id: concept
    kind: desktop
    beat: concept
    caption: Approved terms, language by language.
    text: >-
      A concept has a definition and an approved term in every language the
      project ships. A badge marks the preferred wording, and admitted marks a
      form that may stand beside it, as cart does here.

  - id: search-tm
    kind: desktop
    beat: search-tm
    caption: Every block that mentions checkout.
    text: >-
      Content memory works the same way, one section down. It holds every
      translation this project has approved, and a search answers with the
      blocks the word appears in.

  - id: inspect-tm
    kind: desktop
    beat: inspect-tm
    caption: The pair in full, and where it came from.
    text: >-
      Select a pair to see the source and its translation in full, with the
      other languages the entry holds, the file it came from and the key that
      uses it.

  - id: outro
    kind: outro
    text: >-
      From a terminal in the same folder, both stores answer the same
      questions.
