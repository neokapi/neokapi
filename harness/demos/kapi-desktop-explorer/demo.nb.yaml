id: kapi-desktop-explorer
title: Bla gjennom termer og innholdsminne
subtitle: En visuell omvisning i terminologi og innholdsminne i Kapi Desktop.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-explorer
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Terms
  - Content memory
  - Multi-locale terms
  - Inline formatting
  - Entity placeholders

# A "desktop" demo replays the recorded Kapi Desktop screencast (public/<id>/
# screencast.{json,webm}) inside the macOS window frame. Each narration scene of
# kind "desktop" names a `beat` from screencast.json and inherits that beat's
# zoom region; the scene plays the beat's slice fit to the narration length.

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop — den visuelle følgesvennen til kapi-kommandolinjen.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Det åpner seg til et rolig startskjermbilde. Alt en oversetter lener seg på — de avtalte termene og de huskede oversettelsene — ligger ett klikk unna i sidefeltet.
  # The sidebar sections are Terms and Content Memory (renamed in #1442); the
  # `beat` ids stay as recorded.
  - id: termbases
    kind: desktop
    beat: open-termbases
    caption: Termer-seksjonen viser alle termfiler som finnes på disk.
    text: >-
      Terms-seksjonen lister opp hver termsfil lagret på disk, med størrelse og tidspunkt for siste endring.
  - id: glossary
    kind: desktop
    beat: open-glossary
    caption: Å åpne én viser hvert begrep den inneholder.
    text: >-
      Å åpne produkttermene viser frem hvert konsept det inneholder — åtte her — med et aktivitetsdiagram over nylige redigeringer øverst.
  - id: concept
    kind: desktop
    beat: inspect-concept
    caption: Hvert konsept har en definisjon og dets godkjente termer.
    text: >-
      Hvert konsept har en definisjon og godkjente termer på tvers av språk. Et statusmerke markerer den foretrukne formuleringen og flagger termer som er utdaterte.
  - id: search-term
    kind: desktop
    beat: search-term
    caption: Fritekstsøk finner et begrep raskt.
    text: >-
      Fulltekstsøk finner et begrep på et øyeblikk. Her er fakturakonseptet, med godkjente oversettelser.
  - id: open-tm
    kind: desktop
    beat: open-tm
    caption: Innholdsminnet fungerer på samme måte.
    text: >-
      Innholdsminne fungerer på samme måte. Vi går over og åpner minnet for Acme-appen.
  - id: inspect-tm
    kind: desktop
    beat: inspect-tm
    caption: Hver oppføring kobler en kildestreng til oversettelsene sine.
    text: >-
      Hver oppføring kobler en kildestreng til oversettelsene sine. Innebygd formatering, som fet tekst og lenker, bevares som tagger i stedet for bokstavelig markup.
  - id: entity
    kind: desktop
    beat: entity
    caption: "Navn lagres som plassholdere, klare til gjenbruk."
    text: >-
      Navn og andre entiteter lagres som plassholdere, slik at en husket oversettelse kan gjenbrukes senere med en annen verdi.
  - id: search-tm
    kind: desktop
    beat: search-tm
    caption: Minnet er også søkbart.
    text: >-
      Og minnet er også søkbart — alle strenger som nevner ordet invite.
  - id: outro
    kind: outro
    text: >-
      Det er terminologi- og innholdsminnet i hjertet av kapi, tilgjengelig på ett sted.
