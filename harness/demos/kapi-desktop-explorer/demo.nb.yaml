id: kapi-desktop-explorer
title: Browse terms and content memory
subtitle: A visual tour of terminology and content memory in Kapi Desktop.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-explorer
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Terms
  - Content memory
  - Multi-locale terms
  - Inline formatting
  - Entity placeholders

# A "desktop" demo replays the recorded Kapi Desktop screencast (public/<id>/
# screencast.{json,webm}) inside the macOS window frame. Each narration scene of
# kind "desktop" names a `beat` from screencast.json and inherits that beat's
# zoom region; the scene plays the beat's slice fit to the narration length.

narration:
  - id: title
    kind: title
    text: >-
      Kapi Desktop — den visuelle følgesvennen til kapi-kommandolinjen.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      It opens to a calm home screen. Everything a translator leans on — the
      agreed terms and the remembered translations — sits one click away in the
      sidebar.

  # The sidebar sections are Terms and Content Memory (renamed in #1442); the
  # `beat` ids stay as recorded.
  - id: termbases
    kind: desktop
    beat: open-termbases
    caption: The Terms section lists each terms file on disk.
    text: >-
      The Terms section lists each terms file stored on disk, with its size
      and when it last changed.

  - id: glossary
    kind: desktop
    beat: open-glossary
    caption: Opening one shows every concept it holds.
    text: >-
      Opening the product terms brings up every concept it holds — eight here
      — with an activity chart of recent edits across the top.

  - id: concept
    kind: desktop
    beat: inspect-concept
    caption: Hvert begrep har en definisjon og godkjente termer.
    text: >-
      Hvert begrep bærer en definisjon og de godkjente termene sine på tvers av språk. Et statusmerke markerer den foretrukne ordlyden, og flagger termene som er utgått.
  - id: search-term
    kind: desktop
    beat: search-term
    caption: Fulltekstsøk finner en term raskt.
    text: >-
      Fulltekstsøk finner en term på et øyeblikk. Her: faktura-begrepet, med de godkjente oversettelsene sine.
  - id: open-tm
    kind: desktop
    beat: open-tm
    caption: Content Memory works the same way.
    text: >-
      Content Memory works the same way. We cross over and open the memory for
      the Acme app.

  - id: inspect-tm
    kind: desktop
    beat: inspect-tm
    caption: Hver oppføring parer en kildestreng med oversettelsene.
    text: >-
      Hver oppføring parer en kildestreng med oversettelsene sine. Formatering i teksten, som fet skrift og lenker, bevares som tagger i stedet for rå markup.
  - id: entity
    kind: desktop
    beat: entity
    caption: "Navn holdes som plassholdere, klare til gjenbruk."
    text: >-
      Navn og andre entiteter holdes som plassholdere, slik at en lagret oversettelse kan gjenbrukes senere med en annen verdi.
  - id: search-tm
    kind: desktop
    beat: search-tm
    caption: Minnet er også søkbart.
    text: >-
      Og minnet er søkbart, det også — hver streng som nevner ordet invite.
  - id: outro
    kind: outro
    text: >-
      That's the terminology and content memory at the heart of kapi,
      browsable in one place.
