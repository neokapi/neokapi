id: kapi-desktop-explorer
title: Hva ble vi enige om for dette ordet?
subtitle: "Termer og innholdsminne, søkt på prosjektet som godkjente dem."
kind: use-case
publishAs: kapi-desktop-explorer
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Terms
  - Content memory
  - Multi-locale terms
  - Where a memory entry came from

# A "desktop" demo replays the recorded Kapi Desktop screencast (public/<id>/
# screencast.{json,webm}) inside the macOS window frame. Each narration scene of
# kind "desktop" names a `beat` from screencast.json.
outro:
  line: De samme to lagrene svarer fra en terminal.
  pointer: kapi terms search cart

narration:
  - id: title
    kind: title
    text: >-
      Ordene et prosjekt har godkjent, og formuleringene det allerede har vedtatt, er beslutninger. Begge tilhører prosjektet, og begge svarer på et søk.
  - id: search-term
    kind: desktop
    beat: search-term
    caption: "Ett ord skrevet, og listen snevres inn til det."
    text: >-
      Dette er begrepene dette prosjektet har godkjent, i den første av de to lagrene. Skriving snevrer inn listen underveis i stedet for ved et tastetrykk, så det å finne hva selskapet kaller noe tar ett ord og et øyeblikk.
  - id: concept
    kind: desktop
    beat: concept
    caption: "Godkjente termer, språk for språk."
    text: >-
      Et begrep har en definisjon og den godkjente termen for det på hvert språk prosjektet leverer til. Et statusmerke markerer den foretrukne formuleringen, og admitted markerer en form som kan stå ved siden av den, slik cart gjør her.
  - id: search-tm
    kind: desktop
    beat: search-tm
    caption: "Alle strenger som nevner checkout, i én spørring."
    text: >-
      Innholdsminnet fungerer på samme måte, én seksjon over. Det lagrer alle oversettelser dette prosjektet har godkjent, og et søk i det returnerer strengene et ord faktisk forekommer i.
  - id: inspect-tm
    kind: desktop
    beat: inspect-tm
    caption: "Paret i sin helhet, og hvor det kom fra."
    text: >-
      Å velge et par viser kilden og oversettelsen i sin helhet, samt de andre språkene oppføringen inneholder. Det viser også hvilken fil paret kom fra og nøkkelen som bruker det.
  - id: outro
    kind: outro
    text: >-
      Begge lagrene svarer på de samme spørsmålene fra en terminal i samme mappe, fordi begge tilhører prosjektet og ikke appen.
