id: 11-cli-terms-and-queue
title: "Én kø, alle språk"
subtitle: "De samme termreglene når modellen og porten, og én liste holder arbeidet."
kind: use-case
publishAs: cli-terms-and-queue
# A scripted plain-shell demo: every command is deterministic and offline. The
# drafting leg uses the built-in `demo` provider, which needs no key and no
# network and marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/voltway
needsAi: false
# The same Voltway tree as 10-cli-points-and-voice, read from where that demo
# keeps it rather than copied, so the two recordings cannot drift apart. The
# sandbox IS the project (a recipe at its root) and lives in os.tmpdir().
fixturesFrom: harness/demos/10-cli-points-and-voice/fixtures
project: true
# The fixture's context is a set of files until somebody reads them into this
# machine's store, and the sandbox is a fresh one every take.
setup:
  - kapi store import ./context
captureTimeoutSec: 180
aspects:
  - one list of term rules
  - one review queue
  - the source among the languages
outro:
  line: "Les din egen kø, ett språk om gangen."
  pointer: kapi status --review --lang fr

script:
  - comment: Terminology is a list under term_rules, on the step that uses it. Two lines in the recipe name what the French must say.
  - comment: The step that drafts is handed exactly that list, so the model and the check are told the same thing.
  - command: kapi run converge -i app/strings.en.json --target-lang fr --explain-prompts 2>&1 | grep -A2 "Terminology (use these renderings)" | head -3
  - comment: Where the project stands. French is translated; nothing in either language has been approved by a person.
  - command: kapi status
  - comment: One queue holds every language, the source among them, and every source row carries its marker.
  - command: kapi status --review --lang en | head -8
  - comment: Ask for the language you are reviewing, and you get those rows alone.
  - command: kapi status --review --lang fr
  - comment: The queue names what each decision addresses, so approving is one pass over it.
  - command: >-
      kapi status --review --lang fr --json --jq '.pending[]|{op:"decide",at:{doc:.relative,block:.key,edition:.locale},if_match:"*",outcome:"establish"}' > reviewed.json
  # The report goes to stderr, so the tail has to see stderr to trim it.
  - command: kapi apply reviewed.json 2>&1 | tail -3
  - comment: Each approval is in the record as it is made, attributable, and the queue says so.
  - command: kapi status --review --lang fr
  - comment: French is approved. The source rows stay open, because Voltway approves its own wording before a translation ships from it.
  - command: kapi status

artifacts:
  - id: queue
    caption: "kapi status --review --json: what is still open, after French was approved"
    source: command
    command: kapi status --review -p . --json
    report: json
    reportTitle: "kapi status --review --json"
    reportSub: "the source rows, each carrying its own marker"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Terminologi er én liste, og steget som lager utkast og sjekken som fungerer som port får den samme. Det som gjenstår etter det er en kø med alle språk i seg.
  - id: terms
    kind: terminal
    through: 3
    highlight: { text: [Terminology, facturation] }
    caption: "Oppskriftens to regler, inne i ledeteksten som lager utkast."
    text: >-
      Hver regel navngir et term, hva det franske må si for det, og om en miss feiler. Be utkaststeget om å vise ledeteksten sin, og de samme to reglene er i den, ord for ord, slik at en modell får beskjed om hva porten vil holde den til.
  - id: standing
    kind: terminal
    through: 9
    caption: "Én liste, begge språk, deretter avgrenset til fransk."
    text: >-
      Fransk er oversatt og ingenting er godkjent av en person ennå. Én kø holder alle språk, inkludert kilden, og en kilderad bærer sin egen markør.
  - id: approve
    kind: terminal
    through: 14
    caption: "Fire rader, ett pass, og ingen fransk igjen i køen."
    text: >-
      Køen navngir hva hver beslutning gjelder, slik at godkjenning av de fire franske radene er ett pass over den heller enn ett besøk til hver. Hvert godkjenning lander i loggen idet det gjøres, med et navn mot det.
  - id: queue
    kind: artifact
    artifact: queue
    caption: Fransk er borte. Kilderad er fortsatt åpne.
    text: >-
      Etterpå er de franske radene borte, og kilderad er fortsatt her, fordi Voltway fastsetter sin egen ordlyd før en oversettelse sendes fra det.
  - id: outro
    kind: outro
    text: >-
      Be ditt eget prosjekt om ett språk om gangen, og det som kommer tilbake er arbeidet, i formen write-kommandoen tar.
