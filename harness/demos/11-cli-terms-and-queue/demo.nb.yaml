id: 11-cli-terms-and-queue
title: "Én kø, alle språk"
subtitle: "De samme term­reglene når både modellen og kontrollen, og én liste holder arbeidet."
kind: use-case
publishAs: cli-terms-and-queue
# A scripted plain-shell demo: every command is deterministic and offline. The
# drafting leg uses the built-in `demo` provider, which needs no key and no
# network and marks its own output, so a take costs nothing and claims nothing.
terminal: shell
brand: kapi
cwd: ~/voltway
needsAi: false
# The same Voltway tree as 10-cli-points-and-voice, read from where that demo
# keeps it rather than copied, so the two recordings cannot drift apart. The
# sandbox IS the project (a recipe at its root) and lives in os.tmpdir().
fixturesFrom: harness/demos/10-cli-points-and-voice/fixtures
project: true
# The fixture's voice profile is a file until somebody reads it into this
# machine's store, and the sandbox is a fresh one every take.
setup:
  - kapi context import
captureTimeoutSec: 180
aspects:
  - one list of term rules
  - one review queue
  - the source among the languages
outro:
  line: "Les din egen kø, ett språk om gangen."
  pointer: kapi status --review --lang fr

script:
  - comment: Terminology is a list under term_rules, on the step that uses it. Two lines in the recipe name what the French must say.
  - comment: The step that drafts is handed exactly that list, so the model and the check are told the same thing.
  - command: kapi run converge -i app/strings.en.json --target-lang fr --explain-prompts 2>&1 | grep -A2 "Terminology (use these renderings)" | head -3
  - comment: Where the project stands. French is drafted; nothing in either language has been read by a person.
  - command: kapi status
  - comment: One queue holds every language, the source among them, and every source row carries its marker.
  - command: kapi status --review --lang en | head -8
  - comment: Ask for the language you are reviewing, and you get those rows alone.
  - command: kapi status --review --lang fr
  - comment: The queue is already the shape of a change-set, so approving is one pass over it.
  - command: >-
      kapi status --review --lang fr --json --jq '.pending[]|{kind:"review",op:"add",file,id:.key,locale,status:"reviewed"}' > reviewed.json
  # The per-entry report goes to stderr, so the tail has to see stderr to trim it.
  - command: kapi apply reviewed.json 2>&1 | tail -3
  - comment: Each approval is in the record as it is made, attributable, and the queue says so.
  - command: kapi status --review --lang fr
  - comment: French is reviewed. The source rows stay open, because Voltway signs off its own wording before a translation ships from it.
  - command: kapi status

artifacts:
  - id: queue
    caption: "kapi status --review --json: what is still open, after French was signed off"
    source: command
    command: kapi status --review -p . --json
    report: json
    reportTitle: "kapi status --review --json"
    reportSub: "the source rows, each carrying its own marker"
    width: 1200
    height: 900

narration:
  - id: title
    kind: title
    text: >-
      Terminologi er én liste, og trinnet som lager utkast og kontrollen som porter, får den samme listen. Det som gjenstår er en kø med alle språk i seg.
  - id: terms
    kind: terminal
    through: 3
    highlight: { text: [Terminology, facturation] }
    caption: "Oppskriftens to regler, inne i prompten som lager utkast."
    text: >-
      Hver regel navngir en term, hva franskversjonen må si for den, og hvor strengt den gjelder. Be utkasts­trinnet vise prompten sin, og de samme to reglene er i den, ord for ord – slik at en modell får vite hva kontrollen vil holde den til.
  - id: standing
    kind: terminal
    through: 9
    caption: "Én liste, begge språk, deretter avgrenset til fransk."
    text: >-
      Fransk er kladdet og ingen har lest det ennå. Én kø holder alle språk, inkludert kilden, og en kilderad har sin egen markør.
  - id: approve
    kind: terminal
    through: 14
    caption: "Tjue rader, én gjennomgang, og køen er fri for fransk."
    text: >-
      Køen kommer tilbake som et endrings­sett, så godkjenning er én gjennomgang i stedet for tjue besøk. Hver godkjenning lagres i loggen i det øyeblikket den gis, med et navn knyttet til den.
  - id: queue
    kind: artifact
    artifact: queue
    caption: Fransk er borte. Kilderad­ene er fortsatt åpne.
    text: >-
      Etterpå er de franske radene borte og kilde­radene er fortsatt her, fordi Voltway godkjenner sin egen ordlyd før en oversettelse sendes fra det.
  - id: outro
    kind: outro
    text: >-
      Spør ditt eget prosjekt om ett språk om gangen, og det som kommer tilbake er arbeidet, i den formen skrivekommandoen tar.
