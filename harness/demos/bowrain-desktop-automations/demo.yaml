id: bowrain-desktop-automations
title: Nobody has to remember to translate anything
subtitle: A rule fires on push, and a run catches the project up.
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-desktop-automations
terminal: desktop
target: bowrain-desktop
brand: bowrain
needsAi: false
oneshot: true
outro:
  line: The same pass, started from a terminal.
  pointer: kapi up
aspects:
  - Standing rules per project
  - A run started on camera
  - Parked work waits in review

narration:
  - id: title
    kind: title
    text: >-
      Nobody has to remember to translate anything. A rule on the project runs
      the loop on the server whenever content is pushed.

  - id: rule
    kind: desktop
    beat: rule
    caption: What fires, and on what.
    hold: 13
    text: >-
      The rules are a project's standing instructions: what fires, and on what.
      Push content from a repository or a connector, and the server runs the
      loop without anyone opening this screen or filing a request for it.

  - id: run-now
    kind: desktop
    beat: run-now
    caption: A pass, started by hand.
    hold: 14
    crop: { selector: '[data-testid="runs-list"]' }
    zoom: 1.5
    text: >-
      Run now starts the next pass by hand. Choose the scope, and a real run
      begins on the server, with the team's keys and the team's gates, and
      appears at the top of the table straight away.

  - id: settled
    kind: desktop
    beat: settled
    caption: Up to date, or parked with a reason.
    hold: 14
    crop: { selector: '[data-testid="run-row"]' }
    zoom: 2
    highlight: { selector: '[data-testid="run-row"]' }
    text: >-
      Each run catches the project up and then settles. The row says what every
      language got out of the pass, and anything that needs a person is parked
      rather than shipped, which is the honest half of running this
      automatically.

  - id: parked
    kind: desktop
    beat: parked
    caption: Parked work is already in review.
    hold: 12
    text: >-
      Parked is not a dead end. That work is already in the review queue,
      waiting for somebody who holds the permission for that language, and the
      next run picks up where this one stopped.

  - id: outro
    kind: outro
    text: >-
      The same pass runs from a terminal, with one command.
