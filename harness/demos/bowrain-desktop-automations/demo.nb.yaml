id: bowrain-desktop-automations
title: Automatiseringer og kjøringer
subtitle: Regler kjører løkken på serveren; kjøringer viser hver runde som tar prosjektet à jour.
tagline: serversidens plattformkompanjong til kapi
kind: use-case
publishAs: bowrain-desktop-automations
terminal: desktop
target: bowrain-desktop
brand: bowrain
needsAi: false
oneshot: true
aspects:
  - Automatiseringsregler
  - "Løkken, kjørt på serveren"
  - Kjøringshistorikk per runde
