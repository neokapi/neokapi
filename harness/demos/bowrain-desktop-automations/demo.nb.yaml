id: bowrain-desktop-automations
title: Ingen trenger å huske å oversette noe
subtitle: "En regel utløses ved push, og en kjøring oppdaterer prosjektet."
tagline: the server-side platform companion to kapi
kind: use-case
publishAs: bowrain-desktop-automations
terminal: desktop
target: bowrain-desktop
brand: bowrain
needsAi: false
oneshot: true
outro:
  line: "Samme kjøring, startet fra en terminal."
  pointer: kapi up
aspects:
  - Standing rules per project
  - A run started on camera
  - Work waiting for review is in the review queue

narration:
  - id: title
    kind: title
    text: >-
      Ingen trenger å huske å oversette noe. En regel på prosjektet kjører prosessen på serveren hver gang innhold pushes.
  - id: rule
    kind: desktop
    beat: rule
    caption: "Hva som utløses, og av hva."
    hold: 15
    text: >-
      Reglene er prosjektets faste instrukser: hva som utløses, og av hva. Når du pusher innhold fra et repositorium eller en kobling, kjører serveren prosessen uten at noen må åpne dette skjermbildet eller sende en forespørsel.
  - id: run-now
    kind: desktop
    beat: run-now
    caption: En kjøring startet manuelt.
    hold: 15
    crop: { selector: '[data-testid="runs-list"]' }
    text: >-
      «Kjør nå» starter neste kjøring manuelt. Velg omfanget, så starter en kjøring på serveren med teamets nøkler og kontrollpunkter. Den vises øverst i tabellen med én gang.
  - id: settled
    kind: desktop
    beat: settled
    caption: "Oppdatert, eller venter på vurdering med en begrunnelse."
    hold: 16
    crop: { selector: '[data-testid="run-row"]' }
    highlight: { selector: '[data-testid="run-row"]' }
    text: >-
      Hver kjøring oppdaterer prosjektet og avsluttes. Raden viser resultatet for hvert språk. Alt som krever menneskelig vurdering, venter på gjennomgang i stedet for å bli publisert.
  - id: parked
    kind: desktop
    beat: parked
    caption: "Arbeid som venter på vurdering, er allerede sendt til vurdering."
    hold: 14
    text: >-
      Arbeid som venter på vurdering, ligger allerede i vurderingskøen for noen med tilgang til språket. Neste kjøring fortsetter der denne stoppet.
  - id: outro
    kind: outro
    text: >-
      Du kan starte samme kjøring fra en terminal med én kommando.
