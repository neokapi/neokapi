id: kapi-desktop-flows
title: Sett sammen flyter for et prosjekt
subtitle: Rørledningene et prosjekt kjører over innholdet sitt.
tagline: the visual companion to the kapi command line
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read — uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Project flows
  - Pipelines of steps
  - AI translation & QA
  - Composable tools

narration:
  - id: title
    kind: title
    text: >-
      Et prosjekt trenger ingen flytdefinisjoner for å oversette: Kapi leveres med en innebygd standardflyt — gjenbruk av oversettelsesminne, deretter KI-oversettelse, deretter kontroller.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Bring up to date kjører den standard flyten slik den er. Vi åpner KapiMart-eksemplet for å se når et prosjekt definerer sin egen.
  - id: open-project
    kind: desktop
    beat: open-project
    caption: KapiMart — åpnet fra startskjermen.
    text: >-
      KapiMart åpnes fra startskjermen, med sitt eget innhold, innstillinger og flyter.
  - id: library
    kind: desktop
    beat: library
    caption: Flyt-fanen viser pipelinene som er definert i prosjektet.
    text: >-
      Flyter-fanen i verktøykassen er nødutgangen: rørledninger som prosjektet definerer når standarden ikke er tilstrekkelig, lagret sammen med det og delt via versjonskontroll.
  - id: library-zoom
    kind: desktop
    beat: library-zoom
    caption: Hver flyt er en navngitt sekvens av trinn.
    text: >-
      Hver enkelt er en navngitt sekvens av trinn — en enkel oversettelse, en oversettelse med kvalitetskontroller og en pseudo-oversettelse for testing.
  - id: open-flow
    kind: desktop
    beat: open-flow
    caption: Å åpne en flyt viser dens pipeline.
    text: >-
      Å åpne translate-and-qa avslører pipelinen.
  - id: pipeline
    kind: desktop
    beat: pipeline
    caption: "Kilden flyter gjennom KI-oversettelse, deretter en kvalitetskontroll."
    text: >-
      Kilden flyter gjennom KI-oversettelse og deretter en kvalitetskontroll før den skrives tilbake — samme form som den innebygde standarden, nå din å omorganisere, legge til eller utvide.
  - id: outro
    kind: outro
    text: >-
      Standard-flyten dekker de fleste prosjekter uten noen konfigurasjon. Når den ikke gjør det, setter du sammen din egen — visuelt, lagret med prosjektet, kjør hvor som helst.
# Norwegian Bokmål narration is generated, not authored here: `make l10n`
# recycles this file into the sibling demo.nb.yaml sidecar, which the harness
# overlays at load time. Fix a translation in the demo-narration seed under
# .kapi/memory/ and regenerate — never edit the sidecar.
# Terminology follows .kapi/voice.yaml (nb) and .kapi/terms.json
# (flow → flyt; "pipeline" stays English in nb).
