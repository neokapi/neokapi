id: kapi-desktop-flows
title: Compose the flow, run it anywhere
subtitle: The default flow covers most projects; the Toolbox is where you change it.
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The Toolbox pillar
  - Project flows
  - Pipelines of steps
  - The project default
outro:
  line: Compose it here, run it from either surface.
  pointer: kapi run translate-and-qa

narration:
  - id: title
    kind: title
    text: >-
      A project translates without any flow definition. When the default is
      not enough, you compose your own in the Toolbox, and what you save there
      runs unchanged from the command line.

  - id: open-flow
    kind: desktop
    beat: open-flow
    caption: "Two steps: translate, then check."
    crop: { x: 0.02, y: 0.16, w: 0.58, h: 0.34 }
    text: >-
      The Toolbox holds what a project runs over its content. A flow is a
      named sequence of steps. This one translates and then checks, the same
      shape as the built-in default.

  - id: add-step
    kind: desktop
    beat: add-step
    caption: A third step, from the project's tools.
    crop: { x: 0.02, y: 0.16, w: 0.58, h: 0.34 }
    text: >-
      Add a step from a picker of every tool the project can reach. Recycle
      answers from the project's own content memory, so the provider is asked
      only for what memory cannot fill.

  - id: reorder
    kind: desktop
    beat: reorder
    caption: Moved before translate.
    crop: { x: 0.02, y: 0.16, w: 0.58, h: 0.34 }
    highlight: { selector: '[data-testid="step-chips"]' }
    text: >-
      Recycle has to run before translate to save it work, so drag the step to
      the front. The strip in the header follows.

  - id: default
    kind: desktop
    beat: default
    caption: Marked default. Bring up to date runs it.
    crop: { x: 0.02, y: 0.16, w: 0.58, h: 0.34 }
    highlight: { selector: '[data-testid="flow-default-badge"]' }
    text: >-
      Mark it as the project's default. From then on the button on the Project
      page runs this flow, and so does the same flow name from a terminal in
      the same folder.

  - id: outro
    kind: outro
    text: >-
      Compose the flow where you can see it, then run it from either surface.
