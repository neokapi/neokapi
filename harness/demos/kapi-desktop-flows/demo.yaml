id: kapi-desktop-flows
title: Edit a flow
subtitle: Add a step, change the order, and make it the project's default.
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Steps
  - Step order
  - The default flow
outro:
  line: Click Bring up to date, and the app runs your flow.

# Cue word the walk waits for: reorder (drag).
narration:
  - id: title
    kind: title
    text: >-
      A flow is the list of steps that run when you click Bring up to date.
      You'll add a step that reuses earlier translations.

  - id: open-flow
    kind: desktop
    beat: open-flow
    caption: Translate, then check.
    text: >-
      In Project Settings, open the Flows tab and click translate-and-qa. Its
      two steps are Translate, then Quality Check.

  - id: add-step
    kind: desktop
    beat: add-step
    caption: Add the Recycle step.
    text: >-
      Click Add step and search for recycle. Recycle reuses translations you
      already have, so only new text goes to the provider.

  - id: reorder
    kind: desktop
    beat: reorder
    caption: Recycle runs first.
    text: >-
      Recycle must run before Translate. Drag it to the top.

  - id: default
    kind: desktop
    beat: default
    highlight: { selector: '[data-testid="flow-default-badge"]' }
    caption: Use this flow by default.
    text: >-
      Turn on Default flow. Bring up to date now uses this flow.

  - id: outro
    kind: outro
    text: >-
      Add the steps you need. Bring up to date runs them in order.
