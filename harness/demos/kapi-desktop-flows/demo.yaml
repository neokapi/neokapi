id: kapi-desktop-flows
title: Edit a flow
subtitle: Add a step, change the order, and make it the project's default.
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The Flows tab
  - Steps
  - Step order
  - The default flow
outro:
  line: Edit the flow here. Run it from the app or the command line.
  pointer: kapi run translate-and-qa

narration:
  - id: title
    kind: title
    text: >-
      A flow is the list of steps kapi runs on your content. Every project
      starts with a built-in flow. To change the steps, edit a flow on the
      Flows tab in Project Settings. The command line runs the same flow.

  - id: open-flow
    kind: desktop
    beat: open-flow
    caption: Two steps. Translate, then check.
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    text: >-
      Open the Flows tab and click translate-and-qa. This flow has two
      steps. Translate runs first, then Quality Check.

  - id: add-step
    kind: desktop
    beat: add-step
    caption: Add the Recycle step.
    crop: { x: 0.34, y: 0.28, w: 0.32, h: 0.44 }
    text: >-
      Click Add step, and search for recycle. Recycle reuses translations
      from your content memory, so your provider translates only the rest.

  - id: reorder
    kind: desktop
    beat: reorder
    caption: Recycle now runs first.
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    highlight: { selector: '[data-testid="step-chips"] > span:first-child' }
    text: >-
      Recycle has to run before Translate. Drag it to the top. The list of
      steps under the name shows the new order.

  - id: default
    kind: desktop
    beat: default
    caption: This flow is now the default.
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    highlight: { selector: '[data-testid="flow-default-badge"]' }
    text: >-
      Turn on Default flow. A Default label appears next to the name. When
      you click Bring up to date, the app now runs this flow.

  - id: outro
    kind: outro
    text: >-
      Edit the flow in the app, and run it from the app or from a terminal.
