id: kapi-desktop-flows
title: Compose the flow, run it anywhere
subtitle: The default flow covers most projects; the Toolbox is where you change it.
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - The Toolbox pillar
  - Project flows
  - Pipelines of steps
  - The project default
outro:
  line: Compose it here, run it from either surface.
  pointer: kapi run translate-and-qa

narration:
  - id: title
    kind: title
    text: >-
      A project needs no flow definition to translate. When the default is not
      enough, the Toolbox is where you compose your own, and what you save there
      runs unchanged from the command line.

  - id: open-flow
    kind: desktop
    beat: open-flow
    caption: Two steps. Translate, then check.
    crop: { selector: '[data-testid="linear-flow-editor"]' }
    zoom: 1.3
    text: >-
      A flow is a named sequence of steps over the content a project holds. This
      one translates and then checks, which is the shape of the built-in default
      and the starting point for changing it.

  - id: add-step
    kind: desktop
    beat: add-step
    caption: A third step, from the tools the project has.
    crop: { selector: '[data-testid="linear-flow-editor"]' }
    zoom: 1.3
    text: >-
      Adding a step is a picker over every tool the project can reach. Recycle
      is the one that answers from the project's own content memory, so the
      provider is asked only for what memory cannot.

  - id: reorder
    kind: desktop
    beat: reorder
    caption: Moved in front of the translate it spares.
    crop: { selector: '[data-testid="linear-flow-editor"]' }
    zoom: 1.3
    highlight: { selector: '[data-testid="step-row"]' }
    text: >-
      Order is the whole point of putting it there. Recycle has to run before
      the translate for the translate to have less to do, so the step moves to
      the front and the strip in the header follows it.

  - id: default
    kind: desktop
    beat: default
    caption: Marked default. Bring up to date runs this one.
    crop: { selector: '[data-testid="linear-flow-editor"]' }
    zoom: 1.2
    highlight: { selector: '[data-testid="flow-default-badge"]' }
    text: >-
      Marking it the project's default is what binds it. From here the one
      button on the home runs this flow, and so does the same flow name from a
      terminal in the same folder.

  - id: outro
    kind: outro
    text: >-
      Compose the flow where you can see it, then run it from whichever surface
      you happen to be in.
