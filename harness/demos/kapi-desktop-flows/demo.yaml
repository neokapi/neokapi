id: kapi-desktop-flows
title: Edit a flow
subtitle: Add a step, change the order, and make it the project's default.
kind: use-case
publishAs: kapi-desktop-flows
terminal: desktop
brand: desktop
needsAi: false
# One continuous narration read: uniform voice speed and tone across scenes.
oneshot: true
aspects:
  - Steps
  - Step order
  - The default flow
outro:
  line: Click Bring up to date, and the app runs your flow.

# Cue word the walk waits for: reorder (drag).
narration:
  - id: title
    kind: title
    text: >-
      A flow is the list of steps the app runs when you bring a project up to
      date. In this video, you add a step that reuses your earlier
      translations.

  - id: open-flow
    kind: desktop
    beat: open-flow
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    caption: Translate, then check.
    text: >-
      In Project Settings, open the Flows tab and click translate-and-qa. It
      translates first, then checks the result.

  - id: add-step
    kind: desktop
    beat: add-step
    crop: { x: 0.34, y: 0.28, w: 0.32, h: 0.44 }
    caption: Add the Recycle step.
    text: >-
      Click Add step, and search for recycle. Recycle reuses translations you
      already have, so only new text is sent to be translated.

  - id: reorder
    kind: desktop
    beat: reorder
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    caption: Recycle runs first.
    text: >-
      Recycle has to run first. Drag it to the top.

  - id: default
    kind: desktop
    beat: default
    crop: { x: 0.03, y: 0.11, w: 0.5, h: 0.36 }
    highlight: { selector: '[data-testid="flow-default-badge"]' }
    caption: Use this flow by default.
    text: >-
      Turn on Default flow. From now on, Bring up to date runs this flow.

  - id: outro
    kind: outro
    text: >-
      Add the steps you need, and Bring up to date runs them in order.
