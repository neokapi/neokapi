id: bowrain-web-correction-loop
title: Review recurring corrections before making a rule
subtitle: Repeated corrections become candidates for explicit review.
tagline: the correction-learning loop on bowrain
kind: use-case
publishAs: bowrain-web-correction-loop
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Corrections made over MCP count too.
  pointer: bowrain.cloud/docs/server/context-voice
aspects:
  - Corrections that recur become candidates
  - The blast radius, before it lands
  - Promoted into a versioned check

narration:
  - id: title
    kind: title
    text: >-
      Bowrain collects recurring corrections as candidates. A reviewer inspects
      their effect and explicitly promotes a candidate before it becomes a
      versioned check.

  - id: candidates
    kind: desktop
    beat: candidates
    caption: A phrasing the team kept correcting.
    hold: 18
    text: >-
      These are the candidates. Each is a phrasing the team kept changing: the
      word that missed the voice, what they replaced it with, and how many
      separate corrections stand behind it. One correction proves nothing, so
      below the threshold nothing is proposed at all.

  - id: evaluate
    kind: desktop
    beat: evaluate
    caption: How much content this would newly flag.
    hold: 17
    crop: { selector: '[role="dialog"]' }
    text: >-
      Before promoting anything, preview the blast radius. The dialog counts how
      much of the content already in the project this rule would newly flag, so
      nobody promotes a rule and discovers its cost from the failures it causes
      the following morning.

  - id: promote
    kind: desktop
    beat: promote
    caption: Promoted, and versioned on the profile.
    hold: 18
    text: >-
      Promote it, and the correction becomes a deterministic check, versioned on
      the voice profile and used by later checks governed by that profile, for the people writing
      and the AI tools alike. The candidate leaves the queue, and compliance is
      watched from then on for drift.

  - id: outro
    kind: outro
    text: >-
      Review the recurring correction, inspect its scope, then promote the
      candidate. Later checks can apply that versioned rule where it belongs.
