id: bowrain-web-correction-loop
title: Se gjennom gjentakende rettelser før du lager en regel
subtitle: Gjentatte rettelser blir kandidater for eksplisitt gjennomgang.
tagline: the correction-learning loop on bowrain
kind: use-case
publishAs: bowrain-web-correction-loop
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read: uniform voice across scenes.
oneshot: true
outro:
  line: Rettelser gjort via MCP teller også.
  pointer: bowrain.cloud/docs/server/context-voice
aspects:
  - Corrections that recur become candidates
  - The blast radius, before it lands
  - Promoted into the workspace's terms

narration:
  - id: title
    kind: title
    text: >-
      Bowrain samler gjentakende rettelser som kandidater. En anmelder undersøker effekten og fremhever eksplisitt en kandidat før den blir en kontroll.
  - id: candidates
    kind: desktop
    beat: candidates
    caption: En formulering teamet fortsatte å rette.
    hold: 18
    text: >-
      Dette er kandidatene. Hver er en formulering teamet fortsatte å endre: ordet som ikke traff stemmen, hva de byttet det ut med, og hvor mange separate rettelser som ligger bak det. Én rettelse beviser ingenting, så under terskelen foreslås ingenting.
  - id: evaluate
    kind: desktop
    beat: evaluate
    caption: Hvor mye innhold dette ville flagge på nytt.
    hold: 17
    text: >-
      Før du fremhever noe, forhåndsvis rekkevidden. Dialogen teller hvor mye av innholdet som allerede er i prosjektet denne regelen ville flagge på nytt, slik at ingen fremhever en regel og oppdager kostnaden fra feilene den forårsaker neste morgen.
  - id: promote
    kind: desktop
    beat: promote
    caption: Fremhevet i termene og registrert som din.
    hold: 18
    text: >-
      Fremhev den, og rettelsen blir en regel i arbeidsområdets termer, som senere kontroller håndhever for både skribenter og AI-verktøy. Kandidaten flyttes fra Foreslått til Etablert, med registrering av hvem som fremhevet den og når.
  - id: outro
    kind: outro
    text: >-
      Se gjennom den gjentakende rettelsen, undersøk omfanget, og fremhev kandidaten. Senere kontroller kan bruke regelen der den hører hjemme.
