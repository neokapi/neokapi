id: bowrain-web-correction-loop
title: Sjekker som lærer av korreksjoner
subtitle: Hver korreksjon blir en versjonert sjekk.
tagline: korreksjonslæringssløyfen på bowrain
kind: use-case
publishAs: bowrain-web-correction-loop
terminal: desktop
target: web
brand: bowrain
needsAi: false
# One continuous narration read — uniform voice across scenes.
oneshot: true
aspects:
  - Gjentatte rettelser blir kandidater
  - Gjennomgå og fremhev til en versjonert regel
  - Rekkevidde før det lander
  - "Etterlevelse, overvåket for avvik"

narration:
  - id: title
    kind: title
    text: >-
      Bowrain — der et teams kontroller vokser av seg selv: hver korreksjon blir en versjonert kontroll.
  - id: intro
    kind: desktop
    beat: intro
    text: >-
      Med kapi alene er sjekker lokale — et sjekksett bundet til én prosjektoppskrift, versjonert med det repositoriet. Bowrain versjonerer dem for organisasjonen: koreksjonene et team gjentatte ganger gjør, blir sjekker som gjennomgås, fremmes og håndheves overalt der organisasjonen genererer innhold.
  - id: kandidater
    kind: desktop
    beat: kandidater
    caption: "Kandidatregler, hentet fra virkelige rettelser."
    text: >-
      Her er kandidatene. Hver enkelt er en formulering teamet gjentatte ganger korrigerte — det merkefremmed ordet, hva de endret det til, og hvor mange korreksjoner tilbake det er.
  - id: evaluate
    kind: desktop
    beat: evaluer
    caption: "Nedslagsfeltet, før regelen trer i kraft."
    text: >-
      Før du fremhever, forhåndsvis nedslagsfeltet — hvor mye eksisterende innhold regelen ville flagge på nytt på tvers av et prosjekt, slik at en endring aldri er en overraskelse.
  - id: forfrem
    kind: desktop
    beat: forfrem
    caption: "Forfrem — korreksjonen blir en håndhevet, versjonert sjekk."
    text: >-
      Fremhev den, og korreksjonen blir en deterministisk kontroll, versjonert og håndhevet på hver fremtidig generering, for alle og alle AI-verktøy.
  - id: avgjort
    kind: desktop
    beat: avgjort
    caption: Én feil mindre som kan gjenta seg.
    text: >-
      Kandidaten er fjernet fra køen — nå en regel. Etterlevelse overvåkes for avvik, så hvis det skjer, vet teamet om det.
  - id: outro
    kind: outro
    text: >-
      Korriger én gang, og regelen som forhindrer at det gjentar seg, blir forfattet, versjonert og delt — slik en regresjonstest stopper en fikset feil fra å komme tilbake.
