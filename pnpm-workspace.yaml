# pnpm reads overrides and most settings from this file; the package.json
# "pnpm" field and several .npmrc keys are not honored (https://pnpm.io/settings).
#
# The members are globs because pnpm includes a globbed directory only when it
# holds a package.json, so the bowrain-web and bowrain-ctrl Docker builds, which
# copy a subtree, still see a valid smaller workspace. The globs match the
# frontend members and nothing else. bowrain/web/landing is listed so the
# standalone bowrain/web/docs stays out. bowrain/mobile is listed because it is
# the one Apache-licensed directory beside the AGPL apps.
packages:
  - packages/*
  - storybook
  - web
  - apps/kapi-desktop/frontend
  - bowrain/packages/*
  - bowrain/storybook
  - bowrain/emails
  - bowrain/apps/*
  - bowrain/apps/bowrain/frontend
  - bowrain/mobile
  - bowrain/web/landing

# Link a local workspace package in place of a registry version whenever the
# local version satisfies the range. Every internal @neokapi/* dependency is
# declared "*", so each resolves to its workspace copy.
linkWorkspacePackages: true

# Hoist all dependencies into the root node_modules, an npm-like flat layout,
# while pnpm's content-addressed store keeps per-worktree installs cheap
# hardlinks. One React is shared, and workspace packages consumed from source
# (@neokapi/ui-primitives importing @codemirror/*, for one) resolve without
# declaring every transitive dependency.
shamefullyHoist: true

# npm always runs pre/post scripts; keep that under pnpm so hooks like
# web' prebuild → gen-reference still fire automatically.
enablePrePostScripts: true

# vite-plus ships its own vite build as @voidzero-dev/vite-plus-core. The
# `vite` alias below, applied through overrides, makes plugins such as
# @vitejs/plugin-react resolve that same build. Two builds would give
# vite.config.ts two Plugin/UserConfig type universes and fail with TS2321 or
# TS2769.
#
# The alias names the exact core version the catalog's vite-plus depends on
# (`npm view vite-plus@<version> dependencies.vite`), which is not the
# vite-plus version: vite-plus 1.7.0 depends on core 8.3.8000. `vp migrate`
# moves both, and scripts/audit-vite-alias.sh compares the alias with
# node_modules/vite-plus/package.json.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  # The official SQLite WebAssembly build the browser engine's database driver
  # runs on (packages/engine/src/sqlite.ts, core/storage/driver_js.go). Pinned
  # exactly: the Go driver, the JavaScript bridge and the sqlite3.wasm staged
  # beside the engine (make web-wasm-cli) must be one SQLite release.
  "@sqlite.org/sqlite-wasm": 3.53.4-build2
  vite-plus: 1.7.0

# Cross-workspace version pins (was the root package.json npm "overrides").
overrides:
  "@tanstack/react-query": "5.108.2"
  "webpackbar": "^7.0.0"
  vite@*: 'catalog:'

# The aliased vite reports the core's own version. From vite-plus 1.7.0 that is
# 8.3.8000, which satisfies the `^8` peer ranges most plugins declare, but a
# plugin whose range excludes it would make pnpm reject the alias and silently
# fall back to a real vite that satisfies the range. So the peer check for vite
# stays fully relaxed (allowAny alone is not enough; allowedVersions is what
# keeps the alias).
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  core-js: true
  esbuild: true
  msw: true
  onnxruntime-node: false
  protobufjs: true
  sharp: false

patchedDependencies:
  icu@2.2.1: patches/icu@2.2.1.patch

# Agent skills a dependency ships: pnpm 12 asks whether each such package may
# provide them (`pnpm permissions`). They are denied: the agent guidance in this repository is
# curated in .claude/ and host/skills, and a dependency's skill would add
# instructions to every agent session that nobody here reviewed. Leaving them
# undecided prints "Agent skills awaiting approval" on every install.
permissions:
  '@tanstack/react-router':
    skills: false
  expo-sqlite:
    skills: false
