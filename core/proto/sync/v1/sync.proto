// sync.proto — Sync protocol messages.
// Defines the content layer for chunked, diff-based content sync between a
// project and a venue.
//
// These messages live in their own proto + Go package (syncv1), beside the
// canonical content schema, so any client can speak the sync wire without
// pulling in a venue's service surface. The proto package name carries no
// venue noun and the encoding depends only on field numbers, so the schema is
// independent of where either side of the exchange lives.
//
// Run/segment content embeds the canonical content-model schema
// (core/proto/content/v1, see AD-034) instead of redefining it. The former
// SyncSegment/SyncRun/SyncTextRun/… messages were field-for-field identical
// to SegmentMessage/RunMessage/TextRunMessage/…, so this substitution is
// wire-identical: same field numbers, same field types, byte-identical
// encoding. Only the sync-specific envelope (hashes, expected_hash, the
// *_json escapes) is defined here.

syntax = "proto3";

package neokapi.sync.v1;

import "core/proto/content/v1/content.proto";

option go_package = "github.com/neokapi/neokapi/core/proto/sync/v1;syncv1";

// ---------------------------------------------------------------------------
// Freshness ref
// ---------------------------------------------------------------------------

// SyncRef is a stream's freshness ref: one composite value answering how far
// what a client holds sits from what the server holds, on every axis at once
// (core/ref.Ref).
//
// The four components are not the same kind of value. `content` is a monotonic
// position in the stream's change feed — ahead and behind are meaningful and a
// transfer resumes from it. The other three are identity hashes, compared for
// equality and for nothing else: two unequal hashes carry no ordering, so the
// ref reports that governance moved and leaves the resolution to a caller who
// can ask a human.
//
// A writer asserts only the component it owns (SyncManifest.expected_ref), so
// ordinary content traffic — which moves nothing but the position — can never
// manufacture a governance conflict for a writer nowhere near it. An empty
// component asserts nothing, which is what keeps the compare-and-swap additive:
// a client that predates the ref sends none and writes exactly as before.
message SyncRef {
  // Content is the position in the stream's change feed (change_log.seq).
  int64 content = 1;

  // Context identifies the governing context: which collections exist, the
  // point each occupies, and the voice profile governing it. It is the same
  // fold SyncPushInit.context_hash negotiates on.
  string context = 2;

  // Terms identifies the governed terminology in force for the workspace.
  string terms = 3;

  // Decisions identifies the committed decision record for this stream.
  string decisions = 4;
}

// ---------------------------------------------------------------------------
// Push init — Merkle tree diff negotiation
// ---------------------------------------------------------------------------

// SyncPushInit is the first step in a push. The client sends item-level
// hashes so the server can compute the diff.
message SyncPushInit {
  string project_id = 1;
  string stream = 2;
  repeated string content_types = 3;  // "blocks", "context", "terms", "memory", "media"

  // Merkle tree: item-level hashes (item_name → hash of block hashes).
  map<string, string> item_hashes = 4;

  // Fast path: root hash of all item hashes. If server matches, nothing changed.
  string root_hash = 5;

  // Collection-level hashes for non-block content.
  string terms_hash = 6;
  string memory_hash = 7;

  // Fast path for the context content type: a hash over every declared
  // collection's context entry (see SyncContextEntry.content_hash). When it
  // matches the server's, the recipe's declared structure and governance are
  // already in force and the whole context reconcile is skipped.
  string context_hash = 8;

  // The names of the content collections the recipe declares. Sent beside
  // context_hash so the server can answer which collections it holds that the
  // recipe no longer declares — the context content type's counterpart to
  // deleted_items, and reported for exactly the same reason: the server says
  // what diverged, it does not act on it.
  repeated string collections = 9;
}

message SyncPushInitResponse {
  string upload_id = 1;
  string status = 2;  // "unchanged", "diff_required", "full_upload"

  // Items that need block-level diff.
  repeated string changed_items = 3;

  // Items on server that client didn't include (upstream deletions).
  repeated string deleted_items = 4;

  // New items the client has that server doesn't.
  repeated string new_items = 5;

  // Whether terms/content memory need re-syncing.
  bool terms_changed = 6;
  bool memory_changed = 7;

  int32 unchanged_item_count = 8;

  // Whether the declared context — collections, their coordinates, their
  // governance — differs from what the server holds. False means the recipe's
  // structure is already in force and the manifest need not carry it.
  bool context_changed = 9;

  // Collections the server holds under recipe ownership that this push no
  // longer declares. REPORTED, NEVER ACTED ON: a collection is where content
  // lives, and a recipe edit is not consent to drop the server-side content
  // grouped under it. The symmetry with deleted_items is deliberate.
  repeated string undeclared_collections = 10;

  // The server's current freshness ref for this stream, so a push that has
  // already paid for a round trip does not pay for a second one to learn what
  // it must assert in the commit that follows.
  SyncRef ref = 11;
}

// ---------------------------------------------------------------------------
// Push diff — block-level negotiation per changed item
// ---------------------------------------------------------------------------

message SyncItemDiff {
  string upload_id = 1;
  string item_name = 2;
  map<string, string> block_hashes = 3;  // block_id → content_hash
}

message SyncItemDiffResponse {
  // Blocks to upload (new or changed on client).
  repeated string needed = 1;

  // Blocks the server has that client doesn't (upstream deletions within item).
  repeated string deleted = 2;

  // Blocks changed by another client since the requesting client last synced.
  repeated string conflicts = 3;

  // Pre-signed URLs for uploading needed blocks as chunks.
  repeated string chunk_urls = 4;

  // Transport mode: "direct" (SAS URLs) or "proxy" (upload through API).
  string transport = 5;
}

// ---------------------------------------------------------------------------
// Push commit — manifest describing what was uploaded
// ---------------------------------------------------------------------------

message SyncManifest {
  string upload_id = 1;
  string project_id = 2;
  string stream = 3;

  // Chunks uploaded to blob storage.
  repeated ChunkRef chunks = 4;

  // Item metadata.
  repeated SyncItemMeta items = 5;

  // Who and what pushed.
  string actor_id = 6;
  string workspace_slug = 7;
  string connector_id = 8;
  map<string, string> context = 9;

  // The context content type: the collections the recipe declares, the point
  // each occupies in the project's context space, and the governance resolved
  // for that point. It rides in the manifest rather than in a chunk because it
  // is the shape the uploaded items are stored INTO — one push is one
  // consistent state, so the collections must land in the same transaction as
  // the blocks that reference them.
  repeated SyncContextEntry contexts = 10;

  // ExpectedRef is the compare-and-swap assertion: the governance components
  // this push last observed on the server. The server rejects the commit when a
  // component it asserts has moved since, and the client renders that as
  // "governance moved — pull first".
  //
  // Only the components a push actually writes are asserted, and only the ones
  // it carries a value for. The position is never asserted: block traffic moves
  // it constantly and by design, and letting it fail a governance write is the
  // conflation the composite ref exists to end.
  SyncRef expected_ref = 11;
}

message ChunkRef {
  int32 index = 1;
  string content_type = 2;  // "blocks", "terms", "memory", "media"
  string hash = 3;          // SHA-256 of compressed bytes
  int32 record_count = 4;
  int64 byte_size = 5;
}

// ---------------------------------------------------------------------------
// Chunk envelope — typed batch of records
// ---------------------------------------------------------------------------

// SyncChunk is the unit of transfer. Each chunk contains a batch of
// typed records. A single push can mix content types across chunks.
message SyncChunk {
  string content_type = 1;
  int32 record_count = 2;

  // Exactly one of these is populated (determined by content_type).
  repeated SyncBlock blocks = 10;
  repeated SyncTerm terms = 11;
  repeated SyncMemoryEntry memory_entries = 12;
  repeated SyncMedia media = 13;
  // Future: repeated SyncQAResult qa_results = 14;
  // Future: repeated SyncActivity activities = 15;
}

// ---------------------------------------------------------------------------
// Content types
// ---------------------------------------------------------------------------

// SyncBlock is the sync-protocol envelope around the canonical Block content:
// canonical SegmentMessage/RunMessage payloads (core/proto/content/v1) plus
// the sync-specific fields — item scoping, hashes, and the *_json escapes.
// EXPLICITLY-LABELED ENVELOPE: the run/segment content is the canonical
// schema; only the envelope is defined here.
message SyncBlock {
  string id = 1;
  string item_name = 2;
  string name = 3;
  string type = 4;
  string mime_type = 5;
  bool translatable = 6;

  // Source content (canonical schema; formerly the wire-identical SyncSegment).
  repeated neokapi.content.v1.SegmentMessage source = 7;
  string source_text = 8;  // plain text convenience

  // Translations per locale.
  map<string, SyncSegmentList> targets = 9;

  // Metadata.
  map<string, string> properties = 10;
  bytes annotations_json = 11;

  // Structure.
  bytes skeleton_json = 12;
  bool preserve_whitespace = 13;
  bytes display_hint_json = 14;
  bytes content_ref_json = 15;

  // Extensible connector data.
  map<string, string> connector_data = 16;

  // Conflict detection: hash the client last saw. Server rejects if
  // current hash differs (another client changed it).
  string expected_hash = 17;

  // Content hash for diff computation.
  string content_hash = 18;

  // Positional, run-anchored stand-off overlays: segmentation, term, entity,
  // qa, alignment, term-candidate, and any plugin-defined type. Carried as the
  // canonical OverlayMessage (core/proto/content/v1) — typed, not an opaque
  // JSON blob — so every overlay kind, its run-index anchors, props, variant,
  // and typed span value survive push→store→pull losslessly; an unknown/future
  // overlay kind round-trips by type name + JSON (its value degrades to a
  // GenericAnnotation) rather than being dropped. Unlike the content-model
  // BlockMessage — which reconstructs segmentation from its multi-segment
  // source/target boundaries and so EXCLUDES it from its overlays field — a
  // SyncBlock carries source/target as a single wire segment, so segmentation
  // rides in this list explicitly too.
  repeated neokapi.content.v1.OverlayMessage overlays = 19;

  // Source authoring locale — the locale of the source runs (Block.SourceLocale).
  string source_locale = 20;

  // Whether this block is referenced by a skeleton (Block.IsReferent).
  bool is_referent = 21;
}

// SyncSegmentList wraps a locale's segments so SyncBlock.targets can map
// locale → segments (proto3 maps cannot have repeated-message values).
// The segments themselves are the canonical schema; this wrapper is
// wire-identical to the former SyncSegmentList-of-SyncSegment.
message SyncSegmentList {
  repeated neokapi.content.v1.SegmentMessage segments = 1;
}

// SyncTerm carries a terminology concept with translations.
message SyncTerm {
  string concept_id = 1;
  string source_term = 2;
  string source_locale = 3;
  repeated SyncTermTranslation translations = 4;
  string definition = 5;
  string domain = 6;
  map<string, string> properties = 7;
  string status = 8;  // "approved", "pending", "deprecated"
  string content_hash = 9;
}

message SyncTermTranslation {
  string locale = 1;
  string term = 2;
  string status = 3;
}

// SyncMemoryEntry carries a content memory entry.
//
// This message and the `memory_entries` / `memory_hash` / `memory_changed`
// fields were renamed from their historical `TM` spelling. Message and field
// names are wire schema — serialized into the descriptor and into every
// protojson payload — so this was a breaking protocol change, taken
// deliberately while the sync protocol is pre-production. It was safe to take
// because the content-memory sync path is declared but not yet implemented:
// no producer populates these fields, and the server rejects the "memory"
// content type as unsupported (see jobs/worker_sync.go). Renaming now, before
// anything serializes them, avoids carrying the old vocabulary forever.
message SyncMemoryEntry {
  string id = 1;
  string source_locale = 2;
  string target_locale = 3;
  string source_text = 4;
  string target_text = 5;
  string origin = 6;       // "human", "mt", "ai"
  double score = 7;
  map<string, string> properties = 8;
  string content_hash = 9;
}

// SyncMedia carries a binary asset reference or inline data.
message SyncMedia {
  string id = 1;
  string item_name = 2;
  string mime_type = 3;
  string filename = 4;
  string alt_text = 5;
  int64 size = 6;

  // Exactly one of these:
  bytes inline_data = 10;   // small assets (< 256KB)
  string blob_key = 11;     // large assets: separately uploaded blob

  // Locale variants.
  string locale = 12;
  string source_media_id = 13;

  map<string, string> properties = 14;
  string content_hash = 15;  // SHA-256 of binary content
}

// ---------------------------------------------------------------------------
// Context
// ---------------------------------------------------------------------------

// Owner values for a context entity — which side of the sync is authoritative
// for it. A string rather than an enum because the manifest travels as JSON
// between the client, the commit handler and the worker, and a proto enum
// crosses that boundary as an opaque integer.
//
//   "recipe"    — kapi.yaml declares it, so git owns it. The server stores it
//                 and reads it; it does not get to change it, and a pull does
//                 not push governance back down over it.
//   "workspace" — created and governed on the server (the web hub, the editor,
//                 a connector). The recipe has no say, and a pull may carry it
//                 down as local state.
//
// Ownership is a protocol field, not server policy: the client states it, the
// server persists it verbatim, and every later decision — refusing a
// server-side mutation, skipping a collection on pull — is a lookup of this
// one field rather than a rule reconstructed from context.
//
//   SyncContextOwnerRecipe    = "recipe"
//   SyncContextOwnerWorkspace = "workspace"

// SyncContextEntry is one content collection as the recipe declares it: the
// name its items are grouped under, the point it occupies in the project's
// context space, the governance resolved for that point, and which side owns
// it. Together the entries are the "context" content type — the project's
// declared structure and governance, carried in the push transaction rather
// than uploaded beside it.
//
// PERSISTED IDENTIFIERS. `name` and every value in `coordinates` become
// identifiers on the server: items are linked to a collection by name, and the
// coordinates are stored as the point the governance was resolved at. Renaming
// a collection in the recipe therefore does not rename it on the server — it
// declares a new one and leaves the old reported-but-undeclared.
message SyncContextEntry {
  // Name is the collection name from `collections[].name`. Non-empty: an
  // unnamed bare entry declares no collection and is not carried here.
  string name = 1;

  // Coordinates is the point the collection's `channel:` resolves to — the
  // profile on the product axis and the channel it names. Slugs, never concept
  // references.
  map<string, string> coordinates = 2;

  // Channel is the collection's value on the one axis the framework reads for
  // itself (core/project.ChannelAxis), resolved by the client. It selects the
  // matching override inside the voice profile.
  string channel = 3;

  // VoiceProfile is the NAME of the voice profile governing this collection —
  // the linkage key the workspace brand hub upserts by. Empty when the
  // collection's point binds no voice.
  string voice_profile = 4;

  // VoiceProfileJson is the authored content of that profile, so the push
  // carries the governance itself and not merely a reference to one the server
  // may not hold. Sent once per distinct profile name in a push; later entries
  // naming the same profile carry only the name. Empty on a --no-brand push,
  // which reduces the entry to structure without governance.
  bytes voice_profile_json = 5;

  // Owner is "recipe" or "workspace" (see above).
  string owner = 6;

  // ContentHash is the entry's own hash, over the fields above. The server
  // stores it and compares it: an entry whose hash is unchanged is not
  // rewritten, so a re-push of an unedited recipe does not churn the row.
  string content_hash = 7;

  // Preview is where this collection's strings can be read in place — the
  // component explorer or running site that shows them as a reader sees them.
  // A repository fact the server cannot derive, so it travels with the
  // collection's other declared facts. Absent when the collection declares
  // none, which is how a reviewer decides to offer document reading only.
  SyncPreviewSource preview = 8;
}

// SyncPreviewSource is a place a collection's strings can be seen in situ.
//
// The kinds differ in how a view is FOUND, not in how it renders: a Storybook
// publishes an index that maps components to stories, while a running site is
// addressed by route. What they share is the runtime bridge that pushes the
// reviewer's translations into the page, which belongs to the i18n runtime and
// not to any one host — so the kind is carried, and a host a client does not
// recognise offers no in-context reading rather than a guess.
message SyncPreviewSource {
  // Kind names how to resolve a view. "storybook" is the one implemented.
  string kind = 1;

  // URL is the root of the preview host — the published Storybook, the running
  // site — without a trailing view path.
  string url = 2;
}

// ---------------------------------------------------------------------------
// Item metadata
// ---------------------------------------------------------------------------

message SyncItemMeta {
  string name = 1;
  string format = 2;            // "json", "xliff2", "markdown" — declared, not guessed
  string encoding = 3;          // "utf-8"
  // Collection names the SyncContextEntry this item belongs to — the recipe
  // collection whose glob claims the item's path. Empty when no collection
  // claims it, which is not an error: an ad-hoc file syncs ungrouped and the
  // project's default point governs it.
  string collection = 4;
  string block_index_json = 5;
  string preview_html = 6;
  string source_language = 7;
  map<string, string> connector_data = 8;
}

// ---------------------------------------------------------------------------
// Pull
// ---------------------------------------------------------------------------

message SyncPullRequest {
  string project_id = 1;
  string stream = 2;
  int64 cursor = 3;
  int32 limit = 4;
  repeated string content_types = 5;  // filter by type (empty = all)
  repeated string locales = 6;        // filter by locale (empty = all)
}

message SyncPullResponse {
  int64 cursor = 1;
  bool has_more = 2;

  // Mixed content types in a single response.
  repeated SyncBlock blocks = 10;
  repeated SyncTerm terms = 11;
  repeated SyncMemoryEntry memory_entries = 12;
  repeated SyncMedia media = 13;

  // The project's collections, each carrying its owner. A recipe-owned entry
  // is descriptive on this path — the client reads it and leaves the local
  // governance alone, because kapi.yaml is the authority for it. A
  // workspace-owned entry is the one a pull may act on.
  repeated SyncContextEntry contexts = 14;

  // The server's freshness ref for this stream as of this page, so a pull
  // refreshes what the next write must assert without a second round trip.
  SyncRef ref = 15;
}
