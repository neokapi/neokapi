// neokapi_bridge.proto — the plugin/bridge gRPC service surface.
//
// This file holds only the BridgeService and its request/response envelope
// messages. The content-model messages (PartMessage, BlockMessage, the
// RunMessage discriminated union, overlays, skeleton, …) live in the
// canonical wire schema at core/proto/content/v1/content.proto (imported
// below). They were moved there verbatim — same field names and numbers —
// so the wire encoding is unchanged; see that file for the compatibility
// policy (field numbers frozen, no renames).
//
// The Java okapi-bridge compiles both files; content.proto keeps
// java_package "neokapi.bridge.proto" so the generated Java classes are
// unchanged.

syntax = "proto3";

package neokapi.bridge.v2;

import "core/proto/content/v1/content.proto";

option go_package = "github.com/neokapi/neokapi/core/plugin/proto/v2;bridgev2";
option java_package = "neokapi.bridge.proto";
option java_multiple_files = true;

// BridgeService is the gRPC service for the Okapi bridge.
// A single Process RPC replaces the old Open/Read/Write/Close/RoundTrip RPCs.
service BridgeService {
  // Process performs a complete document processing cycle using bidirectional
  // streaming. It supports three modes based on the ProcessHeader:
  //
  //   Read-only (no output in header):
  //     Java reads document → streams parts → ReadDone → Complete.
  //     Go calls CloseSend() when done receiving.
  //
  //   Read-write (output in header):
  //     Java reads document, retains Events, streams parts → ReadDone.
  //     Go sends processed parts back concurrently.
  //     Java's write thread applies translations to retained Events → Complete.
  //     Go calls CloseSend() when done sending.
  //
  //   Write-only (for Writer path):
  //     Same as read-write but Go ignores the read-phase parts.
  //     Go sends processed parts with target translations.
  //     Java applies and writes → Complete.
  rpc Process(stream ProcessRequest) returns (stream ProcessResponse);

  // ProcessStep runs an Okapi pipeline step on a stream of parts.
  // The client sends a StepHeader followed by PartMessages. The server
  // feeds each part through the step and returns processed parts.
  rpc ProcessStep(stream StepRequest) returns (stream StepResponse);

  // Segment runs a text segmenter and returns interior sentence/chunk
  // boundaries. It backs plugin-provided segmentation engines declared via
  // capabilities.segmenters: the host flattens a block's runs to code-masked
  // text and asks the daemon for the boundaries, then projects them back to
  // run-anchored spans. Unary — one text in, boundary offsets out.
  rpc Segment(SegmentRequest) returns (SegmentResponse);

  // Shutdown gracefully shuts down the bridge server.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// ────────────────────────────────────────────────────────────────────────────
// Process RPC messages
// ────────────────────────────────────────────────────────────────────────────

// OutputRef specifies where to write output directly on disk.
message OutputRef {
  oneof destination {
    string path = 1;  // Local filesystem path
    string uri  = 2;  // Remote/local URI
  }
}

// PartBatch holds multiple parts in a single gRPC message to amortize
// per-message overhead (proto marshal, HTTP/2 framing, flush syscalls).
message PartBatch {
  repeated neokapi.content.v1.PartMessage parts = 1;
}

// ContentBlockBatch holds multiple ContentBlocks for batched gRPC transfer.
message ContentBlockBatch {
  repeated neokapi.content.v1.ContentBlock blocks = 1;
}

// ProcessRequest is sent by the client (Go) to the server (Java).
message ProcessRequest {
  oneof request {
    ProcessHeader header = 1;                          // First message: input/output config
    neokapi.content.v1.PartMessage part = 2;           // Single processed part (legacy)
    PartBatch part_batch = 3;                          // Batched processed parts
    neokapi.content.v1.ContentBlock content_block = 5; // Single processed content block (lightweight)
    ContentBlockBatch content_batch = 6;               // Batched processed content blocks (preferred)
  }
}

// ProcessResponse is sent by the server (Java) to the client (Go).
message ProcessResponse {
  oneof response {
    neokapi.content.v1.PartMessage part = 1; // Single part (legacy)
    ProcessReadDone read_done = 2;           // All parts have been read
    ProcessComplete complete = 3;            // Output written, cycle complete
    PartBatch part_batch = 4;                // Batched parts
    ContentBlockBatch content_batch = 5;     // Batched content blocks (lightweight, preferred)
  }
}

// InlineStep configures a pipeline step to run inside the Process RPC.
// When ProcessHeader.inline_steps is non-empty, the Java side pipes each
// filter event through the step chain before streaming results to Go.
// This eliminates Go↔Java round-trips for Okapi-native step processing.
message InlineStep {
  string step_class = 1;              // Fully-qualified Java class name
  map<string, string> step_params = 2; // Step parameters (key-value)
  map<string, string> param_types = 3; // Schema-derived types for correct Okapi suffixes
}

// ProcessHeader configures the Process RPC.
message ProcessHeader {
  string filter_class = 1;
  neokapi.content.v1.ContentRef input = 2; // Input document reference
  string source_locale = 3;
  string target_locale = 4;
  string encoding = 5;
  string mime_type = 6;
  map<string, string> filter_params = 7;
  OutputRef output = 8;             // Where to write output (optional; omit for read-only)
  string output_locale = 9;        // Locale for the output document
  repeated int32 subscribe_parts = 10; // Part types to stream to Go (empty = all).
                                       // Java only sends parts matching these types;
                                       // all other events are written directly without
                                       // crossing the gRPC boundary.
                                       // Values match PartMessage.part_type (e.g. 5 = Block).
  repeated InlineStep inline_steps = 11; // Optional steps to run between filter and writer.
                                          // Steps are applied in order to each filter event
                                          // before it is streamed to Go or written to output.
  string config_id = 12;             // Optional named Okapi filter configuration to apply
                                     // before opening (e.g. "okf_xmlstream-dita",
                                     // "okf_xml-docbook", "okf_xml-resx"). The bridge loads
                                     // the config's built-in parameters (.fprm) and applies
                                     // them; explicit filter_params override on top. Lets a
                                     // config-preset format (DITA/DocBook/ResX) run
                                     // head-to-head against its native xml-config preset.
}

// ProcessReadDone signals that all parts have been read from the document.
message ProcessReadDone {}

// ProcessComplete signals that the output has been written (or read-only is done).
message ProcessComplete {
  bytes output = 1;          // Inline output bytes (empty when OutputRef was used)
  string output_path = 2;   // Path where output was written
  string error = 3;
}

message ShutdownRequest {}
message ShutdownResponse {}

// ────────────────────────────────────────────────────────────────────────────
// ProcessStep RPC messages
// ────────────────────────────────────────────────────────────────────────────

// StepRequest is sent by the client (Go) to the server (Java) for step processing.
message StepRequest {
  oneof request {
    StepHeader header = 1;
    neokapi.content.v1.PartMessage part = 2;
  }
}

// StepHeader configures the ProcessStep RPC.
message StepHeader {
  string step_class = 1;              // Fully-qualified Java class name of the step
  map<string, string> step_params = 2; // Step parameters (key-value)
  string source_locale = 3;
  string target_locale = 4;
  string root_directory = 5;          // Project root for ${rootDir} resolution
  string input_root_directory = 6;    // Input root for ${inputRootDir} resolution
  map<string, string> param_types = 7; // Schema-derived types: {"regEx":"boolean","count":"integer"}
                                       // Used by Java to apply correct Okapi parameter suffixes
                                       // (.b for boolean, .i for integer, bare for string).
}

// StepResponse is sent by the server (Java) to the client (Go).
message StepResponse {
  oneof response {
    neokapi.content.v1.PartMessage part = 1;
    StepComplete complete = 2;
  }
}

// StepComplete signals that all parts have been processed by the step.
message StepComplete {
  int32 parts_processed = 1;
}

// ────────────────────────────────────────────────────────────────────────────
// Segment RPC messages
// ────────────────────────────────────────────────────────────────────────────

// SegmentRequest asks the daemon to segment one run of text.
message SegmentRequest {
  string engine = 1;               // segmenter name (capabilities.segmenters[].name)
  string text = 2;                 // flattened, code-masked text to segment
  string locale = 3;               // BCP-47 locale
  map<string, string> params = 4;  // engine-specific params (e.g. model, threshold)
}

// SegmentResponse returns the interior boundaries — ascending rune (code-point)
// offsets into SegmentRequest.text, excluding 0 and len(text).
message SegmentResponse {
  repeated int32 boundaries = 1;
  string error = 2;
}
