// connector.proto — Mode-C plugin daemon protocol (#438).
//
// Generic source-connector RPC schema used by kapi to dispatch
// push/pull/status/list against a plugin running as a Mode-C daemon
// (long-lived subprocess speaking gRPC over a local Unix socket).
//
// Lives in the framework module so cli/ and kapi/ can dial daemons
// without depending on any specific plugin (e.g., bowrain). Each Mode-C
// plugin implementing source connectors serves both services on its
// daemon socket; the kapi-side DaemonPool acquires the gRPC connection
// and a plugin-supplied dispatcher issues the RPC.

syntax = "proto3";

package neokapi.plugin.v1;

option go_package = "github.com/neokapi/neokapi/core/plugin/proto/v1;pluginv1";

// SourceConnectorService is the daemon-side gRPC service that backs
// `kapi push`, `kapi pull`, `kapi status`, and `kapi ls` when the
// bowrain plugin runs in Mode C.
//
// Every RPC carries a ProjectRef so the daemon can find (or open) the
// right .kapi project. The daemon caches projects by their root path.
service SourceConnectorService {
  // Status reports synchronization state (block counts, pending push/pull,
  // last sync). Equivalent to bowrainconn.SourceConnector.Status.
  rpc Status(StatusRequest) returns (StatusResponse);

  // ListFiles returns per-file stats (path, format, block count, dirty
  // count). Equivalent to BowrainSourceConnector.ListFiles.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // Push uploads local changes to the Bowrain server. Equivalent to
  // bowrainconn.SourceConnector.Push.
  rpc Push(PushRequest) returns (PushResponse);

  // Pull downloads translated content from the Bowrain server.
  // Equivalent to bowrainconn.SourceConnector.Pull.
  rpc Pull(PullRequest) returns (PullResponse);
}

// DaemonControlService exposes lifecycle RPCs every Mode-C daemon must
// implement. Used by the kapi-side DaemonPool.
service DaemonControlService {
  // Health is a lightweight ping. The pool uses this to verify the
  // daemon is still alive after spawn and before reuse.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Shutdown asks the daemon to exit gracefully. The daemon should
  // finish in-flight RPCs, save state, then return and exit.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// ---------------------------------------------------------------------------
// Project reference
// ---------------------------------------------------------------------------

// ProjectRef identifies the .kapi project the daemon should operate on.
// Currently we pass the absolute project root; the daemon discovers and
// loads the recipe from there, just like the in-process connector did.
message ProjectRef {
  // Root is the absolute path to the project directory (the dir
  // containing <name>.kapi).
  string root = 1;
}

// ---------------------------------------------------------------------------
// Status
// ---------------------------------------------------------------------------

message StatusRequest {
  ProjectRef project = 1;
}

message StatusResponse {
  string connector_id = 1;
  // last_sync as RFC3339 string ("" when never synced).
  string last_sync = 2;
  int32 item_count = 3;
  int32 file_count = 4;
  int32 word_count = 5;
  int32 pending_pull = 6;
  int32 pending_push = 7;
  repeated string errors = 8;
}

// ---------------------------------------------------------------------------
// ListFiles
// ---------------------------------------------------------------------------

message ListFilesRequest {
  ProjectRef project = 1;
  // Optional path filters; empty = all tracked files.
  repeated string paths = 2;
}

message FileEntry {
  string path = 1;
  string format = 2;
  int32 block_count = 3;
  int32 word_count = 4;
  int32 dirty_count = 5;
}

message ListFilesResponse {
  repeated FileEntry files = 1;
}

// ---------------------------------------------------------------------------
// Push
// ---------------------------------------------------------------------------

message PushRequest {
  ProjectRef project = 1;
  repeated string paths = 2;
  bool force = 3;
  bool dry_run = 4;
}

message PushResponse {
  int32 blocks_pushed = 1;
  int32 assets_pushed = 2;
  int32 files_scanned = 3;
  int32 chunk_count = 4;
  int32 word_count = 5;
  string push_id = 6;
  // Blocks actually uploaded after diff negotiation. blocks_pushed counts the
  // locally-changed candidates; the two disagreeing loudly is the point.
  int32 blocks_uploaded = 7;

  // The terminology fold. It travels with the push on both routes; these fields
  // are what it amounted to, so `kapi push` can say that governed edits are now
  // a change-set awaiting review instead of leaving the user to find out from
  // the web hub.
  int32 concepts_applied = 8;
  int32 concept_relations_applied = 9;
  int32 concepts_proposed = 10;
  string changeset_url = 11;

  // Media assets the push tried and failed to upload, with a bounded sample of
  // the reasons. Carried separately from assets_pushed because a push whose
  // every image was refused and a push with no images both report zero pushed.
  int32 assets_failed = 12;
  repeated string asset_errors = 13;

  // What the SERVER did with the upload — "applied", "queued", "unknown" — as
  // opposed to what the client sent it. The commit is answered with 202 and the
  // content is stored by a worker afterwards, so "uploaded" is not "stored".
  // A failed ingest is never reported here: it is an RPC error.
  string ingest = 14;

  // The change-set the governed terminology edits are waiting in, alongside the
  // review URL above.
  string changeset_id = 15;

  // Set when the content transport succeeded and the terminology fold did not.
  // It rides on the response rather than replacing it with an RPC error so the
  // content result is not lost; the dispatcher prints the push, then fails.
  string terminology_error = 16;
}

// ---------------------------------------------------------------------------
// Pull
// ---------------------------------------------------------------------------

message PullRequest {
  ProjectRef project = 1;
  repeated string locales = 2;
  bool force = 3;
  bool dry_run = 4;
}

message PullResponse {
  int32 blocks_pulled = 1;
  int32 files_written = 2;
  int32 locales_count = 3;
  // Server-ledger decisions the pull staged into the working store —
  // reported so an arriving decision is never invisible; `kapi commit`
  // publishes them into the tracked record.
  int32 decisions_staged = 4;

  // Decisions the pull could not stage because their variant did not parse.
  // Named rather than dropped: the server's cursor is forward-only, so a
  // decision skipped here is not offered again.
  int32 decisions_skipped = 5;

  // The workspace terminology snapshot this pull took. `kapi pull` over the
  // daemon used to take none at all — only the plugin's own cobra command did —
  // so the offline term checks ran against whatever the last cobra pull left.
  int32 concepts_pulled = 6;
  int32 concept_relations_pulled = 7;

  // The context content type's pull half: how many collections the server
  // reported, and which recipe-owned ones it governs differently. Observed,
  // never applied — kapi.yaml stays the authority.
  int32 collections_observed = 8;
  repeated string governance_diverged = 9;

  // Set when the content transport succeeded and the terminology fold did not.
  // Same reason as the push's: the pulled files are already on disk and the
  // cursor already advanced, so replacing the result with an error would hide
  // what did arrive.
  string terminology_error = 10;
}

// ---------------------------------------------------------------------------
// Daemon control
// ---------------------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string version = 1;
  // uptime in seconds since the daemon started.
  int64 uptime_seconds = 2;
}

message ShutdownRequest {
  // grace_seconds bounds how long the daemon may wait for in-flight RPCs.
  int32 grace_seconds = 1;
}

message ShutdownResponse {}
