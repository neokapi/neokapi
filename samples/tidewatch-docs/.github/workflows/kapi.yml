# The CI leg: converge on every push to the default branch, report coverage on
# every pull request, and never fail a build because a target language is behind.
#
# The two actions are consumed as published, not vendored: `setup-kapi` installs
# and caches the CLI, `kapi-action` runs one kapi command and reports what it
# found. A runner starts with an empty context store, so every job reads the
# committed context/ files in and pulls what earlier runs pushed to the
# repository's context ref (kapi.yaml declares `context: backend: git`).
name: kapi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  # On a pull request: report, never write. `plan: true` is a dry run: it says
  # what is pending, how much of it recycles from the content memory, and what
  # the remainder would cost, and posts that on the PR as one sticky comment.
  # A pull request from a fork can pull the context and cannot push it.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: neokapi/setup-kapi@v1
        with:
          version: "1.3.0"
          plugins: ""
      - run: kapi context import ./context && kapi context pull
      - uses: neokapi/kapi-action@v1
        with:
          command: up
          plan: true
          pr-comment: true

      # Coverage, per language, as a job summary. `kapi status --json` is the
      # dashboard in machine shape; this reduces it to one line per scope.
      - name: Report coverage
        run: |
          kapi status --json --jq '.locales[]
            | "\(.locale)  translated \(.pct.translated)%  established \(.pct.established)%  \(if .shippable then "ready" else "pending" end)"' \
            | tr -d '"' >> "$GITHUB_STEP_SUMMARY"

  # On the default branch: converge and share. The loop drafts what is missing
  # and records it in the project's context; the push shares that record on the
  # context ref, so the next run and every reviewer pull the same drafts rather
  # than paying a provider for them again. The i18n tree is gitignored and
  # rebuilt by whoever builds the site, so no branch receives a commit.
  #
  # fail-on-parked stays false, deliberately. Parked means work remains that the
  # loop could not carry to the ship gate, a language awaiting review most
  # often, and that is the ordinary state of a translated site, not a broken
  # build. Gate a release on coverage if you must; never gate a push.
  converge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: neokapi/setup-kapi@v1
        with:
          version: "1.3.0"
          plugins: ""
      - run: kapi context import ./context && kapi context pull
      - uses: neokapi/kapi-action@v1
        with:
          command: up
          fail-on-parked: false
      - run: kapi context push

  # The site build, and the point of the whole arrangement: it does not depend on
  # the job above. A language behind its source builds and serves; the source
  # locale is strict and the target locales warn.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: neokapi/setup-kapi@v1
        with:
          version: "1.3.0"
          plugins: ""
      - run: kapi context import ./context && kapi context pull
      - run: kapi up --materialize
      - run: npm ci && npm run build
