# KapiMart — one product, four surfaces, five languages.
#
# Everything this recipe binds is a file in this directory: the voice profile,
# the terms record and the content memory are all committed and reviewable, so
# the project opens with its governance already in place and no server or
# provider credential involved.
version: v1
name: KapiMart
defaults:
  source_language: en
  target_languages:
    - de
    - fr
    - ja
    - nb
    - ar
  # The house voice. Bound here as well as on the profile below, so the default
  # point is governed too rather than falling through to nothing.
  voice: .kapi/voice.yaml
  # The committed vocabulary record. `kapi apply` writes term decisions here and
  # recompiles them into .kapi/work/store.db, which is derived and gitignored.
  terms_source: .kapi/terms.json
  # The committed content memory, in the same relationship to the store: the
  # authored artifact `git diff` reviews, compiled into the store on open.
  memory_source: .kapi/memory/memory.json
  coordinates:
    # A declared axis. The structural axes (product, channel) are derived from a
    # collection's channel: and are never written here.
    brand: kapimart

profiles:
  kapimart:
    # The storefront's own surfaces. `reference` is a peer of `web` rather than
    # a part of it: an API page and a release note are a published record, and
    # the register that suits a walkthrough does not suit either.
    channels: [web, reference, store, legal, marketing]
    voice: .kapi/voice.yaml

collections:
  # Product documentation. The two historical surfaces — the API reference and
  # the release notes — sit at their own point, and are listed first because a
  # file takes the first item that matches it.
  - name: Website
    base: web
    channel: kapimart/web
    coordinates:
      mode: how-to
    content:
      - path: "en/api-reference.md"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/release-notes.md"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/**/*.md"
        target: "{lang}"

  # Storefront interface strings. The message catalogue sits with the reference
  # surfaces: it is looked up by key when something has gone wrong, not read
  # through, and it says the same thing to a buyer and to an integrator reading
  # the API. The storefront and the catalogue name the same objects, and where
  # they answer differently the content memory records both answers against the
  # point each was approved at. The catalogue is listed first: a file takes the
  # first item that matches it, so the glob below never sees it.
  - name: Online Store
    base: src
    channel: kapimart/store
    content:
      - path: "en/error-messages.properties"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/*.{json,yaml,properties,html}"
        target: "{lang}"

  # Contracts and price schedules: binding text, changed only on purpose.
  - name: Contracts
    base: legal
    channel: kapimart/legal
    content:
      - path: "en/*.{docx,xlsx}"
        target: "{lang}"

  # Campaign and onboarding material.
  - name: Templates
    base: marketing
    channel: kapimart/marketing
    content:
      - path: "en/*.{pptx,docx}"
        target: "{lang}"

flows:
  translate:
    steps:
      - tool: translate
  translate-and-qa:
    steps:
      - tool: translate
      - tool: qa
  pseudo-translate:
    steps:
      - tool: pseudo-translate
