version: v1
name: KapiMart
defaults:
  source_language: en
  target_languages:
    - de
    - fr
    - ja
    - nb
    - ar
content:
  # Natural per-area layout: each area keeps its source under <area>/en/, and
  # localized files land beside it under sibling locale dirs (<area>/{lang}/) —
  # e.g. web/en/getting-started.md → web/de/getting-started.md. Format is
  # auto-detected per file.
  - name: Website
    base: web/en
    items:
      - path: "web/en/**/*.md"
        target: "web/{lang}"
  - name: Online Store
    base: src/en
    items:
      - path: "src/en/*.{json,yaml,properties,html}"
        target: "src/{lang}"
  - name: Contracts
    base: legal/en
    items:
      - path: "legal/en/*.{docx,xlsx}"
        target: "legal/{lang}"
  - name: Templates
    base: marketing/en
    items:
      - path: "marketing/en/*.{pptx,docx}"
        target: "marketing/{lang}"
flows:
  translate:
    steps:
      - tool: translate
  translate-and-qa:
    steps:
      - tool: translate
      - tool: qa
  pseudo-translate:
    steps:
      - tool: pseudo-translate
