# KapiMart — one product, four surfaces, five languages.
#
# The context this project runs on ships as files under context/: the voice
# profile, the vocabulary and the content memory. Scaffolding the sample reads
# them into this machine's workspace with `kapi store import context`, so
# the project opens governed with no server and no provider credential
# involved. The recipe binds the voice by the name the import stores it under.
version: v1
name: KapiMart
defaults:
  source_language: en
  target_languages:
    - de
    - fr
    - ja
    - nb
    - ar
  # The house voice. Bound here as well as on the profile below, so the default
  # point is governed too rather than falling through to nothing. The terms and
  # the content memory need no binding: the import reads them into the
  # project's own stores, which govern every point.
  voice: kapimart
  coordinates:
    # Declared axes. The structural axes (product, channel) are derived from a
    # collection's channel: and are never written here.
    brand: kapimart
    market: world
    audience: shoppers
    age: 13-
    lifecycle: current

# The places this project declares beside the built-in ones (the world, its
# regions, every country and every ISO 3166-2 subdivision). Each place sits
# within places or is made of places. A rule for Norway applies to the Oslo
# campaign because Oslo sits within the county of Oslo, which sits within
# Norway. `kapi context places <query>` looks a place id up.
places:
  nordics:
    name: Nordics
    of: [no, se, dk, fi, is]
  oslo:
    name: Oslo
    type: locality
    within: no-03
    centroid: [59.91, 10.75]
    refs: [wikidata:Q585, geonames:3143244]
  grunerlokka:
    name: Grünerløkka
    type: neighbourhood
    within: oslo
  greater-oslo:
    name: Greater Oslo
    type: metro
    of: [no-03, no-32]

# The kinds and values of the declared axes. kapi checks each axis when it
# loads the recipe. The kind determines whether a rule scoped to one value
# applies at another: a rule for the Nordic market holds in Norway, and a rule
# for readers aged 13 to 17 holds in content written for readers aged 14 to 16.
# An axis that is not listed here takes any value, matched exactly.
axes:
  market:
    kind: geo
    label: Market
  audience:
    label: Audience
    values: [shoppers, developers, partners]
  age:
    kind: range
    label: Reader age
    unit: years
  lifecycle:
    kind: ordered
    label: Lifecycle
    values: [preview, current, sunset]

profiles:
  kapimart:
    # The storefront's own surfaces. `reference` is a peer of `web` rather than
    # a part of it: an API page and a release note are a published record, and
    # the register that suits a walkthrough does not suit either.
    channels: [web, reference, store, legal, marketing]
    voice: kapimart

collections:
  # Product documentation. The two historical surfaces — the API reference and
  # the release notes — sit at their own point, and are listed first because a
  # file takes the first item that matches it.
  - name: Website
    base: web
    channel: kapimart/web
    coordinates:
      mode: how-to
      audience: developers
    content:
      - path: "en/api-reference.md"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/release-notes.md"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/**/*.md"
        target: "{lang}"

  # Storefront interface strings. The message catalogue sits with the reference
  # surfaces: it is looked up by key when something has gone wrong, not read
  # through, and it says the same thing to a buyer and to an integrator reading
  # the API. The storefront and the catalogue name the same objects, and where
  # they answer differently the content memory records both answers against the
  # point each was approved at. The catalogue is listed first: a file takes the
  # first item that matches it, so the glob below never sees it.
  - name: Online Store
    base: src
    channel: kapimart/store
    content:
      - path: "en/error-messages.properties"
        target: "{lang}"
        channel: kapimart/reference
      - path: "en/*.{json,yaml,properties,html}"
        target: "{lang}"

  # Contracts and price schedules: binding text, changed only on purpose.
  - name: Contracts
    base: legal
    channel: kapimart/legal
    coordinates:
      audience: partners
      age: 18-
    content:
      - path: "en/*.{docx,xlsx}"
        target: "{lang}"

  # Campaign and onboarding material.
  - name: Templates
    base: marketing
    channel: kapimart/marketing
    coordinates:
      lifecycle: preview
    content:
      - path: "en/*.{pptx,docx}"
        target: "{lang}"

  # A campaign for readers aged 13 to 17 in Oslo. The pick-up page is about one
  # neighbourhood, so its item sits at Grünerløkka, inside the campaign's Oslo.
  - name: Oslo youth campaign
    base: campaigns/oslo
    channel: kapimart/marketing
    coordinates:
      market: oslo
      age: 13-17
    content:
      - path: "en/grunerlokka.md"
        target: "{lang}"
        coordinates:
          market: grunerlokka
      - path: "en/*.md"
        target: "{lang}"

flows:
  translate:
    steps:
      - tool: translate
  translate-and-qa:
    steps:
      - tool: translate
      - tool: qa
  pseudo-translate:
    steps:
      - tool: pseudo-translate
