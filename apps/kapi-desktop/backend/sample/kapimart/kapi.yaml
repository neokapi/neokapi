version: v2
name: KapiMart
defaults:
  source_language: en
  target_languages:
    - de
    - fr
    - ja
    - nb
    - ar
collections:
  # Natural per-area layout: each area keeps its source under <area>/en/, and
  # localized files land beside it under sibling locale dirs (<area>/{lang}/) —
  # e.g. web/en/getting-started.md → web/de/getting-started.md. The collection's
  # base is the area directory, so its paths and targets are written relative to
  # it. Format is auto-detected per file.
  - name: Website
    base: web
    content:
      - path: "en/**/*.md"
        target: "{lang}"
  - name: Online Store
    base: src
    content:
      - path: "en/*.{json,yaml,properties,html}"
        target: "{lang}"
  - name: Contracts
    base: legal
    content:
      - path: "en/*.{docx,xlsx}"
        target: "{lang}"
  - name: Templates
    base: marketing
    content:
      - path: "en/*.{pptx,docx}"
        target: "{lang}"
flows:
  translate:
    steps:
      - tool: translate
  translate-and-qa:
    steps:
      - tool: translate
      - tool: qa
  pseudo-translate:
    steps:
      - tool: pseudo-translate
