# The voice for code comments in this repository: the comments of the Go,
# YAML, markup and plugin-language sources the recipe declares at
# source/comments. It holds comment style only. It carries no vocabulary and no
# terms store, because a comment names identifiers, standards and upstream
# projects that the documentation voice's vocabulary rules are not written for.
#
# The limits are the defaults, which a review of real comments in this
# repository set. `kapi voice guide <file>` prints them for a file whose
# comments sit here.
name: source comments
description: How a code comment in this repository reads.
tone:
  guidelines: >-
    A comment says what the code does and why, for the next person reading it.
    It describes the code as it is, never what it used to be, and leaves the
    history to git.
style:
  sentence_length: short
  comments:
    sentence_words: { minor: 50, major: 70 }
    comment_words: 100
    doc_words: 150
    package_doc_words: 300
    density: { ratio: 1, min_comment_lines: 8 }
  prohibited_patterns:
    - regex: "\u2014"
      description: An em dash; use a comma, a full stop or two sentences.
      severity: major
      scope: prose
    - regex: '(?i)\bused to\b'
      not_after: '(?i)(?:(?:\b(?:is|are|was|were|be|been|being|get|gets|got|isn''t|aren''t|wasn''t|weren''t)|[''’]s)\s+(?:\w+\s+)?|[^\w\s)\]"''\x60’”]\s*|(?:^|\s)["“‘''\x60]|^\s*)$'
      description: The past-habitual "used to"; describe what the code does.
      severity: major
      scope: prose
    - regex: "(?i)\\b(?:(?:is|are|was|were)\\s+not|isn't|aren't|wasn't|weren't)\\b[^.;!?]{1,80}?[,;:\u2014]\\s*(?:it|they|this|that)(?:\\s+is|\\s+are|\\s+was|\\s+were|'s)\\b"
      description: A negation reveal ("is not X, it is Y"); state what it is.
      severity: major
      scope: prose
    - regex: "(?i)\\b(?:crucially|importantly|load[- ]bearing|worth noting)\\b"
      description: A significance label; state the claim.
      severity: major
      scope: prose
    - regex: "(?i)\\bfor now\\b"
      description: Temporary or open work; describe what the code does, and track the work elsewhere.
      severity: major
      scope: prose
    - regex: "(?i)\\bhistorically\\b"
      description: History; describe the code as it is.
      severity: major
      scope: prose
