# Security response headers shared by the three bowrain SPA images.
#
# These are the values bowrain-server already sets on everything it serves
# (bowrain/server/security_headers.go) and the values the hosted CloudFront
# distributions set on the SPA document (modules/spa-site in the bowrain-infra
# repo). Self-hosting gets the same protections as the hosted deployment; when
# one of the three moves, all three move.
#
# The Content-Security-Policy is deliberately NOT here. It names what a
# particular app loads, and that differs per app, so each image states its own
# in the csp.conf it includes alongside this file.
#
# INCLUDE THIS IN EVERY location THAT SETS ANY add_header OF ITS OWN. nginx does
# not merge add_header down a level: a location carrying its own add_header
# discards every add_header inherited from the enclosing block. A server-level
# copy alone would therefore vanish from exactly the locations that set
# Cache-Control — index.html, the document, among them — and vanish silently.
#
# `always` extends each header to error responses rather than 2xx/3xx alone.

# Never let a response be reinterpreted as a type it did not declare.
add_header X-Content-Type-Options "nosniff" always;

# Nothing here is meant to be embedded. frame-ancestors in the policy says the
# same thing to modern browsers; this covers the rest.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; an off-origin destination sees the origin
# alone. Workspace and project identifiers live in our paths.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No page asks for these, so decline them rather than let an embedded document
# inherit the ability to ask.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Only meaningful over TLS, and asserting it on a plain-HTTP request would be
# noise — these containers listen on :80 behind a proxy that terminates TLS.
# $bowrain_hsts is empty unless that proxy forwarded X-Forwarded-Proto: https,
# and nginx omits an add_header whose value evaluates to the empty string; the
# enclosing nginx.conf defines the map. This mirrors the server, which keys the
# same decision off a scheme that honours X-Forwarded-Proto.
#
# includeSubDomains is off for the same reason it is off there: this image
# cannot know that every sibling host is HTTPS-only, and the header would bind
# them all. preload requires includeSubDomains, so it is off too.
add_header Strict-Transport-Security $bowrain_hsts always;
