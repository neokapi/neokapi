# HSTS only once the proxy in front of this container has terminated TLS. An
# empty value makes nginx skip the header entirely — see security-headers.conf.
map $http_x_forwarded_proto $bowrain_hsts {
    https   "max-age=31536000";
    default "";
}

# Origin of the admin identity provider, which the browser calls directly for
# OIDC discovery and the token exchange. This mirrors resolveIssuerUrl() in
# apps/ctrl/src/auth.ts: ctrl.<rest> derives auth.<rest>, and anything else
# falls back to the local Keycloak. csp.conf names it in connect-src, so an
# operator whose admin pool lives on some other hostname widens it here.
map $host $bowrain_admin_issuer_origin {
    ~^ctrl\.(?<bowrain_parent_domain>.+)$ "https://auth.$bowrain_parent_domain";
    default                               "http://localhost:8180";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers are included in every location rather than stated once
    # here: a location that sets any add_header of its own discards every
    # inherited one, so both locations below would otherwise be served without
    # them. See security-headers.conf.

    # Hashed assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }

    # index.html must not be cached — it references hashed asset filenames
    # that change on every build. Caching it causes stale JS/CSS references.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }
}
