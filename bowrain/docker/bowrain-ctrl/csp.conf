# Content Security Policy for the control plane.
#
# Same directives as the hosted CloudFront policy for ctrl.<domain>
# (modules/spa-site in the bowrain-infra repo).
#
# script-src stays strict — no 'unsafe-inline'. The control plane renders no
# document preview, so nothing inherits this policy into a srcdoc frame, and its
# built index.html carries no inline script of its own. Adding a preview to a
# ctrl route would break under this line without any visible error; the customer
# app's csp.conf explains what that costs and what to do about it.
#
# connect-src has to reach the admin identity provider: sign-in reads the
# issuer's discovery document and posts to its token endpoint from the browser,
# and the issuer is a different host. $bowrain_admin_issuer_origin mirrors the
# derivation the app itself performs in apps/ctrl/src/auth.ts — ctrl.<rest>
# becomes auth.<rest>, anything else falls back to the local Keycloak — so the
# policy follows the app rather than guessing. An operator fronting the admin
# pool with a provider at some other hostname must widen the map in nginx.conf.
#
# style-src carries 'unsafe-inline' because the shared UI primitives inject a
# <style> element at runtime to lock body scroll behind a dialog. A style cannot
# execute.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' $bowrain_admin_issuer_origin; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
