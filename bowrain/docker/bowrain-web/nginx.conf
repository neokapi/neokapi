# HSTS only once the proxy in front of this container has terminated TLS. An
# empty value makes nginx skip the header entirely — see security-headers.conf.
map $http_x_forwarded_proto $bowrain_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Security headers ───────────────────────────────────────────────────
    # Included in every location below rather than stated once here: a location
    # that sets any add_header of its own discards every inherited one, so the
    # two Cache-Control locations — index.html, the document, among them — would
    # otherwise be served with no security headers at all.

    # ── Hashed assets (Vite puts them in /assets/) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }

    # ── HTML must not be cached (so new deploys are picked up immediately) ─
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }
}
