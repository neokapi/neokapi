# Content Security Policy for the customer web application.
#
# Same directives as the hosted CloudFront policy for app.<domain>
# (modules/spa-site in the bowrain-infra repo); the sources are narrower because
# a self-hosted image is built without the analytics and error-reporting keys
# the hosted pipeline bakes in, so everything the app calls is same-origin. A
# self-hoster who rebuilds this image with VITE_POSTHOG_HOST or VITE_SENTRY_DSN
# set must add those origins to connect-src, and to script-src if the analytics
# host is not proxied through this origin.
#
# script-src carries 'unsafe-inline' because this app renders the editor's
# document preview. That preview is an iframe fed through srcdoc, and a srcdoc
# document inherits the embedder's policy — so the inline <script> the preview
# carries (core/editor/preview.go, which drives block selection, height
# reporting and live target updates) is governed by this line. Under a strict
# script-src the frame still loads and that script is blocked, which disables
# those interactions with nothing but a console message to show for it. The
# preview's sandbox attribute puts it in an opaque origin, so no host-source
# could match it either; only 'unsafe-inline', a nonce or a hash will serve, and
# a static config file cannot mint a per-response nonce.
#
# style-src carries it because the shared UI primitives inject a <style> element
# at runtime to lock body scroll behind a dialog. A style cannot execute.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
