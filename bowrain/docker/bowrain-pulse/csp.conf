# Content Security Policy for the Pulse dashboard.
#
# The strictest of the three, because Pulse asks for the least: every call in
# apps/pulse/src/api.ts is same-origin, it runs no sign-in flow, and it renders
# no document preview, so script-src and connect-src both stop at 'self'. A
# build that sets VITE_POSTHOG_KEY would need the analytics host added to
# script-src and connect-src; the image is built without it.
#
# style-src carries 'unsafe-inline' because the shared UI primitives inject a
# <style> element at runtime to lock body scroll behind a dialog. A style cannot
# execute.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
