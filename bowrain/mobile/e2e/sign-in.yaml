# Sign in to the local stack through Keycloak, from a clean install.
#
#   make -C bowrain stack-up-e2e
#   maestro test e2e/sign-in.yaml
#
# The local "bowrain" realm signs in with passkeys only. `stack-up-e2e` turns on
# password sign-in for that realm and seeds the test user
# e2e-reviewer@example.com / e2e-password, which this flow uses unless
# USERNAME and PASSWORD are passed with -e. SERVER_URL defaults to
# http://localhost:8080 (http://10.0.2.2:8080 on the Android emulator).
#
# Runs against a development build on a simulator and the real local stack;
# nothing here is mocked.
appId: cloud.bowrain.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: sign-in
- tapOn:
    id: server-url
- eraseText
- inputText: ${SERVER_URL || 'http://localhost:8080'}
- tapOn:
    id: sign-in
# iOS asks before the app opens a browser sign-in session.
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible:
      id: username
    timeout: 20000
- tapOn:
    id: username
- inputText: ${USERNAME || 'e2e-reviewer@example.com'}
- tapOn:
    id: password
- inputText: ${PASSWORD || 'e2e-password'}
- tapOn:
    id: kc-login
- extendedWaitUntil:
    visible:
      id: sign-out
    timeout: 20000
