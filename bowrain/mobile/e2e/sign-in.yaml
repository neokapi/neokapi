# Sign in to the local stack through Keycloak, from a clean install of the
# development build. The full set, from bowrain/mobile:
#
#   make -C bowrain stack-up-e2e
#   EXPO_PUBLIC_BOWRAIN_SERVER_URL=http://localhost:8080 vpr start
#   maestro test $(node e2e/seed.mjs) e2e/
#
# The local "bowrain" realm signs in with passkeys only. `stack-up-e2e` turns on
# password sign-in for that realm and seeds the test user
# e2e-reviewer@example.com / e2e-password, which this flow uses unless
# USERNAME and PASSWORD are passed with -e. SERVER_URL defaults to
# http://localhost:8080 (http://10.0.2.2:8080 on the Android emulator) and is
# entered in the server sheet behind the cog, under "Specify a different
# server". On iOS the sign-in session is ephemeral, so iOS asks no question
# before it opens. Maestro reads the Keycloak page by its labels: the page's
# element ids do not reach the accessibility tree.
#
# Runs against a development build on a simulator and the real local stack;
# nothing here is mocked.
appId: cloud.bowrain.app
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: server-settings
- tapOn:
    id: server-option-custom
- tapOn:
    id: server-url
- eraseText
- inputText: ${SERVER_URL || 'http://localhost:8080'}
- tapOn:
    id: server-save
- tapOn:
    id: sign-in
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Email"
- inputText: ${USERNAME || 'e2e-reviewer@example.com'}
- tapOn: "Password"
- inputText: ${PASSWORD || 'e2e-password'}
- tapOn: "Sign In"
- extendedWaitUntil:
    visible:
      id: workspace-list
    timeout: 30000
