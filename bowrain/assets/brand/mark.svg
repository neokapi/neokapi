<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- The bowrain mark — CANONICAL SOURCE.
       A perfect quarter-circle rainbow: quarter annulus, square-cut ends
       (no rounded corners), spectrum gradient along the band.
       Interim geometry (Asgeir will supply the final vector); every derived
       asset regenerates from this file via
       scripts/generate-bowrain-brand-assets.sh — replace this file and re-run. -->
  <defs>
    <linearGradient id="bow" x1="6" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4737d"/>
      <stop offset="0.3" stop-color="#d9b34a"/>
      <stop offset="0.55" stop-color="#5cab7d"/>
      <stop offset="0.8" stop-color="#4f8bd6"/>
      <stop offset="1" stop-color="#9a71d0"/>
    </linearGradient>
  </defs>
  <path d="M6 6 A52 52 0 0 1 58 58 L38 58 A32 32 0 0 0 6 26 Z" fill="url(#bow)"/>
